{short:`φ = ${N(r)} / ${N(r0)} · 100 % ≈ ${N(rd(r/r0*100,0))} %.`,
explain:`1) По таблице при ${t} °С: ρ₀ = ${N(r0)} г/м³.<br>2) φ = ρ / ρ₀ · 100 % = ${N(r)} / ${N(r0)} · 100 % ≈ <b>${N(rd(r/r0*100,0))} %</b>.`,
explain2:`При ${t} °С в 1 м³ воздуха может быть не больше ${N(r0)} г пара, а есть ${N(r)} г. Это ${N(r)} : ${N(r0)} ≈ ${N(rd(r/r0,2))} — примерно ${N(rd(r/r0*100,0))} % от максимума.`});});
G(4,()=>{const t=pick([15,20,25,30]);const r0=RHO0[t];const phi=pick([30,40,50,60,80]);const V=pick([30,50,60,75]);const mp=r0*phi/100*V;
return NUM(`В комнате объёмом ${V} м³ температура ${t} °С, относительная влажность ${phi} %. Сколько граммов водяного пара в воздухе комнаты? ρ₀ при ${t} °С = ${N(r0)} г/м³.`,mp,0,
{short:`ρ = ${phi} % · ${N(r0)} = ${N(rd(r0*phi/100,3))} г/м³; m = ${N(rd(r0*phi/100,3))} · ${V} ≈ ${N(rd(mp,0))} г.`,
explain:`1) Абсолютная влажность: ρ = φ · ρ₀ = ${N(phi/100)} · ${N(r0)} = ${N(rd(r0*phi/100,3))} г/м³.<br>2) Масса пара: m = ρ · V = ${N(rd(r0*phi/100,3))} · ${V} ≈ <b>${N(rd(mp,0))} г</b>.`,
explain2:`В каждом кубометре может поместиться ${N(r0)} г пара, а заполнено ${phi} % — ${N(rd(r0*phi/100,3))} г. Кубометров ${V}: ${N(rd(r0*phi/100,3))} · ${V} ≈ ${N(rd(mp,0))} г — это примерно ${N(rd(mp/1000,2))} л воды!`});});
G(4,()=>{const t=pick([20,25,30]);const r0=RHO0[t];const night=pick([0,5,10,15]);const rho=pick([5.5,7.5,10.5,12,14,16]);if(rho>r0)return null;const dew=rho>=RHO0[night];
const opts=['Да, выпадет','Нет, не выпадет'];
return {type:'choice',q:`Днём при ${t} °С абсолютная влажность ${N(rho)} г/м³. Ночью воздух остынет до ${night} °С. Выпадет ли роса? Таблица:${RT}`,opts,ans:dew?0:1,
short:`При ${night} °С ρ₀ = ${N(RHO0[night])} г/м³ ${dew?'≤':'>'} ${N(rho)} г/м³ — роса ${dew?'выпадет':'не выпадет'}.`,
explain:`Роса выпадает, если воздух не может удержать весь пар: ρ ≥ ρ₀ при новой температуре.<br>При ${night} °С: ρ₀ = ${N(RHO0[night])} г/м³. Пара в воздухе ${N(rho)} г/м³.<br>${dew?`${N(rho)} ≥ ${N(RHO0[night])} — пар станет насыщенным, лишнее выпадет: <b>роса будет</b>.`:`${N(rho)} < ${N(RHO0[night])} — пар ещё не насыщенный: <b>росы не будет</b>.`}`,
explain2:`Губка-аналогия: ночью «губка» воздуха сжимается до ${N(RHO0[night])} г на кубометр. Если в ней ${N(rho)} г пара, ${dew?'всё не поместится — вода выжмется росой':'всё помещается — капать нечему'}.`};});

/* L5 — весь путь */
RULE(5,'Лёд при −10 °С превращают в пар при 100 °С. Какой порядок этапов верный?','Нагрев льда → плавление → нагрев воды → кипение',['Плавление → нагрев льда → кипение → нагрев воды','Нагрев льда → нагрев воды → плавление → кипение','Плавление → кипение'],
{short:'Каждый раз сначала догреваем до точки перехода, потом переход.',
explain:'Лёд при −10 °С не может сразу таять — сначала его нужно нагреть до 0 °С (c<sub>л</sub>mΔt). Потом он тает при 0 °С (λm). Потом вода нагревается до 100 °С (c<sub>в</sub>mΔt). И наконец кипит при 100 °С (Lm). На графике: наклон, полочка, наклон, полочка.',

G(5,()=>{const m=pick([0.5,1,2]);const ti=pick([10,20,30]);const tw=pick([20,30,50]);const Q1=C_I*m*ti,Q2=LAM*m,Q3=C_W*m*tw;const Q=Q1+Q2+Q3;

{hint:'Три этапа: нагрев льда до 0 °С, плавление, нагрев воды.',short:`${N(Q1/1000)} + ${N(Q2/1000)} + ${N(Q3/1000)} = ${N(Q/1000)} кДж.`,
explain:`1) Лёд от −${ti} до 0 °С: Q₁ = 2100 · ${N(m)} · ${ti} = ${NN(Q1)} Дж.<br>2) Плавление: Q₂ = 340&nbsp;000 · ${N(m)} = ${NN(Q2)} Дж.<br>3) Вода от 0 до ${tw} °С: Q₃ = 4200 · ${N(m)} · ${tw} = ${NN(Q3)} Дж.<br>Q = ${NN(Q)} Дж = <b>${N(Q/1000)} кДж</b>.<br>Типичная ошибка — взять для льда 4200: c<sub>льда</sub> = 2100.`,
explain2:`В кДж по этапам: ${N(Q1/1000)} (нагрев льда) + ${N(Q2/1000)} (плавление) + ${N(Q3/1000)} (нагрев воды) = ${N(Q/1000)}. Видно, что плавление — самая «дорогая» часть.`});});
G(5,()=>{const m=pick([0.2,0.5,1]);const t=pick([0,10,20,40]);const Q1=C_W*m*(100-t),Q2=L_W*m;const f=Q2/(Q1+Q2)*100;
return NUM(`Воду массой ${N(m)} кг при ${t} °С нагрели и полностью превратили в пар. Какая доля (в %) всей затраченной энергии ушла именно на парообразование? c<sub>воды</sub> = 4200 ${U}, L = 2,3·10⁶ Дж/кг.`,f,0,
{short:`${NN(Q2)} / ${NN(Q1+Q2)} · 100 % ≈ ${N(rd(f,0))} %.`,
explain:`Нагрев: Q₁ = 4200 · ${N(m)} · ${100-t} = ${NN(Q1)} Дж. Пар: Q₂ = 2&nbsp;300&nbsp;000 · ${N(m)} = ${NN(Q2)} Дж.<br>Доля: Q₂ / (Q₁ + Q₂) · 100 % = ${NN(Q2)} / ${NN(Q1+Q2)} · 100 % ≈ <b>${N(rd(f,0))} %</b>.<br>Масса, кстати, не важна — она сокращается.`,
explain2:`Посчитай на 1 кг: нагрев ${N(4.2*(100-t))} кДж, пар 2300 кДж. Доля пара: 2300 / ${N(rd(2300+4.2*(100-t),1))} ≈ ${N(rd(f,0))} %. Масса одинаково умножает обе части и сокращается.`});});
G(5,()=>{const m=pick([0.5,1,2]);const ti=pick([5,10,20]);
const P=[[0,-ti],[2,0],[6,0],[10,100],[16,100]];const segs=['AB','BC','CD','DE'];const k=pick([0,1,2,3]);const names=['нагрев льда','плавление льда','нагрев воды','кипение воды'];
const Qs=[C_I*m*ti,LAM*m,C_W*m*100,L_W*m];const forms=[`2100 · ${N(m)} · ${ti}`,`340&nbsp;000 · ${N(m)}`,`4200 · ${N(m)} · 100`,`2&nbsp;300&nbsp;000 · ${N(m)}`];
return NUM(`На графике — нагревание ${N(m)} кг льда, взятого при −${ti} °С. Сколько энергии получило вещество на участке <b>${segs[k]}</b>? c<sub>льда</sub> = 2100, c<sub>воды</sub> = 4200 ${U}, λ = 3,4·10⁵ Дж/кг, L = 2,3·10⁶ Дж/кг. Ответ в кДж.`,Qs[k]/1000,1,
{pic:pgraph(P,{labels:['A','B','C','D','E'],yt:[0,100],xt:[],ymin:-ti,ymax:100,xmax:17}),short:`${segs[k]} — ${names[k]}: ${forms[k]} = ${NN(Qs[k])} Дж.`,
explain:`Участки: AB — нагрев льда до 0 °С, BC — плавление (полочка при 0 °С), CD — нагрев воды до 100 °С, DE — кипение (полочка при 100 °С).<br>${segs[k]} — <b>${names[k]}</b>: Q = ${forms[k]} = ${NN(Qs[k])} Дж = <b>${N(Qs[k]/1000)} кДж</b>.`,

{hint:eta===100?'q·m = c·m·Δt':'η·q·m = c·m·Δt',short:`m = ${NN(Qw)} / (${eta===100?'':N(eta/100)+' · '}${f.s}) ≈ ${N(rd(mf*1000,1))} г.`,
