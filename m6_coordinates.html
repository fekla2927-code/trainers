<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">

  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;

  (c.pts||[]).forEach(p=>{const x=X(p.x),y=Y(p.y);g+=`<circle cx="${f(x)}" cy="${f(y)}" r="${p.r||4}" fill="${p.col||'var(--accent)'}" stroke="var(--card)" stroke-width="1.2"/>`;
    if(p.l){const fz=p.fs||13;const cands=[[6,-6,'start'],[-6,-6,'end'],[6,15,'start'],[-6,15,'end'],[0,-9,'middle'],[0,19,'middle'],[9,4,'start'],[-9,4,'end']];let ok=null;
      for(const cd of cands){const b=box(x+cd[0],y+cd[1],p.l,cd[2],fz);if(inside(b)&&!occ.some(q=>hit(q,b))){ok=[cd,b];break;}}
      if(!ok){const cd=cands[0];ok=[cd,box(x+cd[0],y+cd[1],p.l,cd[2],fz)];}

  return g+lab+'</svg>';
}

function chart(c){
  const W=c.w||320,Hh=c.h||210,L=c.noNums?18:40,Rr=c.noNums?20:34,T=20,B=c.noNums?18:32;
  const xr=c.xr,yr=c.yr,X=x=>L+(x-xr[0])/(xr[1]-xr[0])*(W-L-Rr),Y=y=>T+(yr[1]-y)/(yr[1]-yr[0])*(Hh-T-B),f=v=>v.toFixed(1);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" width="${W}" role="img" aria-label="График" style="font-family:system-ui,sans-serif"><rect x="0.5" y="0.5" width="${W-1}" height="${Hh-1}" rx="10" fill="var(--card)" stroke="var(--line)"/>`;
  if(!c.noNums){for(let x=xr[0];x<=xr[1]+1e-9;x+=c.xs)s+=`<line x1="${f(X(x))}" y1="${f(Y(yr[0]))}" x2="${f(X(x))}" y2="${f(Y(yr[1]))}" stroke="var(--line)"/>`;
    for(let y=yr[0];y<=yr[1]+1e-9;y+=c.ys)s+=`<line x1="${f(X(xr[0]))}" y1="${f(Y(y))}" x2="${f(X(xr[1]))}" y2="${f(Y(y))}" stroke="var(--line)"/>`;
    for(let x=xr[0];x<=xr[1]+1e-9;x+=c.xs*(c.xlab||1))s+=`<text x="${f(X(x))}" y="${f(Y(yr[0])+14)}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${N(x)}</text>`;
    for(let y=yr[0];y<=yr[1]+1e-9;y+=c.ys*(c.ylab||1))s+=`<text x="${f(X(xr[0])-5)}" y="${f(Y(y)+3.5)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${N(y)}</text>`;}
  const y0=yr[0]<=0&&yr[1]>=0?0:yr[0];
  s+=`<line x1="${f(X(xr[0]))}" y1="${f(Y(y0))}" x2="${f(X(xr[1])+8)}" y2="${f(Y(y0))}" stroke="var(--fig)" stroke-width="1.5"/><polygon points="${f(X(xr[1])+12)},${f(Y(y0))} ${f(X(xr[1])+4)},${f(Y(y0)-4)} ${f(X(xr[1])+4)},${f(Y(y0)+4)}" fill="var(--fig)"/>`;
  s+=`<line x1="${f(X(xr[0]))}" y1="${f(Y(yr[0]))}" x2="${f(X(xr[0]))}" y2="${f(Y(yr[1])-8)}" stroke="var(--fig)" stroke-width="1.5"/><polygon points="${f(X(xr[0]))},${f(Y(yr[1])-12)} ${f(X(xr[0])-4)},${f(Y(yr[1])-4)} ${f(X(xr[0])+4)},${f(Y(yr[1])-4)}" fill="var(--fig)"/>`;
  s+=`<text x="${f(X(xr[0])+7)}" y="${f(Y(yr[1])-3)}" font-size="12" font-weight="700" fill="var(--ink)">${c.yl}</text><text x="${f(X(xr[1])+(c.noNums?14:9))}" y="${f(Y(y0)+(c.noNums?-6:15))}" text-anchor="${c.noNums?'end':'start'}" font-size="12" font-weight="700" fill="var(--ink)">${c.xl}</text>`;
  s+=`<polyline points="${c.pts.map(p=>f(X(p[0]))+','+f(Y(p[1]))).join(' ')}" fill="none" stroke="${c.col||'var(--accent)'}" stroke-width="2.6" stroke-linejoin="round"/>`;
  if(c.dots!==false)c.pts.forEach(p=>{s+=`<circle cx="${f(X(p[0]))}" cy="${f(Y(p[1]))}" r="3" fill="${c.col||'var(--accent)'}"/>`;});
  return s+'</svg>';
}

{title:'★ Хитрости сетки',lvl:8,html:`
<div class="box rule"><b>Сдвиг (параллельный перенос)</b>Сдвинуть точку на a вправо и b вверх — значит прибавить: ${M('(x; y) → (x + a; y + b)')}. Влево и вниз — вычесть.</div>
<div class="box ex"><b>Четвёртая вершина параллелограмма ABCD</b>Из B в C — какой-то сдвиг. Из A в D — <b>такой же</b> сдвиг (противоположные стороны равны и параллельны). Значит, ${M('D = A + (C − B)')}.<br>A(1; 1), B(2; 4), C(6; 4): сдвиг B→C = (4; 0), D = (1 + 4; 1 + 0) = (5; 1).</div>
<div class="box ex"><b>Шахматный король</b>Король ходит на 1 клетку в любую сторону, в том числе по диагонали. Из (0; 0) в (5; 2) — сколько ходов? Каждый диагональный ход сокращает обе разности сразу: 2 хода по диагонали + 3 вправо = 5 ходов. Правило: <b>большая из разностей</b> |Δx| и |Δy|.</div>
<div class="fact">Расстояние «по-королевски» математики так и называют — расстояние Чебышёва, в честь русского математика Пафнутия Чебышёва. А расстояние «по клеточкам» без диагоналей — «манхэттенское», как прогулка по улицам Нью-Йорка.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>${M('A(x; y)')}: сначала x (вправо/влево), потом y (вверх/вниз).</li>
<li>Четверти против часовой: I (+; +), II (−; +), III (−; −), IV (+; −).</li>
<li>На оси Ox: y = 0. На оси Oy: x = 0.</li>
<li>Симметрия: Ox → (x; −y), Oy → (−x; y), O → (−x; −y).</li>
<li>${M('x = a')} — вертикальная прямая, ${M('y = b')} — горизонтальная.</li>
<li>⊥ — 90°, ∥ — не пересекаются; на клетках — «ступеньки».</li>
<li>График: горизонтальный участок — величина не меняется.</li></ul>`}
];

const symbols={tab:'Правила',title:'Знаки и правила',rows:[
['A(x; y)','«Точка A с координатами x и y»','x — абсцисса (по горизонтали), y — ордината (по вертикали).',M('A(3; −2)')],
['Ox, Oy','Оси абсцисс и ординат','Ox — горизонтальная, Oy — вертикальная.','O(0; 0) — начало'],
['I, II, III, IV','Координатные четверти','Нумеруются против часовой стрелки с правой верхней.','(−2; 5) — во II'],
['(x; −y)','Симметрия относительно Ox','Меняется знак ординаты.',M('(3; 4) → (3; −4)')],
['(−x; y)','Симметрия относительно Oy','Меняется знак абсциссы.',M('(3; 4) → (−3; 4)')],
['(−x; −y)','Симметрия относительно O','Меняются оба знака.',M('(3; 4) → (−3; −4)')],
['x = a','Вертикальная прямая','Все точки с абсциссой a.',M('x = 2')],
['y = b','Горизонтальная прямая','Все точки с ординатой b.',M('y = −1')],
['⊥','«Перпендикулярно»','Прямые пересекаются под углом 90°.','Ox ⊥ Oy'],
['∥','«Параллельно»','Прямые не пересекаются.','x = 1 ∥ x = 4']
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Порядок в скобках: сначала x, потом y — «по коридору, потом на лифте».</div>`};

/* ================= GENERATORS ================= */
const LET=['A','B','C','D','E','K','M','N','P'];
const rp=(lo,hi)=>{for(;;){const x=nz(lo,hi),y=nz(lo,hi);if(x!==y&&x!==-y)return [x,y];}};
/* ===== L0 ===== */
G(0,()=>CH('Как записывают координаты точки A?','A(x; y): сначала абсцисса x (по горизонтали), потом ордината y (по вертикали)',
 ['A(y; x): сначала по вертикали, потом по горизонтали','A(x + y): сумма двух чисел','A(x; y): x — по вертикали, y — по горизонтали'],
 {short:'Сначала x («по коридору»), потом y («на лифте»).',explain:`Координаты пишут в скобках через точку с запятой: ${M('A(x; y)')}. Первое число — <b>абсцисса</b>, сдвиг по горизонтали; второе — <b>ордината</b>, сдвиг по вертикали. ${M('(3; 2)')} и ${M('(2; 3)')} — разные точки!`,
 explain2:'Представь, что ты в большом доме: сначала идёшь по коридору (вправо/влево — это x), потом едешь на лифте (вверх/вниз — это y). Порядок всегда такой.'}),{rule:true});
G(0,()=>CH('Как называются оси координат?','Горизонтальная Ox — ось абсцисс, вертикальная Oy — ось ординат',['Горизонтальная — ось ординат, вертикальная — ось абсцисс','Обе называются осями абсцисс','Горизонтальная — ось O, вертикальная — ось x'],
 {short:'Ox — абсцисс (горизонтальная), Oy — ординат (вертикальная).',explain:`<b>Ox</b> — горизонтальная ось, ось <b>абсцисс</b>; на ней откладывают x. <b>Oy</b> — вертикальная, ось <b>ординат</b>; на ней откладывают y. Точка O — начало координат.`,
 explain2:'По алфавиту: «абсцисса» раньше «ординаты», x раньше y, и в записи (x; y) абсцисса стоит первой. Горизонталь — первая.'}),{rule:true});
G(0,()=>{let x,y;if(Math.random()<0.2){if(Math.random()<0.5){x=0;y=nz(-9,9);}else{x=nz(-9,9);y=0;}}else{x=nz(-9,9);y=nz(-9,9);}
 const q=quarter(x,y);const opts=['I','II','III','IV','Лежит на оси'];const ans=q<0?4:q;
 return {type:'choice',q:`В какой четверти лежит точка ${M('M'+P(x,y))}?`,opts,ans,
 short:q<0?`Одна координата равна 0 — точка на оси ${x===0?'Oy':'Ox'}.`:`Знаки (${x>0?'+':'−'}; ${y>0?'+':'−'}) — ${QN[q]} четверть.`,
 explain:q<0?`У точки ${x===0?'абсцисса':'ордината'} равна 0, значит она лежит <b>на оси ${x===0?'Oy':'Ox'}</b>. Точки на осях не принадлежат ни одной четверти.`:`Смотрим на знаки: x = ${N(x)} — ${x>0?'плюс, точка правее Oy':'минус, точка левее Oy'}; y = ${N(y)} — ${y>0?'плюс, выше Ox':'минус, ниже Ox'}.<br>Знаки (${x>0?'+':'−'}; ${y>0?'+':'−'}) — это <b>${QN[q]} четверть</b>.<div class="box rule"><b>Правило</b>I (+; +), II (−; +), III (−; −), IV (+; −).</div>`,
 explain2:`Найди точку на картинке: ${x>=0?x+' вправо':(-x)+' влево'}, ${y>=0?y+' вверх':(-y)+' вниз'}.<div class="fig">${grid({xr:[-10,10],yr:[-10,10],w:260,quarters:true,pts:[{x,y,l:'M'}]})}</div>`};});
G(0,()=>{const q=R(0,3);const s=[['+','+'],['−','+'],['−','−'],['+','−']];const opts=s.map(p=>`(${p[0]}; ${p[1]})`);
 return {type:'choice',q:`Точка лежит в <b>${QN[q]}</b> четверти. Какие знаки у её координат (x; y)?`,opts,ans:q,short:`${QN[q]} четверть: ${opts[q]}.`,
 explain:`Четверти нумеруют против часовой стрелки, начиная с правой верхней:<br>I — справа сверху (+; +), II — слева сверху (−; +), III — слева снизу (−; −), IV — справа снизу (+; −).<br>${QN[q]} четверть → <b>${opts[q]}</b>.`,
 explain2:`Посмотри на картинку: где находится ${QN[q]} четверть? ${q===0||q===3?'Справа от оси Oy — значит x > 0':'Слева от оси Oy — значит x < 0'}; ${q<2?'выше оси Ox — y > 0':'ниже оси Ox — y < 0'}.<div class="fig">${grid({xr:[-5,5],yr:[-5,5],w:220,quarters:true,ticks:false})}</div>`};});

/* ===== L1 ===== */
G(1,()=>CH('Что такое <b>абсцисса</b> точки?','Первая координата x: на сколько шагов точка правее (или левее) начала координат',
 ['Вторая координата y: на сколько шагов точка выше или ниже','Расстояние от точки до начала координат','Номер четверти, в которой лежит точка'],
 {short:'Абсцисса — x, первая координата; ордината — y, вторая.',explain:`В записи ${M('A(5; −2)')} абсцисса — 5 (первое число, сдвиг по горизонтали), ордината — −2 (второе число, сдвиг по вертикали).`,
 explain2:'Абсцисса «живёт» на горизонтальной оси Ox — оси абсцисс. Опусти от точки вертикальную ниточку на эту ось — где она упрётся, такая и абсцисса.'}),{rule:true});
G(1,()=>{const [x,y]=rp(-5,5);
 return PT(`Запиши координаты точки A.`,x,y,{pic:grid({xr:[-6,6],yr:[-6,6],w:300,pts:[{x,y,l:'A'}]}),
 hint:'Сначала посчитай, сколько клеток по горизонтали от оси Oy (это x), потом — по вертикали от оси Ox (это y).',
 short:`A${P(x,y)}: ${Math.abs(x)} ${x>0?'вправо':'влево'}, ${Math.abs(y)} ${y>0?'вверх':'вниз'}.`,
 explain:`От точки A опускаем «ниточку» на ось Ox — попадаем в ${N(x)}: это <b>x</b>. Ведём ниточку к оси Oy — попадаем в ${N(y)}: это <b>y</b>.<br>Ответ: ${M('A'+P(x,y))}. Порядок важен: сначала x, потом y.<div class="fig">${grid({xr:[-6,6],yr:[-6,6],w:260,pts:[{x,y,l:'A'}],segs:[{a:[x,y],b:[x,0],dash:true,sw:1.4},{a:[x,y],b:[0,y],dash:true,sw:1.4}]})}</div>`,
 explain2:`Иди от начала координат O, как по карте: ${Math.abs(x)} ${plural(Math.abs(x),'шаг','шага','шагов')} ${x>0?'вправо (плюс)':'влево (минус)'} — получаешь x = ${N(x)}; потом ${Math.abs(y)} ${plural(Math.abs(y),'шаг','шага','шагов')} ${y>0?'вверх (плюс)':'вниз (минус)'} — y = ${N(y)}. Записываем ${P(x,y)}.`});});
G(1,()=>{const [a,b]=rp(-5,5);const cand=[[a,b,'ok'],[b,a,'swap'],[-a,b,'signx'],[a,-b,'signy']];const L4=sample(LET.slice(0,6),4);
 const pts=shuffle(cand).map((c,i)=>({x:c[0],y:c[1],l:L4[i],k:c[2]}));const opts=pts.map(p=>p.l);const okI=pts.findIndex(p=>p.k==='ok');const sw=pts.find(p=>p.k==='swap');
 return {type:'choice',q:`Морской бой! Корабли стоят в отмеченных точках. Ты стреляешь по точке ${M(P(a,b))}. В какой корабль ты попал?`,pic:grid({xr:[-6,6],yr:[-6,6],w:300,pts}),opts,ans:okI,
 short:`${P(a,b)}: ${Math.abs(a)} ${a>0?'вправо':'влево'}, ${Math.abs(b)} ${b>0?'вверх':'вниз'} — это ${pts[okI].l}.`,
 explain:`Идём от начала координат: x = ${N(a)} — ${Math.abs(a)} ${a>0?'вправо':'влево'}, затем y = ${N(b)} — ${Math.abs(b)} ${b>0?'вверх':'вниз'}. Там стоит корабль <b>${pts[okI].l}</b>.<br>Корабль ${sw.l} — это ${P(b,a)}: координаты переставлены местами, это самая частая ошибка.`,
 explain2:`Проверь каждую точку: ${pts.map(p=>`${p.l}${P(p.x,p.y)}`).join(', ')}. Ровно у одной первое число ${N(a)}, а второе ${N(b)}.`};});
G(1,()=>{const onX=Math.random()<0.5;const v=nz(-5,5);const x=onX?v:0,y=onX?0:v;
 return PT(`Запиши координаты точки B.`,x,y,{pic:grid({xr:[-6,6],yr:[-6,6],w:280,pts:[{x,y,l:'B'}]}),
 short:`Точка на оси ${onX?'Ox — ордината 0':'Oy — абсцисса 0'}: ${P(x,y)}.`,
 explain:`Точка B лежит <b>на оси ${onX?'Ox':'Oy'}</b>. ${onX?`Вверх-вниз от оси мы не сдвигались, поэтому y = 0, а x = ${N(x)}.`:`Вправо-влево от оси мы не сдвигались, поэтому x = 0, а y = ${N(y)}.`}<br>Ответ: ${M('B'+P(x,y))}.`,
 explain2:`Запомни: на оси Ox у всех точек y = 0, например (4; 0), (−2; 0). На оси Oy у всех x = 0: (0; 3), (0; −5). Нуль — это «никуда не сдвигались» по этой координате.`});});
G(1,()=>{const k=nz(-4,4);const pool=shuffle([[k,nz(-5,5)],[k,nz(-5,5)],[nz(-5,5),k],[-k,k],[0,k],[k+1,k],[k,0]]).filter((p,i,a)=>a.findIndex(q=>q[0]===p[0]&&q[1]===p[1])===i).slice(0,5);
 const ok=pool.map((p,i)=>p[0]===k?i:-1).filter(i=>i>=0);if(ok.length<1||ok.length>3)return null;
 return {type:'multi',q:`У каких точек <b>абсцисса</b> равна ${N(k)}? Выбери все.`,opts:pool.map(p=>P(p[0],p[1])),ans:ok,
 short:'Абсцисса — первое число в скобках.',explain:`Абсцисса — <b>первое</b> число. Проверяем:<br>${pool.map(p=>`${P(p[0],p[1])} — первое число ${N(p[0])} ${p[0]===k?'✅':'❌'}`).join('<br>')}`,
 explain2:`Не смотри на второе число вообще — закрой его пальцем. Абсцисса стоит сразу после открывающей скобки. Ловушка — точки, где ${N(k)} стоит на втором месте: это ордината.`};});

/* ===== L2 ===== */
G(2,()=>CH(`Как построить точку ${M('M(−3; 2)')}?`,'От начала координат пройти 3 шага влево, потом 2 шага вверх',['3 шага вправо, потом 2 вверх','3 шага вверх, потом 2 влево','2 шага влево, потом 3 вверх'],
 {short:'x = −3 → 3 влево; y = 2 → 2 вверх.',explain:`Первое число — x = −3: минус значит <b>влево</b>, 3 шага. Второе — y = 2: плюс значит <b>вверх</b>, 2 шага.<div class="fig">${grid({xr:[-5,5],yr:[-5,5],w:220,pts:[{x:-3,y:2,l:'M'}],segs:[{a:[0,0],b:[-3,0],col:'var(--hl)',sw:3},{a:[-3,0],b:[-3,2],col:'var(--hl)',sw:3}]})}</div>`,
 explain2:'Знак показывает направление: x плюс — вправо, минус — влево; y плюс — вверх, минус — вниз. Модуль числа — количество шагов.'}),{rule:true});
G(2,()=>{const [a,b]=rp(-4,4);const k=[['ok',a,b],['swap',b,a],['sx',-a,b],['sy',a,-b]];const o=shuffle(k);
 return {type:'choice',pics:true,q:`На каком рисунке отмечена точка ${M('K'+P(a,b))}?`,opts:o.map(p=>grid({xr:[-5,5],yr:[-5,5],w:150,pts:[{x:p[1],y:p[2],l:'K'}]})),ans:o.findIndex(p=>p[0]==='ok'),ansText:`точка ${Math.abs(a)} ${a>0?'вправо':'влево'} и ${Math.abs(b)} ${b>0?'вверх':'вниз'}`,
 short:`${P(a,b)}: ${Math.abs(a)} ${a>0?'вправо':'влево'}, ${Math.abs(b)} ${b>0?'вверх':'вниз'}.`,
 explain:`${M('K'+P(a,b))}: сначала x = ${N(a)} — ${Math.abs(a)} ${a>0?'вправо':'влево'}; потом y = ${N(b)} — ${Math.abs(b)} ${b>0?'вверх':'вниз'}. На неправильных рисунках: координаты переставлены ${P(b,a)}, или у одной координаты потерян знак: ${P(-a,b)}, ${P(a,-b)}.`,
 explain2:`Сначала определи четверть по знакам (${a>0?'+':'−'}; ${b>0?'+':'−'}) — это ${QN[quarter(a,b)]}. Сразу отпадают рисунки, где точка в другой четверти. Из оставшихся выбери тот, где по горизонтали ${Math.abs(a)} клетки, а по вертикали ${Math.abs(b)}.`};});
G(2,()=>{const x1=R(-5,1),x2=R(x1+2,5),y1=R(-5,1),y2=R(y1+2,5);const rot=R(0,3);
 const V=[[x1,y1],[x1,y2],[x2,y2],[x2,y1]];const A=V[rot],B=V[(rot+1)%4],C=V[(rot+2)%4],D=V[(rot+3)%4];
 return PT(`Три вершины прямоугольника ABCD: ${M(`A${P(...A)}, B${P(...B)}, C${P(...C)}`)}. Стороны идут по линиям сетки. Найди координаты вершины D.`,D[0],D[1],
 {pic:grid({xr:[-6,6],yr:[-6,6],w:280,pts:[{x:A[0],y:A[1],l:'A'},{x:B[0],y:B[1],l:'B'},{x:C[0],y:C[1],l:'C'}],segs:[{a:A,b:B},{a:B,b:C}]}),
 hint:'D — напротив B. Она стоит на одной вертикали или горизонтали с A и с C.',short:`D${P(...D)}.`,
 explain:`D соседствует с A и C. ${A[0]===D[0]?`С A у неё общий x = ${N(D[0])} (одна вертикаль), с C — общий y = ${N(D[1])}.`:`С A у неё общий y = ${N(D[1])} (одна горизонталь), с C — общий x = ${N(D[0])}.`}<br>Ответ: ${M('D'+P(...D))}.<div class="fig">${grid({xr:[-6,6],yr:[-6,6],w:250,polys:[{pts:[A,B,C,D]}],pts:[{x:A[0],y:A[1],l:'A'},{x:B[0],y:B[1],l:'B'},{x:C[0],y:C[1],l:'C'},{x:D[0],y:D[1],l:'D',col:'var(--hl)'}]})}</div>`,
 explain2:`Сдвиг из B в A такой же, как из C в D. Из B${P(...B)} в A${P(...A)}: x ${A[0]-B[0]>=0?'+':'−'}${Math.abs(A[0]-B[0])}, y ${A[1]-B[1]>=0?'+':'−'}${Math.abs(A[1]-B[1])}. Применяем к C${P(...C)}: D = ${P(C[0]+A[0]-B[0],C[1]+A[1]-B[1])}.`});});
G(2,()=>{const hor=Math.random()<0.5;const c=nz(-5,5),a=R(-6,2),b=R(a+2,7);if(a>=0&&Math.random()<0.6)return null;const [A,B]=hor?[[a,c],[b,c]]:[[c,a],[c,b]];const L=b-a;
 return {type:'num',q:`Найди длину отрезка AB, если ${M(`A${P(...A)}`)}, ${M(`B${P(...B)}`)} (единичный отрезок — 1 см). Ответ — в см.`,ans:L,
 hint:`У точек одинаковый ${hor?'y':'x'} — значит отрезок ${hor?'горизонтальный':'вертикальный'}. Длина — разность ${hor?'абсцисс':'ординат'}.`,
 short:`${N(b)} − ${a<0?'('+N(a)+')':N(a)} = ${L} см.`,
 explain:`У точек одинаковая ${hor?'ордината':'абсцисса'} (${N(c)}), значит отрезок ${hor?'горизонтальный':'вертикальный'}. Длина — большая ${hor?'абсцисса':'ордината'} минус меньшая:<br>${M(`AB = ${N(b)} − ${a<0?'('+N(a)+')':N(a)} = ${L}`)} см.${a<0&&b>0?`<br>Ошибка «${N(b)} − ${N(-a)} = ${b+a}» — потеряли знак минус у ${N(a)}.`:''}`,
 explain2:`Посчитай клетки: ${a<0&&b>0?`от ${N(a)} до 0 — ${-a}, от 0 до ${b} — ${b}, вместе ${L}`:`от ${N(a)} до ${N(b)} — ${L} клеток`}.<div class="fig">${grid({xr:[-7,7],yr:[-7,7],w:250,segs:[{a:A,b:B,col:'var(--hl)',sw:3}],pts:[{x:A[0],y:A[1],l:'A'},{x:B[0],y:B[1],l:'B'}]})}</div>`};});
G(2,()=>{const x1=R(-5,0),x2=R(1,5),y1=R(-5,0),y2=R(1,5);const w=x2-x1,h=y2-y1;const ask=Math.random()<0.5?'S':'P';
 const V=[[x1,y1],[x1,y2],[x2,y2],[x2,y1]];const ans=ask==='S'?w*h:2*(w+h);
 return {type:'num',q:`Найди ${ask==='S'?'площадь':'периметр'} прямоугольника с вершинами ${V.map(v=>M(P(...v))).join(', ')} (единичный отрезок — 1 см). Ответ — в ${ask==='S'?'см²':'см'}.`,
 pic:grid({xr:[-6,6],yr:[-6,6],w:260,polys:[{pts:V}],pts:V.map(v=>({x:v[0],y:v[1],r:3}))}),ans,
 short:`Стороны ${w} и ${h}: ${ask==='S'?`${w} · ${h} = ${ans}`:`2 · (${w} + ${h}) = ${ans}`}.`,
 explain:`Ширина: ${M(`${N(x2)} − ${x1<0?'('+N(x1)+')':N(x1)} = ${w}`)}. Высота: ${M(`${N(y2)} − ${y1<0?'('+N(y1)+')':N(y1)} = ${h}`)}.<br>${ask==='S'?`Площадь: ${M(`${w} · ${h} = ${ans}`)} см².`:`Периметр: ${M(`2 · (${w} + ${h}) = ${ans}`)} см.`}`,
 explain2:`Просто посчитай клетки на картинке: по горизонтали ${w}, по вертикали ${h}. ${ask==='S'?`Клеток внутри: ${w} рядов по ${h} = ${ans}.`:`Обойди по контуру: ${w} + ${h} + ${w} + ${h} = ${ans}.`}`};});

/* ===== L3 симметрия ===== */
G(3,()=>CH(`Какие координаты у точки, симметричной ${M('A(x; y)')} относительно <b>оси Ox</b>?`,'(x; −y)',['(−x; y)','(−x; −y)','(y; x)'],
 {short:'Ox — горизонтальное зеркало: x тот же, y меняет знак.',explain:`Ось Ox горизонтальная. Точка «отражается» в ней вверх-вниз: влево-вправо не сдвигается (x тот же), а по вертикали оказывается на том же расстоянии с другой стороны (y меняет знак). ${M('(3; 2) → (3; −2)')}.`,
 explain2:`Как отражение дерева в озере: верхушка над водой на высоте 5 — отражение на «высоте» −5, а сдвига вбок нет.<div class="fig">${sym3(3,2)}</div>`}),{rule:true});
G(3,()=>CH(`Какие координаты у точки, симметричной ${M('A(x; y)')} относительно <b>начала координат O</b>?`,'(−x; −y)',['(x; −y)','(−x; y)','(y; x)'],
 {short:'Симметрия относительно O меняет оба знака.',explain:`Точка «проходит сквозь» O и оказывается на таком же расстоянии с противоположной стороны: и x, и y меняют знак. ${M('(3; 2) → (−3; −2)')}. Это то же, что отразить сначала в Ox, потом в Oy.`,
 explain2:`Соедини точку с O и продолжи линию на такое же расстояние — попадёшь в (−x; −y). Точки D и A на картинке: <div class="fig">${sym3(3,2)}</div>`}),{rule:true});
G(3,()=>{const [x,y]=rp(-6,6);const t=R(0,2);const nm=['оси Ox','оси Oy','начала координат'][t];const r=t===0?[x,-y]:t===1?[-x,y]:[-x,-y];
 return PT(`Найди координаты точки, симметричной ${M('A'+P(x,y))} относительно <b>${nm}</b>.`,r[0],r[1],
 {short:`${['Меняем знак y','Меняем знак x','Меняем оба знака'][t]}: ${P(...r)}.`,
 explain:`Правило: относительно ${nm} ${['(x; y) → (x; −y): x остаётся, y меняет знак','(x; y) → (−x; y): y остаётся, x меняет знак','(x; y) → (−x; −y): меняются оба знака'][t]}.<br>${M(P(x,y)+' → '+P(...r))}.`,
 explain2:`Посмотри на картинку: A и её «отражение» на одинаковом расстоянии от ${t===0?'оси Ox':t===1?'оси Oy':'точки O'}.<div class="fig">${grid({xr:[-7,7],yr:[-7,7],w:250,pts:[{x,y,l:'A'},{x:r[0],y:r[1],l:'A′',col:'var(--hl)'}],segs:[{a:[x,y],b:r,dash:true,sw:1.3}]})}</div>`});});
G(3,()=>{const [x,y]=rp(-5,5);const t=R(0,2);const nm=['оси Ox','оси Oy','начала координат O'][t];const ks=[[x,-y],[-x,y],[-x,-y],[y,x]];const L4=sample(['B','C','D','E','K'],4);
 const pts=[{x,y,l:'A',col:'var(--hl)'}].concat(ks.map((k,i)=>({x:k[0],y:k[1],l:L4[i],k:i})));const okL=L4[t];
 return {type:'choice',q:`Какая точка симметрична точке A относительно <b>${nm}</b>?`,pic:grid({xr:[-6,6],yr:[-6,6],w:300,pts}),opts:L4.slice().sort(),ans:L4.slice().sort().indexOf(okL),
 short:`${okL}${P(...ks[t])}.`,explain:`A${P(x,y)}. Относительно ${nm}: ${['меняем знак y','меняем знак x','меняем оба знака'][t]} → ${P(...ks[t])}. Это точка <b>${okL}</b>.<br>Остальные: ${L4.map((l,i)=>i===t?'':`${l}${P(...ks[i])} — ${['симметрия относительно Ox','относительно Oy','относительно O','координаты переставлены (это не симметрия относительно осей)'][i]}`).filter(Boolean).join('; ')}.`,
 explain2:`Сложи зеркало мысленно: ${t===0?'ось Ox — горизонталь, A прыгает вниз/вверх на то же расстояние':t===1?'ось Oy — вертикаль, A прыгает влево/вправо на то же расстояние':'точка O — центр, A «проходит сквозь» него на ту же длину'}. Где окажется A? Там стоит ${okL}.`};});
G(3,()=>{const [a,b]=rp(-6,6);const t=R(0,3);const B=t===0?[a,-b]:t===1?[-a,b]:t===2?[-a,-b]:[b,a];const opts=['Относительно оси Ox','Относительно оси Oy','Относительно начала координат','Не симметричны ни относительно осей, ни относительно O'];
 return {type:'choice',q:`Точки ${M('A'+P(a,b))} и ${M('B'+P(...B))}. Как они расположены?`,opts,ans:t,
 short:t===3?'Координаты просто переставлены — это не симметрия относительно осей или O.':`${['Изменился только знак y','Изменился только знак x','Изменились оба знака'][t]}.`,
 explain:`Сравниваем: x: ${N(a)} → ${N(B[0])}, y: ${N(b)} → ${N(B[1])}.<br>${t===0?'x тот же, у y сменился знак → симметрия относительно <b>оси Ox</b>.':t===1?'y тот же, у x сменился знак → симметрия относительно <b>оси Oy</b>.':t===2?'Оба знака сменились → симметрия относительно <b>начала координат</b>.':'Числа поменялись местами — ни одно из правил (x; −y), (−x; y), (−x; −y) не подходит.'}`,
 explain2:'Ox: (x; y) ↔ (x; −y). Oy: (x; y) ↔ (−x; y). O: (x; y) ↔ (−x; −y). Найди, какая координата «осталась на месте» — она и подсказывает ось: остался x → ось Ox.'};});

/* ===== L4 ===== */
G(4,()=>CH('Где лежат все точки, у которых абсцисса равна 3 (то есть x = 3)?','На вертикальной прямой, проходящей через число 3 на оси Ox (она параллельна оси Oy)',
 ['На горизонтальной прямой, проходящей через 3 на оси Oy','На оси Ox','Только в первой четверти'],
 {short:'x = 3 — вертикальная прямая.',explain:`Точки (3; 0), (3; 1), (3; −4), (3; 100)… — у всех x = 3, а y любой. Они выстраиваются <b>вертикально</b> над и под числом 3 на оси Ox. Это прямая ${M('x = 3')}, она параллельна оси Oy.`,
 explain2:`Представь вертикальный столб, вкопанный в точке 3 на оси Ox. Все точки столба на 3 правее оси Oy, а высота у них разная.<div class="fig">${grid({xr:[-5,5],yr:[-5,5],w:220,lines:[{a:[3,0],b:[3,1],l:'x = 3'}],pts:[{x:3,y:2,r:3},{x:3,y:-3,r:3},{x:3,y:0,r:3}]})}</div>`}),{rule:true});
G(4,()=>{const k=nz(-4,4);const pool=shuffle([[nz(-5,5),k],[nz(-5,5),k],[k,nz(-5,5)],[nz(-5,5),-k],[0,k],[k,k],[nz(-5,5),k+1]]).filter((p,i,a)=>a.findIndex(q=>q[0]===p[0]&&q[1]===p[1])===i).slice(0,5);
 const ok=pool.map((p,i)=>p[1]===k?i:-1).filter(i=>i>=0);if(ok.length<1||ok.length>3)return null;
 return {type:'multi',q:`Какие точки лежат на прямой ${M('y = '+N(k))}? Выбери все.`,opts:pool.map(p=>P(p[0],p[1])),ans:ok,
 short:`На прямой y = ${N(k)} — точки с ординатой ${N(k)}.`,explain:`${M('y = '+N(k))} — горизонтальная прямая, на ней все точки с <b>ординатой</b> (вторым числом) ${N(k)}:<br>${pool.map(p=>`${P(p[0],p[1])} — y = ${N(p[1])} ${p[1]===k?'✅':'❌'}`).join('<br>')}`,
 explain2:`Смотри только на <b>второе</b> число. Ловушка — точки, у которых ${N(k)} стоит первым: они лежат на вертикальной прямой x = ${N(k)}, а не на y = ${N(k)}.`};});
G(4,()=>{const a=nz(-6,6),b=nz(-6,6);
 return PT(`В какой точке пересекаются прямые ${M('x = '+N(a))} и ${M('y = '+N(b))}?`,a,b,{short:`Точка берёт x = ${N(a)} у одной прямой и y = ${N(b)} у другой.`,
 explain:`Точка пересечения лежит на обеих прямых: на ${M('x = '+N(a))} — значит её абсцисса ${N(a)}; на ${M('y = '+N(b))} — значит ордината ${N(b)}. Ответ: ${M(P(a,b))}.`,
 explain2:`<div class="fig">${grid({xr:[-7,7],yr:[-7,7],w:250,lines:[{a:[a,0],b:[a,1],l:'x = '+N(a)},{a:[0,b],b:[1,b],l:'y = '+N(b),col:'var(--hl)'}],pts:[{x:a,y:b,l:P(a,b)}]})}</div>Вертикальная прямая и горизонтальная встречаются ровно в одной точке.`});});
G(4,()=>{const [x,y]=rp(-9,9);const toX=Math.random()<0.5;const ans=toX?Math.abs(y):Math.abs(x);
 return {type:'num',q:`Найди расстояние от точки ${M('M'+P(x,y))} до <b>оси ${toX?'Ox':'Oy'}</b> (единичный отрезок — 1 см). Ответ — в см.`,ans,
 hint:toX?'Ось Ox горизонтальная — до неё идём вертикально.':'Ось Oy вертикальная — до неё идём горизонтально.',short:`${toX?'|y|':'|x|'} = ${ans}.`,
 explain:`${toX?`До горизонтальной оси Ox идём <b>вертикально</b> — столько, какова ордината по модулю: ${M(`|${N(y)}| = ${ans}`)}.`:`До вертикальной оси Oy идём <b>горизонтально</b> — столько, какова абсцисса по модулю: ${M(`|${N(x)}| = ${ans}`)}.`}<br>Ошибка «${toX?Math.abs(x):Math.abs(y)}» — взяли не ту координату. Расстояние не бывает отрицательным, поэтому берём модуль.`,
 explain2:`<div class="fig">${grid({xr:[-10,10],yr:[-10,10],w:260,pts:[{x,y,l:'M'}],segs:[toX?{a:[x,y],b:[x,0],col:'var(--hl)',sw:3}:{a:[x,y],b:[0,y],col:'var(--hl)',sw:3}]})}</div>Выделенный отрезок — путь до оси. Его длина ${ans}.`};});

/* ===== L5 ===== */
G(5,()=>CH('Какие прямые называются <b>перпендикулярными</b>?','Прямые, которые пересекаются под прямым углом (90°)',['Прямые, которые не пересекаются','Прямые, которые пересекаются под любым углом','Прямые одинаковой длины'],
 {short:'⊥ — пересекаются под 90°.',explain:'Перпендикулярные (${M("a ⊥ b")}) — пересекаются под <b>прямым углом</b>, как оси Ox и Oy, как стены в углу комнаты. Не пересекаются — это параллельные. А «длины» у прямой нет — она бесконечная.'.replace('${M("a ⊥ b")}',M('a ⊥ b')),
 explain2:'Проверь угольником или уголком тетрадного листа: если угол между прямыми совпадает с уголком листа — прямые перпендикулярны.'}),{rule:true});
G(5,()=>CH('Сколько прямых, <b>параллельных</b> прямой a, можно провести через точку, не лежащую на a?','Ровно одну',['Ни одной','Две','Бесконечно много'],
 {short:'Через точку вне прямой проходит ровно одна параллельная ей прямая.',explain:'Это важнейшее свойство параллельных прямых (аксиома параллельных): через точку вне прямой можно провести <b>одну и только одну</b> параллельную ей прямую. Любая другая прямая через эту точку обязательно пересечёт a — пусть даже очень далеко.',
 explain2:'Попробуй на клетках: прямая идёт «2 вправо, 1 вверх». Через данную точку такими же ступеньками можно пройти только одним способом. Чуть поверни — и ступеньки станут другими, прямые где-то встретятся.'}),{rule:true});
G(5,()=>{const D=[[1,2],[2,1],[1,-2],[2,-1],[1,1],[1,-1],[1,3],[3,1]];const d=pick(D);const perp=[-d[1],d[0]];
 const other=pick(D.filter(e=>e[0]*d[1]-e[1]*d[0]!==0&&e[0]*d[0]+e[1]*d[1]!==0));
 const askPerp=Math.random()<0.5;const P0=[R(-1,1),R(-1,1)];
 let P2;for(;;){P2=[R(-3,3),R(-3,3)];if((P2[0]-P0[0])*d[1]-(P2[1]-P0[1])*d[0]!==0&&Math.abs((P2[0]-P0[0])*d[1]-(P2[1]-P0[1])*d[0])>=3)break;}
 const P1=[R(-2,2),R(-2,2)],P3=[R(-2,2),R(-2,2)];
 const L3=shuffle(['b','c','d']);const ln=[{k:'perp',p:P1,d:perp},{k:'par',p:P2,d},{k:'oth',p:P3,d:other}].map((o,i)=>Object.assign(o,{l:L3[i]}));
 const lines=[{a:P0,b:[P0[0]+d[0],P0[1]+d[1]],l:'a'}].concat(ln.map((o,i)=>({a:o.p,b:[o.p[0]+o.d[0],o.p[1]+o.d[1]],l:o.l,col:['var(--hl)','var(--fig)','var(--muted)'][i],dash:i===2})));
 const want=ln.find(o=>o.k===(askPerp?'perp':'par'));const opts=['b','c','d'];
 const st=v=>`${Math.abs(v[0])} ${v[0]>=0?'вправо':'влево'}, ${Math.abs(v[1])} ${v[1]>=0?'вверх':'вниз'}`;
 return {type:'choice',q:`Какая прямая <b>${askPerp?'перпендикулярна':'параллельна'}</b> прямой a?`,pic:grid({xr:[-5,5],yr:[-5,5],w:300,ticks:false,lines}),opts,ans:opts.indexOf(want.l),
 short:`Ступеньки прямой a: ${st(d)}; у ${want.l}: ${st(want.d)}.`,
 explain:`Смотрим на «ступеньки» по клеткам. Прямая a: ${st(d)}.<br>• ${ln[0].l}: ${st(perp)} — числа поменялись местами и одно сменило направление → <b>перпендикулярна</b> a.<br>• ${ln[1].l}: ${st(d)} — такие же ступеньки → <b>параллельна</b> a.<br>• ${ln[2].l}: ${st(other)} — ни то, ни другое.<br>Ответ: <b>${want.l}</b>.`,
 explain2:askPerp?'Перпендикулярная прямая — это прямая a, повёрнутая на 90°. Поверни тетрадь на четверть оборота — ступенька «2 вправо, 1 вверх» станет «1 влево, 2 вверх».':'Параллельные прямые — как рельсы: идут с одинаковым наклоном и никогда не встречаются. Найди прямую с таким же наклоном, как у a.'};});
G(5,()=>{const t=R(0,2);const a=nz(-5,5);let b=nz(-5,5);if(t!==1&&a===b)return null;
 const l1=t===2?`y = ${N(a)}`:`x = ${N(a)}`,l2=t===0?`x = ${N(b)}`:`y = ${N(b)}`;const ans=t===1?0:1;
 const opts=['Перпендикулярны','Параллельны','Совпадают','Пересекаются не под прямым углом'];
 return {type:'choice',q:`Как расположены прямые ${M(l1)} и ${M(l2)}?`,opts,ans,short:t===1?'Вертикальная и горизонтальная — перпендикулярны.':'Обе '+(t===0?'вертикальные':'горизонтальные')+' — параллельны.',
 explain:`${M('x = …')} — вертикальная прямая, ${M('y = …')} — горизонтальная.<br>${t===1?`${M(l1)} вертикальная, ${M(l2)} горизонтальная — они пересекаются под прямым углом: <b>перпендикулярны</b>.`:`Обе прямые ${t===0?'вертикальные':'горизонтальные'} и проходят через разные числа (${N(a)} и ${N(b)}) — они не пересекаются: <b>параллельны</b>.`}`,
 explain2:`<div class="fig">${grid({xr:[-6,6],yr:[-6,6],w:240,lines:[t===2?{a:[0,a],b:[1,a],l:l1}:{a:[a,0],b:[a,1],l:l1},t===0?{a:[b,0],b:[b,1],l:l2,col:'var(--hl)'}:{a:[0,b],b:[1,b],l:l2,col:'var(--hl)'}]})}</div>`};});

/* ===== L6 графики ===== */
G(6,()=>CH('Что означает <b>горизонтальный участок</b> на графике движения (по вертикали — расстояние, по горизонтали — время)?','Расстояние не меняется — объект стоит на месте',
 ['Объект едет с постоянной скоростью','Объект едет быстрее всего','Объект возвращается назад'],
 {short:'Время идёт, расстояние то же — стоим.',explain:'Горизонтальный участок: время идёт (сдвигаемся вправо), а расстояние то же самое (высота не меняется). Значит, объект <b>стоит</b>. Едет с постоянной скоростью — наклонная прямая; возвращается — линия идёт вниз.',
 explain2:'Вспомни привал в походе: часы тикают, а от дома ты на том же расстоянии — пока ешь бутерброд, ты никуда не идёшь.'}),{rule:true});
G(6,()=>{const v1=pick([10,15,20]),t1=R(1,3),t2=R(1,2),back=Math.random()<0.5;const d1=v1*t1;
 let t3,v2,pts;if(back){t3=pick([1,2,3].filter(t=>d1%t===0&&d1/t<=30));if(!t3)return null;v2=d1/t3;pts=[[0,0],[t1,d1],[t1+t2,d1],[t1+t2+t3,0]];}
 else{t3=R(1,2);v2=pick([5,10,15]);pts=[[0,0],[t1,d1],[t1+t2,d1],[t1+t2+t3,d1+v2*t3]];}

function gridClick(svgHost,cb){svgHost.addEventListener('click',e=>{const svg=svgHost.querySelector('svg');if(!svg)return;const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;
  const sx=(e.clientX-r.left)*vb.width/r.width,sy=(e.clientY-r.top)*vb.height/r.height;const pad=14,u=(vb.width-2*pad)/12;
  const x=Math.round((sx-pad)/u-6),y=Math.round(6-(sy-pad)/u);if(Math.abs(x)<=6&&Math.abs(y)<=6)cb(x,y);});}
function onTheory(root){
  const w=root.querySelector('#w-click');
  if(w){let pt=[3,2],sym=false;
    w.innerHTML=`<div id="wcS" style="display:flex;justify-content:center;cursor:crosshair"></div><div id="wcO" style="text-align:center;margin-top:6px;font-size:16px"></div><label style="justify-content:center"><input type="checkbox" id="wcC"> показать симметричные точки</label>`;
    const draw=()=>{const [x,y]=pt;const pts=[{x,y,l:`A${P(x,y)}`}];
      if(sym&&x&&y)pts.push({x,y:-y,l:'Ox',col:'var(--hl)'},{x:-x,y,l:'Oy',col:'var(--hl)'},{x:-x,y:-y,l:'O',col:'var(--hl)'});
      w.querySelector('#wcS').innerHTML=grid({xr:[-6,6],yr:[-6,6],w:300,pts,segs:[{a:[x,y],b:[x,0],dash:true,sw:1.2},{a:[x,y],b:[0,y],dash:true,sw:1.2}]});
      const q=quarter(x,y);w.querySelector('#wcO').innerHTML=`x = <span class="out">${N(x)}</span>, y = <span class="out">${N(y)}</span> — ${q<0?(x===0&&y===0?'начало координат':'точка на оси '+(x===0?'Oy':'Ox')):'<b>'+QN[q]+'</b> четверть'}${sym&&x&&y?`<br><span class="small">симметричные: Ox → ${P(x,-y)}, Oy → ${P(-x,y)}, O → ${P(-x,-y)}</span>`:''}`;};
    gridClick(w.querySelector('#wcS'),(x,y)=>{pt=[x,y];draw();});w.querySelector('#wcC').onchange=e=>{sym=e.target.checked;draw();};draw();}
  const b=root.querySelector('#w-battle');
  if(b){let ships,shots,log;const reset=()=>{ships=[];while(ships.length<3){const p=[R(-5,5),R(-5,5)];if(!ships.some(s=>s[0]===p[0]&&s[1]===p[1]))ships.push(p);}shots=[];log=[];};reset();
    b.innerHTML=`<div id="wbS" style="display:flex;justify-content:center;cursor:crosshair"></div><div id="wbO" style="text-align:center;margin-top:6px"></div><div class="row" style="margin-top:6px"><button class="btn ghost" id="wbN">Новая игра</button></div>`;
    const draw=()=>{const hits=shots.filter(s=>ships.some(p=>p[0]===s[0]&&p[1]===s[1]));const done=hits.length===3;
      const pts=shots.map(s=>{const h=ships.some(p=>p[0]===s[0]&&p[1]===s[1]);return {x:s[0],y:s[1],r:h?6:3,col:h?'var(--hl)':'var(--muted)'};});
      if(done)ships.forEach(p=>pts.push({x:p[0],y:p[1],r:6,col:'var(--hl)',l:'🚢'}));
      b.querySelector('#wbS').innerHTML=grid({xr:[-6,6],yr:[-6,6],w:300,pts});
      b.querySelector('#wbO').innerHTML=`Выстрелов: <span class="out">${shots.length}</span>, попаданий: <span class="out">${hits.length}</span> из 3${done?' — <b>все корабли потоплены! 🎉</b>':''}<br><span class="small">${log.slice(-4).join(' · ')}</span>`;};
    gridClick(b.querySelector('#wbS'),(x,y)=>{if(shots.some(s=>s[0]===x&&s[1]===y))return;if(shots.filter(s=>ships.some(p=>p[0]===s[0]&&p[1]===s[1])).length===3)return;shots.push([x,y]);const h=ships.some(p=>p[0]===x&&p[1]===y);log.push(`${P(x,y)} — ${h?'<b>попал!</b>':'мимо'}`);draw();});
    b.querySelector('#wbN').onclick=()=>{reset();draw();};draw();}
}
