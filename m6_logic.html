<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Логика и смекалка — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}

.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}

@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}

.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}

.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}

.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}

.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}

.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}

.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}

.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

.nudge-wrap{padding-top:14px;padding-bottom:0}.nudge-wrap+main{padding-top:0}
.nudge{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:12px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.nudge-t{flex:1 1 280px;line-height:1.5;font-size:15px}.nudge-b{flex:0 0 auto}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  nudges:[
    '{n}, нейронка решает быстро — но учится при этом она, а не ты. Твоя задача — научиться самому 🧠',
    'Сфоткать задачу и переписать ответ — это работа ксерокса 📠, а не учёба. Ксерокс умнее не становится.',
    'На контрольной в школе и на экзамене у мамы нейронки рядом не будет. Будешь только ты и твоя голова. Тренируй её сейчас 💪',
    'Ошибка с разбором — это +1 к мозгу. Ответ, списанный у нейронки, — это +0. Выбирай, что тебе выгоднее 😉',
    'Нейросети будут у всех. Выигрывать будут те, кто понимает больше нейросети. Будь таким, {n}.',
    'Не получается? Нажми «Не понял» — тренажёр объяснит по-другому. Или приходи к маме. Решать за тебя — не вариант.',
    'Чемпионы не ездят на тренировку на такси 🏃 Решай сам — только так растёт сила.',
    '{n}, я в тебя верю: ты можешь решить это сам. Медленно и с ошибками — это нормально. Списать — нет. Мама ❤️',
    'Чем больше решаешь сам, тем легче следующие темы. С нейронкой каждая новая тема будет всё труднее.',
  ],
  nudge(main){if(!main||document.querySelector('.nudge'))return;const m=P.nudges[Math.floor(Math.random()*P.nudges.length)].replace(/\{n\}/g,P.name());
    const c=document.createElement('div');c.className='nudge';c.innerHTML=`<div class="nudge-t">🤖🚫 ${m}</div><button class="btn ghost nudge-b">Понял, решаю сам 💪</button>`;
    const w=document.createElement('div');w.className='wrap nudge-wrap';w.appendChild(c);c.querySelector('button').onclick=()=>w.remove();main.parentNode.insertBefore(w,main);},
  mount(header,main){
    if(!header)return;
    if(!document.getElementById('login'))P.nudge(main);
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    const honest=(sk===10||(sk>0&&sk%15===0))?`<div class="small" style="margin-top:6px">Если всё это сам — ты красавчик! Если с нейронкой — честно, это ничего не стоит: на контрольной её не будет 😉</div>`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${honest}${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>

/* ---------- knights & liars engine ---------- */
const ISL=['Аня','Боря','Вика','Гена','Даша','Егор','Женя','Зоя','Илья','Катя','Лёва','Мила'];
const KL=k=>k?'рыцарь':'лжец';
function stmt(i,n,nm){const others=range(0,n-1).filter(j=>j!==i);const X=pick(others),Y=others.find(j=>j!==X);
  const t=R(0,n===2?4:6);
  if(t===0)return {t:`${nm[X]} — лжец`,f:k=>!k[X]};
  if(t===1)return {t:`${nm[X]} — рыцарь`,f:k=>k[X]};
  if(t===2){const m=R(0,n);return {t:m===0?'Среди нас нет лжецов':`Среди нас ровно ${m} ${plural(m,'лжец','лжеца','лжецов')}`,f:k=>k.filter(x=>!x).length===m};}
  if(t===3)return {t:`${nm[X]} — такого же типа, как я`,f:k=>k[X]===k[i]};
  if(t===4)return {t:`${nm[X]} — не такого типа, как я`,f:k=>k[X]!==k[i]};
  if(t===5)return {t:`${nm[X]} и ${nm[Y]} — оба лжецы`,f:k=>!k[X]&&!k[Y]};
  return {t:'Среди нас есть хотя бы один лжец',f:k=>k.some(x=>!x)};}
function allAssign(n){const out=[];for(let m=0;m<(1<<n);m++)out.push(range(0,n-1).map(i=>!!(m>>(n-1-i)&1)));return out;}
function klPuzzle(n){for(;;){const nm=sample(ISL,n);const st=range(0,n-1).map(i=>stmt(i,n,nm));
  if(new Set(st.map(s=>s.t)).size<n)continue;
  const res=allAssign(n).map(k=>{const bad=st.findIndex((s,i)=>s.f(k)!==k[i]);return {k,bad};});
  const good=res.filter(r=>r.bad<0);if(good.length!==1)continue;
  return {nm,st,res,sol:good[0].k};}}
function klCases(P){return P.res.map(r=>{const who=P.nm.map((x,i)=>`${x} — ${r.k[i]?'Р':'Л'}`).join(', ');
  if(r.bad<0)return `<b>${who}: ✅ всё сходится</b>`;const b=r.bad;
  return `${who}: ❌ ${P.nm[b]} — ${KL(r.k[b])}, но фраза «${P.st[b].t}» тогда ${P.st[b].f(r.k)?'правдива':'ложна'}`;}).join('<br>');}

function perms(a){if(a.length<=1)return [a.slice()];const out=[];a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p))));return out;}
function propagate(n,neg){ // neg: list [i,v]; returns {grid,steps,solved}
  const g=range(0,n-1).map(()=>Array(n).fill(0));neg.forEach(([i,v])=>g[i][v]=-1);const steps=[];
  let ch=true;while(ch){ch=false;
    for(let i=0;i<n;i++){if(g[i].includes(1))continue;const free=range(0,n-1).filter(v=>g[i][v]===0);if(free.length===1){const v=free[0];g[i][v]=1;for(let j=0;j<n;j++)if(j!==i)g[j][v]=-1;steps.push(['row',i,v]);ch=true;}}
    for(let v=0;v<n;v++){if(range(0,n-1).some(i=>g[i][v]===1))continue;const free=range(0,n-1).filter(i=>g[i][v]===0);if(free.length===1){const i=free[0];g[i][v]=1;for(let w=0;w<n;w++)if(w!==v)g[i][w]=-1;steps.push(['col',i,v]);ch=true;}}}
  const solved=g.every(r=>r.includes(1));return {g,steps,solved};}
function lgPuzzle(n){for(;;){const th=pick(THEMES);const vals=th.vals.slice(0,n);const idx=range(0,n-1);const nm=sample(ISL,n);const sol=shuffle(idx);
  let pool=[];for(let i=0;i<n;i++)for(let v=0;v<n;v++)if(sol[i]!==v)pool.push([i,v]);pool=shuffle(pool);
  let cl=[];for(const f of pool){cl.push(f);if(propagate(n,cl).solved)break;}
  for(let k=cl.length-1;k>=0;k--){const t=cl.slice(0,k).concat(cl.slice(k+1));if(propagate(n,t).solved)cl=t;}
  if(cl.length<n-1)continue;
  const cnt=perms(idx).filter(p=>cl.every(([i,v])=>p[i]!==v)).length;if(cnt!==1)continue;
  const text=cl.map(([i,v])=>Math.random()<0.35?`${nm[i]} дружит с тем, кто ${th.who[v].startsWith('на ')?'играет '+th.who[v]:th===THEMES[0]?'держит дома '+th.who[v]:'занимается '+th.who[v]}.`:`${nm[i]} ${th.neg[v]}.`);
  return {th,vals,nm,sol,cl,text,n};}}
function lgTable(P,g){const n=P.n;const c=v=>v===1?'<b style="color:var(--ok)">✓</b>':v===-1?'<span style="color:var(--bad)">✗</span>':'';
  return `<table style="border-collapse:collapse;margin:8px 0;font-size:15px"><tr><th style="padding:4px 8px"></th>${P.vals.map(v=>`<th style="padding:4px 8px;border-bottom:1px solid var(--line)">${v}</th>`).join('')}</tr>${P.nm.map((x,i)=>`<tr><th style="padding:4px 8px;text-align:left;border-right:1px solid var(--line)">${x}</th>${range(0,n-1).map(v=>`<td style="padding:4px 8px;text-align:center;border:1px solid var(--line);min-width:28px">${c(g[i][v])}</td>`).join('')}</tr>`).join('')}</table>`;}
function lgExplain(P){const st=propagate(P.n,P.cl);const g0=range(0,P.n-1).map(()=>Array(P.n).fill(0));P.cl.forEach(([i,v])=>g0[i][v]=-1);
  const steps=st.steps.map(([k,i,v])=>k==='row'?`В строке «${P.nm[i]}» остался один свободный вариант — «${P.vals[v]}» → ✓, а в столбце «${P.vals[v]}» у остальных ставим ✗.`:`В столбце «${P.vals[v]}» остался один свободный — ${P.nm[i]} → ✓, остальное в строке ${P.nm[i]} — ✗.`);
  return {start:lgTable(P,g0),steps,end:lgTable(P,st.g)};}

/* ---------- pouring BFS ---------- */
function pourBFS(caps,start,isGoal,src){ // caps array; src: unlimited water (fill/empty allowed)
  const key=s=>s.join(',');const prev=new Map();prev.set(key(start),null);const q=[start];
  while(q.length){const s=q.shift();if(isGoal(s)){const path=[];let k=key(s);while(prev.get(k)){const [p,a]=prev.get(k);path.unshift({s:k.split(',').map(Number),a});k=p;}return path;}
    const moves=[];const n=caps.length;
    if(src)for(let i=0;i<n;i++){if(s[i]<caps[i]){const t=s.slice();t[i]=caps[i];moves.push([t,`наполнить ${caps[i]}-литровый`]);}if(s[i]>0){const t=s.slice();t[i]=0;moves.push([t,`вылить ${caps[i]}-литровый`]);}}
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!==j&&s[i]>0&&s[j]<caps[j]){const t=s.slice();const d=Math.min(s[i],caps[j]-s[j]);t[i]-=d;t[j]+=d;moves.push([t,`перелить из ${caps[i]}-литрового в ${caps[j]}-литровый`]);}
    for(const [t,a] of moves){const k=key(t);if(!prev.has(k)){prev.set(k,[key(s),a]);q.push(t);}}}
  return null;}
function pourTable(caps,start,path){return `<table style="border-collapse:collapse;margin:8px 0;font-size:15px"><tr><th style="padding:3px 8px;text-align:left">Действие</th>${caps.map(c=>`<th style="padding:3px 8px">${c} л</th>`).join('')}</tr><tr><td style="padding:3px 8px;color:var(--muted)">в начале</td>${start.map(x=>`<td style="padding:3px 8px;text-align:center">${x}</td>`).join('')}</tr>${path.map((p,i)=>`<tr><td style="padding:3px 8px;border-top:1px solid var(--line)">${i+1}) ${p.a}</td>${p.s.map(x=>`<td style="padding:3px 8px;text-align:center;border-top:1px solid var(--line)">${x}</td>`).join('')}</tr>`).join('')}</table>`;}

<div class="box rule"><b>Главная идея</b>Дели монеты на <b>три кучки</b>: две одинаковые — на весы, третью — в сторону. Весы покажут одно из трёх: «легче левая», «легче правая», «равны» (тогда фальшивка в отложенной кучке).<br>За 1 взвешивание — среди <b>3</b> монет, за 2 — среди <b>9</b>, за 3 — среди <b>27</b>, за k — среди <b>3<sup>k</sup></b>.</div>
<p><b>Почему тройки, а не половинки?</b> У весов три исхода, а не два. Деля пополам, ты «тратишь» исход «равны» впустую — он никогда не выпадет.</p>
<ol class="steps"><li>9 монет: кладём 3 и 3, 3 откладываем. Узнали тройку с фальшивкой.</li><li>Из этой тройки кладём 1 и 1. Легче — она; равны — фальшивка та, что в стороне.</li></ol>
<div class="widget" id="w-coins"></div>
<div class="box err"><b>Ошибка</b>«10 монет — нужно 2 взвешивания, ведь 10 почти 9». Нет: 9 = 3² — предел для 2 взвешиваний, для 10 монет нужно 3.</div>
<div class="box tip"><b>Почему нельзя быстрее</b>Это «оценка»: после k взвешиваний может быть не больше 3·3·…·3 = 3<sup>k</sup> разных исходов, а каждая монета должна дать свой исход.</div>`},
{title:'Переливания',lvl:5,html:`
<p class="hook">В фильме «Крепкий орешек 3» герои должны за несколько минут получить ровно 4 галлона воды с помощью канистр на 3 и 5 галлонов — иначе взорвётся бомба. Ты решишь это быстрее Брюса Уиллиса.</p>
<div class="box rule"><b>Что можно делать</b>• наполнить сосуд доверху; • вылить сосуд целиком; • переливать из одного в другой, <b>пока первый не опустеет или второй не наполнится</b>. Делений на сосудах нет!</div>
<div class="fig">${vessels([{cap:3,amt:0},{cap:5,amt:4}])}</div><p class="small" style="text-align:center;margin-top:0">цель: 4 л в 5-литровой канистре</p>
<p><b>Как решать.</b> Веди <b>таблицу состояний</b>: после каждого действия записывай, сколько где воды. Решение для 3 и 5 → 4: наполнили 5 (0, 5) → перелили в 3 (3, 2) → вылили 3 (0, 2) → перелили (2, 0) → наполнили 5 (2, 5) → долили 3 (3, 4). Готово!</p>
<div class="box tip"><b>Когда вообще можно?</b>Отмерить можно только количество, которое делится на <b>НОД объёмов</b> (и не больше большого сосуда). Сосуды 4 и 6 л: НОД = 2, поэтому 3 л не получить никогда — вся вода будет ходить «по 2 литра».</div>
<div class="box err"><b>Ошибка</b>«Отолью половину на глаз» — нельзя: меряем только «до края» и «до дна».</div>
<div class="fact">Говорят, что французский математик Симеон Пуассон в юности решил задачу о переливании и после этого решил стать математиком. Задачу про сосуды 8, 5 и 3 литра до сих пор называют задачей Пуассона.</div>`},
{title:'Инварианты и задачи «с конца»',lvl:6,html:`
<p class="hook">Шоколадка 6×4 из 24 долек. Ломаем по одному куску вдоль линий. Сколько разломов нужно, чтобы получить все дольки? Как ни ломай — <b>ровно 23</b>. Почему? Каждый разлом увеличивает число кусков ровно на 1!</p>
<div class="box rule"><b>Инвариант</b>— величина или свойство, которое <b>не меняется</b> при разрешённых действиях (чётность, сумма, остаток…). Если в начале оно одно, а в желаемом конце другое — получить такой конец <b>нельзя</b>.</div>
<div class="box ex"><b>Пример</b>На доске числа 1, 2, 3, 4, 5. Можно стереть два числа и написать их разность. Останется одно число. Чётное или нечётное? Сумма 15 нечётна. Заменяя a и b на a − b, сумма меняется на 2b — чётно. Чётность суммы — инвариант → в конце нечётное число.</div>
<div class="box rule"><b>Задачи «с конца»</b>Если известен <b>конец</b>, а не начало, — иди назад: делай <b>обратные</b> действия в <b>обратном</b> порядке. «+» ↔ «−», «·» ↔ «:», «отдал половину и ещё одно» ↔ «прибавь одно и удвой».</div>
<div class="box ex"><b>Пример</b>Задумал число, умножил на 3, прибавил 4, получил 25. Назад: 25 − 4 = 21, 21 : 3 = 7.</div>
<div class="box err"><b>Ошибка</b>Делать обратные действия в <b>прямом</b> порядке: 25 : 3 … — не делится, и всё сломалось.</div>`},
{title:'Перебор: сколько способов',lvl:7,html:`
<p class="hook">У тебя 4 футболки и 3 пары джинсов. Сколько дней подряд можно приходить в школу в новом сочетании? Не 7, а 12!</p>
<div class="box rule"><b>Правило умножения</b>Если первый выбор можно сделать <b>a</b> способами, а второй (после любого первого) — <b>b</b> способами, то пару выборов — <b>a·b</b> способами.</div>
<p><b>Почему:</b> к каждой из 4 футболок можно надеть любые из 3 джинсов: 3 + 3 + 3 + 3 = 4·3.</p>
<div class="box ex"><b>Пример</b>Сколько трёхзначных чисел из цифр 1, 2, 3, если цифры не повторяются? Первая — 3 варианта, вторая — 2 (одну уже взяли), третья — 1. Всего 3·2·1 = 6: 123, 132, 213, 231, 312, 321.</div>
<div class="box tip"><b>Перебирай по порядку</b>Выписывай варианты «по возрастанию» или деревом — так ничего не потеряешь и не повторишь.</div>
<div class="box err"><b>Ошибка с нулём</b>Трёхзначное число не может начинаться с 0. Из цифр 0, 1, 2 (без повторов) получится не 6, а 2·2·1 = 4 числа: 102, 120, 201, 210.</div>
<div class="box err"><b>Ошибка с парами</b>Рукопожатия: 5 человек, каждый пожал руку каждому. 5·4 = 20 — неверно: рукопожатие Ани с Борей и Бори с Аней — одно и то же. Ответ 20 : 2 = 10.</div>`},
{title:'Олимпиадные приёмы ★',lvl:8,html:`
<p class="hook">Шахматную доску 8×8 без двух противоположных угловых клеток нельзя разрезать на доминошки 1×2. Доказательство занимает одну строчку — если знаешь, куда смотреть.</p>
<div class="fig">${board(8,[[0,0],[7,7]])}</div><p class="small" style="text-align:center;margin-top:0">вырезаны a1 и h8 — обе тёмные</p>
<div class="box rule"><b>Раскраска</b>Каждая доминошка накрывает <b>одну тёмную и одну светлую</b> клетку. Значит, у фигуры, которую можно разрезать на доминошки, тёмных и светлых клеток поровну. У доски без a1 и h8 тёмных 30, светлых 32 → нельзя.</div>
<div class="box rule"><b>Оценка + пример</b>Чтобы найти «наибольшее» или «наименьшее», нужно две вещи: <b>оценка</b> (доказать, что лучше нельзя) и <b>пример</b> (показать, что столько можно).</div>
<div class="box tip"><b>Сначала угадай на маленьком примере</b>Не знаешь, как подступиться к 100 монетам или 2026 жителям? Реши для 3, 4, 5 — увидишь закономерность, а потом объясни её.</div>`},
{title:'Шпаргалка',html:`<ul class="steps">
<li>Рыцари/лжецы: предположи → проверь → выкинь противоречия.</li>
<li>Таблица: ✗ из условий, один свободный в строке/столбце → ✓.</li>
<li>Дирихле: кроликов больше, чем клеток → где-то двое. Ищи «клетки» и худший случай.</li>
<li>Чётность: сумма чётна ⇔ нечётных слагаемых чётное число.</li>
<li>Взвешивания: три кучки; за k взвешиваний — 3<sup>k</sup> монет.</li>
<li>Переливания: таблица состояний; отмерить можно только кратное НОД.</li>
<li>Инвариант не меняется. «С конца» — обратные действия в обратном порядке.</li>
<li>Правило умножения: a·b. Пары без порядка — дели на 2.</li></ul>`}
];

G(1,()=>CH('Как решать задачи «кто чем занимается» с помощью таблицы?','Строки — люди, столбцы — варианты; по условиям ставим ✗, а если в строке или столбце остался один свободный квадратик — ставим ✓ и вычёркиваем остальные в его строке и столбце',['Строки — люди, столбцы — варианты; ставим ✓ туда, где больше всего пустых клеток','Записываем условия в столбик и выбираем вариант, который встречается чаще всего','Ставим ✓ в первую свободную клетку каждой строки'],
 {short:'В каждой строке и каждом столбце ровно одна ✓.',
 explain:'Метод таблицы: каждое «не» → ✗. Так как у каждого <b>ровно один</b> вариант и каждый вариант у <b>ровно одного</b> человека, в каждой строке и столбце ровно одна ✓. Остался один свободный — значит, он и есть ✓, а остальные клетки его столбца и строки — ✗.',
 explain2:'Это как судоку, только проще: в каждой строке и каждом столбце должна быть одна ✓. Ставить ✓ «на удачу» нельзя — только туда, где других вариантов уже нет.'}),'r');
G(1,()=>{const nm=['Белов','Чернов','Рыжов'],hair=['блондин','брюнет','рыжий'];const X=R(0,2);
 const all=perms([0,1,2]).filter(p=>p.every((h,i)=>h!==i)&&p[0]!==1);const sol=all[0]; // Belov red, Chernov blond, Ryzhov brunet
 return {type:'choice',q:`Встретились трое: Белов, Чернов и Рыжов. Брюнет сказал Белову: «Забавно: один из нас блондин, другой брюнет, третий рыжий, но ни у кого цвет волос не совпадает с фамилией». Какого цвета волосы у ${['Белова','Чернова','Рыжова'][X]}?`,opts:['светлые (блондин)','чёрные (брюнет)','рыжие'],ansText:hair[sol[X]],ans:sol[X],
 hint:'Брюнет разговаривает с Беловым — значит, Белов не брюнет.',
 short:`Белов — рыжий, Чернов — блондин, Рыжов — брюнет. ${nm[X]} — ${hair[sol[X]]}.`,
 explain:`Таблица «фамилия × цвет»:<br>• Белов не блондин (фамилия) и не брюнет (брюнет говорит <b>с</b> ним, а не сам с собой) → Белов <b>рыжий</b>.<br>• Чернов не брюнет (фамилия) и не рыжий (рыжий уже Белов) → Чернов <b>блондин</b>.<br>• Рыжову остаётся <b>брюнет</b>.<br>Значит, ${nm[X]} — <b>${hair[sol[X]]}</b>.`,
 explain2:`Перебор: всего 6 способов раздать цвета. Условие «цвет не совпадает с фамилией» оставляет 2: (Белов-брюнет, Чернов-рыжий, Рыжов-блондин) и (Белов-рыжий, Чернов-блондин, Рыжов-брюнет). Первый не годится — Белов не может быть брюнетом, ведь брюнет обращается к Белову. Остаётся второй.`};});
const lgTask=(n)=>()=>{const P=lgPuzzle(n);const askVal=Math.random()<0.5;const E=lgExplain(P);
 let q,opts,ans;
 if(askVal){const v=R(0,n-1);const who=P.sol.indexOf(v);q=`${P.th.q} ${P.th.who[v]}?`;opts=P.nm.slice();ans=who;}
 else{const i=R(0,n-1);q=`${P.nm[i]} ${P.th.verb}…`;opts=P.th.who.slice(0,n);ans=P.sol[i];}
 return {type:'choice',q:`${P.nm.join(', ')} — у каждого ${n===3?'одно':'одно'} из: ${P.vals.join(', ')} (у всех разное).<br>${P.text.join(' ')}<br><b>${q}</b>`,opts,ans,
  hint:'Нарисуй таблицу: строки — имена, столбцы — варианты. Каждое условие даёт ✗.',
  short:`Итог: ${P.nm.map((x,i)=>`${x} — ${P.vals[P.sol[i]]}`).join(', ')}.`,
  explain:`Отметим условия в таблице (каждая фраза — это ✗; «дружит с тем, кто…» значит, что сам он не такой):${E.start}${E.steps.map((s,i)=>`${i+1}) ${s}`).join('<br>')}${E.end}Ответ: <b>${opts[ans]}</b>.`,
  explain2:`Проверка ответа: ${P.nm.map((x,i)=>`${x} — ${P.vals[P.sol[i]]}`).join(', ')}. Каждое условие выполнено: ${P.cl.map(([i,v])=>`${P.nm[i]} — не ${P.vals[v]} ✅`).join('; ')}. И другого распределения нет: таблица привела к ответу без угадываний — каждый ✓ был вынужденным.`};};
G(1,lgTask(3));G(1,lgTask(4));

G(2,()=>CH('Как звучит принцип Дирихле?','Если кроликов больше, чем клеток, то хотя бы в одной клетке сидят не меньше двух кроликов',['Если кроликов больше, чем клеток, то в каждой клетке сидят не меньше двух кроликов','Если кроликов больше, чем клеток, то ровно в одной клетке сидят два кролика','Если кроликов столько же, сколько клеток, то в каждой клетке по одному кролику'],
 {short:'«Хотя бы в одной» клетке — не меньше двух.',

G(2,()=>{const k=R(2,6),cols=['красные','синие','зелёные','чёрные','белые','жёлтые'].slice(0,k);const same=Math.random()<0.5;const m=same?R(3,4):2;const ans=(m-1)*k+1;
 return {type:'num',q:`В ящике лежат носки ${k} цветов: ${cols.join(', ')} — каждого цвета много. Какое наименьшее количество носков нужно вытащить не глядя, чтобы среди них <b>наверняка</b> нашлись ${m===2?'два носка одного цвета':`${m} носка одного цвета`}?`,ans,

G(2,()=>{let a=R(3,12),b=R(3,12);if(a===b)b++;const v=pick(['red','both','red2']);

 return {type:'num',q:`В мешке лежат шары: красных — ${a}, синих — ${b}. Какое наименьшее число шаров нужно вытащить не глядя, чтобы среди них наверняка были ${what}?`,ans,

G(2,()=>{const n=R(25,40);const k=Math.ceil(n/12);

/* L3 — parity */
G(3,()=>CH('Когда сумма нескольких целых чисел чётна?','Когда среди слагаемых чётное количество нечётных чисел',['Когда все слагаемые чётные (и только тогда)','Когда слагаемых чётное количество','Когда хотя бы одно слагаемое чётное'],
 {short:'Считаем только нечётные слагаемые: их чётное число → сумма чётна.',
 explain:'Чётные слагаемые на чётность не влияют. Нечётные «гасят» друг друга парами: нечёт + нечёт = чёт. Поэтому <b>сумма чётна ⇔ нечётных слагаемых чётное количество</b>.<br>«Все чётные» — слишком узко (3 + 5 = 8 чётно). «Слагаемых чётное число» — неверно (1 + 2 = 3). «Хотя бы одно чётное» — неверно (2 + 3 = 5).',
 explain2:'Проверь на примерах: 1 + 3 + 5 = 9 (три нечётных — нечётно), 1 + 3 + 5 + 7 = 16 (четыре нечётных — чётно), 2 + 4 + 1 = 7 (одно нечётное — нечётно).'}),'r');
G(3,()=>{const n=R(4,9);const S=n*(n+1)/2;const vals=new Map();for(let m=0;m<(1<<(n-1));m++){let s=1;const sg=[];for(let i=2;i<=n;i++){const neg=m>>(i-2)&1;s+=neg?-i:i;sg.push(neg?'−':'+');}if(!vals.has(s))vals.set(s,sg);}
 const yes=Math.random()<0.45;let k;
 if(yes){const c=[...vals.keys()].filter(x=>x!==S&&Math.abs(x)<S);k=pick(c);}else{const c=range(-S+1,S-1).filter(x=>!vals.has(x)&&(x-S)%2!==0);k=pick(c);}
 const row=range(1,n).join(' ? ');const ks=k<0?'−'+(-k):String(k);
 const expr=yes?'1 '+vals.get(k).map((s,i)=>`${s} ${i+2}`).join(' ')+' = '+ks:'';
 return YN(`Можно ли вместо знаков «?» поставить «+» или «−» так, чтобы получилось верное равенство?<br><span class="m">${row} = ${ks}</span>`,yes,{
 hint:`Посчитай 1 + 2 + … + ${n}. Что происходит с суммой, если один «+» заменить на «−»?`,
 short:yes?`Можно: <span class="m">${expr}</span>.`:`Нельзя: 1 + … + ${n} = ${S} — ${S%2?'нечётное':'чётное'}, а смена знака меняет сумму на чётное число. ${ks} — ${Math.abs(k)%2?'нечётное':'чётное'}.`,
 explain:yes?`Можно. Например: <span class="m">${expr}</span>. Проверка чётностью: 1 + … + ${n} = ${S} и ${ks} одной чётности — ${S%2?'оба нечётные':'оба чётные'}, так что противоречия нет, а пример подобрали перебором.`
  :`Сначала поставим все «+»: 1 + 2 + … + ${n} = <b>${S}</b> — ${S%2?'нечётное':'чётное'} число.<br>Если перед числом x поменять «+» на «−», сумма уменьшится на 2x — на <b>чётное</b> число. Значит, при любых знаках результат будет ${S%2?'нечётным':'чётным'}.<br>А ${ks} — ${Math.abs(k)%2?'нечётное':'чётное'}. Поэтому <b>нельзя</b>.`,
 explain2:yes?`Как искать пример: от суммы ${S} нужно «отнять» ${S-k}, а смена знака у x отнимает 2x. Значит, нужно набрать числа с суммой ${(S-k)/2} и поставить перед ними «−».`:`Можно и так: в выражении ${n} чисел, из них нечётных ${Math.ceil(n/2)}. Знак не меняет чётность числа (−3 тоже нечётное). Нечётных слагаемых ${Math.ceil(n/2)} — ${Math.ceil(n/2)%2?'нечётное':'чётное'} количество → результат всегда ${S%2?'нечётный':'чётный'}.`},['Да, можно','Нет, нельзя']);});
G(3,()=>{const n=R(5,31),d=R(1,Math.min(5,n-1));const yes=(n*d)%2===0;
 const constr=d%2===0?`Посадим всех по кругу, и пусть каждый дружит с ${d/2} ближайшими соседями слева и ${d/2} справа — у каждого ровно ${d} ${plural(d,'друг','друга','друзей')}.`:`Посадим всех по кругу (их ${n} — чётное число). Пусть каждый дружит ${d>1?`с ${(d-1)/2} ближайшими соседями слева и справа и `:''}с тем, кто сидит прямо напротив. У каждого ровно ${d} ${plural(d,'друг','друга','друзей')}.`;
 return YN(`В классе ${n} ${plural(n,'ученик','ученика','учеников')}. Может ли быть так, что каждый дружит ровно с ${d} ${plural(d,'одноклассником','одноклассниками','одноклассниками')}?`,yes,{

 explain:`Сложим числа друзей всех учеников: ${n}·${d} = <b>${n*d}</b>. Каждая дружба (пара друзей) посчитана <b>два раза</b> — у обоих друзей. Значит, сумма обязана быть чётной.<br>${yes?`${n*d} — чётно, противоречия нет. Пример: ${constr}`:`${n*d} — нечётно → <b>так быть не может</b>.`}`,

G(3,()=>{const n=R(5,16);const S=n*(n+1)/2;const yes=S%2===0;let g=[];if(yes){let t=S/2;for(let x=n;x>=1;x--)if(x<=t){g.push(x);t-=x;}}

 explain:`1 + 2 + … + ${n} = ${n}·${n+1} : 2 = <b>${S}</b>. Если суммы групп равны, каждая равна ${S} : 2.<br>${yes?`${S} : 2 = ${S/2} — целое. Пример: {${g.join(', ')}} (сумма ${S/2}) и {${other.join(', ')}} (сумма ${S/2}). <b>Можно</b>.`:`${S} — <b>нечётное</b>, на две равные целые части не делится. <b>Нельзя</b>.`}`,
 explain2:yes?`Как найти пример: бери числа с самого большого, пока не превысишь ${S/2}: ${g.join(' + ')} = ${S/2}. Остальные числа сами дадут вторую половину.`:`Две одинаковые суммы — это x + x = 2x, а 2x — всегда чётно. Значит, общая сумма должна быть чётной. А у нас ${S}.`},['Да, можно','Нет, нельзя']);});

G(7,()=>CH('Как звучит правило умножения в комбинаторике?','Если первый выбор можно сделать a способами, а второй (после любого первого) — b способами, то оба выбора вместе — a·b способами',['Если первый выбор можно сделать a способами, а второй — b способами, то оба вместе — a + b способами','Число способов всегда равно количеству предметов','Если есть a и b способов, то всего способов a·b : 2'],
 {short:'Каждый из a вариантов сочетается с каждым из b → a·b.',
 explain:'<b>Правило умножения</b>: к каждому из a первых выборов можно присоединить любой из b вторых, получается b + b + … + b (a раз) = <b>a·b</b>. «a + b» — это если выбираем что-то <b>одно</b>: <i>или</i> из первой группы, <i>или</i> из второй.',
 explain2:'3 футболки и 2 шорт: Ф1-Ш1, Ф1-Ш2, Ф2-Ш1, Ф2-Ш2, Ф3-Ш1, Ф3-Ш2 — 6 = 3·2 комплектов. А если ты выбираешь только одну вещь (футболку или шорты) — 3 + 2 = 5 вариантов.'}),'r');
G(7,()=>{const a=R(3,7),b=R(2,6),c=Math.random()<0.5?R(2,4):0;const ans=a*b*(c||1);
 return {type:'num',q:`У Пашки ${a} ${plural(a,'футболка','футболки','футболок')}, ${b} ${plural(b,'пара','пары','пар')} штанов${c?` и ${c} ${plural(c,'пара','пары','пар')} кроссовок`:''}. Сколькими способами он может одеться (${c?'футболка, штаны и кроссовки':'футболка и штаны'})?`,ans,
 short:`${a}·${b}${c?'·'+c:''} = ${ans}.`,
 explain:`К каждой из ${a} футболок можно надеть любые из ${b} штанов: ${a}·${b} = ${a*b} ${plural(a*b,'комплект','комплекта','комплектов')}${c?`. К каждому комплекту — любые из ${c} кроссовок: ${a*b}·${c} = ${ans}`:''}. Ответ: <b>${ans}</b>.<div class="box err"><b>Ошибка</b>${a} + ${b}${c?' + '+c:''} = ${a+b+c} — так считают, когда выбирают <b>одну</b> вещь, а не комплект.</div>`,
 explain2:`Нарисуй дерево: от «старта» ${a} веточек-футболок, от каждой — ${b} веточек-штанов${c?`, от каждой из них — ${c} веточек-кроссовок`:''}. Концов у дерева: ${ans}.`};});
G(7,()=>{for(;;){const zero=Math.random()<0.5;const k=R(3,5);const D=(zero?[0]:[]).concat(sample(range(1,9),zero?k-1:k)).sort((a,b)=>a-b);const rep=Math.random()<0.4;
 let cnt=0;for(const a of D)for(const b of D)for(const c of D){if(a===0)continue;if(!rep&&(a===b||b===c||a===c))continue;cnt++;}
 const f1=zero?k-1:k,f2=rep?k:k-1,f3=rep?k:k-2;if(f1*f2*f3!==cnt)continue;
 return {type:'num',q:`Сколько трёхзначных чисел можно составить из цифр ${D.join(', ')}, если цифры ${rep?'<b>могут</b> повторяться':'<b>не</b> повторяются'}?`,ans:cnt,
 hint:zero?'Помни: трёхзначное число не может начинаться с нуля.':'Сколько вариантов для первой цифры? Для второй?',
 short:`${f1}·${f2}·${f3} = ${cnt}.`,
 explain:`Выбираем цифры по очереди:<br>• первая (сотни): ${f1} ${plural(f1,'вариант','варианта','вариантов')}${zero?' — ноль нельзя':''};<br>• вторая (десятки): ${f2}${rep?' — любая из '+k:' — любая, кроме уже взятой'+(zero?' (теперь ноль можно)':'')};<br>• третья (единицы): ${f3}${rep?'':' — кроме двух уже взятых'}.<br>По правилу умножения: ${f1}·${f2}·${f3} = <b>${cnt}</b>.`,
 explain2:`Представь три пустые клеточки □□□ и заполняй их по очереди. Для первой клеточки — ${f1} ${plural(f1,'вариант','варианта','вариантов')}. Какую бы ты ни поставил, для второй остаётся ${f2}, для третьей — ${f3}. Например, числа, начинающиеся с ${D.find(x=>x>0)}: их ${f2}·${f3} = ${f2*f3}. Таких «пачек» ${f1}, всего ${f1}·${f2*f3} = ${cnt} (компьютер перебором насчитал столько же).`};}});

  explain2:`Сравни с задачей «выбрать двух дежурных»: там Аня+Боря и Боря+Аня — одно и то же, и ответ делят на 2. А у капитана и заместителя разные роли — делить не нужно.`};
 const ans=n*(n-1)/2;
 return {type:'num',q:v==='hand'?`Встретились ${n} друзей, и каждый пожал руку каждому. Сколько было рукопожатий?`:`В классе ${n} ${plural(n,'ученик','ученика','учеников')}. Сколькими способами можно выбрать двух дежурных?`,ans,

 explain:`Каждый из ${n} человек ${v==='hand'?`пожимает руку ${n-1} другим`:`может попасть в пару с любым из ${n-1} других`}: ${n}·${n-1} = ${n*(n-1)}. Но так каждая пара посчитана <b>дважды</b> (Аня–Боря и Боря–Аня). Делим на 2: <b>${ans}</b>.`,
 explain2:`Посчитай по очереди: первый ${v==='hand'?'пожимает руки':'составляет пары с'} ${n-1} остальным, второй — с ${n-2} новыми (с первым уже было), третий — с ${n-3}… ${range(1,n-1).reverse().join(' + ')} = ${ans}.`};});
G(7,()=>{const s=R(3,9);let cnt=0;for(let x=100;x<1000;x++){const d=String(x).split('').map(Number);if(d[0]+d[1]+d[2]===s)cnt++;}
 const rows=range(1,s).map(a=>`сотни ${a}: десятки + единицы = ${s-a} → ${s-a+1} ${plural(s-a+1,'вариант','варианта','вариантов')}`);
 return {type:'num',q:`Сколько существует трёхзначных чисел, сумма цифр которых равна ${s}?`,ans:cnt,

 short:`${range(1,s).map(a=>s-a+1).join(' + ')} = ${cnt}.`,

 explain2:`Проверим маленький кусочек: сотни = ${s}, тогда остаток 0 → только ${s}00. Сотни = ${s-1}: остаток 1 → ${s-1}10 и ${s-1}01 — два числа. Каждый шаг добавляет по одному варианту — получается сумма ${cnt}.`};});

 {short:'Раскраска: в каждой доминошке 1 тёмная + 1 светлая.',
 explain:'Приём <b>раскраски</b>: раскрась клетки в шахматном порядке. Любая доминошка 1×2 накрывает <b>одну тёмную и одну светлую</b>. Значит, если фигуру можно разрезать на доминошки, тёмных и светлых клеток в ней поровну. Если не поровну — нельзя.',

G(8,()=>{const N=R(7,14);const mode=pick(['min','max']);let best=mode==='min'?99:-1,ex=null;
 for(let m=0;m<(1<<N);m++){const k=range(0,N-1).map(i=>!!(m>>i&1));let ok=true;for(let i=0;i<N&&ok;i++){const l=k[(i+N-1)%N],r=k[(i+1)%N];const st=!l&&!r;if(st!==k[i])ok=false;}
  if(!ok)continue;const c=k.filter(x=>x).length;if(mode==='min'?c<best:c>best){best=c;ex=k;}}
 const pat=ex.map(x=>x?'Р':'Л').join(' ');
 return {type:'num',q:`За круглым столом сидят ${N} жителей острова рыцарей и лжецов. Каждый сказал: «Оба моих соседа — лжецы». Какое <b>${mode==='min'?'наименьшее':'наибольшее'}</b> число рыцарей может быть за столом?`,ans:best,
 hint:mode==='min'?'Если у лжеца оба соседа — лжецы, то его фраза правдива. Значит, рядом с каждым лжецом сидит рыцарь.':'Могут ли два рыцаря сидеть рядом?',
 short:`${mode==='min'?'Оценка: каждый рыцарь «прикрывает» не больше 2 лжецов':'Оценка: рыцари не сидят рядом'} → ${best}. Пример: ${pat}.`,
 explain:mode==='min'?`<b>Оценка.</b> Лжец солгал, значит, хотя бы один его сосед — рыцарь. Рыцарь сказал правду: оба его соседа — лжецы. Каждый рыцарь может быть соседом не больше чем <b>двух</b> лжецов. Если рыцарей k, то лжецов не больше 2k, и всех вместе не больше 3k. ${N} ≤ 3k → k ≥ ${N/3%1?(N/3).toFixed(2).replace('.',','):N/3} → k ≥ <b>${best}</b>.<br><b>Пример</b> на ${best} (по кругу): ${pat}. Каждый Р сидит между двумя Л ✅, у каждого Л есть сосед Р ✅.<br>Ответ: <b>${best}</b>.`
  :`<b>Оценка.</b> У рыцаря оба соседа — лжецы, значит, два рыцаря рядом не сидят. Тогда рыцари занимают не больше половины мест: k ≤ ${N} : 2 → k ≤ <b>${best}</b>.<br><b>Пример</b> на ${best} (по кругу): ${pat}. Каждый Р — между двумя Л ✅, у каждого Л есть сосед Р ✅.<br>Ответ: <b>${best}</b>.`,
 explain2:`Это задача «оценка + пример»: нужно и доказать, что ${mode==='min'?'меньше':'больше'} ${best} нельзя, и показать расстановку на ${best}. Компьютерный перебор всех ${2**N} рассадок даёт тот же ответ. Попробуй сначала на маленьком столе — 6 человек: ${mode==='min'?'Р Л Л Р Л Л — 2 рыцаря':'Р Л Р Л Р Л — 3 рыцаря'}.`};},'s');
