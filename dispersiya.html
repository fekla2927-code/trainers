<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дисперсия и рассеивание — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}

h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}

.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}

.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}

@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}

.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}

.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}

.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}

.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}

.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}

.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}

.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}

.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}

.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}

.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

/* ---------- state ---------- */
let T=null,LS_KEY='';
const store={get(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}},clear(){try{localStorage.removeItem(LS_KEY);}catch(e){}}};
let S=null;
const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- layout ---------- */
function build(){
  T=window.TOPIC;LS_KEY=window.PROF?PROF.key('trainer:'+T.id):'trainer:'+T.id;
  document.title=T.title+' — тренажёр';
  const symTab=T.symbols?(T.symbols.tab||'Знаки'):null;
  document.body.innerHTML=`
  <header class="top"><div class="wrap">
    <div class="brand"><a class="home" href="index.html">← Все тренажёры</a>${T.title}<small>${T.subtitle||''}</small></div>
    <nav class="tabs" role="tablist">
      <button data-v="theory" aria-selected="true">Теория</button>
      ${symTab?`<button data-v="sym" aria-selected="false">${symTab}</button>`:''}
      <button data-v="train" aria-selected="false">Тренажёр</button>
    </nav>
    <button class="theme-btn" id="themeBtn" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
  </div></header>
  <main class="wrap">
    <section class="view on theory" id="v-theory"></section>
    ${symTab?'<section class="view" id="v-sym"></section>':''}
    <section class="view" id="v-train"></section>
  </main>`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme=dark?'light':'dark';
    try{localStorage.setItem('trainer:theme',document.documentElement.dataset.theme);}catch(e){}
  };
  try{const th=localStorage.getItem('trainer:theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
  if(window.PROF)PROF.mount($('header.top .wrap'),$('main.wrap'));
  renderTheory();
  if(symTab)renderSym();
  renderStart();
}
function show(v){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v?'true':'false'));
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  window.scrollTo({top:0});
}
function fillFigs(root){
  root.querySelectorAll('[data-fig]').forEach(el=>{
    const f=T.figs&&T.figs[el.dataset.fig];
    if(f){try{el.innerHTML=f(el.dataset);}catch(e){console.error(e);}}
  });
}
function renderTheory(){
  const v=$('#v-theory');
  let h=`<div class="card"><h1>${T.title}: объясняю просто</h1>${T.intro||''}
    <div class="row" style="margin-top:8px"><button class="btn" id="goTrain">Перейти к задачам →</button></div></div>`;
  T.theory.forEach((s,i)=>{
    h+=`<div class="card" id="th-${i}" data-lvl="${s.lvl==null?'':s.lvl}"><h2><span class="n">${i+1}</span><span>${s.title}</span></h2>${s.html}</div>`;
  });
  h+=`<div class="card"><div class="row"><button class="btn" id="goTrain2">Всё прочитал — к задачам →</button></div></div>`;
  v.innerHTML=h;
  fillFigs(v);
  if(window.PY)PY.mountRuns(v);
  if(T.onTheory){try{T.onTheory(v);}catch(e){console.error(e);}}
  $('#goTrain').onclick=()=>show('train');
  $('#goTrain2').onclick=()=>show('train');
}
function renderSym(){
  const v=$('#v-sym');const sy=T.symbols;
  let h=`<div class="card"><h1>${sy.title||'Что значит каждый знак'}</h1>${sy.intro||''}
  <table class="sym"><thead><tr><th>Знак</th><th>Как называется и читается</th><th>Что значит простыми словами</th><th>Пример</th></tr></thead><tbody>`;
  sy.rows.forEach(r=>{h+=`<tr><td class="s">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]||''}</td></tr>`;});
  h+=`</tbody></table>${sy.after||''}</div>`;
  v.innerHTML=h;fillFigs(v);
}

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':return H.num(t.ans);
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});
  if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),50);
  if(S&&S.cur){const back=document.getElementById('backToTask');if(!back){const b=document.createElement('button');b.id='backToTask';b.className='btn';b.textContent='← Вернуться к задаче';b.style.cssText='position:sticky;bottom:16px;margin:8px auto;display:flex';b.onclick=()=>{show('train');b.remove();};$('#v-theory').appendChild(b);}}
}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;
    const full=S.queue.length===T.gens.length;
    const ruleIdx=T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0);
    const rulesOnly=ruleIdx.length&&S.queue.length===ruleIdx.length&&S.queue.every(i=>T.gens[i].rule);
    let sr=0,sw=0;T.levels.forEach((_,i)=>{if(T.gens.some(g=>g.lvl===i&&g.star)){sr+=S.per[i].r;sw+=S.per[i].w;}});
    const star=sr+sw?Math.round(sr/(sr+sw)*100):null;
    if(tot&&full)PROF.record(T.id,{pct:Math.round(S.right/tot*100),total:tot,right:S.right,star},'закончил тренажёр «'+T.title+'»');
    else if(tot&&rulesOnly)PROF.record(T.id+':rules',{pct:Math.round(S.right/tot*100),total:tot,right:S.right},'проверка правил «'+T.title+'»');
    else if(tot&&star!=null&&S.queue.every(i=>T.gens[i].star||T.levels.length-1===T.gens[i].lvl))PROF.record(T.id+':star',{pct:star,total:sr+sw,right:sr,star},'олимпиадный уровень ★ «'+T.title+'»');
  }}catch(e){console.error(e);}
  const v=$('#v-train');const tot=S.right+S.wrong;
  const pct=tot?Math.round(S.right/tot*100):0;
  const weak=T.levels.map((l,i)=>({l,i,...S.per[i]})).filter(x=>x.w>0);
  v.innerHTML=`<div class="card"><h1>Готово! 🎉</h1>

const clsA=[4,4,4,4,4,4],clsB=[5,3,5,3,5,3];
const ex=[3,5,6,7,9];
const theory=[
{title:'Зачем нужен разброс: среднего мало',lvl:0,html:`
<p>Среднее говорит, <b>вокруг какого числа</b> собраны данные. Но оно ничего не говорит о том, <b>насколько далеко</b> значения разбегаются от этого числа.</p>
<div class="box ex"><b>Пример</b>Две группы по 6 человек написали контрольную.<br>Группа А: 4, 4, 4, 4, 4, 4 — среднее 4.<br>Группа Б: 5, 3, 5, 3, 5, 3 — среднее тоже 4!<br>Но в группе А все одинаковые, а в группе Б — то пятёрки, то тройки.</div>
<div class="figrow"><div class="fig">${dotplot(clsA,{mean:4,lo:2,hi:5,w:250,label:'Группа А',minStack:6})}</div><div class="fig">${dotplot(clsB,{mean:4,lo:2,hi:5,w:250,label:'Группа Б',minStack:6})}</div></div>
<p>Средние одинаковые, а картинки совсем разные. Значит, нужна ещё одна величина — <b>мера разброса</b> (рассеивания). Самую простую ты уже знаешь — <b>размах</b> (max − min). Но размах смотрит только на два крайних числа. Сегодня узнаем меру, которая учитывает <b>все</b> числа, — <b>дисперсию</b>.</p>
<div class="box tip"><b>Аналогия</b>Два стрелка выбили в среднем по 8 очков. Один всегда попадает в 8, другой — то в 10, то в 6. Кому ты доверишь решающий выстрел? Тому, у кого разброс меньше.</div>`},
{title:'Отклонение от среднего',lvl:1,html:`
<div class="box rule"><b>Отклонение = значение − среднее</b><span class="m">x − ${XB}</span>. Показывает, насколько число больше (плюс) или меньше (минус) среднего.</div>
<div class="box ex"><b>Пример</b>Набор 3, 5, 6, 7, 9. Среднее: (3 + 5 + 6 + 7 + 9) : 5 = 30 : 5 = 6.<br>Отклонения: 3 − 6 = −3, 5 − 6 = −1, 6 − 6 = 0, 7 − 6 = +1, 9 − 6 = +3.</div>
<div class="fig">${devPlot(ex)}</div>
<p class="small" style="text-align:center">Пунктир — среднее. Отрезок от пунктира до точки — это отклонение: вправо — плюс, влево — минус.</p>
<div class="box err"><b>Частая ошибка</b>Вычитать наоборот (среднее − значение). Тогда все знаки перевернутся. Правило: <b>из значения вычитаем среднее</b>.</div>`},
{title:'Сумма отклонений всегда 0',lvl:2,html:`
<p>Сложим отклонения из примера: (−3) + (−1) + 0 + 1 + 3 = <b>0</b>. Это не случайность — так бывает <b>всегда</b>.</p>
<div class="box rule"><b>Почему</b>Среднее — это точка равновесия. Всё, на сколько одни числа «перелезли» вверх, другие ровно на столько же «недотянули» вниз. Плюсы и минусы гасят друг друга.</div>
<div class="box tip"><b>Аналогия с качелями</b>Если на качели посадить детей так, чтобы опора была в среднем, качели будут в равновесии. Отклонения — это «рычаги» слева (минус) и справа (плюс), и они уравновешивают друг друга.</div>
<p>Из-за этого <b>среднее отклонение всегда равно 0</b> — и для группы А, и для группы Б. Значит, просто сложить отклонения, чтобы измерить разброс, нельзя. Нужно избавиться от минусов. Для этого отклонения <b>возводят в квадрат</b>: квадрат любого числа не меньше нуля, (−3)² = 9.</p>
<div class="box ex"><b>Полезный приём</b>Если известны все отклонения, кроме одного, последнее найдётся сразу: оно уравновешивает сумму. Отклонения −2, +5, −4, ? → сумма известных −1 → последнее +1.</div>`},
{title:'Дисперсия',lvl:3,html:`
<div class="box rule"><b>Дисперсия — среднее арифметическое квадратов отклонений</b>D = ((x₁ − ${XB})² + (x₂ − ${XB})² + … + (xₙ − ${XB})²) : n</div>
<ol class="steps"><li>Найди среднее ${XB}.</li><li>Найди отклонение каждого числа: x − ${XB}.</li><li>Возведи каждое отклонение в квадрат.</li><li>Сложи квадраты и раздели на количество чисел n.</li></ol>
<div class="box ex"><b>Пример: 3, 5, 6, 7, 9</b>${varTable(ex,6)}D = 20 : 5 = <b>4</b>.</div>
<div class="box ex"><b>Сравним группы</b>Группа А (все 4): все отклонения 0, D = 0.<br>Группа Б (5, 3, 5, 3, 5, 3): отклонения ±1, квадраты по 1, D = 6 : 6 = 1.<br>Дисперсия больше там, где разброс больше ✓.</div>
<div class="box tip"><b>Что важно запомнить</b>• D ≥ 0 всегда (это среднее квадратов).<br>• D = 0 только если все числа одинаковые.<br>• Чем дальше числа от среднего, тем больше D. Далёкие числа влияют особенно сильно: отклонение 2 даёт 4, а отклонение 10 — уже 100.</div>
<div class="box err"><b>Частая ошибка</b>Забыть возвести в квадрат (получится 0) или разделить не на n. В нашем учебнике делим на n — количество чисел.</div>`},
{title:'Стандартное отклонение σ',lvl:4,html:`
<p>У дисперсии есть неудобство: <b>единицы измерения в квадрате</b>. Если рост в сантиметрах, то отклонения в см, а их квадраты — в см² (квадратных сантиметрах). Странно измерять разброс роста «площадью»!</p>
<div class="box rule"><b>Стандартное отклонение σ = √D</b>σ («сигма») — корень из дисперсии. Оно измеряется в <b>тех же единицах, что и данные</b>, и показывает, на сколько <b>обычно</b> значения отходят от среднего.</div>
<div class="box ex"><b>Пример</b>Для набора 3, 5, 6, 7, 9 дисперсия D = 4, значит σ = √4 = <b>2</b>. Числа обычно отходят от среднего 6 примерно на 2.</div>
<div class="box tip"><b>Связь в обе стороны</b>σ = √D и D = σ². Если σ = 5 см, то D = 25 см².</div>`},
{title:'Сравнение разброса',lvl:5,html:`
<p>Чтобы понять, где разброс больше, сравнивают дисперсии (или σ): у кого больше — у того значения разбросаны сильнее.</p>
<div class="figrow"><div class="fig">${dotplot([9,10,10,10,11],{mean:10,lo:4,hi:16,w:250,label:'D = 0,4',minStack:3})}</div><div class="fig">${dotplot([5,8,10,12,15],{mean:10,lo:4,hi:16,w:250,label:'D = 11,6',minStack:3})}</div></div>
<div class="box tip"><b>Без вычислений</b>Если точки на одной картинке стоят кучнее вокруг среднего — там дисперсия меньше. Например, 48, 50, 52 разбросаны меньше, чем 40, 50, 60.</div>
<div class="box ex"><b>Интересный факт</b>Если добавить в набор число, <b>равное среднему</b>, дисперсия уменьшится: сумма квадратов не изменится (добавили 0), а делить будем на большее n.</div>`},
{title:'Сдвиг и растяжение данных',lvl:6,html:`
<div class="box rule"><b>Ко всем числам прибавили c</b>Дисперсия <b>не меняется</b>. Все точки сдвинулись вместе со средним, отклонения остались прежними.</div>
<div class="box ex"><b>Пример</b>1, 2, 3 → D = (1 + 0 + 1) : 3 = 2/3. Прибавим 100: 101, 102, 103 — среднее 102, отклонения те же −1, 0, 1 → D та же.</div>
<div class="box rule"><b>Все числа умножили на k</b>Отклонения умножаются на k, а их квадраты — на <b>k²</b>. Значит, <span class="m">D → k² · D</span>, а <span class="m">σ → |k| · σ</span>.</div>
<div class="box ex"><b>Пример</b>3, 5, 6, 7, 9: D = 4, σ = 2. Умножим на 3: 9, 15, 18, 21, 27 — отклонения −9, −3, 0, 3, 9, квадраты 81, 9, 0, 9, 81 → D = 180 : 5 = 36 = 9 · 4, σ = 6 = 3 · 2.</div>
<div class="box err"><b>Ловушка</b>При умножении на 3 дисперсия растёт <b>в 9 раз</b>, а не в 3. В 3 раза растёт σ.</div>`},
{title:'Диаграмма рассеивания',lvl:7,html:`
<p>Иногда у каждого объекта измеряют <b>две</b> величины: рост и массу ученика, температуру и продажи чая. Каждого ученика рисуют <b>точкой</b>: по горизонтали — одна величина, по вертикали — другая. Получается <b>диаграмма рассеивания</b>. По ней видно, связаны ли величины.</p>
<div class="figrow">
<div class="fig">${scatter([[142,30],[148,35],[150,33],[155,40],[158,38],[162,45],[165,43],[168,48],[171,52],[175,50],[178,57],[181,58]],{xl:'рост',yl:'масса'})}<div class="cap"><b>Положительная связь</b><br>больше x → обычно больше y</div></div>
<div class="fig">${scatter([[2,78],[5,72],[7,60],[10,64],[12,55],[15,52],[17,40],[20,45],[22,33],[25,30],[27,25],[30,22]],{xl:'температура',yl:'чай'})}<div class="cap"><b>Отрицательная связь</b><br>больше x → обычно меньше y</div></div>
<div class="fig">${scatter([[142,70],[148,95],[150,52],[155,80],[158,60],[162,92],[165,48],[168,75],[171,88],[175,55],[178,68],[181,90]],{xl:'рост',yl:'балл'})}<div class="cap"><b>Связи нет</b><br>точки разбросаны как попало</div></div>
</div>
<div class="box tip"><b>Как читать</b>Мысленно проведи через облако точек линию. Идёт вверх слева направо — связь положительная. Вниз — отрицательная. Облако круглое, линию не провести — связи нет.</div>
<div class="box err"><b>Важно</b>Связь — это «обычно», а не «всегда»: бывает, что более высокий ученик легче. И связь не значит, что одно <i>вызывает</i> другое.</div>`},
{title:'★ Быстрая формула для дисперсии',lvl:8,html:`
<div class="box rule"><b>D = (среднее квадратов) − (квадрат среднего)</b><span class="m">D = ${OV('x²')} − (${XB})²</span></div>
<div class="box ex"><b>Пример: 3, 5, 6, 7, 9</b>Квадраты: 9, 25, 36, 49, 81, их среднее (9 + 25 + 36 + 49 + 81) : 5 = 200 : 5 = 40.<br>Квадрат среднего: 6² = 36.<br>D = 40 − 36 = <b>4</b> — то же, что и обычным способом!</div>
<div class="box tip"><b>Когда удобно</b>Когда среднее — некрасивое число или когда в задаче дано среднее квадратов. Отсюда же следует, что среднее квадратов не меньше квадрата среднего (ведь D ≥ 0).</div>`},
{title:'Хитрости для олимпиадных задач',lvl:9,html:`
<ol class="steps"><li><b>Равноотстоящие числа</b> (1, 2, …, 9 или 3, 6, 9, …) стоят симметрично вокруг среднего — отклонения получаются −k, …, −1, 0, 1, …, k (или умноженные на шаг).</li>
<li><b>Добавили число, равное среднему</b>: сумма квадратов отклонений та же, а n на 1 больше.</li>
<li><b>Наименьшая дисперсия</b> — когда числа как можно ближе друг к другу (к среднему). <b>Наибольшая</b> — когда числа «разбежались» к краям разрешённого промежутка.</li>
<li><b>Две группы с одинаковым средним</b>: суммы квадратов отклонений складываются, n тоже складываются.</li></ol>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>Отклонение = x − ${XB}. Сумма отклонений всегда 0.</li>
<li>D = среднее квадратов отклонений (делим на n). D ≥ 0; D = 0 ⇔ все числа равны.</li>
<li>σ = √D — в тех же единицах, что данные.</li>
<li>+c ко всем: D не меняется. ·k: D·k², σ·|k|.</li>
<li>Диаграмма рассеивания: вверх — положительная связь, вниз — отрицательная, облако — нет связи.</li>
<li>★ D = ${OV('x²')} − (${XB})².</li></ul>`}
];

explain2:`Представь, что оценки — это стрелы в мишени, а среднее ${g.m} — центр. В одной группе стрелы легли кучно, в другой — разлетелись.<div class="figrow"><div class="fig">${dotplot(A,{mean:g.m,lo:2,hi:5,w:250,label:'Группа А'})}</div><div class="fig">${dotplot(B,{mean:g.m,lo:2,hi:5,w:250,label:'Группа Б'})}</div></div>`};});
G(0,()=>{for(;;){const m=R(12,20);const a=devSet(5,{r:2}).map(d=>m+d),b=devSet(5,{r:9,ok:d=>Math.max(...d)-Math.min(...d)>=12}).map(d=>m+d);
const right='Средние равны, но во втором городе температура меняется сильнее';
const opts=shuffle([right,'Раз средние равны, погода в городах одинаковая','В первом городе теплее','Во втором городе теплее']);
return {type:'choice',q:`Температура (°C) в полдень за 5 дней:<br>Город 1: ${LS(a)}<br>Город 2: ${LS(b)}<br>Какой вывод верный?`,opts,ans:opts.indexOf(right),
short:`Средние: ${N(sum(a))} : 5 = ${m} и ${N(sum(b))} : 5 = ${m}. Размах: ${Math.max(...a)-Math.min(...a)} и ${Math.max(...b)-Math.min(...b)}.`,
explain:`1) Среднее города 1: ${N(sum(a))} : 5 = ${m}; города 2: ${N(sum(b))} : 5 = ${m}. В среднем одинаково тепло — поэтому «теплее» неверно.<br>2) Но размах: город 1 — ${Math.max(...a)} − ${Math.min(...a)} = ${Math.max(...a)-Math.min(...a)}, город 2 — ${Math.max(...b)} − ${P(Math.min(...b))} = ${Math.max(...b)-Math.min(...b)}.<br>Погода не одинаковая: <b>во втором городе температура скачет сильнее</b>.`,
explain2:`Одним средним погоду не опишешь: в городе 2 то ${Math.min(...b)}°, то ${Math.max(...b)}° — нужна и куртка, и футболка. В городе 1 всё время около ${m}°.<div class="fig">${dotplot(b,{mean:m,label:'Город 2'})}</div>`};}});
G(0,()=>{const m=10;const sets=[{k:'s',v:devSet(7,{r:1,ok:d=>d.filter(x=>x).length>=4}).map(d=>m+d)},{k:'m',v:devSet(7,{r:3,ok:d=>Math.max(...d.map(Math.abs))===3}).map(d=>m+d)},{k:'l',v:devSet(7,{r:6,ok:d=>d.filter(x=>Math.abs(x)>=5).length>=3}).map(d=>m+d)}];
const o=shuffle(sets);const pic=s=>dotplot(s.v,{mean:m,lo:2,hi:18,w:220,minStack:3});
return {type:'choice',pics:true,q:'У всех трёх наборов среднее одинаковое — 10. На какой картинке значения разбросаны <b>сильнее всего</b>?',opts:o.map(pic),ans:o.findIndex(s=>s.k==='l'),ansText:'где точки дальше всего от среднего 10',
short:'Там точки дальше всего от треугольника (среднего).',
explain:`Разброс — это то, насколько далеко точки стоят от среднего (треугольник на 10). Наборы: ${o.map(s=>LS(sortN(s.v))).join(' | ')}.<br>Самые далёкие точки у набора ${LS(sortN(sets[2].v))} — значит, разброс там наибольший.`,
explain2:`Представь, что каждая точка привязана к треугольнику резинкой. Где резинки длиннее, там разброс больше. Самые длинные резинки — у набора ${LS(sortN(sets[2].v))}.`};});

/* L1 — deviations */
G(1,()=>{const m=R(5,30);const d=devSet(5,{r:6,ok:d=>d.filter(x=>Math.abs(x)>=2).length>=2});const xs=d.map(v=>m+v);const i=d.findIndex(v=>Math.abs(v)>=2);const x=xs[i];
return {type:'num',q:`Набор: ${xs.join(', ')}. Найди отклонение числа ${x} от среднего.`,ans:d[i],
hint:'Сначала найди среднее, потом вычти его из числа.',
short:`${XB} = ${sum(xs)} : 5 = ${m}; ${x} − ${m} = ${N(d[i])}.`,
explain:`1) Среднее: (${xs.join(' + ')}) : 5 = ${sum(xs)} : 5 = ${m}.<br>2) Отклонение = значение − среднее = ${x} − ${m} = <b>${N(d[i])}</b>.${d[i]<0?'<br>Минус значит, что число <b>меньше</b> среднего.':''}`,
explain2:`Отклонение отвечает на вопрос «на сколько число отошло от среднего и в какую сторону».<div class="fig">${devPlot(xs)}</div>У числа ${x} отрезок идёт ${d[i]>0?'вправо — плюс':'влево — минус'}, длина ${Math.abs(d[i])}.`};});
G(1,()=>{const m=R(150,170);const k=pick(['below','above','eq']);const x=k==='eq'?m:k==='below'?m-R(2,9):m+R(2,9);const nm=pick(NAMES);
const opts=['Отрицательное','Положительное','Равно нулю'];const ans=k==='below'?0:k==='above'?1:2;
return {type:'choice',q:`Средний рост в классе — ${m} см. Рост ${nm} — ${x} см. Каким будет отклонение роста ${nm} от среднего?`,opts,ans,
short:`${x} − ${m} = ${N(x-m)}.`,
explain:`Отклонение = рост − среднее = ${x} − ${m} = <b>${N(x-m)}</b>.<br>${k==='below'?'Значение меньше среднего → отклонение <b>отрицательное</b>.':k==='above'?'Значение больше среднего → отклонение <b>положительное</b>.':'Значение равно среднему → отклонение <b>ноль</b>.'}`,
explain2:`Представь шкалу: среднее ${m} — это ноль отсчёта. Выше него — плюс, ниже — минус. ${nm} ${k==='below'?`ниже на ${m-x} см → −${m-x}`:k==='above'?`выше на ${x-m} см → +${x-m}`:'ровно на нуле отсчёта → 0'}.`};});
G(1,()=>{const m=R(40,70),d=R(-12,12)||5;const nm=pick(NAMES);
return {type:'num',q:`Средний результат класса в тесте — ${m} баллов. Отклонение результата ${nm} от среднего равно ${N(d)}. Сколько баллов у ${nm}?`,ans:m+d,
short:`${m} + ${P(d)} = ${m+d}.`,
explain:`Отклонение = результат − среднее, значит <b>результат = среднее + отклонение</b> = ${m} + ${P(d)} = <b>${m+d}</b>.`,
explain2:`${d>0?`Плюс ${d} значит «на ${d} больше среднего»`:`Минус ${-d} значит «на ${-d} меньше среднего»`}: ${m} ${d>0?'+':'−'} ${Math.abs(d)} = ${m+d}. Проверка: ${m+d} − ${m} = ${N(d)} ✓.`};});
G(1,()=>{for(;;){const m=R(10,40);const d=devSet(6,{r:8});const ab=d.map(Math.abs);const mx=Math.max(...ab);if(ab.filter(v=>v===mx).length>1)continue;const xs=d.map(v=>m+v);const i=ab.indexOf(mx);
return {type:'num',q:`Набор: ${xs.join(', ')}. Какое число дальше всего от среднего? Запиши <b>его отклонение</b> (со знаком).`,ans:d[i],
short:`${XB} = ${m}; дальше всего ${xs[i]}: ${xs[i]} − ${m} = ${N(d[i])}.`,
explain:`1) Среднее: ${sum(xs)} : 6 = ${m}.<br>2) Отклонения: ${xs.map((x,j)=>`${x} − ${m} = ${N(d[j])}`).join('; ')}.<br>3) Дальше всего то, у которого отклонение больше <b>без учёта знака</b>: ${xs[i]}, отклонение <b>${N(d[i])}</b>.`,
explain2:`На картинке это самый длинный отрезок от пунктира:<div class="fig">${devPlot(xs)}</div>Самый длинный — у ${xs[i]}: ${N(d[i])}.`};}});

/* L2 — sum of deviations */
G(2,()=>{for(;;){const m=R(5,25);const d=devSet(5,{r:5});const xs=d.map(v=>m+v);const ss=sum(d.map(v=>v*v)),sa=sum(d.map(Math.abs));const c=['0',N(ss),N(sa),N(m)];if(new Set(c).size<4)continue;const opts=shuffle(c);
return {type:'choice',q:`Найди сумму отклонений чисел ${xs.join(', ')} от их среднего.`,opts,ans:opts.indexOf('0'),
short:`${d.map(P).join(' + ')} = 0 — так всегда.`,
explain:`Среднее: ${sum(xs)} : 5 = ${m}. Отклонения: ${d.map(SG).join(', ')}.<br>Сумма: ${d.map(P).join(' + ')} = <b>0</b>.<br>Так бывает <b>всегда</b>: плюсы и минусы уравновешивают друг друга. (${ss} — это сумма <i>квадратов</i> отклонений, ${sa} — сумма отклонений без знаков, ${m} — само среднее.)`,
explain2:`Почему всегда 0: сумма отклонений = (сумма чисел) − n · ${XB} = ${sum(xs)} − 5 · ${m} = ${sum(xs)} − ${5*m} = 0. Ведь ${XB} как раз и равно сумме, делённой на n.<div class="fig">${devPlot(xs)}</div>`};}});
G(2,()=>{const d=devSet(5,{r:7});
return {type:'num',q:`Отклонения четырёх чисел набора от среднего: ${d.slice(0,4).map(SG).join('; ')}. В наборе 5 чисел. Найди отклонение пятого.`,ans:d[4],
hint:'Сумма всех отклонений от среднего равна 0.',
short:`Сумма должна быть 0: известные дают ${N(sum(d.slice(0,4)))}, значит пятое ${N(d[4])}.`,
explain:`Сумма отклонений от среднего <b>всегда равна 0</b>.<br>Сумма известных: ${d.slice(0,4).map(P).join(' + ')} = ${N(sum(d.slice(0,4)))}.<br>Пятое должно «погасить» это: <b>${N(d[4])}</b>.`,
explain2:`Представь весы: плюсы на одной чаше, минусы на другой. Плюсов: ${sum(d.slice(0,4).filter(v=>v>0))}, минусов: ${-sum(d.slice(0,4).filter(v=>v<0))}. Чтобы весы уравновесились, нужно добавить ${N(d[4])}.`};});
G(2,()=>{const m=R(10,40);const d=devSet(4,{r:6});const xs=d.map(v=>m+v);
return {type:'num',q:`Среднее четырёх чисел равно ${m}. Три из них: ${xs.slice(0,3).join(', ')}. Найди четвёртое, используя отклонения.`,ans:xs[3],
short:`Отклонения ${d.slice(0,3).map(SG).join(', ')} → четвёртое ${SG(d[3])} → ${m} + ${P(d[3])} = ${xs[3]}.`,
explain:`1) Отклонения трёх чисел от ${m}: ${xs.slice(0,3).map((x,i)=>`${x} − ${m} = ${N(d[i])}`).join('; ')}.<br>2) Сумма отклонений всех четырёх равна 0, значит отклонение четвёртого: ${N(d[3])}.<br>3) Четвёртое число: ${m} + ${P(d[3])} = <b>${xs[3]}</b>.`,
explain2:`Проверим через сумму: сумма всех = ${m} · 4 = ${4*m}, известные дают ${sum(xs.slice(0,3))}, четвёртое ${4*m} − ${sum(xs.slice(0,3))} = ${xs[3]} ✓. Оба способа — одно и то же.`};});

/* L3 — variance */
G(3,()=>{const m=R(3,12);const xs=devSet(3,{r:3,int:true}).map(d=>m+d);const v=varSteps(xs);
return {type:'num',q:`Найди дисперсию набора ${xs.join(', ')}.`,ans:v.d,hint:'Среднее → отклонения → квадраты → их среднее.',
short:`${XB} = ${v.m}, сумма квадратов отклонений ${v.ss}, D = ${v.ss} : 3 = ${N(v.d)}.`,explain:v.html,
explain2:`Посмотри на картинку: длина каждого отрезка — отклонение. Квадрат отклонения — это <b>площадь квадрата</b> со стороной, равной отрезку. Дисперсия — средняя площадь таких квадратов.<div class="fig">${devPlot(xs)}</div>Площади: ${xs.map(x=>`${P(rnd(x-v.m))}² = ${N(rnd((x-v.m)**2))}`).join(', ')}; вместе ${v.ss}; поровну на 3 → ${N(v.d)}.`};});
G(3,()=>{const m=R(5,40);const xs=devSet(4,{r:5,int:true}).map(d=>m+d);const v=varSteps(xs);const nm=pick(NAMES);
return {type:'num',q:`${nm} забросил мяч в кольцо в четырёх тренировках: ${xs.join(', ')} раз. Найди дисперсию.`,ans:v.d,
short:`${XB} = ${v.m}; D = ${v.ss} : 4 = ${N(v.d)}.`,explain:v.html,
explain2:`То же самое по шагам в одну строку:<br>D = (${xs.map(x=>`(${x} − ${v.m})²`).join(' + ')}) : 4 = (${xs.map(x=>N(rnd((x-v.m)**2))).join(' + ')}) : 4 = ${v.ss} : 4 = ${N(v.d)}.<div class="box err"><b>Проверь себя</b>Если у тебя вышло 0 — ты забыл возвести отклонения в квадрат.</div>`};});
G(3,()=>{const m=R(10,30);const xs=devSet(5,{r:5}).map(d=>m+d);const v=varSteps(xs);
return {type:'num',q:`Время (в минутах), которое Артём делал уроки в течение 5 дней: ${xs.join(', ')}. Найди дисперсию.`,ans:v.d,
short:`${XB} = ${v.m}; D = ${v.ss} : 5 = ${N(v.d)}.`,explain:v.html,
explain2:`Короткая запись: сначала все отклонения ${xs.map(x=>SG(x-v.m)).join(', ')} (их сумма 0 — проверка!), потом квадраты ${xs.map(x=>(x-v.m)**2).join(', ')}, сумма ${v.ss}, делим на 5: ${N(v.d)}.`};});
G(3,()=>{const opts=shuffle(['Среднее арифметическое квадратов отклонений от среднего','Сумма отклонений от среднего','Среднее арифметическое отклонений от среднего','Разность наибольшего и наименьшего значений']);
return {type:'choice',q:'Что такое <b>дисперсия</b> набора чисел?',opts,ans:opts.indexOf('Среднее арифметическое квадратов отклонений от среднего'),
short:'D = среднее квадратов отклонений.',
explain:`Дисперсия — <b>среднее арифметическое квадратов отклонений</b>.<br>• Сумма отклонений и их среднее <b>всегда 0</b> — они разброс не измеряют.<br>• Разность max и min — это размах, а не дисперсия.<br>Пример: 2, 4, 9 → ${XB} = 5, отклонения −3, −1, 4, квадраты 9, 1, 16, D = 26 : 3 ≈ 8,67.`,
explain2:`Запомни цепочку слов с конца: «среднее — квадратов — отклонений». Отклонения → возвели в квадрат (чтобы убрать минусы) → нашли их среднее.`};});
G(3,()=>{const all=R(2,9);const opts=shuffle(['Нет, никогда: это среднее квадратов, а квадраты не бывают отрицательными','Да, если все числа отрицательные','Да, если среднее отрицательное','Да, если чисел больше 10']);
return {type:'choice',q:`Может ли дисперсия быть <b>отрицательной</b>? А когда она равна 0?`,opts,ans:opts.findIndex(o=>o.startsWith('Нет')),
short:'Квадраты ≥ 0, их среднее ≥ 0. D = 0 только у одинаковых чисел.',
explain:`Каждый квадрат отклонения ≥ 0: (−3)² = 9, 0² = 0. Среднее неотрицательных чисел тоже ≥ 0. Значит, <b>D ≥ 0 всегда</b>, даже для отрицательных чисел: у −5, −3, −1 среднее −3, отклонения −2, 0, 2, D = 8 : 3 ≈ 2,67 > 0.<br>D = 0 только если все отклонения 0 — то есть все числа одинаковые, например ${all}, ${all}, ${all}, ${all}.`,
explain2:`Подумай о дисперсии как о «средней площади квадратов» со сторонами-отклонениями. Площадь не бывает отрицательной. Нулевая площадь — только если стороны нулевые, то есть разброса нет вообще.`};});
G(3,()=>{const m=R(-4,3);const xs=devSet(5,{r:5,int:true}).map(d=>m+d);const v=varSteps(xs);
return {type:'num',q:`Температура (°C) за 5 зимних дней: ${LS(xs)}. Найди дисперсию температуры.`,ans:v.d,hint:'С минусами аккуратно: квадрат отрицательного числа положителен.',
short:`${XB} = ${N(v.m)}; D = ${v.ss} : 5 = ${N(v.d)}.`,explain:v.html,
explain2:`Минусы в самих температурах не мешают: важны только <b>отклонения</b> от среднего ${N(v.m)}. Отметим их:<div class="fig">${devPlot(xs)}</div>Квадраты: ${xs.map(x=>N((x-v.m)**2)).join(', ')} → сумма ${v.ss} → D = ${N(v.d)}.`};});

/* L4 — sigma */
G(4,()=>{const s=pick([2,3,4,5,6,7,8,9,10,12,1.5,2.5,0.5]);const d=rnd(s*s);
return {type:'num',q:`Дисперсия набора равна ${N(d)}. Найди стандартное отклонение σ.`,ans:s,
short:`σ = √${N(d)} = ${N(s)}.`,
explain:`σ = √D = ${SQ(N(d))} = <b>${N(s)}</b>, потому что ${N(s)}² = ${N(s)} · ${N(s)} = ${N(d)}.`,
explain2:`Ищем число, которое при умножении само на себя даёт ${N(d)}. Попробуем: ${[s-1,s,s+1].filter(x=>x>0).map(x=>`${N(x)}² = ${N(rnd(x*x))}${x===s?' ✓':''}`).join(', ')}. Ответ ${N(s)}.`};});
G(4,()=>{const n=pick([4,5]);const m=R(10,40);const xs=devSet(n,{r:6,sq:true}).map(d=>m+d);const v=varSteps(xs);const s=Math.sqrt(v.d);
return {type:'num',q:`Найди стандартное отклонение σ набора ${xs.join(', ')}.`,ans:s,
short:`D = ${v.ss} : ${n} = ${N(v.d)}, σ = √${N(v.d)} = ${s}.`,explain:v.html+`<br>4) σ = √D = ${SQ(N(v.d))} = <b>${s}</b>.`,
explain2:`σ показывает «обычное» расстояние от среднего. Отклонения здесь: ${xs.map(x=>SG(x-v.m)).join(', ')}. Квадраты в среднем дают ${N(v.d)}, а корень возвращает нас к «длине»: ${s}. Числа обычно отходят от ${v.m} примерно на ${s}.`};});
G(4,()=>{const c=pick([['рост учеников','сантиметрах','см'],['массу арбузов','килограммах','кг'],['время забега','секундах','с'],['цену тетрадей','рублях','₽']]);
const want=pick(['σ','D']);const opts=[c[2],c[2]+'²','без единиц',c[2]+'³'];
return {type:'choice',q:`Измеряли ${c[0]} в ${c[1]}. В каких единицах измеряется ${want==='σ'?'стандартное отклонение σ':'дисперсия D'}?`,opts,ans:want==='σ'?0:1,
short:want==='σ'?`σ — в тех же единицах, что данные: ${c[2]}.`:`D — квадраты отклонений, поэтому ${c[2]}².`,
explain:`Отклонение x − ${XB} измеряется в ${c[2]} (вычитаем ${c[2]} из ${c[2]}). Квадрат отклонения — в ${c[2]}², поэтому <b>D в ${c[2]}²</b>. А σ = √D возвращает нас обратно: <b>σ в ${c[2]}</b>. Ответ: <b>${want==='σ'?c[2]:c[2]+'²'}</b>.`,
explain2:`Аналогия с квадратом: сторона 3 см → площадь 9 см². Площадь «в квадрате», сторона — нет. Дисперсия похожа на площадь (${c[2]}²), а σ — на сторону (${c[2]}). Именно поэтому придумали σ: её удобно сравнивать с самими данными.`};});
G(4,()=>{const s=pick([2,3,4,5,6,7,8,9,11,1.5,0.5]);
return {type:'num',q:`Стандартное отклонение роста учеников σ = ${N(s)} см. Найди дисперсию.`,ans:rnd(s*s),

hint:'Числа стоят симметрично вокруг среднего. Какими будут отклонения?',

explain:`1) Числа стоят симметрично, среднее — середина: ${XB} = ${m}.<br>2) Отклонения: ${range(-k,k).map(i=>N(i*s)).join(', ')}.<br>3) Квадраты: ${range(-k,k).map(i=>i*i*s*s).join(', ')}; их сумма = 2 · (${range(1,k).map(i=>i*i*s*s).join(' + ')}) = ${ss}.<br>4) D = ${ss} : ${n} = <b>${d}</b>.`,
explain2:`${s>1?`Хитрость: наш набор — это 0, 1, …, ${n-1}, умноженные на ${s} и сдвинутые на ${a}. Сдвиг D не меняет, умножение даёт ·${s*s}. У 0, 1, …, ${n-1} отклонения ${range(-k,k).join(', ')}, D = ${ss/(s*s)} : ${n} = ${N(rnd(ss/(s*s)/n))}. Значит, D = ${N(rnd(ss/(s*s)/n))} · ${s*s} = ${d}.`:`Сдвиг не меняет дисперсию, поэтому можно сразу работать с отклонениями ${range(-k,k).join(', ')}. Квадраты попарно одинаковые: 2 · (${range(1,k).map(i=>i*i).join(' + ')}) = ${ss}, делим на ${n}: ${d}.`}`};},true);
