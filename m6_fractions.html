  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const store={get(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}},clear(){try{localStorage.removeItem(LS_KEY);}catch(e){}}};

const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});
  if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),50);
  if(S&&S.cur){const back=document.getElementById('backToTask');if(!back){const b=document.createElement('button');b.id='backToTask';b.className='btn';b.textContent='← Вернуться к задаче';b.style.cssText='position:sticky;bottom:16px;margin:8px auto;display:flex';b.onclick=()=>{show('train');b.remove();};$('#v-theory').appendChild(b);}}
}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;
    const full=S.queue.length===T.gens.length;

<div class="box rule"><b>Правило</b>Сократить дробь — разделить числитель и знаменатель на их <b>общий делитель</b>. Если делить сразу на <b>НОД</b>, получится <b>несократимая</b> дробь за один шаг.</div>
<div class="box ex"><b>Пример</b>${M(F(18,24))}: НОД(18, 24) = 6 → ${M(F('18 : 6','24 : 6')+' = '+F(3,4))}.<br>Можно и по шагам: ${M(F(18,24)+' = '+F(9,12)+' = '+F(3,4))} (сначала на 2, потом на 3).</div>
<div class="box tip"><b>Признаки делимости в помощь</b>Оба числа чётные — делим на 2. Оба кончаются на 0 или 5 — на 5. Суммы цифр делятся на 3 — на 3.</div>
<div class="box err"><b>Ловушка</b>Нельзя «сокращать» цифры: ${M(F(16,64))} — «зачеркнуть шестёрки» и получить 1/4 — случайно верно, но ${M(F(26,65))} → «2/5» тоже случайно, а ${M(F(12,24))} → «1/4» — уже неправильно (на самом деле 1/2). Делим только на общий множитель!</div>
<div class="box rule"><b>Несократимая дробь</b>Числитель и знаменатель — взаимно простые (НОД = 1): ${M(F(8,15))}, ${M(F(7,9))}.</div>`},
{title:'Общий знаменатель и сравнение',lvl:2,html:`
<div class="box rule"><b>Правило</b>Чтобы привести дроби к общему знаменателю: 1) найди <b>НОК</b> знаменателей; 2) для каждой дроби найди <b>дополнительный множитель</b> = НОК : знаменатель; 3) умножь на него числитель и знаменатель.</div>
<div class="box ex"><b>Пример</b>${M(F(5,6))} и ${M(F(3,8))}: НОК(6, 8) = 24. Доп. множители: 24 : 6 = 4, 24 : 8 = 3.<br>${M(F(5,6)+' = '+F(20,24))}, ${M(F(3,8)+' = '+F(9,24))}.</div>
<div class="box rule"><b>Сравнение</b>• Знаменатели равны — больше та, у которой <b>больше числитель</b>: ${M(F(5,9)+' > '+F(4,9))}.<br>• Числители равны — больше та, у которой <b>меньше знаменатель</b>: ${M(F(3,5)+' > '+F(3,7))} (кусков меньше — они крупнее!).<br>• Иначе — приведи к общему знаменателю.</div>
<div class="figrow"><div class="fig">${pizza(5,1,45,'1/5')}</div><div class="fig">${pizza(8,1,45,'1/8')}</div></div>
<p class="small" style="text-align:center">Кусок 1/5 больше куска 1/8: делили на меньшее число частей.</p>
<div class="box err"><b>Ловушка</b>«8 больше 5, значит 1/8 больше 1/5». Наоборот! Чем больше гостей делят пиццу, тем меньше кусок.</div>`},
{title:'Сложение и вычитание',lvl:3,html:`
<div class="box rule"><b>Правило</b>Одинаковые знаменатели — складываем (вычитаем) <b>числители</b>, знаменатель оставляем: ${M(F(2,7)+' + '+F(3,7)+' = '+F(5,7))}.<br>Разные знаменатели — сначала приводим к <b>общему</b>, потом как выше.</div>
<p>Почему знаменатель не складывают? 2 куска по 1/7 плюс 3 куска по 1/7 — это 5 кусков по 1/7. Размер куска (седьмая часть) не меняется!</p>
<div class="box ex"><b>Пример</b>${M(F(1,4)+' + '+F(1,6))}: НОК(4, 6) = 12 → ${M(F(3,12)+' + '+F(2,12)+' = '+F(5,12))}.</div>
<div class="fig">${bars([{n:4,k:1,lab:'1/4'},{n:6,k:1,lab:'1/6'},{n:12,k:5,lab:'5/12'}])}</div>
<div class="box err"><b>Главная ошибка</b>${M(F(1,2)+' + '+F(1,3)+' = '+F(2,5))}? Нет! Полпиццы и ещё треть — это больше половины, а 2/5 меньше половины. Правильно: ${M(F(3,6)+' + '+F(2,6)+' = '+F(5,6))}.</div>
<div class="box tip"><b>В конце</b>Всегда проверь, нельзя ли сократить ответ: ${M(F(1,6)+' + '+F(1,3)+' = '+F(3,6)+' = '+F(1,2))}.</div>`},
{title:'Смешанные числа',lvl:4,html:`
<div class="box rule"><b>Правило</b>Смешанное число — целая часть + правильная дробь: ${M(MX(2,1,3)+' = 2 + '+F(1,3))}.<br><b>Неправильная → смешанное:</b> раздели числитель на знаменатель: частное — целая часть, остаток — новый числитель. ${M(F(11,4))}: 11 : 4 = 2 (ост. 3) → ${M(MX(2,3,4))}.<br><b>Смешанное → неправильная:</b> ${M(MX(2,3,4)+' = '+F('2 · 4 + 3',4)+' = '+F(11,4))}.</div>
<div class="figrow"><div class="fig">${pizza(4,4,38)}</div><div class="fig">${pizza(4,4,38)}</div><div class="fig">${pizza(4,3,38)}</div></div>
<p class="small" style="text-align:center">${MX(2,3,4)} пиццы = 11 четвертинок.</p>
<div class="box ex"><b>Сложение и вычитание</b>Целые — с целыми, дроби — с дробями: ${M(MX(3,1,5)+' + '+MX(1,2,5)+' = '+MX(4,3,5))}.<br>Если дроби «не хватает» — займи единицу: ${M(MX(5,1,4)+' − '+MX(2,3,4))} = ${M(MX(4,5,4)+' − '+MX(2,3,4)+' = '+MX(2,2,4)+' = '+MX(2,1,2))}.</div>
<div class="box err"><b>Ловушка</b>${M(MX(2,1,3))} — это 2 <b>плюс</b> 1/3, а не 2 умножить на 1/3.</div>`},
{title:'Умножение дробей',lvl:5,html:`
<div class="box rule"><b>Правило</b>${M(F('a','b')+' · '+F('c','d')+' = '+F('a · c','b · d'))} — числитель на числитель, знаменатель на знаменатель. Смешанные числа сначала переводим в неправильные дроби. <b>Сокращай до умножения</b> — так проще!</div>
<div class="box ex"><b>Пример</b>${M(F(3,4)+' · '+F(8,9))}: сокращаем 3 и 9 (на 3), 4 и 8 (на 4): ${M(F(1,1)+' · '+F(2,3)+' = '+F(2,3))}.<br>${M(F(2,5)+' · 3 = '+F(6,5)+' = '+MX(1,1,5))} (натуральное число — это дробь со знаменателем 1).</div>
<p>Смысл: «${F(1,2)} от ${F(1,3)}». Половина от трети пиццы — это шестая часть: ${M(F(1,2)+' · '+F(1,3)+' = '+F(1,6))}.</p>
<div class="box err"><b>Ловушка</b>${M(MX(2,1,2)+' · '+MX(2,1,2))} ≠ 4${F(1,4)}! Нельзя умножать «целые на целые, дроби на дроби». Правильно: ${M(F(5,2)+' · '+F(5,2)+' = '+F(25,4)+' = '+MX(6,1,4))}.</div>
<div class="fact">Умножение на дробь меньше 1 <b>уменьшает</b> число: 10 · ${F(1,2)} = 5. Так что «умножение всегда увеличивает» — миф из начальной школы.</div>`},
{title:'Деление дробей',lvl:6,html:`
<div class="box rule"><b>Правило</b>Разделить на дробь — <b>умножить на перевёрнутую</b> (обратную) дробь: ${M(F('a','b')+' : '+F('c','d')+' = '+F('a','b')+' · '+F('d','c'))}.</div>
<div class="box ex"><b>Пример</b>${M(F(3,4)+' : '+F(3,8)+' = '+F(3,4)+' · '+F(8,3)+' = 2')}.<br>Смысл: сколько раз 3/8 пиццы помещается в 3/4 пиццы? Два раза!</div>
<div class="fig">${bars([{n:8,k:6,lab:'3/4'},{n:8,k:3,lab:'3/8'}])}</div>
<div class="box rule"><b>Обратные числа</b>${M(F(3,7))} и ${M(F(7,3))} — взаимно обратные: их произведение равно 1. Обратное к 5 — это ${M(F(1,5))}.</div>
<div class="box err"><b>Ловушка</b>Переворачивают <b>только делитель</b> (вторую дробь), первую не трогают. И смешанные числа сначала превращают в неправильные дроби.</div>
<div class="box tip"><b>Деление на натуральное</b>${M(F(4,5)+' : 2 = '+F(4,5)+' · '+F(1,2)+' = '+F(2,5))} — то же, что разделить числитель на 2.</div>`},
{title:'Дробь от числа и число по дроби',lvl:7,html:`
<div class="box rule"><b>Найти дробь от числа</b> — <b>умножить</b> число на дробь. ${M(F(3,5)+' от 40 = 40 · '+F(3,5)+' = 24')}.<br>(40 : 5 — одна пятая, · 3 — три пятых.)</div>
<div class="box rule"><b>Найти число по его дроби</b> — <b>разделить</b> на дробь. «${F(3,5)} числа равны 24» → 24 : ${F(3,5)} = 24 · ${F(5,3)} = 40.<br>(24 : 3 = 8 — одна пятая, · 5 — всё число.)</div>
<div class="fig">${bar(5,3,250,'24 — это 3/5')}</div>
<div class="box ex"><b>Пример из жизни</b>У Павла 600 ₽, на игру он потратил ${F(2,3)}. Потратил 600 · ${F(2,3)} = 400 ₽.<br>Павел прочитал 45 страниц — это ${F(3,8)} книги. Всего 45 : ${F(3,8)} = 45 · ${F(8,3)} = 120 страниц.</div>
<div class="box tip"><b>Как не перепутать</b>Известно <b>целое</b> — ищем часть → умножаем. Известна <b>часть</b> — ищем целое → делим. Проверка: часть должна быть меньше целого (при дроби меньше 1).</div>`},
{title:'Хитрые суммы и египетские дроби (★)',lvl:8,html:`
<div class="box rule"><b>Телескоп</b>${M(F(1,'n(n + 1)')+' = '+F(1,'n')+' − '+F(1,'n + 1'))}. Например, ${M(F(1,'2 · 3')+' = '+F(1,2)+' − '+F(1,3)+' = '+F(1,6))} ✅.</div>
<div class="box ex"><b>Пример</b>${M(F(1,'1·2')+' + '+F(1,'2·3')+' + '+F(1,'3·4'))} = (1 − ${F(1,2)}) + (${F(1,2)} − ${F(1,3)}) + (${F(1,3)} − ${F(1,4)}) = 1 − ${F(1,4)} = ${F(3,4)}. Середина «складывается, как подзорная труба» — отсюда название.</div>
<div class="box rule"><b>Египетские дроби</b>Древние египтяне записывали дроби только как суммы <b>разных</b> дробей с числителем 1: ${M(F(3,4)+' = '+F(1,2)+' + '+F(1,4))}. Полезная формула: ${M(F(1,'n')+' = '+F(1,'n + 1')+' + '+F(1,'n(n + 1)'))}.</div>
<div class="fact">Папирус Ринда (около 1650 г. до н. э.) начинается с таблицы: как записать 2/n египетскими дробями для всех нечётных n от 5 до 101. Например, 2/5 = 1/3 + 1/15.</div>`},
{title:'Шпаргалка',html:`<ul class="steps">
<li>Основное свойство: умножать/делить числитель и знаменатель на одно число можно, прибавлять — нельзя.</li>
<li>Сокращай на НОД — получишь несократимую дробь.</li>
<li>Общий знаменатель — НОК знаменателей; доп. множитель = НОК : знаменатель.</li>
<li>+ и −: только с одинаковыми знаменателями, складываем числители.</li>
<li>Смешанные: целые с целыми, дроби с дробями; не хватает — займи единицу.</li>
<li>·: числитель на числитель, знаменатель на знаменатель (сокращай до!). : — умножь на перевёрнутую.</li>
<li>Дробь от числа — умножаем. Число по дроби — делим.</li></ul>`}
];

const symbols={tab:'Правила',title:'Главные правила',rows:[

function onTheory(root){const w=root.querySelector('#w-frac');if(!w)return;
  w.innerHTML=`<label>Числитель: <output id="wf-a">2</output><input type="range" id="wf-A" min="0" max="6" value="2"></label><label>Знаменатель: <output id="wf-b">3</output><input type="range" id="wf-B" min="1" max="6" value="3"></label><label>Режем каждый кусок ещё на: <output id="wf-k">2</output><input type="range" id="wf-K" min="1" max="4" value="2"></label><div id="wf-s" style="display:flex;justify-content:center"></div><div class="small" id="wf-t" style="text-align:center;margin-top:6px"></div>`;
  const A=w.querySelector('#wf-A'),B=w.querySelector('#wf-B'),K=w.querySelector('#wf-K');
  const draw=()=>{let a=+A.value,b=+B.value;if(a>b){a=b;A.value=b;}const k=+K.value;
    ['a','b','k'].forEach((x,i)=>w.querySelector('#wf-'+x).textContent=[a,b,k][i]);
    w.querySelector('#wf-s').innerHTML=bars([{n:b,k:a,lab:`${a}/${b}`},{n:b*k,k:a*k,lab:`${a*k}/${b*k}`}]);
    const [p,q]=a?nr(a,b):[0,1];
    w.querySelector('#wf-t').innerHTML=`<span class="out">${a}/${b} = ${a*k}/${b*k}</span> — закрашено столько же! ${a&&a!==p?`А сократить ${a}/${b} можно до ${p}/${q}.`:a?`Несократимый вид: ${p}/${q}.`:''}`;};
  A.oninput=B.oninput=K.oninput=draw;draw();}

/* ---------- generators ---------- */
const gens=[];
const G=(lvl,make,o)=>gens.push(Object.assign({lvl,make},o||{}));
const RULE=(lvl,vars,o)=>G(lvl,()=>{const v=pick(vars);const opts=shuffle([v.ok,...v.bad]);return {type:'choice',q:v.q,opts,ans:opts.indexOf(v.ok),short:v.ex,explain:v.ex,explain2:v.ex2};},Object.assign({rule:true},o||{}));
const T=(base,f,opt)=>Object.assign(base,FA(f,opt));
const props=n=>{const r=[];for(let q=2;q<=n;q++)for(let p=1;p<q;p++)if(gcd(p,q)===1)r.push([p,q]);return r;};

/* L0 */
RULE(0,[{q:'Что показывает знаменатель дроби?',ok:'На сколько равных частей разделили целое',bad:['Сколько частей взяли','Сколько всего пицц','Во сколько раз числитель больше'],
 ex:'<b>Зн</b>аменатель <b>зн</b>ает, на сколько равных частей режем целое. В 3/8 — на 8 кусков. А числитель (3) — сколько кусков взяли.',ex2:'Знаменатель — «название» кусочка: восьмые, пятые, десятые. Числитель — «сколько штук» таких кусочков.'},
{q:'Основное свойство дроби: дробь не изменится, если…',ok:'числитель и знаменатель умножить (или разделить) на одно и то же число, не равное 0',bad:['к числителю и знаменателю прибавить одно и то же число','умножить только числитель','поменять местами числитель и знаменатель'],
 ex:'Умножать и делить числитель и знаменатель на одно число — можно: 1/2 = 2/4 = 3/6. Прибавлять — нельзя: 1/2 ≠ 2/3.',ex2:'Пиццу, разрезанную на 4 куска, режем ещё раз пополам: кусков 8, взятых тоже вдвое больше — 2/4 = 4/8. Количество пиццы то же.'}]);
G(0,()=>{const n=pick([3,4,5,6,8,10,12]);const k=R(1,n-1);
 return T({q:'Какая часть пиццы закрашена? Запиши дробью.',pic:pizza(n,k,70),
 short:`Кусков ${n}, закрашено ${k} → ${k}/${n}${gcd(k,n)>1?` = ${nr(k,n).join('/')}`:''}.`,
 explain:`Считаем все куски — это <b>знаменатель</b>: ${n}.<br>Считаем закрашенные — это <b>числитель</b>: ${k}.<br>Ответ: ${M(F(k,n))}${gcd(k,n)>1?` (можно сократить: ${M(F(...nr(k,n)))})`:''}.`,
 explain2:`Знаменатель — «на сколько частей разрезали», числитель — «сколько взяли». Частая ошибка — записать «закрашенные / незакрашенные» (${k}/${n-k}). Внизу должно быть <b>всё количество</b> кусков: ${n}.`},[k,n]);});
G(0,()=>{const [p,q]=pick(props(7));const k=R(2,6);const which=pick(['num','den']);
 const qq=which==='num'?`${M(F(p,q)+' = '+F('?',q*k))}`:`${M(F(p,q)+' = '+F(p*k,'?'))}`;const ans=which==='num'?p*k:q*k;
 return {type:'num',q:`Какое число нужно поставить вместо «?»: ${qq}`,ans,
 short:`Множитель ${k}: ${p}·${k} = ${p*k}, ${q}·${k} = ${q*k}.`,
 explain:`Основное свойство: числитель и знаменатель умножаем на <b>одно и то же</b> число.<br>${which==='num'?`Знаменатель: ${q} → ${q*k}, умножили на ${q*k} : ${q} = <b>${k}</b>. Значит, и числитель: ${p} · ${k} = <b>${p*k}</b>.`:`Числитель: ${p} → ${p*k}, умножили на <b>${k}</b>. Значит, и знаменатель: ${q} · ${k} = <b>${q*k}</b>.`}`,
 explain2:`Посмотри на полоски: ${p}/${q} и ${p*k}/${q*k} закрашены одинаково — каждый кусок просто разрезали на ${k}.<div class="fig">${bars([{n:q,k:p,lab:`${p}/${q}`},{n:q*k,k:p*k,lab:`${p*k}/${q*k}`}])}</div>`};});
G(0,()=>{for(;;){const [p,q]=pick(props(6));const k=R(2,5);const ok=`${p*k}/${q*k}`;const opts=[ok,`${p+k}/${q+k}`,`${p*k}/${q}`,`${p}/${q*k}`];if(new Set(opts).size<4||(p+k)*q===p*(q+k))continue;const o=shuffle(opts);
 return {type:'choice',q:`Какая дробь <b>равна</b> ${M(F(p,q))}?`,opts:o,ans:o.indexOf(ok),
 short:`${p}·${k} / ${q}·${k} = ${ok}.`,
 explain:`По основному свойству умножаем <b>и числитель, и знаменатель</b> на одно число: ${M(F(p+' · '+k,q+' · '+k)+' = '+F(p*k,q*k))}.<br>• ${p+k}/${q+k} — прибавили ${k} к обоим, так нельзя.<br>• ${p*k}/${q} и ${p}/${q*k} — умножили только что-то одно.`,
 explain2:`Проверь «перекрёстным умножением»: дроби a/b и c/d равны, если a · d = b · c. ${p} · ${q*k} = ${p*q*k} и ${q} · ${p*k} = ${p*q*k} — равны ✅. А для ${p+k}/${q+k}: ${p} · ${q+k} = ${p*(q+k)}, ${q} · ${p+k} = ${q*(p+k)} — не равны.`};}});

/* L1 */
RULE(1,[{q:'Сократить дробь — значит…',ok:'разделить числитель и знаменатель на их общий делитель',bad:['вычесть из числителя и знаменателя одно и то же число','зачеркнуть одинаковые цифры','разделить только числитель'],
 ex:'Сокращение — это основное свойство «в обратную сторону»: делим числитель и знаменатель на <b>общий делитель</b>. Делим на НОД — сразу получаем несократимую дробь.',ex2:'18/24: общий делитель 6 → 3/4. Это та же часть пиццы, просто куски крупнее.'}]);
G(1,()=>{const [p,q]=pick(props(9));const g=R(2,12);const a=p*g,b=q*g;
 return T({q:`Сократи дробь ${M(F(a,b))}. Ответ запиши несократимой дробью.`,
 hint:`Найди НОД(${a}, ${b}).`,
 short:`НОД(${a}, ${b}) = ${g}: ${a/g}/${b/g}.`,
 explain:`Ищем НОД(${a}, ${b}) = <b>${g}</b> (${a} = ${g} · ${p}, ${b} = ${g} · ${q}).<br>${M(F(a+' : '+g,b+' : '+g)+' = '+F(p,q))}.<br>${p} и ${q} взаимно простые — дальше не сокращается.`,
 explain2:`Можно по шагам, маленькими делителями: ${(()=>{let x=a,y=b;const s=[`${x}/${y}`];for(const d of [2,3,5,7,11]){while(x%d===0&&y%d===0){x/=d;y/=d;s.push(`${x}/${y} (на ${d})`);}}return s.join(' → ');})()}. Главное — дойти до конца.`},[a,b],{irr:true});});
G(1,()=>{for(;;){const ok=pick(props(12));const bads=sample(props(6),3).map(([p,q])=>{const k=pick([2,3,5]);return [p*k,q*k];});const opts=[ok,...bads].map(f=>`${f[0]}/${f[1]}`);if(new Set(opts).size<4)continue;const o=shuffle(opts);
 return {type:'choice',q:'Какая дробь <b>несократимая</b>?',opts:o,ans:o.indexOf(`${ok[0]}/${ok[1]}`),
 short:`НОД(${ok[0]}, ${ok[1]}) = 1.`,
 explain:`Несократимая — у числителя и знаменателя нет общих делителей, кроме 1.<br>${[ok,...bads].map(f=>`${f[0]}/${f[1]}: ${gcd(f[0],f[1])===1?'НОД = 1 ✅ несократимая':`оба делятся на ${gcd(f[0],f[1])} → ${nr(f[0],f[1]).join('/')}`}`).join('<br>')}`,
 explain2:`Проверяй простые делители: на 2 (оба чётные?), на 3 (суммы цифр делятся на 3?), на 5 (оба на 0/5?). У ${ok[0]}/${ok[1]} ни один не подходит одновременно.`};}});
G(1,()=>{const [p,q]=pick(props(11).filter(f=>f[1]>=5));const g=pick([12,14,15,18,21,24]);const a=p*g,b=q*g;
 return T({q:`Сократи: ${M(F(a,b))}. Ответ — несократимая дробь.`,
 short:`${a}/${b} = ${p}/${q} (НОД = ${g}).`,
 explain:`Раскладываем на простые: ${a} = ${fac(a)}, ${b} = ${fac(b)}.<br>Общие множители: ${fac(g)} = ${g} — это НОД.<br>${M(F(a,b)+' = '+F(p,q))}.`,
 explain2:`Начни с очевидного: ${a%2===0&&b%2===0?`оба чётные → ${a/2}/${b/2}`:a%3===0&&b%3===0?`оба делятся на 3 → ${a/3}/${b/3}`:`оба делятся на ${gcd(a,b)}`}, и продолжай, пока можно. Итог: ${p}/${q}.`},[a,b],{irr:true});});
function fac(n){const r=[];for(let p=2;p*p<=n;p++)while(n%p===0){r.push(p);n/=p;}if(n>1)r.push(n);return r.join(' · ');}

/* L2 */
RULE(2,[{q:'Как сравнить две дроби с одинаковыми числителями, например 3/5 и 3/7?',ok:'Больше та, у которой знаменатель меньше',bad:['Больше та, у которой знаменатель больше','Они равны, раз числители одинаковые','Сравнить нельзя'],
 ex:'Числители равны — кусков взяли поровну. Но при знаменателе 5 куски <b>крупнее</b>, чем при 7. Значит, 3/5 > 3/7.',ex2:'Одна пицца на 5 друзей или на 7 друзей — где кусок больше? Где друзей меньше!'},
{q:'Общий знаменатель двух дробей удобнее всего брать равным…',ok:'НОК знаменателей',bad:['НОД знаменателей','сумме знаменателей','большему из знаменателей всегда'],
 ex:'Общий знаменатель должен делиться на оба знаменателя → общее кратное. Самое маленькое — <b>НОК</b>. Для 6 и 8 это 24 (а не 48).',ex2:'Сумма не подходит: 6 + 8 = 14 не делится на 6. Больший знаменатель подходит, только если он делится на меньший (4 и 8 → 8).'}]);
G(2,()=>{let b,d;do{b=R(3,12);d=R(3,15);}while(b===d||lcm(b,d)===b*d&&Math.random()<.5||lcm(b,d)>72);const a=pick(range(1,b-1).filter(x=>gcd(x,b)===1)),c=pick(range(1,d-1).filter(x=>gcd(x,d)===1));const L=lcm(b,d);
 return {type:'num',q:`Приведи дроби ${M(F(a,b))} и ${M(F(c,d))} к наименьшему общему знаменателю. Какой это знаменатель?`,ans:L,
 short:`НОК(${b}, ${d}) = ${L}: ${a}/${b} = ${a*L/b}/${L}, ${c}/${d} = ${c*L/d}/${L}.`,
 explain:`Наименьший общий знаменатель = <b>НОК(${b}, ${d}) = ${L}</b>.<br>Доп. множители: ${L} : ${b} = ${L/b}, ${L} : ${d} = ${L/d}.<br>${M(F(a,b)+' = '+F(a*L/b,L))}, ${M(F(c,d)+' = '+F(c*L/d,L))}.`,
 explain2:`Выписывай кратные большего знаменателя (${Math.max(b,d)}), пока не встретишь делящееся на ${Math.min(b,d)}: ${range(1,L/Math.max(b,d)).map(k=>Math.max(b,d)*k).join(', ')}. Первое подходящее — ${L}. Произведение ${b} · ${d} = ${b*d} тоже годится, но оно ${b*d===L?'здесь совпадает с НОК':'больше и неудобнее'}.`};});
G(2,()=>{for(;;){const t=pick(['den','num','diff']);let a,b,c,d;
 if(t==='den'){b=d=R(5,15);a=R(1,b-1);c=R(1,b-1);}else if(t==='num'){a=c=R(1,6);b=R(a+1,15);d=R(a+1,15);}else{b=R(3,12);d=R(3,12);a=R(1,b-1);c=R(1,d-1);}
 if(a*d===b*c||b===d&&t!=='den')continue;const ans=a*d>b*c?0:1;const L=lcm(b,d);
 return {type:'choice',q:`Какой знак поставить: ${M(F(a,b)+' ? '+F(c,d))}`,opts:['>','<','='],ans,
 short:`${t==='den'?'Знаменатели равны — сравниваем числители':t==='num'?'Числители равны — больше та, где знаменатель меньше':`К знаменателю ${L}: ${a*L/b}/${L} и ${c*L/d}/${L}`}.`,
 explain:t==='den'?`Знаменатели одинаковые (${b}) — куски одного размера. Больше та дробь, где кусков больше: ${a} ${a>c?'>':'<'} ${c} → ${M(F(a,b)+(ans?' < ':' > ')+F(c,d))}.`:t==='num'?`Числители равны (${a}) — кусков взяли поровну. Но куски размера 1/${b} и 1/${d}: чем <b>меньше</b> знаменатель, тем <b>крупнее</b> кусок. ${Math.min(b,d)} < ${Math.max(b,d)} → ${M(F(a,b)+(ans?' < ':' > ')+F(c,d))}.`:`Приводим к общему знаменателю НОК(${b}, ${d}) = ${L}:<br>${M(F(a,b)+' = '+F(a*L/b,L))}, ${M(F(c,d)+' = '+F(c*L/d,L))}.<br>${a*L/b} ${ans?'<':'>'} ${c*L/d} → ${M(F(a,b)+(ans?' < ':' > ')+F(c,d))}.`,
 explain2:`Перекрёстное умножение: сравни ${a} · ${d} = ${a*d} и ${c} · ${b} = ${b*c}. ${a*d>b*c?'Первое больше':'Второе больше'} → ${M(F(a,b)+(ans?' < ':' > ')+F(c,d))}.<div class="fig">${bars([{n:b,k:a,lab:`${a}/${b}`},{n:d,k:c,lab:`${c}/${d}`}],220)}</div>`};}});
G(2,()=>{for(;;){const fs=sample(props(12),4);const vals=fs.map(f=>f[0]/f[1]);if(new Set(vals).size<4)continue;const mx=vals.indexOf(Math.max(...vals));const o=fs.map(f=>`${f[0]}/${f[1]}`);const order=fs.map((f,i)=>i).sort((x,y)=>vals[y]-vals[x]);
 return {type:'choice',q:'Какая из дробей <b>самая большая</b>?',opts:o,ans:mx,
 short:`Больше всех ${o[mx]} ≈ ${H.num(Math.round(vals[mx]*1000)/1000)}.`,
 explain:`Сравним каждую с половиной и между собой. Удобно привести к общему знаменателю ${fs.reduce((x,f)=>lcm(x,f[1]),1)}:<br>${fs.map(f=>{const L=fs.reduce((x,g)=>lcm(x,g[1]),1);return `${f[0]}/${f[1]} = ${f[0]*L/f[1]}/${L}`;}).join('<br>')}<br>Самая большая: <b>${o[mx]}</b>.`,

RULE(3,[{q:'Как сложить дроби с одинаковыми знаменателями?',ok:'Сложить числители, знаменатель оставить тем же',bad:['Сложить числители и сложить знаменатели','Перемножить числители','Сложить знаменатели, числитель оставить'],

{q:'Как сложить дроби с разными знаменателями?',ok:'Привести к общему знаменателю, потом сложить числители',bad:['Сложить числители и знаменатели отдельно','Перемножить дроби','Сложить числители, а знаменатель взять больший'],
 ex:'Складывать можно только одинаковые куски. Сначала режем пиццы на одинаковые куски — приводим к общему знаменателю: 1/4 + 1/6 = 3/12 + 2/12 = 5/12.',ex2:'Как с единицами измерения: 1 м + 20 см не равно 21 чего-то. Сначала переведи в сантиметры: 100 + 20 = 120 см. Общий знаменатель — это «общие единицы».'}]);
G(3,()=>{const b=R(5,15);const op=pick(['+','−']);let a,c;if(op==='+'){a=R(1,b-1);c=R(1,b-1);}else{a=R(2,b-1);c=R(1,a-1);}

G(3,()=>{let b,d;do{b=R(2,10);d=R(2,12);}while(b===d||lcm(b,d)>60);const a=pick(range(1,b-1).filter(x=>gcd(x,b)===1)),c=pick(range(1,d-1).filter(x=>gcd(x,d)===1));const L=lcm(b,d);const r=add([a,b],[c,d]);
 return T({q:`Вычисли: ${M(F(a,b)+' + '+F(c,d))}`,

 short:`${a*L/b}/${L} + ${c*L/d}/${L} = ${a*L/b+c*L/d}/${L}${r[1]!==L?` = ${plain(r)}`:''}.`,
 explain:`1) Общий знаменатель: НОК(${b}, ${d}) = <b>${L}</b>.<br>2) Доп. множители: ${L/b} и ${L/d}: ${M(F(a,b)+' = '+F(a*L/b,L))}, ${M(F(c,d)+' = '+F(c*L/d,L))}.<br>3) ${M(F(a*L/b,L)+' + '+F(c*L/d,L)+' = '+F(a*L/b+c*L/d,L))}${r[1]!==L||r[0]>r[1]?` = ${M(S(r))}`:''}.<br>Ошибка «${a+c}/${b+d}» — складывать знаменатели нельзя.`,

G(3,()=>{let a,b,c,d;do{b=R(2,10);d=R(2,12);a=R(1,b-1);c=R(1,d-1);}while(b===d||lcm(b,d)>60||a*d<=c*b||gcd(a,b)>1||gcd(c,d)>1);const L=lcm(b,d);const r=sub([a,b],[c,d]);

G(3,()=>{for(;;){const ds=sample([2,3,4,6,8,12],2);const fs=ds.map(d=>[pick(range(1,d-1).filter(x=>gcd(x,d)===1)),d]);const tot=add(fs[0],fs[1]);if(tot[0]>=tot[1])continue;const rest=sub([1,1],tot);const nm=sample(['Павел','Артём','Миша','Костя'],2);

{q:'Как перевести неправильную дробь 17/5 в смешанное число?',ok:'Разделить 17 на 5 с остатком: 3 (ост. 2) → 3 2/5',bad:['17 − 5 = 12 → 12/5','Разделить 5 на 17','Записать 1 7/5'],

 short:`Первой до 1 не хватает 1/${A}, второй — 1/${A+1}, а это меньше.`,
 explain:`Сравним, сколько каждой не хватает до 1:<br>1 − ${F(A-1,A)} = ${F(1,A)}, 1 − ${F(A,A+1)} = ${F(1,A+1)}.<br>${F(1,A+1)} < ${F(1,A)} (знаменатель больше — кусок меньше). Второй не хватает меньше — значит, она <b>ближе к 1 и больше</b>: ${M(F(A-1,A)+' < '+F(A,A+1))}.`,
 explain2:`Перекрёстное умножение: ${A-1} · ${A+1} = ${A}² − 1, а ${A} · ${A} = ${A}². Первое на 1 меньше → первая дробь меньше. Работает для любого числа: (n − 1)/n < n/(n + 1).`};},{star:true});
G(8,()=>{const n=R(4,12);let s=[0,1];for(let k=1;k<=n;k++)s=add(s,[1,Math.pow(2,k)]);if(s[0]!==Math.pow(2,n)-1||s[1]!==Math.pow(2,n))throw new Error('geo');
 return T({q:`Вычисли: ${M(F(1,2)+' + '+F(1,4)+' + '+F(1,8)+' + … + '+F(1,Math.pow(2,n)))}`,
 short:`1 − 1/${Math.pow(2,n)} = ${s[0]}/${s[1]}.`,
 explain:`Смотри, как растёт сумма: ${F(1,2)}; ${F(3,4)}; ${F(7,8)}; ${F(15,16)}… Каждый раз до 1 не хватает ровно последнего слагаемого.<br>Значит, сумма = 1 − ${F(1,Math.pow(2,n))} = <b>${M(F(s[0],s[1]))}</b>.`,
 explain2:`Представь: ты съедаешь половину пиццы, потом половину остатка, потом половину нового остатка… После ${n} шагов остаётся кусок 1/${Math.pow(2,n)}. Съедено 1 − 1/${Math.pow(2,n)} = ${s[0]}/${s[1]}.`},s);},{star:true});
G(8,()=>{const n=R(3,20);let s=[0,1];for(let k=1;k<=n;k++)s=add(s,[1,(2*k-1)*(2*k+1)]);if(s[0]*(2*n+1)!==n*s[1])throw new Error('odd');
 return T({q:`Вычисли: ${M(F(1,'1 · 3')+' + '+F(1,'3 · 5')+' + '+F(1,'5 · 7')+' + … + '+F(1,`${2*n-1} · ${2*n+1}`))}`,
 hint:'1/(1·3) = (1/2)·(1 − 1/3). Попробуй так же с остальными.',
 short:`½ · (1 − 1/${2*n+1}) = ${n}/${2*n+1}.`,
 explain:`Здесь знаменатели отличаются на 2, поэтому ${F(1,'k(k + 2)')} = ${F(1,2)} · (${F(1,'k')} − ${F(1,'k + 2')}).<br>Сумма = ${F(1,2)} · (1 − ${F(1,3)} + ${F(1,3)} − ${F(1,5)} + … − ${F(1,2*n+1)}) = ${F(1,2)} · (1 − ${F(1,2*n+1)}) = ${F(1,2)} · ${F(2*n,2*n+1)} = <b>${M(F(n,2*n+1))}</b>.`,
 explain2:`Маленькие суммы: 1/3; 1/3 + 1/15 = 2/5; + 1/35 = 3/7. Видишь? n/(2n + 1). У нас ${n} слагаемых → ${n}/${2*n+1}.`},s);},{star:true});
