<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){

{title:'Количество вещества и моль',lvl:0,html:`
<div class="box rule"><b>Определение</b><b>Количество вещества</b> n — это число частиц (атомов, молекул), выраженное в «упаковках» по 6,02·10²³ штук. Единица — <b>моль</b>. 1 моль любого вещества содержит 6,02·10²³ частиц.</div>
<p><b>Почему так.</b> Ты же не покупаешь яйца поштучно — берёшь «десяток». Бумагу — пачками по 500 листов. Пара носков — это 2. Дюжина — 12. А <b>моль — это «химическая дюжина»</b>, только очень большая: 6,02·10²³. Атомы такие крошечные, что меньшей «упаковкой» пользоваться неудобно.</p>
<div class="box ex"><b>Примеры</b>1 моль воды — 6,02·10²³ молекул H₂O. 1 моль железа — 6,02·10²³ атомов Fe. 2 моль кислорода O₂ — 12,04·10²³ молекул.</div>
<div class="box err"><b>Частая ошибка</b>Путать молекулы и атомы. В 1 моль H₂O — 1 моль молекул, но 2 моль атомов H и 1 моль атомов O (всего 3 моль атомов).</div>
<div class="box tip"><b>Атомы внутри</b>n(атомов элемента) = n(вещества) · индекс. В 2 моль H₂SO₄: n(O) = 2·4 = 8 моль.</div>`},
{title:'Число Авогадро: N = n · N<sub>A</sub>',lvl:1,html:`
<div class="box rule"><b>Формулы</b><span class="m">N = n · N<sub>A</sub></span>, <span class="m">n = N / N<sub>A</sub></span>, где N<sub>A</sub> = 6,02·10²³ моль⁻¹ — постоянная Авогадро.</div>
<p><b>Почему так.</b> Число частиц = число «упаковок» × сколько в одной упаковке. Как число яиц = число десятков × 10.</p>
<div class="box ex"><b>Пример 1</b>3 моль CO₂: N = 3 · 6,02·10²³ = 18,06·10²³ = 1,806·10²⁴ молекул.</div>
<div class="box ex"><b>Пример 2</b>N = 3,01·10²³ атомов железа: n = 3,01·10²³ / 6,02·10²³ = 0,5 моль.</div>
<div class="box tip"><b>Как вводить ответ</b>В задачах тренажёра ответ про число частиц вводят «в единицах 10²³»: 18,06·10²³ → пиши 18,06. Степени при делении сокращаются: 10²³ / 10²³ = 1.</div>
<div class="fact">Амедео Авогадро (1776–1856) сам этого числа не знал! Его впервые оценил в 1865 году австриец Йозеф Лошмидт, а назвали в честь Авогадро позже, в начале XX века.</div>`},
{title:'Молярная масса M',lvl:2,html:`
<div class="box rule"><b>Определение</b><b>Молярная масса</b> M — масса 1 моль вещества: <span class="m">M = m / n</span>, единица г/моль. Численно M равна M<sub>r</sub>: M<sub>r</sub>(H₂O) = 18 → M(H₂O) = 18 г/моль.</div>
<p><b>Почему так.</b> Число Авогадро подобрали специально так, чтобы 1 моль атомов углерода весил ровно 12 г. Поэтому «относительная масса» молекулы сразу превращается в граммы на моль. Очень удобно!</p>
<div class="box rule"><b>Главные формулы</b><span class="m">n = m / M</span>, <span class="m">m = n · M</span></div>
<div class="box ex"><b>Пример</b>Сколько моль в 88 г CO₂? M(CO₂) = 12 + 2·16 = 44 г/моль; n = 88 / 44 = 2 моль.</div>
<div class="box err"><b>Частая ошибка</b>Делить «наоборот»: n = M / m. Проверяй по единицам: г : (г/моль) = моль ✔, а (г/моль) : г — не моль.</div>
<div class="box tip"><b>Треугольник</b>Закрой пальцем нужную величину: <span class="m">m</span> сверху, <span class="m">n · M</span> снизу. m = n·M, n = m/M, M = m/n.</div>`},
{title:'Цепочка m ↔ n ↔ N',lvl:3,html:`
<div class="box rule"><b>Правило моста</b>Из граммов в штуки (и обратно) всегда идём <b>через моли</b>: <span class="m">m → n = m/M → N = n·N<sub>A</sub></span>.</div>
<div class="fig">${hubPic(['n'])}</div>
<p><b>Почему так.</b> Количество вещества n — как «пересадочная станция метро»: все линии пересекаются в ней. Из любой величины — в n, а из n — в любую.</p>
<div class="box ex"><b>Пример</b>Сколько молекул в 9 г воды? n = 9 / 18 = 0,5 моль; N = 0,5 · 6,02·10²³ = 3,01·10²³.</div>
<div class="box ex"><b>Обратно</b>Масса 1,204·10²⁴ атомов меди? n = 12,04·10²³ / 6,02·10²³ = 2 моль; m = 2 · 64 = 128 г.</div>
<div class="box err"><b>Частая ошибка</b>Сравнивать число молекул по граммам: «в 1 г кислорода больше молекул, чем в 1 г водорода, раз кислород тяжелее». Наоборот! 1 г H₂ — 0,5 моль, 1 г O₂ — всего 1/32 моль. Лёгких молекул в том же грамме больше.</div>`},
{title:'Живой калькулятор моля',lvl:3,html:`
<p>Выбери вещество и двигай ползунок количества вещества — смотри, как меняются масса, число частиц и объём (для газов).</p>
<div class="widget" id="w-mole"></div>`},
{title:'Молярный объём газа: 22,4 л',lvl:4,html:`
<div class="box rule"><b>Закон Авогадро</b>В равных объёмах разных газов при одинаковых условиях — одинаковое число молекул. Поэтому 1 моль <b>любого газа</b> при нормальных условиях (н.у.: 0 °С и 101,3 кПа) занимает <b>V<sub>m</sub> = 22,4 л/моль</b>.</div>
<div class="box rule"><b>Формулы</b><span class="m">V = n · V<sub>m</sub></span>, <span class="m">n = V / V<sub>m</sub></span></div>
<p><b>Почему так.</b> В газе молекулы очень далеко друг от друга — расстояния в сотни раз больше самих молекул. Поэтому объём газа зависит от <b>числа</b> молекул, а не от того, большие они или маленькие. Как зрители на огромном стадионе: неважно, худые они или нет — места на трибунах нужно по числу людей.</p>
<div class="box ex"><b>Пример</b>2 моль кислорода при н.у.: V = 2 · 22,4 = 44,8 л. 11,2 л водорода: n = 11,2 / 22,4 = 0,5 моль.</div>
<div class="box err"><b>Частая ошибка</b>Применять 22,4 л к воде или железу. Только для <b>газов</b>! 1 моль воды (18 г) — это всего 18 мл.</div>
<div class="fact">22,4 л — это куб с ребром примерно 28 см, чуть больше коробки из-под обуви. В нём 6,02·10²³ молекул любого газа: хоть лёгкого водорода, хоть тяжёлого хлора.</div>`},
{title:'Переходы m ↔ V и N ↔ V',lvl:5,html:`
<div class="box rule"><b>Тот же мост</b><span class="m">m → n = m/M → V = n·V<sub>m</sub></span> и обратно <span class="m">V → n = V/V<sub>m</sub> → m = n·M</span>.</div>
<div class="fig">${hubPic(['m','n','V'])}</div>
<div class="box ex"><b>Пример</b>Какой объём займут 8,8 г CO₂ при н.у.? n = 8,8 / 44 = 0,2 моль; V = 0,2 · 22,4 = 4,48 л.</div>
<div class="box ex"><b>Пример 2</b>Масса 5,6 л аммиака NH₃ (н.у.)? n = 5,6 / 22,4 = 0,25 моль; m = 0,25 · 17 = 4,25 г.</div>
<div class="box tip"><b>Одной формулой</b><span class="m">${H.frac('m','M')} = ${H.frac('V','V<sub>m</sub>')} = ${H.frac('N','N<sub>A</sub>')} = n</span> — все три отношения равны одному и тому же n.</div>
<div class="box err"><b>Частая ошибка</b>Думать, что 10 г водорода и 10 г кислорода займут одинаковый объём. Нет: одинаковый объём у одинакового <b>числа моль</b>. 10 г H₂ — 5 моль (112 л), 10 г O₂ — 0,3125 моль (7 л).</div>`},
{title:'Плотность газов: почему шарик улетает',lvl:6,html:`
<div class="box rule"><b>Относительная плотность</b>Во сколько раз один газ тяжелее другого: <span class="m">D = M₁ / M₂</span>.<br>По воздуху: <span class="m">D<sub>возд</sub> = M / 29</span>; по водороду: <span class="m">D<sub>H₂</sub> = M / 2</span>.<br>Обратно: <span class="m">M = 29·D<sub>возд</sub></span>, <span class="m">M = 2·D<sub>H₂</sub></span>.</div>
<p><b>Почему так.</b> Одинаковые объёмы газов содержат одинаковое число молекул (закон Авогадро). Значит, их массы относятся как массы молекул, то есть как молярные массы. 29 г/моль — средняя молярная масса воздуха (в нём ≈ 78% N₂ с M = 28 и ≈ 21% O₂ с M = 32).</p>
<div class="box ex"><b>Пример</b>Гелий: D<sub>возд</sub> = 4 / 29 ≈ 0,14 — в 7 раз легче воздуха, поэтому шарик улетает. CO₂: 44 / 29 ≈ 1,52 — тяжелее воздуха, скапливается внизу.</div>
<div class="box ex"><b>Пример 2</b>Газ в 8 раз тяжелее водорода: M = 2 · 8 = 16 г/моль — это метан CH₄.</div>
<div class="box tip"><b>Плотность газа при н.у.</b><span class="m">ρ = M / 22,4</span> (г/л). Воздух: 29 / 22,4 ≈ 1,29 г/л.</div>
<div class="box err"><b>Частая ошибка</b>Делить на 1 вместо 2: M(H₂) = 2, а не 1 — водород состоит из молекул H₂.</div>
<div class="fact">В «Собачьей пещере» под Неаполем углекислый газ стелется у пола слоем около полуметра: собака задыхалась, а стоящий рядом человек дышал спокойно.</div>`},
{title:'★ Смеси газов и хитрые задачи',lvl:7,html:`
<div class="box rule"><b>Средняя молярная масса смеси газов</b><span class="m">M<sub>ср</sub> = φ₁·M₁ + φ₂·M₂ + …</span>, где φ — объёмные (они же мольные) доли.</div>
<div class="box ex"><b>Пример: воздух</b>0,78·28 + 0,21·32 + 0,01·40 ≈ 28,96 ≈ 29 г/моль. Вот откуда «29».</div>
<div class="box ex"><b>Найти состав</b>Смесь H₂ и O₂ имеет D<sub>H₂</sub> = 9, т. е. M<sub>ср</sub> = 18. Пусть доля H₂ = x: 2x + 32(1 − x) = 18 → 30x = 14 → x ≈ 0,467 (46,7%).</div>
<div class="box tip"><b>Атомы в порции</b>Сначала n вещества, потом умножь на число атомов в формуле. В 9 г H₂O: 0,5 моль молекул → 1,5 моль атомов → 9,03·10²³ атомов.</div>
<div class="box tip"><b>Масса одной молекулы</b><span class="m">m₀ = M / N<sub>A</sub></span>. Для воды: 18 / 6,02·10²³ ≈ 2,99·10⁻²³ г.</div>`}
];

/* ---------- widget ---------- */
function onTheory(root){const w=root.querySelector('#w-mole');if(!w)return;
  const L=['H2O','CO2','O2','H2','He','CH4','NaCl','Fe','Au0','C12H22O11'].filter(f=>SUB[f]);
  const sel='font:inherit;font-size:16px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)';
  w.innerHTML=`<label>Вещество: <select id="wS" style="${sel}">${L.map(f=>`<option value="${f}">${nm(f)} — ${f.replace(/(\d+)/g,d=>d.replace(/\d/g,c=>'₀₁₂₃₄₅₆₇₈₉'[c]))}</option>`).join('')}</select></label>
<label>n = <output id="wn">1</output> моль<input type="range" id="wN" min="0.1" max="5" step="0.1" value="1"></label>
<div id="wO" style="font-size:15px;line-height:1.7"></div>`;
  const g=id=>w.querySelector(id);
  const draw=()=>{const f=g('#wS').value,n=+g('#wN').value;g('#wn').textContent=N(n);const M=Mr(f);const m=rd(n*M,2);const isG=GAS.includes(f);
    g('#wO').innerHTML=`M = ${MrSum(f)} г/моль<br>m = n·M = ${N(n)}·${N(M)} = <span class="out">${N(m)} г</span><br>N = n·N<sub>A</sub> = ${N(n)}·6,02·10<sup>23</sup> = <span class="out">${sci(n*NA*1e23,3)}</span> ${f==='Fe'?'атомов':'частиц'}<br>`+
    (isG?`V = n·V<sub>m</sub> = ${N(n)}·22,4 = <span class="out">${N(rd(n*VM,2))} л</span> (н.у.) — это ${N(rd(n*VM/0.5,1))} пол-литровых бутылок`:`<span class="small">22,4 л здесь не работает: при н.у. это не газ.</span>`)+
    (f==='H2O'?`<br>Объём жидкой воды: ≈ <span class="out">${N(rd(m,1))} мл</span> — примерно ${N(rd(m/18,1))} ${(v=>Number.isInteger(v)?H.plural(v,'глоток','глотка','глотков'):'глотка')(rd(m/18,1))} 😄`:'');};
  w.querySelectorAll('select,input').forEach(i=>i.oninput=i.onchange=draw);draw();}

explain2:`1 моль — 6,02·10²³ частиц. ${N(n)} моль — в ${N(n)} раз ${n<1?'меньше':'больше'}: 6,02 · ${N(n)} = ${N(rd(ans,3))}, и степень 10<sup>23</sup> остаётся.`};});
G(1,()=>{const f=pick(ALL);const n=pick(NS);const Nn=n*NA;
return {type:'num',q:`Сколько моль ${gn(f)} ${C(f)} содержат ${s23(Nn)} частиц? Ответ в молях.`,ans:n,tol:0.01,
short:`n = ${N(rd(Nn,3))}·10²³ / 6,02·10²³ = ${N(n)} моль.`,explain:`n = N / N<sub>A</sub> = ${s23(Nn)} / 6,02·10<sup>23</sup>. Степени 10<sup>23</sup> сокращаются: ${N(rd(Nn,3))} / 6,02 = <b>${N(n)} моль</b>.`,
explain2:`Сколько раз «упаковка» в 6,02·10²³ поместится в ${N(rd(Nn,3))}·10²³? ${N(rd(Nn,3))} : 6,02 = ${N(n)}. Это и есть число молей.`};});
G(1,()=>{const f=pick(['H2O','CO2','NH3','CH4','H2SO4','O2','N2','HCl','SO2','C3H8']);const n=pick([0.5,1,2,0.1,0.2,0.25]);const k=atomsTotal(f);const ans=n*k*NA;
return {type:'num',q:`Сколько <b>всего атомов</b> в ${N(n)} моль ${C(f)}? Ответ в единицах 10<sup>23</sup>.`,ans,tol:0.012/ans,hint:`Сколько атомов в одной молекуле ${C(f)}?`,
short:`${N(n)}·${k}·6,02 = ${N(rd(ans,3))} → ${s23(ans)}.`,explain:`В одной молекуле ${C(f)} — ${k} ${H.plural(k,'атом','атома','атомов')}. Атомов в моль: n(атомов) = ${N(n)} · ${k} = ${N(n*k)} моль.<br>N = ${N(n*k)} · 6,02·10<sup>23</sup> = <b>${s23(ans)}</b>.`,
explain2:`Сначала посчитай молекулы: ${N(n)}·6,02·10²³ = ${s23(n*NA)}. В каждой ${k} ${H.plural(k,'атом','атома','атомов')} → умножаем на ${k}: ${s23(ans)}.`};});

/* L2 — M */
RULE(2,'Что такое молярная масса M и как она связана с M<sub>r</sub>?','Масса 1 моль вещества в г/моль; численно равна M<sub>r</sub>',['Масса одной молекулы в граммах','Число молекул в 1 г вещества','Масса 22,4 л любого вещества'],
{short:'M = m/n, г/моль; M(H₂O) = 18 г/моль, как M<sub>r</sub> = 18.',explain:'Молярная масса — масса одного моля: M = m / n, единица г/моль. Её значение совпадает с M<sub>r</sub>: для воды M<sub>r</sub> = 18 → M = 18 г/моль. Масса одной молекулы — крошечная (≈3·10⁻²³ г), а 22,4 л — объём газа, не любой вещества.',
explain2:'«Сколько весит одна упаковка-моль?» — вот что такое M. У воды — 18 г, у железа — 56 г, у сахара — 342 г.'});
RULE(2,'Как найти количество вещества по массе?','n = m / M',['n = M / m','n = m · M','n = m / 22,4'],
{short:'n = m / M.',explain:'Масса делить на массу одного моля = число молей: n = m / M. Проверка единицами: г : (г/моль) = моль ✔. При n = M/m получилось бы «1/моль» — бессмыслица.',
explain2:'Пачка бумаги весит 2,5 кг, всего бумаги 10 кг → пачек 10 : 2,5 = 4. Так же и моли: всю массу делим на массу одного моля.'});
G(2,()=>{const f=pick(['H2O','CO2','NaCl','CaCO3','H2SO4','NH3','CH4','C12H22O11','HCl','Cl2','NaOH','SO2','O2','C3H8','Fe2O3','CuSO4','Al2O3','HNO3']);const m=Mr(f);
return {type:'num',q:`Найди молярную массу ${C(f)} в г/моль. A<sub>r</sub>: ${Object.keys(parseF(f)).map(e=>`${e} = ${N(AR[e])}`).join(', ')}.`,ans:m,
short:`${MS(f)}.`,explain:`M численно равна M<sub>r</sub>: сумма A<sub>r</sub> всех атомов.<br>${MS(f)}. Ответ: <b>${N(m)} г/моль</b>.`,
explain2:`Разбери формулу на атомы: ${Object.entries(parseF(f)).map(([e,k])=>`${k}×${e}`).join(', ')}. Сложи их массы — получишь M в г/моль.`};});
G(2,()=>{const f=pick(ALL);const n=pick(NS);const M=Mr(f);const m=rd(n*M,4);
return {type:'num',q:`Сколько моль составляют ${N(m)} г ${gn(f)} ${C(f)}?`,ans:n,tol:0.01,
short:`n = ${N(m)} / ${N(M)} = ${N(n)} моль.`,explain:`1) ${MS(f)}.<br>2) n = m / M = ${N(m)} / ${N(M)} = <b>${N(n)} моль</b>.`,
explain2:`Сколько раз по ${N(M)} г помещается в ${N(m)} г? ${N(m)} : ${N(M)} = ${N(n)}. Это и есть число молей.`};});
G(2,()=>{const f=pick(ALL);const n=pick(NS);const M=Mr(f);const m=n*M;
return {type:'num',q:`Какова масса ${N(n)} моль ${gn(f)} ${C(f)}? Ответ в граммах.`,ans:m,tol:0.012/m,
short:`m = ${N(n)} · ${N(M)} = ${N(rd(m,3))} г.`,explain:`1) ${MS(f)}.<br>2) m = n · M = ${N(n)} · ${N(M)} = <b>${N(rd(m,3))} г</b>.`,
explain2:`1 моль весит ${N(M)} г. ${N(n)} моль — в ${N(n)} раз ${n<1?'меньше':'больше'}: ${N(rd(m,3))} г.`};});

/* L3 — m ↔ N */
RULE(3,'Как перейти от массы вещества к числу молекул?','Через количество вещества: n = m/M, потом N = n·N<sub>A</sub>',['Сразу N = m·N<sub>A</sub>','N = m / N<sub>A</sub>','N = M·N<sub>A</sub> / m'],
{short:'Мост через моли: m → n → N.',explain:'Из граммов в штуки напрямую не перейти: сначала находим число молей n = m/M, затем N = n·N<sub>A</sub>. Вместе: N = m·N<sub>A</sub>/M. Формула «m·N<sub>A</sub>» забывает поделить на M — масса молекул разная!',
explain2:'Мешок гвоздей весит 2 кг, один гвоздь — 10 г. Чтобы узнать число гвоздей, делишь массу на массу одного. Здесь «один» — это моль (M), а потом умножаем на число штук в моле.'});
G(3,()=>{const f=pick(ALL);const n=pick(NS);const M=Mr(f);const m=rd(n*M,4);const ans=n*NA;
return {type:'num',q:`Сколько частиц содержится в ${N(m)} г ${gn(f)} ${C(f)}? Ответ в единицах 10<sup>23</sup>.`,ans,tol:0.012/ans,
short:`n = ${N(m)}/${N(M)} = ${N(n)} моль; N = ${s23(ans)}.`,explain:`1) ${MS(f)}.<br>2) n = ${N(m)} / ${N(M)} = ${N(n)} моль.<br>3) N = ${N(n)} · 6,02·10<sup>23</sup> = <b>${s23(ans)}</b>.`,
explain2:`Схема: граммы → (делим на M) → моли → (умножаем на 6,02·10²³) → штуки. ${N(m)} → ${N(n)} → ${N(rd(ans,3))}·10²³.`};});
G(3,()=>{const f=pick(ALL);const n=pick(NS);const M=Mr(f);const Nn=n*NA;const m=n*M;
return {type:'num',q:`Какова масса ${s23(Nn)} частиц ${gn(f)} ${C(f)}? Ответ в граммах.`,ans:m,tol:0.012/m,
short:`n = ${N(n)} моль; m = ${N(n)}·${N(M)} = ${N(rd(m,3))} г.`,explain:`1) n = N / N<sub>A</sub> = ${N(rd(Nn,3))} / 6,02 = ${N(n)} моль.<br>2) ${MS(f)}.<br>3) m = ${N(n)} · ${N(M)} = <b>${N(rd(m,3))} г</b>.`,
explain2:`Обратный путь по мосту: штуки → (делим на 6,02·10²³) → моли → (умножаем на M) → граммы.`};});
G(3,()=>{for(;;){const fs=sample(['H2','O2','N2','CO2','CH4','H2O','NH3','Cl2','He','SO2','HCl'],4);const ms=fs.map(Mr);const mn=Math.min(...ms);if(ms.filter(x=>x===mn).length>1)continue;const f=fs[ms.indexOf(mn)];const m=pick([1,10,100]);
return CH(`В какой порции больше всего молекул (атомов): ${fs.map(x=>`${m} г ${C(x)}`).join(', ')}?`,`${m} г ${C(f)}`,fs.filter(x=>x!==f).map(x=>`${m} г ${C(x)}`),
{short:`Самая маленькая M — у ${C(f)} (${N(mn)} г/моль) → больше всего моль.`,explain:`При одинаковой массе n = m / M больше там, где M меньше:<br>${fs.map(x=>`${C(x)}: ${m} / ${N(Mr(x))} ≈ ${N(rd(m/Mr(x),3))} моль`).join('<br>')}<br>Больше всего частиц — в <b>${m} г ${C(f)}</b>.`,
explain2:`Килограмм вишен или килограмм арбузов — где больше штук? Конечно, вишен: каждая лёгкая. Самые «лёгкие» частицы здесь — ${C(f)}.`});}});

/* L4 — Vm */
RULE(4,'Какой объём занимает 1 моль любого газа при нормальных условиях?','22,4 л',['1 л','18 л','Зависит от газа: у тяжёлых больше'],
{short:'V<sub>m</sub> = 22,4 л/моль (н.у.).',explain:'По закону Авогадро равные объёмы газов содержат равное число молекул. Значит, 1 моль любого газа при н.у. (0 °С, 101,3 кПа) занимает одинаковый объём — 22,4 л. От «тяжести» газа объём не зависит: молекулы в газе далеко друг от друга.',
explain2:'Стадион и зрители: мест нужно по числу людей, а не по их весу. В газе «места» между молекулами огромные, сами молекулы почти не важны.'});
RULE(4,'К какому веществу <b>нельзя</b> применить V<sub>m</sub> = 22,4 л/моль при н.у.?','К воде H₂O',['К кислороду O₂','К метану CH₄','К азоту N₂'],
{short:'22,4 л — только для газов, а вода при 0 °С — жидкость/лёд.',explain:'Молярный объём 22,4 л/моль — только для <b>газов</b>. При н.у. (0 °С) вода — жидкость (или лёд): 1 моль воды занимает всего около 18 мл. Кислород, метан и азот — газы, к ним 22,4 л применять можно.',
explain2:'Если бы 18 г воды (глоток!) занимали 22,4 л, литровая бутылка воды весила бы меньше грамма. Глупость, правда? 22,4 л — для газов.'});
G(4,()=>{const f=pick(GAS);const n=pick(NS);const V=n*VM;
return {type:'num',q:`Какой объём (н.у.) займут ${N(n)} моль ${gn(f)} ${C(f)}? Ответ в литрах.`,ans:V,tol:0.003,
short:`V = ${N(n)}·22,4 = ${N(rd(V,3))} л.`,explain:`V = n · V<sub>m</sub> = ${N(n)} · 22,4 = <b>${N(rd(V,3))} л</b>. Какой именно газ — неважно: 1 моль любого газа при н.у. — 22,4 л.`,
explain2:`Каждый моль — это «куб» 22,4 л. ${N(n)} таких кубов — ${N(rd(V,3))} л.`};});
G(4,()=>{const f=pick(GAS);const n=pick(NS);const V=rd(n*VM,4);
return {type:'num',q:`Сколько моль ${gn(f)} содержится в ${N(V)} л ${C(f)} при н.у.?`,ans:n,tol:0.01,
short:`n = ${N(V)} / 22,4 = ${N(n)} моль.`,explain:`n = V / V<sub>m</sub> = ${N(V)} / 22,4 = <b>${N(n)} моль</b>.`,
explain2:`Сколько раз по 22,4 л помещается в ${N(V)} л? ${N(V)} : 22,4 = ${N(n)}.`};});
G(4,()=>{const f=pick(GAS);const n=pick(NS);const V=rd(n*VM,4);const ans=n*NA;
return {type:'num',q:`Сколько молекул ${f==='He'||f==='Ar'?'(атомов) ':''}${gn(f)} в ${N(V)} л (н.у.)? Ответ в единицах 10<sup>23</sup>.`,ans,tol:0.012/ans,
short:`n = ${N(n)} моль → N = ${s23(ans)}.`,explain:`1) n = ${N(V)} / 22,4 = ${N(n)} моль.<br>2) N = ${N(n)} · 6,02·10<sup>23</sup> = <b>${s23(ans)}</b>.`,
explain2:`22,4 л любого газа ↔ 6,02·10²³ молекул. ${N(V)} л — это ${N(n)} таких порций → ${N(rd(ans,3))}·10²³.`};});

/* L5 — m ↔ V */
RULE(5,'Как найти объём газа (н.у.), если известна его масса?','Найти n = m/M, затем V = n·22,4',['V = m · 22,4','V = m / 22,4','V = M · 22,4 / m'],
{short:'m → n → V.',explain:'Снова мост через моли: n = m / M, потом V = n · V<sub>m</sub>. «m · 22,4» забывает, что газы с разной M при одинаковой массе содержат разное число молей.',
explain2:'1 г водорода — это 0,5 моль (11,2 л), а 1 г кислорода — 1/32 моль (0,7 л). Масса одна, объёмы разные — значит, без M не обойтись.'});
G(5,()=>{const f=pick(GAS);const n=pick(NS);const M=Mr(f);const m=rd(n*M,4);const V=n*VM;
return {type:'num',q:`Какой объём при н.у. займут ${N(m)} г ${gn(f)} ${C(f)}? Ответ в литрах.`,ans:V,tol:0.003,
short:`n = ${N(m)}/${N(M)} = ${N(n)} моль; V = ${N(rd(V,3))} л.`,explain:`1) ${MS(f)}.<br>2) n = ${N(m)} / ${N(M)} = ${N(n)} моль.<br>3) V = ${N(n)} · 22,4 = <b>${N(rd(V,3))} л</b>.`,
explain2:`Одной формулой: V = m·22,4 / M = ${N(m)}·22,4 / ${N(M)} = ${N(rd(V,3))} л.`};});
G(5,()=>{const f=pick(GAS);const n=pick(NS);const M=Mr(f);const V=rd(n*VM,4);const m=n*M;
return {type:'num',q:`Найди массу ${N(V)} л ${gn(f)} ${C(f)} (н.у.). Ответ в граммах.`,ans:m,tol:0.012/m,
short:`n = ${N(V)}/22,4 = ${N(n)} моль; m = ${N(rd(m,3))} г.`,explain:`1) n = ${N(V)} / 22,4 = ${N(n)} моль.<br>2) ${MS(f)}.<br>3) m = ${N(n)} · ${N(M)} = <b>${N(rd(m,3))} г</b>.`,

G(5,()=>{for(;;){const fs=sample(GAS,4);const ms=fs.map(Mr);const mx=Math.max(...ms),mn=Math.min(...ms);const big=R(0,1);const tgt=big?mn:mx;if(ms.filter(x=>x===tgt).length>1)continue;const f=fs[ms.indexOf(tgt)];const m=pick([10,20,50]);
return CH(`Взяли по ${m} г каждого газа: ${fs.map(C).join(', ')}. Какой займёт <b>${big?'наибольший':'наименьший'}</b> объём (н.у.)?`,C(f),fs.filter(x=>x!==f).map(C),
{short:`${big?'Наименьшая':'Наибольшая'} M — у ${C(f)}.`,explain:`V = m·22,4 / M: при одинаковой массе объём обратно пропорционален M.<br>${fs.map(x=>`${C(x)}: ${m}·22,4/${N(Mr(x))} ≈ ${N(rd(m*VM/Mr(x),2))} л`).join('<br>')}<br>Ответ: <b>${C(f)}</b>.`,
explain2:`Чем легче молекулы, тем больше их помещается в ${m} г, а объём газа зависит только от числа молекул. ${big?'Самые лёгкие':'Самые тяжёлые'} — ${C(f)} (M = ${N(tgt)}).`});}});

/* L6 — плотность */
RULE(6,'Как вычислить относительную плотность газа по воздуху?','D<sub>возд</sub> = M(газа) / 29',['D<sub>возд</sub> = 29 / M(газа)','D<sub>возд</sub> = M(газа) / 22,4','D<sub>возд</sub> = M(газа) · 29'],
{short:'D = M / 29; по водороду — M / 2.',explain:'Относительная плотность показывает, во сколько раз газ тяжелее воздуха: D = M(газа) / M(воздуха) = M / 29. Деление на 22,4 даёт другое — плотность в г/л при н.у.',
explain2:'Если D > 1 — газ тяжелее воздуха (CO₂: 44/29 ≈ 1,5), если D < 1 — легче (He: 4/29 ≈ 0,14), и шарик с ним улетит.'});
RULE(6,'Почему для сравнения плотностей газов можно просто сравнить их молярные массы?','Равные объёмы газов содержат равное число молекул (закон Авогадро)',['Все газы имеют одинаковую массу','Молекулы всех газов одного размера','Потому что 1 моль любого газа весит 22,4 г'],
{short:'Закон Авогадро: одинаковый объём — одинаковое число молекул.',explain:'В одном литре любого газа (при одинаковых условиях) одинаковое число молекул. Значит, масса литра пропорциональна массе одной молекулы, то есть M. Поэтому D = M₁/M₂. Размер молекул тут ни при чём, а 22,4 — это литры, а не граммы.',
explain2:'Два одинаковых автобуса, в каждом по 40 пассажиров: в одном борцы-тяжеловесы, в другом гимнасты. Какой тяжелее, зависит только от массы одного пассажира. Газ — «автобус» с одинаковым числом молекул.'});
G(6,()=>{const f=pick(GAS.filter(x=>x!=='He'));const M=Mr(f);const ref=pick(['air','h2']);const D=ref==='air'?M/29:M/2;
return NUM(`Найди относительную плотность ${gn(f)} ${C(f)} по ${ref==='air'?'воздуху':'водороду'}.`,D,ref==='air'?2:2,
{short:`D = ${N(M)} / ${ref==='air'?29:2} ≈ ${N(rd(D,2))}.`,explain:`D<sub>${ref==='air'?'возд':'H₂'}</sub> = M(${C(f)}) / ${ref==='air'?'M(воздуха) = '+N(M)+' / 29':'M(H₂) = '+N(M)+' / 2'} ≈ <b>${N(rd(D,2))}</b>.${ref==='air'?(D>1?' Газ тяжелее воздуха.':' Газ легче воздуха.'):''}`,
explain2:`${MS(f)}. ${ref==='air'?'Воздух в среднем «весит» 29 г/моль':'Водород H₂ — 2 г/моль (не 1: молекула из двух атомов)'}. Во сколько раз ${N(M)} больше? ${N(M)} : ${ref==='air'?29:2} ≈ ${N(rd(D,2))}.`});});
G(6,()=>{const f=pick(['CH4','O2','N2','CO2','NH3','SO2','Cl2','C3H8','HCl','He','Ar','CO','C4H10','C2H6']);const M=Mr(f);const D=M/2;
return {type:'num',q:`Плотность газа по водороду равна ${N(D)}. Найди его молярную массу в г/моль.`,ans:M,
short:`M = 2·${N(D)} = ${N(M)} г/моль${f!=='CO'&&f!=='N2'?` (например, ${C(f)})`:''}.`,explain:`D<sub>H₂</sub> = M / M(H₂) → M = 2 · D = 2 · ${N(D)} = <b>${N(M)} г/моль</b>.${f!=='CO'&&f!=='N2'&&f!=='C3H8'?` Такую молярную массу имеет, например, ${C(f)}.`:''}`,
