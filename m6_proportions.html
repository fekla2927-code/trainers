pic:mapFig(d,`Масштаб 1 : ${NN(S)}`,tn),ans,hint:'Сначала узнай, сколько километров в 1 см карты.',short:`В 1 см — ${N(km)} км; ${N(d)} · ${N(km)} = ${N(ans)} км.`,
explain:`1) 1 : ${NN(S)} — в 1 см карты ${NN(S)} см местности. Зачёркиваем 5 нулей (1 км = 100 000 см): в 1 см — <b>${N(km)} км</b>.<br>2) ${N(d)} см на карте: ${N(d)} · ${N(km)} = <b>${N(ans)} км</b>.`,
explain2:`По-другому: ${N(d)} · ${NN(S)} = ${NN(d*S)} см на местности. ${NN(d*S)} см : 100 000 = ${N(ans)} км.`};});
G(5,()=>{const [S,km]=pick(SC);const d=pick([2,3,4,5,6,8,1.5,2.5,3.5]);const real=d*km;const tn=pick(towns);
return {type:'num',q:`Расстояние от ${tn[0]} до ${tn[1]} — ${N(real)} км. Каким будет отрезок на карте масштаба 1 : ${NN(S)}? Ответ дай в сантиметрах.`,
pic:mapFig(d,`Масштаб 1 : ${NN(S)}`,tn,{dlab:'? см'}),ans:d,short:`В 1 см — ${N(km)} км; ${N(real)} : ${N(km)} = ${N(d)} см.`,
explain:`1) В 1 см карты — ${NN(S)} см = <b>${N(km)} км</b>.<br>2) Сколько раз по ${N(km)} км помещается в ${N(real)} км? ${N(real)} : ${N(km)} = <b>${N(d)} см</b>.`,
explain2:`Переведём всё в сантиметры: ${N(real)} км = ${NN(real*100000)} см. На карте всё в ${NN(S)} раз меньше: ${NN(real*100000)} : ${NN(S)} = ${N(d)} см.`};});
G(5,()=>{const [S,km]=pick(SC);const d=pick([2,3,4,5,6,8]);const real=d*km;

short:`${N(real)} км = ${NN(real*100000)} см; ${NN(real*100000)} : ${d} = ${NN(S)}.`,
explain:`Масштаб — отношение длины на карте к длине на местности <b>в одинаковых единицах</b>.<br>${N(real)} км = ${NN(real*100000)} см.<br>${d} : ${NN(real*100000)} = 1 : (${NN(real*100000)} : ${d}) = <b>1 : ${NN(S)}</b>.`,
explain2:`Сначала найдём, сколько километров в 1 см: ${N(real)} : ${d} = ${N(km)} км = ${NN(S)} см. Значит, 1 см карты ↔ ${NN(S)} см местности: масштаб 1 : ${NN(S)}.`};});
G(5,()=>{const sc=pick([50,100,200]);const a=pick([4,5,6,8,10,12]),b=pick([3,4,5,6]);if(a===b)return null;const L=a*sc/100;

RULE(6,'Как разделить число N в отношении a : b?','Найти одну часть N : (a + b), затем умножить её на a и на b',['Разделить N на a и на b','Умножить N на a и на b','Разделить N пополам, а потом умножить половинки на a и на b'],
{short:'Всего a + b частей; одна часть = N : (a + b).',
explain:'В отношении a : b всего <b>a + b</b> равных частей. Одна часть = N : (a + b). Первое число = a частей, второе = b частей. Пример: 60 в отношении 2 : 3 → 5 частей по 12 → 24 и 36.',
explain2:'Ошибка «N : a и N : b»: 60 : 2 = 30, 60 : 3 = 20 — в сумме 50, а не 60, и больше досталось тому, у кого меньше частей. Сразу видно, что неверно.'});
G(6,()=>{const a=R(1,5),b=R(2,7);if(a===b||gcd(a,b)!==1)return null;const p=R(3,15);const Nn=(a+b)*p;const big=Math.max(a,b)*p;const nm=pick([['Джек','Билли'],['Гарри','Рон'],['Марио','Луиджи'],['Чук','Гек']]);
return {type:'num',q:`${nm[0]} и ${nm[1]} делят ${Nn} монет в отношении ${a} : ${b}. Сколько монет получит тот, кому достанется <b>больше</b>?`,ans:big,
pic:blocks([{n:a,label:nm[0]},{n:b,label:nm[1]}]),hint:'Сначала сосчитай, сколько всего частей.',short:`${a} + ${b} = ${a+b} частей; одна часть ${Nn} : ${a+b} = ${p}; ${Math.max(a,b)} · ${p} = ${big}.`,
explain:`1) Всего частей: ${a} + ${b} = ${a+b}.<br>2) Одна часть: ${Nn} : ${a+b} = ${p} монет.<br>3) ${nm[0]}: ${a} · ${p} = ${a*p}, ${nm[1]}: ${b} · ${p} = ${b*p}.<br>Больше получит ${a>b?nm[0]:nm[1]}: <b>${big}</b>. Проверка: ${a*p} + ${b*p} = ${Nn} ✅`,
explain2:`Посмотри на кубики на картинке: каждый кубик — одинаковая кучка монет. Кубиков ${a+b}, монет ${Nn}, значит в кубике ${p}. У ${a>b?nm[0]:nm[1]} ${Math.max(a,b)} кубиков → ${big} монет.`};});
G(6,()=>{const r=sample([1,2,3,4,5,6,7],3);const s=r[0]+r[1]+r[2];const p=R(2,12);const tot=s*p;const ask=R(0,2);
const it=pick([{intro:'Бетонную смесь делают из цемента, песка и щебня',nm:['цемент','песок','щебень'],gen:['цемента','песка','щебня'],u:'кг смеси',ua:'кг'},
{intro:'В шкатулке лежат красные, синие и зелёные бусины',nm:['красные','синие','зелёные'],gen:['красных бусин','синих бусин','зелёных бусин'],u:'бусин',ua:''},
{intro:'В армии короля рыцари, лучники и маги',nm:['рыцари','лучники','маги'],gen:['рыцарей','лучников','магов'],u:'воинов',ua:''}]);
return {type:'num',q:`${it.intro} в отношении ${r.join(' : ')}. Всего ${tot} ${it.u}. Сколько ${it.ua?it.ua+' '+it.gen[ask]:it.gen[ask]}?`,ans:r[ask]*p,
pic:blocks([{n:r[0],label:it.nm[0]},{n:r[1],label:it.nm[1]},{n:r[2],label:it.nm[2]}]),short:`${r.join(' + ')} = ${s} частей по ${p}; ${r[ask]} · ${p} = ${r[ask]*p}.`,
explain:`1) Всего частей: ${r.join(' + ')} = ${s}.<br>2) Одна часть: ${tot} : ${s} = ${p}.<br>3) ${it.nm[ask].charAt(0).toUpperCase()+it.nm[ask].slice(1)} — ${r[ask]} ${plural(r[ask],'часть','части','частей')}: ${r[ask]} · ${p} = <b>${r[ask]*p}</b>.`,
explain2:`Проверим все три: ${r.map(x=>x*p).join(' + ')} = ${tot} ✅. Значит, одна часть найдена правильно, и ответ ${r[ask]*p}.`};});
G(6,()=>{const a=R(1,6),b=R(2,9);if(a>=b||gcd(a,b)!==1)return null;const p=R(2,12);const diff=(b-a)*p;
return {type:'num',q:`Два числа относятся как ${a} : ${b}. Второе больше первого на ${diff}. Найди <b>первое</b> число.`,ans:a*p,
short:`Разность — это ${b} − ${a} = ${b-a} ${plural(b-a,'часть','части','частей')}; часть = ${diff} : ${b-a} = ${p}; первое = ${a} · ${p} = ${a*p}.`,
explain:`Первое число — ${a} ${plural(a,'часть','части','частей')}, второе — ${b}. Второе больше на ${b} − ${a} = ${b-a} ${plural(b-a,'часть','части','частей')}, и это ${diff}.<br>Одна часть: ${diff} : ${b-a} = ${p}.<br>Первое: ${a} · ${p} = <b>${a*p}</b> (второе ${b*p}; ${b*p} − ${a*p} = ${diff} ✅).`,
explain2:`${blocks([{n:a,label:'первое'},{n:b,label:'второе'}])}У второго на ${b-a} ${plural(b-a,'кубик','кубика','кубиков')} больше — эти лишние кубики и есть ${diff}. Значит, кубик = ${p}, а у первого ${a} кубиков = ${a*p}.`};});
G(6,()=>{const r=pick([[1,2,3],[2,3,4],[1,1,2],[1,3,5],[2,3,5],[1,4,7],[3,4,5],[1,2,6],[4,5,6]]);const s=r[0]+r[1]+r[2];if(180%s)return null;const p=180/s;
return {type:'num',q:`Углы треугольника относятся как ${r.join(' : ')}. Найди <b>наибольший</b> угол (в градусах). Подсказка: сумма углов треугольника 180°.`,ans:r[2]*p,
short:`${s} частей; часть = 180° : ${s} = ${p}°; ${r[2]} · ${p} = ${r[2]*p}°.`,
explain:`Сумма углов треугольника 180°. Всего частей: ${r.join(' + ')} = ${s}. Одна часть: 180 : ${s} = ${p}°.<br>Углы: ${r.map(x=>x*p+'°').join(', ')}. Наибольший — <b>${r[2]*p}°</b>.`,
explain2:`Проверка: ${r.map(x=>x*p).join(' + ')} = 180 ✅. Наибольшему углу соответствует наибольшее число частей — ${r[2]}.`};});

['время работы принтера (печатает равномерно) и число страниц','прямая','работает в 2 раза дольше — страниц в 2 раза больше'],

explain2:`Мысленный эксперимент: удвой первую величину и посмотри, что станет со второй. ${d[2].charAt(0).toUpperCase()+d[2].slice(1)}. Значит — ${d[1]}.`};},{rule:true});
G(7,()=>{const n=R(3,7),km=pick([10,12,15,20,25,30]);const an=pick([['лошадь','лошади','лошадей'],['собака','собаки','собак'],['страус','страуса','страусов']]);

{short:'Олимпиадный приём «сведи к одному»: одна курица за 3 дня — 1 яйцо.',

hint:'Сначала: сколько яиц сносит ОДНА курица за те же дни?',short:`1 курица за ${a} дн. — 1 яйцо; за ${c} дн. — ${N(c/a)}; ${b} куриц — ${N(ans)}.`,
explain:`Сведём к одной курице.<br>1) ${a} куриц за ${a} дней — ${a} яиц ⇒ <b>одна</b> курица за ${a} дней — 1 яйцо.<br>2) Одна курица за ${c} дней — ${c} : ${a} = ${N(c/a)} яйца.<br>3) ${b} куриц: ${b} · ${N(c/a)} = <b>${N(ans)}</b>.<br>Ловушка: нельзя рассуждать «${a} курицы — ${a} яйца, значит ${b} куриц — ${b} яиц»: число яиц зависит и от кур, и от дней сразу.`,
explain2:`Можно в «курице-днях». ${a} куриц · ${a} дней = ${a*a} курице-дней дают ${a} яиц, т.е. на одно яйцо нужно ${a} курице-дня. У нас ${b} · ${c} = ${b*c} курице-дней → ${b*c} : ${a} = ${N(ans)} яиц.`};},{star:true});

short:`Одна курица за 1,5 дня — 1 яйцо, т.е. за день ${FR(2,3)} яйца; ${n} · ${m} · ${FR(2,3)} = ${N(ans)}.`,
explain:`1) 1,5 курицы за 1,5 дня — 1,5 яйца ⇒ <b>1 курица</b> за 1,5 дня — <b>1 яйцо</b> (кур в 1,5 раза меньше — яиц в 1,5 раза меньше).<br>2) За 1 день одна курица сносит 1 : 1,5 = ${FR(2,3)} яйца.<br>3) ${n} куриц за ${m} дней: ${n} · ${m} · ${FR(2,3)} = ${n*m} · ${FR(2,3)} = <b>${N(ans)}</b>.`,
explain2:`Удвой всё: 3 курицы за 3 дня — уже 3 · 2 = 6 яиц? Нет! Удвоим кур: 3 курицы за 1,5 дня — 3 яйца. Удвоим дни: 3 курицы за 3 дня — 6 яиц. То есть 9 курице-дней дают 6 яиц — на одно яйцо 1,5 курице-дня. У нас ${n*m} курице-дней: ${n*m} : 1,5 = ${N(ans)}.`};},{star:true});
G(8,()=>{const a=R(2,6),b=R(2,8),c=R(2,6),d=R(2,10),e=R(2,10);const num=b*d*e,den=a*c;if(num%den)return null;const ans=num/den;if(a===d&&c===e)return null;
