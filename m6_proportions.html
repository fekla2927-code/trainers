<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Отношения и пропорции — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;

  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}

.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}

.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}

pre.code.sol{background:var(--ok-soft)}

.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}

.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">

  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;

{title:'Отношение: «во сколько раз?»',lvl:0,html:`

<div class="fig">${propFig('2','3','6','9')}</div>
<p>Проверим: 2 · 9 = 18 и 3 · 6 = 18. Равны — значит, пропорция верная.</p>
<p><b>Почему так?</b> Запишем пропорцию дробями: ${FR('a','b')} = ${FR('c','d')}. Умножим обе части на b·d (на одно и то же число — равенство не сломается). Слева b сократится, справа d сократится: остаётся a·d = c·b. Вот и весь фокус.</p>
<div class="box ex"><b>Пример</b>Верна ли пропорция 4 : 10 = 6 : 15?<br>Крайние: 4 · 15 = 60. Средние: 10 · 6 = 60. Равны → <b>верна</b>.</div>
<div class="box err"><b>Частая ошибка</b>Перемножать «соседей»: 4 · 10 и 6 · 15. Так нельзя! Перемножаем <b>крайние</b> (первое и последнее) и <b>средние</b> (два в середине). В записи дробями это «крест-накрест».</div>
<div class="fact">Слово «пропорция» — от латинского <i>proportio</i>, «соразмерность». Художники Возрождения, например Леонардо да Винчи, изучали пропорции тела: размах рук взрослого человека примерно равен его росту.</div>`},
{title:'Как найти неизвестный член пропорции',lvl:2,html:`
<div class="box rule"><b>Правило</b>Неизвестный <b>крайний</b> член = произведение средних : известный крайний.<br>Неизвестный <b>средний</b> член = произведение крайних : известный средний.</div>
<p>Это прямо следует из основного свойства. Пример: <span class="m">x : 6 = 10 : 15</span>.</p>
<ol class="steps"><li>Основное свойство: x · 15 = 6 · 10.</li><li>Значит, x · 15 = 60.</li><li>Неизвестный множитель = произведение : известный множитель: x = 60 : 15 = <b>4</b>.</li><li><b>Проверка:</b> 4 : 6 = ${FR(2,3)} и 10 : 15 = ${FR(2,3)}. Сошлось!</li></ol>
<div class="box ex"><b>Пример с дробями</b>${FR('x','12')} = ${FR('5','20')}. Крест-накрест: x · 20 = 12 · 5 = 60, x = 3.</div>
<div class="box tip"><b>Лайфхак</b>Иногда видно сразу: 5 : 20 = 1 : 4, значит x в 4 раза меньше 12, x = 3. Сначала поищи такую «короткую дорогу».</div>
<div class="box err"><b>Частая ошибка</b>Делить не на то число. В x · 15 = 60 нужно 60 : 15, а не 15 : 60. Проверка подстановкой всегда спасает.</div>`},
{title:'Прямая пропорциональность',lvl:3,html:`
<div class="box rule"><b>Правило</b>Две величины <b>прямо пропорциональны</b>, если при увеличении одной в несколько раз другая увеличивается <b>во столько же раз</b>. Их отношение постоянно: <span class="m">y : x = k</span>.</div>
<p>Примеры: количество одинаковых шоколадок и их стоимость; время и путь при постоянной скорости; число порций и количество продуктов в рецепте.</p>
<p>Двигай ползунок — рецепт блинов на 4 человека пересчитывается на любое число гостей:</p>
<div class="widget" id="w-recipe"></div>
<div class="box ex"><b>Задача</b>5 шоколадок стоят 350 ₽. Сколько стоят 8?<br>Способ 1 (через одну): 1 шоколадка — 350 : 5 = 70 ₽, 8 шоколадок — 70 · 8 = <b>560 ₽</b>.<br>Способ 2 (пропорция): 5 : 8 = 350 : x → x = 8 · 350 : 5 = 560 ₽.</div>
<div class="box tip"><b>Стрелки</b>Запиши данные столбиками и нарисуй стрелки: шоколадок больше ↑ — денег больше ↑. Стрелки смотрят <b>в одну сторону</b> → пропорция пишется «как есть».</div>
<div class="box err"><b>Ловушка</b>Не всё, что растёт вместе, — пропорционально! Возраст и рост: в 1 год ребёнок около 75 см, а в 10 лет — не 7,5 м 😄</div>`},
{title:'Обратная пропорциональность',lvl:4,html:`
<div class="box rule"><b>Правило</b>Две величины <b>обратно пропорциональны</b>, если при увеличении одной в несколько раз другая <b>уменьшается во столько же раз</b>. Их произведение постоянно: <span class="m">x · y = k</span>.</div>
<p>Примеры: скорость и время на одном и том же пути; число работников и время работы; число друзей и размер куска пиццы.</p>
<p>Путь 120 км. Меняй скорость — смотри, что станет со временем. Площадь прямоугольника (скорость × время) всегда одна и та же — это путь!</p>
<div class="widget" id="w-speed"></div>
<div class="box ex"><b>Задача</b>6 маляров красят забор за 8 дней. За сколько дней покрасят 4 маляра?<br>Вся работа = 6 · 8 = 48 «маляро-дней». 4 маляра: 48 : 4 = <b>12 дней</b>.<br>Пропорцией: маляров меньше ↓ — дней больше ↑, стрелки в разные стороны → одно отношение <b>переворачиваем</b>: 6 : 4 = x : 8 → x = 12.</div>
<div class="box err"><b>Частая ошибка</b>Писать пропорцию «как для прямой»: 6 : 4 = 8 : x → x ≈ 5,3. Получилось, что меньше маляров работают быстрее — бред! Всегда спрашивай себя: «ответ должен стать больше или меньше?»</div>`},
{title:'Масштаб и карты',lvl:5,html:`
<div class="box rule"><b>Правило</b><b>Масштаб</b> — отношение длины на карте к длине на местности. Масштаб <span class="m">1 : 100 000</span> значит: 1 см на карте = 100 000 см на местности = <b>1 км</b>.</div>
<div class="box tip"><b>Перевод единиц — главное!</b>1 м = 100 см. 1 км = 1000 м = <b>100 000 см</b>. Чтобы из «см на местности» получить км, зачеркни пять нулей.</div>
<div class="fig">${mapFig(5,'Масштаб 1 : 200 000 (в 1 см — 2 км)',['Сосновка','Озёрск'])}</div>
<div class="box ex"><b>Пример</b>На карте масштаба 1 : 200 000 от Сосновки до Озёрска 5 см. В 1 см — 200 000 см = 2 км. Значит, 5 см — <b>10 км</b>.<br>Обратная задача: 14 км — это 14 : 2 = 7 см на карте.</div>
<p>Карта — уменьшенная копия местности, поэтому длина на карте и на местности <b>прямо пропорциональны</b>.</p>
<div class="box err"><b>Частая ошибка</b>Забыть перевести сантиметры в километры и написать «1 000 000 км». Это длиннее, чем до Луны (≈ 384 000 км)!</div>
<div class="box tip"><b>Крупнее или мельче?</b>План комнаты 1 : 50 — <b>крупный</b> масштаб (видно даже розетки). Карта России 1 : 20 000 000 — <b>мелкий</b> (видно только большие города). Чем меньше второе число, тем крупнее масштаб.</div>
<div class="fact">В сказке Льюиса Кэрролла «Сильвия и Бруно» (1893) придумали карту в масштабе «миля к миле», то есть 1 : 1. Пользоваться ею так и не смогли: фермеры возмутились, что она закроет все поля от солнца. Поэтому использовали саму страну как её карту 😄</div>`},
{title:'Деление числа в данном отношении',lvl:6,html:`
<div class="box rule"><b>Правило</b>Чтобы разделить число в отношении <span class="m">a : b</span>: 1) найди, сколько всего частей: a + b; 2) найди одну часть: число : (a + b); 3) умножь одну часть на a и на b.</div>
<p>Два пирата нашли 60 монет и делят их в отношении 2 : 3 (кто больше работал — тому больше).</p>
<div class="fig">${blocks([{n:2,label:'Джек',under:'2 · 12 = 24'},{n:3,label:'Билли',under:'3 · 12 = 36'}])}</div>
<ol class="steps"><li>Всего частей: 2 + 3 = 5.</li><li>Одна часть: 60 : 5 = 12 монет.</li><li>Джек: 2 · 12 = <b>24</b>, Билли: 3 · 12 = <b>36</b>. Проверка: 24 + 36 = 60 ✅</li></ol>
<p>Так же делят и на три части: 1 : 3 : 5 → всего 9 частей.</p>
<div class="box err"><b>Частая ошибка</b>Делить 60 на 2 и на 3 (получится 30 и 20 — в сумме 50, и большему досталось меньше). Делим всегда на <b>сумму частей</b>.</div>
<div class="box tip"><b>Если дана разность</b>Отношение 3 : 5, и второе больше первого на 14. Разница — это 5 − 3 = 2 части. Одна часть = 14 : 2 = 7. Числа: 21 и 35.</div>`},
{title:'Прямая, обратная — или никакая?',lvl:7,html:`
<div class="box rule"><b>Как узнать</b>Спроси: «Если первую величину увеличить <b>в 2 раза</b>, что будет со второй?»<br>• Тоже в 2 раза больше → <b>прямая</b>.<br>• В 2 раза меньше → <b>обратная</b>.<br>• Ни то, ни другое (или вообще не меняется) → <b>никакая</b>, пропорцию писать нельзя!</div>
<div class="box ex"><b>Знаменитая шутка</b>«Три лошади пробежали 30 км. Сколько км пробежала каждая лошадь?» Ответ: <b>30 км</b>! Каждая бежала всю дорогу. Если делить 30 на 3, получится 10 — лошадь бы обиделась.</div>
<div class="box ex"><b>Ещё ловушка</b>Одно яйцо варится 4 минуты. Сколько варятся 3 яйца в одной кастрюле? Тоже 4 минуты, а не 12.</div>
<div class="box tip"><b>Алгоритм решения задачи</b>1) Выпиши величины столбиками. 2) Определи вид зависимости (стрелки). 3) Составь пропорцию (для обратной — переверни одно отношение). 4) Реши и проверь здравым смыслом.</div>`},
{title:'★ Олимпиадные приёмы',lvl:8,html:`
<p><b>Приём 1. «Сведи к одному».</b> «3 курицы за 3 дня сносят 3 яйца. Сколько яиц снесут 12 куриц за 12 дней?» Не 12! Одна курица за 3 дня — 1 яйцо. Значит, за 12 дней она снесёт 4 яйца. 12 куриц — 12 · 4 = <b>48</b>.</p>
<p><b>Приём 2. «Часть работы за единицу времени».</b> Карлсон съедает банку варенья за 3 минуты, Малыш — за 6. Карлсон за минуту съедает ${FR(1,3)} банки, Малыш — ${FR(1,6)}. Вместе за минуту: ${FR(1,3)} + ${FR(1,6)} = ${FR(1,2)} банки. Вся банка — за <b>2 минуты</b>.</p>
<p><b>Приём 3. Цепочка отношений.</b> a : b = 2 : 3 и b : c = 4 : 5. Сделаем b одинаковым: 8 : 12 и 12 : 15. Значит, a : b : c = 8 : 12 : 15.</p>
<p><b>Приём 4. Шестерёнки.</b> Зубцы, которые прошли через место сцепления, у обеих шестерёнок одинаковые. Поэтому число оборотов обратно пропорционально числу зубцов.</p>
<div class="fig">${gearsFig(10,20)}</div>
<div class="fact">В велосипеде со скоростями работает то же правило: передняя звёздочка на 44 зубца и задняя на 11 — за один оборот педалей заднее колесо делает 44 : 11 = 4 оборота.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>Отношение a : b — во сколько раз a больше b. Можно сокращать, как дробь.</li>
<li>Пропорция a : b = c : d. Главное свойство: a · d = b · c (крайние × крайние = средние × средние).</li>
<li>Прямая пропорциональность: одна ↑ в k раз — другая ↑ в k раз (y : x = const).</li>
<li>Обратная: одна ↑ в k раз — другая ↓ в k раз (x · y = const). В пропорции одно отношение переворачиваем.</li>
<li>Масштаб 1 : 100 000 — в 1 см 1 км. 1 км = 100 000 см.</li>
<li>Деление в отношении a : b — делим на сумму частей a + b.</li></ul>`}
];

explain2:`Разбей всех на группы по ${k}: мальчиков ${m} : ${k} = ${p} группы, девочек ${d} : ${k} = ${q}. На каждые ${p} мальчика (группы) приходится ${q} девочки (группы). Отношение ${c}.`});});
G(0,()=>{const a=pick([10,20,25,40,50,75,80]),b=pick([1,2,4,5]);const ans=a/(100*b);if(a>=100*b)return null;
return {type:'num',q:`Найди отношение <b>${a} см</b> к <b>${b} м</b>. Ответ запиши дробью или десятичной дробью.`,ans,
hint:'Сначала переведи метры в сантиметры.',short:`${b} м = ${100*b} см; ${a} : ${100*b} = ${N(ans)}.`,
explain:`Сравнивать можно только величины в <b>одинаковых единицах</b>. ${b} м = ${100*b} см.<br>${a} : ${100*b} = ${FR(a,100*b)} = <b>${N(ans)}</b>.<br>Если ты получил ${N(a/b)} — ты поделил сантиметры на метры, так нельзя.`,
explain2:`Представь две ленточки: ${a} см и ${b} м. Метровая ленточка — это ${100*b} см, она гораздо длиннее. Значит, отношение должно быть меньше 1: ${a}/${100*b} = ${N(ans)}. Ответ «${N(a/b)}» означал бы, что короткая ленточка длиннее — неправда.`};});

/* L1 — пропорция */
RULE(1,'Какое равенство выражает основное свойство пропорции a : b = c : d?','a · d = b · c',['a · b = c · d','a · c = b · d','a + d = b + c'],
{short:'Произведение крайних (a и d) равно произведению средних (b и c).',
explain:'В пропорции a : b = c : d крайние члены — a и d (по краям), средние — b и c (в середине). Основное свойство: <b>a · d = b · c</b>. Пример: 2 : 3 = 6 : 9 → 2 · 9 = 18 и 3 · 6 = 18.',
explain2:'Запиши дробями: a/b = c/d — и перемножь «крест-накрест»: a с d, b с c. Проверь на 1 : 2 = 3 : 6: 1 · 6 = 6 и 2 · 3 = 6 ✅. А a · b = c · d дало бы 2 и 18 — не равно.'});
RULE(1,'Какие члены пропорции a : b = c : d называют <b>средними</b>?','b и c',['a и d','a и b','c и d'],
{short:'Средние стоят в середине записи: b и c.',
explain:'Читаем запись a : b = c : d слева направо: по краям стоят a и d — это <b>крайние</b>; в середине b и c — <b>средние</b>.',
explain2:'Представь четверых в шеренге: a, b, c, d. Кто стоит по краям? a и d. Кто в середине? b и c. Так и в пропорции.'});
G(1,()=>{const p=R(1,7),q=R(2,9);if(p===q)return null;const k=R(2,5);const a=p,b=q,c=p*k,d=q*k;
const bad=()=>{const t=[a,b,c,d];const i=R(0,3);t[i]+=pick([-1,1,2]);if(t[i]<=0)return null;return t;};
const ws=[];for(let i=0;i<20&&ws.length<3;i++){const t=bad();if(t&&t[0]*t[3]!==t[1]*t[2]){const s=`${t[0]} : ${t[1]} = ${t[2]} : ${t[3]}`;if(!ws.includes(s))ws.push(s);}}if(ws.length<3)return null;
const c0=`${a} : ${b} = ${c} : ${d}`;
return CH('Какая из записей — <b>верная</b> пропорция?',c0,ws,{short:`${a} · ${d} = ${a*d} и ${b} · ${c} = ${b*c}.`,
explain:`Проверяем основное свойство (крайние × крайние = средние × средние) для каждой записи:<br>${[c0,...ws].map(s=>{const n=s.match(/\d+/g).map(Number);return `• ${s}: ${n[0]}·${n[3]} = ${n[0]*n[3]}, ${n[1]}·${n[2]} = ${n[1]*n[2]} ${n[0]*n[3]===n[1]*n[2]?'✅':'❌'}`;}).join('<br>')}`,
explain2:`Другой способ: найди значение каждого отношения. ${a} : ${b} = ${FR(a,b)}, а ${c} : ${d} — это то же самое, только оба числа умножены на ${k}. Значит, отношения равны, и это пропорция.`});});
G(1,()=>{const p=R(2,9),q=R(2,9);if(p===q)return null;const yes=Math.random()<0.5;const k=R(2,4);let c=p*k,d=q*k;if(!yes){d+=pick([1,-1]);if(p*d===q*c)return null;}
return {type:'choice',q:`Можно ли составить пропорцию из отношений <span class="m">${p} : ${q}</span> и <span class="m">${c} : ${d}</span>?`,opts:['Да, они равны','Нет, они не равны'],ans:yes?0:1,
short:`${p} · ${d} = ${p*d}, ${q} · ${c} = ${q*c} — ${yes?'равны':'не равны'}.`,
explain:`Пропорция — это равенство двух отношений. Проверим основным свойством: крайние ${p} · ${d} = ${p*d}, средние ${q} · ${c} = ${q*c}. ${yes?'Равны → <b>да</b>, это пропорция.':'Не равны → <b>нет</b>.'}`,
explain2:yes?`${c} : ${d} — это ${p} : ${q}, у которого оба члена умножили на ${k}. Отношение от этого не меняется → они равны.`:`Если бы отношения были равны, то ${c} : ${d} получалось бы из ${p} : ${q} умножением обоих чисел на одно и то же. ${c} : ${p} = ${N(c/p)}, а ${d} : ${q} = ${N(Math.round(d/q*1000)/1000)} — разные. Значит, не равны.`};});

/* L2 — найти x */
RULE(2,'Как найти неизвестный <b>крайний</b> член пропорции x : b = c : d?','x = (b · c) : d',['x = (b · d) : c','x = (c · d) : b','x = b + c − d'],
{short:'Произведение средних делим на известный крайний.',
explain:'По основному свойству x · d = b · c. x — неизвестный множитель, поэтому x = (b · c) : d. Правило: неизвестный крайний = <b>произведение средних, делённое на известный крайний</b>.',
explain2:'Пример: x : 6 = 10 : 15. Средние 6 и 10, их произведение 60. Известный крайний 15. x = 60 : 15 = 4. Проверка: 4 : 6 = 2/3 и 10 : 15 = 2/3 ✅.'});
const propTask=(dec)=>()=>{const p=R(1,9),q=R(1,9);if(p===q)return null;const k1=R(1,6),k2=R(2,8);if(k1===k2)return null;
 let t=[p*k1,q*k1,p*k2,q*k2];if(dec){t=t.map(v=>v/2);if(!t.some(v=>!isInt(v)))return null;}
 const i=R(0,3);const ans=t[i];const s=t.map((v,j)=>j===i?'x':N(v));const fr=Math.random()<0.4&&!dec;
 const q0=fr?`${FR(s[0],s[1])} = ${FR(s[2],s[3])}`:`${s[0]} : ${s[1]} = ${s[2]} : ${s[3]}`;
 const ext=(i===0||i===3);const known=ext?t[3-i]:t[3-i];const pr=ext?t[1]*t[2]:t[0]*t[3];
 const prTxt=ext?`${N(t[1])} · ${N(t[2])}`:`${N(t[0])} · ${N(t[3])}`;
 return {type:'num',q:`Найди x из пропорции: <span class="m">${q0}</span>`,ans,hint:'Произведение крайних равно произведению средних.',
 short:`x = ${prTxt} : ${N(known)} = ${N(ans)}.`,
 explain:`x — ${ext?'крайний':'средний'} член. По основному свойству: ${ext?`x · ${N(known)} = ${prTxt}`:`x · ${N(known)} = ${prTxt}`}.<br>${prTxt} = ${N(pr)}. Значит, x = ${N(pr)} : ${N(known)} = <b>${N(ans)}</b>.<br>Проверка: ${t.map(N).slice(0,2).join(' : ')} = ${N(Math.round(t[0]/t[1]*1000)/1000)} и ${t.map(N).slice(2).join(' : ')} = ${N(Math.round(t[2]/t[3]*1000)/1000)} ✅`,
 explain2:`Короткая дорога: сравни соседние отношения. ${N(t[2])} : ${N(t[0])} = ${N(k2/k1)} — второе отношение получено из первого умножением обоих членов на ${N(Math.round(k2/k1*1000)/1000)}. Значит, и x найдём так же. Ответ: ${N(ans)}.`};};
G(2,propTask(false));G(2,propTask(true));

/* L3 — прямая */
RULE(3,'Величины x и y <b>прямо пропорциональны</b>, если…','при увеличении x в несколько раз y увеличивается во столько же раз',['при увеличении x на несколько единиц y увеличивается на столько же единиц','при увеличении x в несколько раз y уменьшается во столько же раз','y всегда больше x'],
{short:'Прямая: «больше в k раз — больше в k раз».',
explain:'Прямая пропорциональность — это про <b>«во сколько раз»</b>, а не «на сколько». Купил шоколадок в 3 раза больше — заплатил в 3 раза больше. «Уменьшается во столько же раз» — это обратная пропорциональность.',
explain2:'Проверь вариант «на несколько единиц»: возраст брата и твой возраст растут «на 1 каждый год», но они не пропорциональны — когда тебе 2, брату 4 (в 2 раза больше), а когда тебе 10, брату 12 (уже не в 2 раза).'});
RULE(3,'Если y прямо пропорционально x, то что остаётся постоянным?','Отношение y : x',['Произведение x · y','Разность y − x','Сумма x + y'],
{short:'При прямой пропорциональности постоянно частное y : x.',
explain:'При прямой пропорциональности y = k · x, значит <b>y : x = k</b> — всегда одно и то же. Например, цена одной шоколадки: 350 : 5 = 560 : 8 = 70 ₽. Постоянное произведение — это признак <b>обратной</b> пропорциональности.',
explain2:'Таблица: 1 шт. — 70 ₽, 2 шт. — 140 ₽, 5 шт. — 350 ₽. Дели рубли на штуки: 70, 70, 70 — постоянно. А произведения 70, 280, 1750 — разные.'});
G(3,()=>{const it=pick([['порций смузи','г бананов'],['пицц','г сыра'],['порций блинов','мл молока'],['кексов','г муки']]);const u=pick([20,25,30,40,50,60,75]);const n1=R(2,6),n2=R(3,12);if(n1===n2)return null;const m1=u*n1,m2=u*n2;
return {type:'num',q:`Для ${n1} ${it[0]} нужно ${m1} ${it[1]}. Сколько ${it[1].replace(/^\S+ /,'')} нужно для ${n2} ${it[0]}? Ответ дай в ${it[1].split(' ')[0]}.`,ans:m2,
hint:'Сначала узнай, сколько нужно на одну.',short:`На одну: ${m1} : ${n1} = ${u}; на ${n2}: ${u} · ${n2} = ${m2}.`,
explain:`Количество продуктов <b>прямо пропорционально</b> числу порций (больше порций — во столько же раз больше продуктов).<br>1) На одну: ${m1} : ${n1} = ${u} ${it[1].split(' ')[0]}.<br>2) На ${n2}: ${u} · ${n2} = <b>${m2}</b>.`,
explain2:`Пропорцией: ${n1} : ${n2} = ${m1} : x (стрелки в одну сторону). x = ${n2} · ${m1} : ${n1} = ${n2*m1} : ${n1} = ${m2}.`};});
G(3,()=>{const it=pick(['шоколадок','тетрадей','наклеек','билетов в кино']);const pr=pick([15,20,35,45,60,70,85,120]);const a=R(2,7),b=R(3,12);if(a===b)return null;
return {type:'num',q:`${a} ${it} стоят ${a*pr} ₽. Сколько рублей стоят ${b} таких же ${it}?`,ans:b*pr,
short:`${a*pr} : ${a} = ${pr} ₽ за штуку; ${pr} · ${b} = ${b*pr} ₽.`,
explain:`Стоимость прямо пропорциональна количеству.<br>Цена одной: ${a*pr} : ${a} = ${pr} ₽.<br>${b} штук: ${pr} · ${b} = <b>${b*pr} ₽</b>.`,
explain2:`Пропорция: ${a} шт. — ${a*pr} ₽, ${b} шт. — x ₽. Стрелки в одну сторону: ${a} : ${b} = ${a*pr} : x → x = ${b} · ${a*pr} : ${a} = ${b*pr}.`};});
G(3,()=>{const v=pick([12,15,18,20,24]);const t1=pick([10,15,20,30,40]);const d1=v*t1/60;if(!isInt(d1*10))return null;const t2=pick([60,90,120,45]);const d2=v*t2/60;if(t1===t2||!isInt(d2*10)||!isInt(t2/t1*10))return null;
return {type:'num',q:`Самокат с постоянной скоростью проехал ${N(d1)} км за ${t1} мин. Сколько километров он проедет за ${t2} мин?`,ans:d2,
short:`За 1 мин — ${N(d1)} : ${t1} км; за ${t2} мин в ${N(t2/t1)} раза больше: ${N(d2)} км.`,
explain:`При постоянной скорости путь <b>прямо пропорционален</b> времени.<br>Пропорция: ${t1} : ${t2} = ${N(d1)} : x.<br>x = ${t2} · ${N(d1)} : ${t1} = <b>${N(d2)}</b> км.`,
explain2:`Найдём скорость: ${N(d1)} км за ${t1} мин — это ${v} км в час (60 мин). За ${t2} мин: ${v} · ${t2} : 60 = ${N(d2)} км.`};});

/* L4 — обратная */
RULE(4,'Величины x и y <b>обратно пропорциональны</b>, если…','при увеличении x в несколько раз y уменьшается во столько же раз',['при увеличении x на несколько единиц y уменьшается на столько же единиц','при увеличении x в несколько раз y увеличивается во столько же раз','y уменьшается, когда x увеличивается — неважно как'],
{short:'Обратная: «больше в k раз — меньше в k раз».',
explain:'Обратная пропорциональность — когда одна величина растёт <b>в k раз</b>, а другая уменьшается <b>в те же k раз</b>. Пример: едешь в 2 раза быстрее — доедешь в 2 раза быстрее по времени. Просто «одна растёт, другая падает» — мало: важно, чтобы во столько же раз.',
explain2:'Пример «не обратной»: чем больше ты играешь в телефон, тем меньше заряд. Но 2 часа игры не уменьшают заряд «в 2 раза» по сравнению с 1 часом — это не обратная пропорциональность.'});
RULE(4,'Если x и y обратно пропорциональны, то что остаётся постоянным?','Произведение x · y',['Отношение y : x','Сумма x + y','Разность x − y'],
{short:'Постоянно произведение: например, скорость · время = путь.',
explain:'При обратной пропорциональности <b>x · y = k</b> — всегда одно и то же число. Скорость · время = путь (не меняется). Работники · дни = вся работа.',
explain2:'Путь 120 км: 40 км/ч · 3 ч = 120, 60 · 2 = 120, 120 · 1 = 120. Произведение постоянно, а отношения 3/40, 2/60, 1/120 — разные.'});
G(4,()=>{const v1=pick([10,12,15,20,30,40,60]),t1=R(2,8);const S=v1*t1;const v2=pick([10,12,15,20,24,30,40,60,80]);if(v2===v1||S%v2)return null;const t2=S/v2;
return {type:'num',q:`Велосипедист со скоростью ${v1} км/ч доехал от дома до озера за ${t1} ч. За сколько часов он доедет, если будет ехать со скоростью ${v2} км/ч?`,ans:t2,
hint:'Скорость больше — время меньше. Во сколько раз?',short:`Путь ${v1} · ${t1} = ${S} км; ${S} : ${v2} = ${t2} ч.`,
explain:`Скорость и время на одном пути <b>обратно пропорциональны</b>.<br>1) Путь: ${v1} · ${t1} = ${S} км.<br>2) Время: ${S} : ${v2} = <b>${t2} ч</b>.<br>${v2>v1?`Если ты получил ${N(Math.round(t1*v2/v1*100)/100)} — ты решил как прямую пропорциональность: быстрее ехать стало бы дольше!`:''}`,
explain2:`Пропорция для обратной: стрелки в разные стороны, одно отношение переворачиваем: ${v1} : ${v2} = x : ${t1} → x = ${v1} · ${t1} : ${v2} = ${t2} ч.`};});
G(4,()=>{const w1=R(2,9),d1=R(2,12);const W=w1*d1;const w2=R(2,12);if(w2===w1||W%w2)return null;const d2=W/w2;const it=pick([['маляров','покрасят забор'],['роботов','соберут конструктор'],['строителей','построят домик'],['ребят','уберут школьный двор']]);
return {type:'num',q:`${w1} ${it[0]} ${it[1]} за ${d1} ${plural(d1,'день','дня','дней')}. За сколько дней это сделают ${w2} ${it[0]}, если все работают одинаково?`,ans:d2,
short:`Работа: ${w1} · ${d1} = ${W}; ${W} : ${w2} = ${d2}.`,
explain:`Число работников и время работы <b>обратно пропорциональны</b>.<br>Вся работа: ${w1} · ${d1} = ${W} «человеко-дней».<br>${w2} ${it[0]}: ${W} : ${w2} = <b>${d2}</b>.`,
explain2:`Проверь здравым смыслом: ${w2>w1?'работников больше — дней должно стать меньше':'работников меньше — дней должно стать больше'}. ${d2} ${d2<d1?'меньше':'больше'} ${d1} ✅. Пропорция: ${w1} : ${w2} = x : ${d1} → x = ${d2}.`};});
G(4,()=>{const n1=R(2,8),k1=R(2,10);const all=n1*k1;const n2=R(2,12);if(n2===n1||all%n2)return null;
return {type:'num',q:`Мешок конфет разделили поровну между ${n1} детьми — каждому досталось по ${k1}. Сколько конфет досталось бы каждому, если бы детей было ${n2}?`,ans:all/n2,
short:`Всего ${n1} · ${k1} = ${all}; ${all} : ${n2} = ${all/n2}.`,
explain:`Число детей и доля каждого <b>обратно пропорциональны</b>.<br>Всего конфет: ${n1} · ${k1} = ${all}.<br>Каждому из ${n2}: ${all} : ${n2} = <b>${all/n2}</b>.`,
explain2:`Чем больше едоков, тем меньше кусок 😄. Количество конфет в мешке не меняется — это и есть постоянное произведение: ${n1} · ${k1} = ${n2} · ${all/n2} = ${all}.`};});
G(4,()=>{const w1=R(3,8),d1=R(4,10);const w2=R(2,12);if(w2===w1||(w1*d1)%w2)return null;const d2=w1*d1/w2;
const c=`${w1} : ${w2} = x : ${d1}`;const w=[`${w1} : ${w2} = ${d1} : x`,`${w1} : ${d1} = x : ${w2}`,`x = ${w1} + ${d1} − ${w2}`];
return CH(`${w1} насосов выкачивают воду из бассейна за ${d1} ч. За сколько часов x выкачают ${w2} насосов? Какая запись <b>правильная</b>?`,c,w,
{short:`Обратная пропорциональность → одно отношение переворачиваем: ${c}, x = ${d2}.`,
explain:`Насосов ${w2>w1?'больше ↑ — часов меньше ↓':'меньше ↓ — часов больше ↑'}: стрелки в разные стороны, это <b>обратная</b> пропорциональность. Поэтому одно из отношений пишем «перевёрнутым»: <b>${c}</b>. Тогда x = ${w1} · ${d1} : ${w2} = ${N(d2)} ч.<br>Запись ${w[0]} — как для прямой пропорциональности: она дала бы x = ${N(Math.round(w2*d1/w1*100)/100)}, ${w2>w1?'больше насосов работали бы дольше':'меньше насосов справились бы быстрее'} — бессмыслица.`,
explain2:`Проверь через произведение: при обратной пропорциональности ${w1} · ${d1} = ${w2} · x. Отсюда x = ${w1*d1} : ${w2} = ${N(d2)}. Это то же, что и ${c}.`});});

/* L5 — масштаб */

RULE(6,'Как разделить число N в отношении a : b?','Найти одну часть N : (a + b), затем умножить её на a и на b',['Разделить N на a и на b','Умножить N на a и на b','Разделить N пополам, а потом умножить половинки на a и на b'],
{short:'Всего a + b частей; одна часть = N : (a + b).',

explain2:'Ошибка «N : a и N : b»: 60 : 2 = 30, 60 : 3 = 20 — в сумме 50, а не 60, и больше досталось тому, у кого меньше частей. Сразу видно, что неверно.'});
G(6,()=>{const a=R(1,5),b=R(2,7);if(a===b||gcd(a,b)!==1)return null;const p=R(3,15);const Nn=(a+b)*p;const big=Math.max(a,b)*p;const nm=pick([['Джек','Билли'],['Гарри','Рон'],['Марио','Луиджи'],['Чук','Гек']]);
return {type:'num',q:`${nm[0]} и ${nm[1]} делят ${Nn} монет в отношении ${a} : ${b}. Сколько монет получит тот, кому достанется <b>больше</b>?`,ans:big,
pic:blocks([{n:a,label:nm[0]},{n:b,label:nm[1]}]),hint:'Сначала сосчитай, сколько всего частей.',short:`${a} + ${b} = ${a+b} частей; одна часть ${Nn} : ${a+b} = ${p}; ${Math.max(a,b)} · ${p} = ${big}.`,
explain:`1) Всего частей: ${a} + ${b} = ${a+b}.<br>2) Одна часть: ${Nn} : ${a+b} = ${p} монет.<br>3) ${nm[0]}: ${a} · ${p} = ${a*p}, ${nm[1]}: ${b} · ${p} = ${b*p}.<br>Больше получит ${a>b?nm[0]:nm[1]}: <b>${big}</b>. Проверка: ${a*p} + ${b*p} = ${Nn} ✅`,
explain2:`Посмотри на кубики на картинке: каждый кубик — одинаковая кучка монет. Кубиков ${a+b}, монет ${Nn}, значит в кубике ${p}. У ${a>b?nm[0]:nm[1]} ${Math.max(a,b)} кубиков → ${big} монет.`};});
G(6,()=>{const r=sample([1,2,3,4,5,6,7],3);const s=r[0]+r[1]+r[2];const p=R(2,12);const tot=s*p;const ask=R(0,2);
const it=pick([{intro:'Бетонную смесь делают из цемента, песка и щебня',nm:['цемент','песок','щебень'],gen:['цемента','песка','щебня'],u:'кг смеси',ua:'кг'},
{intro:'В шкатулке лежат красные, синие и зелёные бусины',nm:['красные','синие','зелёные'],gen:['красных бусин','синих бусин','зелёных бусин'],u:'бусин',ua:''},
{intro:'В армии короля рыцари, лучники и маги',nm:['рыцари','лучники','маги'],gen:['рыцарей','лучников','магов'],u:'воинов',ua:''}]);

pic:blocks([{n:r[0],label:it.nm[0]},{n:r[1],label:it.nm[1]},{n:r[2],label:it.nm[2]}]),short:`${r.join(' + ')} = ${s} частей по ${p}; ${r[ask]} · ${p} = ${r[ask]*p}.`,
explain:`1) Всего частей: ${r.join(' + ')} = ${s}.<br>2) Одна часть: ${tot} : ${s} = ${p}.<br>3) ${it.nm[ask].charAt(0).toUpperCase()+it.nm[ask].slice(1)} — ${r[ask]} ${plural(r[ask],'часть','части','частей')}: ${r[ask]} · ${p} = <b>${r[ask]*p}</b>.`,
explain2:`Проверим все три: ${r.map(x=>x*p).join(' + ')} = ${tot} ✅. Значит, одна часть найдена правильно, и ответ ${r[ask]*p}.`};});
G(6,()=>{const a=R(1,6),b=R(2,9);if(a>=b||gcd(a,b)!==1)return null;const p=R(2,12);const diff=(b-a)*p;

explain2:`${blocks([{n:a,label:'первое'},{n:b,label:'второе'}])}У второго на ${b-a} ${plural(b-a,'кубик','кубика','кубиков')} больше — эти лишние кубики и есть ${diff}. Значит, кубик = ${p}, а у первого ${a} кубиков = ${a*p}.`};});
G(6,()=>{const r=pick([[1,2,3],[2,3,4],[1,1,2],[1,3,5],[2,3,5],[1,4,7],[3,4,5],[1,2,6],[4,5,6]]);const s=r[0]+r[1]+r[2];if(180%s)return null;const p=180/s;
return {type:'num',q:`Углы треугольника относятся как ${r.join(' : ')}. Найди <b>наибольший</b> угол (в градусах). Подсказка: сумма углов треугольника 180°.`,ans:r[2]*p,

['число рабочих (работают одинаково) и время на одну и ту же работу','обратная','рабочих в 2 раза больше — времени в 2 раза меньше'],
['возраст человека и его рост','ни то, ни другое','в 2 раза старше — не значит в 2 раза выше'],
['сторона квадрата и его периметр','прямая','P = 4a: сторону увеличили в 2 раза — периметр тоже в 2 раза'],

['время работы принтера (печатает равномерно) и число страниц','прямая','работает в 2 раза дольше — страниц в 2 раза больше'],
['количество человек в очереди перед тобой и твой возраст','ни то, ни другое','эти величины вообще не связаны']];

explain2:`Мысленный эксперимент: удвой первую величину и посмотри, что станет со второй. ${d[2].charAt(0).toUpperCase()+d[2].slice(1)}. Значит — ${d[1]}.`};},{rule:true});

RULE(8,'Задача: «3 курицы за 3 дня сносят 3 яйца. Сколько яиц снесут 12 куриц за 12 дней?» С чего удобнее всего начать?','Узнать, сколько яиц сносит одна курица за 3 дня (свести к одному)',['Сразу ответить 12: куриц 12 — значит, и яиц 12','Сложить все числа: 3 + 3 + 3','Разделить 12 на 3 и ответить 4'],
{short:'Олимпиадный приём «сведи к одному»: одна курица за 3 дня — 1 яйцо.',
explain:'Когда величина зависит сразу от двух других (от числа кур и от числа дней), удобно <b>свести к одному</b>: одна курица за 3 дня сносит 1 яйцо. Дальше: за 12 дней — 4 яйца, а 12 куриц — 12 · 4 = 48. Ответ «12» — ловушка: он не учитывает, что дней тоже стало больше.',
explain2:'Тот же приём в жизни: «2 пиццы на 4 человек — сколько на 10?» Сначала на одного: полпиццы. Потом на 10: 5 пицц. Сначала «на одного», потом «на всех».'});

return {type:'num',q:`${a} ${plural(a,'курица','курицы','куриц')} за ${a} ${plural(a,'день','дня','дней')} сносят ${a} ${plural(a,'яйцо','яйца','яиц')}. Сколько яиц снесут ${b} ${plural(b,'курица','курицы','куриц')} за ${c} ${plural(c,'день','дня','дней')}?`,ans,
hint:'Сначала: сколько яиц сносит ОДНА курица за те же дни?',short:`1 курица за ${a} дн. — 1 яйцо; за ${c} дн. — ${N(c/a)}; ${b} куриц — ${N(ans)}.`,
explain:`Сведём к одной курице.<br>1) ${a} куриц за ${a} дней — ${a} яиц ⇒ <b>одна</b> курица за ${a} дней — 1 яйцо.<br>2) Одна курица за ${c} дней — ${c} : ${a} = ${N(c/a)} яйца.<br>3) ${b} куриц: ${b} · ${N(c/a)} = <b>${N(ans)}</b>.<br>Ловушка: нельзя рассуждать «${a} курицы — ${a} яйца, значит ${b} куриц — ${b} яиц»: число яиц зависит и от кур, и от дней сразу.`,
explain2:`Можно в «курице-днях». ${a} куриц · ${a} дней = ${a*a} курице-дней дают ${a} яиц, т.е. на одно яйцо нужно ${a} курице-дня. У нас ${b} · ${c} = ${b*c} курице-дней → ${b*c} : ${a} = ${N(ans)} яиц.`};},{star:true});

short:`Одна курица за 1,5 дня — 1 яйцо, т.е. за день ${FR(2,3)} яйца; ${n} · ${m} · ${FR(2,3)} = ${N(ans)}.`,
explain:`1) 1,5 курицы за 1,5 дня — 1,5 яйца ⇒ <b>1 курица</b> за 1,5 дня — <b>1 яйцо</b> (кур в 1,5 раза меньше — яиц в 1,5 раза меньше).<br>2) За 1 день одна курица сносит 1 : 1,5 = ${FR(2,3)} яйца.<br>3) ${n} куриц за ${m} дней: ${n} · ${m} · ${FR(2,3)} = ${n*m} · ${FR(2,3)} = <b>${N(ans)}</b>.`,
explain2:`Удвой всё: 3 курицы за 3 дня — уже 3 · 2 = 6 яиц? Нет! Удвоим кур: 3 курицы за 1,5 дня — 3 яйца. Удвоим дни: 3 курицы за 3 дня — 6 яиц. То есть 9 курице-дней дают 6 яиц — на одно яйцо 1,5 курице-дня. У нас ${n*m} курице-дней: ${n*m} : 1,5 = ${N(ans)}.`};},{star:true});
