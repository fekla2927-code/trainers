<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Русский язык 5–9 — тренажёр</title><style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box.ex{background:transparent;border:1px dashed var(--line)}
.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#111}}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}
.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.understand label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.gaps-text{font-size:20px;line-height:2.3}
select.gap{font:inherit;font-size:18px;font-weight:600;padding:2px 6px;margin:0 2px;border-radius:8px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink);min-width:44px;-webkit-appearance:menulist;appearance:menulist}
select.gap.filled{border-style:solid}
select.gap.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
select.gap.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
b.fix{color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:0 2px}
.fb .ans{font-size:18px}
.levels button:disabled{opacity:.45;cursor:default}
.res-list li .btn{white-space:nowrap}

<script>/* Реестр правил 5–9 классов. id, класс, раздел, название.
   Содержание (теория и упражнения) добавляют файлы grades/g5a.js … g9.js через RU.rule({...}). */
(function(){
const RU = window.RU = {reg:{}, order:[], mixes:{}, errors:[]};
const S = (grade, section, list) => list.forEach(([id,title]) => { RU.reg[id] = {id, grade, section, title, items:[]}; RU.order.push(id); });

S(5,'Фонетика и орфоэпия',[
 ['g5.zvuki','Звуки и буквы: гласные и согласные, твёрдые и мягкие, звонкие и глухие'],

 ['g5.chleny','Главные и второстепенные члены предложения'],
 ['g5.znaki_konca','Знаки препинания в конце предложения'],

 ['g5.pryamaya','Прямая речь: основные схемы']]);

S(6,'Орфография: корень и приставка',[
 ['g6.kas_kos','Чередование -кас- / -кос-'],
 ['g6.gar_gor','Чередование -гар- / -гор-, -зар- / -зор-'],
 ['g6.bir_ber','Чередование Е / И в корнях (-бер- / -бир-, -мер- / -мир- и др.)'],
 ['g6.mak_mok','Чередование -мак- / -мок-, -равн- / -ровн-, -скак- / -скоч-'],
 ['g6.pre_pri','Приставки ПРЕ- и ПРИ-'],
 ['g6.y_i_pristavki','Буквы Ы и И после приставок'],
 ['g6.soed_glas','Соединительные гласные О и Е в сложных словах']]);
S(6,'Орфография: морфология',[
 ['g6.chasti_rechi','Части речи: самостоятельные и служебные'],
 ['g6.ne_sush','НЕ с существительными'],
 ['g6.ne_prilag','НЕ с прилагательными'],
 ['g6.o_e_suff_prilag','О и Е после шипящих и Ц в суффиксах прилагательных'],
 ['g6.n_nn_prilag','Н и НН в суффиксах прилагательных'],
 ['g6.k_sk','Суффиксы -К- и -СК- прилагательных'],
 ['g6.slozh_prilag','Слитное и дефисное написание сложных прилагательных'],
 ['g6.chik_shchik','Суффиксы -ЧИК- / -ЩИК-'],
 ['g6.ek_ik','Суффиксы -ЕК- / -ИК-'],
 ['g6.chislit','Правописание числительных'],
 ['g6.mestoim_ne_ni','НЕ и НИ в отрицательных местоимениях'],
 ['g6.mestoim_defis','Дефис в неопределённых местоимениях'],
 ['g6.mz_povelit','Мягкий знак в глаголах повелительного наклонения'],
 ['g6.ova_yva','Суффиксы глаголов -ОВА- / -ЕВА- и -ЫВА- / -ИВА-']]);

S(7,'Причастие и деепричастие',[
 ['g7.prich_oborot','Причастный оборот: запятые'],
 ['g7.prich_suff_dejstv','Гласные в суффиксах действительных причастий'],
 ['g7.prich_suff_strad','Гласные в суффиксах страдательных причастий настоящего времени'],
 ['g7.glas_pered_nn','Гласные перед Н и НН в причастиях'],
 ['g7.n_nn_prich','Н и НН в причастиях и отглагольных прилагательных'],
 ['g7.ne_prich','НЕ с причастиями'],
 ['g7.deeprich_oborot','Деепричастный оборот и одиночное деепричастие: запятые'],
 ['g7.ne_deeprich','НЕ с деепричастиями']]);
S(7,'Наречие',[
 ['g7.ne_narech','НЕ с наречиями на -О и -Е'],
 ['g7.n_nn_narech','Н и НН в наречиях'],
 ['g7.o_e_narech','О и Е после шипящих на конце наречий'],
 ['g7.o_a_narech','Буквы О и А на конце наречий'],
 ['g7.mz_narech','Мягкий знак после шипящих на конце наречий'],
 ['g7.defis_narech','Дефис в наречиях'],
 ['g7.slitno_narech','Слитное и раздельное написание наречий']]);
S(7,'Служебные части речи',[
 ['g7.predlogi','Производные предлоги'],
 ['g7.soyuzy','Слитное и раздельное написание союзов (тоже, также, чтобы, зато)'],
 ['g7.chastitsy_defis','Раздельное и дефисное написание частиц'],
 ['g7.ne_ni_chastitsy','Частицы НЕ и НИ'],
 ['g7.mezhdometiya','Междометия: дефис и знаки препинания']]);

S(8,'Простое предложение',[
 ['g8.skazuem','Виды сказуемых'],
 ['g8.tire_podl_skaz','Тире между подлежащим и сказуемым'],
 ['g8.odnosost','Односоставные предложения']]);
S(8,'Однородные члены',[
 ['g8.odnorod_soyuzy','Однородные члены с повторяющимися и двойными союзами'],
 ['g8.obobshch','Обобщающие слова при однородных членах'],
 ['g8.neodnorod_opred','Однородные и неоднородные определения']]);
S(8,'Обособленные члены',[
 ['g8.obos_opred','Обособленные определения'],
 ['g8.prilozh','Обособленные приложения'],
 ['g8.obos_obst','Обособленные обстоятельства'],

S(8,'Слова, не связанные с членами предложения',[
 ['g8.vvodnye','Вводные слова и предложения'],
 ['g8.vvodnye_vs_chleny','Вводное слово или член предложения'],
 ['g8.obrashch','Распространённые обращения'],
 ['g8.sravn','Сравнительные обороты'],
 ['g8.chuzhaya_rech','Прямая речь и цитаты']]);

S(9,'Сложносочинённое предложение',[
 ['g9.ssp','Сложносочинённое предложение: запятая'],
 ['g9.ssp_obshch','Общий второстепенный член: когда запятая не нужна']]);
S(9,'Сложноподчинённое предложение',[
 ['g9.spp','Сложноподчинённое предложение: запятые при придаточных'],
 ['g9.spp_soyuz_slova','Союзы, союзные слова и составные союзы'],
 ['g9.spp_vidy','Виды придаточных'],

S(9,'Бессоюзное и сложное предложение с разными видами связи',[
 ['g9.bsp_zapyat','Бессоюзное предложение: запятая и точка с запятой'],
 ['g9.bsp_dvoetoch','Бессоюзное предложение: двоеточие'],
 ['g9.bsp_tire','Бессоюзное предложение: тире'],
 ['g9.raznye_svyazi','Разные виды связи и запятая на стыке союзов']]);

/* --- API для файлов с содержанием --- */
RU.rule = function(o){
  const r = RU.reg[o.id];
  if(!r){RU.errors.push('Неизвестное правило: '+o.id);return;}
  Object.assign(r, o, {grade:r.grade, section:r.section, title:o.title||r.title});
  r.items = (o.items||[]).map((it,i)=>RU.prep(it, r.id, r.id+'#'+i));
};
RU.mix = function(grade, items){
  RU.mixes[grade] = (RU.mixes[grade]||[]).concat(items.map((it,i)=>RU.prep(it, null, 'mix'+grade+'#'+((RU.mixes[grade]||[]).length+i))));
};
RU.prep = function(it, ruleId, key){
  it = Object.assign({}, it); it.key = key; it.rule = it.rule || ruleId; it.lvl = it.lvl || 1;
  if(!it.type) it.type = it.text ? 'gaps' : 'choice';
  if(it.type==='gaps'){
    it.gaps=[]; const parts=[]; let last=0; const re=/\{([^{}]+)\}/g; let m;
    while((m=re.exec(it.text))){
      parts.push({t:it.text.slice(last,m.index)});
      let body=m[1], rule=it.rule;
      const at=body.lastIndexOf('@'); if(at>=0){rule=body.slice(at+1).trim(); body=body.slice(0,at);}
      const raw=body.split('|'); let ans=-1;
      const opts=raw.map((o,i)=>{if(o.endsWith('*')){if(ans>=0)RU.errors.push(key+': две звёздочки в пропуске');ans=i;o=o.slice(0,-1);}return o;});
      if(ans<0) RU.errors.push(key+': нет правильного варианта (*) в пропуске {'+m[1]+'}');
      if(!rule) RU.errors.push(key+': в итоговом упражнении у каждого пропуска нужно указать правило через @');
      else if(!RU.reg[rule]) RU.errors.push(key+': неизвестное правило '+rule);
      if(new Set(opts).size!==opts.length) RU.errors.push(key+': повтор вариантов в {'+m[1]+'}');
      parts.push({gap:it.gaps.length}); it.gaps.push({opts, ans, rule});
      last=re.lastIndex;
    }
    parts.push({t:it.text.slice(last)}); it.parts=parts;
    if(!it.gaps.length) RU.errors.push(key+': в упражнении нет пропусков');
    if(!it.rule && it.gaps.length) it.rule = it.gaps[0].rule;
  }else{
    if(!it.opts || it.ans==null || it.ans<0 || it.ans>=it.opts.length) RU.errors.push(key+': ошибка в вариантах ответа');
    if(it.opts && new Set(it.opts).size!==it.opts.length) RU.errors.push(key+': повтор вариантов');
    if(!RU.reg[it.rule]) RU.errors.push(key+': неизвестное правило '+it.rule);
  }
  if(!it.why) RU.errors.push(key+': нет объяснения why');
  if(!it.why2) RU.errors.push(key+': нет второго объяснения why2');
  return it;
};

RU.rule({

short:'Чтобы проверить парный звонкий или глухой согласный в корне, подбери слово, где после него стоит гласный (или Л, М, Н, Р, В): ду_ → дуБы, ло_ка → лоДочка.',
theory:`
<div class="box rule"><b>Правило</b>
Парные согласные <b>на конце слова</b> и <b>перед другим согласным</b> часто звучат не так, как пишутся: <i>дуб</i> [дуп], <i>ложка</i> [лошка], <i>просьба</i> [проз’ба].<br>
Чтобы проверить, подбери слово, где после этого согласного стоит <b>гласный</b> (или звуки [л], [м], [н], [р], [в]) — там согласный слышен ясно.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Найди сомнительный согласный в корне: <i>ду?</i>, <i>ло?ка</i>.</li>
<li>Измени слово так, чтобы после него оказался гласный: <i>ду<b>б</b>ы</i>, <i>ло<b>д</b>очка</i>.</li>
<li>Пиши ту букву, которую ясно слышно: <i>дуб, лодка</i>.</li>
</ol></div>
<div class="box ex"><b>Примеры</b>
гри<b>б</b> — гри<b>б</b>ы; сне<b>г</b> — сне<b>г</b>а; моро<b>з</b> — моро<b>з</b>ы; шар<b>ф</b> — шар<b>ф</b>ы;<br>
ло<b>ж</b>ка — ло<b>ж</b>ечка; шу<b>б</b>ка — шу<b>б</b>а; ска<b>з</b>ка — ска<b>з</b>ать; ни<b>з</b>кий — ни<b>з</b>ок;<br>
про<b>с</b>ьба — про<b>с</b>ить; моло<b>т</b>ьба — моло<b>т</b>ить.</div>
<div class="box err"><b>Ловушка</b>
Глухой перед звонким может звучать звонко: <i>просьба</i> слышится [проз’ба], но проверка «про<b>с</b>ить» даёт С. Не верь уху — проверяй!<br>
Проверочное слово, где после согласного снова согласный, не годится: <i>лодка — лодки</i> (Д перед К) ничего не доказывает. Нужно <i>лодочка</i>.</div>
<div class="box tip"><b>Как запомнить</b>

theory2:`

<div class="box ex"><b>Дай согласному гласную</b>

<i>ры?ка</i> → ры-<b>б</b>а → рыбка.<br>

<div class="box tip"><b>Помни</b>

short:'Чтобы узнать, есть ли в корне непроизносимая согласная, подбери однокоренное слово, где она произносится: соЛнце — соЛнышко, честный — чесТь. Если в проверочном слове звука нет — не пиши букву: ужасный — ужас.',
theory:`
<div class="box rule"><b>Правило</b>
В некоторых словах согласную <b>пишем, но не произносим</b>: <i>со<b>л</b>нце</i> [сонцэ], <i>чес<b>т</b>ный</i> [чесный], <i>сер<b>д</b>це</i> [серцэ].<br>
Чтобы не ошибиться, подбери однокоренное слово, где после этой согласной стоит <b>гласная</b> — там она слышна.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Видишь сочетание -СТН-, -ЗДН-, -ЛНЦ-, -РДЦ-? Остановись.</li>
<li>Подбери проверочное слово: <i>чес?ный → чес<b>т</b>ь</i>, <i>поз?ний → опоз<b>д</b>ать</i>.</li>
<li>Если в проверочном слове звук <b>слышен</b> — пиши букву. Если <b>нет</b> — не пиши: <i>опас?ный → опас<b>е</b>н</i> (Т нет) → <b>опасный</b>.</li>
</ol></div>
<div class="box ex"><b>Пишем букву</b>
со<b>л</b>нце — со<b>л</b>нышко; сер<b>д</b>це — сер<b>д</b>ечко; чес<b>т</b>ный — чес<b>т</b>ь; мес<b>т</b>ный — мес<b>т</b>о; радос<b>т</b>ный — радос<b>т</b>ь; грус<b>т</b>но — грус<b>т</b>ь; извес<b>т</b>ный — извес<b>т</b>ие; звёз<b>д</b>ный — звез<b>д</b>а; поз<b>д</b>ний — опоз<b>д</b>ать; учас<b>т</b>ник — учас<b>т</b>ие; ненас<b>т</b>ный — ненас<b>т</b>ье; свис<b>т</b>нуть — свис<b>т</b>.</div>

<div class="box tip"><b>Как запомнить</b>

theory2:`

/* ===================== РАЗДЕЛИТЕЛЬНЫЕ Ъ И Ь ===================== */
RU.rule({
id:'g5.razd_znaki',
short:'Ъ пишется после приставки на согласный перед Е, Ё, Ю, Я (подъезд, объявление). Ь пишется внутри корня или перед окончанием перед Е, Ё, Ю, Я, И (вьюга, семья, ручьи).',
theory:`
<div class="box rule"><b>Зачем нужны разделительные знаки</b>
Они <b>разделяют</b> согласный и гласную, чтобы Е, Ё, Ю, Я, И звучали с [й’]: <i>сел</i> — <i>съел</i> [сй’эл], <i>полю</i> — <i>полью</i> [пал’й’у].</div>
<div class="box rule"><b>Ъ — разделительный твёрдый знак</b>
Пишется <b>после приставки, которая кончается на согласный</b>, перед <b>Е, Ё, Ю, Я</b>:<br>
<i>под<b>ъ</b>езд, об<b>ъ</b>явление, с<b>ъ</b>ел, в<b>ъ</b>ехать, раз<b>ъ</b>яснить, под<b>ъ</b>ём</i>.</div>
<div class="box rule"><b>Ь — разделительный мягкий знак</b>
Пишется <b>внутри корня или перед окончанием</b> (не после приставки!) перед <b>Е, Ё, Ю, Я, И</b>:<br>
<i>в<b>ь</b>юга, сем<b>ь</b>я, руч<b>ь</b>и, вороб<b>ь</b>и, лист<b>ь</b>я, плат<b>ь</b>е, обез<b>ь</b>яна, ущел<b>ь</b>е</i>.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>После пропуска стоит Е, Ё, Ю, Я (или И)? Если нет — знак не нужен.</li>
<li>Перед пропуском кончается <b>приставка на согласный</b> (под-, об-, с-, в-, раз-…)? → <b>Ъ</b>.</li>
<li>Пропуск внутри корня или перед окончанием? → <b>Ь</b>.</li>
<li>Приставка кончается на <b>гласный</b> (по-, за-, до-…)? → знак <b>не нужен</b>: <i>поехал, заехал</i>.</li>
</ol></div>
<div class="box err"><b>Ловушки</b>
<i>поехал</i> — приставка ПО- кончается на гласный, знака нет.<br>
Перед И разделительный Ъ не пишется никогда; Ь — бывает: <i>ручьи, воробьи</i>.</div>
<div class="box tip"><b>Как запомнить</b>
Ъ — «твёрдая стенка» между <b>приставкой</b> и корнем. Ь — «мягкая занавеска» <b>внутри</b> слова.</div>`,
theory2:`
<p>Представь, что слово — это дом. <b>Приставка</b> — прихожая, <b>корень</b> — комната. Между прихожей и комнатой стоит твёрдая дверь — <b>Ъ</b>: <i>под|ъ|езд</i>. А внутри комнаты висит мягкая занавеска — <b>Ь</b>: <i>в|ь|юга</i>.</p>
<div class="box ex"><b>Сравни</b>
<i>с<b>ъ</b>ел</i> — после приставки С- (дверь Ъ).<br>
<i>сем<b>ь</b>я</i> — приставки нет, внутри слова (занавеска Ь).<br>
<i>поехал</i> — приставка ПО- на гласный: двери не нужно.</div>`,
items:[
 {lvl:1, text:'Мы ждали автобус у под{ъ*|ь|_}езда.',
  why:'Под_езда: ПОД- — приставка на согласный, дальше Е → <b>Ъ</b>: <b>подъезда</b>.',
  why2:'Между приставкой «под» и корнем стоит «твёрдая дверь» — Ъ.'},
 {lvl:1, text:'На ветке сидели вороб{ь*|ъ|_}и.',
  why:'Вороб_и: приставки нет, знак перед окончанием -И → <b>Ь</b>: <b>воробьи</b>.',
  why2:'Это не приставка, а середина слова. Внутри слова — «мягкая занавеска» Ь.'},
 {lvl:1, text:'За окном выла в{ь*|ъ|_}юга.',
  why:'В_юга: здесь В — не приставка, это часть корня (вьюга, вьюжный). Внутри корня перед Ю → <b>Ь</b>: <b>вьюга</b>.',
  why2:'В слове «вьюга» нет приставки — значит, пишем Ь.'},
 {lvl:1, text:'Вся сем{ь*|ъ|_}я собралась за столом.',
  why:'Сем_я: приставки нет, перед Я → <b>Ь</b>: <b>семья</b>.',
  why2:'Семья — одно целое слово, без приставки. Внутри — Ь.'},
 {lvl:1, text:'Папа прочитал об{ъ*|ь|_}явление.',

 {lvl:2, text:'Машина в{ъ*|ь|_}ехала во двор, а в саду запели солов{ь*|ъ|_}и.',
  why:'1) в_ехала: В- — приставка на согласный, дальше Е → <b>Ъ</b>: <b>въехала</b>. 2) солов_и: приставки нет, перед окончанием И → <b>Ь</b>: <b>соловьи</b>.',
  why2:'Въехать = в + ехать (приставка → Ъ). Соловьи — внутри слова → Ь.'},
 {lvl:2, text:'Осенью с дерев{ь*|ъ|_}ев падают жёлтые лист{ь*|ъ|_}я.',

  why2:'В обоих словах нет приставки, знак стоит перед окончанием — нужен мягкий Ь.'},
 {lvl:2, text:'Котёнок с{ъ*|ь|_}ел всю кашу.',
  why:'С_ел: С- — приставка на согласный, дальше Е → <b>Ъ</b>: <b>съел</b>.',
  why2:'Сравни: «сел» на стул и «съел» кашу. В «съел» есть приставка С- и дверь Ъ.'},
 {lvl:2, text:'Учитель раз{ъ*|ь|_}яснил нам трудную задачу.',
  why:'Раз_яснил: РАЗ- — приставка на согласный, дальше Я → <b>Ъ</b>: <b>разъяснил</b>.',
  why2:'Раз + яснить (сделать ясным) — приставка, значит Ъ.'},

  why:'Руч_и: приставки нет, перед окончанием И → <b>Ь</b>: <b>ручьи</b>. Перед И твёрдый знак не пишется.',
  why2:'Ручей — ручьи. Знак внутри слова, перед И — только Ь.'},
 {lvl:3, text:'Утром мы по{_*|ъ|ь}ехали на дачу.',
  why:'По_ехали: ПО- — приставка на <b>гласный</b>, знак не нужен: <b>поехали</b>.',
  why2:'Дверь Ъ ставят только после приставки на согласный. ПО- кончается на О — двери нет.'},
 {lvl:3, text:'Под{ъ*|ь|_}ём на гору был трудным, но с вершины открылся вид на ущел{ь*|ъ|_}е.',
  why:'1) Под_ём: ПОД- — приставка на согласный, дальше Ё → <b>Ъ</b>: <b>подъём</b>. 2) ущел_е: перед окончанием, приставки нет → <b>Ь</b>: <b>ущелье</b>.',
  why2:'Подъём = под + ём (приставка → Ъ). Ущелье — знак перед окончанием -Е → Ь.'},

short:'В корне -лаг- пишется А (перед Г), в корне -лож- пишется О (перед Ж). Ударение тут не помогает. Исключение: полог.',
theory:`
<div class="box rule"><b>Правило</b>
<b>-ЛАГ-</b> → перед <b>Г</b> пишем <b>А</b>: <i>предл<b>а</b>гать, изл<b>а</b>гать, сл<b>а</b>гаемое, прил<b>а</b>гательное</i>.<br>
<b>-ЛОЖ-</b> → перед <b>Ж</b> пишем <b>О</b>: <i>пол<b>о</b>жить, изл<b>о</b>жение, предл<b>о</b>жение, сл<b>о</b>жение, обл<b>о</b>жка</i>.<br>
<b>Исключение:</b> <i>пол<b>о</b>г</i> (занавеска над кроватью) — О перед Г.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Узнай корень со значением «класть»: -лаг-/-лож-.</li>
<li>Посмотри на букву <b>после</b> пропуска.</li>
<li>Г → <b>А</b>. Ж → <b>О</b>.</li>
</ol></div>

«<b>Г</b>ласная <b>А</b> идёт с <b>Г</b>, а <b>О</b> — с <b>Ж</b>»: л<b>аг</b> — л<b>ож</b>. Или: «Ж — это жук, а жук круглый, как О».</div>`,
theory2:`
<p>Корень -лаг-/-лож- — как <b>хамелеон</b>: меняет цвет (гласную) в зависимости от того, на чём сидит. Сидит на <b>Г</b> — становится <b>А</b>. Сидит на <b>Ж</b> — становится <b>О</b>.</p>
<div class="box ex"><b>Пары</b>
предл<b>аг</b>ать — предл<b>ож</b>ить · изл<b>аг</b>ать — изл<b>ож</b>ение · сл<b>аг</b>аемое — сл<b>ож</b>ение</div>
<div class="box tip"><b>Не верь ударению</b>
Здесь фонарик-ударение не работает. Смотри только на соседа справа: Г или Ж.</div>`,

 {lvl:1, text:'Пол{о*|а}жи книгу на стол.',
  why:'Пол_жи: корень -лож-, после гласной Ж → пишем <b>О</b>: <b>положи</b>.',
  why2:'Сосед справа — Ж. С Ж дружит О.'},

  why2:'Г после пропуска → А. Прил-А-гательное.'},

]});

/* ===================== -РАСТ- / -РАЩ- / -РОС- ===================== */
RU.rule({
id:'g5.rast_ros',
short:'Перед СТ и Щ пишется А (растение, выращивать), перед С без Т — О (вырос, заросли). Исключения: росток, подросток, Ростов, ростовщик, Ростислав, отрасль.',
theory:`
<div class="box rule"><b>Правило</b>
<b>А</b> пишется перед <b>СТ</b> и <b>Щ</b>: <i>р<b>а</b>сти, р<b>а</b>стение, выр<b>а</b>стить, выр<b>а</b>щивать, нар<b>а</b>щивать</i>.<br>
<b>О</b> пишется перед <b>С</b> (без Т): <i>выр<b>о</b>с, р<b>о</b>сла, зар<b>о</b>сли, пор<b>о</b>с</i>.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Узнай корень со значением «расти»: -раст-/-ращ-/-рос-.</li>
<li>Посмотри, что идёт <b>после</b> гласной: СТ или Щ? → <b>А</b>.</li>
<li>Просто С (а дальше не Т)? → <b>О</b>.</li>
<li>Проверь, не исключение ли это слово.</li>
</ol></div>
<div class="box err"><b>Исключения — выучи!</b>
С <b>О</b> перед СТ: <b>росток</b> (и <b>подросток</b>), <b>Ростов</b>, <b>ростовщик</b>, <b>Ростислав</b>.<br>
С <b>А</b> без СТ: <b>отрасль</b>.</div>
<div class="box err"><b>Ловушка: не проверяй ударением</b>

<div class="box tip"><b>Как запомнить исключения</b>
С О: «<i>Р<b>о</b>стислав из Р<b>о</b>стова посадил р<b>о</b>сток</i>» + ростовщик, подросток. С А — одно слово: «отр<b>а</b>сль».</div>`,

<div class="box ex"><b>Сравни</b>
р<b>аст</b>ёт — р<b>ос</b>ла · выр<b>ащ</b>ивать — выр<b>ос</b> · р<b>аст</b>ение — зар<b>ос</b>ли</div>
<div class="box tip"><b>Пять «хулиганов»</b>
Росток, Ростов, ростовщик, Ростислав (О перед СТ) и отрасль (А без СТ). Их просто запомни.</div>`,

/* ===================== О / Ё ПОСЛЕ ШИПЯЩИХ В КОРНЕ ===================== */
RU.rule({
id:'g5.o_yo_koren',
short:'После шипящих под ударением в корне пишется Ё, если можно подобрать однокоренное слово с Е (жёлтый — желтеть). Если такого слова нет — пишется О (шорох, крыжовник, шов).',
theory:`
<div class="box rule"><b>Правило</b>
После шипящих (Ж, Ч, Ш, Щ) <b>под ударением в корне</b> слышится [о]. Пишем:<br>
<b>Ё</b> — если можно подобрать однокоренное слово с <b>Е</b>: <i>ж<b>ё</b>лтый — ж<b>е</b>лтеть, ч<b>ё</b>рный — ч<b>е</b>рнеть, ш<b>ё</b>пот — ш<b>е</b>птать, щ<b>ё</b>тка — щ<b>е</b>тина, пч<b>ё</b>лы — пч<b>е</b>ла</i>.<br>
<b>О</b> — если такого слова нет: <i>ш<b>о</b>рох, крыж<b>о</b>вник, ш<b>о</b>в, капюш<b>о</b>н, ш<b>о</b>рты</i>.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Убедись, что пропуск в <b>корне</b>, после шипящей, под ударением.</li>
<li>Попробуй изменить слово или подобрать родственное так, чтобы на этом месте оказалась <b>Е</b>.</li>
<li>Получилось → пиши <b>Ё</b>. Не получилось → пиши <b>О</b>.</li>
</ol></div>
<div class="box ex"><b>Пиши Ё</b>
ж<b>ё</b>лудь — ж<b>е</b>лудей; щ<b>ё</b>ки — щ<b>е</b>ка; ш<b>ё</b>лк — ш<b>е</b>лка; ч<b>ё</b>рствый — ч<b>е</b>рстветь; реш<b>ё</b>тка — реш<b>е</b>то; ш<b>ё</b>рстка — ш<b>е</b>рсть.</div>
<div class="box ex"><b>Пиши О (запомни)</b>
ш<b>о</b>рох, крыж<b>о</b>вник, ш<b>о</b>в, капюш<b>о</b>н, ш<b>о</b>рты.</div>
<div class="box err"><b>Ловушка</b>
Правило только для <b>корня</b>. В окончаниях и суффиксах действуют другие правила (<i>плечом, ножом</i> — это окончания, там О по другой причине).</div>
<div class="box tip"><b>Как запомнить</b>
«Ё проверяется Е»: Ж<b>Ё</b>лтый — ж<b>Е</b>лтеть. «Нет Е — пиши О» и учи короткий список: шорох, шов, крыжовник, капюшон, шорты.</div>`,
theory2:`
<p>Буква Ё — это <b>Е, которая надела ударение</b> (две точки сверху — как шляпа). Если в другом родственном слове эта буква снимает шляпу и становится простой <b>Е</b> — значит, это Ё.</p>
<div class="box ex"><b>Сними шляпу</b>
ч<b>Ё</b>рный → ч<b>Е</b>рнеть ✔ → <b>Ё</b>.<br>
ш<b>?</b>рох → «шерох»? Такого слова нет ✘ → <b>О</b>: шорох.</div>
<div class="box tip"><b>Простой вопрос себе</b>
«Есть ли родственник с Е?» Да — Ё. Нет — О.</div>`,
items:[
 {lvl:1, text:'На лугу цветут ж{ё*|о}лтые одуванчики.',
  why:'Ж_лтые: проверочное <b>желтеть</b>, <b>желток</b> (с Е) → пишем <b>жёлтые</b>.',
  why2:'Сними с Ё шляпу: жЕлтеть — Е есть. Значит, Ё.'},
 {lvl:1, text:'У нас живёт ч{ё*|о}рный кот.',
  why:'Ч_рный: проверочное <b>чернеть</b>, <b>чернила</b> → пишем <b>чёрный</b>.',
  why2:'Чернила, чернеть — с Е. Значит, в «чёрный» — Ё.'},

/* ===================== ПРИСТАВКИ НА З / С ===================== */
RU.rule({
id:'g5.pristavki_zs',
short:'В приставках без-/бес-, раз-/рас-, из-/ис-, воз-/вос-, вз-/вс-, низ-/нис-, через-/черес- пишется З перед звонким согласным и гласной, С — перед глухим согласным: безоблачный, бесшумный.',
theory:`
<div class="box rule"><b>Правило</b>
В приставках на З/С: <b>без-/бес-, раз-/рас-, из-/ис-, воз-/вос-, вз-/вс-, низ-/нис-, через-/черес-</b>:<br>
<b>З</b> — если дальше <b>звонкий согласный</b> или <b>гласная</b>: <i>бе<b>з</b>облачный, ра<b>з</b>дался, во<b>з</b>разить, в<b>з</b>лететь</i>;<br>
<b>С</b> — если дальше <b>глухой согласный</b>: <i>бе<b>с</b>шумный, ра<b>с</b>писание, и<b>с</b>печь, во<b>с</b>ход</i>.</div>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Найди приставку на З/С.</li>
<li>Посмотри на <b>первую букву корня</b> сразу после приставки.</li>
<li>Звонкая (б, в, г, д, ж, з, л, м, н, р, й) или гласная → <b>З</b>. Глухая (к, п, с, т, ф, х, ц, ч, ш, щ) → <b>С</b>.</li>
</ol></div>
<div class="box ex"><b>Примеры</b>
бе<b>з</b>домный — бе<b>с</b>конечный; ра<b>з</b>бросать — ра<b>с</b>сказ; и<b>з</b>лить — и<b>с</b>чезать; в<b>з</b>бежать — в<b>с</b>пыхнуть.</div>
<div class="box err"><b>Ловушка 1: приставка С-</b>
Приставка <b>С-</b> всегда пишется с С, даже перед звонким: <i><b>с</b>делать, <b>с</b>бежать, <b>с</b>грести</i>. «Зделать» — ошибка! Приставки «з-» в русском языке нет.</div>
<div class="box err"><b>Ловушка 2: двойная буква</b>
Если корень начинается с С, а приставка на С — получится СС: <i>ра<b>сс</b>каз, ра<b>сс</b>вет, бе<b>сс</b>ильный</i>. Если корень начинается на З, а приставка на З — ЗЗ: <i>бе<b>зз</b>аботный</i>.</div>
<div class="box tip"><b>Как запомнить</b>
Глухие согласные — в фразе «<b>Ст</b>ёпка, <b>х</b>очешь <b>щ</b>ец? — <b>Ф</b>и!» (с, т, п, к, х, ч, ш, щ, ц, ф). Перед ними — С. Перед всеми остальными — З.</div>`,
theory2:`
<p>Последняя буква приставки — как <b>хамелеон</b>: подстраивается под соседа. Сосед звонкий или гласный — приставка «звенит»: <b>З</b>. Сосед глухой — приставка «шипит»: <b>С</b>.</p>
<div class="box ex"><b>Звенит или шипит?</b>
без + <b>д</b>омный (звонкий) → бе<b>з</b>домный.<br>
бес + <b>ш</b>умный (глухой) → бе<b>с</b>шумный.</div>
<div class="box tip"><b>Не путай</b>
«Сделать» — приставка С-, она не хамелеон, она всегда С.</div>`,

  why:'Бе_облачной: после приставки гласная О → <b>З</b>: <b>безоблачной</b>.',
  why2:'Сосед — гласная, приставка «звенит»: без-.'},
 {lvl:1, text:'Ра{с*|з}писание уроков висит на стене.',

RU.rule({
id: 'g5.tsya',
short: 'Задай к глаголу вопрос. Если в вопросе есть Ь (<b>что делать?</b> что сделать?), пиши <b>-ться</b>. Если Ь в вопросе нет (<b>что делает?</b> что сделает?), пиши <b>-тся</b>.',
theory: `<p>На слух «учится» и «учиться» звучат одинаково: [у́чицца]. Поэтому ухо тут не помощник — помогает <b>вопрос</b>.</p>
<div class="box rule"><b>Алгоритм</b><ol class="steps">
<li><span></span>Найди глагол, который кончается на [-цца].</li>
<li><span></span>Задай к нему вопрос <b>от того слова, к которому он относится</b>: «мальчик (что делает?) учится», «надо (что делать?) учиться».</li>
<li><span></span>Посмотри на конец вопроса: <b>что делаеТ?</b> / что сделаеТ? — без Ь → пиши <b>-тся</b>. <b>что делаТЬ?</b> / что сделаТЬ? — с Ь → пиши <b>-ться</b>.</li>
</ol></div>
<div class="box ex"><b>Примеры</b>
Солнце (что делает?) <u>садится</u> — -тся.<br>
Пора (что делать?) <u>собираться</u> — -ться.<br>
Он скоро (что сделает?) <u>вернётся</u> — -тся.<br>
Я хочу (что сделать?) <u>научиться</u> — -ться.</div>
<div class="box tip"><b>Как запомнить</b>Буква Ь «переезжает» из вопроса в глагол: что делаТЬ? → учиТЬся. Нет Ь в вопросе — нет Ь и в глаголе: что делаеТ? → учиТся.</div>
<div class="box err"><b>Ловушки</b>
1) После слов <i>буду, будешь, будет, начал, хочет, может, надо, нужно, пора, нельзя, любит, умеет</i> стоит неопределённая форма: «буду (что делать?) стараться», «любит (что делать?) умываться» → -ться.<br>
2) «Мне кажется», «мне нравится», «не спится» — вопрос «что делает?» → -тся.<br>
3) Вопрос задавай от главного слова, а не «на глаз»: «Тот, кто не умеет удивляться, редко чему-нибудь научится»: умеет (что делать?) удивляться, но (что сделает?) научится.</div>`,
theory2: `<p>Представь, что вопрос — это <b>форма для печенья</b>. Каким будет вопрос, таким получится и глагол.</p>
<div class="box ex"><b>Сравни пары</b>
что делаеТ? — купаеТся<br>что делаТЬ? — купаТЬся<br><br>
что сделаеТ? — улыбнёТся<br>что сделаТЬ? — улыбнуТЬся</div>
<p>Просто спроси: «Он что делает?» или «Надо что делать?» — и перепиши окончание вопроса в глагол.</p>`,

 {lvl:1, text:'Мальчик хорошо учи{ться|тся*}.',

  why2:'Скажи: «Он что делает?» — «учится». Окончание вопроса «-ет» без Ь, значит, и в глаголе Ь не нужен.'},

  why2:'«Пора» всегда зовёт неопределённую форму: пора есть, пора спать, пора собираться. А у неопределённой формы на конце -ть, вот и тут -ться.'},
 {lvl:1, text:'Солнце сади{тся*|ться} за лес.',

 {lvl:1, text:'Я хочу научи{тся|ться*} плавать.',

 {lvl:1, text:'Весной река широко разливае{тся*|ться}.',
  why:'Река (что делает?) разливается. Вопрос «что делает?» без Ь → -тся.',
  why2:'Подставь «Река (что делает?) течёт». Это форма «он/она что делает» — она никогда не пишется с Ь.'},
 {lvl:1, q:'Какой вопрос нужно задать к пропущенному слову: «Кот любит умыва…ся»?', opts:['что делает?','что делать?','что сделал?'], ans:1,

  why2:'Как «мог прыгнуть», «мог уйти»: после «мог» — неопределённая форма с -ть.'},

  why2:'«Перестали» — как «начали»: после них идёт неопределённая форма: перестали шуметь, перестали шевелиться.'},
 {lvl:2, text:'Утром бабушка всегда улыбае{ться|тся*} и говорит, что нужно радова{ться*|тся} каждому дню.',
  why:'1) Бабушка (что делает?) улыбается → -тся. 2) Нужно (что делать?) радоваться → -ться.',
  why2:'Первый глагол — действие самой бабушки сейчас («что делает?»). Второй — то, что «нужно» делать вообще («что делать?»).'},

  why:'1) Мне (что делает?) нравится → -тся. 2) Нравится (что делать?) кататься → -ться.',
  why2:'«Мне нравится» — как «мне хочется»: это «оно что делает?». А дальше — что именно нравится делать? Кататься.'},
 {lvl:3, text:'Завтра я буду стара{тся|ться*} писать аккуратнее, и у меня всё получи{тся*|ться}.',
  why:'1) Буду (что делать?) стараться → -ться (после «буду» всегда неопределённая форма). 2) Всё (что сделает?) получится → -тся.',
  why2:'Ловушка: «буду стараться» — это будущее время, но вопрос всё равно «буду что делать?» — с Ь. А «получится» — «что сделает?», без Ь.'},
 {lvl:3, text:'Мне каже{ться|тся*}, что дождь скоро закончи{тся*|ться}.',
  why:'1) Мне (что делает?) кажется → -тся. 2) Дождь (что сделает?) закончится → -тся.',
  why2:'Оба глагола — «что делает? / что сделает?». В этих вопросах нет Ь, поэтому и в глаголах его нет.'},
 {lvl:3, text:'Тот, кто не умеет удивля{ться*|тся}, редко чему-нибудь научи{ться|тся*}.',

/* ===================== Окончания существительных ===================== */
RU.rule({
id: 'g5.okonch_sush',
short: 'Чтобы написать безударное Е или И в окончании существительного, определи склонение и падеж или подставь ударное слово того же склонения: <b>земля</b> (1-е скл.), <b>конь</b> (2-е), <b>степь</b> (3-е).',
theory: `<p>В окончаниях существительных часто не слышно, что писать — Е или И: к берёз[ь], в тетрад[ь]. Есть два способа проверить.</p>
<div class="box rule"><b>Способ 1. Склонение + падеж</b><ol class="steps">
<li><span></span>Поставь слово в начальную форму и определи склонение: <b>1-е</b> — на -а/-я (мама, земля, берёза); <b>2-е</b> — мужской род без окончания и средний на -о/-е (стол, конь, окно); <b>3-е</b> — женский род на Ь (степь, тетрадь).</li>
<li><span></span>Определи падеж по вопросу.</li>
<li><span></span><b>1-е склонение</b>: в дательном и предложном падеже — <b>Е</b> (к маме, о маме), в родительном — <b>И</b> (у Тани, из деревни).<br><b>2-е склонение</b>: в предложном — <b>Е</b> (о столе).<br><b>3-е склонение</b>: в родительном, дательном и предложном — <b>И</b> (у степи, к степи, о степи).</li>
</ol></div>
<div class="box rule"><b>Способ 2. Слово-помощник с ударным окончанием</b>Подставь вместо трудного слова помощника того же склонения в том же падеже:
1-е — <b>земля́</b>: к берёз… → к земл<b>е́</b> → к берёз<b>е</b>; у Тан… → у земл<b>и́</b> → у Тан<b>и</b>.<br>
2-е — <b>конь</b>: о трамва… → о кон<b>е́</b> → о трамва<b>е</b>.<br>
3-е — <b>степь</b>: в тетрад… → в степ<b>и́</b> → в тетрад<b>и</b>.</div>
<div class="box err"><b>Особые слова на -ИЯ, -ИЙ, -ИЕ</b>У них в предложном падеже всегда <b>И</b>: о гени<b>и</b>, в здани<b>и</b>, о путешестви<b>и</b>, о Мари<b>и</b>. У слов на -ия ещё и в дательном и родительном — <b>И</b>: к станци<b>и</b>, у станци<b>и</b>, к Мари<b>и</b>. Земля здесь не поможет!</div>

RU.rule({

short: 'Главные члены — <b>подлежащее</b> (кто? что?) и <b>сказуемое</b> (что делает? каков?). Второстепенные — <b>определение</b> (какой? чей?), <b>дополнение</b> (вопросы косвенных падежей), <b>обстоятельство</b> (где? когда? как? почему?).',
theory: `<p>Предложение — как команда. В нём есть <b>главные</b> игроки и <b>помощники</b>.</p>
<div class="box rule"><b>Главные члены (грамматическая основа)</b>
<b>Подлежащее</b> — о ком или о чём говорится; отвечает на вопросы <b>кто? что?</b> (именительный падеж). Подчёркиваем одной чертой.<br>
<b>Сказуемое</b> — что говорится о подлежащем; <b>что делает? что сделал? каков? кто он такой?</b> Подчёркиваем двумя чертами.</div>
<div class="box rule"><b>Второстепенные члены</b>
<b>Определение</b> — какой? чей? (яркое солнце, мой брат). Волнистая линия.<br>
<b>Дополнение</b> — вопросы косвенных падежей: кого? чего? кому? чем? о чём? (читаю книгу, помог другу). Пунктир (штрихи).<br>
<b>Обстоятельство</b> — где? куда? когда? как? почему? (гуляли в лесу, пришёл вчера, бежал быстро). Точка-тире.</div>
<div class="box rule"><b>Как найти основу</b><ol class="steps">
<li><span></span>Найди действие — что делается? Это сказуемое: «шёл».</li>
<li><span></span>Спроси: кто или что это делает? — «дождь». Это подлежащее (обязательно в именительном падеже).</li>
<li><span></span>От основы задавай вопросы к остальным словам и определяй второстепенные члены.</li>
</ol></div>
<div class="box err"><b>Ловушки</b>
1) Подлежащее не всегда стоит первым: «Книгу читает <u>Петя</u>» — кто читает? Петя.<br>

<div class="box ex"><b>Пример</b>Вчера (когда? — обстоятельство) весёлый (какой? — определение) щенок (кто? — подлежащее) грыз (что делал? — сказуемое) косточку (что? — дополнение).</div>`,

/* ===================== Однородные члены ===================== */
RU.rule({

short: 'Между однородными членами без союзов ставится запятая. Перед союзами <b>а, но</b> — запятая. Перед одиночным союзом <b>и</b> (или, да в значении «и») — запятой нет.',

<div class="box ex"><b>Пример</b>В саду росли (что?) яблони, (что?) груши, (что?) сливы. — Все три слова отвечают на вопрос «что?» и относятся к «росли».</div>
<div class="box rule"><b>Где ставить запятую</b><ol class="steps">
<li><span></span>Однородные члены без союзов → <b>запятая</b> между ними: Дети бегали, прыгали, смеялись.</li>
<li><span></span>Перед союзами <b>а, но</b> → <b>запятая</b>: Погода была холодная, но солнечная. Мальчик не читал, а играл.</li>
<li><span></span>Перед одним союзом <b>и</b> → <b>запятой нет</b>: Мы купили хлеб и молоко.</li>
<li><span></span>Если однородных три и последний с «и» → запятая между первыми, перед «и» — нет: карандаши, ручки и тетради.</li>
</ol></div>

<div class="box tip"><b>Как запомнить</b>Союз «и» — как клей: он сам соединяет слова, запятая не нужна. «А» и «но» — как стрелочки «зато» и «однако»: перед ними нужна пауза-запятая.</div>`,

<div class="box ex"><b>Мини-схемы</b>О, О, О — бегали, прыгали, смеялись<br>О и О — хлеб и молоко<br>О, но О — холодная, но солнечная</div>`,

short: 'Прямую речь берут в кавычки. Если слова автора стоят <b>перед</b> ней — после них двоеточие: <b>А: «П».</b> Если <b>после</b> — после неё запятая (или ? !) и тире: <b>«П», — а.</b>',
theory: `<p><b>Прямая речь</b> — это чужие слова, переданные точно, как их сказали. <b>Слова автора</b> — это «кто сказал и как»: сказала мама, спросил брат.</p>

<b>А: «П?»</b> — Брат спросил: «Ты идёшь гулять?»<br>
<b>А: «П!»</b> — Дети закричали: «Ура!»<br>
После слов автора — <b>двоеточие</b>. Прямая речь с большой буквы. Точка ставится <b>после</b> кавычек, а «?» и «!» — <b>внутри</b> кавычек (и тогда точка после кавычек не нужна).</div>
<div class="box rule"><b>Схема 2. Слова автора после</b>
<b>«П», — а.</b> — «Пора спать», — сказала мама.<br>

<b>«П!» — а.</b> — «Ура!» — закричали дети.<br>

id:'g6.kas_kos',
short:'Если сразу после корня стоит суффикс -А-, пишем -КАС-; если суффикса -А- нет — пишем -КОС-.',
theory:`<p>Корень <b>-кас- / -кос-</b> значит «трогать, дотрагиваться». Проверять его ударением <u>нельзя</u> — это корень с чередованием. Смотрим не на ударение, а на то, <b>что стоит сразу после корня</b>.</p>
<div class="box rule"><b>Правило</b>Есть после корня суффикс <b>-А-</b> → пишем <b>А</b>: к<b>а</b>с<b>а</b>ться, прик<b>а</b>с<b>а</b>ться, к<b>а</b>с<b>а</b>тельная.<br>Нет суффикса <b>-А-</b> → пишем <b>О</b>: к<b>о</b>снуться, прик<b>о</b>сновение, неприк<b>о</b>сновенный.</div>
<ol class="steps"><li>Найди корень: прик<b>_с</b>аться → корень <b>-к_с-</b>.</li><li>Посмотри на букву <b>сразу после</b> корня.</li><li>Там <b>А</b> → пишем <b>кас</b>. Там другая буква (н, ну…) → пишем <b>кос</b>.</li></ol>
<div class="box ex"><b>Примеры</b>кас-<b>а</b>-ться — кос-<b>н</b>-уться<br>прикас-<b>а</b>-ться — прикос-<b>н</b>-овение<br>соприкас-<b>а</b>-ться — соприкос-<b>н</b>-уться</div>
<div class="box tip"><b>Как запомнить</b>«<b>А</b> зовёт <b>А</b>»: суффикс -а- после корня «зовёт» букву а в корень. Нет суффикса -а- — некого звать, пишем о.</div>
<div class="box err"><b>Ловушка</b>Не путай с другими корнями: <i>коса, косить траву, косой, покосившийся забор</i> — это совсем другие слова (не «трогать»), там О проверяется ударением: ко́сит, ко́сы.</div>`,
theory2:`<p>Представь, что корень <b>к_с</b> — это поезд, а суффикс <b>-а-</b> — вагон, который к нему прицеплен.</p>
<div class="box rule"><b>Есть вагон «А» — значит, и в поезде А</b>к<b>а</b>с|<b>а</b>|ться — вагон «а» прицеплен → к<b>а</b>с.<br>к<b>о</b>с|н|уться — вагона «а» нет → к<b>о</b>с.</div>
<div class="box ex"><b>Совсем просто</b>Я к<b>а</b>саюсь мяча. — Я к<b>о</b>снулся мяча.<br>Не прик<b>а</b>сайся! — Не прик<b>о</b>снись!</div>`,
items:[

  why:'После корня стоит суффикс <b>-а-</b>: кас-<b>а</b>-ться. Значит, в корне пишем <b>А</b>.',
  why2:'«А зовёт А»: видишь после корня букву а — и в корне пиши а: к<b>а</b>с<b>а</b>ться.'},
 {lvl:1,text:'к{о*|а}снуться',
  why:'После корня суффикса <b>-а-</b> нет: кос-<b>н</b>-уть-ся. Значит, пишем <b>О</b>.',
  why2:'За корнем идёт <b>н</b>, а не а. Вагона «а» нет — пишем о: к<b>о</b>снуться.'},

RU.rule({

theory:`<p>Это два корня с чередованием. Проверять их ударением, как обычные корни, <u>нельзя</u>. Нужно запомнить, какая буква пишется <b>без ударения</b>.</p>

<div class="box err"><b>Исключения (без ударения, но наоборот)</b><b>вы́гарки, и́згарь, при́гарь</b> — пишем <b>А</b>.<br><b>зоревать</b> — пишем <b>О</b>.</div>

<div class="box ex"><b>Сравни</b>Я соб<b>и</b>р<b>а</b>ю вещи (а рядом — и). Я соб<b>е</b>ру вещи (а рядом нет — е).<br>Звёзды бл<b>и</b>ст<b>а</b>ют. — Звёзды бл<b>е</b>стят.</div>
<div class="box tip"><b>Проверь себя</b>Закрой пальцем всё, что после корня. Видишь букву а? — пиши и.</div>`,
items:[
 {lvl:1,text:'соб{и*|е}рать грибы',
  why:'Соб-<b>ир</b>-<b>а</b>-ть: после корня суффикс -а- → пишем <b>И</b>.',
  why2:'«И дружит с А»: за корнем стоит а, значит, в корне и.'},
 {lvl:1,text:'Я соб{е*|и}ру вещи.',
  why:'Со-бер-<b>у</b>: после корня нет суффикса -а- → пишем <b>Е</b>.',
  why2:'За корнем сразу окончание -у, буквы а нет. Значит, соб<b>е</b>ру.'},
 {lvl:1,text:'зам{и*|е}рать от страха',
  why:'За-мир-<b>а</b>-ть: после корня суффикс -а- → <b>И</b>.',
  why2:'Сравни: зам<b>е</b>реть (нет а после корня) — зам<b>и</b>рать (есть а). Здесь а есть.'},
 {lvl:1,text:'зап{е*|и}реть дверь',
  why:'За-пер-<b>е</b>-ть: после корня нет суффикса -а- → <b>Е</b>.',
  why2:'Запереть — запирать. В «запереть» за корнем стоит е, а не а, поэтому в корне тоже е.'},
 {lvl:1,text:'выт{и*|е}рать пыль',
  why:'Вы-тир-<b>а</b>-ть: после корня суффикс -а- → <b>И</b>.',
  why2:'Вытирать — вытереть. В «вытирать» есть а после корня → и.'},
 {lvl:2,text:'Зрители зам{е*|и}рли от восторга.',
  why:'За-мер-<b>л</b>-и: после корня нет суффикса -а- → <b>Е</b>.',
  why2:'Это форма слова «замереть» (а не «замирать»). Буквы а после корня нет → е.'},
 {lvl:2,text:'По вечерам на улицах заж{и*|е}гают фонари.',
  why:'За-жиг-<b>а</b>-ют: после корня суффикс -а- → <b>И</b>.',
  why2:'Зажигают — зажечь. В «зажигают» за корнем а → пишем и.'},
 {lvl:2,text:'Дедушка выт{и*|е}рает стол, а бабушка расст{и*|е}лает скатерть.',
  why:'1) Вы-тир-<b>а</b>-ет — суффикс -а- после корня → <b>И</b>. 2) Рас-стил-<b>а</b>-ет — суффикс -а- после корня → <b>И</b>.',
  why2:'В обоих глаголах после корня стоит а, значит, в обоих и. Сравни: вытереть, расстелить — там е.'},
 {lvl:2,text:'Если из уменьшаемого выч{е*|и}сть выч{и*|е}таемое, получится разность.',
  why:'1) Вы-чес-ть — нет суффикса -а- → <b>Е</b>. 2) Вы-чит-<b>а</b>-емое — суффикс -а- после корня → <b>И</b>.',
  why2:'Вычесть — глагол без а после корня (е). Вычитаемое — от «вычитать», после корня а (и).'},
 {lvl:2,text:'Каждое утро сторож отп{и*|е}рает калитку в са{д*|т@g5.soglas}.',
  why:'1) От-пир-<b>а</b>-ет — суффикс -а- после корня → <b>И</b>. 2) Са_ — согласная на конце, проверяем: <b>сады́</b> → <b>Д</b>.',
  why2:'Отпирает — отпереть: в «отпирает» есть а → и. Сад — поставь согласную перед гласной: «сады» — слышно д.'},
 {lvl:3,q:'В каком слове пишется <b>Е</b>, хотя после корня есть суффикс <b>-А-</b>?',opts:['соб_рать','соч_тать','зам_рать','заж_гать'],ans:1,
  why:'<b>Сочетать</b> — исключение: пишется <b>Е</b>, хотя после корня -а-. В остальных словах по правилу И: соб<b>и</b>рать, зам<b>и</b>рать, заж<b>и</b>гать.',
  why2:'Запомни исключения: сочетать, сочетание, чета. Их просто нужно выучить.'},
 {lvl:3,q:'В каком сочетании корень НЕ с чередованием (проверяется ударением)?',opts:['прим_рить друзей','зам_реть на месте','выт_реть пыль','расст_лать ковёр'],ans:0,
  why:'<b>Примирить</b> друзей — от слова <b>ми́р</b>, проверяем ударением → И. Это не чередование. Остальные — корни с чередованием: зам<b>е</b>реть, выт<b>е</b>реть (нет -а- после корня), расст<b>и</b>лать (есть -а-).',
  why2:'Ловушка: «примирить» (мир) и «примерить» (мера) похожи на корень -мер-/-мир-, но проверяются ударением. «Примирить друзей» — сделать так, чтобы был ми́р.'},
 {lvl:3,text:'Эти двое — прекрасная ч{е*|и}та.',
  why:'<b>Чета</b> («пара») — исключение, пишется <b>Е</b>.',
  why2:'Слова «чета», «сочетать», «сочетание» — исключения. Подумай: в чете двое «сочетаются» друг с другом — все три слова с е.'},
 {lvl:3,text:'В этом блюде удачно соч{е*|и}таются сладкое и солёное.',
  why:'<b>Сочетаться</b> — исключение: после корня -а-, но пишется <b>Е</b>.',
  why2:'По правилу хочется написать и, но «сочетать(ся), сочетание» — исключения. Пиши е.'},
 {lvl:3,text:'Пока мы расст{и*|е}лали палатку, папа соб{и*|е}рал хворост, чтобы разж{е*|и}чь костёр.',
  why:'1) Рас-стил-<b>а</b>-ли — есть -а- → <b>И</b>. 2) Со-бир-<b>а</b>-л — есть -а- → <b>И</b>. 3) Раз-жечь — нет -а- → <b>Е</b>.',
  why2:'Проверь каждое слово пальцем: расстил|а|ли — а есть; собир|а|л — а есть; разже|чь — а нет.'},
 {lvl:3,text:'В небе бл{е*|и}стели звёзды, и всё вокруг зам{и*|е}рало в т{и*|е@g5.bezud}шине.',
  why:'1) Блест-<b>е</b>-ли — нет суффикса -а- → <b>Е</b>. 2) За-мир-<b>а</b>-ло — есть -а- → <b>И</b>. 3) Т_шина — проверяем: <b>ти́хо</b> → <b>И</b>.',
  why2:'Блестели — от «блестеть» (там е), а не от «блистать». Замирало — за корнем а. Тишина — ти́хий.'},
 {lvl:3,text:'Ты всегда аккуратно выт{и*|е}раеш{ь*|_@g5.mz_glagol} доску.',
  why:'1) Вы-тир-<b>а</b>-ешь — есть -а- → <b>И</b>. 2) Вытираешь — глагол 2-го лица ед. числа (ты что делаешь?) → на конце после ш пишем <b>Ь</b>.',
  why2:'Вытираешь — за корнем а, значит, и. А у глаголов на -шь (ты пишешь, читаешь) мягкий знак есть всегда.'},
 {lvl:3,text:'Ребята соб{и*|е}ра{ются*|ються@g5.tsya} в поход.',
  why:'1) Со-бир-<b>а</b>-ются — есть -а- → <b>И</b>. 2) Что <b>делают</b>? — собираются. В вопросе нет ь → пишем <b>-тся</b> (здесь -ются).',
  why2:'Собираются — после корня а, поэтому и. Вопрос «что делают?» без мягкого знака — и в глаголе мягкого знака нет.'}
]});

/* ===================== -МАК-/-МОК-, -РАВН-/-РОВН-, -СКАК-/-СКОЧ- ===================== */
RU.rule({
id:'g6.mak_mok',
short:'-МАК- (опускать в жидкость) / -МОК- (пропускать жидкость); -РАВН- (одинаковый) / -РОВН- (гладкий); перед К пишем -СКАК-, перед Ч — -СКОЧ-.',
theory:`<p>В этих трёх парах букву выбирают по-разному: в двух — <b>по смыслу</b>, в одной — <b>по последней букве корня</b>.</p>
<div class="box rule"><b>1. -мак- / -мок- — по смыслу</b><b>мак</b> — «опускать в жидкость»: м<b>а</b>кать хлеб в соус, обм<b>а</b>кнуть кисть в краску.<br><b>мок</b> — «пропускать жидкость, становиться мокрым»: пром<b>о</b>кнуть под дождём, непром<b>о</b>каемый плащ.</div>
<div class="box rule"><b>2. -равн- / -ровн- — по смыслу</b><b>равн</b> — «равный, одинаковый»: ур<b>а</b>внение, ср<b>а</b>внить, р<b>а</b>венство.<br><b>ровн</b> — «ровный, гладкий, прямой»: выр<b>о</b>внять дорожку, подр<b>о</b>внять кусты.</div>
<div class="box err"><b>Исключения</b><b>р<u>о</u>весник, п<u>о</u>ровну</b> — пишется О (хотя смысл «одинаковый»).<br><b>р<u>а</u>внина</b> — пишется А (хотя смысл «ровная, гладкая»).</div>
<div class="box rule"><b>3. -скак- / -скоч- — по последней букве корня</b>Перед <b>К</b> пишем <b>А</b>: ск<b>а</b>кать, проск<b>а</b>кать.<br>Перед <b>Ч</b> пишем <b>О</b>: выск<b>о</b>чить, подск<b>о</b>чить.</div>
<div class="box err"><b>Исключения</b><b>скачок, скачу</b> — перед Ч, но пишется А.</div>
<div class="box tip"><b>Как запомнить</b>Печенье <b>мАкаем</b> в чай — оно <b>мОкнет</b>.<br>У <b>рАвных</b> чисел — знак «<b>рАвно</b>»; у <b>рОвной</b> дороги — ни одной кочки.</div>`,
theory2:`<div class="box ex"><b>Задай себе вопрос</b>«Я что-то <b>окунаю</b>?» — значит, м<b>а</b>кать. «Что-то <b>намокает</b>?» — значит, м<b>о</b>кнуть.<br>«Речь о том, что <b>одинаково</b>?» — р<b>а</b>вн. «Речь о том, что <b>гладко, без бугров</b>?» — р<b>о</b>вн.</div>
<div class="box ex"><b>Скакать — скочить</b>Смотри на соседа: ска<b>К</b> → а; ско<b>Ч</b> → о. Конь ск<b>а</b>кал, заяц выск<b>о</b>чил.<br>Только «ск<b>а</b>чок» и «я ск<b>а</b>чу» — упрямые исключения.</div>`,
items:[
 {lvl:1,text:'Брат любит м{а*|о}кать печенье в молоко.',
  why:'Смысл — «опускать в жидкость» → корень <b>-мак-</b>, пишем <b>А</b>.',
  why2:'Печенье окунают в молоко — это «макать». Окунаю — значит, а.'},
 {lvl:1,text:'пром{о*|а}кнуть под дождём',
  why:'Смысл — «намокнуть, пропустить влагу» → корень <b>-мок-</b>, пишем <b>О</b>.',
  why2:'Под дождём не окунаются, а становятся мокрыми. «Мокрый» — с о.'},
 {lvl:1,text:'выр{о*|а}внять дорожку',
  why:'Смысл — «сделать ровной, гладкой» → корень <b>-ровн-</b>, пишем <b>О</b>.',
  why2:'Дорожку делают ровной, без ям. Ровный — с о.'},
 {lvl:1,text:'решить ур{а*|о}внение',
  why:'Уравнение — две части, которые <b>равны</b> друг другу → корень <b>-равн-</b>, пишем <b>А</b>.',
  why2:'В уравнении есть знак «равно» (=). Равно — с а.'},
 {lvl:1,text:'Конь ск{а*|о}кал по полю.',
  why:'В корне после гласной идёт <b>К</b> (скак-) → пишем <b>А</b>.',
  why2:'Смотри на соседа справа: ска<b>к</b> — перед к пишем а.'},
 {lvl:2,text:'Художник обм{а*|о}кнул кисть в краску.',
  why:'Кисть <b>опустили в жидкость</b> → корень <b>-мак-</b> → <b>А</b>.',
  why2:'Обмакнул = окунул. Окунаю — пишу а.'},
 {lvl:2,text:'У меня непром{о*|а}каемый плащ, поэтому я не пром{о*|а}кну.',
  why:'1) Непромокаемый — «не пропускающий воду» → <b>-мок-</b> → <b>О</b>. 2) Промокну — «стану мокрым» → <b>-мок-</b> → <b>О</b>.',
  why2:'В обоих словах речь о том, чтобы не стать мокрым. Мокрый — о.'},
 {lvl:2,text:'Садовник подр{о*|а}внял кусты, и теперь все они р{а*|о}вной высоты.',
  why:'1) Подровнял — «сделал ровными, гладкими» → <b>-ровн-</b> → <b>О</b>. 2) Равной высоты — «одинаковой» → <b>-равн-</b> → <b>А</b>.',
  why2:'Подровнять — подрезать, чтобы было ровно, без торчащих веток (о). «Равной высоты» = «одинаковой высоты» (а).'},
 {lvl:2,text:'Вдруг из-за угла выск{о*|а}чил велосипедист.',
  why:'В корне после гласной идёт <b>Ч</b> (скоч-) → пишем <b>О</b>.',
  why2:'Ско<b>ч</b>: перед ч пишем о. Сравни: ска<b>к</b>ать — перед к а.'},
 {lvl:2,text:'Из тр{а*|о@g5.bezud}вы выск{о*|а}чил заяц.',
  why:'1) Тр_вы — проверяем: <b>тра́вы</b> (тра́вка) → <b>А</b>. 2) Выскочил — перед <b>Ч</b> → <b>О</b>.',
  why2:'Трава — тра́вы. Выскочил — смотри на соседа ч → о.'},
 {lvl:3,text:'Мы с Петей р{о*|а}весники.',
  why:'<b>Ровесник</b> — исключение: смысл «одинакового возраста», но пишется <b>О</b>.',
  why2:'По смыслу «равные по возрасту», но слово-исключение пишется с о. Просто запомни: р<b>о</b>весник.'},
 {lvl:3,text:'Перед нами раскинулась бескрайняя р{а*|о}внина.',
  why:'<b>Равнина</b> — исключение: это ровная местность, но пишется <b>А</b>.',
  why2:'Хочется написать о («ровная»), но равнина — исключение. Запомни парой: р<b>о</b>весник и р<b>а</b>внина — «наоборот».'},
 {lvl:3,text:'Кузнечик сделал огромный ск{а*|о}чок.',
  why:'<b>Скачок</b> — исключение: перед Ч, но пишется <b>А</b>.',
  why2:'По правилу перед ч должно быть о, но «скачок» и «скачу» — исключения с а.'},
 {lvl:3,text:'Я ск{а*|о}чу на коне во весь опор.',
  why:'<b>Скачу</b> — форма глагола «скакать», исключение: перед Ч пишем <b>А</b>.',
  why2:'Скачу — от «скакать» (там а). Это одно из двух исключений: скачок, скачу.'},
 {lvl:3,text:'Мама разделила яблоки между детьми п{о*|а}ровну.',
  why:'<b>Поровну</b> — исключение: смысл «одинаково», но пишется <b>О</b>.',
  why2:'Поровну — как ровесник: по смыслу «одинаково», а пишется с о. Это исключения.'},
 {lvl:3,q:'В каком слове на месте пропуска пишется <b>О</b>?',opts:['ср_внение','р_весник','ур_внять в правах','р_внобедренный'],ans:1,
  why:'<b>Ровесник</b> — исключение с О. Остальные слова — о равенстве, одинаковости: ср<b>а</b>внение, ур<b>а</b>внять в правах, р<b>а</b>внобедренный.',
  why2:'«Уравнять в правах» — сделать права одинаковыми (а). Равнобедренный — с равными бёдрами-сторонами (а). Ровесник — исключение (о).'},
 {lvl:3,text:'Мы пром{о*|а}кли под х{о*|а@g5.bezud}лодным дождём.',
  why:'1) Промокли — «стали мокрыми» → <b>-мок-</b> → <b>О</b>. 2) Х_лодным — проверяем: <b>хо́лод</b> → <b>О</b>.',
  why2:'Промокли — значит, намокли (о). Холодный — хо́лодно.'},
 {lvl:3,text:'Ученик обм{а*|о}кнул кисточку в банку с в{о*|а@g5.bezud}дой.',
  why:'1) Обмакнул — «опустил в жидкость» → <b>-мак-</b> → <b>А</b>. 2) В_дой — проверяем: <b>во́ды</b> → <b>О</b>.',
  why2:'Кисточку окунули — а. Вода — во́ды.'},
 {lvl:3,text:'Из-под куста выск{о*|а}чил ё{ж*|жь@g5.mz_sush}.',
  why:'1) Выскочил — перед <b>Ч</b> → <b>О</b>. 2) Ёж — существительное мужского рода → после шипящего на конце <b>Ь не пишем</b>.',
  why2:'Ско<b>ч</b> — перед ч о. «Ёж» — он мой (мужской род), а у мужского рода после шипящих ь на конце нет: ёж, мяч, ключ.'},
 {lvl:3,text:'Дорожку выр{о*|а}вняли, и теперь по ней удобно ката{ться*|тся@g5.tsya}.',
  why:'1) Выровняли — «сделали гладкой» → <b>-ровн-</b> → <b>О</b>. 2) Удобно (что делать?) — кататься → <b>-ться</b>.',
  why2:'Ровная дорожка — без ям (о). Вопрос «что делать?» с ь — и в глаголе ь.'}
]});

/* ===================== ПРЕ- / ПРИ- ===================== */
RU.rule({
id:'g6.pre_pri',
short:'ПРЕ- значит «очень» или «пере-»; ПРИ- значит приближение, присоединение, близость или неполноту действия.',
theory:`<p>Эти приставки звучат почти одинаково, поэтому выбираем букву <b>по смыслу</b>.</p>
<div class="box rule"><b>ПРЕ- = «очень» или «пере-»</b>«очень»: <b>пре</b>красный (очень красивый), <b>пре</b>огромный.<br>«пере-»: <b>пре</b>градить (= перегородить), <b>пре</b>рвать (= перервать), <b>пре</b>творить в жизнь.</div>
<div class="box rule"><b>ПРИ- = четыре значения</b>1) приближение: <b>при</b>бежать, <b>при</b>ехать;<br>2) присоединение: <b>при</b>клеить, <b>при</b>шить;<br>3) близость: <b>при</b>школьный, <b>при</b>брежный;<br>4) неполное действие: <b>при</b>открыть (чуть-чуть), <b>при</b>творить дверь (прикрыть).</div>
<ol class="steps"><li>Подставь «очень» или «пере-». Подходит → <b>пре</b>.</li><li>Подходит «приблизиться, присоединить, рядом, чуть-чуть» → <b>при</b>.</li><li>Ничего не подходит → слово словарное, запомни его.</li></ol>
<div class="box err"><b>Слова, где смысл решает всё</b><b>пребывать</b> (находиться) — <b>прибывать</b> (приезжать)<br><b>предать</b> (изменить) — <b>придать</b> (добавить)<br><b>претворить</b> (в жизнь) — <b>притворить</b> (дверь)<br><b>презирать</b> (относиться с презрением) — <b>призреть</b> (дать приют сироте)</div>
<div class="box err"><b>Словарные слова</b><b>президент, преемник</b> (тот, кто продолжает дело), <b>превратности</b> (судьбы), <b>презирать, пренебречь, преследовать</b> — их нужно запомнить.</div>`,

/* ===================== Ы / И после приставок ===================== */
RU.rule({

theory:`<p>Есть корни, которые начинаются с <b>И</b>: <i>играть, искать, имя, история, идея</i>. Когда к ним прибавляют приставку на согласную, И превращается в <b>Ы</b> — так и слышится, и пишется.</p>

<div class="box rule"><b>Когда остаётся И</b>1) Приставка кончается на гласную: про<b>и</b>грать, по<b>и</b>скать.<br>2) После <b>меж-</b> и <b>сверх-</b>: меж<b>и</b>нститутский, сверх<b>и</b>нтересный.<br>3) После иноязычных приставок (<b>дез-, контр-, пост-, суб-, транс-</b>): дез<b>и</b>нфекция, контр<b>и</b>гра.</div>
<div class="box err"><b>Исключение</b><b>взимать</b> (плату, налоги) — пишется И.</div>
<ol class="steps"><li>Найди приставку.</li><li>Она на гласную? → И.</li><li>Это меж-, сверх- или иностранная? → И.</li><li>Обычная русская на согласную? → <b>Ы</b>.</li></ol>
<div class="box tip"><b>Как запомнить</b>Произнеси: «с<b>ы</b>грать», «раз<b>ы</b>скать» — слышишь ы? Так и пиши. А «меж-» и «сверх-» — «гордые» приставки, они не меняют и.</div>`,

<div class="box ex"><b>Примеры</b>играть → с<b>ы</b>грать, раз<b>ы</b>грать, под<b>ы</b>грать<br>искать → об<b>ы</b>скать, раз<b>ы</b>скать<br>Но: по<b>и</b>грать (порог «по» — на гласную, спотыкаться не обо что).</div>

short:'В сложных словах после твёрдой согласной пишем соединительную О (пароход), после мягкой согласной, шипящей и Ц — Е (землемер, пешеход, птицелов).',
theory:`<p>Сложное слово складывается из двух основ: <i>пар + ход</i>, <i>земля + трясение</i>. Между ними стоит «клей» — <b>соединительная гласная О или Е</b>.</p>
<div class="box rule"><b>Правило</b>Смотри на <b>последний звук первой основы</b>:<br>твёрдый согласный → <b>О</b>: пар-<b>о</b>-ход, вод-<b>о</b>-пад, сад-<b>о</b>-вод;<br>мягкий согласный, шипящий или Ц → <b>Е</b>: земл-<b>е</b>-трясение, пыл-<b>е</b>-сос, пеш-<b>е</b>-ход, птиц-<b>е</b>-лов.</div>
<ol class="steps"><li>Раздели слово на две части: пеш | ход.</li><li>Найди первое слово целиком: «пеший».</li><li>Посмотри, каким звуком кончается его основа: пеш- — шипящий.</li><li>Твёрдый → О; мягкий, шипящий, Ц → Е.</li></ol>
<div class="box ex"><b>Примеры</b>О: пароход, водопад, садовод, теплоход, листопад, звездопад, ледокол, конькобежец.<br>Е: землекоп, пылесос, сталевар, нефтепровод, огнетушитель, мореплаватель, кашевар, овощехранилище, птицелов.</div>
<div class="box err"><b>Ловушка</b>В словах с числительными (<i>пятиэтажный, двухметровый</i>) первая часть стоит в родительном падеже — это не соединительная гласная.</div>`,
theory2:`<p>Подумай, как звучит первое слово, когда к нему прибавляешь окончание:</p>
<div class="box ex"><b>Твёрдо — О, мягко — Е</b>пар → пар<b>ы</b> (твёрдо) → пар<b>о</b>ход<br>пыль → пыл<b>и</b> (мягко) → пыл<b>е</b>сос<br>сталь → стал<b>и</b> (мягко) → стал<b>е</b>вар</div>
<div class="box tip"><b>Шипящие и Ц</b>После ж, ш, ч, щ и ц — всегда Е: каш<b>е</b>вар, пеш<b>е</b>ход, птиц<b>е</b>лов, овощ<b>е</b>хранилище.</div>`,

  why2:'«Пяти-», «двух-», «трёх-» — это формы числительных, а не «клей» о/е. В остальных словах есть соединительные о и е.'},

  why2:'Пыль — мягкий знак на конце, значит, е. Звонок — от «звон».'},

/* ===================== Части речи ===================== */
RU.rule({
id:'g6.chasti_rechi',
short:'Самостоятельные части речи называют предметы, признаки, действия, количество и отвечают на вопросы; служебные (предлог, союз, частица) вопросов не имеют и только помогают.',
theory:`<p>Все слова русского языка делятся на группы — <b>части речи</b>. Главное — понять, что слово <b>обозначает</b> и на какой <b>вопрос</b> отвечает.</p>
<div class="box rule"><b>Самостоятельные (у них есть вопрос, они бывают членами предложения)</b><b>Существительное</b> — предмет: кто? что? (кот, бег, белизна)<br><b>Прилагательное</b> — признак предмета: какой? чей? (белый, лисий)<br><b>Числительное</b> — число, порядок: сколько? который? (пять, пятый)<br><b>Местоимение</b> — указывает, но не называет: я, он, наш, кто-то, себя<br><b>Глагол</b> — действие: что делать? что сделать? (бежать)<br><b>Наречие</b> — признак действия: как? где? когда? (быстро, вчера)</div>
<div class="box rule"><b>Служебные (вопроса нет, членом предложения не бывают)</b><b>Предлог</b> — связывает слова: в, на, над, около.<br><b>Союз</b> — соединяет слова и части предложения: и, а, но, что, потому что.<br><b>Частица</b> — добавляет оттенок: не, ни, бы, же, ли, только.</div>
<div class="box rule"><b>Особняком</b><b>Междометие</b> — выражает чувства: ах, ой, ура. Оно не самостоятельное и не служебное.</div>
<ol class="steps"><li>Задай к слову вопрос.</li><li>Получилось → самостоятельная часть речи; по вопросу и значению определи какая.</li><li>Вопрос не задаётся → служебная или междометие.</li></ol>
<div class="box err"><b>Ловушка</b>Не определяй часть речи только по смыслу! «Белизна» — признак, но это <u>существительное</u> (что?). «Бег» — действие, но тоже существительное.</div>`,
theory2:`<p>Представь футбольную команду. <b>Самостоятельные</b> части речи — игроки на поле: они бегают, забивают, у каждого своя роль. <b>Служебные</b> — судья и мяч: сами гол не забьют, но без них игры не будет.</p>
<div class="box ex"><b>Одно предложение — разные части речи</b>«<u>Вчера</u> (наречие) <u>мы</u> (местоимение) <u>купили</u> (глагол) <u>два</u> (числительное) <u>синих</u> (прилагательное) <u>мяча</u> (существительное) <u>и</u> (союз) <u>не</u> (частица) <u>пошли</u> <u>в</u> (предлог) <u>кино</u>».</div>
<div class="box tip"><b>Главный помощник — вопрос</b>Кто? что? — существительное. Какой? — прилагательное. Что делать? — глагол. Как? где? когда? — наречие.</div>`,
items:[
 {lvl:1,q:'Какая из этих частей речи — <b>служебная</b>?',opts:['существительное','предлог','наречие','глагол'],ans:1,
  why:'<b>Предлог</b> не отвечает на вопрос и не бывает членом предложения — он только связывает слова. Это служебная часть речи.',
  why2:'Попробуй задать вопрос к слову «на» — не получится. Значит, это служебное слово.'},
 {lvl:1,q:'Слово <b>«бежать»</b> — это…',opts:['существительное','прилагательное','глагол','наречие'],ans:2,
  why:'«Бежать» обозначает действие и отвечает на вопрос <b>что делать?</b> → <b>глагол</b>.',
  why2:'Что делать? — бежать. Действие + вопрос «что делать?» = глагол.'},
 {lvl:1,q:'На какой вопрос отвечает <b>прилагательное</b>?',opts:['кто? что?','какой? чей?','что делать?','как? где?'],ans:1,
  why:'Прилагательное обозначает признак предмета и отвечает на вопросы <b>какой? чей?</b>',
  why2:'Мяч (какой?) красный. Красный — прилагательное.'},
 {lvl:1,q:'Определи часть речи.',text:'«Весёлый» — это {прилагательное*|существительное|наречие}.',
  why:'Весёлый — <b>какой?</b> Обозначает признак предмета → <b>прилагательное</b>.',
  why2:'Подставь существительное: весёлый (какой?) мальчик. Вопрос «какой?» — прилагательное.'},
 {lvl:1,q:'Определи часть речи.',text:'«Пять» — это {числительное*|существительное|прилагательное}.',
  why:'Пять — <b>сколько?</b> Обозначает количество → <b>числительное</b>.',
  why2:'Сколько яблок? Пять. Вопрос «сколько?» — у числительного.'},
 {lvl:2,q:'Сколько служебных частей речи изучают в школе?',opts:['две: предлог и союз','три: предлог, союз, частица','четыре: предлог, союз, частица, междометие'],ans:1,
  why:'Служебных частей речи <b>три</b>: предлог, союз, частица. Междометие — отдельная группа, оно не служебное.',
  why2:'Запомни тройку «П-С-Ч»: предлог, союз, частица. А междометие (ах, ой) живёт само по себе.'},
 {lvl:2,q:'Определи часть речи.',text:'В предложении «Мы быстро шли домой» слово «быстро» — это {наречие*|прилагательное|глагол}.',
  why:'Шли (<b>как?</b>) быстро — признак действия, не изменяется → <b>наречие</b>.',
  why2:'«Быстро» объясняет глагол «шли» и отвечает на вопрос «как?». Это наречие.'},
 {lvl:2,q:'Определи часть речи.',text:'«Белизна» — это {существительное*|прилагательное|глагол}, хотя обозначает признак.',
  why:'Белизна — <b>что?</b> Отвечает на вопрос существительного, имеет род (ж. р.) и падеж → <b>существительное</b>.',
  why2:'Сравни: белый (какой?) — прилагательное; белизна (что?) — существительное. Решает вопрос, а не смысл.'},
 {lvl:2,q:'Определи часть речи выделенных слов.',text:'«Я пришёл, но друга не было дома». «Но» — это {союз*|предлог|частица}, а «не» — это {частица*|союз|предлог}.',
  why:'1) «<b>Но</b>» соединяет две части предложения → <b>союз</b>. 2) «<b>Не</b>» придаёт значение отрицания → <b>частица</b>.',
  why2:'Союз — «мостик» между частями (я пришёл | но | друга не было). Частица «не» ничего не соединяет, она только говорит «нет».'},
 {lvl:2,q:'Вставь букву и определи часть речи.',text:'Над р{е*|и@g5.bezud}кой стоял туман. Слово «над» — это {предлог*|наречие|союз}.',
  why:'1) Р_кой — проверяем: <b>ре́ки</b> → <b>Е</b>. 2) «Над» стоит перед существительным и связывает слова (стоял над чем?) → <b>предлог</b>.',
  why2:'Река — ре́ки. «Над» сам вопроса не имеет и показывает, где что находится по отношению к реке. Это предлог.'},
 {lvl:3,q:'В каком ряду <b>только самостоятельные</b> части речи?',opts:['стол, бежать, и, красивый','мы, пятый, громко, читать','на, ах, бы, синий','или, около, же, дом'],ans:1,
  why:'<b>Мы</b> — местоимение, <b>пятый</b> — числительное, <b>громко</b> — наречие, <b>читать</b> — глагол. Все самостоятельные. В других рядах есть служебные слова (и, на, бы, или, около, же) и междометие (ах).',
  why2:'Ищи ряд, где к каждому слову можно задать вопрос: мы (кто?), пятый (который?), громко (как?), читать (что делать?).'},
 {lvl:3,q:'Какое слово — НЕ местоимение?',opts:['он','наш','кто-то','вчера'],ans:3,
  why:'<b>Вчера</b> — наречие (когда?). Он, наш, кто-то — местоимения: указывают на предмет или признак, но не называют их.',
  why2:'Местоимение «вместо имени»: он (вместо «мальчик»), наш, кто-то. А «вчера» отвечает на вопрос «когда?» — это наречие.'},
 {lvl:3,q:'Определи часть речи.',text:'В предложении «После утреннего бега он бегом бросился к автобусу» слово «бега» — это {существительное*|глагол|наречие}, а «бегом» — это {наречие*|существительное|глагол}.',
  why:'1) После (чего?) <b>бега</b> — существительное, есть падеж (род. п.). 2) Бросился (<b>как?</b>) <b>бегом</b> — признак действия, наречие.',
  why2:'«Бег» — название действия, как предмет (что?) — существительное. «Бегом» здесь значит «быстро, бегая» — отвечает на «как?», это наречие.'},
 {lvl:3,q:'Какой частью речи является слово <b>«ах»</b>?',opts:['частица','союз','междометие','предлог'],ans:2,
  why:'<b>Ах</b> выражает чувство (удивление, восхищение) → <b>междометие</b>.',
  why2:'Ах, ой, ура, увы — это «звуки чувств». Такие слова — междометия.'},
 {lvl:3,q:'В каком предложении слово «что» — <b>союз</b>?',opts:['Что ты читаешь?','Я знаю, что ты прав.','Что случилось?'],ans:1,
  why:'В предложении «Я знаю, <b>что</b> ты прав» слово «что» только соединяет две части, вопроса к нему не задать → <b>союз</b>. В вопросах «Что ты читаешь?», «Что случилось?» — это местоимение (оно само обозначает предмет и является членом предложения).',
  why2:'Попробуй выбросить «что». «Я знаю: ты прав» — смысл почти не изменился, «что» был только мостиком (союз). А из вопроса «Что ты читаешь?» слово не выбросишь — оно само обозначает предмет (местоимение).'},
 {lvl:3,q:'Вставь букву и определи часть речи.',text:'Во дв{о*|а@g5.bezud}ре громко лаяла собака. «Громко» — это {наречие*|прилагательное|глагол}.',
  why:'1) Дв_ре́ — проверяем: <b>дво́р</b> → <b>О</b>. 2) Лаяла (<b>как?</b>) громко — признак действия → <b>наречие</b>.',
  why2:'Двор — во дворе. «Громко» объясняет, как лаяла собака, — это наречие.'},
 {lvl:3,q:'Вставь букву и определи часть речи.',text:'Мальчик ло{в*|ф@g5.soglas}ко поймал мяч. «Ловко» — это {наречие*|прилагательное|существительное}.',
  why:'1) Ло_ко — проверяем: <b>лови́ть</b> → <b>В</b>. 2) Поймал (<b>как?</b>) ловко → <b>наречие</b>.',
  why2:'Ловко — от «ловить», перед гласной слышно в. Поймал как? ловко — наречие.'},
 {lvl:3,q:'Вставь пропуски и определи часть речи.',text:'Девочка учи{тся*|ться@g5.tsya} рисовать. «Рисовать» — это {глагол*|существительное|наречие}.',
  why:'1) Девочка (что делает?) <b>учится</b> — в вопросе нет ь → <b>-тся</b>. 2) Рисовать — <b>что делать?</b> → <b>глагол</b> (неопределённая форма).',
  why2:'Что делает? — учится (без ь). Рисовать — действие, вопрос «что делать?», значит, глагол.'}
]});

/* ===================== НЕ с существительными ===================== */
RU.rule({
id:'g6.ne_sush',
short:'НЕ с существительными пишется слитно, если слово без НЕ не употребляется (неряха) или его можно заменить синонимом без НЕ (неправда — ложь); раздельно — если есть противопоставление с союзом А (не друг, а враг).',
theory:`<p>Перед существительным «не» иногда «прирастает» к слову, а иногда стоит отдельно.</p>
<div class="box rule"><b>Пишем СЛИТНО</b>1) Без НЕ слово <b>не бывает</b>: <b>неряха, невежда, негодование, неурядица</b> (нет слов «ряха», «вежда», «годование»).<br>2) Можно подобрать <b>синоним без НЕ</b>: <b>неправда</b> = ложь, <b>недруг</b> = враг, <b>неудача</b> = провал, <b>несчастье</b> = беда, <b>неволя</b> = плен, <b>непогода</b> = ненастье.</div>
<div class="box rule"><b>Пишем РАЗДЕЛЬНО</b>Есть (или подразумевается) <b>противопоставление с союзом А</b>: Это <b>не друг, а</b> просто знакомый. Нам нужна <b>не помощь, а</b> совет.</div>
<ol class="steps"><li>Есть союз «а» и противопоставление? → <b>раздельно</b>.</li><li>Нет. Слово без «не» существует? Нет → <b>слитно</b>.</li><li>Существует. Можно заменить синонимом без «не»? Да → <b>слитно</b>.</li></ol>
<div class="box tip"><b>Как запомнить</b>«<b>А</b> — разделяет». Видишь союз «а» с противопоставлением — пиши «не» отдельно.</div>
<div class="box err"><b>Ловушка</b>Союз «<b>но</b>» — это не противопоставление для «не»: «Нас постигла <b>неудача</b>, но мы не сдались» — слитно.</div>`,
theory2:`<p>Задай себе два коротких вопроса.</p>
<div class="box ex"><b>Вопрос 1: «Можно сказать короче, одним словом без НЕ?»</b>неправда → ложь ✔ слитно<br>недруг → враг ✔ слитно<br>неряха → (без «не» слова нет) ✔ слитно</div>
<div class="box ex"><b>Вопрос 2: «Есть ли “не это, а то”?»</b>Это <b>не</b> правда, <b>а</b> выдумка. → раздельно<br>Это <b>не</b> волк, <b>а</b> собака. → раздельно</div>`,
items:[
 {lvl:1,text:'Мой брат — ужасный {неряха*|не ряха}.',
  why:'Слова «ряха» нет — без НЕ слово не употребляется → пишем <b>слитно</b>.',
  why2:'Убери «не» — получится бессмыслица. Значит, «не» — часть слова: неряха.'},
 {lvl:1,text:'Только {невежда*|не вежда} может так грубо ответить.',

  why2:'Невежда — необразованный, грубый человек. Слова «вежда» нет, значит, пишем вместе.'},
 {lvl:1,text:'Он сказал {неправду*|не правду}.',

  why2:'Замени: он сказал ложь. Получилось одним словом — значит, неправду пишем слитно.'},

  why2:'«Не» здесь — часть слова, союза «а» нет: неосторожность. Порезал — ре́зать, ре́жет.'},

  why:'Слово «непорядок» существует, но здесь есть <b>противопоставление с «а»</b>: не порядок, а хаос → <b>раздельно</b>.',
  why2:'Ловушка: «непорядок» бывает слитно. Но в этом предложении — схема «не это, а то». Союз «а» решает: раздельно.'},

  why:'«Нам нужна <b>не помощь, а</b> совет» — противопоставление с союзом «а» → раздельно. Остальные слитно: невнимательность (= рассеянность), невежда (без НЕ не употребляется), неприязнь (= враждебность).',
  why2:'Ищи союз «а» с противопоставлением. Он есть только в третьем предложении.'},
 {lvl:3,q:'Почему слово <b>«неряха»</b> пишется слитно?',opts:['есть противопоставление','без НЕ слово не употребляется','это глагол','НЕ с существительными всегда пишется слитно'],ans:1,

/* ===================== НЕ с прилагательными ===================== */
RU.rule({
id:'g6.ne_prilag',
short:'НЕ с прилагательными пишется слитно, если слово без НЕ не употребляется (нелепый) или есть синоним без НЕ (невысокий — низкий); раздельно — при противопоставлении с А и после слов «вовсе не», «далеко не», «отнюдь не».',
theory:`<p>Правило очень похоже на «НЕ с существительными». Добавляется только одна новая деталь — слова-усилители.</p>
<div class="box rule"><b>Пишем СЛИТНО</b>1) Без НЕ не употребляется: <b>нелепый, небрежный, неряшливый, неуклюжий, ненастный</b>.<br>2) Есть <b>синоним без НЕ</b>: <b>небольшой</b> = маленький, <b>невысокий</b> = низкий, <b>неглубокий</b> = мелкий, <b>неглупый</b> = умный, <b>нелёгкий</b> = трудный.</div>
<div class="box rule"><b>Пишем РАЗДЕЛЬНО</b>1) <b>Противопоставление с союзом «а»</b>: река <b>не глубокая, а</b> мелкая.<br>2) Перед прилагательным стоят <b>вовсе не, далеко не, отнюдь не, ничуть не</b>: задача <b>вовсе не трудная</b>; <b>далеко не новый</b> автомобиль.</div>
<ol class="steps"><li>Есть «а» с противопоставлением или «вовсе не / далеко не / отнюдь не»? → <b>раздельно</b>.</li><li>Без «не» слово не существует? → <b>слитно</b>.</li><li>Есть синоним без «не»? → <b>слитно</b>.</li></ol>
<div class="box err"><b>Ловушка</b>Союз «<b>но</b>» не мешает слитному написанию: «задача <b>нелёгкая</b>, но интересная» — слитно.</div>
<div class="box tip"><b>Как запомнить</b>«Вовсе», «далеко», «отнюдь» — это «усилители отрицания». Они держат «не» отдельно, как магнит.</div>`,
theory2:`<div class="box ex"><b>Пример-лесенка</b>Река <b>неглубокая</b>. (= мелкая → слитно)<br>Река <b>не глубокая, а</b> мелкая. (есть «а» → раздельно)<br>Река <b>вовсе не глубокая</b>. (есть «вовсе» → раздельно)</div>
<div class="box tip"><b>Проверка одним словом</b>Попробуй сказать то же самое одним словом без «не»: небольшой — маленький. Получилось — пиши вместе.</div>`,

  why:'1) Невысокий = <b>низкий</b>, противопоставления нет → <b>слитно</b>. 2) Ду_ — согласная на конце, проверяем: <b>дубы́</b> → <b>Б</b>.',
  why2:'«На низком холме» — подходит, значит, невысоком пишем вместе. Дуб — дубы: перед гласной слышно б.'},

  why:'Сочетание <b>«далеко не»</b> усиливает отрицание → <b>раздельно</b>.',
  why2:'«Далеко не новый» — значит «совсем не новый». Слово-усилитель «далеко» требует раздельного написания.'},
 {lvl:3,q:'В каком случае НЕ с прилагательным пишется <b>раздельно</b>?',opts:['(не)высокий забор','(не)лепая шутка','(не)широкая, а узкая тропинка','(не)брежный почерк'],ans:2,
  why:'«<b>Не широкая, а узкая</b>» — противопоставление с союзом «а» → раздельно. Остальные слитно: невысокий (= низкий), нелепая и небрежный (без НЕ не употребляются).',
  why2:'Ищи союз «а» или слова «вовсе, далеко, отнюдь». Здесь «а» есть только в третьем варианте.'},
 {lvl:3,q:'Какое прилагательное <b>без НЕ не употребляется</b>?',opts:['неуклюжий','невесёлый','неяркий','нетрудный'],ans:0,

  why:'1) ч_стила — безударная гласная в корне, проверяем: чИстый → <b>И</b>. 2) серебр<b>ян</b>ую — суффикс -ЯН- → одна <b>Н</b>.',
