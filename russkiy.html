 {lvl:3,text:'О{_*|,} мой верный друг, как я рад тебя видеть!',
  why:'«<b>О</b>» перед обращением («мой верный друг») запятой <b>не отделяется</b>. После обращения — запятая.',
  why2:'«О» здесь — часть обращения и произносится с ним слитно, без паузы. Его не отрываем: «О мой друг».'},
 {lvl:3,q:'В каком предложении запятая после междометия <b>не нужна</b>?',
  opts:['Ну и мороз сегодня!','Ах, я забыл ключи!','Увы, мы опоздали.','Ой, больно!'],ans:0,
  why:'«<b>Ну и</b> мороз!» — усилительное сочетание с «и», запятая не ставится. В остальных междометия отделены запятой.',
  why2:'Ищи «ну и» или «ох и» — такие сочетания пишутся без запятой.'},
 {lvl:1,text:'Ой{,*|_} мама{,*|_@g5.obrashch} смотри!',
  why:'1) «Ой» — междометие → запятая. 2) «Мама» — <b>обращение</b> (к кому обращаемся) → выделяется запятыми.',
  why2:'1) Вскрик — пауза. 2) Мы зовём маму — это обращение, его отделяем запятыми.'},
 {lvl:2,text:'Увы{,*|_} поезд уже {ушёл*|ушол@g5.o_yo_koren}.',
  why:'1) «Увы» — междометие → запятая. 2) Ушёл — под ударением после шипящей в корне пишется <b>Ё</b>, есть родственное слово с Е: <b>шедший</b>.',
  why2:'1) Вздох сожаления — пауза — запятая. 2) Подбери слово с Е: ушёл — ушедший → Ё.'},
 {lvl:2,text:'Ах{,*|_} я забыл тетра{д*|т@g5.soglas}ь!',
  why:'1) «Ах» — междометие → запятая. 2) тетра_ь — проверяемая согласная: <b>тетра́ди</b> → Д.',

 {lvl:3,text:'Эх{,*|_} сейчас бы на р{е*|и@g5.bezud}ку!',
  why:'1) «Эх» — междометие → запятая. 2) р_ку — безударная гласная в корне, проверка: <b>ре́ки</b>, <b>ре́чка</b> → Е.',
  why2:'1) «Эх» — вздох мечты, отделяем. 2) Подбери слово с ударением на корне: ре́чка.'},
 {lvl:3,text:'{Ей-богу*|Ей богу|Ейбогу}, я {не брал*|небрал@g5.ne_glagol} твою ручку.',

  why:'1) «Не оглядываясь по сторонам» — <b>деепричастный оборот</b> → отделяется запятой. 2) НЕ с деепричастиями — <b>раздельно</b>.',
  why2:'1) Шёл (как?) не оглядываясь — добавочное действие, отделяем запятой. 2) Деепричастие с НЕ — как глагол: раздельно.'},
 {lvl:2,text:'Ветер дул угрожающ{е*|о@g7.o_e_narech}{,*|_@g5.slozhnoe} и деревья гнулись к земле.',
  why:'1) Угрожа́юще — конец без ударения → Е. 2) Две грамматические основы (<b>ветер дул</b>, <b>деревья гнулись</b>) соединены союзом «и» → запятая.',
  why2:'1) Ударение не на конце — пишем Е. 2) Два «кто? что делал?» — значит, сложное предложение, перед «и» запятая.'},
 {lvl:2,text:'{Кое-где*|Кое где|Коегде@g7.defis_narech} на нескоше{нн*|н@g7.n_nn_prich}ом лугу ещё цвели ромашки.',
  why:'1) <b>КОЕ-</b> → дефис. 2) «Нескошенный» — от глагола «скосить» с <b>приставкой с-</b> (совершенный вид) → НН.',
  why2:'1) Кое-где, кое-как — с дефисом. 2) Есть приставка (с-косить) → две Н. «Не» перед словом на количество Н не влияет.'},
 {lvl:2,text:'{Что бы*|Чтобы@g7.soyuzy} ты {ни*|не@g7.ne_ni_chastitsy} делал, делай это хорош{о*|е@g7.o_e_narech}.',

  why2:'1–2) Неважно что ты делаешь — конструкция «что бы ни». 3) Ударение на конце — после шипящей О.'},
 {lvl:2,text:'Мы вернулись засветл{о*|а@g7.o_a_narech}{,*|_@g7.deeprich_oborot} {не встретив*|невстретив@g7.ne_deeprich} по дороге ни души.',
  why:'1) Приставка <b>ЗА-</b> → О. 2) «Не встретив по дороге ни души» — деепричастный оборот → запятая. 3) НЕ с деепричастием — раздельно.',
  why2:'1) ЗА любит О. 2) Вернулись (как?) не встретив… — добавочное действие, отделяем. 3) Деепричастие — как глагол: НЕ отдельно.'},
 {lvl:2,text:'Мы шли {вдвоём*|в двоём@g7.slitno_narech} вдоль посе{я*|е@g7.glas_pered_nn}нного поля.',
  why:'1) <b>Вдвоём</b> — наречие от собирательного числительного → слитно. 2) Посеять — глагол на <b>-ять</b> → перед НН сохраняется <b>Я</b>: посеянный.',
  why2:'1) Как шли? Вдвоём — одно слово. 2) Посмотри на глагол: посе<b>я</b>ть → посе<b>я</b>нный.'},
 {lvl:2,text:'На улице ветре{н*|нн@g7.n_nn_narech}о, и ветки стучат в {стеклянную*|стекляную@g6.n_nn_prilag} дверь.',

  why2:'1) Наречие повторяет прилагательное: ветре<b>н</b>ый. 2) Три слова-исключения с -ЯНН- запоминаем.'},
 {lvl:3,text:'Мальчик{,*|_@g7.prich_oborot} {нечаянно*|не чаянно@g7.ne_narech} разбивший чашку{,*|_@g7.prich_oborot} {не смог*|несмог@g5.ne_glagol} сдержать слёз.',

 {lvl:3,text:'Учитель{,*|_@g7.prich_oborot} увлечё{нн*|н@g7.n_nn_narech}о рассказывающий о путешествии{,*|_@g7.prich_oborot} не заметил звонка.',

  why2:'1) Учитель (какой?) рассказывающий… — оборот после слова, выделяем. 2) Наречие берёт Н у прилагательного: увлечё<b>нн</b>ый.'},
 {lvl:3,text:'Как {ни*|не@g7.ne_ni_chastitsy} старался Петя, задача {не решалась*|нерешалась@g5.ne_glagol}, {зато*|за то@g7.soyuzy} он понял, где ошибся.',

  why2:'1) Неважно, как старался, — НИ. 2) Глагол без НЕ есть — раздельно. 3) Подставь «но» — подходит.'},
 {lvl:3,text:'Увы{,*|_@g7.mezhdometiya} н{и*|е@g6.mestoim_ne_ni}кто {не*|ни@g7.ne_ni_chastitsy} пришёл на помощь.',
  why:'1) «Увы» — междометие → запятая. 2) «Никто» — без ударения на приставке → НИ. 3) «Не пришёл» — отрицание при глаголе → НЕ.',
  why2:'1) Вздох сожаления отделяем. 2) Никто́ — ударение не на приставке, значит, НИ. 3) Сказуемое отрицаем частицей НЕ.'},
 {lvl:3,text:'Котёнок{,*|_@g7.deeprich_oborot} неуклюж{е*|о@g7.o_e_narech} подпрыгнув{,*|_@g7.deeprich_oborot} упал {навзничь*|навзнич@g7.mz_narech}.',

  why2:'1) Котёнок упал (как?) неуклюже подпрыгнув — добавочное действие, в запятые. 2) Ударение на «клю» — Е. 3) Наречие на шипящую, не исключение — Ь.'},
 {lvl:3,text:'{Вначале*|В начале@g7.slitno_narech} было трудно, но мы {всё-таки*|всё таки|всётаки@g7.chastitsy_defis} справились.',

<script>/* 8 класс: простое предложение, однородные и обособленные члены, вводные слова, обращения, сравнительные обороты, прямая речь.
   + итоговое упражнение 8 класса (RU.mix). */
(function(){
/* упражнения каждого правила — по возрастанию сложности (устойчивая сортировка по lvl) */
const L=a=>a.map((x,i)=>[x,i]).sort((p,q)=>p[0].lvl-q[0].lvl||p[1]-q[1]).map(p=>p[0]);

/* ===================== ВИДЫ СКАЗУЕМЫХ ===================== */
RU.rule({
id:'g8.skazuem',
short:'Сказуемое бывает трёх видов: простое глагольное (один глагол), составное глагольное (вспомогательный глагол + инфинитив) и составное именное (связка + имя).',
theory:`
<p>Сказуемое — это то, что говорится о подлежащем: <i>что делает? каков? кто такой?</i> Сказуемое бывает «из одного кирпичика» или «из двух». Давай научимся их различать.</p>
<div class="box rule"><b>1. Простое глагольное сказуемое (ПГС)</b>
Один глагол в любом времени и наклонении: <i>Дети <u>играют</u>. Я <u>прочитал</u> книгу. Мы <u>будем писать</u> диктант.</i><br>
⚠ <i>будем писать</i> — это просто будущее время глагола «писать», поэтому сказуемое <strong>простое</strong>.<br>
Сюда же относятся фразеологизмы: <i>Он <u>бил баклуши</u></i> (= бездельничал) — одно понятие, значит ПГС.</div>
<div class="box rule"><b>2. Составное глагольное сказуемое (СГС)</b>
<strong>Вспомогательный глагол + инфинитив</strong> (неопределённая форма на -ть, -ти, -чь).<br>
Вспомогательная часть показывает начало, конец, желание, возможность: <i>начал, стал, перестал, продолжал, хочу, могу, умею, должен, рад, готов</i>.<br>
<i>Я <u>хочу спать</u>. Он <u>начал рассказывать</u>. Я <u>рад видеть</u> тебя. Дождь <u>перестал идти</u>.</i></div>
<div class="box rule"><b>3. Составное именное сказуемое (СИС)</b>
<strong>Связка + именная часть</strong> (существительное, прилагательное, причастие, числительное).<br>
Связки: <i>быть, стать, становиться, являться, казаться, оказаться</i>. В настоящем времени связка часто «невидимая» (нулевая).<br>
<i>Погода <u>была хорошей</u>. Брат <u>стал врачом</u>. Задача <u>оказалась трудной</u>. Мой брат — <u>врач</u>. Небо <u>голубое</u>.</i></div>
<ol class="steps">
<li>Найди сказуемое.</li>
<li>В нём одно слово-глагол (или глагол в будущем времени с «буду/будешь»)? → <strong>ПГС</strong>.</li>
<li>Есть <strong>инфинитив</strong> (-ть, -ти, -чь), а перед ним глагол «начал, хочу, могу…»? → <strong>СГС</strong>.</li>
<li>Есть <strong>существительное или прилагательное</strong>, которое говорит, кто такой или каков предмет? → <strong>СИС</strong>.</li>
</ol>
<div class="box err"><b>Ловушка: глагол «стать»</b>
<i>Брат стал <u>учиться</u></i> — после «стал» инфинитив → СГС (стал = начал).<br>
<i>Брат стал <u>музыкантом</u></i> — после «стал» существительное → СИС.<br>
<i>Мы <u>будем учиться</u></i> — это будущее время → ПГС, а не СГС!</div>
<div class="box tip"><b>Как запомнить</b>Глагольное — смысл в глаголе. Именное — смысл в имени (существительном, прилагательном). Составное — из двух частей.</div>`,
theory2:`
<p>Представь, что сказуемое — это поезд.</p>
<div class="box ex"><b>Один вагон — простое глагольное</b><i>Кошка <u>спит</u>. Мы <u>будем гулять</u></i> («будем» — просто показывает будущее).</div>
<div class="box ex"><b>Паровоз + вагон-инфинитив — составное глагольное</b><i>Кошка <u>хочет спать</u>. Кошка <u>начала мурлыкать</u>.</i></div>
<div class="box ex"><b>Паровоз-связка + вагон-имя — составное именное</b><i>Кошка <u>была сонной</u>. Кошка <u>стала толстой</u>. Мурка — <u>кошка</u>.</i></div>
<p>Спроси себя: что стоит после первого глагола? Инфинитив на <strong>-ть</strong> → глагольное. Существительное или прилагательное → именное. Ничего → простое.</p>`,
items:L([
 {lvl:1,q:'Какое сказуемое в предложении «Дети <u>играют</u> во дворе»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:0,
  why:'Сказуемое — один глагол «играют». Нет инфинитива, нет существительного или прилагательного → <b>простое глагольное</b>.',
  why2:'Один «вагон» — один глагол. Это простое сказуемое.'},
 {lvl:1,q:'Какое сказуемое в предложении «Я <u>хочу спать</u>»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:1,
  why:'«хочу» — вспомогательный глагол (желание), «спать» — инфинитив на -ть. Глагол + инфинитив → <b>составное глагольное</b>.',
  why2:'Два «вагона»: «хочу» показывает желание, а главный смысл — в слове «спать». Это составное глагольное.'},
 {lvl:1,q:'Какое сказуемое в предложении «Мой брат — <u>врач</u>»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:2,
  why:'Сказуемое выражено существительным «врач», связка нулевая (в прошедшем времени было бы «был врачом»). → <b>составное именное</b>.',
  why2:'Поставь в прошедшее время: «Брат был врачом». Появилась связка «был» + имя «врачом» → составное именное.'},
 {lvl:1,q:'Какое сказуемое в предложении «Погода <u>была хорошей</u>»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:2,
  why:'«была» — связка, «хорошей» — прилагательное (именная часть). Связка + имя → <b>составное именное</b>.',
  why2:'Главный смысл — в прилагательном «хорошей» (какая погода?). «Была» лишь показывает время. Значит, сказуемое именное.'},
 {lvl:1,q:'Из чего состоит <b>составное глагольное</b> сказуемое?',opts:['из вспомогательного глагола и инфинитива','из связки и существительного или прилагательного','из одного глагола','из двух существительных'],ans:0,
  why:'СГС = вспомогательный глагол (начал, хочу, могу, должен) + инфинитив: <i>начал читать</i>.',
  why2:'Запомни: в составном глагольном обязательно есть неопределённая форма на -ть, -ти, -чь.'},
 {lvl:2,q:'Какое сказуемое в предложении «Мы <u>будем писать</u> сочинение»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:0,
  why:'«будем писать» — это форма будущего времени одного глагола «писать» (сложное будущее). Поэтому сказуемое <b>простое глагольное</b>.',
  why2:'Сравни: «пишем — писали — будем писать». Это один и тот же глагол в разных временах. Значит, сказуемое простое.'},
 {lvl:2,q:'Какое сказуемое в предложении «Он <u>начал рассказывать</u>»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:1,
  why:'«начал» — вспомогательный глагол (начало действия) + инфинитив «рассказывать» → <b>составное глагольное</b>.',
  why2:'«Начал» сам по себе неполный: начал что делать? Нужен инфинитив. Значит, сказуемое из двух глаголов — составное глагольное.'},
 {lvl:2,q:'В каком предложении сказуемое <b>составное именное</b>?',opts:['Дождь перестал идти.','Дождь шёл всю ночь.','Ночь была дождливой.','Дождь будет идти долго.'],ans:2,
  why:'«была дождливой» — связка «была» + прилагательное «дождливой» → СИС. «перестал идти» — СГС, «шёл» и «будет идти» — ПГС.',
  why2:'Ищи предложение, где после глагола стоит прилагательное или существительное: «была (какой?) дождливой».'},
 {lvl:2,q:'Какое сказуемое в предложении «Я <u>рад видеть</u> тебя»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:1,
  why:'«рад» — краткое прилагательное в роли вспомогательной части (как «должен, готов»), «видеть» — инфинитив. → <b>составное глагольное</b>.',
  why2:'Замени: «Я рад видеть» ≈ «Я хочу видеть». Есть инфинитив «видеть» — значит, составное глагольное.'},
 {lvl:2,q:'Какое сказуемое в предложении «Задача <u>оказалась трудной</u>»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:2,
  why:'«оказалась» — связка, «трудной» — прилагательное → <b>составное именное</b>.',
  why2:'Какой оказалась задача? — трудной. Главное слово — прилагательное, значит именное.'},
 {lvl:3,q:'В каком предложении сказуемое <b>составное именное</b>?',opts:['Брат стал учиться в музыкальной школе.','Брат стал музыкантом.','Брат будет учиться в музыкальной школе.','Брат хочет учиться музыке.'],ans:1,
  why:'«стал музыкантом» — связка «стал» + существительное → СИС. «стал учиться», «хочет учиться» — СГС (есть инфинитив), «будет учиться» — ПГС (будущее время).',
  why2:'Ловушка — глагол «стал». Смотри, что после него: инфинитив («учиться») → глагольное; существительное («музыкантом») → именное.'},
 {lvl:3,q:'Какое сказуемое в предложении «Мальчик <u>бил баклуши</u> весь день»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:0,
  why:'«бить баклуши» — фразеологизм, его можно заменить одним глаголом «бездельничал». Фразеологизм — один член предложения → <b>простое глагольное</b>.',
  why2:'Замени фразеологизм одним словом: «Мальчик бездельничал весь день». Один глагол → простое глагольное.'},
 {lvl:3,q:'Какое сказуемое в предложении «Вчера я <u>был</u> в театре»?',opts:['простое глагольное','составное глагольное','составное именное'],ans:0,
  why:'Здесь «был» значит «находился, присутствовал». Это не связка, а самостоятельный глагол → <b>простое глагольное</b>.',
  why2:'Замени: «Вчера я находился в театре». Получился обычный глагол, после него нет ни имени, ни инфинитива → простое.'},
 {lvl:3,q:'Какая часть составного именного сказуемого выражает его главный смысл?',opts:['связка','именная часть','вспомогательный глагол','инфинитив'],ans:1,
  why:'В СИС связка (был, стал, оказался) показывает время и лицо, а главный смысл — в именной части: <i>был <u>весёлым</u></i>.',
  why2:'В «стал врачом» главное — «врачом» (кем стал). «Стал» — только «сцепка» поезда.'},
 {lvl:2,text:'Мы пр{и*|е@g6.pre_pri}шли в лес рано утром. Сказуемое здесь — {простое глагольное*|составное глагольное|составное именное}.',

/* ===================== ТИРЕ МЕЖДУ ПОДЛЕЖАЩИМ И СКАЗУЕМЫМ ===================== */
RU.rule({
id:'g8.tire_podl_skaz',
short:'Тире ставим, если подлежащее и сказуемое — существительные в именительном падеже, инфинитивы, числа или перед сказуемым есть «это, вот, значит». Не ставим, если подлежащее — личное местоимение, перед сказуемым «не» или сравнительный союз.',
theory:`
<p>Когда в предложении нет глагола-связки («есть, был»), между подлежащим и сказуемым иногда ставится <strong>тире</strong>. Оно как бы заменяет пропущенное слово «это есть».</p>
<div class="box rule"><b>Тире СТАВИМ, когда</b>
<ol class="steps">
<li><strong>сущ. (И.п.) — сущ. (И.п.)</strong>: <i>Москва — столица России. Берёза — дерево.</i></li>
<li><strong>инфинитив — инфинитив</strong>: <i>Жить — Родине служить.</i></li>
<li><strong>сущ. — инфинитив</strong> или <strong>инфинитив — сущ.</strong>: <i>Наша цель — победить. Читать — моё любимое занятие.</i></li>
<li><strong>числа</strong>: <i>Дважды два — четыре.</i></li>
<li>перед сказуемым стоят слова <strong>это, вот, значит</strong> — тире ставим <u>перед</u> ними: <i>Книга — это источник знаний. Жить — значит работать.</i></li>
</ol></div>
<div class="box rule"><b>Тире НЕ СТАВИМ, когда</b>
<ol class="steps">
<li>подлежащее — <strong>личное местоимение</strong> (я, ты, он, мы, вы, они): <i>Он мой брат. Мы ученики.</i></li>
<li>перед сказуемым стоит <strong>не</strong>: <i>Бедность не порок.</i></li>
<li>сказуемое со <strong>сравнительным союзом</strong> (как, будто, словно, точно): <i>Озеро как зеркало.</i></li>
<li>сказуемое — <strong>прилагательное</strong>: <i>Небо голубое.</i></li>
</ol></div>
<p><strong>Алгоритм:</strong></p>
<ol class="steps">
<li>Найди подлежащее и сказуемое. Есть между ними глагол? Тогда тире не нужно.</li>
<li>Подлежащее — я, ты, он, мы, вы, они? → <strong>без тире</strong>.</li>
<li>Перед сказуемым «не», «как», «будто», «словно», «точно»? → <strong>без тире</strong>.</li>
<li>Обе части — существительные в И.п., инфинитивы или числа? Есть «это, вот, значит»? → <strong>тире</strong>.</li>
</ol>
<div class="box err"><b>Типичные ошибки</b>«Он — врач» — неверно, подлежащее «он» — местоимение.<br>«Бедность — не порок» — неверно, перед сказуемым «не».<br>«Жить значит работать» — неверно, перед «значит» нужно тире.</div>
<div class="box tip"><b>Как запомнить</b>Тире — это «мостик» между двумя одинаковыми берегами: существительное — существительное, инфинитив — инфинитив. Если на мосту стоит сторож «не», «как» или «он» — мостик не нужен.</div>`,
theory2:`
<p>Представь весы. Тире ставим, когда на обеих чашах лежит <strong>одно и то же по виду</strong>:</p>
<div class="box ex"><b>Ставим тире</b><i>Кит — животное</i> (сущ. и сущ.)<br><i>Курить — здоровью вредить</i> (инф. и инф.)<br><i>Дважды три — шесть</i> (числа)<br><i>Дружба — это главное</i> (есть «это»)</div>
<div class="box ex"><b>Не ставим</b><i>Я ученик</i> (подлежащее «я»)<br><i>Кит не рыба</i> (есть «не»)<br><i>Облако как вата</i> (есть «как»)</div>
<p>Подсказка: прочитай предложение вслух. Где хочется сделать паузу и сказать «это» — там тире. Но с «я, ты, он» и с «не» тире не ставим.</p>`,

/* ===================== ОДНОСОСТАВНЫЕ ПРЕДЛОЖЕНИЯ ===================== */
RU.rule({
id:'g8.odnosost',
short:'Односоставное предложение имеет один главный член. Виды: определённо-личное, неопределённо-личное, безличное, назывное.',
theory:`
<p>В обычном (двусоставном) предложении два главных члена: подлежащее и сказуемое. А в <strong>односоставном</strong> — только один, и второго не нужно: смысл и так понятен.</p>
<div class="box rule"><b>1. Определённо-личное</b>
Есть только сказуемое-глагол в форме <strong>1-го или 2-го лица</strong> (я, мы, ты, вы) или повелительного наклонения. Мы точно знаем, КТО делает.<br>
<i>Люблю грозу в начале мая.</i> (я люблю) <i>Пиши аккуратнее.</i> (ты пиши)</div>
<div class="box rule"><b>2. Неопределённо-личное</b>
Сказуемое в <strong>3-м лице множественного числа</strong> (пишут, говорят) или в прошедшем времени мн. числа (постучали). Кто делает — неизвестно или неважно.<br>
<i>В дверь постучали. В газете пишут о погоде.</i></div>
<div class="box rule"><b>3. Безличное</b>
Действие происходит «само по себе», подлежащего нет и <strong>не может быть</strong>.<br>
<i>Светает. Мне холодно. Нельзя шуметь. Дорогу замело снегом. Мне не спится.</i></div>
<div class="box rule"><b>4. Назывное</b>
Главный член — <strong>подлежащее-существительное</strong>. Предложение называет предмет или явление.<br>
<i>Зима. Ночь. Улица. Фонарь. Тихий зимний вечер.</i></div>
<ol class="steps">
<li>Найди главный член. Это существительное в И.п. и глагола нет? → <strong>назывное</strong>.</li>
<li>Глагол. Можно подставить «я, мы, ты, вы»? → <strong>определённо-личное</strong>.</li>
<li>Глагол во мн. числе, а подставить можно только «кто-то, они» (неизвестно кто)? → <strong>неопределённо-личное</strong>.</li>
<li>Подставить подлежащее вообще нельзя («светает», «мне холодно», «замело»)? → <strong>безличное</strong>.</li>
</ol>
<div class="box err"><b>Ловушка</b><i>Ветер сорвал крышу</i> — двусоставное (подлежащее «ветер»).<br><i>Ветр<u>ом</u> сорвало крышу</i> — безличное: «ветром» в Т.п., это не подлежащее, а глагол среднего рода «сорвало».</div>
<div class="box tip"><b>Как запомнить</b>«Я/ты/мы/вы» — определённо. «Кто-то» — неопределённо. «Никто, само» — безлично. «Только название» — назывное.</div>`,
theory2:`

/* ===================== ПОВТОРЯЮЩИЕСЯ И ДВОЙНЫЕ СОЮЗЫ ===================== */
RU.rule({
id:'g8.odnorod_soyuzy',
short:'При повторяющихся союзах (и…и, ни…ни, или…или, то…то) запятая ставится перед вторым и следующими союзами. При двойных союзах (как…так и, не только…но и) — только перед второй частью.',
theory:`
<p>Однородные члены могут соединяться не одним союзом, а «парой» или «цепочкой» союзов. Запятые здесь ставятся по простым правилам.</p>
<div class="box rule"><b>1. Повторяющиеся союзы: и…и, ни…ни, или…или, либо…либо, то…то, не то…не то</b>
Запятая ставится <strong>перед каждым союзом, кроме первого</strong>.<br>
<i>На столе лежали <u>и</u> книги<strong>,</strong> <u>и</u> тетради.</i><br>
<i><u>Ни</u> мама<strong>,</strong> <u>ни</u> папа<strong>,</strong> <u>ни</u> бабушка не знали об этом.</i><br>
<i>Он <u>то</u> смеялся<strong>,</strong> <u>то</u> плакал.</i></div>
<div class="box rule"><b>2. Двойные союзы: как…, так и; не только…, но и; хотя и…, но; не…, а</b>
Запятая только <strong>перед второй частью</strong> союза.<br>
<i><u>Как</u> взрослые<strong>,</strong> <u>так и</u> дети любят сказки.</i><br>
<i>Он знает <u>не только</u> английский<strong>,</strong> <u>но и</u> немецкий язык.</i></div>
<div class="box rule"><b>3. Одиночный союз И (ДА = и), ИЛИ</b> — запятая <strong>не нужна</strong>: <i>яблони и груши</i>.<br>
Союзы <strong>а, но, да (= но)</strong> — запятая <strong>нужна</strong>: <i>тёплый, но пасмурный</i>.</div>
<div class="box rule"><b>4. Пары</b> — если однородные соединены попарно, запятая ставится между парами: <i>коровы и козы, овцы и лошади</i>.</div>
<ol class="steps">
<li>Найди однородные члены и союзы между ними.</li>
<li>Союз повторяется (и…и, ни…ни)? Ставь запятую перед вторым, третьим… но <strong>не перед первым</strong>.</li>
<li>Союз двойной (как…так и, не только…но и)? Ставь запятую перед второй частью.</li>
<li>Это устойчивое выражение (фразеологизм)? Тогда запятая не нужна.</li>
</ol>
<div class="box err"><b>Ловушка: фразеологизмы — без запятых!</b><i>ни свет ни заря, ни рыба ни мясо, ни жив ни мёртв, ни то ни сё, и день и ночь, и смех и грех, и так и сяк</i>.<br>
<i>Мальчик встал ни свет ни заря.</i></div>
<div class="box tip"><b>Как запомнить</b>Первый союз — «открывает дверь», запятая перед ним не нужна. Каждый следующий — «новая дверь», перед ней запятая.</div>`,

short:'Обобщающее слово перед однородными членами — двоеточие; после них — тире. Если предложение продолжается после перечисления, ставим двоеточие перед ним и тире после.',
theory:`

<div class="box rule"><b>Схемы</b>
1) <strong>О: О, О, О.</strong> — обобщающее слово впереди → после него <strong>двоеточие</strong>.<br>
<i>В корзине лежали овощи<strong>:</strong> морковь, капуста и лук.</i><br>
2) <strong>О, О, О — О.</strong> — обобщающее слово после перечисления → перед ним <strong>тире</strong>.<br>
<i>Морковь, капуста и лук <strong>—</strong> всё это растёт на огороде.</i><br>
3) <strong>О: О, О, О — …</strong> — обобщающее слово впереди, а предложение после перечисления продолжается → <strong>двоеточие</strong> перед перечислением и <strong>тире</strong> после него.<br>
<i>Везде<strong>:</strong> на улицах, в парках, во дворах <strong>—</strong> лежал снег.</i></div>
<div class="box rule"><b>Слова-помощники</b>
Если после обобщающего слова стоят <strong>например, как-то, а именно</strong> — перед ними <strong>запятая</strong>, после них <strong>двоеточие</strong>:<br>
<i>Мы собирали ягоды<strong>,</strong> например<strong>:</strong> чернику, малину.</i><br>

<i>Книги, тетради, краски <strong>—</strong> словом<strong>,</strong> всё было куплено.</i></div>
<ol class="steps">

<li>Есть ли слово, которое их все называет (всё, все, везде, всюду, нигде, никто, овощи, птицы…)?</li>

</ol>

short:'Однородные определения описывают предмет с одной стороны (цвет, характер) — между ними запятая. Неоднородные описывают с разных сторон (размер и материал) — запятая не нужна.',
theory:`
<p>Когда перед существительным стоят два-три определения, надо решить: они <strong>однородные</strong> (ставим запятую) или <strong>неоднородные</strong> (запятую не ставим).</p>
<div class="box rule"><b>Однородные — запятая нужна</b>
Описывают предмет <strong>с одной стороны</strong>: все про цвет, все про характер, все про вкус. Между ними можно вставить <strong>и</strong>, все они относятся прямо к существительному.<br>
<i>красные<strong>,</strong> жёлтые<strong>,</strong> оранжевые листья</i> (всё — цвет)<br>
<i>добрый<strong>,</strong> отзывчивый человек</i> (всё — черты характера)</div>
<div class="box rule"><b>Неоднородные — запятая не нужна</b>
Описывают предмет <strong>с разных сторон</strong>: размер и материал, качество и время года. Союз «и» вставить нельзя. Первое определение относится не к одному существительному, а к сочетанию второго определения с существительным.<br>
<i>большой деревянный дом</i> (размер + материал): большой → «деревянный дом»<br>
<i>тёплый весенний день</i> (какой весенний день? — тёплый)<br>
<i>наш новый дом</i> (местоимение + прилагательное)</div>
<ol class="steps">
<li>Спроси: про что каждое определение — цвет? размер? материал? время? характер?</li>
<li>Про одно и то же → однородные → <strong>запятая</strong>.</li>
<li>Про разное → неоднородные → <strong>без запятой</strong>.</li>
<li>Проверь союзом «и»: «большой и деревянный дом» звучит странно → неоднородные; «красные и жёлтые листья» — нормально → однородные.</li>
</ol>
<div class="box tip"><b>Подсказка</b>Очень часто неоднородные — это <strong>качественное</strong> прилагательное (большой, тёплый, вкусный) + <strong>относительное</strong> (деревянный, весенний, яблочный, лесной).</div>
<div class="box err"><b>Типичная ошибка</b>Ставить запятую по привычке между любыми двумя прилагательными: «старый, каменный мост» — неверно, правильно: <i>старый каменный мост</i>.</div>`,

<div class="box ex"><b>Неоднородные</b>Торт <i>большой шоколадный</i> — один признак про размер, другой про вкус. «Большой и шоколадный» звучит странно — запятой нет.</div>
<p>Правило «полочек»: если признаки лежат на одной полочке (цвет, вкус, характер) — запятая. На разных — нет.</p>`,

short:'Причастный оборот или прилагательное с зависимыми словами после определяемого слова выделяется запятыми. Перед определяемым словом — не выделяется (кроме случая, когда определяемое слово — личное местоимение).',
theory:`
<p><strong>Обособить</strong> — значит выделить запятыми. Определения обособляются, когда они стоят «не на своём месте» — после слова, к которому относятся.</p>
<div class="box rule"><b>Главный алгоритм</b>
<ol class="steps">

</ol></div>
<div class="box rule"><b>Особые случаи</b>

<i>Усталые<strong>,</strong> мы вернулись домой. Он<strong>,</strong> взволнованный<strong>,</strong> молчал.</i><br>

<div class="box err"><b>Типичные ошибки</b>

short:'Распространённое приложение после существительного выделяется запятыми. Приложение при личном местоимении и приложение с союзом «как» (= будучи) — тоже. Одиночное приложение к нарицательному существительному пишется через дефис.',
theory:`
<p><strong>Приложение</strong> — это определение, выраженное <strong>существительным</strong>. Оно даёт предмету другое название: <i>Москва — <u>столица</u>; друг — <u>ученик</u>; город-<u>герой</u></i>.</p>

<li>Приложение с союзом <strong>как</strong>, если можно заменить «<strong>будучи</strong>» (есть оттенок причины):<br><i>Отец<strong>,</strong> как опытный врач<strong>,</strong> сразу понял причину болезни</i> (= будучи врачом, потому что врач).</li>
</ol></div>

/* ===================== ОБОСОБЛЕННЫЕ ОБСТОЯТЕЛЬСТВА ===================== */
RU.rule({
id:'g8.obos_obst',
short:'Деепричастный оборот и одиночное деепричастие выделяются запятыми, где бы они ни стояли. Обстоятельство с предлогом «несмотря на» тоже обособляется. Не выделяются фразеологизмы (сломя голову, не покладая рук) и деепричастия-наречия (молча, лёжа).',
theory:`
<p><strong>Деепричастие</strong> — «добавочное действие»: <i>шёл (как?) <u>насвистывая</u></i>. Отвечает на вопросы <i>что делая? что сделав?</i>, суффиксы <strong>-а, -я, -в, -вши, -ши</strong>.</p>
<div class="box rule"><b>Главное правило</b>
Деепричастный оборот и одиночное деепричастие <strong>всегда</strong> выделяются запятыми — в начале, в середине и в конце предложения:<br>
<i>Прочитав книгу<strong>,</strong> я вернул её.</i><br>
<i>Солнце<strong>,</strong> поднявшись над лесом<strong>,</strong> осветило поляну.</i><br>
<i>Мальчик шёл<strong>,</strong> насвистывая песенку.</i><br>
<i>Улыбаясь<strong>,</strong> девочка подошла к нам.</i></div>
<div class="box rule"><b>«Несмотря на»</b>
Обстоятельство с предлогом <strong>несмотря на</strong> обособляется: <i>Несмотря на дождь<strong>,</strong> мы пошли в поход.</i></div>
<ol class="steps">
<li>Найди слово на -а, -я, -в, -вши, отвечающее на вопрос «что делая? что сделав?».</li>
<li>Найди все слова, которые от него зависят — это оборот.</li>
<li>Поставь запятую перед оборотом и после него (если предложение не закончилось).</li>
<li>Проверь исключения: это фразеологизм или слово-наречие? Тогда без запятых.</li>
</ol>
<div class="box err"><b>Исключения — без запятых</b>
1) Фразеологизмы: <i>бежал сломя голову, работали не покладая рук, работать спустя рукава</i>.<br>
2) Деепричастия, ставшие наречиями (отвечают на вопрос «как?», означают способ): <i>Весь урок он просидел молча. Он читал лёжа.</i></div>
<div class="box err"><b>Ловушка с союзом «и»</b>
<i>Мы остановились на опушке и<strong>,</strong> немного отдохнув<strong>,</strong> пошли дальше.</i><br>
Союз «и» соединяет сказуемые «остановились» и «пошли» — перед ним запятой нет. А оборот «немного отдохнув» начинается <strong>после</strong> «и», поэтому запятая стоит после «и».</div>
<div class="box tip"><b>Как запомнить</b>Деепричастный оборот — «подарок в обёртке»: его всегда заворачивают в запятые.</div>`,
theory2:`
<p>Деепричастие — это «пока / после того как»: <i>Улыбаясь</i> = пока улыбалась. <i>Прочитав</i> = после того как прочитал.</p>
<div class="box ex"><b>Всегда в запятых</b><i>Улыбаясь<strong>,</strong> она вошла. Она вошла<strong>,</strong> улыбаясь. Она<strong>,</strong> улыбаясь<strong>,</strong> вошла.</i></div>
<p>Убери оборот — предложение останется целым: <i>Она вошла</i>. Значит, оборот — лишняя «вставка», её и отделяем.</p>
<div class="box ex"><b>Без запятых</b><i>сломя голову</i> (= очень быстро), <i>не покладая рук</i> (= усердно), <i>молча</i> (= без слов) — это уже не действие, а просто «как».</div>`,

/* ===================== УТОЧНЯЮЩИЕ ЧЛЕНЫ ===================== */
RU.rule({
id:'g8.utochn',
short:'Уточняющие члены поясняют предыдущее слово и выделяются запятыми. Особенно часто уточняют «там, здесь, тогда, туда» и присоединяются словами «то есть, или (= то есть), особенно, даже, в том числе, например, а именно».',
theory:`
<p><strong>Уточняющий член</strong> отвечает на тот же вопрос, что и слово перед ним, но говорит <strong>точнее, конкретнее</strong>. Сначала сказали «в общем», потом уточнили.</p>
<div class="box rule"><b>1. Уточнение места и времени</b>
Слова <strong>там, здесь, туда, тогда</strong> слишком общие — мы сразу уточняем:<br>
<i>Там<strong>,</strong> за рекой<strong>,</strong> начинался лес.</i> (где? там — где именно? за рекой)<br>
<i>Тогда<strong>,</strong> в далёком детстве<strong>,</strong> я мечтал стать моряком.</i></div>
<div class="box rule"><b>2. Слова-сигналы</b>
Перед словами <strong>то есть, или (= то есть), а именно, особенно, даже, в том числе, например, и особенно</strong> ставим запятую, а весь оборот выделяем:<br>
<i>Мы изучаем орфографию<strong>,</strong> то есть правописание.</i><br>
<i>Языкознание<strong>,</strong> или лингвистика<strong>,</strong> изучает язык.</i> (или = то есть, это одно и то же)<br>
<i>Все<strong>,</strong> даже малыши<strong>,</strong> помогали.</i><br>
<i>Многие животные<strong>,</strong> например медведи и ежи<strong>,</strong> зимой спят.</i> (после «например» здесь запятой нет!)</div>
<ol class="steps">
<li>Видишь общее слово (там, здесь, тогда, все) и сразу после него — более точное? → уточнение.</li>
<li>Видишь «то есть, особенно, даже, в том числе, например, а именно»? → запятая перед ним.</li>
<li>Оборот в середине — закрой его второй запятой. В конце — хватит одной.</li>
</ol>

short:'Обращение — слово, называющее того, к кому обращаются. Оно выделяется запятыми (или восклицательным знаком) вместе со всеми зависимыми словами. После частицы «о» запятая не ставится.',
theory:`
<p><strong>Обращение</strong> называет того, <strong>к кому мы говорим</strong>: <i>Мама, иди сюда!</i> Оно <strong>не член предложения</strong>. Распространённое обращение — с зависимыми словами: <i>дорогая мама, мой старый друг, уважаемые пассажиры</i>.</p>
<div class="box rule"><b>Правило</b>
Обращение (со всеми его словами) выделяется запятыми там, где стоит:<br>
в начале: <i>Дорогая мама<strong>,</strong> поздравляю тебя!</i><br>
в середине: <i>Скажи<strong>,</strong> Петя<strong>,</strong> где ты был?</i><br>
в конце: <i>Как ты живёшь<strong>,</strong> мой старый друг?</i><br>
Даже если части обращения разорваны другими словами — каждую часть выделяем: <i>Шуми, шуми<strong>,</strong> послушное ветрило<strong>,</strong> волнуйся подо мной<strong>,</strong> угрюмый океан.</i></div>
<ol class="steps">
<li>Найди, к кому обращаются (кого зовут, просят, приветствуют).</li>
<li>Присоедини все слова, которые к нему относятся (дорогой, мой, уважаемые…).</li>
<li>Поставь запятые по краям всей этой группы.</li>
</ol>
<div class="box err"><b>Ловушки</b>
1) <strong>Обращение или подлежащее?</strong> <i>Мама<strong>,</strong> иди обедать</i> (зовём маму — обращение). <i>Мама пошла в магазин</i> (говорим о маме — подлежащее, запятой нет).<br>

3) <strong>Частица «о»</strong> — запятой после неё нет: <i>О море, как ты прекрасно!</i><br>
4) <strong>Междометие «эй, ах»</strong> отделяется своей запятой: <i>Эй<strong>,</strong> ребята<strong>,</strong> идите сюда!</i></div>
<div class="box tip"><b>Как запомнить</b>Обращение — как имя на конверте: кому письмо. Всё «имя целиком» — в рамку из запятых.</div>`,

RU.rule({
id:'g8.sravn',
short:'Сравнительный оборот с союзами как, словно, будто, точно, как будто, чем выделяется запятыми. Не выделяются фразеологизмы (как из ведра), обороты в составе сказуемого и «как» в значении «в качестве».',
theory:`
<p><strong>Сравнительный оборот</strong> — это сравнение с союзом: <i>как звёзды, словно зеркало, будто белые корабли</i>.</p>
<div class="box rule"><b>Главное правило</b>
Оборот с союзами <strong>как, словно, будто, как будто, точно, чем</strong> выделяется запятыми:<br>
<i>Глаза блестели<strong>,</strong> как звёзды.</i><br>
<i>Туман<strong>,</strong> точно белое покрывало<strong>,</strong> окутал реку.</i><br>
<i>Лучше поздно<strong>,</strong> чем никогда.</i></div>
<div class="box err"><b>НЕ выделяем (без запятых)</b>
1) <strong>Фразеологизмы</strong>: <i>льёт как из ведра, побледнел как полотно, спит как убитый, знает как свои пять пальцев, сидит как на иголках</i>.<br>
2) Оборот — <strong>часть сказуемого</strong>: <i>Сад был как лес. Озеро как зеркало.</i><br>
3) <strong>«как» = «в качестве»</strong>: <i>Я говорю тебе это как друг</i> (= в качестве друга).<br>
4) Перед «как» стоят <strong>совсем, почти, точно, именно</strong>: <i>Он поступил совсем как взрослый.</i></div>
<ol class="steps">
<li>Найди союз как / словно / будто / точно / чем.</li>
<li>Это устойчивое выражение (его можно заменить одним словом: «как из ведра» = сильно)? → без запятых.</li>
<li>Без оборота сказуемое «ломается» («Сад был…»)? → без запятых.</li>
<li>«Как» можно заменить на «в качестве»? → без запятых.</li>
<li>Иначе → выделяем запятыми.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>Живое, «авторское» сравнение — в запятые. Готовое выражение, которое все знают наизусть, — без запятых.</div>`,

<p>Подсказка: если можно заменить одним словом — запятые не нужны.</p>`,

RU.rule({
id:'g8.chuzhaya_rech',
short:'Прямая речь берётся в кавычки. Четыре схемы: А: «П». — «П», — а. — «П, — а, — п». — «П, — а. — П». Цитата, включённая в предложение после «что», пишется со строчной буквы без двоеточия.',
theory:`
<p><strong>Прямая речь</strong> — чужие слова, переданные точно, как их сказали. <strong>Слова автора</strong> (а) — кто сказал и как. Прямая речь (П) — в кавычках «ёлочках».</p>
<div class="box rule"><b>Четыре схемы</b>
<strong>1) А: «П».</strong> — слова автора впереди → после них <strong>двоеточие</strong>; точка — после кавычек.<br>
<i>Мама сказала<strong>:</strong> «Пора спать»<strong>.</strong></i> Если в П вопрос или восклицание — знак внутри кавычек, а точки после нет: <i>Брат спросил: «Ты пойдёшь?»</i><br><br>
<strong>2) «П», — а.</strong> — прямая речь впереди → после неё <strong>запятая и тире</strong>; если в П «?» или «!», то запятой нет: «П?» — а. «П!» — а.<br>
<i>«Пора спать»<strong>, —</strong> сказала мама. «Ура!» — закричали дети.</i><br><br>
<strong>3) «П, — а, — п».</strong> — слова автора <strong>разрывают одно предложение</strong>. После авторских слов — <strong>запятая</strong> и тире; продолжение П — с маленькой буквы.<br>
<i>«Завтра<strong>, —</strong> сказал папа<strong>, —</strong> мы поедем на дачу».</i><br><br>
<strong>4) «П, — а. — П».</strong> — слова автора стоят <strong>между двумя предложениями</strong>. После авторских слов — <strong>точка</strong> и тире; второе предложение — с большой буквы.<br>
<i>«Я устал<strong>, —</strong> сказал брат<strong>. —</strong> Пойду спать».</i></div>
<ol class="steps">
<li>Где слова автора: впереди, сзади или посередине?</li>
<li>Впереди → «:». Сзади → «, —» (или «?» / «!» + «—»).</li>
<li>Посередине: прочитай П без слов автора. Это одно предложение (дальше маленькая буква)? → «, — а, —». Два предложения (дальше большая буква)? → «, — а. —».</li>
</ol>
<div class="box rule"><b>Косвенная речь и цитаты</b>
С союзом <strong>что</strong> (косвенная речь) — без кавычек и двоеточия, просто запятая: <i>Мама сказала<strong>,</strong> что пора спать.</i><br>
Цитата, вставленная после «что», — в кавычках, со строчной буквы: <i>Пушкин писал<strong>,</strong> что «чтение — вот лучшее учение».</i><br>
Цитата как прямая речь — по схемам выше: <i>Недаром говорится<strong>:</strong> «Без труда не выловишь и рыбку из пруда»<strong>.</strong></i></div>
<div class="box tip"><b>Как запомнить</b>Подсказка — буква после второго тире: маленькая → «запятая», большая → «точка».</div>`,

<div class="box ex"><b>Подпись впереди</b>Папа сказал<strong>:</strong> «Привет».</div>
<div class="box ex"><b>Подпись сзади</b>«Привет<strong>»,</strong> — сказал папа.</div>
<div class="box ex"><b>Подпись разрезала фразу пополам</b>«Привет<strong>,</strong> — сказал папа<strong>, —</strong> как дела?» (одна фраза → запятая)</div>

<script>/* 9 класс: сложное предложение (ССП, СПП, БСП, разные виды связи) + итоговое упражнение 9 класса */

RU.rule({
id: 'g9.ssp',
short: 'В сложносочинённом предложении (ССП) две основы соединены союзом «и», «а», «но», «да», «или», «однако», «зато»; перед союзом между частями ставится запятая.',
theory: `
<p>Сложное предложение — это предложение, в котором <b>две или больше грамматических основ</b> (подлежащее + сказуемое). Если части соединены <b>сочинительным союзом</b> (и, а, но, да, или, либо, однако, зато, то…то, не то…не то), это <b>сложносочинённое предложение</b> (ССП). Его части равноправны: каждую можно произнести как отдельное предложение.</p>
<div class="box rule"><b>Алгоритм</b>
<ol class="steps">
<li>Найди и подчеркни все <b>основы</b>: ищи сказуемое (что делает? что сделал?), к нему — подлежащее (кто? что?).</li>
<li>Посчитай основы. Одна основа — предложение простое (может быть с однородными сказуемыми). Две и больше — сложное.</li>
<li>Посмотри на союз между основами. Если это <b>и, а, но, да, или, однако, зато</b> — ставь <b>запятую перед союзом</b>.</li>
<li>Повторяющиеся союзы <b>то…то, либо…либо, не то…не то</b>: запятая ставится перед вторым (третьим…) союзом, а перед первым — нет.</li>
</ol></div>
<div class="box ex"><b>Примеры</b>
<u>Наступила</u> <u>осень</u>, и <u>птицы</u> <u>улетели</u> на юг. — две основы → запятая.<br>
<u>Мальчик</u> <u>открыл</u> окно и <u>выглянул</u> во двор. — одна основа (одно подлежащее, два сказуемых) → запятой нет.<br>
То <u>гром</u> <u>гремел</u>, то <u>сверкала</u> <u>молния</u>. — повторяющийся союз.</div>
<div class="box err"><b>Главная ловушка</b>Не путай ССП с однородными сказуемыми. «Брат взял удочку и пошёл к реке» — подлежащее одно («брат»), он и взял, и пошёл. Это простое предложение, запятой перед «и» нет. Проверка: есть ли после «и» <b>своё</b> подлежащее (или безличное сказуемое вроде «стало холодно»)?</div>
<div class="box tip"><b>Как запомнить</b>Две основы + «и/а/но» → запятая. Одна основа + «и» → без запятой. А случаи, когда при двух основах запятая перед «и» всё-таки не нужна, — в следующем правиле (общий второстепенный член).</div>`,
theory2: `
<p>Представь поезд. Каждая основа — это <b>вагон</b> со своим водителем (подлежащее) и мотором (сказуемое). Союз «и», «а», «но» — это <b>сцепка</b> между вагонами. Перед сцепкой ставим запятую.</p>
<div class="box ex"><b>Два вагона</b><u>Солнце</u> <u>светило</u>, но <u>было</u> <u>холодно</u>.</div>
<p>А если водитель один, а моторов два — это один вагон: «<u>Я</u> <u>пришёл</u> и <u>сел</u>». Запятая не нужна.</p>
<div class="box tip"><b>Вопрос самому себе</b>«После "и" начинается новое предложение со своим подлежащим?» Да → запятая. Нет → без запятой.</div>`,
items: [
 {lvl:1, text:'Наступила осень{,*|_} и птицы улетели на юг.',
  why:'Основы: <b>осень наступила</b> и <b>птицы улетели</b>. Две основы соединены союзом «и» → это ССП, перед «и» ставим запятую.',
  why2:'После «и» стоит новое подлежащее «птицы» — значит, начинается второе предложение. Его можно произнести отдельно: «Птицы улетели на юг». Поэтому нужна запятая.'},
 {lvl:1, text:'Солнце светило ярко{,*|_} но было холодно.',
  why:'Основы: <b>солнце светило</b> и <b>было холодно</b> (безличное предложение, подлежащего нет, но основа есть). Две основы + союз «но» → запятая.',
  why2:'Перед «но» запятая ставится почти всегда. Здесь «но» соединяет два целых предложения: «Солнце светило ярко» и «Было холодно».'},
 {lvl:1, text:'Мальчик открыл окно{,|_*} и выглянул во двор.',
  why:'Подлежащее одно — <b>мальчик</b>, сказуемых два: <b>открыл</b> и <b>выглянул</b>. Это простое предложение с однородными сказуемыми, одиночное «и» → запятая не нужна.',
  why2:'Кто выглянул? Тот же мальчик. Нового «водителя» после «и» нет, значит, вагон один и сцепка не нужна.'},
 {lvl:1, text:'Я позвонил другу{,*|_} а он уже ушёл.',
  why:'Основы: <b>я позвонил</b> и <b>он ушёл</b>. Две основы + союз «а» → запятая перед «а».',
  why2:'После «а» — новое подлежащее «он». Два предложения: «Я позвонил другу» и «Он уже ушёл».'},
 {lvl:1, q:'Сколько грамматических основ в предложении «Дул ветер, и шумели деревья»?', opts:['одна','две','три'], ans:1,
  why:'Основы: <b>ветер дул</b> и <b>деревья шумели</b>. Их две, поэтому предложение сложное и перед «и» стоит запятая.',
  why2:'Ищи сказуемые: «дул» и «шумели». К каждому своё подлежащее: «ветер» и «деревья». Две пары — две основы.'},
 {lvl:1, text:'Прозвенел зв{о*|а@g5.bezud}нок{,*|_} и урок начался.',
  why:'1) зв<b>о</b>нок — проверяем: зв<b>о́</b>н, зв<b>о́</b>нкий → О. 2) Основы: <b>звонок прозвенел</b> и <b>урок начался</b> → ССП, запятая перед «и».',
  why2:'1) Поставь гласную под ударение: «зво́нкий». 2) После «и» новое подлежащее «урок» — это второе предложение, нужна запятая.'},
 {lvl:2, text:'Дождь кончился{,*|_} и небо стало голубым{,|_*} и чистым.',
  why:'1) <b>Дождь кончился</b> и <b>небо стало</b> — две основы, союз «и» → запятая. 2) «голубым и чистым» — однородные части сказуемого, соединённые одиночным «и» → запятая не нужна.',
  why2:'Первое «и» сцепляет два предложения (после него новое подлежащее «небо»). Второе «и» соединяет два слова «голубым и чистым» — это как «хлеб и молоко», без запятой.'},
 {lvl:2, text:'То гром гремел{,*|_} то сверкала молния.',
  why:'Основы: <b>гром гремел</b> и <b>молния сверкала</b>. Союз повторяющийся «то… то»: запятая ставится перед вторым «то».',
  why2:'«То…то» — как качели: то одно, то другое. Между двумя «то» — запятая, перед первым «то» — ничего.'},
 {lvl:2, text:'Брат взял удочку{,|_*} и пошёл к реке{,*|_} а я остался дома.',
  why:'1) <b>Брат взял и пошёл</b> — одно подлежащее и два однородных сказуемых → перед «и» запятой нет. 2) <b>я остался</b> — новая основа после «а» → запятая перед «а».',
  why2:'Считай «водителей»: «брат» (взял, пошёл) и «я» (остался). Сцепка между ними — «а», там и запятая. Внутри «брата» запятая не нужна.'},
 {lvl:2, q:'В каком предложении перед «и» нужна запятая?', opts:['Мы собрали грибы и пошли домой.','Зазвенел звонок и ребята выбежали из класса.','Мама купила хлеб и молоко.'], ans:1,
  why:'«Зазвенел <b>звонок</b>, и <b>ребята</b> выбежали» — две основы, это ССП. В первом предложении одно подлежащее «мы» и два сказуемых, в третьем «и» соединяет дополнения «хлеб и молоко».',
  why2:'Найди, где после «и» появляется новое подлежащее. Только во втором: «ребята». Там и нужна запятая.'},
 {lvl:2, text:'Мы спешили{,*|_} но п{о*|а@g5.neprov}езд уже ушёл.',
  why:'1) Основы: <b>мы спешили</b> и <b>поезд ушёл</b>. Две основы + союз «но» → запятая. 2) п<b>о</b>езд — словарное слово, пишем О.',
  why2:'1) После «но» новое подлежащее «поезд» — второе предложение, перед «но» запятая. 2) «Поезд» проверить нельзя, запоминаем: п-О-езд.'},
 {lvl:2, text:'Ветер пр{и*|е@g6.pre_pri}тих{,*|_} и море успокоилось.',
  why:'1) пр<b>и</b>тих — приставка ПРИ- означает неполноту действия (стих не совсем, немного) → И. 2) Основы: <b>ветер притих</b> и <b>море успокоилось</b> → запятая перед «и».',
  why2:'1) «Притих» = «немного стих», как «приоткрыл», «присел» → ПРИ-. 2) После «и» — свой «водитель» «море», это второе предложение.'},
 {lvl:2, text:'Нач{нётся*|нёться@g5.tsya} лето{,*|_} и мы поедем к бабушке.',
  why:'1) Что сделает? начнётся → без Ь (в вопросе нет Ь — и в глаголе нет). 2) Основы: <b>лето начнётся</b> и <b>мы поедем</b> → запятая перед «и».',
  why2:'1) Спроси: лето что сделает? — «начнётся». 2) Два предложения: «Начнётся лето» и «Мы поедем к бабушке», между ними запятая.'},
 {lvl:3, text:'Либо ты сейчас же извинишься{,*|_} либо я с тобой больше не разговариваю.',
  why:'Основы: <b>ты извинишься</b> и <b>я не разговариваю</b>. Союз повторяющийся «либо… либо» → запятая перед вторым «либо».',
  why2:'«Либо…либо» = «или…или». Это выбор между двумя целыми предложениями, между ними запятая.'},
 {lvl:3, text:'Мы долго ждали автобус{,*|_} однако он так и не пришёл.',
  why:'Основы: <b>мы ждали</b> и <b>он не пришёл</b>. «Однако» здесь — союз (его можно заменить на «но») → запятая перед ним.',
  why2:'Подставь «но»: «Мы долго ждали автобус, но он так и не пришёл». Смысл тот же — значит, «однако» = союз, перед ним запятая.'},
 {lvl:3, text:'Ветер утих{,*|_} и над озером повис туман{,*|_} и стало тихо.',
  why:'Три основы: <b>ветер утих</b>, <b>туман повис</b>, <b>стало тихо</b>. Каждое «и» соединяет целые предложения, общего второстепенного члена нет → запятая перед каждым «и».',
  why2:'Три вагона — две сцепки. Перед каждой сцепкой «и» ставим запятую. Проверь: каждую часть можно сказать отдельно.'},
 {lvl:3, text:'Я пришёл домой{,|_*} и сел за уроки{,*|_} но мысли мои были далеко.',
  why:'1) <b>Я пришёл и сел</b> — однородные сказуемые при одном подлежащем → без запятой. 2) <b>мысли были</b> — новая основа после «но» → запятая.',
  why2:'Ловушка: первое «и» стоит рядом с запятой, которая нужна дальше. Но «пришёл и сел» — это делает один и тот же «я», значит, без запятой.'},
 {lvl:3, text:'Река, скова{нн*|н@g7.n_nn_prich}ая льдом, молчала{,*|_} а по берегу гулял ветер.',
  why:'1) скова<b>нн</b>ая — полное причастие с приставкой (с-) и зависимым словом «льдом» → НН. 2) Основы: <b>река молчала</b> и <b>ветер гулял</b>, союз «а» → запятая.',
  why2:'1) «Скованная» — от глагола «сковать», есть приставка → НН. 2) Причастный оборот уже выделен запятыми, а между двумя предложениями перед «а» — ещё одна запятая.'},
 {lvl:3, text:'Уже стемнело{,*|_} и мы{,*|_@g8.vvodnye} конечно{,*|_@g8.vvodnye} не успели дойти до дома.',
  why:'1) Основы: <b>стемнело</b> (безличное) и <b>мы не успели</b> → ССП, запятая перед «и». 2) «конечно» — вводное слово внутри второй части, выделяется запятыми с двух сторон. Оно стоит не в начале всего предложения, поэтому общим не является.',
  why2:'1) Две основы — две части, сцепка «и» → запятая. 2) «Конечно» можно выбросить: «мы не успели дойти до дома» — смысл не пострадал. Значит, слово вводное, берём его в запятые.'}
