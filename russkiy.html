/* ===================== -К- и -СК- ===================== */
RU.rule({
id: 'g6.k_sk',
short: 'Суффикс -К- пишем у прилагательных с краткой формой (низкий — низок) и у слов от основ на К, Ч, Ц (рыбак — рыбацкий, немец — немецкий). В остальных случаях — -СК- (французский, матросский).',
theory: `
<p>Слова <i>низкий</i> и <i>французский</i> звучат похоже, но пишутся по-разному. Вот как не ошибиться.</p>
<div class="box rule"><b>Пишем -К-</b>1) Если у прилагательного есть <b>краткая форма</b> (он какой? — <i>низок</i>): низ<b>к</b>ий — низок, вяз<b>к</b>ий — вязок, рез<b>к</b>ий — резок, дерз<b>к</b>ий — дерзок, близ<b>к</b>ий — близок, скольз<b>к</b>ий — скользок.<br>2) Если прилагательное образовано от слова на <b>К, Ч, Ц</b>; эти буквы тогда превращаются в <b>Ц</b>, и получается <b>-ЦК-</b>: рыба<b>к</b> → рыба<b>цк</b>ий, каза<b>к</b> → каза<b>цк</b>ий, тка<b>ч</b> → тка<b>цк</b>ий, неме<b>ц</b> → неме<b>цк</b>ий, молоде<b>ц</b> → молоде<b>цк</b>ий.</div>
<div class="box rule"><b>Пишем -СК-</b>Во всех остальных случаях (обычно у относительных прилагательных, краткой формы нет): францу<b>з</b> → француз<b>ск</b>ий, Кавка<b>з</b> → кавказ<b>ск</b>ий, матро<b>с</b> → матро<b>сск</b>ий, Сиби<b>рь</b> → сибир<b>ск</b>ий, солда<b>т</b> → солдат<b>ск</b>ий.</div>
<ol class="steps">
<li>Попробуй образовать краткую форму: «он низок» — получилось? Пиши <b>-К-</b>.</li>
<li>Не получилось? Найди исходное слово. Кончается на К, Ч, Ц? Пиши <b>-ЦК-</b>.</li>
<li>Иначе пиши <b>-СК-</b>. Если основа кончается на С, то вместе получится <b>-ССК-</b> (матро<b>сск</b>ий).</li>
</ol>
<div class="box err"><b>Исключения</b>тадж<b>икский</b>, узб<b>екский</b> — хотя основа на К, пишем <b>-КСК-</b>.</div>
<div class="box err"><b>Ловушка: Т и Д</b>Солдатский, братский, городской — на слух «цк», но в основе Т или Д (солдат, брат, город), поэтому пишем <b>-СК-</b>.</div>`,
theory2: `
<p>Задай прилагательному вопрос «<b>он какой?</b>» в краткой форме. Если отвечает коротко — «низок», «резок», «вязок», — это «короткое» слово, и суффикс у него тоже короткий: <b>-К-</b>.</p>
<p>Если краткой формы нет (нельзя сказать «он французок»), вспомни, откуда слово: рыба<b>к</b>, каза<b>к</b>, тка<b>ч</b>, неме<b>ц</b> → буква «Ц» плюс «К»: <b>-цк-</b>. Все остальные — <b>-ск-</b>.</p>
<div class="box ex"><b>Три корзинки</b>-к-: низкий, резкий, близкий<br>-цк-: рыбацкий, немецкий, ткацкий<br>-ск-: французский, кавказский, матросский</div>`,
items: [
 {lvl:1, text:'низ{к*|ск}ий потолок',
  why:'Есть краткая форма: потолок <b>низок</b> → суффикс <b>-К-</b>.',
  why2:'«Он какой? — Низок». Отвечает коротко — значит -к-.'},
 {lvl:1, text:'француз{ск*|к}ий язык',
  why:'Краткой формы нет (нельзя сказать «французок»), основа «француз» кончается на З, а не на К, Ч, Ц → <b>-СК-</b>.',
  why2:'Ни краткой формы, ни К/Ч/Ц в конце основы — пиши -ск-.'},
 {lvl:1, text:'рыба{цк*|цск}ая лодка',
  why:'Рыба<b>к</b> → основа на К, она меняется на Ц, и добавляется -К- → рыба<b>цк</b>ая.',
  why2:'Рыбак, казак, ткач, немец → у всех получается «-цк-».'},
 {lvl:1, text:'вяз{к*|ск}ая каша',
  why:'Есть краткая форма: каша <b>вязка</b> (он вязок) → <b>-К-</b>.',
  why2:'Каша какая? — Вязка. Есть краткая форма → -к-.'},
 {lvl:1, q:'Как правильно образовать прилагательное от слова <b>немец</b>?', opts:['немецкий','немецский','немеский','немечский'], ans:0,
  why:'Основа «немец» кончается на Ц → пишем <b>-ЦК-</b>: немецкий.',
  why2:'Как молоде<b>ц</b> → молоде<b>цк</b>ий, так и неме<b>ц</b> → неме<b>цк</b>ий.'},
 {lvl:2, text:'Казаки пели старинные каза{цк*|цск}ие песни и показывали удалые молоде{цк*|цск}ие забавы.',
  why:'1) каза<b>к</b> → каза<b>цк</b>ие: основа на К → <b>-ЦК-</b>. 2) молоде<b>ц</b> → молоде<b>цк</b>ие: основа на Ц → <b>-ЦК-</b>.',
  why2:'Оба слова от основ на К и Ц — третьей буквы С тут нет.'},
 {lvl:2, text:'Бабушка всю жизнь проработала на тка{цк*|чск}ой фабрике.',
  why:'Тка<b>ч</b> → основа на Ч, она меняется на Ц → тка<b>цк</b>ой.',
  why2:'Ч перед -к- превращается в Ц: ткач — ткацкий.'},
 {lvl:2, text:'Брат надел матро{сск*|ск}ую бескозырку.',
  why:'Матро<b>с</b> + суффикс <b>-СК-</b> → матро<b>сск</b>ую. Одна С от корня, вторая — из суффикса.',
  why2:'Матрос заканчивается на С, к нему прибавляем -ск- — получаем две С.'},
 {lvl:2, text:'Рез{к*|ск}ий ветер дул с кавказ{ск*|к}их гор.',
  why:'1) Ветер <b>резок</b> — есть краткая форма → <b>-К-</b>. 2) Кавказ → кавказ<b>ск</b>их: краткой формы нет, основа на З → <b>-СК-</b>.',
  why2:'«Ветер какой? — Резок» — значит -к-. А «горы кавказок» сказать нельзя — значит -ск-.'},
 {lvl:2, text:'После дождя тропинка стала скольз{к*|ск}ой и вяз{к*|ск}ой.',
  why:'1) Тропинка <b>скользка</b> и 2) <b>вязка</b> — у обоих есть краткая форма → <b>-К-</b>.',
  why2:'Оба слова отвечают коротко: «скользок», «вязок» → -к-.'},
 {lvl:2, text:'Рыбаки пол{о*|а@g5.lag_lozh}жили сети в рыба{цк*|цск}ую лодку.',
  why:'1) Корень с чередованием: перед <b>Ж</b> пишем <b>О</b> (-лож-), перед А — а (-лаг-) → полОжили. 2) рыба<b>к</b> → рыба<b>цк</b>ую.',
  why2:'«Лаг» дружит с «а», «лож» — с «ж». После корня стоит Ж → О. Рыбак → рыбацкий.'},
 {lvl:2, text:'У дороги р{о*|а@g5.rast_ros}сли низ{к*|ск}ие кусты.',
  why:'1) Перед <b>С</b> в корне -рос- пишем <b>О</b>: росли. 2) Кусты <b>низки</b> (низок) → <b>-К-</b>.',
  why2:'«Раст» и «ращ» — с буквой А, «рос» — с О. Здесь стоит С → О. Низкий — краткая форма «низок».'},
 {lvl:3, text:'Мой друг выучил несколько таджи{кск*|цк}их и узбе{кск*|цк}их слов.',
  why:'Это исключения: <b>таджикский</b>, <b>узбекский</b> — К сохраняется, и добавляется <b>-СК-</b>.',
  why2:'Таджикский и узбекский запомни как два «упрямых» слова: К у них не меняется на Ц.'},
 {lvl:3, text:'В музее показали солда{тск*|цк}ую шинель и рыба{цк*|цск}ие сети.',
  why:'1) Солда<b>т</b> — основа на Т, не на К/Ч/Ц → <b>-СК-</b>: солдатскую (хоть и слышится «цк»). 2) рыба<b>к</b> → рыба<b>цк</b>ие.',
  why2:'Т — не К, не Ч и не Ц, поэтому в «солдатский» превращения нет. А у «рыбак» на конце К → -цк-.'},
 {lvl:3, text:'Дерз{к*|ск}ий мальчишка задал учителю рез{к*|ск}ий вопрос.',
  why:'1) Мальчишка <b>дерзок</b>, 2) вопрос <b>резок</b> — у обоих есть краткая форма → <b>-К-</b>.',
  why2:'На слух «-зк-» похоже на «французский», но эти слова отвечают коротко (дерзок, резок) → -к-.'},
 {lvl:3, text:'Рез{к*|ск}ий ветер {не утихал*|неутихал@g5.ne_glagol} всю ночь.',
  why:'1) Ветер <b>резок</b> — есть краткая форма → <b>-К-</b>. 2) НЕ с глаголами пишется <b>раздельно</b>: не утихал.',
  why2:'«Ветер какой? — Резок» → -к-. Глагол и «не» — два отдельных слова (кроме слов, которых без «не» не бывает: ненавидеть).'},
 {lvl:3, text:'Учитель француз{ск*|к}ого языка терпеливо объясня{ет*|ит@g5.okonch_glag} правила.',
  why:'1) Француз → француз<b>ск</b>ого: краткой формы нет, основа на З → <b>-СК-</b>. 2) Объяснять — глагол на -ять, I спряжение → окончание <b>-ет</b>.',
  why2:'«Французский» — без краткой формы → -ск-. Объясн-ЯТЬ — не на -ить и не исключение, значит I спряжение: объясняет.'},
 {lvl:3, q:'В каком слове пишется суффикс <b>-К-</b>?', opts:['францу_ий','низ_ий','кавказ_ий','киргиз_ий'], ans:1,
  why:'Только у «низкий» есть краткая форма (низок) → -К-. Остальные: французский, кавказский, киргизский — краткой формы нет → -СК-.',
  why2:'Попробуй сказать коротко: «низок» — получается. «Французок», «кавказок» — нет.'}
]});

/* ===================== Сложные прилагательные ===================== */
RU.rule({
id: 'g6.slozh_prilag',
short: 'Сложные прилагательные пишутся через дефис, если части равноправны (русско-английский = русский и английский) или обозначают оттенок цвета (светло-зелёный); слитно — если образованы от словосочетания, где одно слово главное (железная дорога → железнодорожный).',
theory: `
<p>Сложное прилагательное — это прилагательное из двух корней: <i>железно</i> + <i>дорожный</i>, <i>русско</i> + <i>английский</i>. Пишутся они то слитно, то через дефис.</p>
<div class="box rule"><b>Через дефис</b>1) Части <b>равноправны</b>, между ними можно вставить «и»: русско-английский (русский и английский), кисло-сладкий (кислый и сладкий), научно-технический.<br>2) <b>Оттенки цвета</b>: светло-зелёный, тёмно-синий, ярко-красный, бледно-голубой.<br>3) <b>Стороны света</b>: северо-западный, юго-восточный.</div>
<div class="box rule"><b>Слитно</b>Прилагательное образовано от <b>словосочетания</b>, где одно слово зависит от другого: железная дорога → <b>железнодорожный</b>, сельское хозяйство → <b>сельскохозяйственный</b>, много этажей → <b>многоэтажный</b>, ремонт вагонов → <b>вагоноремонтный</b>, Древняя Русь → <b>древнерусский</b>, вечно зелёный → <b>вечнозелёный</b>, длинные ноги → <b>длинноногий</b>.</div>
<ol class="steps">
<li>Это цвет с оттенком или сторона света? → <b>дефис</b>.</li>
<li>Можно вставить «и» между частями? → <b>дефис</b>.</li>
<li>Можно «развернуть» в словосочетание (дорога какая? железная) → <b>слитно</b>.</li>
</ol>
<div class="box err"><b>Исключение</b><b>глухонемой</b> — части равноправны (глухой и немой), но пишется слитно.</div>
<div class="box tip"><b>Как запомнить</b>Дефис — как знак «и» или «=» между равными. Слитно — когда одно слово «держит» другое.</div>`,
theory2: `
<p>Представь двух друзей. Если они идут <b>рядом, держась за руки</b>, — между ними дефис: русско-английский (и русский, и английский). Если один <b>несёт другого на спине</b> (одно слово зависит от другого) — они слиты в одно: железнодорожный (дорога — железная).</p>
<div class="box ex"><b>Цвет — всегда дефис</b>светло-серый, тёмно-зелёный, ярко-жёлтый</div>
<div class="box ex"><b>Проверка «и»</b>кисло-сладкий → кислый <b>и</b> сладкий ✓ (дефис)<br>многоэтажный → много <b>и</b> этажный ✗ (слитно)</div>`,
items: [
 {lvl:1, text:'{светло-зелёный*|светлозелёный|светло зелёный} листок',
  why:'Обозначает <b>оттенок цвета</b> → через дефис: светло-зелёный.',
  why2:'Все «светло-», «тёмно-», «ярко-» перед цветом пишутся через дефис.'},
 {lvl:1, text:'{железнодорожный*|железно-дорожный|железно дорожный} вокзал',
  why:'Образовано от словосочетания «железная дорога» (дорога какая? железная) → <b>слитно</b>.',
  why2:'Нельзя сказать «железный и дорожный» — значит, не дефис, а слитно.'},
 {lvl:1, text:'{русско-английский*|русскоанглийский|русско английский} словарь',
  why:'Части равноправны: словарь русский <b>и</b> английский → <b>дефис</b>.',
  why2:'Вставили «и» — смысл сохранился. Значит, дефис.'},

RU.rule({

short: 'Суффикс -ЧИК- пишется после Д, Т, З, С, Ж (лётчик, переводчик, грузчик), в остальных случаях — -ЩИК- (каменщик, сварщик). После Л перед -щик- пишется Ь (кровельщик).',
theory: `
<p>Слова-профессии часто оканчиваются на <b>-чик</b> или <b>-щик</b>: лётчик, каменщик. Звучат одинаково, а пишутся по-разному. Всё решает <b>буква перед суффиксом</b>.</p>
<div class="box rule"><b>Правило</b><b>-ЧИК-</b> пишется после букв <b>Д, Т, З, С, Ж</b>: перево<b>д</b>чик, лё<b>т</b>чик, гру<b>з</b>чик, расска<b>з</b>чик, разно<b>с</b>чик, перебе<b>ж</b>чик.<br><b>-ЩИК-</b> — после всех остальных: камен<b>щ</b>ик, свар<b>щ</b>ик, барабан<b>щ</b>ик, фонар<b>щ</b>ик, убор<b>щ</b>ик.</div>
<ol class="steps">
<li>Отбрось суффикс: <i>лёт|чик</i>.</li>
<li>Посмотри на последнюю букву перед ним: <b>т</b>.</li>
<li>Это Д, Т, З, С или Ж? → <b>-чик-</b>. Другая буква → <b>-щик-</b>.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>Пять букв для -чик-: <b>Д, Т, З, С, Ж</b> — «<b>Д</b>ядя <b>Т</b>оля <b>З</b>а<b>С</b>тавил <b>Ж</b>ука» (Д-Т-З-С-Ж).</div>
<div class="box err"><b>Мягкий знак</b>Перед -щик- после <b>Л</b> пишется <b>Ь</b>: кровель<b>щ</b>ик, стеколь<b>щ</b>ик, носиль<b>щ</b>ик.</div>`,

/* ===================== -ЕК- / -ИК- ===================== */
RU.rule({
id: 'g6.ek_ik',
short: 'Если при склонении гласная в суффиксе выпадает — пишем -ЕК- (замочек — замочка), если остаётся — -ИК- (ключик — ключика).',
theory: `
<p>Суффиксы <b>-ек-</b> и <b>-ик-</b> делают слово «маленьким и ласковым»: замок → замочек, ключ → ключик. На слух они одинаковые. Чтобы не ошибиться, есть очень простой способ.</p>
<div class="box rule"><b>Правило</b>Измени слово: поставь его в родительный падеж (нет кого? чего?).<br>• Гласная <b>выпала</b> → <b>-ЕК-</b>: замоч<b>е</b>к — нет замочка, кусоч<b>е</b>к — кусочка.<br>• Гласная <b>осталась</b> → <b>-ИК-</b>: ключ<b>и</b>к — нет ключ<b>и</b>ка, нож<b>и</b>к — нож<b>и</b>ка.</div>
<ol class="steps">
<li>Скажи «нет …»: нет замочка, нет ключика.</li>
<li>Посмотри, сохранилась ли гласная в суффиксе.</li>
<li>Пропала — Е. Осталась — И.</li>
</ol>
<div class="box ex"><b>Примеры</b>-ек-: платочек (платочка), листочек (листочка), горошек (горошка), орешек (орешка)<br>-ик-: мячик (мячика), столик (столика), коврик (коврика), кузнечик (кузнечика)</div>
<div class="box tip"><b>Как запомнить</b><b>Е</b> — убЕгает (пропадает при склонении), <b>И</b> — остаётся на месте.</div>`,
theory2: `
<p>Представь, что гласная в суффиксе — это мышка. Ты «стучишь» по слову, меняя его: «нет замоч<b>к</b>а». Мышка убежала — значит, это была мышка <b>Е</b>. А в слове «нет ключ<b>и</b>ка» мышка не испугалась и сидит на месте — это мышка <b>И</b>.</p>
<div class="box ex"><b>Попробуй сам</b>кусоч_к → нет кусочка (убежала) → кусоч<b>е</b>к<br>нож_к → нет ножика (сидит) → нож<b>и</b>к</div>`,
items: [
 {lvl:1, text:'замоч{е*|и}к',
  why:'Нет (чего?) замочка — гласная <b>выпала</b> → <b>-ЕК-</b>.',
  why2:'Мышка убежала → Е.'},
 {lvl:1, text:'ключ{и*|е}к',
  why:'Нет (чего?) ключика — гласная <b>осталась</b> → <b>-ИК-</b>.',
  why2:'«Ключ-И-ка» — мышка на месте → И.'},
 {lvl:1, text:'кусоч{е*|и}к',
  why:'Нет кусочка — гласная <b>выпала</b> → <b>-ЕК-</b>.',
  why2:'В «кусочка» гласной между Ч и К нет — значит, Е.'},
 {lvl:1, text:'нож{и*|е}к',

<li>Скажи «я…» с этим глаголом: я рисую / я рассказываю.</li>

 {lvl:3, text:'Мне было {не с кем*|ни с кем|не скем@g6.mestoim_ne_ni} поговорить {кое о чём*|кое-о чём|о кое-чём@g6.mestoim_defis}.',
  why:'1) нЕ с кем — ударение на НЕ → <b>НЕ</b>, с предлогом в три слова. 2) кое о чём — предлог между «кое» и «чём» → <b>без дефиса</b>, три слова.',
  why2:'Громкое НЕ — пишем НЕ. Предлог «о» вклинился — сцепки-дефиса нет.'},
 {lvl:3, text:'В {железнодорожном*|железно-дорожном|железно дорожном@g6.slozh_prilag} музее хранились оловя{нн*|н@g6.n_nn_prilag}ые фигурки и пр{е*|и@g6.pre_pri}красные модели паровозов.',
  why:'1) железнодорожный — от «железная дорога» → <b>слитно</b>. 2) оловянный — исключение → <b>НН</b>. 3) прекрасные = очень красивые → <b>ПРЕ-</b>.',
  why2:'Одно слово «держит» другое — слитно. Оловянный из «троицы» исключений. ПРЕ = «очень»: прекрасный — очень красивый.'},
 {lvl:3, text:'Наш город основан более {трёхсот*|трёхста|трёхсотен@g6.chislit} лет назад на р{о*|а@g6.mak_mok}вном берегу реки.',

  why2:'Три → трёх, сто → сот: трёхсот. Ровный (гладкий) — с О; равный (одинаковый) — с А.'},
 {lvl:3, text:'Ветре{н*|нн@g6.n_nn_prilag}ым утром каза{цк*|цск@g6.k_sk}ий отряд пр{и*|е@g6.pre_pri}был в станицу.',
  why:'1) ветреный — исключение → одна <b>Н</b>. 2) каза<b>к</b> → основа на К → <b>-ЦК-</b>. 3) прибыл — приближение (прибытие) → <b>ПРИ-</b>.',
  why2:'Ветреный — единственное -ен- с одной Н. Казак → казацкий. Прибыл = приехал → ПРИ.'},
 {lvl:3, text:'Фильм оказался без{ы*|и@g6.y_i_pristavki}нтересным, и н{и*|е@g6.mestoim_ne_ni}кто не досмотрел его до конца.',

  why2:'Слышим «безЫнтересный» — пишем Ы. НикТО — тихая приставка → НИ.'},
 {lvl:3, text:'Этот плащ не пром{о*|а@g6.mak_mok}кает, поэтому дождя можно не боя{ться*|тся@g5.tsya}.',
  why:'1) промокать — пропускать воду, становиться мокрым → корень <b>-мок-</b>, пишем <b>О</b>. 2) можно (что делать?) не бояться — в вопросе есть Ь → <b>-ться</b>.',
  why2:'Плащ не становится мокрым → «мок». «Что делать?» с Ь — и глагол с Ь.'},
 {lvl:3, text:'Пусть {кто-нибудь*|кто нибудь|ктонибудь@g6.mestoim_defis} пол{о*|а@g5.lag_lozh}жит на стол льня{н*|нн@g6.n_nn_prilag}ую скатерть.',
  why:'1) кто-нибудь — через <b>дефис</b>. 2) перед <b>Ж</b> в корне -лож- → <b>О</b>. 3) лён → льн<b>ян</b>ую: суффикс -ЯН- → одна <b>Н</b>.',

<script>/* 7 класс: причастие и деепричастие */

/* ===================== Причастный оборот: запятые ===================== */
RU.rule({
id: 'g7.prich_oborot',
short: 'Причастный оборот выделяется запятыми, если стоит после слова, к которому относится. Если оборот стоит перед этим словом, запятые не нужны.',
theory: `
<div class="box rule"><b>Что такое причастный оборот</b>Это причастие вместе со словами, которые от него зависят: <i>покрытая <u>снегом</u></i>, <i>сидевший <u>у окна</u></i>, <i>подаренная <u>мне бабушкой</u></i>. Оборот отвечает на вопрос <b>какой?</b> и относится к существительному. Это существительное называют <b>определяемым словом</b>.</div>
<ol class="steps">
<li>Найди причастие: это признак по действию (<i>бегущий, упавший, покрытый</i>).</li>
<li>Найди слово, к которому оно относится. Задай от него вопрос: <i>река (какая?) покрытая льдом</i>.</li>
<li>Найди границы оборота: это причастие и все слова, которые от него зависят. Зависимые слова могут стоять и <b>перед</b> причастием: <i>дом, <u>до самой крыши</u> заросший плющом</i>.</li>
<li>Посмотри на порядок слов. Оборот <b>после</b> определяемого слова — ставь запятые. Оборот <b>перед</b> определяемым словом — запятые не нужны.</li>
</ol>
<div class="box ex"><b>Примеры</b>
Река<strong>,</strong> покрытая льдом<strong>,</strong> блестела. — оборот после слова, в середине предложения: две запятые.<br>
Мы подошли к реке<strong>,</strong> покрытой льдом. — оборот после слова, в конце предложения: одна запятая, дальше точка.<br>
Покрытая льдом река блестела. — оборот перед словом: запятых нет.</div>
<div class="box rule"><b>Два оборота подряд</b>Если два оборота соединены союзом <b>и</b>, запятой между ними нет: <i>тропинка, петлявшая между деревьями и уходившая к реке</i>.<br>Если союза нет, между ними запятая: <i>тропинка, петлявшая между деревьями, уходившая к реке</i>.</div>
<div class="box tip"><b>Как запомнить</b>Оборот после слова — это «вставка», которую можно вынуть, и смысл не сломается: <i>Река (покрытая льдом) блестела</i>. Вставку огораживаем запятыми с двух сторон. Если оборот в конце, вторую «стенку» заменяет точка.</div>
<div class="box err"><b>Ловушки</b>
1) Краткое причастие — это сказуемое, а не оборот: <i>Река покрыта льдом.</i> Запятой нет.<br>
2) Закрывай оборот запятой, даже если после него идёт «и»: <i>на облака, плывущие по небу, и на птиц</i>. Здесь «и» соединяет не обороты, а слова «облака» и «птиц».<br>
3) Если оборот относится к <b>личному местоимению</b> (я, ты, он, мы…), его выделяют всегда, даже когда он стоит впереди: <i>Уставший после дороги, он уснул.</i><br>
4) Одно причастие без зависимых слов перед существительным — это не оборот: <i>шумящая река</i>.</div>`,
theory2: `
<p>Представь поезд. Существительное — это паровоз, а причастный оборот — вагоны.</p>
<div class="box tip"><b>Вагоны сзади</b>Если вагоны едут <b>за</b> паровозом (оборот после слова), между ними нужна сцепка — запятая. А если поезд ещё не закончился и дальше идут слова, в конце вагонов тоже ставим запятую.<br><i>Мальчик<strong>,</strong> сидевший у окна<strong>,</strong> читал книгу.</i></div>
<div class="box tip"><b>Вагоны впереди</b>Если оборот стоит <b>перед</b> паровозом, он как будто приклеен к нему. Запятые не нужны.<br><i>Сидевший у окна мальчик читал книгу.</i></div>
<div class="box ex"><b>Проверь себя вопросом</b>«Где паровоз — до вагонов или после?»<br>Книга<strong>,</strong> лежащая на столе<strong>,</strong> — моя. → паровоз «книга» впереди → запятые.<br>Лежащая на столе книга — моя. → паровоз сзади → запятых нет.</div>`,
items: [
 {lvl:1, text:'Листья{,*|_} упавшие на дор{о*|а@g5.neprov}жку{,*|_} шуршали под ногами.',
  why:'1) «Упавшие на дорожку» — причастный оборот. Он относится к слову «листья» (листья какие? упавшие на дорожку) и стоит <b>после</b> него → запятая перед оборотом. 2) Оборот закончился, дальше идёт сказуемое «шуршали» → запятая после оборота. 3) Дор<b>о</b>жка — от слова «дорога», это словарное слово: в нём пишется О, его нужно запомнить.',
  why2:'Попробуй вынуть оборот: «Листья (упавшие на дорожку) шуршали под ногами» — смысл не сломался, значит, это вставка, и её огораживаем запятыми с двух сторон. «Дорога» и «дорожка» — одно семейство, в словаре: д<b>о</b>рога.'},
 {lvl:1, text:'Упавшие на дорожку{,|_*} листья{,|_*} шуршали под ногами.',
  why:'Оборот «упавшие на дорожку» стоит <b>перед</b> словом «листья», к которому относится. Оборот перед определяемым словом запятыми не выделяется. Поэтому запятой нет ни после «дорожку», ни после «листья».',
  why2:'Сравни с предложением «Листья, упавшие на дорожку, шуршали». Там «паровоз» (листья) впереди, а оборот-вагоны сзади — нужна сцепка. Здесь оборот впереди, он «приклеен» к слову — запятые не нужны.'},
 {lvl:1, text:'Мы подошли к реке{,*|_} покрытой тонким льдом.',
  why:'«Покрытой тонким льдом» — причастный оборот, относится к слову «реке» (к реке какой?) и стоит после него → перед оборотом запятая. Оборот в конце предложения, поэтому вторую запятую заменяет точка.',
  why2:'Оборот после слова — всегда в «рамке» из знаков. Левая стенка — запятая перед «покрытой», правая — точка в конце.'},
 {lvl:1, text:'Мальчик{,*|_} сидевший у окна{,*|_} читал книгу.',
  why:'Оборот «сидевший у окна» относится к слову «мальчик» (какой?) и стоит после него, в середине предложения → выделяем запятыми с двух сторон: перед «сидевший» и после «окна».',
  why2:'Проверка: «Мальчик (сидевший у окна) читал книгу». Без вставки остаётся «Мальчик читал книгу» — всё понятно. Вставку огораживаем двумя запятыми.'},
 {lvl:1, text:'Ребята{,*|_} гулявшие в с{а*|о@g5.bezud}ду{,*|_} вернулись домой.',
  why:'1) «Гулявшие в саду» — оборот после слова «ребята» (какие?) → запятая перед ним. 2) После оборота идёт сказуемое «вернулись» → запятая закрывает оборот. 3) С<b>а</b>ду — проверочное слово «с<b>а́</b>д», под ударением А.',
  why2:'Ребята — «паровоз», «гулявшие в саду» — вагоны за ним: две сцепки-запятые. Чтобы проверить гласную, сделай её ударной: в саду́ → са́д.'},
 {lvl:1, q:'В каком предложении причастный оборот нужно выделить запятыми? (Запятые не расставлены.)',
  opts:['Покрытая снегом поляна сверкала.','Поляна покрытая снегом сверкала.','Поляна покрыта снегом.','Снег покрыл поляну.'], ans:1,
  why:'В предложении «Поляна, покрытая снегом, сверкала» оборот стоит после слова «поляна» → его выделяют. В первом предложении оборот стоит перед словом — запятых нет. В третьем «покрыта» — краткое причастие, это сказуемое, а не оборот. В четвёртом причастия нет.',
  why2:'Ищи сначала оборот, потом смотри, где «паровоз». Только во втором предложении слово «поляна» стоит раньше оборота.'},
 {lvl:2, text:'Солнце{,*|_} поднявшееся над л{е*|и@g5.bezud}сами{,*|_} осветило поляну{,*|_} усыпанную цветами.',
  why:'В предложении два оборота. 1) «Поднявшееся над лесами» — после слова «солнце» → запятая перед ним. 2) Он закрывается запятой перед сказуемым «осветило». 3) «Усыпанную цветами» — после слова «поляну» (какую?) → запятая перед ним; он в конце предложения, дальше точка. 4) Л<b>е</b>сами — проверочное слово «л<b>е́</b>с».',
  why2:'Найди оба «паровоза»: солнце и поляну. За каждым едут вагоны-обороты, поэтому перед каждым оборотом ставим сцепку. Первый оборот в середине — его ещё и закрываем. «Лесами» проверяем словом «лес».'},
 {lvl:2, text:'Мы шли по тр{о*|а@g5.bezud}пинке{,*|_} петлявшей между деревьями{,|_*} и уходившей к реке.',
  why:'1) Тр<b>о</b>пинка — проверочное слово «тр<b>о́</b>пы». 2) Обороты «петлявшей между деревьями» и «уходившей к реке» стоят после слова «тропинке» → перед первым оборотом запятая. 3) Два оборота соединены союзом <b>и</b> — это однородные определения, между ними запятой нет.',
  why2:'Два оборота с «и» — как два вагона одного поезда, сцепленные союзом. Сцепка-запятая нужна только между паровозом (тропинкой) и первым вагоном. Тропинка — тропа — тро́пы.'},
 {lvl:2, text:'Нам каже{тся*|ться@g5.tsya}, что ветер{,*|_} дувший с моря{,*|_} стал сильнее.',
  why:'1) Нам (что делает?) кажется — в вопросе нет Ь, значит, и в глаголе пишем <b>-тся</b>. 2) «Дувший с моря» — оборот после слова «ветер» → запятая перед ним. 3) Оборот закрываем запятой перед сказуемым «стал». Запятая перед «что» уже стоит — она отделяет придаточную часть.',
  why2:'Ветер (какой?) дувший с моря — вставка в середине придаточной части, её огораживаем двумя запятыми. А для «кажется» спроси: что делает? — без Ь.'},
 {lvl:2, q:'В каком предложении есть причастный оборот, который нужно выделить запятыми? (Запятые не расставлены.)',
  opts:['Озеро покрыто тонким льдом.','Покрытое тонким льдом озеро блестело.','Озеро покрытое тонким льдом блестело на солнце.','Лёд покрыл озеро ещё в ноябре.'], ans:2,
  why:'Только в третьем предложении оборот «покрытое тонким льдом» стоит после слова «озеро» → «Озеро, покрытое тонким льдом, блестело на солнце». В первом «покрыто» — краткое причастие, оно работает сказуемым. Во втором оборот стоит перед словом. В четвёртом причастия нет.',
  why2:'Краткое причастие (покрыт, покрыта, покрыто) — не оборот, а сказуемое: «Озеро покрыто» — как «озеро блестит». Оборот — только полная форма: покрытое, покрытый.'},
 {lvl:2, text:'Дети{,*|_} игравшие во дворе{,*|_} не заметили, как стемнело.',
  why:'Оборот «игравшие во дворе» относится к слову «дети» и стоит после него → запятая перед «игравшие». Оборот закончился перед сказуемым «не заметили» → закрываем запятой. Запятая перед «как» отделяет придаточную часть, она уже стоит.',
  why2:'Убери вставку: «Дети не заметили, как стемнело» — предложение целое. Значит, «игравшие во дворе» — вставка, её берём в запятые.'},
 {lvl:2, text:'Книга{,*|_} пр{и*|е@g6.pre_pri}сланная мне бабушкой{,*|_} стоит на полке.',
  why:'1) Пр<b>и</b>сланная — приставка ПРИ- значит приближение: книгу прислали, то есть она пришла к нам. 2) Оборот «присланная мне бабушкой» стоит после слова «книга» → запятая перед ним. 3) Оборот закрываем запятой перед сказуемым «стоит».',
  why2:'ПРИ- = «приблизить, присоединить» (прислать, прийти, пришить). Книга — «паровоз», оборот — вагоны за ним, в середине предложения → две запятые.'},
 {lvl:3, text:'Я долго смотрел на облака{,*|_} плывущие по небу{,*|_} и на птиц{,*|_} летавших над ними.',
  why:'1) «Плывущие по небу» — оборот после слова «облака» → запятая перед ним. 2) Оборот нужно закрыть, хотя дальше идёт «и»: союз «и» соединяет не два оборота, а слова «на облака» и «на птиц». 3) «Летавших над ними» — оборот после слова «птиц» → запятая перед ним, в конце точка.',
  why2:'Спроси себя: что соединяет «и»? Смотрел на что? — на облака и на птиц. Значит, первый оборот — вставка внутри части «на облака», и её надо закрыть запятой, а «и» здесь ни при чём.'},
 {lvl:3, text:'Мы увидели старый дом{,*|_} до самой крыши заросший плющом{,|_*} и окружённый высоким забором.',
  why:'1) Оборот начинается не с причастия, а с зависимых слов: заросший (до чего?) до самой крыши. Поэтому запятая ставится после слова «дом», перед «до». 2) Обороты «до самой крыши заросший плющом» и «окружённый высоким забором» соединены союзом <b>и</b> → между ними запятой нет.',
  why2:'Граница оборота — там, где начинаются слова, зависящие от причастия. Задай вопрос: заросший до чего? — до крыши. Значит, «до самой крыши» — тоже часть оборота. Сцепку ставим перед всеми вагонами.'},
 {lvl:3, text:'Освещённая луной{,|_*} дорога{,*|_} уходившая к реке{,*|_} была пустынна.',
  why:'1) «Освещённая луной» стоит перед словом «дорога» → запятых нет. 2) «Уходившая к реке» стоит после слова «дорога» → выделяем запятыми с двух сторон: перед «уходившая» и перед сказуемым «была».',
  why2:'У одного паровоза «дорога» два оборота: один впереди (приклеен, без запятых), другой сзади (вагоны со сцепкой). Порядок слов решает всё.'},

/* ============ Гласные в суффиксах действительных причастий ============ */
RU.rule({
id: 'g7.prich_suff_dejstv',
short: 'В действительных причастиях настоящего времени пишем -УЩ-/-ЮЩ- от глаголов I спряжения и -АЩ-/-ЯЩ- от глаголов II спряжения. Перед -ВШ- пишем ту же гласную, что перед -ТЬ в неопределённой форме.',
theory: `
<div class="box rule"><b>Настоящее время: -ущ-/-ющ- или -ащ-/-ящ-</b>Всё зависит от <b>спряжения</b> глагола (это правило 5 класса).<br>
I спряжение → <b>-ущ-, -ющ-</b>: пишут → пиш<b>у</b>щий, тают → та<b>ю</b>щий.<br>
II спряжение → <b>-ащ-, -ящ-</b>: кричат → крич<b>а</b>щий, строят → стро<b>я</b>щий.</div>
<ol class="steps">
<li>Найди глагол, от которого образовано причастие: <i>строящий ← строить</i>.</li>
<li>Поставь глагол в форму «они» (что делают?): <i>они стро<b>я</b>т</i>.</li>
<li>Самый простой способ: убери -т и прибавь -щий. Стро<b>я</b>-т → стро<b>я</b>-щий, пиш<b>у</b>-т → пиш<b>у</b>-щий, кол<b>ю</b>-т → кол<b>ю</b>-щий.</li>
<li>Если окончание в форме «они» безударное и ты не уверен, определи спряжение по неопределённой форме: на -ить (кроме брить, стелить) — II; глаголы-исключения гнать, держать, дышать, слышать, видеть, ненавидеть, зависеть, терпеть, обидеть, вертеть, смотреть — тоже II; остальные — I.</li>
</ol>
<div class="box rule"><b>Прошедшее время: перед -вш-</b>Перед суффиксом <b>-вш-</b> пишется та же гласная, что перед <b>-ть</b> в неопределённой форме:<br>
посе<b>я</b>ть → посе<b>я</b>вший, закле<b>и</b>ть → закле<b>и</b>вший, обид<b>е</b>ть → обид<b>е</b>вший, услыш<b>а</b>ть → услыш<b>а</b>вший.</div>
<div class="box ex"><b>Примеры</b>гонят (гнать — исключение II спр.) → гон<b>я</b>щий; дышат → дыш<b>а</b>щий; зависят → завис<b>я</b>щий; борются (бороться, I спр.) → бор<b>ю</b>щийся; колеблются → колебл<b>ю</b>щийся; стелются (стелить — исключение I спр.) → стел<b>ю</b>щийся.</div>
<div class="box err"><b>Ловушка: тающий и таящий</b>Это разные глаголы!<br><b>та́ять</b> (снег) — I спр.: они тают → та<b>ю</b>щий снег.<br><b>таи́ть</b> (обиду, секрет) — II спр.: они таят → та<b>я</b>щий обиду.<br>Так же: клеить → клеят → кле<b>я</b>щий, но сеять → сеют → се<b>ю</b>щий.</div>
<div class="box tip"><b>Как запомнить</b>Причастие «помнит» глагол в форме «они». Как глагол звучит в «они …ут/…ют», так и пиши: …ущий/…ющий. «Они …ат/…ят» → …ащий/…ящий.</div>`,
theory2: `
<p>Причастие — это глагол, который надел костюм прилагательного. Но характер у него остался глагольный: суффикс он берёт из формы «<b>они</b>».</p>
<div class="box tip"><b>Фокус с буквой Т</b>Скажи «они …», убери последнюю букву <b>т</b> и прибавь <b>щий</b>:<br>они пишу(т) → пишу<b>щий</b><br>они крича(т) → крича<b>щий</b><br>они стелю(т) → стелю<b>щийся</b></div>
<div class="box tip"><b>Для прошедшего времени</b>Причастие на -вший — зеркало неопределённой формы. Закрой «ть» и поставь «вший»: засе<b>я</b>|ть → засе<b>я</b>вший, кле<b>и</b>|ть → кле<b>и</b>вший.</div>`,

/* ============ Гласные в суффиксах страдательных причастий ============ */
RU.rule({
id: 'g7.prich_suff_strad',
short: 'В страдательных причастиях настоящего времени пишем -ЕМ- от глаголов I спряжения и -ИМ- от глаголов II спряжения.',
theory: `
<div class="box rule"><b>Правило</b>Страдательное причастие настоящего времени обозначает предмет, над которым совершается действие: <i>читаемая (кем-то) книга, любимый (кем-то) город</i>.<br>
I спряжение → <b>-ем-</b>: мы чита<b>ем</b> → чита<b>ем</b>ый.<br>
II спряжение → <b>-им-</b>: мы люб<b>им</b> → люб<b>им</b>ый.</div>
<ol class="steps">
<li>Найди глагол: <i>колеблемый ← колебать</i>.</li>
<li>Поставь его в форму «<b>мы</b>»: <i>мы колебл<b>ем</b></i>.</li>
<li>Прибавь окончание прилагательного: колебл<b>ем</b> + ый → колебл<b>ем</b>ый.</li>
<li>Если окончание «мы» безударное, проверь спряжение по неопределённой форме (как в 5 классе): на -ить и исключения (гнать, держать, дышать, слышать, видеть, ненавидеть, зависеть, терпеть, обидеть, вертеть, смотреть) — II спряжение, -им-. Остальные — I спряжение, -ем-.</li>
</ol>
<div class="box ex"><b>Примеры</b>уважать → уважаем → уважа<b>е</b>мый; хранить → храним → хран<b>и</b>мый; гнать → гоним → гон<b>и</b>мый; слышать → слышим → слыш<b>и</b>мый; видеть → видим → вид<b>и</b>мый.</div>
<div class="box err"><b>Ловушки</b>
<b>колебать</b> → колеблем → колебл<b>е</b>мый (I спр.);<br>
<b>сеять</b> → сеем → се<b>е</b>мый; <b>лелеять</b> → лелеем → леле<b>е</b>мый (I спр.);<br>
<b>таить</b> → таим → та<b>и</b>мый (II спр.).</div>
<div class="box tip"><b>Как запомнить</b>Действительные причастия смотрят на форму «они», а страдательные — на форму «<b>мы</b>»: мы читаем → читаемый, мы любим → любимый.</div>`,
theory2: `

<div class="box ex"><b>Слушай эхо</b>
Мы уважа<b>ем</b> учителя → уважа<b>ем</b>ый учитель.<br>
Мы хран<b>им</b> письмо → хран<b>им</b>ое письмо.<br>
Мы гон<b>им</b> мяч → гон<b>им</b>ый мяч.</div>
<div class="box tip"><b>Если не слышно</b>Окончание безударное? Вспомни спряжение по неопределённой форме: -ить и исключения → <b>и</b>; остальные → <b>е</b>.</div>`,

/* ========== Н и НН в причастиях и отглагольных прилагательных ========== */
RU.rule({
id: 'g7.n_nn_prich',
short: 'НН пишется, если есть приставка (кроме НЕ-), зависимое слово, суффикс -ОВА-/-ЕВА- или глагол совершенного вида. Если ничего этого нет — это отглагольное прилагательное, пишем одну Н. В кратких причастиях — всегда одна Н.',
theory: `
<div class="box rule"><b>Причастие или отглагольное прилагательное?</b>Слова <i>жареный</i> и <i>зажаренный</i> оба образованы от глагола. Но первое — <b>отглагольное прилагательное</b> (просто признак: какая картошка? жареная), а второе — <b>причастие</b> (признак по действию: её зажарили). В причастиях — <b>НН</b>, в отглагольных прилагательных — <b>Н</b>.</div>
<div class="box rule"><b>Четыре признака НН</b>Пиши <b>НН</b>, если есть хотя бы один признак:
<ol class="steps">
<li><strong>Приставка</strong> (кроме не-): <i>жареный → <u>за</u>жаренный, кошеный → <u>с</u>кошенный</i>.</li>

 {lvl:2, text:'{Невысокий*|Не высокий@g6.ne_prilag} забор окружал {нескошенный*|не скошенный} луг.',
  why:'1) Невысокий — прилагательное, нет противопоставления, можно заменить синонимом «низкий» → НЕ <b>слитно</b>. 2) Нескошенный — полное причастие без зависимых слов → <b>слитно</b>.',
  why2:'Прилагательное: «невысокий = низкий» — значит, вместе. Причастие: гостей нет — тоже вместе.'},
 {lvl:2, text:'Мы {не заметили*|незаметили@g5.ne_glagol} {незапертую*|не запертую} калитку.',
  why:'1) Не заметили — глагол, с глаголами НЕ пишется <b>раздельно</b>. 2) Незапертую — полное причастие без зависимых слов → <b>слитно</b>.',
  why2:'Глагол и полное причастие ведут себя по-разному: с глаголом не всегда отдельно, с одиноким полным причастием — вместе.'},
 {lvl:2, text:'{Незатихающий*|Не затихающий} ветер шумел в л{е*|и@g5.bezud}су.',
  why:'1) Незатихающий — полное причастие без зависимых слов → <b>слитно</b>. 2) В л<b>е</b>су — проверочное слово «л<b>е́</b>с».',
  why2:'Ветер какой? Незатихающий — одинокое причастие, вместе. «Лесу» проверяем коротким словом «лес».'},
 {lvl:2, text:'{Непрочитанное*|Не прочитанное} письмо лежало на деревя{нн*|н@g6.n_nn_prilag}ом столе.',
  why:'1) Непрочитанное — полное причастие без зависимых слов → <b>слитно</b>. 2) Деревянный — слово-исключение (стеклянный, оловянный, деревянный): пишется с <b>НН</b>, хотя суффикс -ян-.',
  why2:'Письмо одинокое, без гостей — не вместе. Деревянный — из «стеклянно-оловянно-деревянной» тройки исключений.'},
 {lvl:3, text:'Он был человеком, {ненавидящим*|не навидящим} ложь.',
  why:'Слово «навидящий» без не не употребляется (ненавидеть). Такие причастия пишутся с НЕ <b>слитно</b> всегда, даже при зависимом слове «ложь».',
  why2:'Попробуй убрать не: «навидящий» — такого слова нет. Значит, не — часть слова, её не отделить.'},
 {lvl:3, text:'На столе лежала {не законченная*|незаконченная}, а только начатая работа.',
  why:'Есть <b>противопоставление</b> с союзом а: не законченная, а начатая → НЕ пишется <b>раздельно</b>.',
  why2:'Когда мы говорим «не то, а это», не отрицает и отделяется: не законченная, а начатая.'},
 {lvl:3, text:'Тайна старого замка так и осталась до конца {не раскрытой*|нераскрытой}.',
  why:'Есть зависимое слово: раскрытой (до какой степени?) <b>до конца</b> → <b>раздельно</b>. Причастие здесь полное (раскрытой — какой?), поэтому решают именно зависимые слова.',
  why2:'Найди гостей: «до конца» относится к причастию. Значит, не отходит.'},
 {lvl:3, text:'Дверь была {не заперта*|незаперта}, и в {незапертую*|не запертую} квартиру легко мог войти кто угодно.',
  why:'1) Заперта — <b>краткое</b> причастие → <b>раздельно</b>. 2) Незапертую — <b>полное</b> причастие без зависимых слов → <b>слитно</b>.',
  why2:'Одно слово — две формы. Краткая (заперта) ведёт себя как глагол — отдельно. Полная без гостей — вместе.'},
 {lvl:3, text:'{Не распустившиеся*|Нераспустившиеся} за ночь бутоны раскрою{тся*|ться@g5.tsya} к обеду.',
  why:'1) Есть зависимое слово: распустившиеся (когда?) <b>за ночь</b> → НЕ <b>раздельно</b>. 2) Бутоны (что сделают?) раскроются — в вопросе нет Ь → пишем <b>-тся</b>.',
  why2:'Гость «за ночь» — не отходит. А для глагола спроси: что сделают? — без Ь, значит, и в слове -тся.'},
 {lvl:3, q:'В каком сочетании НЕ пишется <b>слитно</b>?',
  opts:['(не)проверенные учителем тетради','тетради (не)проверены','(не)проверенные тетради','(не)проверенные, а только собранные тетради'], ans:2,
  why:'«Непроверенные тетради» — полное причастие без зависимых слов → слитно. В первом есть зависимое слово «учителем», во втором — краткое причастие, в четвёртом — противопоставление: везде раздельно.',
  why2:'Проверь три «стоп-сигнала»: зависимые слова, краткая форма, противопоставление. Только в третьем варианте нет ни одного.'}
]});

/* ===== Деепричастный оборот и одиночное деепричастие: запятые ===== */
RU.rule({
id: 'g7.deeprich_oborot',
short: 'Деепричастный оборот и одиночное деепричастие выделяются запятыми всегда, в любом месте предложения. Не выделяются деепричастия, ставшие наречиями (молча, лёжа), и устойчивые выражения (сломя голову).',
theory: `
<div class="box rule"><b>Что такое деепричастие</b>Это добавочное действие к главному. Вопросы: <b>что делая? что сделав?</b> <i>Мальчик шёл (что делая?) <u>насвистывая</u>.</i> Деепричастие со своими зависимыми словами — <b>деепричастный оборот</b>: <i>прочитав книгу, глядя в окно</i>.</div>
<div class="box rule"><b>Правило</b>Деепричастный оборот и одиночное деепричастие выделяются запятыми <b>всегда</b> — в начале, в середине и в конце предложения.<br>
<i>Прочитав книгу<strong>,</strong> мальчик уснул.</i><br>
<i>Мальчик<strong>,</strong> прочитав книгу<strong>,</strong> уснул.</i><br>
<i>Мальчик уснул<strong>,</strong> прочитав книгу.</i><br>
<i>Улыбнувшись<strong>,</strong> девочка открыла дверь.</i></div>
<ol class="steps">
<li>Найди деепричастие (что делая? что сделав?).</li>
<li>Найди его границы — все слова, которые от него зависят.</li>
<li>Поставь запятые по краям оборота. Если оборот в начале — только после него, если в конце — только перед ним.</li>
</ol>
<div class="box rule"><b>Особые случаи</b>
1) Два оборота соединены союзом <b>и</b> — между ними запятой нет: <i>Закончив уроки и пообедав<strong>,</strong> он пошёл гулять.</i><br>
2) Оборот стоит после союза (и, но, что) — запятая отделяет его и от союза: <i>Он хотел сказать<strong>,</strong> но<strong>,</strong> подумав<strong>,</strong> промолчал.</i> <i>Я знал<strong>,</strong> что<strong>,</strong> вернувшись<strong>,</strong> он позвонит.</i><br>
3) Не путай оборот с однородными сказуемыми: <i>Собака бежала<strong>,</strong> виляя хвостом<strong>,</strong> и лаяла.</i> Запятая после «хвостом» закрывает оборот.</div>
<div class="box err"><b>Не выделяются</b>
1) Слова, которые стали <b>наречиями</b>: <i>молча, лёжа, стоя, сидя, шутя, нехотя</i>. <i>Он молча кивнул. Читать лёжа вредно.</i><br>
2) <b>Фразеологизмы</b>: <i>бежать сломя голову, работать спустя рукава, трудиться не покладая рук</i>.<br>
3) Предлог <b>благодаря</b> (благодаря чему?): <i>Благодаря помощи друга я решил задачу.</i> Это не деепричастие.</div>
<div class="box tip"><b>Как запомнить</b>Деепричастный оборот — как «рассказ в скобках» о том, как совершалось главное действие. Скобки здесь — запятые, и они нужны всегда.</div>`,
theory2: `
<p>Представь главное действие как поезд, который едет, а деепричастный оборот — как пассажира, который говорит «кстати…». Его всегда отделяют паузой, а на письме — запятыми.</p>
<div class="box ex"><b>Три места — одно правило</b>
<i>Вернувшись домой<strong>,</strong> Артём сел за уроки.</i><br>
<i>Артём<strong>,</strong> вернувшись домой<strong>,</strong> сел за уроки.</i><br>
<i>Артём сел за уроки<strong>,</strong> вернувшись домой.</i></div>
<div class="box tip"><b>Проверка «как?»</b>Если слово отвечает просто на вопрос «как?» и его можно заменить наречием (молча = безмолвно, лёжа = в лежачем положении, сломя голову = очень быстро) — запятые не нужны.</div>`,
items: [
 {lvl:1, text:'Прочитав книгу{,*|_} мальчик поставил её на полку.',
  why:'«Прочитав книгу» — деепричастный оборот (что сделав?). Он стоит в начале предложения → запятая после него.',
  why2:'Добавочное действие (прочитав) отделяем от главного (поставил) запятой.'},
 {lvl:1, text:'Мальчик{,*|_} прочитав книгу{,*|_} поставил её на полку.',
  why:'Оборот «прочитав книгу» стоит в середине, между подлежащим и сказуемым → выделяем запятыми с двух сторон.',
  why2:'Убери оборот: «Мальчик поставил её на полку» — всё понятно. Значит, оборот — вставка, ей нужны две запятые.'},
 {lvl:1, text:'Птицы летели над полем{,*|_} громко крича.',
  why:'«Громко крича» — деепричастный оборот (что делая?) в конце предложения → запятая перед ним.',
  why2:'Птицы летели (как? что делая?) — громко крича. Оборот в конце: одна запятая, дальше точка.'},
 {lvl:1, text:'Улыбнувшись{,*|_} девочка открыла дверь.',

  why2:'Даже одно деепричастие — это «добавочное действие», его отделяем запятой.'},
 {lvl:1, text:'Пр{и*|е@g6.pre_pri}ехав в город{,*|_} мы сразу пошли в музей.',
  why:'1) Пр<b>и</b>ехав — приставка ПРИ- в значении приближения (приехать = прибыть). 2) «Приехав в город» — деепричастный оборот в начале → запятая после него.',
  why2:'ПРИ- = «приблизиться»: приехать, прийти. Оборот (что сделав?) отделяем от главного действия «пошли».'},
 {lvl:1, q:'Какое слово в предложении «Ребята шли по лесу, напевая песню» — деепричастие?',
  opts:['шли','напевая','песню','лесу'], ans:1,
  why:'«Напевая» отвечает на вопрос «что делая?» и обозначает добавочное действие → это деепричастие. «Шли» — глагол-сказуемое.',
  why2:'Главное действие — «шли», а «напевая» — то, что ребята делали «попутно».'},
 {lvl:2, text:'Собака бежала{,*|_} виляя хв{о*|а@g5.bezud}стом{,*|_} и радостно лаяла.',
  why:'1) «Виляя хвостом» — деепричастный оборот → запятая перед ним. 2) После оборота идёт «и лаяла» — второе сказуемое. Оборот нужно закрыть запятой. 3) Хв<b>о</b>стом — проверочное слово «хв<b>о́</b>ст».',
  why2:'Союз «и» соединяет сказуемые «бежала» и «лаяла». Оборот — вставка между ними, его огораживаем с двух сторон. Хвостом → хвост.'},
 {lvl:2, text:'Ученики{,*|_} закончив работу{,*|_} сдали тетради учителю.',
  why:'Оборот «закончив работу» стоит в середине предложения → запятые с двух сторон.',
  why2:'Ученики (что сделали?) сдали тетради; (что сделав?) закончив работу — вставка, в запятые.'},
 {lvl:2, text:'Мы шли по лесу{,*|_} собирая грибы{,|_*} и ягоды.',

  why2:'Оборот — это всё, что зависит от «собирая»: собирая что? грибы и ягоды. Внутри оборота «грибы и ягоды» соединены союзом и — без запятой.'},
 {lvl:2, text:'Отдохнув{,*|_} туристы пошли дальше{,*|_} напевая весёлую песню.',
  why:'1) «Отдохнув» — одиночное деепричастие в начале → запятая после него. 2) «Напевая весёлую песню» — деепричастный оборот в конце → запятая перед ним.',
  why2:'Два добавочных действия: одно «до» главного (отдохнув), другое «во время» (напевая). Оба отделяем запятыми.'},
 {lvl:2, text:'Вернувшись домой{,*|_} брат начал собира{ться*|тся@g5.tsya} в поход.',

  why2:'Оборот отделяем от главного действия. Для глагола: «что делать?» — с Ь, значит, собираться.'},
 {lvl:2, text:'Заг{о*|а@g6.gar_gor}рев за лето{,*|_} ребята вернулись в город.',
  why:'1) Заг<b>о</b>рев: в корне -гар-/-гор- без ударения пишется О. 2) «Загорев за лето» — деепричастный оборот в начале → запятая после него.',
  why2:'Корень -гор- без ударения — всегда О (загореть, загорелый). Оборот (что сделав?) отделяем запятой.'},
 {lvl:2, text:'Под{ъ*|ь@g5.razd_znaki}ехав к дому{,*|_} отец посигналил.',
  why:'1) Под<b>ъ</b>ехав: после приставки на согласную (под-) перед е пишется разделительный <b>Ъ</b>. 2) «Подъехав к дому» — оборот в начале → запятая после него.',
  why2:'Ъ стоит на стыке приставки и корня: под|ъ|ехать. Оборот — отдельное действие, отделяем запятой.'},
 {lvl:3, text:'Закончив уроки{,|_*} и пообедав{,*|_} Артём пошёл гулять.',
  why:'«Закончив уроки» и «пообедав» — однородные деепричастные обороты, соединённые союзом <b>и</b> → между ними запятой нет. После всей группы — запятая перед «Артём».',
  why2:'Два «добавочных действия» сцеплены союзом и в одну группу. Запятой отделяем только всю группу от главного действия.'},

  why2:'Убери деепричастие: «…но промолчал» — смысл цел. Значит, «подумав» — вставка, и её огораживают даже от союза.'},
 {lvl:3, text:'Я знал, что{,*|_} вернувшись домой{,*|_} брат сразу позвонит.',
  why:'Оборот «вернувшись домой» стоит в придаточной части сразу после союза «что». Его выделяют с двух сторон: запятая после «что» и после «домой».',
  why2:'Проверка: «Я знал, что брат сразу позвонит» — без оборота всё понятно. Вставку огораживаем запятыми, даже если она прижалась к союзу.'},
 {lvl:3, text:'Мальчик бежал{,|_*} сломя голову.',
  why:'«Сломя голову» — фразеологизм (= очень быстро). Устойчивые выражения с деепричастием запятыми не выделяются.',
  why2:'Замени одним словом: бежал сломя голову = бежал очень быстро. Это не добавочное действие, а просто «как?» — запятая не нужна.'},
 {lvl:3, text:'Мастера работали{,|_*} не покладая рук.',
  why:'«Не покладая рук» — фразеологизм (= усердно, без отдыха). Запятыми не выделяется.',
  why2:'Работали как? Усердно. Целое выражение равно одному наречию — запятых нет.'},
 {lvl:3, text:'Дедушка{,|_*} молча{,|_*} кивнул и{,*|_} надев шапку{,*|_} вышел на улицу.',

  why2:'Ищи настоящее добавочное действие (что сделав?). Оно есть только в третьем предложении.'}

/* ========================= НЕ с деепричастиями ========================= */
RU.rule({
id: 'g7.ne_deeprich',
short: 'НЕ с деепричастиями пишется раздельно (не зная, не сказав). Слитно — только если без НЕ слово не употребляется (негодуя, ненавидя, недоумевая).',
theory: `
<div class="box rule"><b>Правило</b>НЕ с деепричастиями пишется <b>раздельно</b>, как с глаголами: <i>не знать → не зная, не сказать → не сказав, не глядеть → не глядя</i>.<br>
<b>Слитно</b> — только если без не слово не употребляется: <i>негодуя (негодовать), ненавидя (ненавидеть), недоумевая (недоумевать)</i>.</div>
<ol class="steps">
<li>Убедись, что это деепричастие (что делая? что сделав?).</li>
<li>Попробуй убрать не. Слово существует (зная, сказав, глядя)? → <b>раздельно</b>.</li>
<li>Слова без не нет (годуя, навидя, доумевая)? → <b>слитно</b>.</li>
</ol>

<script>/* 7 класс, часть 2: наречие, служебные части речи, междометия + итоговое упражнение 7 класса */

/* ===================== НЕ С НАРЕЧИЯМИ ===================== */
RU.rule({

short:'НЕ с наречиями на -О и -Е пишется слитно, если без НЕ слово не употребляется или его можно заменить синонимом без НЕ (невесело = грустно). Раздельно — если есть противопоставление с союзом А или слова «далеко не», «вовсе не», «ничуть не», «нисколько не», «отнюдь не».',
theory:`
<p>Наречия на <b>-о</b> и <b>-е</b> (весело, громко, уверенно) ведут себя с НЕ <b>точно так же, как прилагательные</b>, от которых они образованы. Если ты помнишь «НЕ с прилагательными» из 6 класса — ты уже почти всё знаешь.</p>
<div class="box rule"><b>Слитно (НЕ — часть слова)</b>
1) без НЕ слово не живёт: <i>небрежно, нелепо, неряшливо, нечаянно</i>;<br>
2) можно подобрать синоним без НЕ: <i>невесело = грустно, недалеко = близко, неуверенно = робко, негромко = тихо</i>;<br>
3) рядом стоят слова «очень», «весьма», «крайне»: <i>очень неудачно</i>.</div>
<div class="box rule"><b>Раздельно (НЕ — отдельная частица)</b>
1) есть противопоставление с союзом <b>А</b>: <i>не весело, а грустно</i>;<br>
2) отрицание усилено словами <b>далеко не, вовсе не, ничуть не, нисколько не, отнюдь не</b>: <i>ничуть не страшно</i>;<br>
3) наречие не на -о/-е: <i>не по-дружески, не сегодня, не вдруг</i> (но если без НЕ слово не употребляется — слитно: <i>неподалёку, невзначай</i>).</div>
<ol class="steps">
<li>Наречие оканчивается на -о / -е? Если нет (не по-дружески, не здесь) — пиши раздельно. Исключение — слова, которые без НЕ не живут: неподалёку, невзначай (слитно).</li>
<li>Посмотри, нет ли в предложении «…, а …» (противопоставления). Есть — раздельно.</li>
<li>Нет ли перед НЕ слов «далеко», «вовсе», «ничуть», «нисколько», «отнюдь»? Есть — раздельно.</li>
<li>Иначе попробуй убрать НЕ. Слово исчезает (брежно?) — слитно. Подбирается синоним (неглубоко = мелко) — слитно.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>«А» и «ничуть» отрывают НЕ от слова. Нет их — НЕ приклеивается.</div>
<div class="box err"><b>Ловушка</b>Союз <b>но</b> — это не противопоставление признаков: <i>жили небогато, но дружно</i> — слитно. Раздельно только с союзом <b>а</b>: <i>жили не богато, а бедно</i>.</div>
<div class="box ex"><b>Примеры</b>Он ответил <u>неуверенно</u> (= робко). — Он ответил <u>не уверенно, а робко</u>. — Мне <u>нисколько не страшно</u>. — Он поступил <u>не по-товарищески</u>.</div>`,
theory2:`
<p>Представь, что НЕ — это магнит. Сам по себе он прилипает к наречию: <b>невесело</b>, <b>недалеко</b>, <b>неглубоко</b>.</p>
<p>Но есть «отрыватели», которые отклеивают магнит:</p>
<ul><li>союз <b>А</b>: <i>не весело, а скучно</i>;</li><li>слова-усилители <b>ничуть, нисколько, вовсе, далеко, отнюдь</b>: <i>ничуть не весело</i>.</li></ul>
<p>Если «отрывателей» нет — пиши вместе. Проверка: можешь сказать одним словом без НЕ? <i>Невысоко = низко</i> — значит, вместе.</p>`,

  why2:'Задай себе вопрос: «Как ответил?» — «Робко». Одно слово без НЕ подошло — значит, НЕ приклеено к слову: <b>неуверенно</b>.'},

  why2:'«Нисколько» усиливает именно отрицание «не»: нисколько НЕ. А отрицание — это отдельная частица, поэтому <b>нисколько не страшно</b>.'},

/* ===================== Н И НН В НАРЕЧИЯХ ===================== */
RU.rule({
id:'g7.n_nn_narech',
short:'В наречиях на -О и -Е пишется столько Н, сколько в прилагательном или причастии, от которого наречие образовано: туманный → туманно, ветреный → ветрено.',
theory:`
<p>Хорошая новость: в этом правиле ничего нового учить не надо. Наречие <b>берёт Н или НН у своего «родителя»</b> — прилагательного или причастия.</p>
<div class="box rule"><b>Правило</b>Сколько Н в прилагательном (причастии), столько и в наречии на -о / -е.</div>
<ol class="steps">
<li>Отбрось у наречия -о: <i>тума..о → тума..</i></li>
<li>Образуй прилагательное «какой?»: <i>туманный</i>.</li>
<li>Вспомни, сколько Н в прилагательном (правило 6 класса): туман + -н- = <b>НН</b>.</li>
<li>Столько же пиши в наречии: <b>туманно</b>.</li>
</ol>
<div class="box ex"><b>Примеры</b>
<b>НН:</b> туманно (туманный), торжественно (торжественный), уверенно (уверенный), растерянно (растерянный), удивлённо (удивлённый), организованно (организованный), неожиданно, нечаянно (неожиданный, нечаянный).<br>
<b>Н:</b> ветрено (ветреный), путано (путаный), рьяно (рьяный), юно (юный).</div>
<div class="box tip"><b>Как запомнить</b>Наречие — «ребёнок» прилагательного. Сколько Н у мамы, столько и у ребёнка.</div>
<div class="box err"><b>Ловушки</b>«Ветреный» — с одной Н (как и «ветрено»), хотя «безветренный» — с двумя.<br>«Неожиданно, нечаянно» — с двумя Н: прилагательные «неожиданный, нечаянный» — исключения, которые пишутся с НН.</div>`,

<p>Это как фамилия: сын носит фамилию отца. Наречие «носит» столько Н, сколько у его прилагательного.</p>
<p>Спроси: «Какой?» — и прислушайся к прилагательному.</p>
<ul><li>Тума<b>нн</b>о ← тума<b>нн</b>ый день.</li><li>Ветре<b>н</b>о ← ветре<b>н</b>ый день.</li><li>Увере<b>нн</b>о ← увере<b>нн</b>ый ответ.</li></ul>`,

  why:'1) «Ветрено» ← <b>ветреный</b> → одна Н. 2) «Организованно» ← <b>организованный</b>: суффикс <b>-ОВАНН-</b> → НН.',

theory:`
<p>Наречия на -о / -е после шипящих (<b>ж, ш, ч, щ</b>) проверяются одним вопросом: <b>падает ли ударение на последний слог?</b></p>

<ol class="steps">
<li>Найди наречие, которое кончается на шипящую + гласная: <i>горяч_, певуч_</i>.</li>
<li>Произнеси его вслух и найди ударение.</li>
<li>Ударение на конце — пиши О (горячо́). Ударение раньше — пиши Е (певу́че).</li>
</ol>
<div class="box tip"><b>Как запомнить</b>«Ударный О — хорошо́! Без удара — Е, как в слове певу́че».</div>

/* ===================== О И А НА КОНЦЕ НАРЕЧИЙ ===================== */
RU.rule({
id:'g7.o_a_narech',
short:'Наречия с приставками ИЗ-, ДО-, С- оканчиваются на А (издавна, докрасна, справа); с приставками В-, НА-, ЗА- — на О (влево, направо, засветло).',
theory:`
<p>Многие наречия сделаны так: <b>приставка + краткое прилагательное</b>. Например, с + прав(ый) = <i>справа</i>, на + лев(ый) = <i>налево</i>. Какая буква будет на конце — решает <b>приставка</b>.</p>
<div class="box rule"><b>Правило</b>Приставки <b>ИЗ- (ИС-), ДО-, С-</b> → на конце <b>А</b>: издавна, изредка, искоса, докрасна, добела, допоздна, справа, слева, снова, сначала.<br>
Приставки <b>В-, НА-, ЗА-</b> → на конце <b>О</b>: влево, вправо, направо, налево, наглухо, начисто, насухо, заново, засветло, затемно, задолго.</div>
<ol class="steps">
<li>Найди приставку в наречии: <u>до</u>бел_, <u>на</u>лев_.</li>
<li>ИЗ, ДО, С — пиши А. В, НА, ЗА — пиши О.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>«<b>ИЗДОС</b> — на А» (из-до-с). «<b>ВНАЗА</b> — на О» (в-на-за). Можно представить: «Из дома — С АнкА!» и «В НАЗАд — нО!».</div>
<div class="box err"><b>Ловушка</b>Не путай по звуку: в конце безударная гласная, на слух А и О звучат одинаково. Смотри только на приставку!</div>`,
theory2:`
<p>У приставок есть «любимые» буквы на конце слова.</p>
<p><b>ИЗ, ДО, С</b> любят <b>А</b>: с-прав-<b>а</b>, до-сух-<b>а</b>, из-редк-<b>а</b>.</p>
<p><b>В, НА, ЗА</b> любят <b>О</b>: на-лев-<b>о</b>, за-светл-<b>о</b>, в-прав-<b>о</b>.</p>
<p>Сравни пару: <i>справ<b>а</b></i> (с-) — <i>направ<b>о</b></i> (на-). Корень один, приставки разные — и концы разные.</p>`,

 {lvl:1,text:'Эту песню поют издавн{а*|о}.',

 {lvl:2,text:'Бабушка отстирала скатерть добел{а*|о}.',

 {lvl:2,text:'Он переписал сочинение занов{о*|а}.',

  why:'1) <b>ИЗ-</b>редк-а → А. 2) <b>ЗА-</b>долг-о → О.',

  why2:'Вспомни «ИЗДОС — на А». Из этих вариантов в «издос» входит только ИЗ.'},
 {lvl:3,q:'В каком наречии на конце пишется <b>О</b>?',
  opts:['изредк..','справ..','засветл..','добел..'],ans:2,
  why:'«Засветло» — приставка <b>ЗА-</b> → О. Остальные: ИЗредка, Справа, ДОбела — с А.',

 {lvl:2,text:'Отойди налев{о*|а} и {спрячься*|спрячся@g6.mz_povelit} за дерево.',

/* ===================== Ь ПОСЛЕ ШИПЯЩИХ НА КОНЦЕ НАРЕЧИЙ ===================== */

theory:`

RU.rule({
id:'g7.defis_narech',
short:'Дефис пишется в наречиях с приставкой ПО- на -ОМУ, -ЕМУ, -СКИ, -ЬИ (по-новому, по-дружески, по-лисьи), с ВО-/В- на -ЫХ, -ИХ (во-первых), с КОЕ-, -ТО, -ЛИБО, -НИБУДЬ и в повторах (чуть-чуть, давным-давно).',
theory:`
<div class="box rule"><b>Через дефис пишутся наречия</b>
1) <b>ПО- + -ому / -ему / -ски / -цки / -ьи</b>: по-новому, по-моему, по-дружески, по-английски, по-лисьи, по-кошачьи;<br>
2) <b>В- / ВО- + -ых / -их</b> (от порядковых числительных): во-первых, во-вторых, в-третьих;<br>
3) с <b>кое-, -то, -либо, -нибудь</b>: кое-где, кое-как, где-то, когда-нибудь;<br>
4) <b>повторы</b> слов: еле-еле, чуть-чуть, давным-давно, крепко-накрепко, точь-в-точь.</div>
<ol class="steps">
<li>Это наречие (отвечает на «как? где? когда?»)? Или предлог + прилагательное/местоимение при существительном?</li>
<li>Если есть существительное, к которому относится слово (по летнему <u>лесу</u>, по моему <u>мнению</u>) — это НЕ наречие, пиши <b>раздельно</b>.</li>
<li>Если это наречие — сверь с четырьмя случаями выше.</li>
</ol>
<div class="box err"><b>Ловушки</b>
<i>по-моему</i> (наречие) — но <i>по моему мнению</i> (есть существительное);<br>
<i>одеты по-летнему</i> — но <i>гуляли по летнему лесу</i>;<br>
<i>впервые</i> — слитно! Окончание -ые, а не -ых;<br>
<i>поровну, понемногу, попросту</i> — слитно (нет суффиксов -ому, -ски).</div>
<div class="box tip"><b>Как запомнить</b>Дефис — «мостик» между ПО- и -ОМУ/-СКИ. Нет нужного конца — нет мостика.</div>`,
theory2:`
<p>Дефис — как скрепка, которая скрепляет части наречия.</p>
<ul><li>Говорить как? <b>по-русски</b>, <b>по-дружески</b>, <b>по-новому</b> — скрепка нужна.</li>
<li>Считаем пункты: <b>во-первых, во-вторых</b> — скрепка нужна.</li>
<li>Слово повторяется: <b>чуть-чуть, еле-еле</b> — скрепка нужна.</li></ul>
<p>Но если после слова стоит существительное (по <b>моему мнению</b>, по <b>летнему лесу</b>) — это уже не наречие, скрепка не нужна.</p>`,

/* ===================== СЛИТНОЕ И РАЗДЕЛЬНОЕ НАПИСАНИЕ НАРЕЧИЙ ===================== */
RU.rule({
id:'g7.slitno_narech',
short:'Наречия, образованные из предлога и прилагательного, числительного или наречия, обычно пишутся слитно (вдвоём, вдали, наконец). Если между предлогом и словом есть или можно вставить зависимое слово (в начале урока), — это предлог с существительным, пишется раздельно. Многие сочетания с существительными пишутся раздельно по словарю: без умолку, на ходу, с разбегу.',
theory:`
<p>Главный вопрос: перед тобой <b>одно слово-наречие</b> или <b>предлог + существительное</b>?</p>
<div class="box rule"><b>Слитно</b>— наречия, которые отвечают на вопросы «как? где? когда? куда?», а зависимых слов у них нет: <i>вверх, вниз, вдали, вначале, сначала, наконец, наверху, вовремя, вдвоём, втроём, вдребезги, вплотную</i>.</div>
<div class="box rule"><b>Раздельно</b>1) если есть зависимое слово или определение — это существительное с предлогом: <i>в начале <u>урока</u>, на конец <u>верёвки</u>, с начала <u>года</u></i>;<br>
2) словарные сочетания предлога с существительным: <i>без умолку, без устали, на ходу, на бегу, с разбегу, под мышкой, до свидания</i>.</div>
<ol class="steps">
<li>Задай вопрос к слову. «Когда? где? как?» — похоже на наречие.</li>
<li>Посмотри, есть ли после слова зависимое существительное (в начале <i>чего?</i> урока). Есть — <b>раздельно</b>.</li>
<li>Можно ли вставить между предлогом и словом прилагательное (в самом начале)? Можно — <b>раздельно</b>.</li>
<li>Сочетаний «без умолку, на ходу, с разбегу» немного — их запоминаем.</li>
</ol>
<div class="box ex"><b>Пары</b><i>Вначале было трудно.</i> — <i>В начале урока…</i><br><i>Наконец пришла весна.</i> — <i>Привяжи груз на конец верёвки.</i><br><i>Сначала подумай.</i> — <i>С начала года…</i></div>
<div class="box tip"><b>Как запомнить</b>Наречие «одиночка»: оно не тянет за собой слов. Тянет «чего?» — значит, это существительное, и предлог отдельно.</div>`,
theory2:`
<p>Представь поезд. Наречие — это одиночный вагончик: <b>вначале</b>, <b>наконец</b>. Он едет сам.</p>
<p>А если к слову прицеплен ещё вагон (<i>в начале <b>урока</b></i>, <i>на конец <b>верёвки</b></i>) — это уже существительное, и предлог стоит отдельно.</p>
<p>И несколько «упрямых» пар всегда пишутся отдельно: <b>без умолку, на ходу, с разбегу</b>.</p>`,

 {lvl:3,text:'Мальчик привязал камешек {на конец*|наконец} верёвки.',

  why2:'Можно вставить слово: на <i>самый</i> конец верёвки. Если вставляется — пишем раздельно.'},

  why:'1) <b>Сначала</b> (= сперва) — наречие, зависимых слов нет → слитно. 2) С начала (<b>чего?</b>) года — предлог + существительное → раздельно.',
  why2:'Тот же звук — разные слова. Есть «чего?» — раздельно, нет — слитно.'},
 {lvl:3,text:'Чашка разбилась {вдребезги*|в дребезги}, а шкаф придвинули {вплотную*|в плотную} к стене.',
  why:'1) <b>Вдребезги</b> — наречие, пишется слитно. 2) <b>Вплотную</b> — наречие из предлога и полного прилагательного → слитно.',
  why2:'Ни «дребезги», ни «плотную» не употребляются здесь как отдельные слова со своим вопросом. Это цельные наречия «как?» — пишем вместе.'},
 {lvl:3,q:'В каком предложении выделенное пишется <b>раздельно</b>?',
  opts:['(В)начале фильма герой уезжает.','(В)начале было скучно.','(На)конец пришла весна.','(В)дали шумел лес.'],ans:0,
  why:'«В начале (чего?) фильма» — есть зависимое слово → раздельно. Остальные — наречия: вначале, наконец, вдали.',
  why2:'Ищи предложение, где после слова стоит существительное «чего?». Это «фильма».'},
 {lvl:1,text:'{Наконец*|На конец} наступила в{е*|и@g5.bezud}сна.',
  why:'1) <b>Наконец</b> — наречие → слитно. 2) в_сна — безударная гласная в корне, проверка: <b>вёсны</b> → Е.',
  why2:'1) На конец чего? — не спросишь, значит, наречие. 2) Измени число: вёсны — в корне Е (ё).'},
 {lvl:2,text:'Мы {вдвоём*|в двоём} быстро реш{и*|е@g5.okonch_glag}м эту задачу.',
  why:'1) <b>Вдвоём</b> — наречие от собирательного числительного → слитно. 2) Решить — глагол на <b>-ИТЬ</b>, II спряжение → окончание <b>-ИМ</b>: решим.',
  why2:'1) Как решим? Вдвоём — слитно. 2) Неопределённая форма «решить» (на -ить) → II спряжение, в нём окончания с И: решишь, решим.'},
 {lvl:2,text:'Дети болтали {без умолку*|безумолку}, и н{и*|е@g6.mestoim_ne_ni}кто не слышал звонка.',
  why:'1) <b>Без умолку</b> — раздельно по словарю. 2) В отрицательном местоимении без ударения пишется <b>НИ</b>: никто́ (ударение не на приставке).',
  why2:'1) «Упрямец» без умолку — в два слова. 2) Под ударением — НЕ (не́кого), без ударения — НИ (никто́).'},
 {lvl:3,text:'Мальчик {с разбегу*|сразбегу} прыгнул в {бассейн*|басейн@g5.dvoyn}.',
  why:'1) <b>С разбегу</b> — раздельно по словарю. 2) «Бассейн» — словарное слово с <b>двойной С</b>.',
  why2:'1) Внутри — существительное «разбег», пишем раздельно. 2) Запомни: ба<b>сс</b>ейн — две С.'},
 {lvl:3,text:'{Вдали*|В дали} показалась {деревянная*|деревяная@g6.n_nn_prilag} церковь.',

  why2:'1) Где? Вдали = далеко — слитно. 2) Суффикс -ян- обычно с одной Н (серебряный), но три слова-исключения — стеклянный, оловянный, деревянный — с НН.'}

/* ===================== ПРОИЗВОДНЫЕ ПРЕДЛОГИ ===================== */
RU.rule({
id:'g7.predlogi',
short:'Производные предлоги ввиду, вследствие, несмотря на, насчёт пишутся слитно; в течение, в продолжение, в заключение, в виде — раздельно и с Е на конце. Не путай их с существительными и деепричастиями: в течении реки, в следствии по делу, имей в виду, не смотря по сторонам.',
theory:`
<p>Производные предлоги «родились» из других слов: <i>в течение</i> — из существительного «течение», <i>несмотря на</i> — из деепричастия «смотря». Поэтому их легко спутать с «родителями».</p>
<div class="box rule"><b>Пишутся слитно</b><b>ввиду</b> (= из-за), <b>вследствие</b> (= из-за), <b>несмотря на</b> (= хотя), <b>насчёт</b> (= о), вместо, вроде, наподобие.</div>
<div class="box rule"><b>Пишутся раздельно, на конце Е</b><b>в течение</b> (часа — время), <b>в продолжение</b> (урока — время), <b>в заключение</b> (= в конце), в виде, в связи.</div>
<div class="box ex"><b>Предлог или «родитель»?</b>
<i>в течение часа</i> (время) — <i>в нижнем течении реки</i> (где? поток реки);<br>
<i>вследствие дождя</i> (= из-за) — <i>роль в следствии по делу</i> (расследование);<br>
<i>ввиду непогоды</i> (= из-за) — <i>имей в виду</i>;<br>
<i>несмотря на дождь</i> (= хотя шёл дождь) — <i>шёл, не смотря под ноги</i> (= не глядя);<br>
<i>спросил насчёт урока</i> (= об уроке) — <i>перевели на счёт в банке</i>.</div>
<ol class="steps">
<li>Попробуй заменить слово простым предлогом: «из-за», «о», «во время», «хотя».</li>
<li>Заменилось — это предлог: ввиду, вследствие, насчёт, несмотря на — слитно; в течение, в продолжение — раздельно с Е.</li>
<li>Не заменилось, слово имеет своё значение (течение реки, следствие по делу, смотреть глазами) — это существительное или деепричастие.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>Предлоги времени «в течениЕ, в продолжениЕ» кончаются на Е — как «врЕмЕ». «ВследствиЕ» тоже на Е.</div>`,
theory2:`
<p>Попробуй «волшебную замену»:</p>
<ul><li>Если вместо слова можно сказать <b>«из-за»</b> — пиши <b>ввиду</b>, <b>вследствие</b> (слитно).</li>
<li>Если можно сказать <b>«во время»</b> — пиши <b>в течение</b> (раздельно, на конце Е).</li>
<li>Если можно сказать <b>«хотя»</b> — пиши <b>несмотря на</b> (слитно).</li>
<li>Если можно сказать <b>«о»</b> — пиши <b>насчёт</b> (слитно).</li></ul>
<p>Не заменяется? Значит, это обычное слово: течение реки, имей в виду, не смотря в окно.</p>`,
items:[
 {lvl:1,text:'Мы гуляли {в течение*|в течении|втечение} часа.',
  why:'«В течение часа» = <b>во время</b> часа — это предлог времени. Пишется <b>раздельно</b>, на конце <b>Е</b>.',
  why2:'Обозначает время? Да (сколько гуляли — час). Предлог времени «в течение» — в два слова, на конце Е.'},
 {lvl:1,text:'{Вследствие*|В следствие|Вследствии} дождя матч отменили.',
  why:'«Вследствие дождя» = <b>из-за</b> дождя — производный предлог. Пишется <b>слитно</b>, на конце <b>Е</b>.',
  why2:'Замени на «из-за»: «Из-за дождя матч отменили». Подходит — значит, предлог «вследствие», одним словом.'},
 {lvl:1,text:'{Несмотря*|Не смотря} на дождь, мы пошли гулять.',
  why:'«Несмотря на дождь» = <b>хотя</b> шёл дождь — производный предлог. Пишется <b>слитно</b>.',
  why2:'Здесь никто ни на что не «смотрит» глазами. Значение «вопреки, хотя» — это предлог, пишем слитно.'},
 {lvl:1,text:'{Ввиду*|В виду} плохой погоды экскурсию перенесли.',
  why:'«Ввиду погоды» = <b>из-за</b> погоды — производный предлог → <b>слитно</b>.',
  why2:'Подставь «из-за»: «Из-за плохой погоды…». Подходит — значит, предлог «ввиду», одно слово.'},
 {lvl:1,text:'Он спросил {насчёт*|на счёт} домашнего задания.',
  why:'«Насчёт задания» = <b>о</b> задании — производный предлог → <b>слитно</b>.',
  why2:'Замени: «спросил о домашнем задании». Подходит — значит, «насчёт», одним словом.'},
 {lvl:2,text:'В нижнем {течении*|течение} реки много порогов.',
  why:'Здесь «течение» — <b>существительное</b> (поток реки), а не предлог времени. У него есть определение «нижнем». В предложном падеже: в (чём?) течени<b>и</b>.',
  why2:'Это не «во время», а место: где? в нижнем течении. Существительное, склоняется как «в здании» — окончание И.'},
 {lvl:2,text:'Он шёл, {не смотря*|несмотря} под ноги.',
  why:'«Не смотря под ноги» = <b>не глядя</b> — это деепричастие «смотря» с НЕ. НЕ с деепричастиями пишется <b>раздельно</b>.',
  why2:'Здесь действительно речь о глазах: шёл и не смотрел под ноги. Это действие (деепричастие), а не предлог «несмотря на».'},
 {lvl:2,text:'Имей {в виду*|ввиду}, что завтра контрольная.',
  why:'«Иметь в виду» — устойчивое выражение (= помнить), здесь «виду» — существительное с предлогом → <b>раздельно</b>.',
  why2:'Замени на «из-за»: «Имей из-за…» — не получается. Значит, это не предлог «ввиду», а сочетание «в виду».'},
 {lvl:2,text:'Деньги перевели {на счёт*|насчёт} школы.',
  why:'Здесь «счёт» — <b>существительное</b> (банковский счёт), куда перевели деньги → <b>раздельно</b>.',
  why2:'Замени на «о»: «перевели о школе» — бессмыслица. Значит, это «на счёт» — на какой-то счёт в банке.'},
 {lvl:2,text:'{В заключение*|В заключении} учитель поблагодарил всех за работу.',
  why:'«В заключение» = <b>в конце</b> — предлог/наречное сочетание. Пишется раздельно, на конце <b>Е</b>.',
  why2:'Обозначает «в конце, напоследок» — как «в течение» и «в продолжение»: на конце Е.'},
 {lvl:3,text:'{В течение*|В течении} недели шли дожди, и {вследствие*|в следствие|вследствии} этого река разлилась.',
  why:'1) «В течение недели» — время → раздельно, на конце Е. 2) «Вследствие этого» = <b>из-за</b> этого → слитно, на конце Е.',
  why2:'Две замены: «во время недели» подходит по смыслу (время) → в течение; «из-за этого» → вследствие.'},
 {lvl:3,text:'Этот документ сыграл важную роль {в следствии*|вследствие} по делу о краже.',
  why:'Здесь «следствие» — <b>существительное</b> (расследование): роль в (чём?) следствии по делу. Предлог «в» + существительное в предложном падеже → раздельно, на конце <b>И</b>.',
  why2:'Замени на «из-за»: «роль из-за по делу» — не получается. Значит, речь о расследовании — «в следствии».'},
 {lvl:3,text:'{Несмотря*|Не смотря} на усталость, он продолжал работать, {не смотря*|несмотря} на часы.',
  why:'1) «Несмотря на усталость» = хотя устал → предлог, <b>слитно</b>. 2) «Не смотря на часы» = не глядя на часы → деепричастие с НЕ, <b>раздельно</b>.',
  why2:'Спроси: кто-то смотрит глазами? В первом случае нет (смысл «вопреки») — предлог. Во втором да — он не смотрел на часы — деепричастие.'},
 {lvl:3,q:'В каком сочетании на конце пишется <b>И</b>?',
  opts:['в течени.. часа','в нижнем течени.. реки','в течени.. дня','в продолжени.. урока'],ans:1,
  why:'«В нижнем течении реки» — существительное (поток реки) с определением, предложный падеж → И. Остальные — предлоги времени, на конце Е.',
  why2:'Где речь не о времени, а о реке — там существительное. Остальные три отвечают на вопрос «как долго?».'},
 {lvl:1,text:'{Несмотря*|Не смотря} на холод, дети к{а*|о@g5.bezud}тались на санках.',
  why:'1) «Несмотря на холод» = хотя было холодно → предлог, <b>слитно</b>. 2) к_тались — безударная гласная, проверка: <b>ка́тит</b> → А.',
  why2:'1) Никто глазами не смотрит — это предлог. 2) Подбери слово с ударением на корне: ка́тит.'},
 {lvl:2,text:'{В течение*|В течении|Втечение} часа мы соб{и*|е@g6.bir_ber}рали грибы.',
  why:'1) «В течение часа» — время → раздельно, на конце Е. 2) После корня суффикс <b>-А-</b> → в корне <b>И</b>: собирали.',
  why2:'1) Сколько собирали? Час — значит, предлог времени. 2) Корень бер/бир: есть -а- после корня — пиши И.'},
 {lvl:2,text:'{Вследствие*|В следствие|Вследствии} снегопада все тр{о*|а@g5.bezud}пинки замело.',
  why:'1) «Вследствие снегопада» = из-за снегопада → <b>слитно</b>, на конце Е. 2) тр_пинки — проверка: <b>тро́пы</b> → О.',
  why2:'1) Подставь «из-за» — подходит, значит, предлог одним словом. 2) Поставь ударение на корень: тро́пы.'},
 {lvl:3,text:'{Ввиду*|В виду} {непогоды*|не погоды@g6.ne_sush} соревнования перенесли.',
  why:'1) «Ввиду непогоды» = из-за непогоды → предлог, <b>слитно</b>. 2) «Непогода» = <b>ненастье</b>, есть синоним без НЕ, противопоставления нет → слитно.',
  why2:'1) «Из-за» подставляется — предлог «ввиду». 2) НЕ с существительным: можно заменить синонимом без НЕ (непогода = ненастье) — значит, вместе.'},
 {lvl:3,text:'Он спросил {насчёт*|на счёт} экскурсии, но я н{и*|е@g6.mestoim_ne_ni}чего не знал.',
  why:'1) «Насчёт экскурсии» = об экскурсии → предлог, <b>слитно</b>. 2) «Ничего» — отрицательное местоимение без ударения на приставке → <b>НИ</b>.',
  why2:'1) Замени на «о» — подходит. 2) Ничего́ — ударение не на приставке, значит, НИ (сравни: не́чего — ударная НЕ).'}
].sort((a,b)=>a.lvl-b.lvl)});

/* ===================== СОЮЗЫ: ТОЖЕ, ТАКЖЕ, ЧТОБЫ, ЗАТО ===================== */
RU.rule({
id:'g7.soyuzy',
short:'Союзы тоже, также (= и), чтобы, зато (= но) пишутся слитно. Раздельно пишутся сочетания местоимения или наречия с частицей и предлога с местоимением: то же (самое), так же (как), что бы (ни), за то (что).',
theory:`
<p>Эти слова звучат одинаково, а пишутся по-разному. Помогает <b>проверка заменой</b>.</p>
<div class="box rule"><b>ТОЖЕ / ТАКЖЕ — слитно</b>, если это союз = «<b>и</b>»: <i>Я тоже пойду = И я пойду. Брат также занимается плаванием = И брат…</i></div>
<div class="box rule"><b>ТО ЖЕ / ТАК ЖЕ — раздельно</b>, если можно добавить «самое» или рядом есть «как», «что и»: <i>сказал то же (самое); поёт так же, как мама; то же, что и я</i>. «Же» можно убрать: «сказал то», «поёт так».</div>
<div class="box rule"><b>ЧТОБЫ — слитно</b> (союз цели: «для того чтобы»): <i>Я пришёл, чтобы помочь.</i><br><b>ЧТО БЫ — раздельно</b>: «бы» можно переставить или убрать: <i>Что бы тебе подарить? = Что тебе подарить бы?</i> А также в сочетании <b>что бы ни</b>: <i>Что бы ты ни делал…</i></div>
<div class="box rule"><b>ЗАТО — слитно</b> (= «но», «однако»): <i>Дорога длинная, зато красивая.</i><br><b>ЗА ТО — раздельно</b> (предлог + местоимение, часто с «что»): <i>Спасибо за то, что помог.</i></div>
<div class="box tip"><b>Как запомнить</b>Союз заменяется маленьким союзом: тоже/также = <b>и</b>, зато = <b>но</b>, чтобы = <b>для того чтобы</b>. Заменилось — пиши слитно.</div>
<div class="box err"><b>Ловушка</b>«Так же» почти всегда тянет за собой «<b>как</b>»; «то же» — «<b>самое</b>» или «<b>что и</b>».</div>`,
theory2:`
<p>Представь, что у слитных союзов есть «двойник-коротышка»:</p>
<ul><li><b>тоже, также</b> → «и»: <i>Я тоже = И я</i>.</li>
<li><b>зато</b> → «но»: <i>длинная, зато красивая = длинная, но красивая</i>.</li>
<li><b>чтобы</b> → «для того чтобы»: <i>пришёл, чтобы помочь</i>.</li></ul>
<p>Если «коротышка» не подходит, а подходит «самое», «как», «ни» или «за что» — это два слова: <b>то же самое</b>, <b>так же, как</b>, <b>что бы ни</b>, <b>за то, что</b>.</p>`,
items:[
 {lvl:1,text:'Я {тоже*|то же} люблю мороженое.',
  why:'Замена: «<b>И</b> я люблю мороженое». Союз = «и» → <b>слитно</b>: тоже.',
  why2:'Добавить «самое» нельзя («Я то же самое люблю» — меняет смысл). А «и я» подходит — значит, союз «тоже».'},
 {lvl:1,text:'Брат {также*|так же} занимается плаванием.',
  why:'Замена: «<b>И</b> брат занимается плаванием». Союз → <b>слитно</b>: также.',
  why2:'Здесь нет слова «как» и нечего сравнивать. «Также» = «и» — пишем вместе.'},
 {lvl:1,text:'Я пришёл, {чтобы*|что бы} помочь.',

RU.rule({

short:'Частицы бы (б), ли (ль), же (ж) пишутся раздельно. Частицы -то, -либо, -нибудь, кое-, -ка, -таки пишутся через дефис. Если между кое- и местоимением стоит предлог, всё пишется раздельно: кое о чём.',
theory:`

<div class="box rule"><b>Через дефис</b><b>-то, -либо, -нибудь, кое-</b>: <i>кто-то, где-нибудь, кое-где</i>;<br>
<b>-ка</b>: <i>принеси-ка, давай-ка</i>;<br>
<b>-таки</b> после глаголов, наречий и в слове <i>всё-таки</i>: <i>решил-таки, всё-таки</i>.</div>
<div class="box err"><b>Ловушка</b>Если у <b>кое-</b> между частицей и местоимением стоит предлог — пиши в <b>три слова</b>: <i>кое о чём, кое с кем, кое у кого</i>.<br>
<i>Всё-таки</i> — с дефисом, а <i>всё же</i> — раздельно.</div>
<ol class="steps">
<li>Найди частицу.</li>
<li>Она из «отдельной тройки» <b>бы, ли, же</b>? — пиши раздельно.</li>

</ol>
<div class="box tip"><b>Как запомнить</b>«<b>Бы, ли, же</b> — пишем отдельно уже!» «<b>То, либо, нибудь, кое, ка, таки</b> — дефис не забудь!»</div>`,

<p><b>Команда «Отдельные»</b>: <b>бы, ли, же</b>. Они стоят в стороне: <i>пошёл бы, знаешь ли, всё же</i>.</p>
<p><b>Команда «Дефисные»</b>: <b>-то, -либо, -нибудь, кое-, -ка, -таки</b>. Они держатся за слово через чёрточку: <i>кто-то, принеси-ка, всё-таки</i>.</p>
<p>Одна хитрость: если между «кое» и словом влез предлог — чёрточка рвётся: <i>кое с кем</i>.</p>`,

/* ===================== ЧАСТИЦЫ НЕ И НИ ===================== */
RU.rule({
id:'g7.ne_ni_chastitsy',
short:'НЕ — отрицание (я не знаю), а двойное НЕ даёт утверждение (не мог не прийти). НИ усиливает отрицание (ни разу не, ни облачка), повторяется (ни… ни…) и стоит в придаточных с обобщающим смыслом (кто бы ни, как ни).',
theory:`
<div class="box rule"><b>НЕ</b>1) <b>отрицание</b>: <i>Я не знаю. Не раз (= много раз) я был там.</i><br>
2) <b>двойное НЕ = утверждение</b>: <i>Он не мог не рассмеяться</i> (= обязательно рассмеялся);<br>
3) в сочетаниях <b>не кто иной, как; не что иное, как</b>: <i>Это был не кто иной, как мой друг.</i></div>
<div class="box rule"><b>НИ</b>1) <b>усиливает</b> уже имеющееся отрицание: <i>ни разу не был, не было ни души, на небе ни облачка</i>;<br>
2) <b>повторяется</b>: <i>Не было ни ветра, ни дождя</i>;<br>
3) в придаточных с обобщающим смыслом (= «любой, всегда, везде»): <b>кто бы ни, что бы ни, как ни, сколько ни, куда ни, где ни</b>: <i>Куда ни посмотришь, везде снег</i> (= везде, куда посмотришь).</div>
<ol class="steps">
<li>Отрицает ли частица действие? «Я не знаю» — да → НЕ.</li>
<li>Частица только усиливает отрицание, которое уже есть (ни разу <b>не</b>, ни души <b>не было</b>)? → НИ.</li>
<li>Видишь «кто бы, что бы, как, сколько, куда, где» в начале придаточного со смыслом «любой, всегда»? → НИ.</li>
<li>Два НЕ подряд у глаголов дают «да»: не мог не заметить = заметил.</li>
</ol>
<div class="box ex"><b>Пары-близнецы</b><i>не раз</i> (= часто) — <i>ни разу</i> (= никогда).<br><i>не кто иной, как</i> — <i>никто иной</i> (здесь не учим, просто запомни первое).</div>
<div class="box tip"><b>Как запомнить</b>НЕ говорит «нет». НИ — это «громкость» для «нет»: ни-ни-ни, ни капли, ни разу.</div>`,
theory2:`
<p><b>НЕ</b> — это кнопка «нет»: <i>не знаю, не пришёл</i>. Нажал её два раза — получилось «да»: <i>не мог не прийти</i> = пришёл.</p>
<p><b>НИ</b> — это усилитель «нет». Оно не отрицает само, а делает отрицание сильнее: <i>ни капли, ни разу, ни души</i>.</p>
<p>И ещё НИ стоит в словах «кто бы ни», «как ни», «куда ни» — когда смысл «неважно кто», «неважно как».</p>`,
items:[
 {lvl:1,text:'Я {не*|ни} знаю ответа.',
  why:'Частица отрицает действие: я <b>не</b> знаю → <b>НЕ</b>.',
  why2:'Это простое «нет»: знаю — не знаю. Отрицание — работа частицы НЕ.'},
 {lvl:1,text:'На небе {ни*|не} облачка.',

/* ===================== МЕЖДОМЕТИЯ ===================== */
RU.rule({
id:'g7.mezhdometiya',
short:'Междометие отделяется от остальной части предложения запятой (или восклицательным знаком): Ах, я забыл книгу! Повторяющиеся и сложные междометия пишутся через дефис: ай-ай-ай, ей-богу. Не отделяются «о» перед обращением и «ох», «ну» в сочетании с «и»: Ну и погода!',
theory:`
<p><b>Междометия</b> — это слова-эмоции: <i>ах, ох, ой, увы, эх, ура, тсс, эй</i>. Они не являются членами предложения, поэтому <b>отделяются</b> знаками препинания.</p>
<div class="box rule"><b>Запятые</b>Междометие отделяется запятой: <i>Ой, больно!</i> <i>Увы, мы опоздали.</i><br>Если оно в середине предложения — запятые с двух сторон: <i>Мы, увы, опоздали.</i></div>
<div class="box rule"><b>Дефис</b>Повторы и сложные междометия пишутся через дефис: <i>ай-ай-ай, ой-ой-ой, ох-ох-ох, ей-богу</i>.</div>
<div class="box err"><b>Когда запятая НЕ нужна</b>1) «<b>о</b>» перед обращением: <i>О мой друг!</i><br>
2) «<b>ох, ну, ах</b>» перед <b>«и»</b>, когда они просто усиливают: <i>Ну и погода! Ох и устал же я!</i></div>
<ol class="steps">
<li>Найди слово-эмоцию.</li>
<li>Посмотри, не стоит ли после него «и» (ну и…, ох и…) и не стоит ли «о» перед обращением. Если да — запятая не нужна.</li>
<li>Иначе отдели междометие запятыми.</li>
<li>Повтор (ой-ой-ой) — пиши через дефис.</li>
</ol>
<div class="box tip"><b>Как запомнить</b>Междометие — как вздох. Вздохнул — сделал паузу (запятую) — продолжил говорить.</div>`,
theory2:`
<p>Представь, что ты говоришь и вдруг вскрикнул: «Ой!» — ты на миг остановился. Эта остановка на письме — <b>запятая</b>: <i>Ой, больно!</i></p>
<p>Если вскрик повторяется — <b>ой-ой-ой</b> — склеиваем дефисами.</p>
<p>Только «ну и…» и «ох и…» произносятся на одном дыхании, без остановки: <i>Ну и жара!</i> — запятой нет.</p>`,

  why2:'Вскрикнул — пауза — сказал дальше. Пауза после междометия — запятая.'},
 {lvl:1,text:'Увы{,*|_} мы опоздали.',
  why:'«Увы» — междометие (выражает сожаление) → отделяется <b>запятой</b>.',

  why:'«Ах» — междометие → <b>запятая</b> после него.',
  why2:'«Ах» не член предложения — это просто эмоция. Отделяем её запятой.'},
 {lvl:1,text:'Эй{,*|_} подожди меня!',
  why:'«Эй» — междометие (оклик) → <b>запятая</b>.',
  why2:'Окликнул — пауза — попросил. Пауза = запятая.'},
 {lvl:1,q:'Какое слово — <b>междометие</b>?',
  opts:['ой','очень','только','ведь'],ans:0,
  why:'«Ой» выражает чувство (боль, испуг) — это <b>междометие</b>. «Очень» — наречие, «только» и «ведь» — частицы.',
  why2:'Междометие — это слово-эмоция, звук, который мы произносим, когда что-то чувствуем: ой, ах, ура.'},

  why:'«<b>Ну и</b>…» — усилительное сочетание, запятая <b>не ставится</b>.',
