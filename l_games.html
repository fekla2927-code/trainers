 {short:'Таблица П/В с конца.',
 explain:'Алгоритм: 1) конечные позиции (ходов нет) — П; 2) В — если есть ход в П; 3) П — если все ходы в В. Заполняй от маленьких позиций к большим — каждая следующая зависит только от уже посчитанных.',
 explain2:'Так считают компьютеры. Например, для «бери 1, 3 или 4»: 0 — П, 1 — В, 2 — П, 3 — В, 4 — В, 5 — В, 6 — В, 7 — П…'}),'r');
G(5,()=>{const mv=pick([[1,3,4],[1,4],[2,3],[1,2,4],[1,3],[2,5],[1,5,6],[3,4]]);const n=R(8,25);const W=sub(n,mv);const f=W[n];const best=f?mv.filter(m=>m<=n&&!W[n-m]):[];
 const mvT=mv.join(', ').replace(/, (\d)$/,' или $1');
 return who(f,{short:f?`${n} — В: взять ${best[0]} → ${n-best[0]} (П).`:`${n} — П: все ходы ведут в В.`,
 explain:`Строим таблицу с конца (если камней меньше ${Math.min(...mv)}, ходить нельзя — П):${STRIP(n,W)}${f?`${n} — В: ход «взять ${best[0]}» оставляет ${n-best[0]}, а это П. Выигрывает <b>первый</b>.`:`${n} — П: ходы ведут в ${mv.filter(m=>m<=n).map(m=>n-m).join(', ')} — все В. Выигрывает <b>второй</b>.`}`,
 explain2:`П-позиции до ${n}: ${LL(W,0,n).join(', ')}. Каждая П-позиция — та, из которой нельзя попасть в другую П (разности между П-позициями не равны ${mvT}).`},`В куче ${n} ${plural(n,'камень','камня','камней')}. За ход можно взять ${mvT} ${plural(mv[mv.length-1],'камень','камня','камней')}. Кто возьмёт последний камень — выиграл (кто не может ходить — проиграл). Кто выиграет?`);});
G(5,()=>{const mv=pick([[1,3,4],[1,4],[2,3],[1,2,4],[2,5],[3,4]]);const M=R(10,15);const W=sub(M,mv);const L=LL(W,1,M);
 const mvT=mv.join(', ').replace(/, (\d)$/,' или $1');
 return {type:'set',q:`За ход можно взять ${mvT} ${plural(mv[mv.length-1],'камень','камня','камней')} (если не можешь — проиграл). Выпиши <b>все</b> проигрышные позиции от 1 до ${M} (через запятую).`,ans:L,
 short:`П: ${L.join(', ')}.`,
 explain:`Таблица с конца (0 — П):${STRIP(M,W)}Проигрышные от 1 до ${M}: <b>${L.join(', ')}</b>.`,
 explain2:`Проверь одну: ${L[0]} — ходы ведут в ${mv.filter(m=>m<=L[0]).map(m=>L[0]-m).join(', ')||'никуда (ходов нет)'} — ${mv.some(m=>m<=L[0])?'все В':'П'}. Проверь соседнюю В-позицию: из неё есть ход в П.`};});
G(5,()=>{const A=R(3,7),B=A;let a,b;do{a=R(0,A);b=R(0,B);}while(a===0&&b===0);const W=corner(A,B,false);const f=W[a][b];ok(f===!(a%2===0&&b%2===0),'king');
 const mvs=[];if(a)mvs.push(['влево',a-1,b]);if(b)mvs.push(['вниз',a,b-1]);if(a&&b)mvs.push(['по диагонали',a-1,b-1]);const good=mvs.find(m=>!W[m[1]][m[2]]);
 return who(f,{pic:grid(A,B,W,{at:[b,a]}),
 short:f?`Расстояния (${a}, ${b}) — не оба чётные → первый: ход ${good[0]}.`:`Расстояния (${a}, ${b}) — оба чётные → второй.`,
 explain:`Пусть до угла ${a} ${plural(a,'столбец','столбца','столбцов')} влево и ${b} ${plural(b,'строка','строки','строк')} вниз. Считаем с конца: угол (0, 0) — П. П-позиции — где оба расстояния чётные:<div class="fig">${grid(A,A,W,{mark:true})}</div>${f?`(${a}, ${b}) — В. Первый ходит <b>${good[0]}</b> → (${good[1]}, ${good[2]}) — оба чётные. Выигрывает <b>первый</b>.`:`(${a}, ${b}) — оба чётные, П. Любой ход делает какое-то расстояние нечётным, а второй возвращает «оба чётные». Выигрывает <b>второй</b>.`}`,
 explain2:`Почему «оба чётные»: из такой позиции любой ход (−1 по одной или по обеим осям) делает хотя бы одно число нечётным. А из любой другой можно одним ходом сделать оба чётными (уменьшить нечётные). В конце (0, 0) — оба чётные.`},`Король стоит на доске (см. рисунок, ♚). За ход его можно передвинуть на одну клетку влево, вниз или по диагонали влево-вниз. Кто поставит короля в левый нижний угол — выиграл. Кто выиграет?`);});
G(5,()=>{const N=R(8,25);const W=raceW(N);const s0=R(1,4);const f=W[s0];const opt=[[s0+1,'прибавить 1'],[2*s0,'умножить на 2']].filter(([v])=>v<=N);const good=opt.find(([v])=>!W[v]);
 const L=range(s0,N).filter(x=>!W[x]);
 return who(f,{short:f?`${s0} — В: первый ход — ${good[1]} (получится ${good[0]}, это П).`:`${s0} — П → второй.`,
 explain:`Идём с конца. ${N} — П (соперник уже получил ${N}). Для каждого x: если x + 1 или 2x (не больше ${N}) — П, то x — В; иначе П.<br>П-позиции от ${s0} до ${N}: <b>${L.join(', ')}</b>.<br>${f?`${s0} — В: можно ${good[1]} и получить ${good[0]} — П. Выигрывает <b>первый</b>.`:`${s0} — П: ходы ведут в ${opt.map(([v])=>v).join(' и ')} — это В. Выигрывает <b>второй</b>.`}`,
 explain2:`Проверь хвост: ${N-1} — В (+1 → ${N}). ${N%2===0?`${N/2} — тоже В (×2 → ${N}). `:''}${N-2} — ${W[N-2]?'В':'П'}. Удвоение — мощный ход, поэтому П-позиции расположены неравномерно; надёжнее всего — таблица с конца.`},`На экране число ${s0}. Двое по очереди либо прибавляют к числу 1, либо умножают его на 2 — но так, чтобы не превысить ${N}. Кто получит ровно ${N} — выиграл. Кто выиграет?`);});

/* L6 ★ */
G(6,()=>CH('Две кучки камней; за ход можно взять сколько угодно камней из <b>одной</b> кучки. Кто взял последний — выиграл. Какие позиции проигрышные?','Когда кучки равны',['Когда в кучках чётное число камней','Когда одна кучка пустая','Когда кучки отличаются на 1'],
 {short:'Равные кучки — «зеркало» для соперника.',
 explain:'Если кучки <b>равны</b>, то после любого хода они становятся разными, а соперник может снова их уравнять (взять столько же из другой). В конце (0, 0) — равные. Значит, равные — П, разные — В (уравняй!).',
 explain2:'Это симметричная стратегия: две равные кучки — «зеркальная» позиция.'}),'r');
G(6,()=>{let a,b;do{a=R(3,20);b=R(3,20);}while(a===b);const big=a>b?'первой':'второй',d=Math.abs(a-b);
 const W=(x,y)=>x!==y;ok(nimW([a,b])&&!nimW([Math.min(a,b),Math.min(a,b)]),'two piles');
 const right=`Взять ${d} из ${big} кучки`;const wr=new Set();while(wr.size<3){const p=R(0,1),t=R(1,p?b:a);const s=`Взять ${t} из ${p?'второй':'первой'} кучки`;const na=p?a:a-t,nb=p?b-t:b;if(s!==right&&na!==nb)wr.add(s);}
 return CH(`Две кучки: ${a} и ${b} камней. За ход можно взять сколько угодно камней, но только из одной кучки. Кто возьмёт последний — выиграл. Ты ходишь первым. Какой ход выигрывает?`,right,[...wr],{
 short:`Уравнять: (${Math.min(a,b)}, ${Math.min(a,b)}).`,
 explain:`Равные кучки — П-позиция. Делаем их равными: берём ${d} из ${big} кучки → (${Math.min(a,b)}, ${Math.min(a,b)}). Дальше на «взял x из одной» отвечаем «x из другой». В конце соперник не сможет ходить.<br>Остальные ходы оставляют кучки разными — тогда уравнивать будет соперник.`,
 explain2:`Проверь любой неверный вариант: после него кучки разные, и соперник сам сделает их равными — теперь П-позиция у тебя.`});},'s');
G(6,()=>{let p;do{p=[R(1,7),R(1,7),R(1,7)];}while((p[0]^p[1]^p[2])===0);const x=p[0]^p[1]^p[2];
 const moves=[];p.forEach((v,i)=>{for(let t=1;t<=v;t++){const q=p.slice();q[i]-=t;moves.push({i,t,q,good:!nimW(q)});}});const good=moves.filter(m=>m.good);ok(good.length>=1&&good.every(m=>(m.q[0]^m.q[1]^m.q[2])===0),'nim');
 const g=pick(good);const fmt=m=>`Взять ${m.t} из кучки ${m.i+1} (останется ${m.q.join(', ')})`;
 const bad=shuffle(moves.filter(m=>!m.good)).slice(0,3).map(fmt);
 const bits=v=>[4,2,1].filter(b=>v&b).join(' + ')||'0';
 return CH(`Ним: три кучки — ${p.join(', ')} камней. За ход берут сколько угодно камней из одной кучки. Кто возьмёт последний — выиграл. Какой ход выигрывает?`,fmt(g),bad,{
 hint:'Разложи каждую кучку на 4, 2, 1 и найди «непарные» кирпичики.',
 short:`После хода: ${g.q.map(bits).join(' | ')} — всё парное.`,
 explain:`Шаг 1. Раскладываем: ${p.map(v=>`${v} = ${bits(v)}`).join('; ')}.<br>Шаг 2. Непарные кирпичики (встречаются нечётное число раз): ${[4,2,1].filter(b=>x&b).join(', ')} — позиция В.<br>Шаг 3. Ход «${fmt(g).toLowerCase()}»: ${g.q.map(v=>`${v} = ${bits(v)}`).join('; ')} — каждый кирпичик встречается чётное число раз → П для соперника ✅.<br>Остальные варианты оставляют непарные кирпичики.`,
 explain2:`На языке информатики: XOR кучек ${p.join(' ⊕ ')} = ${x}. Выигрышный ход делает XOR равным 0: ${g.q.join(' ⊕ ')} = 0. Компьютер проверил перебором все позиции.`});},'s');
G(6,()=>{const p=[R(1,7),R(1,7),R(1,7)];const f=nimW(p);const x=p[0]^p[1]^p[2];ok(f===(x!==0),'nim who');const bits=v=>[4,2,1].filter(b=>v&b).join(' + ')||'0';
 return who(f,{short:f?`Есть непарные кирпичики (${[4,2,1].filter(b=>x&b).join(', ')}) → первый.`:'Все кирпичики парные → второй.',
 explain:`Раскладываем: ${p.map(v=>`${v} = ${bits(v)}`).join('; ')}.<br>${f?`Непарные кирпичики: ${[4,2,1].filter(b=>x&b).join(' и ')} → позиция В, выигрывает <b>первый</b> (он делает ход, после которого всё парное).`:'Каждый кирпичик (4, 2, 1) встречается чётное число раз → П. Выигрывает <b>второй</b>.'}`,
 explain2:`XOR: ${p.join(' ⊕ ')} = ${x}. ${x?'Не ноль — В.':'Ноль — П.'} Перебор всех позиций компьютером подтверждает.`},`Ним: три кучки — ${p.join(', ')} камней. За ход берут сколько угодно камней из одной кучки. Кто возьмёт последний — выиграл. Кто выиграет при правильной игре?`);},'s');
G(6,()=>{const n=R(3,12),m=R(3,12);const k=Math.min(n,m);const f=k%2===1;
 return who(f,{short:`Будет ровно ${k} ${plural(k,'ладья','ладьи','ладей')} → ${f?'первый':'второй'}.`,
 explain:`Каждая ладья занимает свою строку и свой столбец. Ход возможен, пока есть свободная строка <b>и</b> свободный столбец. Значит, игра закончится ровно после ${k} ${plural(k,'ладьи','ладей','ладей')} (min(${n}, ${m}) = ${k}), как бы ни ставили.<br>${k} — ${k%2?'нечётное':'чётное'}: последний ход за ${f?'<b>первым</b>':'<b>вторым</b>'}.`,
 explain2:`Это игра-шутка: число ходов не зависит от игры. Каждый ход «закрывает» одну строку и один столбец; ${n<m?'строки':n>m?'столбцы':'строки и столбцы'} кончатся через ${k} ходов.`},`Двое по очереди ставят ладей на доску ${n}×${m} (${n} строк, ${m} столбцов) так, чтобы никакие две ладьи не били друг друга. Кто сделает последний ход (и выиграет)?`);},'s');

/* L7 ★ */
G(7,()=>CH('Что значит «у первого игрока есть выигрышная стратегия»?','Первый может играть так, что выиграет при любых ходах соперника',['Первый выиграет, если соперник ошибётся','Первый выигрывает чаще, чем второй','Первый ходит первым и поэтому сильнее'],
 {short:'Стратегия = выигрыш против любой защиты.',
 explain:'<b>Выигрышная стратегия</b> — правило, как ходить, чтобы победить <b>при любых</b> ходах соперника, даже самых лучших. Не «чаще», не «если повезёт», а всегда.',
 explain2:'В игре «бери 1–3» при 17 камнях у первого есть стратегия: взять 1, потом дополнять до 4. Что бы ни делал второй — проиграет.'}),'r');
G(7,()=>{const N=R(10,60);const W=divW(N);const f=W[N];ok(f===(N%2===0),'divisor');
 return who(f,{short:`${N} — ${N%2?'нечётное → П':'чётное → В'}.`,
 explain:`Шаг 1. 1 — конечная позиция: ходить нельзя, П. 1 — нечётное.<br>Шаг 2. У нечётного числа все делители нечётные, нечётное − нечётное = чётное. Из нечётного попадаем только в чётное.<br>Шаг 3. Из чётного можно вычесть 1 (делитель любого числа) и получить нечётное.<br>Итого: нечётные — П, чётные — В. ${N} — ${N%2?'нечётное':'чётное'}. Выигрывает <b>${f?'первый':'второй'}</b>${f?' (стратегия: всегда вычитать 1)':' (стратегия второго: всегда вычитать 1)'}.`,
 explain2:`Компьютер посчитал все позиции до ${N}: П — ровно нечётные числа. Например, 9: можно вычесть 1 или 3 → 8 или 6 — чётные (В). 10: вычитаем 1 → 9 (П).`},`На доске число ${N}. Двое по очереди вычитают из числа на доске любой его делитель, меньший самого числа (например, из 12 можно вычесть 1, 2, 3, 4 или 6), и пишут результат. Кто не может сделать ход (на доске 1) — проиграл. Кто выиграет?`);},'s');
G(7,()=>{const n=R(3,5);const full=range(1,n).map(()=>n);ok(chompW(full),'chomp first');const after=full.map((v,i)=>i===0?n:1);ok(!chompW(after),'chomp L');
 return CH(`«Отравленная шоколадка» ${n}×${n}: левая нижняя долька отравлена. За ход выбирают дольку и съедают её вместе со всеми дольками, которые правее и выше (прямоугольником). Кто съест отравленную — проиграл. Как выигрывает первый?`,'Съедает дольку, соседнюю с отравленной по диагонали (и всё правее и выше), а потом отвечает симметрично на «уголке»',['Сразу съедает самую правую верхнюю дольку и дальше повторяет ходы второго','Съедает весь нижний ряд, кроме отравленной','Первый не может выиграть — выигрывает второй'],
 {short:'Остаётся «уголок» с одинаковыми сторонами — дальше зеркало.',
 explain:`Первый съедает дольку по диагонали от отравленной — уходит квадрат ${n-1}×${n-1}. Остаётся «уголок»: нижняя строка и левый столбец, по ${n-1} ${plural(n-1,'дольке','дольки','долек')} кроме отравленной. Дальше: второй съел k долек от одной стороны — первый столько же от другой. В конце второму остаётся только отравленная.<br>Компьютер перебрал все позиции шоколадки ${n}×${n} и подтвердил: этот ход выигрывает.`,
 explain2:`Это симметричная стратегия: «уголок» с равными сторонами — как две равные кучки. Тот, кто получает равные кучки, проигрывает.`});},'s');
G(7,()=>{const A=R(4,7),B=A;const W=corner(A,B,true);let a,b;do{a=R(1,A);b=R(1,B);}while(Math.random()<0.5&&W[a][b]);const f=W[a][b];
 const L=[];for(let x=0;x<=A;x++)for(let y=x;y<=A;y++)if(!W[x][y])L.push(`(${x}, ${y})`);
 let mv=null;if(f){for(let t=1;t<=a&&!mv;t++)if(!W[a-t][b])mv=`влево на ${t} → (${a-t}, ${b})`;for(let t=1;t<=b&&!mv;t++)if(!W[a][b-t])mv=`вниз на ${t} → (${a}, ${b-t})`;for(let t=1;t<=Math.min(a,b)&&!mv;t++)if(!W[a-t][b-t])mv=`по диагонали на ${t} → (${a-t}, ${b-t})`;}
 return who(f,{pic:grid(A,B,W,{at:[b,a],piece:'♛'}),
 short:f?`(${a}, ${b}) — В: ${mv}.`:`(${a}, ${b}) — П.`,
 explain:`Позиция — расстояния до угла (столбцов влево, строк вниз). Считаем с конца: (0, 0) — П. Ферзь может уйти в П одним ходом, если стоит на одной линии с ней.<br>П-позиции (с точностью до перестановки): <b>${L.join(', ')}</b>.<div class="fig">${grid(A,B,W,{mark:true})}</div>${f?`(${a}, ${b}) — В. Первый ходит ${mv}. Выигрывает <b>первый</b>.`:`(${a}, ${b}) — П: любой ход ведёт в В. Выигрывает <b>второй</b>.`}`,
 explain2:`Это знаменитая игра Витхоффа. П-позиции: (0, 0), (1, 2), (3, 5), (4, 7), (6, 10), … — разности 0, 1, 2, 3, 4, … и в каждой паре новые числа. Их связывают с золотым сечением!`},`Ферзь стоит на доске (см. рисунок, ♛). За ход его двигают на любое число клеток влево, вниз или по диагонали влево-вниз. Кто поставит ферзя в левый нижний угол — выиграл. Кто выиграет?`);},'s');

/* ---------- widget: play against the computer ---------- */
function onTheory(root){const w=root.querySelector('#w-nim');if(!w)return;
 let n=0,k=3,turn=0,hist=[],over=true,start=0,timer=null;
 w.innerHTML=`<b>Сыграй с компьютером: бери от 1 до k</b>
 <label>Камней: <input type="range" id="gN" min="8" max="30" value="20"><output id="gNo"></output></label>
 <label>Брать можно до: <input type="range" id="gK" min="2" max="5" value="3"><output id="gKo"></output></label>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button class="btn" id="gMe">Начать: хожу первым</button><button class="btn ghost" id="gPc">Начать: первым ходит компьютер</button></div>
 <div id="gPile" style="font-size:20px;line-height:1.4;margin:8px 0;min-height:30px;word-break:break-all"></div>
 <div id="gTake" style="display:flex;gap:8px;flex-wrap:wrap"></div>
 <div id="gMsg" style="margin-top:8px;font-size:16px;line-height:1.55"></div><div id="gStrip" class="fig"></div>`;
 const $=id=>w.querySelector('#'+id);
 const lbl=()=>{$('gNo').textContent=$('gN').value;$('gKo').textContent=$('gK').value;};
 const draw=()=>{$('gPile').innerHTML=n?`<span style="color:var(--accent)">${'●'.repeat(n)}</span> <b style="font-size:16px">${n}</b>`:'<span style="color:var(--muted)">куча пуста</span>';
  $('gTake').innerHTML=over?'':range(1,Math.min(k,n)).map(t=>`<button class="btn ${turn===0?'':'ghost'}" data-t="${t}" ${turn===0?'':'disabled'}>Взять ${t}</button>`).join('');
  w.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(over||turn!==0)return;take(+b.dataset.t,'Ты');});};
 const pcMove=()=>{const r=n%(k+1);const t=r?r:Math.min(n,1+Math.floor(Math.random()*k));take(t,'Компьютер');};
 const finish=(winner)=>{over=true;const W=sub(Math.max(start,1),range(1,k));
  $('gMsg').innerHTML+=`<br><b>${winner==='Ты'?'🎉 Ты победил!':'🤖 Победил компьютер.'}</b> Проигрышные позиции (П) — числа, кратные ${k+1}: ${LL(W,0,start).join(', ')}. ${start%(k+1)?`При ${start} камнях выигрывает тот, кто ходит первым: надо взять ${start%(k+1)} и дальше дополнять ходы соперника до ${k+1}.`:`При ${start} камнях первый проигрывает: второй дополняет каждый ход до ${k+1}.`}<br>Твоя игра: ${hist.join(' → ')}`;
  $('gStrip').innerHTML=strip(start,W);draw();};
 const take=(t,who)=>{n-=t;hist.push(`${who==='Ты'?'ты':'ПК'} −${t} = ${n}`);$('gMsg').innerHTML=`${who} ${who==='Ты'?'взял':'взял'} ${t}. Осталось ${n}.${n&&who==='Ты'&&n%(k+1)===0?' <span style="color:var(--ok)">Отлично, ты оставил кратное '+(k+1)+'!</span>':''}`;
  if(n===0){finish(who);return;}turn=who==='Ты'?1:0;draw();if(turn===1){timer=setTimeout(pcMove,600);}};
 const begin=(me)=>{clearTimeout(timer);n=+$('gN').value;k=+$('gK').value;start=n;hist=[];over=false;turn=me?0:1;$('gStrip').innerHTML='';$('gMsg').innerHTML=me?'Твой ход. Подсказка: попробуй оставлять компьютеру число, кратное '+(k+1)+'.':'Компьютер думает…';draw();if(!me)timer=setTimeout(pcMove,600);};
 $('gN').oninput=lbl;$('gK').oninput=lbl;$('gMe').onclick=()=>begin(true);$('gPc').onclick=()=>begin(false);lbl();
 n=+$('gN').value;k=+$('gK').value;$('gMsg').innerHTML='Нажми «Начать». Компьютер играет идеально — сможешь его обыграть?';draw();}
