<!doctype html>

  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">

  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;

<div class="box rule"><b>Главная формула</b>${M('S = v·t')} (путь = скорость × время).<br><b>Навстречу:</b> расстояние сокращается со скоростью ${M('v₁ + v₂')} (скорость сближения).<br><b>Вдогонку:</b> со скоростью ${M('v₁ − v₂')} (быстрый «отъедает» у медленного разницу скоростей).</div>
<div class="fig">${road({mode:'meet',v1:'v₁',v2:'v₂',S:'S'})}</div>
<p><b>Почему складываем?</b> За 1 час первый проходит v₁, второй v₂ — вместе расстояние между ними уменьшается на v₁ + v₂. Время встречи: ${M(`t = ${fr('S','v₁ + v₂')}`)}.</p>
<div class="box ex"><b>Пример</b>Два дрона летят навстречу из точек в 90 км друг от друга: 40 км/ч и 50 км/ч. Встреча через 90 : (40 + 50) = 1 ч.</div>
<div class="box ex"><b>Вдогонку</b>Пешеход ушёл на 6 км вперёд со скоростью 4 км/ч, велосипедист едет 16 км/ч. Догонит через 6 : (16 − 4) = 0,5 ч.</div>
<div class="box err"><b>Ловушка</b>Складывать скорости при движении вдогонку. Если оба едут в одну сторону, расстояние сокращается медленнее — на разницу скоростей.</div>`},
{title:'Движение по реке',lvl:4,html:`
<div class="box rule"><b>Правило</b>${M('v<sub>по теч</sub> = v<sub>собств</sub> + v<sub>теч</sub>')}<br>${M('v<sub>против теч</sub> = v<sub>собств</sub> − v<sub>теч</sub>')}<br>Плот (без мотора) плывёт со скоростью течения.</div>
<p><b>Почему?</b> Река — это движущаяся дорожка, как траволатор в аэропорту. Идёшь по ней — скорости складываются, идёшь против — вычитаются.</p>
<div class="box tip"><b>Обратная задача</b>Если известны скорости по и против течения: ${M(`v<sub>теч</sub> = ${fr('v<sub>по</sub> − v<sub>против</sub>','2')}`)}, ${M(`v<sub>собств</sub> = ${fr('v<sub>по</sub> + v<sub>против</sub>','2')}`)}.</div>
<div class="box ex"><b>Пример</b>Катер прошёл по течению за 3 ч столько же, сколько против течения за 4 ч. Течение 2 км/ч. Собственная скорость x:<br>${M('3(x + 2) = 4(x − 2)')} → 3x + 6 = 4x − 8 → x = 14 км/ч.</div>
<div class="box err"><b>Ловушка</b>Считать, что плот плывёт «со скоростью 0». Он плывёт вместе с водой — со скоростью течения.</div>`},
{title:'Совместная работа',lvl:5,html:`
<div class="box rule"><b>Правило</b>Всю работу примем за <b>1</b>. Если один делает её за a часов, то за 1 час он делает ${M(fr(1,'a'))} работы (это <b>производительность</b>).<br>Работая вместе, производительности <b>складываются</b>: ${M(`${fr(1,'a')} + ${fr(1,'b')}`)}. Время вместе ${M(`t = 1 : (${fr(1,'a')} + ${fr(1,'b')})`)}.</div>
<div class="box ex"><b>Пример</b>Одна труба наполняет бассейн за 3 ч, другая за 6 ч. За час вместе: ${fr(1,3)} + ${fr(1,6)} = ${fr(1,2)} бассейна. Значит, весь — за <b>2 ч</b>.</div>
<div class="box err"><b>Ловушка</b>«3 ч и 6 ч — вместе 3 + 6 = 9 ч» или «среднее 4,5 ч». Вдвоём должно быть <b>быстрее</b>, чем самый быстрый в одиночку!</div>
<div class="box ex"><b>Слив</b>Кран наполняет ванну за 6 мин, слив опустошает за 10 мин. Оба открыты: ${fr(1,6)} − ${fr(1,10)} = ${fr(1,15)} → 15 мин.</div>`},
{title:'Проценты и цены',lvl:6,html:`
<div class="box rule"><b>Правило</b>1% — это сотая часть: p% от A = ${M(`A·${fr('p','100')}`)}.<br>Увеличили на p%: ${M('A·(1 + p/100)')}. Уменьшили на p%: ${M('A·(1 − p/100)')}.</div>
<div class="box ex"><b>Пример</b>Наушники стоили 3000 ₽, скидка 15%: 3000·0,85 = 2550 ₽.</div>
<div class="box ex"><b>Обратная задача</b>После скидки 20% кроссовки стоят 4800 ₽. Было x: ${M('0,8x = 4800')} → x = 6000 ₽.</div>
<div class="box err"><b>Ловушка «+20%, потом −20%»</b>1000 → 1200 → 1200·0,8 = 960. Цена <b>не вернулась</b>! Второй процент берётся от новой, большей суммы. Итог: ×1,2·0,8 = ×0,96, то есть −4%.</div>
<div class="fact">Знак «%» произошёл от итальянского «per cento» — «на сотню». Писцы сокращали его до «p cto», потом «cto» превратилось в дробь «o/o», а затем в привычный значок.</div>`},
{title:'Монеты и цифры числа',lvl:7,html:`
<div class="box rule"><b>Правило</b>Двузначное число с цифрой десятков a и единиц b равно ${M('10a + b')} (а не «ab» и не a + b!).<br>Трёхзначное: ${M('100a + 10b + c')}.</div>
<div class="box ex"><b>Пример</b>Сумма цифр двузначного числа 9. Если цифры поменять местами, число увеличится на 27. Цифры a и 9 − a:<br>${M('10(9 − a) + a − (10a + 9 − a) = 27')} → 81 − 18a = 27 → a = 3. Число 36 (63 − 36 = 27 ✅).</div>
<div class="box ex"><b>Монеты</b>15 монет по 2 ₽ и 5 ₽, всего 48 ₽. Пятирублёвых x, двухрублёвых 15 − x: ${M('5x + 2(15 − x) = 48')} → 3x = 18 → x = 6.</div>
<div class="box tip"><b>Лайфхак</b>При перестановке цифр двузначного числа разность всегда кратна 9: (10b + a) − (10a + b) = 9(b − a).</div>`},
{title:'★ Олимпиадные сюжеты',lvl:8,html:`
<div class="box rule"><b>Круговая трасса</b>Бегуны стартуют вместе в одну сторону. Быстрый впервые догонит медленного, когда пробежит на <b>один круг больше</b>: ${M(`t = ${fr('L','v₁ − v₂')}`)}.</div>
<div class="box rule"><b>Часы</b>Минутная стрелка проходит 6° в минуту, часовая — 0,5° в минуту. Это «бег по кругу» в 360° со скоростями 6 и 0,5: после 12:00 стрелки совпадут через ${M(`${fr(360,'5,5')} = ${fr(720,11)} = 65${fr(5,11)}`)} мин.</div>
<div class="box rule"><b>Муха между поездами</b>Не надо складывать бесконечно много перелётов мухи! Найди время до встречи поездов — муха летает ровно столько же. Путь мухи = её скорость × это время.</div>
<div class="box rule"><b>Арбуз</b>Ищи то, что <b>не меняется</b>: при усушке испаряется вода, а «сухое вещество» остаётся тем же.</div>
<div class="fact">Задачу о мухе однажды задали великому математику Джону фон Нейману. Он ответил мгновенно. «А, вы знаете трюк!» — «Какой трюк? Я просто сложил ряд». Легенда, но очень известная.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps"><li>x — неизвестное, остальное — через x, приравниваем два способа выразить одно и то же.</li>
<li>Возраст: всем ±t, разница постоянна.</li>
<li>Навстречу v₁ + v₂, вдогонку v₁ − v₂, по реке v ± v<sub>теч</sub>.</li>
<li>Работа = 1, производительность 1/t, вместе — сумма.</li>
<li>+p%: ×(1 + p/100), −p%: ×(1 − p/100).</li>
<li>Число с цифрами a, b: 10a + b.</li>
<li>Проверяй ответ по смыслу задачи.</li></ul>`}
];

const symbols={tab:'Формулы',title:'Формулы текстовых задач',rows:[
['S = v·t','Путь','Путь = скорость × время.',M('60 км/ч · 2 ч = 120 км')],
['v₁ + v₂','Скорость сближения','Движение навстречу.',M('t = S : (v₁ + v₂)')],
['v₁ − v₂','Скорость догона','Движение вдогонку (v₁ > v₂).',M('t = d : (v₁ − v₂)')],
['v ± v<sub>теч</sub>','По реке','По течению «+», против «−».',M('12 + 2 = 14 км/ч')],
['1/a + 1/b','Совместная работа','Производительности складываются.',M('1/3 + 1/6 = 1/2 → 2 ч')],
['A·(1 ± p/100)','Проценты','Увеличение / уменьшение на p%.',M('500·1,2 = 600')],
['10a + b','Двузначное число','a — десятки, b — единицы.',M('37 = 10·3 + 7')]
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Не спеши считать. Сначала табличка: что известно, что через x, — и уравнение появится само.</div>`};

const gens=[];
const G=(lvl,make,f)=>gens.push({lvl,make,star:(f||'').includes('s')||undefined,rule:(f||'').includes('r')||undefined});

/* L0 */
G(0,()=>{const ok='обозначить неизвестное x → выразить остальные величины через x → составить уравнение → решить → проверить по смыслу';
const o=mk(ok,['составить уравнение → обозначить неизвестное x → решить → проверить по смыслу','решить уравнение → обозначить неизвестное x → проверить → составить уравнение','подобрать ответ → проверить его → обозначить неизвестное x']);
return {type:'choice',q:'Какой порядок решения текстовой задачи правильный?',...o,short:'x → выражаем всё через x → уравнение → решаем → проверяем.',
explain:`Нельзя составить уравнение, пока нет буквы: сначала <b>обозначаем</b> неизвестное x, потом выражаем через x всё остальное, потом приравниваем — получаем уравнение, решаем и обязательно <b>проверяем по смыслу</b> (ответ на тот ли вопрос? целое ли число людей?). Подбор иногда работает, но это не решение.`,
explain2:`Как рецепт: сначала достаёшь продукты (x и выражения через x), потом смешиваешь (уравнение), готовишь (решаешь) и пробуешь (проверка). Готовить до того, как достал продукты, не выйдет.`};},'r');
G(0,()=>{const k=R(2,9);const forms=[[`на ${k} больше`,`x + ${k}`],[`на ${k} меньше`,`x − ${k}`],[`в ${raz(k)} больше`,`${k}x`],[`в ${raz(k)} меньше`,`x : ${k}`]];const f=pick(forms);
const o=mk(M(f[1]),forms.map(q=>M(q[1])));
return {type:'choice',q:`Число y <b>${f[0]}</b>, чем x. Как записать y через x?`,...o,short:`«${f[0]}» → ${M('y = '+f[1])}.`,
explain:`«На … больше/меньше» — это сложение/вычитание, «в … раз больше/меньше» — умножение/деление.<br>«${f[0]}» → ${M('y = '+f[1])}.<br>Пример при x = ${k*3}: y = ${[`${k*3} + ${k} = ${k*4}`,`${k*3} − ${k} = ${k*2}`,`${k}·${k*3} = ${k*k*3}`,`${k*3} : ${k} = 3`][forms.indexOf(f)]}.`,
explain2:`Запомни пару: «НА — плюс/минус», «В РАЗ — умножить/разделить». Слово «на» говорит, на сколько единиц отличаются числа; «в … раз» — сколько раз одно помещается в другом.`};},'r');
G(0,()=>{let a,b,x,c;do{a=R(2,9);b=R(1,30);x=R(2,25);c=a*x-b;}while(c<=0);const nm=pick(NAMES);
return {type:'num',q:`${nm} задумал число, умножил его на ${a}, вычел ${b} и получил ${c}. Какое число он задумал?`,ans:x,
short:`${M(`${a}x − ${b} = ${c}`)} → x = ${x}.`,
explain:`Пусть задумано x. «Умножил на ${a}» → ${a}x, «вычел ${b}» → ${a}x − ${b}. Получил ${c}:<br>${M(`${a}x − ${b} = ${c}`)} → ${M(`${a}x = ${c+b}`)} → x = <b>${x}</b>.`,
explain2:`Распутываем с конца: перед вычитанием было ${c} + ${b} = ${c+b}, перед умножением — ${c+b} : ${a} = ${x}. Проверка: ${x}·${a} − ${b} = ${c} ✅.`};});
G(0,()=>{const nm=pick(NAMES),d=R(2,6),x=R(6,14),S=2*x+d;const ok=M(`x + (x + ${d}) = ${S}`);
const o=mk(ok,[M(`x + ${d}x = ${S}`),M(`x + (x − ${d}) = ${S}`),M(`x(x + ${d}) = ${S}`)]);
return {type:'choice',q:`${nm}у x лет, его брат на ${d} ${plural(d,'год','года','лет')} старше. Вместе им ${S} лет. Какое уравнение подходит?`,...o,short:`Брату x + ${d}, сумма ${ok}.`,
explain:`Брату на ${d} больше → ${M(`x + ${d}`)}. «Вместе» — сумма: ${ok}. Отсюда 2x = ${S-d}, x = ${x}.<br>«${d}x» значило бы «в ${d} раза старше», а «x − ${d}» — «младше».`,
explain2:`Проверим на ответе: ${nm}у ${x}, брату ${x+d}, вместе ${S} ✅. Уравнение ${M(`x + ${d}x = ${S}`)} дало бы x = ${rat(S,d+1)} — ${S%(d+1)?'даже не целое':'но брату тогда было бы '+(d*S/(d+1))+' — не «на '+d+' старше»'}.`};});

/* L1 */
G(1,()=>{const o=mk(M('a − b = c'),[M('b − a = c'),M('a + c = b'),M('a : b = c')]);
return {type:'choice',q:'«Число a больше числа b на c». Какое равенство это записывает?',...o,short:'«больше на c» → разность a − b = c.',
explain:`Если a больше b на c, то разница между ними c: ${M('a − b = c')}, или ${M('a = b + c')}. Например, 10 больше 7 на 3: 10 − 7 = 3.<br>${M('a + c = b')} — наоборот, b стало бы больше. ${M('a : b = c')} — это «в c раз».`,
explain2:`Подставь числа: a = 12, b = 8, c = 4. ${M('12 − 8 = 4')} ✅, ${M('8 − 12 = −4')} ❌, ${M('12 + 4 = 16 ≠ 8')} ❌.`};},'r');
G(1,()=>{const d=R(2,9),x=R(10,30),S=2*x+d;const [A,B]=pick([['Криперы','Эндермены'],['Красные','Синие'],['Альфа','Бета']]);
return {type:'num',q:`В двух командах вместе ${S} игроков, в команде «${A}» на ${d} больше, чем в команде «${B}». Сколько игроков в команде «${B}»?`,ans:x,
short:`${M(`x + (x + ${d}) = ${S}`)} → x = ${x}.`,
explain:`Пусть в команде «${B}» x игроков, тогда в другой x + ${d}.<br>${M(`x + x + ${d} = ${S}`)} → ${M(`2x = ${S-d}`)} → x = <b>${x}</b>.<br>Проверка: ${x} + ${x+d} = ${S} ✅, разница ${d} ✅.`,
explain2:`Без x: убери «лишние» ${d} — останется ${S-d}, это две одинаковые команды. Одна — ${S-d} : 2 = ${x}.`};});
G(1,()=>{const k=R(2,6),x=R(5,40)*5,S=x*(k+1);const [a,b]=pick([['скин','кирка'],['меч','щит'],['наушники','чехол']]);
return {type:'num',q:`В игровом магазине ${a} стоит в ${raz(k)} дороже, чем ${b}. Вместе они стоят ${S} монет. Сколько стоит ${b}?`,ans:x,
short:`${M(`x + ${k}x = ${S}`)} → x = ${x}.`,
explain:`${b[0].toUpperCase()+b.slice(1)} — x монет, ${a} — ${k}x.<br>${M(`x + ${k}x = ${S}`)} → ${M(`${k+1}x = ${S}`)} → x = <b>${x}</b>. (${a[0].toUpperCase()+a.slice(1)} — ${k*x}.)`,
explain2:`Части: ${b} — 1 часть, ${a} — ${k} частей, всего ${k+1} частей = ${S}. Одна часть ${S} : ${k+1} = ${x}.<br>Ловушка: ответить ${S} : ${k} = ${n(S/k)} — забыли, что «вместе» включает и ${b}.`};});
G(1,()=>{let x,k,d,S;do{x=R(5,25);k=R(2,4);d=R(-8,12);S=x+k*x+x+d;}while(!d||x+d<=0);
return {type:'num',q:`На трёх полках ${S} ${plural(S,'книга','книги','книг')}. На второй в ${k} раза больше, чем на первой, а на третьей на ${Math.abs(d)} ${d>0?'больше':'меньше'}, чем на первой. Сколько книг на первой полке?`,ans:x,
short:`${M(`x + ${k}x + (x ${d>0?'+':'−'} ${Math.abs(d)}) = ${S}`)} → x = ${x}.`,
explain:`Первая — x, вторая — ${k}x, третья — x ${d>0?'+':'−'} ${Math.abs(d)}.<br>${M(`x + ${k}x + x ${d>0?'+':'−'} ${Math.abs(d)} = ${S}`)} → ${M(`${k+2}x = ${S-d}`)} → x = <b>${x}</b>.`,
explain2:`Проверка: ${x} + ${k*x} + ${x+d} = ${S} ✅. Удобно было взять за x именно первую полку — через неё выражаются обе другие.`};});
G(1,()=>{const even=Math.random()<0.5;const st=even?2:1;let x;do{x=R(-10,40);}while(even&&x%2);const N=3*x+3*st;
return {type:'num',q:`Сумма трёх последовательных ${even?'<b>чётных</b> ':''}целых чисел равна ${n(N)}. Найди наименьшее из них.`,ans:x,
short:`${M(`x + (x + ${st}) + (x + ${2*st}) = ${n(N)}`)} → x = ${n(x)}.`,
explain:`Числа: x, x + ${st}, x + ${2*st}${even?' (чётные идут через 2)':''}.<br>${M(`3x + ${3*st} = ${n(N)}`)} → ${M(`3x = ${n(N-3*st)}`)} → x = <b>${n(x)}</b>.<br>Числа: ${n(x)}, ${n(x+st)}, ${n(x+2*st)}.`,
explain2:`Хитрость: среднее из трёх подряд идущих = сумма : 3 = ${n(N/3)}. Наименьшее на ${st} меньше: ${n(x)}.`};});

/* L2 возраст */
G(2,()=>{const o=mk('каждому прибавится t лет, а разница возрастов не изменится',['разница возрастов увеличится на t','отношение возрастов («во сколько раз старше») не изменится','старшему прибавится больше лет, чем младшему']);
return {type:'choice',q:'Что происходит с возрастами двух людей через t лет?',...o,short:'+t каждому, разница — постоянна.',
explain:`Время идёт для всех одинаково: через t лет <b>каждому</b> + t. Разница: (A + t) − (B + t) = A − B — та же. А отношение меняется: папе 40, сыну 10 (в 4 раза), через 5 лет 45 и 15 (в 3 раза).`,
explain2:`Ты и твой друг, который старше на 2 года: через 10 лет он всё равно будет старше на 2 года. А вот «вдвое старше» — бывает только в определённый момент.`};},'r');
G(2,()=>{let s,t,k,F,S;do{k=R(2,4);t=R(2,15);s=R(4,20);S=s-t;F=k*s-t;}while(S<1||F<24||F>55||F-S<20);
return {type:'num',q:`Папе ${yrs(F)}, сыну ${yrs(S)}. Через сколько лет папа будет старше сына ровно в ${k} раза?`,ans:t,
short:`${M(`${F} + t = ${k}(${S} + t)`)} → t = ${t}.`,
explain:`Через t лет: папе ${F} + t, сыну ${S} + t.<br>${M(`${F} + t = ${k}(${S} + t)`)} → ${M(`${F} + t = ${k*S} + ${k}t`)} → ${M(`${F-k*S} = ${k-1===1?'':k-1}t`)} → t = <b>${t}</b>.`,
explain2:`Проверка: через ${t} лет папе ${F+t}, сыну ${S+t}, ${F+t} = ${k}·${S+t} ✅. Подсказка без x: разница ${F-S} лет постоянна; когда папа в ${k} раза старше, разница = ${k-1} «сыновьих возраста», значит сыну ${F-S} : ${k-1} = ${S+t}.`};});
G(2,()=>{let x,t,m,p;do{p=R(2,4);m=R(p+1,7);t=R(2,12);x=t*(p-1)/(m-p);}while(!Number.isInteger(x)||x<2||x>15||m*x>50||m*x<20);
return {type:'num',q:`Мама сейчас старше дочки в ${raz(m)}, а через ${yrs(t)} будет старше в ${p} раза. Сколько лет дочке сейчас?`,ans:x,
short:`${M(`${m}x + ${t} = ${p}(x + ${t})`)} → x = ${x}.`,
explain:`Дочке x, маме ${m}x. Через ${t} лет: x + ${t} и ${m}x + ${t}.<br>${M(`${m}x + ${t} = ${p}(x + ${t})`)} → ${M(`${m}x + ${t} = ${p}x + ${p*t}`)} → ${M(`${m-p===1?'':m-p}x = ${(p-1)*t}`)} → x = <b>${x}</b>.`,
explain2:`Проверка: сейчас ${x} и ${m*x} (в ${m} раз). Через ${t} лет ${x+t} и ${m*x+t}: ${m*x+t} : ${x+t} = ${p} ✅.`};});
G(2,()=>{let F,S,k,t;do{k=R(2,6);t=R(2,12);const s=R(2,9);S=s+t;F=k*s+t;}while(F<28||F>50||F-S<20);
return {type:'num',q:`Дедушке ${yrs(F)}, внуку ${yrs(S)}. Сколько лет назад дедушка был старше внука в ${raz(k)}?`,ans:t,
short:`${M(`${F} − t = ${k}(${S} − t)`)} → t = ${t}.`,
explain:`t лет назад: ${F} − t и ${S} − t.<br>${M(`${F} − t = ${k}(${S} − t)`)} → ${M(`${F} − t = ${k*S} − ${k}t`)} → ${M(`${k-1===1?'':k-1}t = ${k*S-F}`)} → t = <b>${t}</b>.`,
explain2:`Проверка: ${t} лет назад: ${F-t} и ${S-t}, ${F-t} = ${k}·${S-t} ✅. Разница ${F-S} лет постоянна: это ${k-1} внуковых возраста → внуку тогда ${(F-S)/(k-1)}.`};});

/* L3 движение */
G(3,()=>{const o=mk('навстречу — v₁ + v₂, вдогонку — v₁ − v₂',['навстречу — v₁ − v₂, вдогонку — v₁ + v₂','в обоих случаях v₁ + v₂','навстречу — v₁ · v₂, вдогонку — v₁ : v₂']);
return {type:'choice',q:'С какой скоростью сокращается расстояние между двумя объектами (v₁ > v₂)?',...o,short:'Навстречу скорости складываются, вдогонку вычитаются.',
explain:`Навстречу оба «съедают» расстояние: за час на v₁ + v₂. Вдогонку быстрый приближается, а медленный убегает: за час расстояние сокращается на v₁ − v₂.`,
explain2:`Пример: 50 и 30 км/ч. Навстречу за час сближаются на 80 км. В одну сторону — на 20 км (быстрый проехал 50, медленный убежал на 30).`};},'r');
G(3,()=>{let v1,v2,t,S;do{v1=R(4,18)*5;v2=R(4,18)*5;t=pick([1,1.5,2,2.5,3,4]);S=(v1+v2)*t;}while(!Number.isInteger(S)||S>600);
const who=pick([['Два поезда','выехали','городов'],['Два дрона','вылетели','баз'],['Два автобуса','выехали','городов']]);
return {type:'num',q:`${who[0]} ${who[1]} одновременно навстречу друг другу из ${who[2]}, расстояние между которыми ${S} км. Скорости ${v1} и ${v2} км/ч. Через сколько часов они встретятся?`,ans:t,keys:NUMKEYS,pic:road({mode:'meet',v1:v1+' км/ч',v2:v2+' км/ч',S:S+' км'}),
short:`${S} : (${v1} + ${v2}) = ${n(t)} ч.`,
explain:`Скорость сближения: ${v1} + ${v2} = ${v1+v2} км/ч.<br>Время: ${M(`t = ${fr(S,v1+v2)} = ${n(t)}`)} ч.<br>Уравнением: ${M(`${v1}t + ${v2}t = ${S}`)}.`,
explain2:`Проверка: за ${n(t)} ч первый проедет ${n(v1*t)} км, второй ${n(v2*t)} км, вместе ${S} км ✅ — встретились.`};});
G(3,()=>{let v1,v2,t,S;do{v1=R(3,20)*5;v2=R(3,20)*5;t=R(2,5);S=(v1+v2)*t;}while(S>700);
return {type:'num',q:`Из двух сёл, расстояние между которыми ${S} км, одновременно навстречу выехали два мотоциклиста. Через ${t} ч они встретились. Скорость первого ${v1} км/ч. Найди скорость второго (в км/ч).`,ans:v2,
short:`${M(`${t}(${v1} + x) = ${S}`)} → x = ${v2}.`,
explain:`Вместе за ${t} ч они проехали все ${S} км: ${M(`${t}(${v1} + x) = ${S}`)} → ${M(`${v1} + x = ${S/t}`)} → x = <b>${v2}</b> км/ч.`,
explain2:`Первый проехал ${v1}·${t} = ${v1*t} км, второму осталось ${S} − ${v1*t} = ${S-v1*t} км за ${t} ч: ${S-v1*t} : ${t} = ${v2} км/ч.`};});
G(3,()=>{let v1,v2,t0,t;do{v2=R(3,6);v1=R(10,24);t0=pick([0.5,1,1.5,2]);t=v2*t0/(v1-v2);}while(!Number.isInteger(t*4)||t<=0);
const d=v2*t0;
return {type:'num',q:`Пешеход вышел из посёлка со скоростью ${v2} км/ч. Через ${n(t0)} ч за ним выехал велосипедист со скоростью ${v1} км/ч. Через сколько часов после своего выезда велосипедист догонит пешехода?`,ans:t,keys:NUMKEYS,pic:road({mode:'chase',v1:v1+' км/ч',v2:v2+' км/ч',gap:150,A:'посёлок',B:''}),
short:`Фора ${n(d)} км, догон ${v1} − ${v2} = ${v1-v2} км/ч → ${n(t)} ч.`,
explain:`За ${n(t0)} ч пешеход ушёл на ${v2}·${n(t0)} = ${n(d)} км.<br>Скорость догона: ${v1} − ${v2} = ${v1-v2} км/ч.<br>${M(`t = ${fr(n(d),v1-v2)} = ${n(t)}`)} ч.<br>Уравнением: ${M(`${v1}t = ${v2}(t + ${n(t0)})`)}.`,
explain2:`Проверка: за ${n(t)} ч велосипедист проедет ${n(v1*t)} км, пешеход к этому моменту идёт ${n(t+t0)} ч и пройдёт ${n(v2*(t+t0))} км — поровну ✅.`};});
G(3,()=>{const t=R(2,4),d=R(2,6)*5,x=R(6,14)*5,S=t*(2*x+d);const ok=M(`${t}(x + x + ${d}) = ${S}`);
const o=mk(ok,[M(`${t}x + x + ${d} = ${S}`),M(`${t}(x + ${d}) = ${S}`),M(`x + x + ${d} = ${S}·${t}`)]);
return {type:'choice',q:`Из A и B, расстояние между которыми ${S} км, навстречу друг другу выехали две машины. Скорость одной на ${d} км/ч больше, чем другой. Встретились через ${t} ч. Скорость медленной — x км/ч. Какое уравнение верное?`,...o,
short:`Скорость сближения x + (x + ${d}), за ${t} ч — ${S} км.`,
explain:`Скорости: x и x + ${d}. Сближаются со скоростью x + x + ${d}. За ${t} ч: ${ok} → x = ${x}.<br>В варианте «${t}x + x + ${d}» на ${t} умножена только одна скорость.`,
explain2:`Можно и так: ${M(`${t}x + ${t}(x + ${d}) = ${S}`)} — путь первой + путь второй = всё расстояние. Раскрой скобки — это то же самое уравнение.`};});

/* L4 река */
G(4,()=>{const o=mk('по течению v + u, против течения v − u, плот — со скоростью u',['по течению v − u, против течения v + u, плот — со скоростью u','по течению v + u, против течения v − u, плот стоит на месте','по течению и против течения — v, течение не влияет']);
return {type:'choice',q:'Собственная скорость лодки v, скорость течения u. Какие утверждения верны?',...o,short:'По течению +u, против −u, плот = u.',
explain:`Вода сама движется со скоростью u и несёт всё, что в ней. По течению скорости складываются: v + u; против — течение тормозит: v − u. Плот без мотора просто плывёт с водой: u.`,
explain2:`Траволатор в аэропорту: идёшь по нему — быстрее, против — медленнее, стоишь на нём — всё равно едешь со скоростью ленты (как плот).`};},'r');
G(4,()=>{let v,u,t,S;do{v=R(8,30);u=R(1,5);t=pick([2,3,4,1.5,2.5]);S=(v+u)*t;}while(!Number.isInteger(S));const dir=pick(['по','против']);const sp=dir==='по'?v+u:v-u;const tt=S/sp;
const fine=Number.isInteger(tt*4);const T=fine?tt:t;const SS=fine?S:sp*t;
return {type:'num',q:`Собственная скорость катера ${v} км/ч, скорость течения ${u} км/ч. За сколько часов катер пройдёт ${SS} км <b>${dir} течению</b>?`,ans:fine?tt:t,keys:NUMKEYS,
short:`${dir==='по'?`${v} + ${u}`:`${v} − ${u}`} = ${sp} км/ч → ${SS} : ${sp} = ${n(fine?tt:t)} ч.`,
explain:`${dir==='по'?'По течению скорости складываются':'Против течения течение вычитается'}: ${dir==='по'?`${v} + ${u}`:`${v} − ${u}`} = ${sp} км/ч.<br>t = ${SS} : ${sp} = <b>${n(fine?tt:t)}</b> ч.`,
explain2:`Ловушка — взять собственную скорость ${v}: получилось бы ${n(SS/v)} ч. Но река ${dir==='по'?'помогает':'мешает'}, так что скорость ${sp}.`};});
G(4,()=>{let v,u;do{v=R(8,30);u=R(1,6);}while(u>=v);const a=v+u,b=v-u;const ask=pick(['u','v']);
return {type:'num',q:`Лодка идёт по течению со скоростью ${a} км/ч, а против течения — ${b} км/ч. Найди ${ask==='u'?'скорость течения':'собственную скорость лодки'} (км/ч).`,ans:ask==='u'?u:v,
short:ask==='u'?`(${a} − ${b}) : 2 = ${u}.`:`(${a} + ${b}) : 2 = ${v}.`,
explain:`${M(`v + u = ${a}`)}, ${M(`v − u = ${b}`)}. Разница между ними — два течения: ${a} − ${b} = 2u → u = ${u}. Сумма — две собственные скорости: ${a} + ${b} = 2v → v = ${v}.<br>Ответ: <b>${ask==='u'?u:v}</b>.`,
explain2:`Собственная скорость — «середина» между ${b} и ${a}: это ${v}. Течение — расстояние от середины до краёв: ${u}.`};});
G(4,()=>{let u,t1,t2,v;do{u=R(1,4);t1=R(2,6);t2=R(t1+1,t1+4);v=u*(t1+t2)/(t2-t1);}while(!Number.isInteger(v)||v>40||v<=u);
return {type:'num',q:`Катер прошёл по течению за ${t1} ч столько же, сколько против течения за ${t2} ч. Скорость течения ${u} км/ч. Найди собственную скорость катера (км/ч).`,ans:v,
short:`${M(`${t1}(x + ${u}) = ${t2}(x − ${u})`)} → x = ${v}.`,
explain:`Собственная скорость x. По течению x + ${u}, против x − ${u}. Пути равны:<br>${M(`${t1}(x + ${u}) = ${t2}(x − ${u})`)} → ${M(`${t1}x + ${t1*u} = ${t2}x − ${t2*u}`)} → ${M(`${t2-t1===1?'':t2-t1}x = ${(t1+t2)*u}`)} → x = <b>${v}</b>.`,
explain2:`Проверка: по течению ${t1}·${v+u} = ${t1*(v+u)} км, против ${t2}·${v-u} = ${t2*(v-u)} км — равно ✅.`};});

/* L5 работа */
G(5,()=>{const o=mk('за 1 час он делает 1/a работы, а при совместной работе части за час складываются',['за 1 час он делает a работы, при совместной работе времена складываются','при совместной работе время равно среднему a и b','за 1 час он делает 1/a работы, а при совместной работе времена складываются']);
return {type:'choice',q:'Мастер делает всю работу за a часов. Что верно?',...o,short:'Производительность 1/a; вместе — сумма производительностей.',
explain:`Работа = 1. За a часов — вся, значит, за 1 час — ${M(fr(1,'a'))} (производительность). Когда работают вдвоём, за час они делают ${M(`${fr(1,'a')} + ${fr(1,'b')}`)}. Складываются именно доли работы за час, а не времена: вместе работа идёт <b>быстрее</b>.`,
explain2:`Пицца: ты съедаешь её за 4 мин (¼ в минуту), друг за 4 мин (¼). Вместе — ½ пиццы в минуту, вся за 2 мин, а не за 8 и не за 4.`};},'r');
const workPairs=[];for(let a=2;a<=30;a++)for(let b=a;b<=60;b++){const t=a*b/(a+b);if(Number.isInteger(t))workPairs.push([a,b,t]);}
G(5,()=>{const [a,b,t]=pick(workPairs);const s=pick([['Первая труба наполняет бассейн','вторая','обе трубы','наполнят бассейн'],['Первый принтер печатает тираж','второй','оба принтера','напечатают тираж'],['Артём проходит уровень в игре','Паша','вдвоём (в кооперативе)','пройдут уровень']]);
return {type:'num',q:`${s[0]} за ${a} ч, ${s[1]} — за ${b} ч. За сколько часов ${s[2]} ${s[3]}, работая вместе?`,ans:t,keys:NUMKEYS,
short:`${fr(1,a)} + ${fr(1,b)} = ${fr(1,t)} → ${t} ч.`,
explain:`За час: первый ${fr(1,a)}, второй ${fr(1,b)} работы. Вместе: ${fr(1,a)} + ${fr(1,b)} = ${fr(b/gcd(a,b)+a/gcd(a,b),a*b/gcd(a,b))} = ${fr(1,t)}.<br>Значит, вся работа — за <b>${t} ч</b>.<br>Уравнение: ${M(`${fr('t',a)} + ${fr('t',b)} = 1`)}.`,
explain2:`Проверка: за ${t} ч первый сделает ${rat(t,a)}, второй ${rat(t,b)} — вместе 1 ✅. И ${t} меньше ${a} — вдвоём быстрее самого быстрого, как и должно быть.`};});
G(5,()=>{const [a,b,t]=pick(workPairs.filter(p=>p[0]!==p[1]));
return {type:'num',q:`Два насоса вместе откачивают воду из котлована за ${t} ч. Первый в одиночку справился бы за ${a} ч. За сколько часов справится второй в одиночку?`,ans:b,
short:`${fr(1,t)} − ${fr(1,a)} = ${fr(1,b)} → ${b} ч.`,
explain:`Вместе за час: ${fr(1,t)}. Первый: ${fr(1,a)}. Второй: ${fr(1,t)} − ${fr(1,a)} = ${fr(a/gcd(a,t)-t/gcd(a,t),a*t/gcd(a,t))} = ${fr(1,b)}.<br>Значит, один второй — за <b>${b} ч</b>.`,
explain2:`Проверка: ${fr(1,a)} + ${fr(1,b)} = ${fr(1,t)} ✅. Второй медленнее первого (${b} > ${a}) — логично, ведь вдвоём всего ${t} ч.`};});
G(5,()=>{let a,b,t;do{a=R(2,12);b=R(a+1,30);t=a*b/(b-a);}while(!Number.isInteger(t)||t>60);
return {type:'num',q:`Кран наполняет ванну за ${a} мин, а слив опустошает полную ванну за ${b} мин. Пустую ванну начали наполнять, забыв закрыть слив. За сколько минут она наполнится?`,ans:t,
short:`${fr(1,a)} − ${fr(1,b)} = ${fr(1,t)} → ${t} мин.`,
explain:`За минуту кран наливает ${fr(1,a)}, слив выливает ${fr(1,b)}. Итого прибывает ${fr(1,a)} − ${fr(1,b)} = ${fr(1,t)} ванны.<br>Вся ванна — за <b>${t} мин</b>.`,
explain2:`Слив работает «против» — его производительность вычитаем. Проверка: за ${t} мин налито ${rat(t,a)}, вылито ${rat(t,b)}, разница ${rat(t*b-t*a,a*b)} = 1 ✅.`};});

/* L6 проценты */
G(6,()=>{const o=mk(M('A·(1 + p/100)'),[M('A + p'),M('A·p/100'),M('A·(1 − p/100)')]);
return {type:'choice',q:'Цену A увеличили на p%. Какой стала цена?',...o,short:'Новая цена = A + A·p/100 = A(1 + p/100).',
explain:`p% от A — это ${M('A·p/100')}. Прибавляем к старой цене: ${M('A + A·p/100 = A(1 + p/100)')}. Например, 500 + 20% = 500·1,2 = 600.<br>«A + p» — путает проценты с рублями; «A·p/100» — это только прибавка, а не новая цена.`,
explain2:`100% — вся старая цена. После увеличения на p% стало 100% + p%, то есть (100 + p)/100 от A. Для 20%: 120% = 1,2.`};},'r');
G(6,()=>{const A=R(4,60)*100,p=pick([5,10,15,20,25,30,40]);const ans=A*(100-p)/100;const it=pick(['Наушники стоили','Кроссовки стоили','Игровая мышь стоила','Рюкзак стоил']);
return {type:'num',q:`${it} ${A} ₽. В «чёрную пятницу» скидка ${p}%. Сколько рублей теперь стоит товар?`,ans,keys:NUMKEYS,
short:`${A}·${n((100-p)/100)} = ${n(ans)} ₽.`,
explain:`Скидка: ${p}% от ${A} = ${A}·${n(p/100)} = ${n(A*p/100)} ₽. Новая цена: ${A} − ${n(A*p/100)} = <b>${n(ans)}</b> ₽.<br>Или сразу: осталось ${100-p}% → ${A}·${n((100-p)/100)} = ${n(ans)}.`,
explain2:`1% от ${A} — это ${n(A/100)} ₽. Значит, ${100-p}% — ${n(A/100)}·${100-p} = ${n(ans)} ₽.`};});
G(6,()=>{const p=pick([10,20,25,40,50]);let x;do{x=R(10,90)*100;}while(!Number.isInteger(x*(100-p)/100)||!Number.isInteger(x*(100-p)/10000*100));const X=x*(100-p)/100;
return {type:'num',q:`После скидки ${p}% смартфон стоит ${n(X)} ₽. Сколько он стоил до скидки?`,ans:x,
short:`${M(`${n((100-p)/100)}x = ${n(X)}`)} → x = ${n(x)}.`,
explain:`Старая цена x. После скидки осталось ${100-p}%: ${M(`${n((100-p)/100)}x = ${n(X)}`)} → x = ${n(X)} : ${n((100-p)/100)} = <b>${n(x)}</b> ₽.<div class="box err"><b>Ловушка</b>Прибавить ${p}% к ${n(X)}: получится ${n(X*(100+p)/100)} — неверно, ведь ${p}% считались от <b>старой</b> цены, а не от новой.</div>`,
explain2:`${n(X)} ₽ — это ${100-p}% старой цены. 1% = ${n(X)} : ${100-p} = ${n(X/(100-p))} ₽, 100% = ${n(x)} ₽. Проверка: ${n(x)}·${n((100-p)/100)} = ${n(X)} ✅.`};});
G(6,()=>{const p=pick([10,20,30,40,50]);const up=Math.random()<0.5;const A=1000;
return {type:'num',q:`Цену товара сначала ${up?'повысили':'снизили'} на ${p}%, а потом ${up?'снизили':'повысили'} на ${p}%. На сколько процентов итоговая цена <b>ниже</b> первоначальной?`,ans:p*p/100,keys:NUMKEYS,
short:`×${n(1+p/100)}·${n(1-p/100)} = ×${n(1-p*p/10000)} → ниже на ${n(p*p/100)}%.`,

G(6,()=>{const p=pick([20,25,30,40,60,75]);let T;do{T=R(4,40)*20;}while(!Number.isInteger(T*(100-p)/100));const left=T*(100-p)/100;

explain:`Если прочитано ${p}%, осталось ${100-p}%. Пусть в книге x страниц: ${M(`${n((100-p)/100)}x = ${left}`)} → x = <b>${T}</b>.<br>Ловушка: считать, что ${left} — это ${p}%. Нет, ${left} — это оставшиеся ${100-p}%.`,

/* L7 монеты и цифры */
G(7,()=>{const o=mk(M('10a + b'),[M('a + b'),M('a·b'),M('10b + a')]);
return {type:'choice',q:'Как записать двузначное число, у которого a десятков и b единиц?',...o,short:'10a + b.',
explain:`a десятков = 10·a, плюс b единиц: ${M('10a + b')}. Пример: 37 = 10·3 + 7.<br>a + b — это сумма цифр (10), a·b — произведение (21), 10b + a — число, записанное наоборот (73).`,
explain2:`Запись «ab» в алгебре означает a·b (умножение!). Поэтому для числа из цифр пишут 10a + b — так буквы не перепутаются с произведением.`};},'r');
G(7,()=>{let N,x,c1,c2;do{[c1,c2]=pick([[2,5],[2,10],[5,10]]);N=R(8,30);x=R(1,N-1);}while(false);const S=c2*x+c1*(N-x);
return {type:'num',q:`В копилке ${N} ${plural(N,'монета','монеты','монет')} по ${c1} ₽ и ${c2} ₽, всего на сумму ${S} ₽. Сколько монет по ${c2} ₽?`,ans:x,
short:`${M(`${c2===1?'':c2}x + ${c1===1?'':c1}(${N} − x) = ${S}`)} → x = ${x}.`,
explain:`Монет по ${c2} ₽ — x, по ${c1} ₽ — ${N} − x.<br>${M(`${c2}x + ${c1}(${N} − x) = ${S}`)} → ${M(`${c2}x + ${c1*N} − ${c1}x = ${S}`)} → ${M(`${c2-c1===1?'':c2-c1}x = ${S-c1*N}`)} → x = <b>${x}</b>.`,
explain2:`Без x: если бы все ${N} монет были по ${c1} ₽, вышло бы ${c1*N} ₽. Не хватает ${S-c1*N} ₽. Каждая замена ${c1}-рублёвой на ${c2}-рублёвую добавляет ${c2-c1} ₽ → замен ${S-c1*N} : ${c2-c1} = ${x}.`};});
G(7,()=>{let a,b;do{a=R(1,8);b=R(a+1,9);}while(false);const s=a+b,d=9*(b-a),N=10*a+b;
return {type:'num',q:`Сумма цифр двузначного числа равна ${s}. Если поменять цифры местами, число увеличится на ${d}. Найди это число.`,ans:N,
short:`a + b = ${s}, 9(b − a) = ${d} → ${N}.`,
explain:`Цифра десятков a, единиц ${s} − a. Число ${M(`10a + (${s} − a) = 9a + ${s}`)}, переставленное ${M(`10(${s} − a) + a = ${10*s} − 9a`)}.<br>${M(`${10*s} − 9a − (9a + ${s}) = ${d}`)} → ${M(`${9*s} − 18a = ${d}`)} → a = ${a}.<br>Число <b>${N}</b> (${10*b+a} − ${N} = ${d} ✅).`,
explain2:`Хитрость: при перестановке цифр разность = 9·(разность цифр). ${d} : 9 = ${b-a} — цифры отличаются на ${b-a}, а в сумме ${s}. Значит, ${a} и ${b}; увеличилось — значит, меньшая цифра впереди: ${N}.`};});
G(7,()=>{const x=R(10,99),c=R(0,9),D=9*x+c;
return {type:'num',q:`К двузначному числу справа приписали цифру ${c}, и оно увеличилось на ${D}. Найди исходное число.`,ans:x,
short:`${M(`10x + ${c} − x = ${D}`)} → x = ${x}.`,
explain:`Приписать цифру справа — значит умножить на 10 и прибавить её: число x станет ${M(`10x + ${c}`)}.<br>${M(`10x + ${c} − x = ${D}`)} → ${M(`9x = ${D-c}`)} → x = <b>${x}</b>.`,
explain2:`Проверка: ${x} → ${10*x+c}, разница ${10*x+c} − ${x} = ${D} ✅. Ловушка — считать, что приписывание цифры прибавляет ${c}: на самом деле число «сдвигается» на разряд.`};});

/* L8 ★ */
G(8,()=>{const o=mk('когда быстрый пробежит ровно на один круг больше медленного',['когда быстрый пробежит два круга','когда они вместе пробегут один круг','когда медленный пробежит половину круга']);
return {type:'choice',q:'Два бегуна стартуют одновременно из одной точки круговой трассы в одну сторону. Когда быстрый впервые догонит медленного?',...o,short:'Обгон на круг: (v₁ − v₂)·t = L.',
explain:`Быстрый «убегает» от медленного со скоростью v₁ − v₂. Догнать сзади он сможет, только отстав… то есть обойдя его на целый круг L: ${M('(v₁ − v₂)t = L')}.<br>«Вместе пробегут круг» — это про движение <b>навстречу</b>.`,
explain2:`Представь, что медленный стоит на месте, а быстрый бежит со скоростью v₁ − v₂. Чтобы снова оказаться рядом, нужно пробежать весь круг.`};},'r');
G(8,()=>{const k=R(1,10);const t=60*k/11;
let tb=null;for(let i=1;i<=11*60*12;i++){const m=i/11;const mh=(6*m)%360,hh=(30*k+0.5*m)%360;if(Math.abs(mh-hh)<1e-7||Math.abs(Math.abs(mh-hh)-360)<1e-7){tb=m;break;}}
return {type:'num',q:`Сейчас ровно ${k}:00. Через сколько минут минутная и часовая стрелки <b>впервые</b> совпадут? (Ответ — дробь, например 60/11.)`,ans:tb,ansText:rat(60*k,11)+' мин',keys:NUMKEYS,ph:NUMPH,hint:'Минутная: 6° в минуту, часовая: 0,5° в минуту. Минутной надо догнать часовую, которая впереди на 30·'+k+'°.',
short:`${M(`6t = ${30*k} + 0,5t`)} → t = ${rat(60*k,11)} мин.`,
explain:`В ${k}:00 часовая стрелка впереди минутной на ${30*k}° (каждый час — 30°). Минутная догоняет со скоростью 6 − 0,5 = 5,5° в минуту.<br>${M(`5,5t = ${30*k}`)} → ${M(`t = ${fr(30*k,'5,5')} = ${fr(60*k,11)}`)} = <b>${rat(60*k,11)}</b> мин ≈ ${n(Math.round(t*100)/100)} мин.`,
explain2:`Задача «вдогонку» по кругу! За 12 часов стрелки совпадают 11 раз, равномерно, — каждые ${fr(720,11)} мин = ${fr(12,11)} ч. После ${k}:00 первое совпадение — ${k}-е по счёту от полудня: ${k}·${fr(720,11)} − ${k*60} = ${rat(60*k,11)} мин.`};},'s');
G(8,()=>{let L,v1,v2,t;do{L=pick([400,600,800,1000,1200]);v1=R(15,40)*10;v2=R(10,35)*10;t=L/(v1-v2);}while(v1<=v2||!Number.isInteger(t*2));const opp=Math.random()<0.4;const t2=L/(v1+v2);
if(opp&&Number.isInteger(t2*4))return {type:'num',q:`По круговой дорожке длиной ${L} м из одной точки в <b>противоположные стороны</b> стартовали два велосипедиста: ${v1} м/мин и ${v2} м/мин. Через сколько минут они впервые встретятся?`,ans:t2,keys:NUMKEYS,
short:`${L} : (${v1} + ${v2}) = ${n(t2)} мин.`,explain:`Навстречу по кругу: вместе они должны проехать весь круг. ${M(`(${v1} + ${v2})t = ${L}`)} → t = ${L} : ${v1+v2} = <b>${n(t2)}</b> мин.`,explain2:`Проверка: ${v1}·${n(t2)} + ${v2}·${n(t2)} = ${n(v1*t2)} + ${n(v2*t2)} = ${L} м ✅.`};
return {type:'num',q:`По круговой дорожке длиной ${L} м из одной точки в <b>одну сторону</b> стартовали два велосипедиста: ${v1} м/мин и ${v2} м/мин. Через сколько минут быстрый впервые догонит медленного?`,ans:t,keys:NUMKEYS,hint:'Быстрый должен проехать на целый круг больше.',
short:`${L} : (${v1} − ${v2}) = ${n(t)} мин.`,
explain:`Быстрый догонит, обогнав на целый круг: ${M(`${v1}t − ${v2}t = ${L}`)} → ${M(`${v1-v2}t = ${L}`)} → t = <b>${n(t)}</b> мин.`,
explain2:`Проверка: за ${n(t)} мин быстрый проедет ${n(v1*t)} м, медленный ${n(v2*t)} м. Разница ${n((v1-v2)*t)} = ${L} — ровно круг ✅.`};},'s');
G(8,()=>{let v1,v2,w,S,t;do{v1=R(5,16)*5;v2=R(5,16)*5;w=R(16,30)*5;t=pick([1,1.5,2,2.5,3]);S=(v1+v2)*t;}while(w<=Math.max(v1,v2)+20||!Number.isInteger(S));
return {type:'num',q:`Два поезда идут навстречу друг другу: ${v1} км/ч и ${v2} км/ч, сейчас между ними ${S} км. С носа первого поезда вылетает муха (${w} км/ч), летит до второго, разворачивается, летит к первому — и так, пока поезда не встретятся. Сколько километров пролетит муха?`,ans:w*t,keys:NUMKEYS,hint:'Не считай перелёты. Сколько времени летает муха?',
short:`Поезда встретятся через ${S} : ${v1+v2} = ${n(t)} ч → муха ${w}·${n(t)} = ${n(w*t)} км.`,
explain:`Хитрость: муха летает ровно столько, сколько поезда едут до встречи.<br>Время встречи: ${S} : (${v1} + ${v2}) = ${n(t)} ч.<br>Путь мухи: ${w}·${n(t)} = <b>${n(w*t)} км</b>.`,
explain2:`Можно складывать перелёты: первый — ${S} : (${w} + ${v2}) ч, потом расстояние меньше… Получится бесконечная сумма, которая в итоге равна тому же ${n(w*t)}. Но зачем, если скорость × время даёт ответ за секунду?`};},'s');
const dioph=[];{const D=[2,3,4,5,6,7,8,9,10,12];for(let i=0;i<D.length;i++)for(let j=i+1;j<D.length;j++)for(let k=j+1;k<D.length;k++){const ds=[D[i],D[j],D[k]];const Lc=ds.reduce((a,b)=>H.lcm(a,b));for(let x=Lc;x<=100;x+=Lc){if(x<40)continue;const used=ds.reduce((s,d)=>s+x/d,0);const rest=x-used;if(rest>=4&&rest<=20)dioph.push({ds,x,rest});}}}
G(8,()=>{const c=pick(dioph);const ds=shuffle(c.ds);const p=R(1,c.rest-1),q=c.rest-p;const nm=pick(['Древний мудрец','Учёный-путешественник','Старый капитан']);
let bx=null;for(let x=1;x<=200;x++){if(ds.every(d=>x%d===0)&&ds.reduce((s,d)=>s+x/d,0)+p+q===x){bx=x;break;}}
return {type:'num',q:`${nm} провёл ${fr(1,ds[0])} жизни в детстве, ${fr(1,ds[1])} — в учёбе, ${fr(1,ds[2])} — в странствиях. Затем ${p} ${plural(p,'год','года','лет')} он строил корабль и ещё ${q} ${plural(q,'год','года','лет')} плавал на нём. Сколько лет он прожил?`,ans:bx,hint:'Пусть он прожил x лет. Сложи все части жизни и приравняй к x.',
short:`${M(`${fr('x',ds[0])} + ${fr('x',ds[1])} + ${fr('x',ds[2])} + ${c.rest} = x`)} → x = ${bx}.`,
explain:`Пусть x лет. ${M(`${fr('x',ds[0])} + ${fr('x',ds[1])} + ${fr('x',ds[2])} + ${p} + ${q} = x`)}.<br>Дроби вместе: ${M(`${fr(1,ds[0])} + ${fr(1,ds[1])} + ${fr(1,ds[2])} = ${rat(c.x-c.rest,c.x)}`)}. Значит, ${p} + ${q} = ${c.rest} лет — это оставшиеся ${rat(c.rest,c.x)} жизни.<br>x = ${c.rest} : ${rat(c.rest,c.x)} = <b>${bx}</b>.`,
explain2:`Проверка: ${ds.map(d=>`${bx} : ${d} = ${bx/d}`).join(', ')}; ${ds.map(d=>bx/d).join(' + ')} + ${p} + ${q} = ${bx} ✅. Подсказка для угадывания: x должен делиться на ${ds.join(', ')} — это сразу сужает поиск.`};},'s');
G(8,()=>{let a,b,S,ways;do{[a,b]=pick([[2,5],[3,5],[2,7],[5,10],[3,7],[2,10]]);S=R(20,60);ways=[];for(let x=0;x*a<=S;x++){const r=S-a*x;if(r%b===0)ways.push([x,r/b]);}}while(ways.length<2||ways.length>12);
return {type:'num',q:`Сколькими способами можно набрать ровно ${S} ₽ монетами по ${a} ₽ и ${b} ₽? (Монет каждого вида сколько угодно; можно обойтись монетами одного вида.)`,ans:ways.length,hint:`Перебирай число ${b}-рублёвых монет y = 0, 1, 2… и смотри, делится ли остаток на ${a}.`,
short:`${ways.map(w=>`${w[0]}×${a} + ${w[1]}×${b}`).join('; ')} — ${ways.length} ${plural(ways.length,'способ','способа','способов')}.`,
explain:`Уравнение ${M(`${a}x + ${b}y = ${S}`)} в целых неотрицательных числах. Перебираем:<br>${ways.map(w=>`x = ${w[0]}, y = ${w[1]}`).join('<br>')}<br>Всего <b>${ways.length}</b>.`,
explain2:`Найдя одно решение, остальные получаем «обменом»: ${b/gcd(a,b)} монет по ${a} ₽ = ${a/gcd(a,b)} монет по ${b} ₽ (обе дают ${a*b/gcd(a,b)} ₽). Обмениваем, пока монет хватает: ${ways.length} вариантов.`};},'s');
const dmove=[];for(let d=1;d<=9;d++)for(let k=2;k<=9;k++){const num=d*(k*100000-1),den=10-k;if(num%den===0){const x=num/den;if(x>=10000&&x<100000)dmove.push({d,k,N:d*100000+x,x});}}

return {type:'num',q:`Шестизначное число начинается с цифры ${c.d}. Если эту цифру перенести с первого места в конец, получится число, в ${raz(c.k)} большее исходного. Найди исходное число.`,ans:c.N,hint:`Пусть x — пятизначное число из последних пяти цифр. Тогда исходное ${c.d}·100000 + x, новое 10x + ${c.d}.`,
short:`${M(`10x + ${c.d} = ${c.k}(${c.d*100000} + x)`)} → x = ${c.x}, число ${c.N}.`,
explain:`Обозначим x — число из последних пяти цифр. Исходное: ${M(`${c.d*100000} + x`)}. После переноса: ${M(`10x + ${c.d}`)}.<br>${M(`10x + ${c.d} = ${c.k}(${c.d*100000} + x)`)} → ${M(`${10-c.k}x = ${c.k*c.d*100000-c.d}`)} → x = ${c.x}.<br>Ответ: <b>${c.N}</b>. Проверка: ${c.N}·${c.k} = ${c.N*c.k} ✅.`,
explain2:`Числа вида 142857 — «циклические»: 142857·2 = 285714, ·3 = 428571, ·5 = 714285 — те же цифры по кругу. Это период дроби 1/7 = 0,(142857). Олимпиадники любят эту «магию».`};},'s');
G(8,()=>{let M0,p1,p2,ans;do{M0=R(2,30)*10;p1=pick([99,98,95,90]);p2=pick([98,96,95,90,80,75,50].filter(v=>v<p1));ans=M0*(100-p1)/(100-p2);}while(!Number.isInteger(ans*2)||ans<1);

short:`Сухого ${n(dry)} кг = ${100-p2}% новой массы → ${n(ans)} кг.`,
explain:`Сухое вещество: ${100-p1}% от ${M0} = ${n(dry)} кг. Оно не меняется!<br>Теперь оно составляет ${100-p2}% массы: ${M(`${n((100-p2)/100)}x = ${n(dry)}`)} → x = <b>${n(ans)}</b> кг.${p1===99&&p2===98?' Масса уменьшилась вдвое — хотя «процент воды упал всего на 1»! Это знаменитый «арбузный парадокс».':''}`,
explain2:`Посмотри на долю сухого: была ${100-p1}%, стала ${100-p2}% — в ${n((100-p2)/(100-p1))} раза больше. Само сухое не менялось, значит, вся масса уменьшилась в ${n((100-p2)/(100-p1))} раза: ${M0} : ${n((100-p2)/(100-p1))} = ${n(ans)} кг.`};},'s');
