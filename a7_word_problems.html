/* L7 монеты и цифры */
G(7,()=>{const o=mk(M('10a + b'),[M('a + b'),M('a·b'),M('10b + a')]);
return {type:'choice',q:'Как записать двузначное число, у которого a десятков и b единиц?',...o,short:'10a + b.',
explain:`a десятков = 10·a, плюс b единиц: ${M('10a + b')}. Пример: 37 = 10·3 + 7.<br>a + b — это сумма цифр (10), a·b — произведение (21), 10b + a — число, записанное наоборот (73).`,
explain2:`Запись «ab» в алгебре означает a·b (умножение!). Поэтому для числа из цифр пишут 10a + b — так буквы не перепутаются с произведением.`};},'r');
G(7,()=>{let N,x,c1,c2;do{[c1,c2]=pick([[2,5],[2,10],[5,10]]);N=R(8,30);x=R(1,N-1);}while(false);const S=c2*x+c1*(N-x);
return {type:'num',q:`В копилке ${N} ${plural(N,'монета','монеты','монет')} по ${c1} ₽ и ${c2} ₽, всего на сумму ${S} ₽. Сколько монет по ${c2} ₽?`,ans:x,
short:`${M(`${c2===1?'':c2}x + ${c1===1?'':c1}(${N} − x) = ${S}`)} → x = ${x}.`,
explain:`Монет по ${c2} ₽ — x, по ${c1} ₽ — ${N} − x.<br>${M(`${c2}x + ${c1}(${N} − x) = ${S}`)} → ${M(`${c2}x + ${c1*N} − ${c1}x = ${S}`)} → ${M(`${c2-c1===1?'':c2-c1}x = ${S-c1*N}`)} → x = <b>${x}</b>.`,
explain2:`Без x: если бы все ${N} монет были по ${c1} ₽, вышло бы ${c1*N} ₽. Не хватает ${S-c1*N} ₽. Каждая замена ${c1}-рублёвой на ${c2}-рублёвую добавляет ${c2-c1} ₽ → замен ${S-c1*N} : ${c2-c1} = ${x}.`};});
G(7,()=>{let a,b;do{a=R(1,8);b=R(a+1,9);}while(false);const s=a+b,d=9*(b-a),N=10*a+b;
return {type:'num',q:`Сумма цифр двузначного числа равна ${s}. Если поменять цифры местами, число увеличится на ${d}. Найди это число.`,ans:N,
short:`a + b = ${s}, 9(b − a) = ${d} → ${N}.`,
explain:`Цифра десятков a, единиц ${s} − a. Число ${M(`10a + (${s} − a) = 9a + ${s}`)}, переставленное ${M(`10(${s} − a) + a = ${10*s} − 9a`)}.<br>${M(`${10*s} − 9a − (9a + ${s}) = ${d}`)} → ${M(`${9*s} − 18a = ${d}`)} → a = ${a}.<br>Число <b>${N}</b> (${10*b+a} − ${N} = ${d} ✅).`,
explain2:`Хитрость: при перестановке цифр разность = 9·(разность цифр). ${d} : 9 = ${b-a} — цифры отличаются на ${b-a}, а в сумме ${s}. Значит, ${a} и ${b}; увеличилось — значит, меньшая цифра впереди: ${N}.`};});
G(7,()=>{const x=R(10,99),c=R(0,9),D=9*x+c;
return {type:'num',q:`К двузначному числу справа приписали цифру ${c}, и оно увеличилось на ${D}. Найди исходное число.`,ans:x,
short:`${M(`10x + ${c} − x = ${D}`)} → x = ${x}.`,
explain:`Приписать цифру справа — значит умножить на 10 и прибавить её: число x станет ${M(`10x + ${c}`)}.<br>${M(`10x + ${c} − x = ${D}`)} → ${M(`9x = ${D-c}`)} → x = <b>${x}</b>.`,
explain2:`Проверка: ${x} → ${10*x+c}, разница ${10*x+c} − ${x} = ${D} ✅. Ловушка — считать, что приписывание цифры прибавляет ${c}: на самом деле число «сдвигается» на разряд.`};});

/* L8 ★ */
G(8,()=>{const o=mk('когда быстрый пробежит ровно на один круг больше медленного',['когда быстрый пробежит два круга','когда они вместе пробегут один круг','когда медленный пробежит половину круга']);
return {type:'choice',q:'Два бегуна стартуют одновременно из одной точки круговой трассы в одну сторону. Когда быстрый впервые догонит медленного?',...o,short:'Обгон на круг: (v₁ − v₂)·t = L.',
explain:`Быстрый «убегает» от медленного со скоростью v₁ − v₂. Догнать сзади он сможет, только отстав… то есть обойдя его на целый круг L: ${M('(v₁ − v₂)t = L')}.<br>«Вместе пробегут круг» — это про движение <b>навстречу</b>.`,
explain2:`Представь, что медленный стоит на месте, а быстрый бежит со скоростью v₁ − v₂. Чтобы снова оказаться рядом, нужно пробежать весь круг.`};},'r');
G(8,()=>{const k=R(1,10);const t=60*k/11;
let tb=null;for(let i=1;i<=11*60*12;i++){const m=i/11;const mh=(6*m)%360,hh=(30*k+0.5*m)%360;if(Math.abs(mh-hh)<1e-7||Math.abs(Math.abs(mh-hh)-360)<1e-7){tb=m;break;}}
return {type:'num',q:`Сейчас ровно ${k}:00. Через сколько минут минутная и часовая стрелки <b>впервые</b> совпадут? (Ответ — дробь, например 60/11.)`,ans:tb,ansText:rat(60*k,11)+' мин',keys:NUMKEYS,ph:NUMPH,hint:'Минутная: 6° в минуту, часовая: 0,5° в минуту. Минутной надо догнать часовую, которая впереди на 30·'+k+'°.',
short:`${M(`6t = ${30*k} + 0,5t`)} → t = ${rat(60*k,11)} мин.`,
explain:`В ${k}:00 часовая стрелка впереди минутной на ${30*k}° (каждый час — 30°). Минутная догоняет со скоростью 6 − 0,5 = 5,5° в минуту.<br>${M(`5,5t = ${30*k}`)} → ${M(`t = ${fr(30*k,'5,5')} = ${fr(60*k,11)}`)} = <b>${rat(60*k,11)}</b> мин ≈ ${n(Math.round(t*100)/100)} мин.`,
explain2:`Задача «вдогонку» по кругу! За 12 часов стрелки совпадают 11 раз, равномерно, — каждые ${fr(720,11)} мин = ${fr(12,11)} ч. После ${k}:00 первое совпадение — ${k}-е по счёту от полудня: ${k}·${fr(720,11)} − ${k*60} = ${rat(60*k,11)} мин.`};},'s');
G(8,()=>{let L,v1,v2,t;do{L=pick([400,600,800,1000,1200]);v1=R(15,40)*10;v2=R(10,35)*10;t=L/(v1-v2);}while(v1<=v2||!Number.isInteger(t*2));const opp=Math.random()<0.4;const t2=L/(v1+v2);
if(opp&&Number.isInteger(t2*4))return {type:'num',q:`По круговой дорожке длиной ${L} м из одной точки в <b>противоположные стороны</b> стартовали два велосипедиста: ${v1} м/мин и ${v2} м/мин. Через сколько минут они впервые встретятся?`,ans:t2,keys:NUMKEYS,
short:`${L} : (${v1} + ${v2}) = ${n(t2)} мин.`,explain:`Навстречу по кругу: вместе они должны проехать весь круг. ${M(`(${v1} + ${v2})t = ${L}`)} → t = ${L} : ${v1+v2} = <b>${n(t2)}</b> мин.`,explain2:`Проверка: ${v1}·${n(t2)} + ${v2}·${n(t2)} = ${n(v1*t2)} + ${n(v2*t2)} = ${L} м ✅.`};
return {type:'num',q:`По круговой дорожке длиной ${L} м из одной точки в <b>одну сторону</b> стартовали два велосипедиста: ${v1} м/мин и ${v2} м/мин. Через сколько минут быстрый впервые догонит медленного?`,ans:t,keys:NUMKEYS,hint:'Быстрый должен проехать на целый круг больше.',
short:`${L} : (${v1} − ${v2}) = ${n(t)} мин.`,
explain:`Быстрый догонит, обогнав на целый круг: ${M(`${v1}t − ${v2}t = ${L}`)} → ${M(`${v1-v2}t = ${L}`)} → t = <b>${n(t)}</b> мин.`,
explain2:`Проверка: за ${n(t)} мин быстрый проедет ${n(v1*t)} м, медленный ${n(v2*t)} м. Разница ${n((v1-v2)*t)} = ${L} — ровно круг ✅.`};},'s');
G(8,()=>{let v1,v2,w,S,t;do{v1=R(5,16)*5;v2=R(5,16)*5;w=R(16,30)*5;t=pick([1,1.5,2,2.5,3]);S=(v1+v2)*t;}while(w<=Math.max(v1,v2)+20||!Number.isInteger(S));
return {type:'num',q:`Два поезда идут навстречу друг другу: ${v1} км/ч и ${v2} км/ч, сейчас между ними ${S} км. С носа первого поезда вылетает муха (${w} км/ч), летит до второго, разворачивается, летит к первому — и так, пока поезда не встретятся. Сколько километров пролетит муха?`,ans:w*t,keys:NUMKEYS,hint:'Не считай перелёты. Сколько времени летает муха?',
short:`Поезда встретятся через ${S} : ${v1+v2} = ${n(t)} ч → муха ${w}·${n(t)} = ${n(w*t)} км.`,
explain:`Хитрость: муха летает ровно столько, сколько поезда едут до встречи.<br>Время встречи: ${S} : (${v1} + ${v2}) = ${n(t)} ч.<br>Путь мухи: ${w}·${n(t)} = <b>${n(w*t)} км</b>.`,
explain2:`Можно складывать перелёты: первый — ${S} : (${w} + ${v2}) ч, потом расстояние меньше… Получится бесконечная сумма, которая в итоге равна тому же ${n(w*t)}. Но зачем, если скорость × время даёт ответ за секунду?`};},'s');
const dioph=[];{const D=[2,3,4,5,6,7,8,9,10,12];for(let i=0;i<D.length;i++)for(let j=i+1;j<D.length;j++)for(let k=j+1;k<D.length;k++){const ds=[D[i],D[j],D[k]];const Lc=ds.reduce((a,b)=>H.lcm(a,b));for(let x=Lc;x<=100;x+=Lc){if(x<40)continue;const used=ds.reduce((s,d)=>s+x/d,0);const rest=x-used;if(rest>=4&&rest<=20)dioph.push({ds,x,rest});}}}
G(8,()=>{const c=pick(dioph);const ds=shuffle(c.ds);const p=R(1,c.rest-1),q=c.rest-p;const nm=pick(['Древний мудрец','Учёный-путешественник','Старый капитан']);
let bx=null;for(let x=1;x<=200;x++){if(ds.every(d=>x%d===0)&&ds.reduce((s,d)=>s+x/d,0)+p+q===x){bx=x;break;}}
return {type:'num',q:`${nm} провёл ${fr(1,ds[0])} жизни в детстве, ${fr(1,ds[1])} — в учёбе, ${fr(1,ds[2])} — в странствиях. Затем ${p} ${plural(p,'год','года','лет')} он строил корабль и ещё ${q} ${plural(q,'год','года','лет')} плавал на нём. Сколько лет он прожил?`,ans:bx,hint:'Пусть он прожил x лет. Сложи все части жизни и приравняй к x.',
short:`${M(`${fr('x',ds[0])} + ${fr('x',ds[1])} + ${fr('x',ds[2])} + ${c.rest} = x`)} → x = ${bx}.`,
explain:`Пусть x лет. ${M(`${fr('x',ds[0])} + ${fr('x',ds[1])} + ${fr('x',ds[2])} + ${p} + ${q} = x`)}.<br>Дроби вместе: ${M(`${fr(1,ds[0])} + ${fr(1,ds[1])} + ${fr(1,ds[2])} = ${rat(c.x-c.rest,c.x)}`)}. Значит, ${p} + ${q} = ${c.rest} лет — это оставшиеся ${rat(c.rest,c.x)} жизни.<br>x = ${c.rest} : ${rat(c.rest,c.x)} = <b>${bx}</b>.`,
explain2:`Проверка: ${ds.map(d=>`${bx} : ${d} = ${bx/d}`).join(', ')}; ${ds.map(d=>bx/d).join(' + ')} + ${p} + ${q} = ${bx} ✅. Подсказка для угадывания: x должен делиться на ${ds.join(', ')} — это сразу сужает поиск.`};},'s');
G(8,()=>{let a,b,S,ways;do{[a,b]=pick([[2,5],[3,5],[2,7],[5,10],[3,7],[2,10]]);S=R(20,60);ways=[];for(let x=0;x*a<=S;x++){const r=S-a*x;if(r%b===0)ways.push([x,r/b]);}}while(ways.length<2||ways.length>12);
return {type:'num',q:`Сколькими способами можно набрать ровно ${S} ₽ монетами по ${a} ₽ и ${b} ₽? (Монет каждого вида сколько угодно; можно обойтись монетами одного вида.)`,ans:ways.length,hint:`Перебирай число ${b}-рублёвых монет y = 0, 1, 2… и смотри, делится ли остаток на ${a}.`,
short:`${ways.map(w=>`${w[0]}×${a} + ${w[1]}×${b}`).join('; ')} — ${ways.length} ${plural(ways.length,'способ','способа','способов')}.`,
explain:`Уравнение ${M(`${a}x + ${b}y = ${S}`)} в целых неотрицательных числах. Перебираем:<br>${ways.map(w=>`x = ${w[0]}, y = ${w[1]}`).join('<br>')}<br>Всего <b>${ways.length}</b>.`,
explain2:`Найдя одно решение, остальные получаем «обменом»: ${b/gcd(a,b)} монет по ${a} ₽ = ${a/gcd(a,b)} монет по ${b} ₽ (обе дают ${a*b/gcd(a,b)} ₽). Обмениваем, пока монет хватает: ${ways.length} вариантов.`};},'s');
const dmove=[];for(let d=1;d<=9;d++)for(let k=2;k<=9;k++){const num=d*(k*100000-1),den=10-k;if(num%den===0){const x=num/den;if(x>=10000&&x<100000)dmove.push({d,k,N:d*100000+x,x});}}

return {type:'num',q:`Шестизначное число начинается с цифры ${c.d}. Если эту цифру перенести с первого места в конец, получится число, в ${raz(c.k)} большее исходного. Найди исходное число.`,ans:c.N,hint:`Пусть x — пятизначное число из последних пяти цифр. Тогда исходное ${c.d}·100000 + x, новое 10x + ${c.d}.`,
short:`${M(`10x + ${c.d} = ${c.k}(${c.d*100000} + x)`)} → x = ${c.x}, число ${c.N}.`,
explain:`Обозначим x — число из последних пяти цифр. Исходное: ${M(`${c.d*100000} + x`)}. После переноса: ${M(`10x + ${c.d}`)}.<br>${M(`10x + ${c.d} = ${c.k}(${c.d*100000} + x)`)} → ${M(`${10-c.k}x = ${c.k*c.d*100000-c.d}`)} → x = ${c.x}.<br>Ответ: <b>${c.N}</b>. Проверка: ${c.N}·${c.k} = ${c.N*c.k} ✅.`,
explain2:`Числа вида 142857 — «циклические»: 142857·2 = 285714, ·3 = 428571, ·5 = 714285 — те же цифры по кругу. Это период дроби 1/7 = 0,(142857). Олимпиадники любят эту «магию».`};},'s');
G(8,()=>{let M0,p1,p2,ans;do{M0=R(2,30)*10;p1=pick([99,98,95,90]);p2=pick([98,96,95,90,80,75,50].filter(v=>v<p1));ans=M0*(100-p1)/(100-p2);}while(!Number.isInteger(ans*2)||ans<1);

short:`Сухого ${n(dry)} кг = ${100-p2}% новой массы → ${n(ans)} кг.`,
explain:`Сухое вещество: ${100-p1}% от ${M0} = ${n(dry)} кг. Оно не меняется!<br>Теперь оно составляет ${100-p2}% массы: ${M(`${n((100-p2)/100)}x = ${n(dry)}`)} → x = <b>${n(ans)}</b> кг.${p1===99&&p2===98?' Масса уменьшилась вдвое — хотя «процент воды упал всего на 1»! Это знаменитый «арбузный парадокс».':''}`,
explain2:`Посмотри на долю сухого: была ${100-p1}%, стала ${100-p2}% — в ${n((100-p2)/(100-p1))} раза больше. Само сухое не менялось, значит, вся масса уменьшилась в ${n((100-p2)/(100-p1))} раза: ${M0} : ${n((100-p2)/(100-p1))} = ${n(ans)} кг.`};},'s');
