<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Преобразование выражений — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}

.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}

.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}

.opts{display:grid;gap:8px}

.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}

.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}

.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}

.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}

.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}

.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}

.steps{margin:6px 0 6px 0;padding-left:22px}

.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}

.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}

.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

.nudge-wrap{padding-top:14px;padding-bottom:0}.nudge-wrap+main{padding-top:0}

.nudge-t{flex:1 1 280px;line-height:1.5;font-size:15px}.nudge-b{flex:0 0 auto}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  nudges:[
    '{n}, нейронка решает быстро — но учится при этом она, а не ты. Твоя задача — научиться самому 🧠',
    'Сфоткать задачу и переписать ответ — это работа ксерокса 📠, а не учёба. Ксерокс умнее не становится.',
    'На контрольной в школе и на экзамене у мамы нейронки рядом не будет. Будешь только ты и твоя голова. Тренируй её сейчас 💪',
    'Ошибка с разбором — это +1 к мозгу. Ответ, списанный у нейронки, — это +0. Выбирай, что тебе выгоднее 😉',
    'Нейросети будут у всех. Выигрывать будут те, кто понимает больше нейросети. Будь таким, {n}.',
    'Не получается? Нажми «Не понял» — тренажёр объяснит по-другому. Или приходи к маме. Решать за тебя — не вариант.',
    'Чемпионы не ездят на тренировку на такси 🏃 Решай сам — только так растёт сила.',
    '{n}, я в тебя верю: ты можешь решить это сам. Медленно и с ошибками — это нормально. Списать — нет. Мама ❤️',
    'Чем больше решаешь сам, тем легче следующие темы. С нейронкой каждая новая тема будет всё труднее.',
  ],
  nudge(main){if(!main||document.querySelector('.nudge'))return;const m=P.nudges[Math.floor(Math.random()*P.nudges.length)].replace(/\{n\}/g,P.name());
    const c=document.createElement('div');c.className='nudge';c.innerHTML=`<div class="nudge-t">🤖🚫 ${m}</div><button class="btn ghost nudge-b">Понял, решаю сам 💪</button>`;
    const w=document.createElement('div');w.className='wrap nudge-wrap';w.appendChild(c);c.querySelector('button').onclick=()=>w.remove();main.parentNode.insertBefore(w,main);},
  mount(header,main){
    if(!header)return;
    if(!document.getElementById('login'))P.nudge(main);
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    const honest=(sk===10||(sk>0&&sk%15===0))?`<div class="small" style="margin-top:6px">Если всё это сам — ты красавчик! Если с нейронкой — честно, это ничего не стоит: на контрольной её не будет 😉</div>`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${honest}${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>

<div class="box tip"><b>Как запомнить</b>Минус перед скобкой — это умножение на (−1). А на −1 умножается каждое слагаемое: «плюс» превращается в «минус», «минус» — в «плюс».</div>`},
{title:'Раскрытие скобок: распределительный закон',lvl:[1,4],html:`
<p>Число перед скобкой умножается на <b>каждое</b> слагаемое в скобке:</p>
<div class="box rule"><b>Правило</b><span class="m">k(a + b) = ka + kb</span>, &nbsp; <span class="m">k(a − b) = ka − kb</span></div>
<p>Представь: ты покупаешь 3 набора, в каждом — яблоко и груша. Всего 3 яблока и 3 груши: 3(я + г) = 3я + 3г.</p>
<div class="box ex"><b>Пример с минусом</b><span class="m">2(3x − 1) − 4(x + 5) = 6x − 2 − 4x − 20 = 2x − 22</span><br>Обрати внимание: −4 умножается и на x, и на 5: −4 · 5 = <b>−20</b>.</div>
<div class="box err"><b>Ошибка</b>2(3x − 1) = 6x − 1 ❌ — забыли умножить на 2 второе слагаемое.</div>`},
{title:'Подобные слагаемые',lvl:2,html:`
<p><b>Подобные слагаемые</b> — у которых <b>одинаковая буквенная часть</b> (те же буквы в тех же степенях). Отличаться может только число впереди (коэффициент).</p>
<div class="box ex"><b>Подобные</b>3a и −7a; 2x²y и 5x²y; 4 и −9 (числа тоже подобны друг другу).</div>
<div class="box err"><b>Не подобные</b>3x² и 3x (разные степени); 2x²y и 2xy² (степени у разных букв); 5ab и 5a.</div>
<div class="box rule"><b>Как привести подобные</b>Складываем <b>коэффициенты</b> (со своими знаками!), буквенную часть оставляем как есть.<br><span class="m">3a + 5b − 7a + 2b − a = (3 − 7 − 1)a + (5 + 2)b = −5a + 7b</span></div>
<div class="box tip"><b>Как не запутаться</b>Подчеркни одной чертой все слагаемые с a, двумя — с b. Знак перед слагаемым «приклеен» к нему: в −7a коэффициент −7.</div>
<p>Яблоки складываем с яблоками, груши — с грушами. «3 яблока + 2 груши» нельзя записать как «5 яблогруш» — так и 3a + 2b нельзя сложить в 5ab.</p>`},
{title:'Степени с одинаковым основанием',lvl:3,html:`
<p><span class="m">aⁿ</span> — это a, умноженное само на себя n раз: <span class="m">a³ = a · a · a</span>.</p>
<div class="box rule"><b>Пять правил</b>
<span class="m">aᵐ · aⁿ = a<sup>m+n</sup></span> — при умножении показатели <b>складываем</b>;<br>
<span class="m">aᵐ : aⁿ = a<sup>m−n</sup></span> — при делении <b>вычитаем</b>;<br>
<span class="m">(aᵐ)ⁿ = a<sup>mn</sup></span> — степень в степень: показатели <b>умножаем</b>;<br>
<span class="m">(ab)ⁿ = aⁿbⁿ</span> — в степень возводим <b>каждый</b> множитель;<br>
<span class="m">a¹ = a</span>, <span class="m">a⁰ = 1</span> (a ≠ 0).</div>
<div class="box ex"><b>Почему складываем</b><span class="m">a² · a³ = (a·a) · (a·a·a) = a⁵</span> — всего пять множителей.<br><b>Почему умножаем</b> <span class="m">(a²)³ = a² · a² · a² = a⁶</span> — три раза по два.</div>
<div class="box err"><b>Ошибки</b>• x · x³ = x⁴, а не x³ — у одиночного x показатель 1.<br>• (2a)³ = <b>8</b>a³, а не 2a³ и не 6a³.<br>• a² + a³ — это <b>не</b> a⁵! Правила работают только для умножения и деления.</div>
<div class="box tip"><b>Хитрость</b><span class="m">2⁷ · 5⁷ = (2 · 5)⁷ = 10⁷</span>. Если основания дают в произведении «круглое» число, объединяй их.</div>`},
{title:'Умножение многочленов и формулы',lvl:4,html:`
<p>Чтобы умножить многочлен на многочлен, <b>каждое</b> слагаемое первой скобки умножаем на <b>каждое</b> слагаемое второй и всё складываем.</p>
<div class="fig" data-fig="area"></div>
<p class="small" style="text-align:center">(a + b)(c + d) — площадь большого прямоугольника = сумма площадей четырёх кусков: ac + bc + ad + bd.</p>
<div class="box ex"><b>Пример</b><span class="m">(x + 3)(x − 5) = x² − 5x + 3x − 15 = x² − 2x − 15</span></div>
<div class="box tip"><b>Проверка количества</b>В первой скобке 2 слагаемых, во второй 3 — до приведения подобных должно получиться 2 · 3 = 6 произведений. Меньше — значит, что-то забыл.</div>
<div class="box rule"><b>Формулы сокращённого умножения</b>
<span class="m">(a + b)² = a² + 2ab + b²</span><br>
<span class="m">(a − b)² = a² − 2ab + b²</span><br>
<span class="m">(a − b)(a + b) = a² − b²</span></div>
<div class="box err"><b>Самая частая ошибка</b><span class="m">(x − 3)² = x² − 9</span> ❌. Забыли удвоенное произведение! Правильно: x² − 6x + 9. Проверка: <span class="m">x = 4</span> → (4 − 3)² = 1, а 16 − 9 = 7. Не совпало.</div>`},
{title:'Вынесение общего множителя и группировка',lvl:5,html:`
<p>Это раскрытие скобок <b>наоборот</b>: <span class="m">ka + kb = k(a + b)</span>.</p>
<ol class="steps"><li>Найди наибольший общий делитель <b>чисел</b>.</li>
<li>Найди буквы, которые есть <b>во всех</b> слагаемых, в <b>наименьшей</b> степени.</li>
<li>Вынеси их за скобку, а в скобке напиши, что осталось от каждого слагаемого (раздели каждое на вынесенное).</li></ol>
<div class="box ex"><b>Пример</b><span class="m">6x³ − 9x² = 3x²(2x − 3)</span>. Проверка: 3x² · 2x = 6x³ ✅, 3x² · 3 = 9x² ✅.</div>
<div class="box err"><b>Ловушка с единицей</b><span class="m">5a² − a = a(5a − 1)</span>. Когда выносишь слагаемое целиком, на его месте остаётся <b>1</b>, а не пустота! a(5a) — неверно.</div>
<h3>Группировка</h3>
<p>Если общего множителя у всех слагаемых нет, разбей их на пары:</p>
<div class="box ex"><b>Пример</b><span class="m">x³ − 2x² + 5x − 10 = x²(x − 2) + 5(x − 2) = (x − 2)(x² + 5)</span></div>
<div class="box tip"><b>Скобки «наоборот»</b>(2 − x) = −(x − 2). Поэтому 3a(x − 2) + 5(2 − x) = 3a(x − 2) − 5(x − 2) = (x − 2)(3a − 5).</div>`},
{title:'Сначала упрости — потом считай',lvl:6,html:`
<p>Если нужно найти значение длинного выражения при «неудобном» x (например, 37 или −2,5), почти всегда легче <b>сначала упростить</b>, а потом подставить.</p>
<div class="box ex"><b>Пример</b>Найди (x + 3)(x − 3) − x(x − 4) при x = 37.<br>
<b>Способ 1 (упрощаем):</b> x² − 9 − x² + 4x = 4x − 9. При x = 37: 148 − 9 = <b>139</b>. Две строчки!<br>
<b>Способ 2 (в лоб):</b> 40 · 34 − 37 · 33 = 1360 − 1221 = 139. Тот же ответ, но считать большие числа дольше и легче ошибиться.</div>
<div class="box tip"><b>Признак</b>Если в выражении есть x² с плюсом и x² с минусом — они, скорее всего, сократятся, и останется что-то простое.</div>`},
{title:'Проверка подстановкой',lvl:7,html:`
<p>Как узнать, правильно ли ты упростил? <b>Подставь одно и то же число</b> в исходное выражение и в ответ. Если значения разные — есть ошибка.</p>
<div class="box ex"><b>Пример</b>Петя упростил 7 − (x − 2) и получил 5 − x. Проверим при x = 0:<br>исходное: 7 − (0 − 2) = 7 + 2 = 9; Петин ответ: 5 − 0 = 5. 9 ≠ 5 — ошибка!<br>Правильно: 7 − x + 2 = <b>9 − x</b>. При x = 0 даёт 9 ✅.</div>
<div class="box tip"><b>Советы</b>• Удобные числа: 0, 1, 2. Но 0 и 1 иногда «прячут» ошибки (например, x² = x при x = 1). Надёжнее проверить двумя числами.<br>• Если значения совпали — ответ, скорее всего, верный. Если не совпали — ошибка точно есть.</div>`},
{title:'Хитрые приёмы (★)',lvl:[8,9],html:`
<h3>1) Разность квадратов для устного счёта</h3>
<p><span class="m">2023 · 2025 = (2024 − 1)(2024 + 1) = 2024² − 1</span>, поэтому 2023 · 2025 − 2024² = <b>−1</b>.<br><span class="m">57² − 43² = (57 − 43)(57 + 43) = 14 · 100 = 1400</span>.</p>
<h3>2) Цепочка разностей квадратов</h3>
<p><span class="m">(x − 1)(x + 1)(x² + 1)(x⁴ + 1) = (x² − 1)(x² + 1)(x⁴ + 1) = (x⁴ − 1)(x⁴ + 1) = x⁸ − 1</span>. Каждая новая скобка «схлопывается» с предыдущим результатом.</p>
<h3>3) «Выражение не зависит от x»</h3>
<p>Значит, после упрощения все x сокращаются и остаётся число. Доказательство — просто упростить.</p>
<h3>4) Делимость</h3>
<p>n(n + 1)(n + 2) — три числа подряд. Среди них обязательно есть <b>чётное</b> и обязательно есть <b>кратное 3</b>. Поэтому произведение делится на 2 · 3 = <b>6</b>.</p>
<h3>5) Наименьшее значение</h3>
<p><span class="m">x² − 6x + 10 = (x − 3)² + 1</span>. Квадрат не бывает меньше 0, поэтому всё выражение не меньше 1, а 1 достигается при x = 3.</p>
<h3>6) Сумма и произведение</h3>
<p>Если известно a + b и ab, то <span class="m">a² + b² = (a + b)² − 2ab</span>.</p>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>Порядок: скобки → степени → умножение/деление → сложение/вычитание.</li>
<li>−3² = −9, (−3)² = 9.</li>
<li>Минус перед скобкой меняет знак <b>каждого</b> слагаемого.</li>
<li>Множитель перед скобкой умножается на <b>каждое</b> слагаемое.</li>
<li>Подобные — одинаковая буквенная часть; складываем коэффициенты.</li>
<li>aᵐ·aⁿ = a<sup>m+n</sup>, (aᵐ)ⁿ = a<sup>mn</sup>, (ab)ⁿ = aⁿbⁿ.</li>
<li>(a ± b)² = a² ± 2ab + b², (a − b)(a + b) = a² − b².</li>
<li>Вынося слагаемое целиком, оставь в скобке 1.</li>
<li>Сначала упрости, потом подставляй. Проверяй подстановкой числа.</li></ul>`}
];

/* ---------- symbols ---------- */
const symbols={tab:'Формулы',title:'Главные правила и формулы',rows:[
['( )<br>a²<br>· :<br>+ −','Порядок действий','Скобки, потом степени, потом умножение и деление, потом сложение и вычитание.','2 + 3 · 4 = 14'],
['−( )','Минус перед скобками','Скобки убираем, знак каждого слагаемого меняем.','−(a − b + c) = −a + b − c'],
['k( )','Распределительный закон','Число перед скобкой умножаем на каждое слагаемое.','3(x − 2) = 3x − 6'],
['3a − 7a','Подобные слагаемые','Складываем коэффициенты, буквы оставляем.','3a − 7a = −4a'],
['aᵐ · aⁿ','Произведение степеней','Показатели складываем.','x² · x⁵ = x⁷'],
['aᵐ : aⁿ','Частное степеней','Показатели вычитаем.','x⁷ : x³ = x⁴'],
['(aᵐ)ⁿ','Степень степени','Показатели умножаем.','(x³)² = x⁶'],
['(ab)ⁿ','Степень произведения','В степень возводим каждый множитель.','(2x)³ = 8x³'],
['(a + b)²','Квадрат суммы','a² + 2ab + b²','(x + 3)² = x² + 6x + 9'],
['(a − b)²','Квадрат разности','a² − 2ab + b²','(x − 3)² = x² − 6x + 9'],
['a² − b²','Разность квадратов','(a − b)(a + b)','x² − 25 = (x − 5)(x + 5)'],
['ka + kb','Вынесение множителя','= k(a + b). Обратное к раскрытию скобок.','6x² − 3x = 3x(2x − 1)']
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Знак перед слагаемым — его часть. Если сомневаешься — подставь число и проверь.</div>`};

/* ---------- generators ---------- */
const gens=[];
const retry=make=>()=>{for(let i=0;i<500;i++){const t=make();if(t)return t;}throw new Error('generator failed');};
const G=(lvl,make,star)=>gens.push({lvl,make:retry(make),star});

/* L0: order of operations */
G(0,()=>{const a=R(20,60),b=R(2,9),c=R(2,9),e=R(2,9),d=e*R(2,9);
const p=b*c,qv=d/e,ans=a-p+qv,wrong=((a-b)*c+d)/e;
return {type:'num',q:`Вычисли: <span class="m">${a} − ${b} · ${c} + ${d} : ${e}</span>`,ans,
hint:'Сначала умножение и деление, потом сложение и вычитание.',
short:`${b} · ${c} = ${p}, ${d} : ${e} = ${qv}; ${a} − ${p} + ${qv} = ${N(ans)}.`,
explain:`1) Сначала «старшие» действия — умножение и деление: ${b} · ${c} = <b>${p}</b>; ${d} : ${e} = <b>${qv}</b>.<br>2) Потом сложение и вычитание слева направо: ${a} − ${p} + ${qv} = ${N(a-p)} + ${qv} = <b>${N(ans)}</b>.<br>Если считать всё подряд слева направо (${a} − ${b} = ${a-b}, потом · ${c}…), получится ${N(rnd(wrong))} — это неверно: вычитание нельзя делать раньше умножения.`,
explain2:`Поставь невидимые скобки вокруг умножения и деления: ${a} − (${b} · ${c}) + (${d} : ${e}) = ${a} − ${p} + ${qv}. Теперь всё просто: ${N(ans)}.<br>Похоже на магазин: «20 рублей минус 3 шоколадки по 4 рубля» — сначала считаешь стоимость шоколадок (3 · 4), а потом вычитаешь.`};});
G(0,()=>{const a=R(2,6),b=R(1,4),c=R(2,5);
const cube=Math.pow(-b,3),ans=-a*a+cube*c;
return {type:'num',q:`Вычисли: <span class="m">−${a}² + (−${b})³ · ${c}</span>`,ans,
hint:`Внимание: −${a}² и (−${a})² — разные вещи.`,
short:`−${a}² = −${a*a}; (−${b})³ = ${N(cube)}; −${a*a} + (${N(cube)}) · ${c} = ${N(ans)}.`,
explain:`1) <b>Степени</b>:<br>• −${a}² — в квадрат возводится только ${a}, минус остаётся впереди: −${a}² = −${a*a}.<br>• (−${b})³ — в куб возводится всё число −${b}: (−${b})·(−${b})·(−${b}) = ${N(cube)} (степень нечётная, минус остаётся).<br>2) <b>Умножение</b>: ${pn(cube)} · ${c} = ${N(cube*c)}.<br>3) <b>Сложение</b>: −${a*a} + ${pn(cube*c)} = <b>${N(ans)}</b>.<div class="box err"><b>Ловушка</b>Если посчитать −${a}² как (−${a})² = ${a*a}, получится ${N(a*a+cube*c)} — неверно.</div>`,
explain2:`Прочитай вслух: «минус ${a} в квадрате» — это «минус (${a} в квадрате)» = −${a*a}. А «(минус ${b}) в кубе» — скобки говорят, что в куб возводится вместе с минусом.<br>Маленький пример: −2² = −4, а (−2)² = 4; (−1)³ = −1.<br>Итог: −${a*a} + ${pn(cube)} · ${c} = −${a*a} ${tail(cube*c)} = ${N(ans)}.`};});
G(0,()=>{let a,b,c,d;do{a=R(5,30);b=R(1,9);c=R(1,12);d=R(2,6);}while(b===c);
const inn=b-c,ans=a-inn*d;
return {type:'num',q:`Вычисли: <span class="m">${a} − (${b} − ${c}) · ${d}</span>`,ans,
short:`(${b} − ${c}) = ${N(inn)}; ${pn(inn)} · ${d} = ${N(inn*d)}; ${a} − ${pn(inn*d)} = ${N(ans)}.`,
explain:`1) Скобки: ${b} − ${c} = <b>${N(inn)}</b>.<br>2) Умножение: ${pn(inn)} · ${d} = <b>${N(inn*d)}</b>.<br>3) Вычитание: ${a} − ${pn(inn*d)} = ${inn<0?`${a} + ${-inn*d} = `:''}<b>${N(ans)}</b>.${inn<0?'<br>Минус на минус даёт плюс: вычесть отрицательное число — то же, что прибавить положительное.':''}<br>Неверно сначала вычитать ${a} − ${b}: умножение на ${d} «держит» скобку, его надо выполнить раньше вычитания.`,
explain2:`Можно раскрыть скобку: ${a} − (${b} − ${c}) · ${d} = ${a} − ${b*d} + ${c*d} = ${N(ans)}. Минус перед скобкой поменял знаки: −${b}·${d} и +${c}·${d}. Ответ тот же — значит, всё верно.`};});

/* L1: minus before brackets, distributive law */
G(1,()=>{let p,q,r,s;do{p=R(3,9);q=R(1,8);r=R(2,9);s=R(1,9);}while(p===q);
const ok=lc([[p-q,'x'],[r,'y'],[-s,'']]);
const w=[lc([[p-q,'x'],[-r,'y'],[s,'']]),lc([[p+q,'x'],[-r,'y'],[s,'']]),lc([[p-q,'x'],[r,'y'],[s,'']])];
if(!uniq([ok,...w]))return null;
const x0=1,y0=1,orig=p-(q-r+s);
return {type:'choice',q:`Раскрой скобки и приведи подобные: <span class="m">${p}x − (${cf(q,'x')} − ${r}y + ${s})</span>`,...ch(ok,w),
short:`−(${cf(q,'x')} − ${r}y + ${s}) = −${cf(q,'x')} + ${r}y − ${s}.`,
explain:`Перед скобкой минус → меняем знак у <b>каждого</b> слагаемого в скобке:<br>${p}x − ${cf(q,'x')} <b>+ ${r}y − ${s}</b>.<br>Подобные: ${p}x − ${cf(q,'x')} = ${cf(p-q,'x').replace(/^/,p-q<0?'−':'')}.<br>Ответ: <b>${ok}</b>.<br>Вариант «${w[0]}» — знак поменяли только у первого слагаемого. Вариант «${w[1]}» — знаки не поменяли вовсе.`,
explain2:`Проверим подстановкой x = 1, y = 1:<br>• исходное: ${p} − (${q} − ${r} + ${s}) = ${p} − ${N(q-r+s)} = ${N(orig)};<br>• ответ ${ok}: ${N(p-q)} + ${r} − ${s} = ${N(p-q+r-s)} ✅;<br>• «${w[0]}»: ${N(p-q)} − ${r} + ${s} = ${N(p-q-r+s)}${p-q-r+s!==orig?' ❌':''}.<br>Минус перед скобкой — это «умножить на −1» каждое слагаемое.`};});
G(1,()=>{let k,m,a,c,b,d;do{k=R(2,6);m=R(2,6);a=R(1,5);c=R(1,5);b=R(1,9);d=R(1,9);}while(k*a-m*c===0);
const X=k*a-m*c;
const ok=lc([[X,'x'],[-k*b-m*d,'']]);
const w=[lc([[X,'x'],[-b-m*d,'']]),lc([[X,'x'],[-k*b+m*d,'']]),lc([[k*a+m*c,'x'],[-k*b+m*d,'']])];
if(!uniq([ok,...w]))return null;
return {type:'choice',q:`Упрости: <span class="m">${k}(${cf(a,'x')} − ${b}) − ${m}(${cf(c,'x')} + ${d})</span>`,...ch(ok,w),
short:`${k*a===1?'':k*a}x − ${k*b} − ${m*c===1?'':m*c}x − ${m*d} = ${ok}.`,
explain:`1) Первая скобка: ${k} умножаем на <b>каждое</b> слагаемое: ${k}·${cf(a,'x')} = ${cf(k*a,'x')}, ${k}·(−${b}) = −${k*b}.<br>2) Вторая скобка: множитель <b>−${m}</b> (вместе с минусом!): −${m}·${cf(c,'x')} = −${cf(m*c,'x')}, −${m}·${d} = −${m*d}.<br>3) Собираем: ${cf(k*a,'x')} − ${k*b} − ${cf(m*c,'x')} − ${m*d} = <b>${ok}</b>.<br>Вариант «${w[0]}» — забыли умножить ${b} на ${k}. Вариант «${w[1]}» — потеряли минус: −${m}·${d} = −${m*d}, а не +${m*d}.`,
explain2:`Проверим при x = 0 (тогда остаются только числа):<br>исходное: ${k}·(−${b}) − ${m}·${d} = −${k*b} − ${m*d} = ${N(-k*b-m*d)}. В ответе при x = 0 свободный член должен быть ${N(-k*b-m*d)} — так и есть только у «${ok}».<br>Проверим x = 1: ${k}·${N(a-b)} − ${m}·${c+d} = ${N(k*(a-b)-m*(c+d))}, и ${N(X)} ${tail(-k*b-m*d)} = ${N(X-k*b-m*d)} ✅.`};});
G(1,()=>{const k=R(2,9),m=R(1,9);
const ok=`−(${k}x − ${m}) = −${k}x + ${m}`;
const w=[`−(${k}x − ${m}) = −${k}x − ${m}`,`−(${k}x + ${m}) = −${k}x + ${m}`,`${m} − (${k}x + ${m}) = ${2*m} − ${k}x`];
return {type:'choice',q:'Какое равенство <b>верное</b>?',...ch(ok,w),
short:`Минус меняет знак каждого слагаемого: −${k}x и +${m}.`,
explain:`Минус перед скобкой меняет знак <b>каждого</b> слагаемого:<br>• −(${k}x − ${m}) = −${k}x <b>+ ${m}</b> ✅;<br>• «−${k}x − ${m}» — у ${m} знак не поменяли ❌;<br>• −(${k}x + ${m}) = −${k}x <b>− ${m}</b>, а не + ${m} ❌;<br>• ${m} − (${k}x + ${m}) = ${m} − ${k}x − ${m} = −${k}x, а не ${2*m} − ${k}x ❌.`,
explain2:`Проверь каждое равенство числом x = 0:<br>• −(0 − ${m}) = ${m}, справа −0 + ${m} = ${m} ✅;<br>• справа −0 − ${m} = −${m}, а слева ${m} ❌;<br>• −(0 + ${m}) = −${m}, справа +${m} ❌;<br>• ${m} − (0 + ${m}) = 0, справа ${2*m} ❌.`};});

const terms=shuffle(aC.map(c=>[c,'a']).concat(bC.map(c=>[c,'b'])));
const Aabs=aC.reduce((s,x)=>s+Math.abs(x),0);
const ok=lc([[A,'a'],[B,'b']]);
const w=[lc([[Aabs,'a'],[B,'b']]),lc([[A,'a'],[-B,'b']]),cf(A+B,'ab').replace(/^/,A+B<0?'−':'')];
if(!uniq([ok,...w]))return null;

explain2:`Представь: a — яблоки, b — груши. Плюс — принесли, минус — съели.<br>Яблоки: ${aC.map(c=>c>0?`принесли ${c}`:`съели ${-c}`).join(', ')} → итого ${N(A)}.<br>Груши: ${bC.map(c=>c>0?`принесли ${c}`:`съели ${-c}`).join(', ')} → итого ${N(B)}.<br>Яблоки с грушами не складывают — ответ ${ok}.`};});
G(2,()=>{let t2,t1,t0,X;do{t2=[nz(-6,6),nz(-6,6)];t1=[nz(-9,9),nz(-9,9),nz(-9,9)];t0=[nz(-9,9),nz(-9,9)];X=t1[0]+t1[1]+t1[2];}while(!X);
const terms=shuffle(t2.map(c=>[c,'x²']).concat(t1.map(c=>[c,'x']),t0.map(c=>[c,''])));

return {type:'num',q:`Приведи подобные слагаемые и найди <b>коэффициент при x</b> (число, стоящее перед x):<br><span class="m">${lc(terms)}</span>`,ans:X,
hint:'Выпиши только слагаемые с x (не с x²!) вместе с их знаками.',
short:`${t1.map(pn).join(' + ')} = ${N(X)}.`,
explain:`Слагаемые с x — это ${t1.map(c=>cf(c,'x').replace(/^/,c<0?'−':'')).join(', ')}. Слагаемые с x² сюда <b>не</b> относятся: x² и x — не подобные.<br>Складываем коэффициенты со знаками: ${t1.map(pn).join(' + ')} = <b>${N(X)}</b>.<br>Всё выражение: ${pf([A0,X,A2])}.`,
explain2:`Раскрась слагаемые: x² — красным, x — синим, числа — зелёным. Нас интересует только синий цвет: ${t1.map(c=>cf(c,'x').replace(/^/,c<0?'−':'')).join(', ')}. Если x стоит один, его коэффициент 1 (или −1 при минусе). Сумма: ${N(X)}.`};});
G(2,()=>{const c1=R(2,9),c2=R(2,9),c3=R(2,9);

explain:`Подобные — у которых <b>одинаковая буквенная часть</b> (те же буквы в тех же степенях). Числа впереди могут быть любыми.<br>• ${c1}x²y и −${c2}x²y: у обоих x²y ✅.<br>• ${c1}x²y и ${c3}xy²: у первого x во второй степени, у второго — y ❌.<br>• ${c1}x и ${c3}x²: разные степени x ❌.<br>• ${c1}ab и ${c3}a: во втором нет b ❌.`,
explain2:`Закрой ладонью числа впереди и сравни то, что осталось: «x²y» и «x²y» — одно и то же. «x²y» и «xy²» — нет: в первом x·x·y, во втором x·y·y. Подобные можно сложить: ${c1}x²y − ${c2}x²y = ${lc([[c1-c2,'x²y']])}.`};});

/* L3: powers */
G(3,()=>{let m,n;do{m=R(2,7);n=R(2,7);}while(!uniq([m+n+1,m+n,m*n,m*n+1]));

G(3,()=>{let m,n,k;do{m=R(2,5);n=R(2,4);k=R(1,6);}while(!uniq([m*n+k,m+n+k,m*n*k,m*(n+k)]));

short:`(x${sup(m)})${sup(n)} = x${sup(m*n)}; ${m*n} + ${k} = ${m*n+k}.`,

explain2:`(x${sup(m)})${sup(n)} — это x${sup(m)} написано ${n} ${plural(n,'раз','раза','раз')}: ${Array(n).fill('x'+sup(m)).join(' · ')}. Всего ${m}·${n} = ${m*n} множителей x. Ещё x${sup(k)} добавляет ${k}. Итого ${m*n+k}.`};});
G(3,()=>{let k,m,n;do{k=pick([2,3,5]);m=pick([2,3]);n=pick([2,3]);}while(Math.pow(k,n)===k*n);
const kn=Math.pow(k,n);

const w=[`${k*n}a${sup(m*n)}b${sup(n)}`,(m+n!==m*n?`${kn}a${sup(m+n)}b${sup(n)}`:`${kn}a${sup(m)}b${sup(n)}`),`${k}a${sup(m*n)}b${sup(n)}`];

short:`${k}${sup(n)} = ${kn}, (a${sup(m)})${sup(n)} = a${sup(m*n)}, b${sup(n)}.`,
explain:`В степень ${n} возводим <b>каждый</b> множитель:<br>• число: ${k}${sup(n)} = ${Array(n).fill(k).join('·')} = ${kn} (а не ${k}·${n} = ${k*n}!);<br>• (a${sup(m)})${sup(n)} = a${sup(m*n)} — показатели умножаем;<br>• b${sup(n)}.<br>Ответ: <b>${ok}</b>.`,
explain2:`Распиши: (${k}a${sup(m)}b)${sup(n)} = ${Array(n).fill(`(${k}a${sup(m)}b)`).join(' · ')}. Перегруппируем: числа отдельно (${Array(n).fill(k).join('·')} = ${kn}), a отдельно (${Array(n).fill('a'+sup(m)).join('·')} = a${sup(m*n)}), b отдельно (b${sup(n)}).`};});
G(3,()=>{const a=pick([2,3,5]);const e=a===5?R(1,2):R(1,3);const p=R(4,9),q=R(3,8),r=p+q-e;
const ans=Math.pow(a,e);
return {type:'num',q:`Вычисли: <span class="m">${F(`${a}${sup(p)} · ${a}${sup(q)}`,`${a}${sup(r)}`)}</span>`,ans,

explain2:`Представь, что сверху ${p+q} множителей ${a}, а снизу ${r}. Каждый множитель снизу «сокращается» с одним сверху. Сверху останется ${p+q} − ${r} = ${e} ${plural(e,'множитель','множителя','множителей')}: ${Array(e).fill(a).join(' · ')} = ${ans}. Считать ${a}${sup(p+q)} = ${Math.pow(a,p+q)} совсем не нужно.`};});
G(3,()=>{if(Math.random()<0.5){const pr=pick([[2,5],[4,25],[20,5]]);const base=pr[0]*pr[1];const n=R(4,6);const lg=Math.round(Math.log10(base));const tot=lg*n;const e=tot-R(1,3);const ans=Math.pow(10,tot-e);
 return {type:'num',q:`Вычисли: <span class="m">${F(`${pr[0]}${sup(n)} · ${pr[1]}${sup(n)}`,`10${sup(e)}`)}</span>`,ans,
 hint:'(ab)ⁿ = aⁿbⁿ — работает и в обратную сторону.',
 short:`${pr[0]}${sup(n)} · ${pr[1]}${sup(n)} = ${base}${sup(n)} = 10${sup(tot)}; 10${sup(tot)} : 10${sup(e)} = ${ans}.`,
 explain:`Правило (ab)ⁿ = aⁿbⁿ читаем справа налево: ${pr[0]}${sup(n)} · ${pr[1]}${sup(n)} = (${pr[0]} · ${pr[1]})${sup(n)} = ${base}${sup(n)}${base===100?` = (10²)${sup(n)} = 10${sup(tot)}`:''}.<br>Делим: 10${sup(tot)} : 10${sup(e)} = 10${sup(tot-e)} = <b>${ans}</b>.`,

const pr=pick([[0.25,4],[0.2,5],[0.5,2],[0.125,8]]);const neg=Math.random()<0.5;const n=R(4,9);const ans=neg&&n%2?-1:1;

/* L4: multiplying polynomials */
G(4,()=>{let a,b;do{a=nz(-9,9);b=nz(-9,9);}while(a===b||a+b===0);
const ok=pf([a*b,a+b,1]);
const w=[pf([a*b,0,1]),pf([-a*b,a+b,1]),pf([a*b,a-b,1])];
if(!uniq([ok,...w]))return null;
return {type:'choice',q:`Раскрой скобки: <span class="m">(${xp(a)})(${xp(b)})</span>`,...ch(ok,w),
short:`x² ${tail(b)}x ${tail(a)}x ${tail(a*b)} = ${ok}.`,
explain:`Каждое слагаемое первой скобки умножаем на каждое слагаемое второй (2 · 2 = 4 произведения):<br>x · x = x²; x · ${pn(b)} = ${cf(b,'x').replace(/^/,b<0?'−':'')}; ${pn(a)} · x = ${cf(a,'x').replace(/^/,a<0?'−':'')}; ${pn(a)} · ${pn(b)} = ${N(a*b)}.<br>Складываем: x² ${tail(b)}x ${tail(a)}x ${tail(a*b)} = <b>${ok}</b>.<br>Вариант «${w[0]}» — перемножили только «первое с первым» и «последнее с последним», а средние произведения забыли.`,
explain2:`Нарисуй таблицу 2×2: сверху x и ${N(b)}, слева x и ${N(a)}. В клетках: x², ${N(b)}x, ${N(a)}x, ${N(a*b)}. Сумма всех клеток — ответ. Проверка x = 1: (${N(1+a)})·(${N(1+b)}) = ${N((1+a)*(1+b))}, и 1 ${tail(a+b)} ${tail(a*b)} = ${N(1+a+b+a*b)} ✅.`};});
G(4,()=>{let p,q,r,s;do{p=pick([2,3]);q=nz(-5,5);r=nz(-5,5);s=nz(-6,6);}while(false);
const right=pm([q,p],[s,r,1]);
const w1=pa(pm([0,p],[s,r,1]),[0,0,q]),w2=pa(pm([0,p],[s,r,1]),[q]),w3=pm([-q,p],[s,r,1]);
const ok=pf(right),w=[pf(w1),pf(w2),pf(w3)];
if(!uniq([ok,...w]))return null;
return {type:'choice',q:`Выполни умножение: <span class="m">(${p}x ${tail(q)})(${pf([s,r,1])})</span>`,...ch(ok,w),
short:`${p}x·(${pf([s,r,1])}) = ${pf(pm([0,p],[s,r,1]))}; ${pn(q)}·(${pf([s,r,1])}) = ${pf(pm([q],[s,r,1]))}.`,
explain:`Должно получиться 2 · 3 = 6 произведений.<br>1) ${p}x умножаем на каждое слагаемое второй скобки: ${pf(pm([0,p],[s,r,1]))}.<br>2) ${N(q)} умножаем на каждое: ${pf(pm([q],[s,r,1]))}.<br>3) Складываем и приводим подобные: <b>${ok}</b>.<br>Вариант «${w[0]}» — ${N(q)} умножили только на x², а на ${cf(r,'x').replace(/^/,r<0?'−':'')} и ${N(s)} забыли.`,
explain2:`Проверим подстановкой x = 1: (${p} ${tail(q)})·(1 ${tail(r)} ${tail(s)}) = ${pn(p+q)} · ${pn(1+r+s)} = ${N((p+q)*(1+r+s))}. Ответ при x = 1: ${N(pev(right,1))} ✅. «${w[0]}» при x = 1 даёт ${N(pev(w1,1))}${pev(w1,1)!==pev(right,1)?' ❌':''}.`};});
G(4,()=>{const t=pick(['m','p','d']);const a=pick([1,1,2,3]);const k=R(2,9);
let right,w,expr,name;

else if(t==='p'){expr=`(${cf(a,'x')} + ${k})²`;right=[k*k,2*a*k,a*a];w=[[k*k,0,a*a],[k*k,a*k,a*a],a>1?[k*k,2*a*k,a]:[k,2*k,1]];name='квадрат суммы: (a + b)² = a² + 2ab + b²';}
else{expr=`(${cf(a,'x')} − ${k})(${cf(a,'x')} + ${k})`;right=[-k*k,0,a*a];w=[[k*k,0,a*a],[-k*k,-2*a*k,a*a],[-k,0,a*a]];name='разность квадратов: (a − b)(a + b) = a² − b²';}

const A=cf(a,'x');
return {type:'choice',q:`Раскрой скобки по формуле: <span class="m">${expr}</span>`,...ch(ok,ws),
short:`Формула — ${name}.`,
explain:`Это ${name}. Здесь a = ${A}, b = ${k}.<br>${t==='d'?`a² = ${pf([0,0,a*a])}, b² = ${k*k}. Ответ: <b>${ok}</b>.`:`a² = (${A})² = ${pf([0,0,a*a])}; 2ab = 2·${A}·${k} = ${pf([0,2*a*k])}; b² = ${k*k}.<br>Ответ: <b>${ok}</b>.<br>Вариант «${ws[0]}» — забыли удвоенное произведение 2ab. Это самая частая ошибка!`}${a>1?`<br>Не забудь: (${A})² = ${a*a}x², а не ${A}².`:''}`,
explain2:`Можно и без формулы — просто умножь скобки: ${t==='d'?`(${A} − ${k})(${A} + ${k}) = ${pf([0,0,a*a])} + ${pf([0,a*k])} − ${pf([0,a*k])} − ${k*k}: средние слагаемые уничтожились.`:`${expr} = (${A} ${t==='m'?'−':'+'} ${k})(${A} ${t==='m'?'−':'+'} ${k}) = ${pf([0,0,a*a])} ${t==='m'?'−':'+'} ${pf([0,a*k])} ${t==='m'?'−':'+'} ${pf([0,a*k])} + ${k*k}: два одинаковых средних слагаемых дают 2ab.`}<br>Проверка x = 1: ${N(t==='d'?(a-k)*(a+k):Math.pow(a+(t==='m'?-k:k),2))} и ${N(pev(right,1))} ✅.`};});
G(4,()=>{let k,a,m,b;do{k=R(1,6);a=nz(-9,9);m=R(1,6);b=nz(-9,9);}while(k*b+a*m===0);
const ans=k*b+a*m;
return {type:'num',q:`Раскрой скобки <span class="m">(${cf(k,'x')} ${tail(a)})(${cf(m,'x')} ${tail(b)})</span> и найди <b>коэффициент при x</b>.`,ans,
hint:'Слагаемые с x получаются, когда x из одной скобки умножается на число из другой.',
short:`${cf(k,'x')}·${pn(b)} + ${pn(a)}·${cf(m,'x')} = ${N(ans)}x.`,
explain:`Все произведения:<br>• ${cf(k,'x')} · ${cf(m,'x')} = ${pf([0,0,k*m])};<br>• ${cf(k,'x')} · ${pn(b)} = ${pf([0,k*b])};<br>• ${pn(a)} · ${cf(m,'x')} = ${pf([0,a*m])};<br>• ${pn(a)} · ${pn(b)} = ${N(a*b)}.<br>Слагаемые с x: ${pf([0,k*b])} и ${pf([0,a*m])}, вместе ${pf([0,ans])}. Коэффициент: <b>${N(ans)}</b>.`,
explain2:`Весь многочлен: ${pf([a*b,ans,k*m])}. Коэффициент при x — число перед x: ${N(ans)}. Это «крест-накрест» произведение: ${k}·${pn(b)} + ${pn(a)}·${m} = ${N(k*b)} + ${pn(a*m)} = ${N(ans)}.`};});

/* L5: factoring */
G(5,()=>{let g,p,q,e2,d;do{g=R(2,6);p=R(1,5);q=R(2,7);e2=R(1,3);d=R(1,2);}while(gcd(p,q)!==1||p===q);
const e1=e2+d;
const xe=v=>`x${sup(v)}`;
const inner=`${cf(p,d===1?'x':xe(d))} − ${q}`;
const ok=`${g}${xe(e2)}(${inner})`;
const w=[`${g}${xe(e2)}(${cf(p,d===1?'x':xe(d))} + ${q})`,`${g}${xe(e2)}(${cf(p,d===1?'x':xe(d))} − ${g*q})`,`${g}${xe(e1)}(${p} − ${q}x)`];
if(!uniq([ok,...w]))return null;
return {type:'choice',q:`Вынеси за скобки общий множитель: <span class="m">${g*p}${xe(e1)} − ${g*q}${xe(e2)}</span>`,...ch(ok,w),
short:`НОД(${g*p}, ${g*q}) = ${g}; x в наименьшей степени: ${xe(e2)}.`,
explain:`1) Числа: наибольший общий делитель ${g*p} и ${g*q} — это <b>${g}</b>.<br>2) Буква: ${xe(e1)} и ${xe(e2)} — берём <b>наименьшую</b> степень: ${xe(e2)}.<br>3) Делим каждое слагаемое на ${g}${xe(e2)}: ${g*p}${xe(e1)} : ${g}${xe(e2)} = ${cf(p,d===1?'x':xe(d))}; ${g*q}${xe(e2)} : ${g}${xe(e2)} = ${q}.<br>Ответ: <b>${ok}</b>.<br>Вариант с «− ${g*q}» — второе слагаемое забыли разделить на ${g}.`,
explain2:`Проверка — раскрой скобки обратно: ${g}${xe(e2)} · ${cf(p,d===1?'x':xe(d))} = ${g*p}${xe(e1)} ✅, ${g}${xe(e2)} · ${q} = ${g*q}${xe(e2)} ✅. Получили исходное выражение — значит, вынесли правильно. Попробуй так же раскрыть неверные варианты — исходное не получится.`};});
G(5,()=>{const k=R(2,9),s=pick([1,-1]);
const ok=`a(${k}a ${s>0?'−':'+'} 1)`;
const w=[`a · ${k}a`,`a(${k}a ${s>0?'+':'−'} 1)`,`${k}a(a ${s>0?'−':'+'} 1)`];
return {type:'choice',q:`Разложи на множители: <span class="m">${k}a² ${s>0?'−':'+'} a</span>`,...ch(ok,w),
short:`a выносим, на его месте остаётся 1: ${ok}.`,
explain:`Общий множитель — a. Делим каждое слагаемое на a:<br>${k}a² : a = ${k}a; &nbsp; a : a = <b>1</b>.<br>Ответ: <b>${ok}</b>.<div class="box err"><b>Почему не «a · ${k}a»</b>Раскроем: a · ${k}a = ${k}a² — второе слагаемое пропало! Когда выносишь слагаемое целиком, на его месте в скобке остаётся <b>1</b>.</div>`,
explain2:`Проверь раскрытием: a(${k}a ${s>0?'−':'+'} 1) = ${k}a² ${s>0?'−':'+'} a ✅. А ${k}a(a ${s>0?'−':'+'} 1) = ${k}a² ${s>0?'−':'+'} ${k}a ❌ — во втором слагаемом лишняя ${k}.<br>С числами: 5 · 3 + 5 = 5 · (3 + 1), а не 5 · 3.`};});
G(5,()=>{const k=R(1,6),m=R(1,9),s=pick([1,-1]);
const sk=s*k;// (x − sk)(x² + m) = x³ − sk x² + m x − sk m
const ok=`(${xp(-sk)})(x² + ${m})`;
const w=[`(${xp(sk)})(x² + ${m})`,`(${xp(-sk)})(x² − ${m})`,`(${xp(-sk)})(x + ${m})`];
return {type:'choice',q:`Разложи на множители способом группировки: <span class="m">${pf([-sk*m,m,-sk,1])}</span>`,...ch(ok,w),
short:`x²(${xp(-sk)}) + ${m}(${xp(-sk)}) = ${ok}.`,
explain:`Группируем по два: (x³ ${tail(-sk)}x²) + (${m}x ${tail(-sk*m)}).<br>• Из первой пары выносим x²: x²(${xp(-sk)}).<br>• Из второй выносим ${m}: ${m}(${xp(-sk)}).<br>Получили одинаковые скобки: x²(${xp(-sk)}) + ${m}(${xp(-sk)}) = <b>${ok}</b>.`,
explain2:`Проверь раскрытием: (${xp(-sk)})(x² + ${m}) = x³ + ${m}x ${tail(-sk)}x² ${tail(-sk*m)} = ${pf([-sk*m,m,-sk,1])} ✅. Одинаковая скобка (${xp(-sk)}) — как общий множитель, только в виде скобки: A·x² + A·${m} = A(x² + ${m}).`};});
G(5,()=>{const k=R(2,9),d=R(1,9),m=R(1,9);
const ok=`(x − ${d})(${k}a − ${m})`;
const w=[`(x − ${d})(${k}a + ${m})`,`(x + ${d})(${k}a − ${m})`,`(x − ${d})(${m} − ${k}a)`];
return {type:'choice',q:`Разложи на множители: <span class="m">${k}a(x − ${d}) + ${m}(${d} − x)</span>`,...ch(ok,w),
short:`${d} − x = −(x − ${d}), поэтому ${k}a(x − ${d}) − ${m}(x − ${d}) = ${ok}.`,
explain:`Скобки похожи, но «наоборот»: (${d} − x) = −(x − ${d}).<br>Значит, ${m}(${d} − x) = −${m}(x − ${d}).<br>${k}a(x − ${d}) − ${m}(x − ${d}) = <b>${ok}</b>.<br>Вариант «(x − ${d})(${k}a + ${m})» — не заметили, что скобки отличаются знаком.`,
explain2:`Проверим числами: a = 1, x = ${d+1}.<br>Исходное: ${k}·1·1 + ${m}·(−1) = ${N(k-m)}.<br>Ответ: (${d+1} − ${d})(${k} − ${m}) = 1 · ${N(k-m)} = ${N(k-m)} ✅.<br>«(x − ${d})(${k}a + ${m})»: 1 · ${k+m} = ${k+m} ❌.`};});

/* L6: simplify then evaluate */
const niceX=()=>pick([R(11,60),-R(11,40),pick([0.5,1.5,2.5,-0.5,-1.5,0.25,-2.5])]);
G(6,()=>{const a=R(1,9),b=nz(-9,9),x=niceX();
const simp=[-a*a,b],ans=rnd(pev(simp,x));
const L=rnd((x+a)*(x-a)),Rr=rnd(x*(x-b));
return {type:'num',q:`Упрости выражение и найди его значение при x = ${N(x)}:<br><span class="m">(x + ${a})(x − ${a}) − x(${xp(-b)})</span>`,ans,
hint:'(x + a)(x − a) = x² − a². Потом раскрой вторую скобку. x² уничтожатся.',
short:`Выражение равно ${pf(simp)}; при x = ${N(x)}: ${N(ans)}.`,
explain:`1) (x + ${a})(x − ${a}) = x² − ${a*a} (разность квадратов).<br>2) x(${xp(-b)}) = x² ${tail(-b)}x.<br>3) x² − ${a*a} − (x² ${tail(-b)}x) = x² − ${a*a} − x² ${tail(b)}x = <b>${pf(simp)}</b>.<br>4) При x = ${N(x)}: ${N(b)}·${pn(x)} − ${a*a} = ${N(rnd(b*x))} − ${a*a} = <b>${N(ans)}</b>.`,
explain2:`Можно подставить сразу: (${N(x)} + ${a})(${N(x)} − ${a}) − ${pn(x)}·(${N(x)} ${tail(-b)}) = ${N(rnd(x+a))}·${pn(rnd(x-a))} − ${pn(x)}·${pn(rnd(x-b))} = ${N(L)} − ${pn(Rr)} = ${N(ans)}. Ответ тот же, но вычислений гораздо больше. Упрощение «съело» x² — поэтому его выгодно делать первым.`};});
G(6,()=>{const a=R(1,9),x=niceX();
const simp=[2*a*a,-2*a],ans=rnd(pev(simp,x));
return {type:'num',q:`Упрости выражение и найди его значение при x = ${N(x)}:<br><span class="m">(x − ${a})² − (x + ${a})(x − ${a})</span>`,ans,
short:`Выражение равно ${pf(simp)}; при x = ${N(x)}: ${N(ans)}.`,
explain:`1) (x − ${a})² = x² − ${2*a}x + ${a*a}.<br>2) (x + ${a})(x − ${a}) = x² − ${a*a}.<br>3) Вычитаем, раскрывая скобку с минусом: x² − ${2*a}x + ${a*a} − x² + ${a*a} = <b>${pf(simp)}</b>.<br>4) При x = ${N(x)}: −${2*a}·${pn(x)} + ${2*a*a} = ${N(rnd(-2*a*x))} + ${2*a*a} = <b>${N(ans)}</b>.<br>Частая ошибка: −(x² − ${a*a}) = −x² <b>+</b> ${a*a}, а не −x² − ${a*a}.`,
explain2:`Другой путь — вынести общую скобку (x − ${a}): (x − ${a})·[(x − ${a}) − (x + ${a})] = (x − ${a})·(−${2*a}) = ${pf(simp)}. Подставляем: ${N(rnd(x-a))}·(−${2*a}) = ${N(ans)}.`};});
G(6,()=>{const a=pick([1.25,2.5,0.75,1.5,0.25]),b=pick([0.4,0.2,0.8,1.2,2]);
const ans=rnd(4*a*b),L=rnd((a+b)*(a+b)),Rr=rnd((a-b)*(a-b));
return {type:'num',q:`Найди значение выражения при a = ${N(a)}, b = ${N(b)}:<br><span class="m">(a + b)² − (a − b)²</span>`,ans,
hint:'Сначала упрости: раскрой оба квадрата.',
short:`(a + b)² − (a − b)² = 4ab = 4 · ${N(a)} · ${N(b)} = ${N(ans)}.`,
explain:`1) (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b².<br>2) Вычитаем: a² + 2ab + b² − a² + 2ab − b² = <b>4ab</b>.<br>3) 4 · ${N(a)} · ${N(b)} = <b>${N(ans)}</b>.`,
explain2:`В лоб: (${N(a)} + ${N(b)})² − (${N(a)} − ${N(b)})² = ${N(rnd(a+b))}² − ${pn(rnd(a-b))}² = ${N(L)} − ${N(Rr)} = ${N(ans)}. С десятичными дробями в квадрате легко ошибиться, а 4ab считается за секунду.<br>Или как разность квадратов: (A − B)(A + B), где A = a + b, B = a − b: A − B = 2b, A + B = 2a → 4ab.`};});
G(6,()=>{let k,a,b,c,X;do{k=R(2,5);a=nz(-6,6);b=nz(-6,6);c=nz(-6,6);X=b*k-k*a-c;}while(!X);
const x=niceX();const simp=[b*c,X],ans=rnd(pev(simp,x));
return {type:'num',q:`Упрости выражение и найди его значение при x = ${N(x)}:<br><span class="m">${k}x(${xp(-a)}) − (${xp(-b)})(${k}x ${tail(c)})</span>`,ans,
short:`Выражение равно ${pf(simp)}; при x = ${N(x)}: ${N(ans)}.`,
explain:`1) ${k}x(${xp(-a)}) = ${pf([0,-k*a,k])}.<br>2) (${xp(-b)})(${k}x ${tail(c)}) = ${pf([-b*c,c-b*k,k])}.<br>3) Вычитаем — вторая скобка с минусом, меняем все знаки: ${pf([0,-k*a,k])} ${(()=>{const t=pf([b*c,-(c-b*k),-k]);return t[0]==='−'?'− '+t.slice(1):'+ '+t;})()} = <b>${pf(simp)}</b> (x² уничтожились).<br>4) При x = ${N(x)}: ${N(X)}·${pn(x)} ${tail(b*c)} = <b>${N(ans)}</b>.`,
explain2:`Проверим упрощение при x = 1: исходное ${k}·${N(1-a)} − ${N(1-b)}·${N(k+c)} = ${N(k*(1-a)-(1-b)*(k+c))}; упрощённое ${N(X)} ${tail(b*c)} = ${N(X+b*c)} ✅. Значит, упростили верно, и можно смело подставлять x = ${N(x)}.`};});

/* L7: checking by substitution */
G(7,()=>{const a=R(1,9),v=pick(['A','B']);
let expr,ok,w,f;
if(v==='A'){expr=`(x + ${a})² − (x − ${a})²`;ok=`${4*a}x`;w=[`${2*a*a}`,'0',`2x² + ${2*a*a}`];f=x=>(x+a)*(x+a)-(x-a)*(x-a);}
else{expr=`(x + ${a})(x − ${a}) − (x − ${a})²`;ok=`${2*a}x − ${2*a*a}`;w=[`−${2*a*a}`,'0',`${2*a}x`];f=x=>(x+a)*(x-a)-(x-a)*(x-a);}
const opts=[ok,...w];const vals=x=>opts.map(o=>{const s=o.replace(/−/g,'-').replace(/(\d)x²/,'$1*x*x').replace(/(\d)x/,'$1*x');return new Function('x','return '+s)(x);});
const v1=vals(1),v2=vals(2);
return {type:'choice',q:`Ученики упростили выражение <span class="m">${expr}</span> и получили разные ответы. Какой ответ верный? (Подсказка: проверь подстановкой.)`,...ch(ok,w),
short:`При x = 1 выражение равно ${N(f(1))}, при x = 2 — ${N(f(2))}. Подходит только ${ok}.`,
explain:`Упрощаем:<br>${v==='A'?`(x² + ${2*a}x + ${a*a}) − (x² − ${2*a}x + ${a*a}) = x² + ${2*a}x + ${a*a} − x² + ${2*a}x − ${a*a} = <b>${ok}</b>.`:`(x² − ${a*a}) − (x² − ${2*a}x + ${a*a}) = x² − ${a*a} − x² + ${2*a}x − ${a*a} = <b>${ok}</b>.`}<br>Самые частые ошибки: забыть удвоенное произведение в квадрате или не поменять знаки после минуса перед скобкой.`,
explain2:`Проверка подстановкой — посчитаем исходное выражение и все ответы:<br>• x = 1: выражение = ${N(f(1))}; ответы: ${opts.map((o,i)=>`${o} → ${N(v1[i])}`).join('; ')}.<br>• x = 2: выражение = ${N(f(2))}; ответы: ${opts.map((o,i)=>`${o} → ${N(v2[i])}`).join('; ')}.<br>Оба раза совпадает только <b>${ok}</b>.`};});
G(7,()=>{const k=R(5,15),m=R(1,9),c=R(2,6),v=pick(['A','B']);
if(v==='A'){const claim=`${k} − (x − ${m}) = ${k} − x − ${m}`;
 const ok=`У числа ${m} должен быть знак «+»`;
 const w=['Ошибки нет','У x должен быть знак «+»',`Должно быть −${k}`];
 return {type:'choice',q:`Ученик записал: <span class="m">${claim}</span>. Найди ошибку.`,...ch(ok,w),
 short:`−(x − ${m}) = −x + ${m}. Правильно: ${k + m} − x.`,
 explain:`Минус перед скобкой меняет знак <b>каждого</b> слагаемого: −(x − ${m}) = −x <b>+ ${m}</b>.<br>Правильно: ${k} − x + ${m} = ${k+m} − x. У ученика знак поменялся только у x.`,
 explain2:`Проверим подстановкой x = 0:<br>• слева: ${k} − (0 − ${m}) = ${k} + ${m} = ${k+m};<br>• справа у ученика: ${k} − 0 − ${m} = ${N(k-m)}.<br>${k+m} ≠ ${N(k-m)} — значит, ошибка есть. Если исправить знак у ${m}: ${k} − 0 + ${m} = ${k+m} ✅.`};}
const claim=`${c}(x − ${m}) = ${c}x − ${m}`;
const ok=`Нужно −${c*m}: на ${c} умножается и ${m}`;
const w=['Ошибки нет',`Нужно −${c}x`,`Нужно + ${m}`];
return {type:'choice',q:`Ученик записал: <span class="m">${claim}</span>. Найди ошибку.`,...ch(ok,w),
short:`${c}·${m} = ${c*m}: ${c}(x − ${m}) = ${c}x − ${c*m}.`,
explain:`Множитель перед скобкой умножается на <b>каждое</b> слагаемое: ${c}·x = ${c}x и ${c}·(−${m}) = <b>−${c*m}</b>.<br>Правильно: ${c}x − ${c*m}.`,
explain2:`Проверим подстановкой x = 0:<br>• слева: ${c}·(0 − ${m}) = −${c*m};<br>• справа у ученика: 0 − ${m} = −${m}.<br>−${c*m} ≠ −${m}, значит ошибка. Представь ${c} пакета, в каждом x яблок без ${m}: не хватает ${m} яблок в <b>каждом</b> пакете — всего ${c*m}.`};});
G(7,()=>{let a,b;do{a=nz(-6,6);b=nz(-6,6);}while(a===b||a+b===0||a===-b);
const truth=Math.random()<0.5;
const right=[-a*b,b-a,1];const shown=truth?right:pick([[a*b,b-a,1],[-a*b,a-b,1],[-a*b,a+b,1]]);
const same=JSON.stringify(shown)===JSON.stringify(right);
const L=x=>(x-a)*(x+b),Rv=x=>pev(shown,x);
return {type:'choice',q:`Верно ли тождество <span class="m">(${xp(-a)})(${xp(b)}) = ${pf(shown)}</span>?`,opts:['Да, верно','Нет, неверно'].map(M),ans:same?0:1,
short:same?`Раскрываем: ${pf(right)} — совпало.`:`На самом деле (${xp(-a)})(${xp(b)}) = ${pf(right)}.`,
explain:`Раскроем скобки: x² ${tail(b)}x ${tail(-a)}x ${tail(-a*b)} = <b>${pf(right)}</b>.<br>${same?'Совпадает с правой частью — тождество верно.':`Справа написано ${pf(shown)} — это другое выражение, тождество <b>неверно</b>.`}`,
explain2:`Проверим подстановкой:<br>• x = 0: слева ${pn(-a)}·${pn(b)} = ${N(L(0))}, справа ${N(Rv(0))};<br>• x = 1: слева ${N(1-a)}·${N(1+b)} = ${N(L(1))}, справа ${N(Rv(1))}.<br>${same?'Совпало при обоих x ✅ (для многочленов второй степени достаточно проверить три числа, но две проверки — уже хороший знак).':'Хотя бы в одном случае не совпало ❌ — значит, это не тождество. Одного несовпадения достаточно!'}`};});

/* L8: ★ smart computation */
G(8,()=>{const v=pick(['A','B']),n=R(1985,2035),k=R(1,3);
