  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){

<div class="box rule"><b>Равносильные преобразования</b>Корни не меняются, если:<br>1) к обеим частям прибавить (или вычесть) одно и то же число или выражение;<br>2) обе части умножить или разделить на одно и то же число, <b>не равное нулю</b>.</div>
<p>Снимем с обеих чаш по 3: ${M('2x = 8')}. Разделим обе чаши пополам: ${M('x = 4')}. Равновесие не нарушилось ни разу — значит, корень тот же.</p>
<div class="box err"><b>Почему нельзя умножать на 0</b>${M('2x + 3 = 11')}, умножим на 0: ${M('0 = 0')} — теперь подходит <b>любое</b> x. Уравнение «сломалось». А делить на выражение с x опасно: вдруг оно равно нулю.</div>
<div class="fact">Знак «=» придумал валлийский математик Роберт Рекорд в 1557 году. Он объяснил выбор так: ничто не может быть более равным, чем две параллельные чёрточки.</div>`},
{title:'Простейшее уравнение ax = b',lvl:1,html:`
<div class="box rule"><b>Правило</b>Если ${M('ax = b')} и <b>a ≠ 0</b>, то ${M(`x = ${fr('b','a')}`)} — единственный корень.</div>
<p><b>Почему?</b> Делим обе части на a (можно, раз a ≠ 0) — по правилу весов корни не меняются.</p>
<div class="box ex"><b>Примеры</b>${M('5x = 35')} → x = 7.<br>${M('−4x = 20')} → x = 20 : (−4) = −5.<br>${M('6x = 4')} → x = ${fr(4,6)} = ${fr(2,3)} — дробный корень, это нормально!<br>${M('−x = 8')} → x = −8 (здесь a = −1).<br>${M(`${fr('x','3')} = 5`)} → умножаем на 3: x = 15.</div>
<div class="box err"><b>Частые ошибки</b>• ${M('5x = 35')} → «x = 5/35». Делим <b>правую часть на коэффициент</b>, а не наоборот.<br>• ${M('−4x = 20')} → «x = 5». Минус потерялся: 20 : (−4) = −5.<br>• ${M('x + 5 = 12')} → «x = 12/5». Тут x не умножен на 5, а сложен с 5: x = 12 − 5 = 7.</div>`},
{title:'Перенос слагаемых: ax + b = cx + d',lvl:2,html:`
<div class="box rule"><b>Правило переноса</b>Любое слагаемое можно перенести из одной части уравнения в другую, <b>поменяв его знак</b> на противоположный.</div>
<p><b>Почему работает?</b> Перенос — это сокращённая запись «вычти из обеих частей». ${M('5x − 3 = 2x + 9')}: вычтем 2x из обеих частей → ${M('3x − 3 = 9')}; прибавим 3 → ${M('3x = 12')}. Слагаемые «перепрыгнули» и сменили знак.</p>
<ol class="steps"><li>Иксы — влево, числа — вправо (со сменой знака).</li><li>Приведи подобные.</li><li>Раздели на коэффициент при x.</li><li>Проверь подстановкой.</li></ol>
<div class="box ex"><b>Пример</b>${M('5x − 3 = 2x + 9')} → ${M('5x − 2x = 9 + 3')} → ${M('3x = 12')} → x = 4.<br>Проверка: 5·4 − 3 = 17, 2·4 + 9 = 17 ✅</div>
<div class="box ex"><b>Десятичные дроби</b>${M('0,5x + 1,2 = 0,3x + 2')}. Умножим всё на 10: ${M('5x + 12 = 3x + 20')} → 2x = 8 → x = 4.</div>
<div class="box err"><b>Главная ошибка</b>Перенести и забыть сменить знак: ${M('5x − 3 = 2x + 9')} → «5x − 2x = 9 − 3». Тройка перешла через «=», значит −3 стало <b>+3</b>.</div>
<div class="fact">Слово «алгебра» — от арабского «аль-джабр», что значит «восстановление». Так аль-Хорезми (IX век) называл именно перенос вычитаемого в другую часть уравнения: «восстановить» отнятое. То есть ты сейчас делаешь ту самую операцию, которая дала имя всей науке.</div>`},
{title:'Уравнения со скобками',lvl:3,html:`
<div class="box rule"><b>Правило</b>Сначала раскрой скобки: ${M('k(a + b) = ka + kb')}.<br>Минус перед скобкой меняет знак <b>каждого</b> слагаемого внутри: ${M('−(a − b) = −a + b')}.</div>
<div class="box ex"><b>Пример</b>${M('3(x − 2) − 2(x + 4) = 1')}<br>→ ${M('3x − 6 − 2x − 8 = 1')}<br>→ ${M('x − 14 = 1')} → x = 15.</div>
<div class="box err"><b>Ловушка «минус перед скобкой»</b>${M('−2(x + 4)')} — это ${M('−2x − 8')}, а не «−2x + 8» и не «−2x + 4». Умножается <b>каждое</b> слагаемое, и знак тоже.</div>
<div class="box ex"><b>Пример с квадратами, которые исчезают</b>${M('x(x + 3) − (x − 1)(x + 2) = 8')}<br>${M('x² + 3x − (x² + x − 2) = 8')}<br>${M('x² + 3x − x² − x + 2 = 8')} → ${M('2x = 6')} → x = 3.<br>Выглядит страшно, а x² сократились — уравнение линейное!</div>`},
{title:'Уравнения с дробями',lvl:4,html:`
<div class="box rule"><b>Правило</b>Умножь <b>обе части</b> (то есть <b>каждое слагаемое</b>!) на общий знаменатель всех дробей. Дроби исчезнут.</div>
<div class="box ex"><b>Пример</b>${M(`${fr('x','3')} + ${fr('x','4')} = 7`)}. Общий знаменатель 12:<br>${M('4x + 3x = 84')} → 7x = 84 → x = 12.</div>
<div class="box ex"><b>Пример с числителем-суммой</b>${M(`${fr('x − 1','2')} − ${fr('x + 2','3')} = 1`)}. Умножаем на 6:<br>${M('3(x − 1) − 2(x + 2) = 6')} → ${M('3x − 3 − 2x − 4 = 6')} → x = 13.</div>
<div class="box err"><b>Две ловушки</b>• Умножить на 6 только дроби, а число 1 справа забыть. Получится «x − 7 = 1» — неверно.<br>• Минус перед дробью ${M(`− ${fr('x + 2','3')}`)} относится ко <b>всему</b> числителю. Поэтому ставь скобки: −2(x + 2) = −2x − 4.</div>
<div class="box tip"><b>Лайфхак</b>Числитель после умножения всегда бери в скобки — тогда знак не потеряется.</div>`},
{title:'Нет корней или бесконечно много',lvl:5,html:`
<p>Иногда после упрощения иксы исчезают совсем. Тогда остаётся ${M('0·x = b')}.</p>
<div class="box rule"><b>Правило</b>• ${M('0·x = b')}, b ≠ 0 → <b>корней нет</b> (0 ни при каком x не станет равным b).<br>• ${M('0·x = 0')} → <b>бесконечно много корней</b>: подходит любое x.<br>• ${M('ax = b')}, a ≠ 0 → ровно <b>один корень</b>.</div>
<div class="box ex"><b>Примеры</b>${M('2(x + 3) = 2x + 5')} → ${M('2x + 6 = 2x + 5')} → ${M('0·x = −1')} → корней нет.<br>${M('3(x − 1) + 3 = 3x')} → ${M('3x = 3x')} → ${M('0·x = 0')} → любое x.</div>
<p><b>Почему так?</b> Слева и справа «одинаковые машины»: если они при любом x отличаются на 1, равенства не будет никогда. Если совпадают полностью — равенство будет всегда.</p>
<div class="box err"><b>Частая ошибка</b>Получить ${M('0 = 0')} и написать «x = 0». Нет! 0 = 0 верно при <b>любом</b> x — корней бесконечно много.</div>
<p><b>Поиграй:</b> задай коэффициенты уравнения ${M('ax + b = cx + d')} и смотри, что получится.</p>
<div class="widget" id="w-lin"></div>`},
{title:'Уравнения с модулем',lvl:6,html:`
<div class="box rule"><b>Правило</b>${M('|A| = b')}:<br>• если <b>b < 0</b> — корней нет (модуль не бывает отрицательным);<br>• если <b>b = 0</b> — ${M('A = 0')};<br>• если <b>b > 0</b> — ${M('A = b')} или ${M('A = −b')}.</div>
<p><b>Смысл модуля.</b> ${M('|x − a|')} — это <b>расстояние</b> между точками x и a на числовой прямой. Поэтому ${M('|x − 3| = 5')} читается так: «найди точки, которые отстоят от 3 на 5 шагов». Их две: 3 + 5 = 8 и 3 − 5 = −2.</p>
<div class="fig">${nline([{x:-2,hl:1},{x:3},{x:8,hl:1}],{arcs:[[-2,3,'5'],[3,8,'5']]})}</div>
<div class="box ex"><b>Пример</b>${M('|2x + 1| = 7')} → ${M('2x + 1 = 7')} или ${M('2x + 1 = −7')} → x = 3 или x = −4.</div>
<div class="box rule"><b>Модуль равен модулю</b>${M('|A| = |B|')} ⇔ ${M('A = B')} или ${M('A = −B')}. Числа с равными модулями либо равны, либо противоположны.</div>
<div class="box ex"><b>Пример</b>${M('|2x + 1| = |x − 4|')}:<br>${M('2x + 1 = x − 4')} → x = −5;<br>${M('2x + 1 = −(x − 4)')} → ${M('3x = 3')} → x = 1.<br>Проверка: |−9| = |−9| ✅, |3| = |−3| ✅.</div>
<div class="box err"><b>Ловушки</b>• Забыть второй случай со знаком «−».<br>• ${M('|x − 2| = −3')} → «x = −1 или x = 5». Нет: модуль ≥ 0, корней нет!<br>• Во втором случае ${M('A = −B')} минус относится ко <b>всему</b> B: −(x − 4) = −x + 4.</div>`},
{title:'Уравнения с параметром',lvl:7,html:`
<p>Параметр — это буква (обычно a), которая обозначает «какое-то число, но мы не знаем какое». Задача: понять, что происходит с уравнением <b>при каждом</b> a. Это как настройка в игре: двигаешь ползунок сложности — и поведение меняется.</p>
<div class="box rule"><b>Исследование уравнения ax = b</b>• a ≠ 0 → один корень ${M(`x = ${fr('b','a')}`)};<br>• a = 0, b ≠ 0 → корней нет;<br>• a = 0, b = 0 → x — любое число.</div>
<div class="box ex"><b>Пример</b>${M('(a − 2)x = 5')}.<br>При a = 2: ${M('0·x = 5')} — корней нет.<br>При a ≠ 2: ${M(`x = ${fr('5','a − 2')}`)}.</div>
<div class="box ex"><b>Пример хитрее</b>${M('(a − 3)x = a² − 9')}. Справа ${M('(a − 3)(a + 3)')}.<br>a = 3: ${M('0·x = 0')} — любое x.<br>a ≠ 3: делим на (a − 3): <b>x = a + 3</b>. Даже при a = −3 корень есть: x = 0.</div>
<div class="box err"><b>Главная ошибка</b>Сразу разделить на (a − 2) и написать ответ. А если a − 2 = 0? Перед делением на выражение с параметром <b>всегда</b> отдельно разбирай случай, когда оно равно нулю.</div>`},
{title:'★ Олимпиадные идеи',lvl:8,html:`
<div class="box rule"><b>Идея 1: целые решения ax + by = c</b>Если a и b делятся на d, то и ax + by делится на d. Значит, если c на d <b>не делится</b> — целых решений нет. Пример: ${M('6x + 9y = 100')} — слева кратно 3, справа нет → решений нет.<br>Если же c делится на НОД(a, b), целых решений бесконечно много: из одного решения (x; y) получаются другие (x + b/d·t; y − a/d·t).</div>
<div class="box ex"><b>Сколько натуральных решений у 3x + 5y = 31?</b>Перебираем y: 31 − 5y должно делиться на 3 и быть > 0. y = 2 → x = 7; y = 5 → x = 2. Ответ: 2 решения. Шаг по y равен 3 — коэффициенту при x.</div>
<div class="box rule"><b>Идея 2: сумма модулей = сумма расстояний</b>${M('|x − 1| + |x − 5|')} — сумма расстояний от x до точек 1 и 5. Для любой точки между ними сумма равна ровно 4; снаружи — больше. Поэтому ${M('|x − 1| + |x − 5| = 4')} имеет <b>бесконечно много</b> корней (весь отрезок [1; 5]), а ${M('= 3')} — ни одного.</div>
<div class="box rule"><b>Идея 3: модуль в модуле</b>${M('||x − 2| − 3| = 1')} → ${M('|x − 2| = 4')} или ${M('|x − 2| = 2')} → 4 корня: −2, 0, 4, 6. Раскрывай модули снаружи внутрь.</div>
<div class="fact">Уравнения в целых числах называют <b>диофантовыми</b> — в честь Диофанта Александрийского (III век). А знаменитая Великая теорема Ферма — тоже про диофантово уравнение xⁿ + yⁿ = zⁿ; её доказал Эндрю Уайлс только в 1994 году, через 357 лет после Ферма.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps"><li>Корень — число, которое делает уравнение верным равенством.</li>
<li>Можно прибавлять к обеим частям одно и то же, умножать/делить на одно и то же ≠ 0.</li>
<li>Перенос через «=» — со сменой знака.</li>
<li>Скобки: минус перед скобкой меняет все знаки внутри.</li>
<li>Дроби: умножь <b>каждое</b> слагаемое на общий знаменатель.</li>
<li>${M('0·x = b ≠ 0')} — корней нет; ${M('0·x = 0')} — любое x.</li>
<li>${M('|A| = b')}: b < 0 — нет корней, иначе A = ±b. ${M('|A| = |B|')} ⇔ A = ±B.</li>
<li>Параметр: сначала случай «коэффициент при x равен 0».</li></ul>`}
];

/* ---------- symbols ---------- */
const symbols={tab:'Формулы',title:'Главное о линейных уравнениях',rows:[
['ax = b','Простейшее линейное уравнение','При a ≠ 0 один корень x = b/a.',M('4x = 28 → x = 7')],
['A + c = B ⇔ A = B − c','Перенос слагаемого','Слагаемое переходит в другую часть со сменой знака.',M('x + 5 = 12 → x = 12 − 5')],
['−(a − b) = −a + b','Минус перед скобкой','Знак меняется у каждого слагаемого в скобке.',M('−(2x − 7) = −2x + 7')],
['0·x = b','Нет корней / любое x','b ≠ 0 — корней нет; b = 0 — бесконечно много.',M('2x + 1 = 2x + 3 → 0 = 2')],
['|A| = b','Уравнение с модулем','b < 0 — нет корней; b ≥ 0 — A = b или A = −b.',M('|x − 3| = 5 → x = 8; −2')],
['|x − a|','Расстояние','Расстояние между x и a на числовой прямой.',M('|7 − 3| = 4')],
['|A| = |B|','Модуль равен модулю','A = B или A = −B.',M('|x| = |x − 2| → x = 1')],
['ax + by = c','Диофантово уравнение','Целые решения есть ⇔ c делится на НОД(a, b).',M('6x + 4y = 7 — решений нет')]
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Иксы — влево, числа — вправо, знак меняем. А в конце — проверка подстановкой.</div>`};

/* ---------- generators ---------- */
const gens=[];
const G=(lvl,make,f)=>gens.push({lvl,make,star:(f||'').includes('s')||undefined,rule:(f||'').includes('r')||undefined});

/* L0 — корень, равносильность */
G(0,()=>{const ok='значение переменной, при котором уравнение обращается в верное числовое равенство';
const o=mk(ok,['число, которое стоит в правой части уравнения','коэффициент, стоящий перед x','любое число, которое можно подставить вместо x']);
return {type:'choice',q:'Что называют <b>корнем уравнения</b>?',...o,short:'Корень — число, которое делает уравнение верным равенством.',
explain:`Корень — это <b>значение неизвестного</b>, при котором получается <b>верное</b> равенство. Например, у ${M('2x + 1 = 7')} корень 3: 2·3 + 1 = 7 ✅.<br>Число справа (7) — просто часть записи. Коэффициент (2) — тоже. А «любое число» подставить можно, но верное равенство получится не всегда.`,
explain2:`Представь замок с кодом: x — это код. Подставляешь число — замок либо открылся (равенство верно), либо нет. Корень — тот код, который <b>открывает</b> замок.`};},'r');
G(0,()=>{const ok='прибавить к обеим частям одно и то же число или умножить обе части на одно и то же число, не равное нулю';
const o=mk(ok,['умножить обе части на любое число, в том числе на 0','прибавить число только к левой части','разделить обе части на x']);
return {type:'choice',q:'Какое действие <b>не меняет корней</b> уравнения?',...o,short:'Равносильные преобразования: одно и то же с обеими частями, умножать/делить — только на число ≠ 0.',
explain:`Уравнение — весы. Равновесие сохраняется, если с <b>обеими</b> чашами делать одно и то же: прибавлять одно и то же, умножать на одно и то же <b>ненулевое</b> число.<br>• Умножить на 0 — получится 0 = 0, и подойдёт любое x: корни изменились.<br>• Прибавить только к одной части — весы перекосятся.<br>• Делить на x опасно: если x = 0 — корень, он потеряется.`,
explain2:`Проверь на ${M('2x = 6')} (корень 3). Прибавим 4 к обеим частям: 2x + 4 = 10 — корень всё ещё 3 ✅. Умножим на 0: 0 = 0 — теперь подходит и 3, и 100. Корни «размножились» — так нельзя.`};},'r');
G(0,()=>{let a,b,c,d,r;do{r=R(-7,7);a=nz(-6,7);c=nz(-6,7);b=R(-12,12);d=(a-c)*r+b;}while(a===c||Math.abs(d)>40||!c);
const cand=[...new Set([-r,r+1,r-1,r+2,r-2].filter(v=>v!==r))];const vals=shuffle([r,...shuffle(cand).slice(0,3)]);
const o={opts:vals.map(n),ans:vals.indexOf(r)};const w=vals[(o.ans+1)%vals.length];
return {type:'choice',q:`Какое из чисел является корнем уравнения ${M(eqS(a,b,c,d))}?`,opts:o.opts,ans:o.ans,hint:'Подставь каждое число вместо x и посчитай обе части.',
short:`${chk(a,b,c,d,r)}`,
explain:`Корень — число, при котором левая и правая части равны. Подставим:<br>${chk(a,b,c,d,r)}<br>А, например, ${chk(a,b,c,d,w)}.<br>Ответ: <b>${n(r)}</b>.`,
explain2:`Можно и решить: ${solveLin(a,b,c,d)}`};});
G(0,()=>{let a,b,c,m,yes;a=nz(-5,6);b=R(-10,10);m=R(-6,6);yes=Math.random()<0.5;c=a*m+b+(yes?0:pick([-2,-1,1,2]));
const ok=yes?0:1;const opts=['Да, является','Нет, не является'];
return {type:'choice',q:`Является ли число ${M(n(m))} корнем уравнения ${M(`${L(a,b)} = ${n(c)}`)}?`,opts,ans:ok,hint:'Подставь число вместо x.',
short:`${n(a)}·${P(m)} ${sg(b)} ${n(Math.abs(b))} = ${n(a*m+b)} ${yes?'=':'≠'} ${n(c)}.`,
explain:`Подставим x = ${n(m)}: ${n(a)}·${P(m)} ${sg(b)} ${n(Math.abs(b))} = ${n(a*m)} ${sg(b)} ${n(Math.abs(b))} = <b>${n(a*m+b)}</b>.<br>Справа ${n(c)}. ${yes?'Равенство верное — значит, <b>является</b>.':`${n(a*m+b)} ≠ ${n(c)} — равенство неверное, значит, <b>не является</b>.`}`,
explain2:`Решим уравнение: ${M(`${poly([[a,'x']])} = ${n(c)} ${b>=0?'−':'+'} ${n(Math.abs(b))} = ${n(c-b)}`)} → x = ${rat(c-b,a)}. ${yes?`Это и есть ${n(m)}.`:`Это не ${n(m)}.`} Корень единственный, так что ответ «${opts[ok].toLowerCase()}».`};});

/* L1 — ax = b */
G(1,()=>{const o=mk(M(`x = ${fr('b','a')}`),[M(`x = ${fr('a','b')}`),M('x = b − a'),M('x = a·b')]);
return {type:'choice',q:`Как найти корень уравнения ${M('ax = b')}, если a ≠ 0?`,...o,short:'Делим правую часть на коэффициент: x = b/a.',
explain:`В ${M('ax = b')} икс <b>умножен</b> на a. Обратное действие к умножению — деление. Делим обе части на a (можно, ведь a ≠ 0): ${M(`x = ${fr('b','a')}`)}.<br>Пример: 5x = 35 → x = 35 : 5 = 7. Вариант a/b дал бы 5/35 — проверь: 5·${fr(5,35)} ≠ 35.`,
explain2:`Как в начальной школе: «неизвестный множитель = произведение : известный множитель». Произведение — b, известный множитель — a. Значит, x = b : a.`};},'r');
G(1,()=>{let a,x;do{a=nz(-9,12);x=nz(-12,12);}while(Math.abs(a)===1);const b=a*x;
return {type:'num',q:`Реши уравнение ${M(`${poly([[a,'x']])} = ${n(b)}`)}.`,ans:x,keys:NUMKEYS,
short:`x = ${n(b)} : ${P(a)} = ${n(x)}.`,
explain:`Делим обе части на коэффициент при x, то есть на ${P(a)}:<br>x = ${n(b)} : ${P(a)} = <b>${n(x)}</b>.<br>${(a<0)!==(b<0)?'Знаки разные — частное отрицательное.':'Знаки одинаковые — частное положительное.'}<br>Проверка: ${n(a)}·${P(x)} = ${n(b)} ✅`,
explain2:`Спроси себя: «на что надо умножить ${P(a)}, чтобы получить ${n(b)}?» ${P(a)}·${P(x)} = ${n(b)}. Значит, x = ${n(x)}.`};});
G(1,()=>{let a,b;do{a=nz(-9,9);b=nz(-20,20);}while(Math.abs(a)<2||b%a===0);
return {type:'num',q:`Реши уравнение ${M(`${poly([[a,'x']])} = ${n(b)}`)}. Ответ можно записать дробью.`,ans:b/a,ansText:rat(b,a),keys:NUMKEYS,ph:NUMPH,
short:`x = ${fr(n(b),n(a))} = ${rat(b,a)}.`,
explain:`Делим на ${P(a)}: x = ${fr(n(b),n(a))}${gcd(a,b)>1?`. Сокращаем на ${gcd(a,b)}`:''}: x = <b>${rat(b,a)}</b>.<br>Дробный корень — это нормально, не каждое уравнение решается в целых числах. Вводи как ${(b/a<0?'-':'')+Math.abs(b/gcd(a,b))}/${Math.abs(a/gcd(a,b))}.`,
explain2:`Проверка: ${n(a)}·${rat(b,a)} = ${fr(`${n(a)}·${P(b)}`,n(a))} = ${n(b)} ✅ — множитель ${n(a)} сокращается. Если бы ответ был ${rat(a,b)} (перевёрнутая дробь), получилось бы ${rat(a*a,b)} ≠ ${n(b)}.`};});
G(1,()=>{const kind=pick(['plus','minus','rev','div','neg']);let q,ans,ex,ex2;
if(kind==='plus'){const a=R(2,30),x=R(-15,30);const b=x+a;q=`x + ${a} = ${n(b)}`;ans=x;ex=`Тут x не умножен, а <b>сложен</b> с ${a}. Переносим ${a} вправо со сменой знака: x = ${n(b)} − ${a} = <b>${n(x)}</b>.`;ex2=`«Какое число плюс ${a} даёт ${n(b)}?» — ${n(x)}, ведь ${n(x)} + ${a} = ${n(b)}.`;}
else if(kind==='minus'){const a=R(2,30),x=R(-10,30);const b=x-a;q=`x − ${a} = ${n(b)}`;ans=x;ex=`Переносим −${a} вправо, знак меняется: x = ${n(b)} + ${a} = <b>${n(x)}</b>.`;ex2=`Уменьшаемое = разность + вычитаемое: x = ${n(b)} + ${a} = ${n(x)}.`;}
else if(kind==='rev'){const a=R(5,30),x=R(-10,30);const b=a-x;q=`${a} − x = ${n(b)}`;ans=x;ex=`Переносим: ${M(`−x = ${n(b)} − ${a} = ${n(b-a)}`)}, значит x = <b>${n(x)}</b>.<br>Ловушка: ответ «${n(b-a)}» — забыли, что слева было −x.`;ex2=`Вычитаемое = уменьшаемое − разность: x = ${a} − ${P(b)} = ${n(x)}.`;}
else if(kind==='div'){const a=R(2,9),x=nz(-8,9)*a;const b=x/a;q=`${fr('x',a)} = ${n(b)}`;ans=x;ex=`x <b>разделили</b> на ${a}. Обратное действие — умножение: x = ${n(b)}·${a} = <b>${n(x)}</b>.<br>Ловушка: «x = ${fr(n(b),a)}» — это деление вместо умножения.`;ex2=`Проверка: ${n(x)} : ${a} = ${n(b)} ✅. Делимое = частное · делитель.`;}
else{const x=nz(-20,20);q=`−x = ${n(-x)}`;ans=x;ex=`${M('−x')} — это ${M('−1·x')}. Делим на −1: x = <b>${n(x)}</b>. Если −x = ${n(-x)}, то x — число, противоположное ${n(-x)}.`;ex2=`Умножь обе части на −1: x = ${n(x)}. Проверка: −(${n(x)}) = ${n(-x)} ✅.`;}
return {type:'num',q:`Реши уравнение ${M(q)}.`,ans,keys:NUMKEYS,short:`x = ${n(ans)}.`,explain:ex,explain2:ex2};});

/* L2 — перенос */
G(2,()=>{const o=mk('его знак меняется на противоположный',['его знак сохраняется','знак меняется, только если слагаемое отрицательное','слагаемое нужно разделить на коэффициент при x']);
return {type:'choice',q:'При переносе слагаемого из одной части уравнения в другую…',...o,short:'Перенос — со сменой знака.',
explain:`Перенос — это «вычти (или прибавь) одно и то же к обеим частям». ${M('x + 5 = 12')}: вычтем 5 из обеих частей → ${M('x = 12 − 5')}. Плюс 5 слева превратился в минус 5 справа. Знак меняется <b>всегда</b> — и у положительных, и у отрицательных слагаемых.`,
explain2:`${M('x − 4 = 10')}: прибавим 4 к обеим частям → ${M('x = 10 + 4 = 14')}. Минус 4 стал плюсом. Проверка: 14 − 4 = 10 ✅. Без смены знака вышло бы 6, а 6 − 4 = 2 ≠ 10.`};},'r');
G(2,()=>{let a,b,c,x;do{a=nz(-7,9);x=R(-9,9);b=nz(-25,25);c=a*x+b;}while(Math.abs(a)===1||Math.abs(c)>60);
return {type:'num',q:`Реши уравнение ${M(`${L(a,b)} = ${n(c)}`)}.`,ans:x,keys:NUMKEYS,
short:`${M(`${poly([[a,'x']])} = ${n(c-b)}`)} → x = ${n(x)}.`,
explain:solveLin(a,b,0,c)+`<br>${chk(a,b,0,c,x)}`,
explain2:`Думай «с конца», как распутываешь шнурок: с x сделали «×${P(a)}», потом «${b>0?'+':'−'}${Math.abs(b)}» и получили ${n(c)}. Отматываем назад: ${n(c)} ${b>0?'−':'+'} ${Math.abs(b)} = ${n(c-b)}, потом ${n(c-b)} : ${P(a)} = ${n(x)}.`};});
G(2,()=>{let a,b,c,d,x;do{a=nz(-8,9);c=nz(-8,9);x=R(-8,8);b=nz(-15,15);d=(a-c)*x+b;}while(a===c||Math.abs(d)>40||!d);
return {type:'num',q:`Реши уравнение ${M(eqS(a,b,c,d))}.`,ans:x,keys:NUMKEYS,hint:'Иксы — влево, числа — вправо. Не забудь менять знак!',
short:`${M(`${poly([[a-c,'x']])} = ${n(d-b)}`)} → x = ${n(x)}.`,
explain:solveLin(a,b,c,d)+`<br>${chk(a,b,c,d,x)}`,
explain2:`Сделаем по-«весовому», маленькими шагами:<br>1) ${c>0?'Вычтем':'Прибавим'} ${M(poly([[Math.abs(c),'x']]))} ${c>0?'из':'к'} обеих частей: ${M(`${L(a-c,b)} = ${n(d)}`)}.<br>2) ${b>0?'Вычтем':'Прибавим'} ${Math.abs(b)}: ${M(`${poly([[a-c,'x']])} = ${n(d-b)}`)}.<br>3) Разделим на ${P(a-c)}: x = ${n(x)}.`};});
G(2,()=>{let a,b,c,d,x;do{a=R(3,9);c=R(1,a-1);x=nz(-6,9);b=nz(-12,12);d=(a-c)*x+b;}while(!d||Math.abs(d)>40||a-c<2);
const k=a-c,rhs=d-b,errAt=pick([2,3,4]);
const l2ok=`${poly([[a,'x'],[-c,'x']])} = ${poly([[d,''],[-b,'']])}`;
const l2=errAt===2?`${poly([[a,'x'],[-c,'x']])} = ${poly([[d,''],[b,'']])}`:l2ok;
const r2=errAt===2?d+b:rhs,k3=errAt===3?a+c:k;
const l3=`${poly([[k3,'x']])} = ${n(r2)}`;
const vas=errAt===4?r2*k3:r2/k3;const l4=errAt===4?`x = ${n(vas)}`:`x = ${rat(r2,k3)}`;
const opts=['Строка 2','Строка 3','Строка 4','Ошибок нет'];
const why={2:`при переносе ${n(b)} в правую часть не поменяли знак; надо ${M(l2ok)}`,3:`при приведении подобных ${poly([[a,'x']])} − ${poly([[c,'x']])} посчитали как ${poly([[a+c,'x']])}; надо ${M(`${poly([[k,'x']])} = ${n(rhs)}`)}`,4:`на последнем шаге умножили на ${k} вместо деления; надо x = ${n(rhs)} : ${k} = ${n(x)}`}[errAt];
return {type:'choice',q:`Вася решал уравнение и где-то ошибся. Найди строку с ошибкой.<div class="box ex" style="margin-top:8px">1) ${M(eqS(a,b,c,d))}<br>2) ${M(l2)}<br>3) ${M(l3)}<br>4) ${M(l4)}</div>`,opts,ans:errAt-2,
hint:'Проверь каждый переход: перенос со сменой знака, приведение подобных, деление.',
short:`Ошибка в строке ${errAt}: ${why}.`,
explain:`Идём по строкам.<br>Строка 2 должна быть ${M(l2ok)}. ${errAt===2?'<b>Ошибка здесь</b>: '+why+'.':'Совпадает ✅'}${errAt>2?`<br>Строка 3: ${errAt===3?'<b>ошибка</b>: '+why+'.':'подобные приведены верно ✅'}`:''}${errAt===4?`<br>Строка 4: <b>ошибка</b>: ${why}.`:''}<br>Правильное решение: ${solveLin(a,b,c,d)}`,
explain2:`Самый быстрый способ поймать ошибку — подставить ответ в исходное уравнение. Ответ Васи x = ${errAt===4?n(vas):rat(r2,k3)} не подходит, а правильный x = ${n(x)} подходит: ${chk(a,b,c,d,x)}. Дальше ищем первую строку, где Вася разошёлся с правильным решением, — это строка ${errAt}.`};});
G(2,()=>{let a,b,c,d,x;do{a=R(1,9);c=R(1,9);x=R(-8,8);b=nz(-30,30);d=(a-c)*x+b;}while(a===c||Math.abs(d)>60||!d||b%10===0||d%10===0);
const A=a/10,B=b/10,C=c/10,D=d/10;
return {type:'num',q:`Реши уравнение ${M(`${poly([[A,'x'],[B,'']])} = ${poly([[C,'x'],[D,'']])}`)}.`,ans:x,keys:NUMKEYS,hint:'Умножь обе части на 10 — десятичные дроби исчезнут.',
short:`×10: ${M(eqS(a,b,c,d))} → x = ${n(x)}.`,
explain:`Умножим обе части на 10 (каждое слагаемое!): ${M(eqS(a,b,c,d))}.<br>${solveLin(a,b,c,d)}`,
explain2:`Можно и без умножения: ${M(`${poly([[A,'x'],[-C,'x']])} = ${poly([[D,''],[-B,'']])}`)} → ${M(`${poly([[(a-c)/10,'x']])} = ${n((d-b)/10)}`)} → x = ${n((d-b)/10)} : ${P((a-c)/10)} = ${n(x)}. Но с целыми числами ошибиться труднее.<br>${chk(A,B,C,D,x)}`};});

/* L3 — скобки */
G(3,()=>{const k=R(2,7),m=R(1,9);const ok=M(`−${k}x + ${m*k}`);const o=mk(ok,[M(`−${k}x − ${m*k}`),M(`−${k}x + ${m}`),M(`${k}x + ${m*k}`)]);
return {type:'choice',q:`Как правильно раскрыть скобки: ${M(`−${k}(x − ${m})`)}?`,...o,short:`−${k}·x = −${k}x, −${k}·(−${m}) = +${m*k}.`,
explain:`Множитель −${k} умножается на <b>каждое</b> слагаемое в скобке, вместе со знаком:<br>−${k}·x = −${k}x;<br>−${k}·(−${m}) = <b>+${m*k}</b> (минус на минус — плюс).<br>Итого ${ok}.<br>«−${k}x + ${m}» — забыли умножить второе слагаемое; «−${k}x − ${m*k}» — потеряли смену знака.`,
explain2:`Проверь подстановкой x = 0: ${M(`−${k}(0 − ${m}) = −${k}·(−${m}) = ${m*k}`)}. А ${ok} при x = 0 даёт ${m*k} ✅. Вариант «−${k}x − ${m*k}» дал бы −${m*k} — не совпадает.`};},'r');
G(3,()=>{let a,b,x;do{a=nz(-6,7);b=nz(-9,9);x=R(-9,9);}while(Math.abs(a)===1||x+b===0);const c=a*(x+b);
return {type:'num',q:`Реши уравнение ${M(`${n(a)}(${L(1,b)}) = ${n(c)}`)}.`,ans:x,keys:NUMKEYS,
short:`${M(`${L(1,b)} = ${n(c)} : ${P(a)} = ${n(x+b)}`)} → x = ${n(x)}.`,
explain:`<b>Способ 1</b> — раскрыть скобки: ${M(`${L(a,a*b)} = ${n(c)}`)} → ${M(`${poly([[a,'x']])} = ${n(c-a*b)}`)} → x = <b>${n(x)}</b>.<br><b>Способ 2</b> (быстрее) — разделить обе части на ${P(a)}: ${M(`${L(1,b)} = ${n(x+b)}`)} → x = ${n(x)}.`,
explain2:`Проверка: ${n(a)}·(${n(x)} ${sg(b)} ${Math.abs(b)}) = ${n(a)}·${P(x+b)} = ${n(c)} ✅.<br>Типичная ошибка — раскрыть как «${L(a,b)}», умножив на ${n(a)} только x. Тогда ответ выйдет другим.`};});
G(3,()=>{let a,c,p,q,x,e;do{a=R(2,7);c=R(2,7);p=R(1,6);q=R(1,6);x=R(-6,8);e=a*(x-p)-c*(x+q);}while(a===c||Math.abs(e)>50);
const eq=`${a}(x − ${p}) − ${c}(x + ${q}) = ${n(e)}`;
return {type:'num',q:`Реши уравнение ${M(eq)}.`,ans:x,keys:NUMKEYS,hint:`Осторожно: −${c}(x + ${q}) = −${c}x − ${c*q}.`,
short:`${M(`${poly([[a-c,'x']])} ${sg(-a*p-c*q)} ${a*p+c*q} = ${n(e)}`)} → x = ${n(x)}.`,
explain:`Раскрываем скобки: ${M(`${a}x − ${a*p} − ${c}x − ${c*q} = ${n(e)}`)}.<br>Приводим подобные: ${M(`${poly([[a-c,'x']])} − ${a*p+c*q} = ${n(e)}`)}.<br>${M(`${poly([[a-c,'x']])} = ${n(e+a*p+c*q)}`)} → x = <b>${n(x)}</b>.<div class="box err"><b>Ловушка</b>Написать «−${c}x + ${c*q}». Минус перед ${c} умножается и на ${q} тоже: −${c}·${q} = −${c*q}.</div>`,
explain2:`Проверка x = ${n(x)}: ${a}·${P(x-p)} − ${c}·${P(x+q)} = ${n(a*(x-p))} − ${P(c*(x+q))} = ${n(e)} ✅.`};});
G(3,()=>{let p,q,a,b,x,s;do{p=R(2,6);q=R(2,6);a=nz(-6,6);b=R(1,6);x=R(-6,8);s=p*(x+a)-q*(x-b);}while(p===q||!s||Math.abs(s)>40);
const eq=`${p}(${L(1,a)}) = ${q}(x − ${b}) ${sg(s)} ${Math.abs(s)}`;
return {type:'num',q:`Реши уравнение ${M(eq)}.`,ans:x,keys:NUMKEYS,
short:`${M(`${L(p,p*a)} = ${L(q,-q*b+s)}`)} → x = ${n(x)}.`,
explain:`Раскрываем скобки в обеих частях: ${M(`${L(p,p*a)} = ${q}x − ${q*b} ${sg(s)} ${Math.abs(s)}`)}, справа ${M(L(q,-q*b+s))}.<br>${solveLin(p,p*a,q,-q*b+s)}`,
explain2:`Проверка: слева ${p}·${P(x+a)} = ${p*(x+a)}, справа ${q}·${P(x-b)} ${sg(s)} ${Math.abs(s)} = ${q*(x-b)} ${sg(s)} ${Math.abs(s)} = ${q*(x-b)+s} ✅.`};});
G(3,()=>{let a,b,c,x,d,k;do{a=R(1,6);b=R(1,6);c=R(1,7);k=a+b-c;x=R(-6,6);d=k*x+b*c;}while(!k||Math.abs(d)>60);
const eq=`x(x + ${a}) − (x − ${b})(x + ${c}) = ${n(d)}`;const cb=c-b;
return {type:'num',q:`Реши уравнение ${M(eq)}. (Не пугайся квадратов — они исчезнут.)`,ans:x,keys:NUMKEYS,hint:'Раскрой обе скобки. Вторую — целиком в скобках, потому что перед ней минус.',
short:`x² сокращаются: ${M(`${L(k,b*c)} = ${n(d)}`)} → x = ${n(x)}.`,
explain:`${M(`x(x + ${a}) = ${poly([[1,'x²'],[a,'x']])}`)}.<br>${M(`(x − ${b})(x + ${c}) = ${poly([[1,'x²'],[c,'x'],[-b,'x'],[-b*c,'']])} = ${poly([[1,'x²'],[cb,'x'],[-b*c,'']])}`)}.<br>Вычитаем вторую <b>в скобках</b>: ${M(`${poly([[1,'x²'],[a,'x']])} − (${poly([[1,'x²'],[cb,'x'],[-b*c,'']])}) = ${poly([[1,'x²'],[a,'x'],[-1,'x²'],[-cb,'x'],[b*c,'']])}`)} = ${M(L(k,b*c))}.<br>${M(`${L(k,b*c)} = ${n(d)}`)} → ${M(`${poly([[k,'x']])} = ${n(d-b*c)}`)} → x = <b>${n(x)}</b>.`,
explain2:`Проверка x = ${n(x)}: ${P(x)}·${P(x+a)} − ${P(x-b)}·${P(x+c)} = ${x*(x+a)} − ${P((x-b)*(x+c))} = ${n(d)} ✅.<br>Главная ловушка: забыть, что минус перед второй скобкой меняет знак у <b>всех</b> слагаемых: x², ${cb?M(poly([[cb,'x']]))+' и ':''}−${b*c}.`};});

/* L4 — дроби */
G(4,()=>{const o=mk('умножить обе части уравнения, то есть каждое слагаемое, на общий знаменатель 12',['умножить на 12 только дроби, а число 7 не трогать','сложить знаменатели: x/7 = 7','разделить обе части на 12']);
return {type:'choice',q:`Как правильно избавиться от дробей в уравнении ${M(`${fr('x',3)} + ${fr('x',4)} = 7`)}?`,...o,short:'Умножаем каждое слагаемое на общий знаменатель: 4x + 3x = 84.',
explain:`Общий знаменатель 3 и 4 — это 12. Умножаем <b>обе части</b> на 12: ${M(`12·${fr('x',3)} + 12·${fr('x',4)} = 12·7`)} → ${M('4x + 3x = 84')} → x = 12.<br>Если не умножить 7, выйдет 7x = 7 и x = 1 — проверь: 1/3 + 1/4 ≠ 7.<br>«x/7» — так дроби не складывают: знаменатели не складываются.`,
explain2:`Правило весов: умножать можно только <b>обе части целиком</b>. Справа «целиком» — это 7, значит, 7 тоже умножается на 12. Проверка ответа 12: 12/3 + 12/4 = 4 + 3 = 7 ✅.`};},'r');
G(4,()=>{let a,b,Lm,t,x,c;do{[a,b]=sample([2,3,4,5,6],2);Lm=H.lcm(a,b);t=nz(-3,3);x=Lm*t;c=x/a+x/b;}while(Lm>30||Math.abs(x)>60);
return {type:'num',q:`Реши уравнение ${M(`${fr('x',a)} + ${fr('x',b)} = ${n(c)}`)}.`,ans:x,keys:NUMKEYS,hint:`Общий знаменатель ${a} и ${b} — ${Lm}.`,
short:`×${Lm}: ${M(`${poly([[Lm/a,'x'],[Lm/b,'x']])} = ${n(c*Lm)}`)} → x = ${n(x)}.`,
explain:`Общий знаменатель: ${Lm}. Умножаем каждое слагаемое на ${Lm}:<br>${M(`${Lm}·${fr('x',a)} + ${Lm}·${fr('x',b)} = ${Lm}·${P(c)}`)} → ${M(`${poly([[Lm/a,'x'],[Lm/b,'x']])} = ${n(c*Lm)}`)}.<br>${M(`${Lm/a+Lm/b}x = ${n(c*Lm)}`)} → x = <b>${n(x)}</b>.`,
explain2:`Проверка: ${n(x)} : ${a} = ${n(x/a)}, ${n(x)} : ${b} = ${n(x/b)}, сумма ${n(x/a)} + ${P(x/b)} = ${n(c)} ✅.<br>Ещё способ: ${fr('x',a)} + ${fr('x',b)} = ${fr(`${Lm/a+Lm/b}x`,Lm)}, значит ${M(`${fr(`${Lm/a+Lm/b}x`,Lm)} = ${n(c)}`)}.`};});
G(4,()=>{let a,b,r,t,p,q;do{[a,b]=sample([2,3,4,5,6,7],2);r=R(-6,9);t=nz(-3,3);p=a*t-r;q=r-b*t;}while(!p||!q||Math.abs(p)>12||Math.abs(q)>12);
const eq=`${fr(L(1,p),a)} = ${fr(L(1,-q),b)}`;
return {type:'num',q:`Реши уравнение ${M(eq)}.`,ans:r,keys:NUMKEYS,hint:'Пропорция: перемножь «крест-накрест».',
short:`${M(`${b}(${L(1,p)}) = ${a}(${L(1,-q)})`)} → x = ${n(r)}.`,
explain:`Это пропорция — произведение крайних равно произведению средних (то же, что умножить обе части на ${a*b}):<br>${M(`${b}(${L(1,p)}) = ${a}(${L(1,-q)})`)} → ${M(eqS(b,b*p,a,-a*q))}.<br>${solveLin(b,b*p,a,-a*q)}`,
explain2:`Проверка x = ${n(r)}: слева ${fr(n(r+p),a)} = ${n((r+p)/a)}, справа ${fr(n(r-q),b)} = ${n((r-q)/b)} ✅.`};});
G(4,()=>{let m,nn,p,q,x,c;do{[m,nn]=sample([2,3,4,5,6],2);p=R(1,7);q=R(1,7);x=R(-10,20);c=(x-p)/m-(x+q)/nn;}while(!Number.isInteger((x-p)/m)||!Number.isInteger((x+q)/nn)||H.lcm(m,nn)>20);
const Lm=H.lcm(m,nn),u=Lm/m,v=Lm/nn;
return {type:'num',q:`Реши уравнение ${M(`${fr(`x − ${p}`,m)} − ${fr(`x + ${q}`,nn)} = ${n(c)}`)}.`,ans:x,keys:NUMKEYS,hint:`Умножь всё на ${Lm}. Числители бери в скобки!`,
short:`×${Lm}: ${M(`${u}(x − ${p}) − ${v}(x + ${q}) = ${n(c*Lm)}`)} → x = ${n(x)}.`,
explain:`Умножаем каждое слагаемое на ${Lm}:<br>${M(`${u===1?'':u}(x − ${p}) − ${v===1?'':v}(x + ${q}) = ${n(c*Lm)}`)}.<br>Раскрываем: ${M(`${poly([[u,'x']])} − ${u*p} − ${poly([[v,'x']])} − ${v*q} = ${n(c*Lm)}`)}.<br>${M(`${poly([[u-v,'x']])} − ${u*p+v*q} = ${n(c*Lm)}`)} → ${M(`${poly([[u-v,'x']])} = ${n(c*Lm+u*p+v*q)}`)} → x = <b>${n(x)}</b>.<div class="box err"><b>Ловушка</b>Минус перед второй дробью относится ко всему числителю: −${v===1?'':v}(x + ${q}) = −${poly([[v,'x']])} − ${v*q}, а не «−${poly([[v,'x']])} + ${v*q}».</div>`,
explain2:`Проверка x = ${n(x)}: ${fr(n(x-p),m)} = ${n((x-p)/m)}, ${fr(n(x+q),nn)} = ${n((x+q)/nn)}; ${n((x-p)/m)} − ${P((x+q)/nn)} = ${n(c)} ✅.`};});
G(4,()=>{let a,b,c;do{[a,b]=sample([2,3,4,5,6,7],2);if(a>b)[a,b]=[b,a];c=R(1,4);}while(false);
const num=c*a*b,den=b-a;
return {type:'num',q:`Реши уравнение ${M(`${fr('x',a)} − ${fr('x',b)} = ${c}`)}. Ответ можно записать дробью.`,ans:num/den,ansText:rat(num,den),keys:NUMKEYS,ph:NUMPH,
short:`×${a*b}: ${M(`${b}x − ${a}x = ${num}`)} → x = ${rat(num,den)}.`,
explain:`Умножим обе части на ${a*b} (подойдёт и НОК = ${H.lcm(a,b)}, но так проще объяснять):<br>${M(`${b}x − ${a}x = ${num}`)} → ${M(`${poly([[den,'x']])} = ${num}`)} → x = ${fr(num,den)} = <b>${rat(num,den)}</b>.`,
explain2:`Проверка: x/${a} − x/${b} = x·(${fr(1,a)} − ${fr(1,b)}) = x·${fr(den,a*b)}. Чтобы получить ${c}, x должен быть ${c}·${fr(a*b,den)} = ${rat(num,den)} ✅.`};});

/* L5 — нет корней / бесконечно */
G(5,()=>{const o=mk('когда b = 0 — тогда подходит любое x',['когда b ≠ 0','никогда: на ноль делить нельзя','всегда, при любом b']);
return {type:'choice',q:`После упрощения уравнение приняло вид ${M('0·x = b')}. Когда у него <b>бесконечно много</b> корней?`,...o,short:'0·x = 0 верно при любом x; 0·x = b ≠ 0 — никогда.',
explain:`Слева ${M('0·x')} при <b>любом</b> x равно 0.<br>• Если b = 0, получаем 0 = 0 — верно всегда. Любое x — корень → <b>бесконечно много</b>.<br>• Если b ≠ 0, получаем 0 = b — неверно никогда → <b>корней нет</b>.<br>Делить на 0 действительно нельзя, но здесь и не нужно: просто смотрим, верно ли равенство.`,
explain2:`Пример: ${M('2(x + 1) = 2x + 2')} → 0·x = 0. Возьми x = 5: 12 = 12 ✅. x = −100: −198 = −198 ✅. Работает всё. А ${M('2(x + 1) = 2x + 3')} → 0·x = 1: при x = 5 получаем 12 ≠ 13 ❌, и так при любом x.`};},'r');
G(5,()=>{let a,p,q,c,s,kind;kind=pick(['one','none','inf']);a=R(2,6);p=nz(-6,6);q=nz(-9,9);
c=kind==='one'?pick([a-1,a+1,a+2,a-2].filter(v=>v>0&&v!==a)):a;const K=a*p+q;s=kind==='inf'?K:kind==='none'?K+nz(-5,5):R(-12,12);
const eq=`${a}(${L(1,p)}) ${sg(q)} ${Math.abs(q)} = ${L(c,s)}`;
const right={one:'один корень',none:'нет корней',inf:'бесконечно много корней'}[kind];
const opts=['один корень','нет корней','бесконечно много корней'];
const lhs=L(a,K);const root=kind==='one'?rat(s-K,a-c):'';
return {type:'choice',q:`Сколько корней имеет уравнение ${M(eq)}?`,opts,ans:opts.indexOf(right),hint:'Раскрой скобки, перенеси иксы влево. Что осталось при x?',
short:`${M(`${lhs} = ${L(c,s)}`)} → ${M(`${a-c?poly([[a-c,'x']]):'0·x'} = ${n(s-K)}`)}: ${right}.`,
explain:`Раскрываем скобку: ${M(`${a}x ${sg(a*p)} ${Math.abs(a*p)} ${sg(q)} ${Math.abs(q)} = ${L(c,s)}`)}, то есть ${M(`${lhs} = ${L(c,s)}`)}.<br>Переносим: ${M(`${a}x − ${poly([[c,'x']])} = ${n(s)} ${sg(-K)} ${Math.abs(K)}`)} → ${M(`${a-c?poly([[a-c,'x']]):'0·x'} = ${n(s-K)}`)}.<br>${kind==='one'?`Коэффициент при x не ноль → <b>один корень</b> x = ${root}.`:kind==='none'?`${M(`0·x = ${n(s-K)}`)}: слева 0 при любом x, справа не 0 → <b>корней нет</b>.`:`${M('0·x = 0')} — верно при любом x → <b>бесконечно много корней</b>.`}`,
explain2:`Посмотри на «наклон» обеих частей. Слева после раскрытия ${a}x, справа ${poly([[c,'x']])}. ${a!==c?`Наклоны разные — две «прямые» обязательно где-то встретятся ровно один раз.`:`Наклоны одинаковые, сравниваем числа: слева ${n(K)}, справа ${n(s)}. ${K===s?'Совпадают — части равны всегда.':'Различаются — части никогда не сравняются, как два бегуна с одинаковой скоростью на разных стартах.'}`}`};});
G(5,()=>{if(Math.random()<0.5){const a=R(2,7),p=nz(-6,6),q=nz(-9,9);const c=q-a*p;
return {type:'num',q:`При каком значении c уравнение ${M(`${a}(${L(1,p)}) ${sg(q)} ${Math.abs(q)} = ${a}x + c`)} имеет <b>бесконечно много</b> корней?`,ans:c,keys:NUMKEYS,hint:'Раскрой скобку и сравни обе части.',
short:`Слева ${M(L(a,a*p+q))}, значит c = ${n(a*p+q)}.`,
explain:`Слева: ${M(`${a}x ${sg(a*p)} ${Math.abs(a*p)} ${sg(q)} ${Math.abs(q)} = ${L(a,a*p+q)}`)}.<br>Справа ${M(`${a}x + c`)}. Иксы с обеих сторон одинаковые (${a}x), после переноса получится ${M(`0·x = c − ${P(a*p+q)}`)}.<br>Бесконечно много корней, когда справа 0: c = <b>${n(a*p+q)}</b>. Тогда части совпадают полностью.`,
explain2:`При c = ${n(a*p+q)} уравнение — это ${M(`${L(a,a*p+q)} = ${L(a,a*p+q)}`)}: одно и то же слева и справа. Любое x подходит. При других c будет 0 = (не ноль) — корней нет.`};}
const k=R(2,8),p=nz(-9,9);let q;do{q=nz(-9,9);}while(q===p);
return {type:'num',q:`При каком значении k уравнение ${M(`kx ${sg(p)} ${Math.abs(p)} = ${k}x ${sg(q)} ${Math.abs(q)}`)} <b>не имеет корней</b>?`,ans:k,keys:NUMKEYS,hint:'Перенеси иксы влево. Когда коэффициент при x станет нулём?',
short:`(k − ${k})x = ${n(q-p)}; при k = ${k}: 0·x = ${n(q-p)} — корней нет.`,
explain:`Переносим: ${M(`kx − ${k}x = ${n(q)} ${sg(-p)} ${Math.abs(p)}`)} → ${M(`(k − ${k})x = ${n(q-p)}`)}.<br>Если k ≠ ${k} — делим и получаем один корень.<br>Если k = ${k}: ${M(`0·x = ${n(q-p)}`)}, а ${n(q-p)} ≠ 0 → <b>корней нет</b>. Ответ: k = <b>${k}</b>.`,
explain2:`При k = ${k} уравнение: ${M(`${k}x ${sg(p)} ${Math.abs(p)} = ${k}x ${sg(q)} ${Math.abs(q)}`)}. Одно и то же ${k}x плюс разные числа ${n(p)} и ${n(q)} — равными они не станут никогда.`};});
G(5,()=>{const target=pick(['none','inf']);const mkEq=(kind)=>{const a=R(2,6),p=nz(-5,5);const K=a*p;let c=a,s;
  if(kind==='none')s=K+nz(-4,4);else if(kind==='inf')s=K;else{c=pick([a-1,a+1].filter(v=>v>0));s=R(-9,9);}
  return {s:`${a}(${L(1,p)}) = ${L(c,s)}`,kind};};
let eqs;do{eqs=[mkEq(target),mkEq(target==='none'?'inf':'none'),mkEq('one'),mkEq('one')];}while(new Set(eqs.map(e=>e.s)).size<4);
const ok=M(eqs[0].s);const o=mk(ok,eqs.slice(1).map(e=>M(e.s)));
const desc=e=>{const m=e.s.match(/^(\d+)\((.+?)\) = (.+)$/);return e.kind==='none'?'нет корней':e.kind==='inf'?'бесконечно много':'один корень';};
return {type:'choice',q:`Какое из уравнений ${target==='none'?'<b>не имеет корней</b>':'имеет <b>бесконечно много</b> корней'}?`,...o,hint:'Раскрой скобки слева и сравни с правой частью: коэффициенты при x и свободные члены.',
short:`${ok}: ${target==='none'?'после переноса 0·x = (не ноль)':'обе части совпадают, 0·x = 0'}.`,
explain:`Раскрываем скобки в каждом и сравниваем с правой частью:<br>${eqs.map(e=>`• ${M(e.s)} — ${desc(e)}`).join('<br>')}<br>${target==='none'?'Корней нет, когда при x одинаковые коэффициенты, а числа разные.':'Бесконечно много, когда после раскрытия скобок левая часть в точности равна правой.'}`,
explain2:`Правило-светофор для ${M('ax + b = cx + d')}: a ≠ c → один корень (зелёный); a = c, b ≠ d → нет корней (красный); a = c, b = d → любое x (жёлтый). Раскрой скобки — и сразу видно, какой «свет» горит.`};});

/* L6 — модуль */
G(6,()=>{const o=mk('если b < 0 — корней нет; если b ≥ 0 — A = b или A = −b',['всегда A = b','A = b или A = −b при любом b','если b < 0, то A = −b']);
return {type:'choice',q:`Как решается уравнение ${M('|A| = b')}?`,...o,short:'Модуль не бывает отрицательным; при b ≥ 0 — два случая A = ±b.',
explain:`Модуль — это расстояние до нуля, он <b>не бывает отрицательным</b>. Поэтому при b < 0 корней нет: ${M('|x − 2| = −3')} — нет решений.<br>При b ≥ 0 модуль равен b у двух чисел: b и −b. Значит, A = b или A = −b (при b = 0 это одно и то же: A = 0).`,
explain2:`${M('|x| = 4')}: на числовой прямой на расстоянии 4 от нуля стоят две точки — 4 и −4. ${M('|x| = −4')}: расстояние −4 — бессмыслица, корней нет.`};},'r');
G(6,()=>{const o=mk('расстояние между точками x и a на числовой прямой',['расстояние от точки x до нуля','разность чисел x и a, она может быть отрицательной','сумма чисел x и a']);
return {type:'choice',q:`Каков геометрический смысл выражения ${M('|x − a|')}?`,...o,short:'|x − a| — расстояние между x и a.',
explain:`${M('|x − a|')} — <b>расстояние</b> между точками x и a. Например, |7 − 3| = 4 и |3 − 7| = 4: от 3 до 7 четыре шага, в какую сторону ни считай.<br>Расстояние до нуля — это ${M('|x|')} (частный случай a = 0). Обычная разность x − a может быть отрицательной, а расстояние — нет.`,
explain2:`${M('|x − 3| = 5')}: «где стоят точки на расстоянии 5 от тройки?» Шагаем 5 вправо — 8, 5 влево — −2. Так модуль превращается в прогулку по числовой прямой.`};},'r');
G(6,()=>{const a=nz(-7,7),b=R(1,8);const eq=`|${L(1,-a)}| = ${b}`;
return {type:'set',q:`Реши уравнение ${M(eq)}.`,ans:[a-b,a+b],keys:SETKEYS,ph:SETPH,hint:`Найди точки на расстоянии ${b} от числа ${n(a)}.`,
short:`x = ${n(a)} ± ${b}: ${n(a-b)} и ${n(a+b)}.`,
explain:`Два случая:<br>• ${M(`${L(1,-a)} = ${b}`)} → x = ${n(a+b)};<br>• ${M(`${L(1,-a)} = −${b}`)} → x = ${n(a-b)}.<br>Ответ: <b>{${n(a-b)}; ${n(a+b)}}</b>.`,
explain2:`${M(`|x − ${P(a)}|`)} — расстояние от x до ${n(a)}. Точки на расстоянии ${b}: шаг вправо и шаг влево.<div class="fig">${nline([{x:a-b,hl:1},{x:a},{x:a+b,hl:1}],{arcs:[[a-b,a,String(b)],[a,a+b,String(b)]]})}</div>`};});
G(6,()=>{let k,m,c;do{k=R(2,5);m=nz(-9,9);c=R(1,9);}while(gcd(k,m)>1&&false);const r1=(c-m)/k,r2=(-c-m)/k;
const eq=`|${L(k,m)}| = ${c}`;
return {type:'set',q:`Реши уравнение ${M(eq)}.`,ans:[r1,r2],ansText:setTxt([rat(-c-m,k),rat(c-m,k)]),keys:SETKEYS,ph:SETPH,
short:`${M(`${L(k,m)} = ±${c}`)} → x = ${rat(c-m,k)} или x = ${rat(-c-m,k)}.`,
explain:`Модуль равен ${c} > 0 → два случая:<br>• ${M(`${L(k,m)} = ${c}`)} → ${M(`${k}x = ${n(c-m)}`)} → x = ${rat(c-m,k)};<br>• ${M(`${L(k,m)} = −${c}`)} → ${M(`${k}x = ${n(-c-m)}`)} → x = ${rat(-c-m,k)}.<br>Ответ: <b>${setTxt([rat(-c-m,k),rat(c-m,k)])}</b>.`,
explain2:`Проверим: при x = ${rat(c-m,k)} выражение ${k}x ${sg(m)} ${Math.abs(m)} = ${c}, модуль ${c} ✅. При x = ${rat(-c-m,k)} выражение равно −${c}, модуль тоже ${c} ✅.<br>Ловушка: решить только «${L(k,m)} = ${c}» и потерять второй корень.`};});
G(6,()=>{const k=R(1,3),m=nz(-8,8),p=R(1,9);const kind=pick(['neg','zero','pos','pos']);const q=kind==='neg'?p-R(1,6):kind==='zero'?p:p+R(1,7);const c=q-p;
const eq=`|${L(k,m)}| + ${p} = ${q}`;let ans=[],at;
if(c>0){ans=[(c-m)/k,(-c-m)/k];at=setTxt([rat(-c-m,k),rat(c-m,k)]);}else if(c===0){ans=[-m/k];at=setTxt([rat(-m,k)]);}else at='∅';
return {type:'set',q:`Реши уравнение ${M(eq)}.`,ans,ansText:at,keys:SETKEYS,ph:SETPH,hint:'Сначала оставь модуль в одиночестве: перенеси число вправо.',
short:`${M(`|${L(k,m)}| = ${n(c)}`)} → ${c<0?'модуль не бывает отрицательным, ∅':c===0?`${L(k,m)} = 0, x = ${rat(-m,k)}`:`x = ${at}`}.`,
explain:`Переносим ${p}: ${M(`|${L(k,m)}| = ${q} − ${p} = ${n(c)}`)}.<br>${c<0?`Модуль не может быть равен отрицательному числу ${n(c)} → <b>корней нет</b> (∅).`:c===0?`Модуль равен нулю, только если само выражение 0: ${M(`${L(k,m)} = 0`)} → x = <b>${rat(-m,k)}</b>. Корень один.`:`${M(`${L(k,m)} = ${c}`)} или ${M(`${L(k,m)} = −${c}`)} → x = ${rat(c-m,k)} или x = ${rat(-c-m,k)}.<br>Ответ: <b>${at}</b>.`}`,
explain2:`Левая часть ${M(`|…| + ${p}`)} всегда <b>не меньше ${p}</b> (модуль ≥ 0). ${c<0?`А справа ${q} < ${p}. Значит, равенства не бывает.`:c===0?`Справа ровно ${p} — это самое маленькое значение левой части, и достигается оно в одной точке.`:`Справа ${q} > ${p} — значения достигаются в двух точках, симметричных относительно x = ${rat(-m,k)}.`}`};});
G(6,()=>{let a,b,c,d;do{a=R(1,4);c=R(1,4);b=nz(-6,6);d=nz(-6,6);}while(a===c||(d-b)%(a-c)!==0||(-d-b)%(a+c)!==0||(d-b)/(a-c)===(-d-b)/(a+c));
const r1=(d-b)/(a-c),r2=(-d-b)/(a+c);const eq=`|${L(a,b)}| = |${L(c,d)}|`;
return {type:'set',q:`Реши уравнение ${M(eq)}.`,ans:[r1,r2],keys:SETKEYS,ph:SETPH,hint:'Модули равны ⇔ выражения равны или противоположны.',
short:`${M(`${L(a,b)} = ${L(c,d)}`)} → x = ${n(r1)}; ${M(`${L(a,b)} = −(${L(c,d)})`)} → x = ${n(r2)}.`,
