<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Окружность и круг — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box.ex{background:transparent;border:1px dashed var(--line)}
.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#111}}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}
.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.understand label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}
.prof-l{display:flex;align-items:center;gap:4px;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px}
.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

.nudge-wrap{padding-top:14px;padding-bottom:0}.nudge-wrap+main{padding-top:0}
.nudge{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:12px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.nudge-t{flex:1 1 280px;line-height:1.5;font-size:15px}.nudge-b{flex:0 0 auto}

.tts-hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);line-height:1.5;font-size:15px}.tts-hint .btn{margin-top:10px}
/* ===== игровой слой ===== */
:root{--r-c:#7b8494;--r-r:#2f7bf0;--r-e:#9b4de0;--r-l:#e09a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--r-c:#a3abb8;--r-r:#6aa8ff;--r-e:#c08cff;--r-l:#ffc24d}}
:root[data-theme="dark"]{--r-c:#a3abb8;--r-r:#6aa8ff;--r-e:#c08cff;--r-l:#ffc24d}
/* цвет сайта из магазина */
:root[data-accent="lime"]{--accent:#2e7d32;--accent-soft:#e3f3e4;--accent-ink:#1b5e20}
:root[data-accent="violet"]{--accent:#7c3aed;--accent-soft:#efe7fd;--accent-ink:#5b21b6}
:root[data-accent="sunset"]{--accent:#d9480f;--accent-soft:#fdeadf;--accent-ink:#9a3412}
:root[data-accent="rose"]{--accent:#c2255c;--accent-soft:#fbe4ec;--accent-ink:#9d174d}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"])[data-accent="lime"]{--accent:#81c784;--accent-soft:#1d3320;--accent-ink:#b5e3b7}
 :root:not([data-theme="light"])[data-accent="violet"]{--accent:#b69cff;--accent-soft:#2c2347;--accent-ink:#d8cbff}
 :root:not([data-theme="light"])[data-accent="sunset"]{--accent:#ffa36b;--accent-soft:#3b2518;--accent-ink:#ffcfae}
 :root:not([data-theme="light"])[data-accent="rose"]{--accent:#f58cb3;--accent-soft:#3b1d29;--accent-ink:#ffc2d8}
}
:root[data-theme="dark"][data-accent="lime"]{--accent:#81c784;--accent-soft:#1d3320;--accent-ink:#b5e3b7}
:root[data-theme="dark"][data-accent="violet"]{--accent:#b69cff;--accent-soft:#2c2347;--accent-ink:#d8cbff}
:root[data-theme="dark"][data-accent="sunset"]{--accent:#ffa36b;--accent-soft:#3b2518;--accent-ink:#ffcfae}
:root[data-theme="dark"][data-accent="rose"]{--accent:#f58cb3;--accent-soft:#3b1d29;--accent-ink:#ffc2d8}

/* чип в шапке */
.gm-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px 3px 3px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.gm-chip:hover{border-color:var(--accent)}
.gm-c-lv{color:var(--accent-ink)}.gm-c-st.off{opacity:.45;filter:grayscale(1)}
.gm-homes{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.gm-chip.sm{font-size:13px;padding:1px 9px 1px 2px;gap:5px}.gm-chip.sm .gm-av{width:24px;height:24px;font-size:15px}
.gm-homes a.home{display:inline-block}
/* аватар и рамки */
.gm-av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);font-size:18px;line-height:1;flex:none;position:relative}
.gm-av>span{display:block}
.gm-av.big{width:64px;height:64px;font-size:38px}
.gm-av.fr-silver{box-shadow:0 0 0 3px #b8c0cc}
.gm-av.fr-gold{box-shadow:0 0 0 3px #e6b422,0 0 10px 1px rgba(230,180,34,.45)}
.gm-av.fr-neon{box-shadow:0 0 0 3px #00d9ff,0 0 12px 2px rgba(0,217,255,.55)}
.gm-av.fr-fire{box-shadow:0 0 0 3px #ff6a00,0 0 12px 3px rgba(255,80,0,.5)}
.gm-av.fr-rainbow{background:conic-gradient(#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#9b6bff,#ff4d4d);padding:3px}
.gm-av.fr-rainbow>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--accent-soft)}
.gm-name{font-weight:800;font-size:22px;line-height:1.2}
.gm-name.nc-sky{color:#1d7fd6}.gm-name.nc-mint{color:#0f9b77}.gm-name.nc-violet{color:#8b3fe0}.gm-name.nc-sun{color:#d97706}
.gm-name.nc-rainbow{background:linear-gradient(90deg,#e5484d,#f59e0b,#16a34a,#0ea5e9,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gm-name.nc-sky{color:#6cb8ff}:root:not([data-theme="light"]) .gm-name.nc-mint{color:#5fe0b8}:root:not([data-theme="light"]) .gm-name.nc-violet{color:#c79bff}:root:not([data-theme="light"]) .gm-name.nc-sun{color:#ffc44d}}
:root[data-theme="dark"] .gm-name.nc-sky{color:#6cb8ff}:root[data-theme="dark"] .gm-name.nc-mint{color:#5fe0b8}:root[data-theme="dark"] .gm-name.nc-violet{color:#c79bff}:root[data-theme="dark"] .gm-name.nc-sun{color:#ffc44d}
.gm-title{font-size:14px;font-weight:600;color:var(--warn);margin-top:1px}

/* панель персонажа */
.gm-panel{position:fixed;z-index:60;top:72px;right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 160px);overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.22)}
.gm-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:15px}
.gm-p-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-right:30px}
.gm-p-row{display:flex;justify-content:space-between;gap:12px;margin:10px 0}
.gm-panel h4{margin:12px 0 4px;font-size:16px}
.gm-p-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}.gm-p-btns .btn{justify-content:center;text-decoration:none}
.gm-bar .progress{height:10px}
/* задания дня */
.gm-qs{list-style:none;padding:0;margin:6px 0}
.gm-qs li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.gm-qs li:last-child{border-bottom:0}
.gm-q-t{flex:1;min-width:0}.gm-q-t .progress{height:6px;margin:4px 0 0}
.gm-q-r{flex:none;text-align:right;font-weight:700;font-size:14px}.gm-q-r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gm-qs li.ok .gm-q-t{color:var(--muted)}.gm-qs li.ok .progress i{background:var(--ok)}

/* «Мой персонаж» */
.gm-char{border:2px solid var(--accent);scroll-margin-top:16px}
.gm-ch-top{display:flex;gap:16px;align-items:center}
.gm-ch-id{flex:1;min-width:0}.gm-ch-lv{font-size:17px;margin-top:2px}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  /* в очередь без отправки: уйдёт при уходе со страницы или при следующем открытии */
  queue(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&rd().length)flush();});
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  nudges:[
    '{n}, нейронка решает быстро — но учится при этом она, а не ты. Твоя задача — научиться самому 🧠',
    'Сфоткать задачу и переписать ответ — это работа ксерокса 📠, а не учёба. Ксерокс умнее не становится.',
    'На контрольной в школе и на экзамене у мамы нейронки рядом не будет. Будешь только ты и твоя голова. Тренируй её сейчас 💪',
    'Ошибка с разбором — это +1 к мозгу. Ответ, списанный у нейронки, — это +0. Выбирай, что тебе выгоднее 😉',
    'Нейросети будут у всех. Выигрывать будут те, кто понимает больше нейросети. Будь таким, {n}.',
    'Не получается? Нажми «Не понял» — тренажёр объяснит по-другому. Или приходи к маме. Решать за тебя — не вариант.',
    'Чемпионы не ездят на тренировку на такси 🏃 Решай сам — только так растёт сила.',
    '{n}, я в тебя верю: ты можешь решить это сам. Медленно и с ошибками — это нормально. Списать — нет. Мама ❤️',
    'Чем больше решаешь сам, тем легче следующие темы. С нейронкой каждая новая тема будет всё труднее.',
  ],
  nudge(main){if(!main||document.querySelector('.nudge'))return;const m=P.nudges[Math.floor(Math.random()*P.nudges.length)].replace(/\{n\}/g,P.name());
    const c=document.createElement('div');c.className='nudge';c.innerHTML=`<div class="nudge-t">🤖🚫 ${m}</div><button class="btn ghost nudge-b">Понял, решаю сам 💪</button>`;
    const w=document.createElement('div');w.className='wrap nudge-wrap';w.appendChild(c);c.querySelector('button').onclick=()=>w.remove();main.parentNode.insertBefore(w,main);},
  mount(header,main){
    if(!header)return;
    if(!document.getElementById('login'))P.nudge(main);
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(window.GAME){try{GAME.mount(header);}catch(e){}}
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};

}

function fresh(){return {v:1,xp:0,gems:0,days:{},streak:0,best:0,lastDay:null,lastActive:null,badges:{},cnt:{},flags:{},today:{date:today()},daily:{date:null,ids:[],done:{}},shop:{owned:[],eq:{}},rev:{last:null,streak:0,best:0}};}
function norm(s,name){
  s=s&&typeof s==='object'?s:fresh();const f=fresh();for(const k in f)if(s[k]==null)s[k]=f[k];
  const t=today();
  if(s.today.date!==t)s.today={date:t};
  ['right','star','rule','fixed','xp','comboMax','review','topic','combo'].forEach(k=>{if(s.today[k]==null)s.today[k]=0;});
  if(s.daily.date!==t){s.daily={date:t,ids:pickQuests(s,name||NAME()),done:{}};}
  return s;
}
function load(name){name=name||NAME();return norm(rd(keyFor('trainer:game',name)),name);}
function save(s){const ks=Object.keys(s.days).sort();if(ks.length>140)ks.slice(0,ks.length-140).forEach(k=>delete s.days[k]);wr(KEY(),s);}
/* Серия: показываем, только если последний «засчитанный» день — сегодня или вчера */
function liveStreak(s){if(!s.lastDay)return 0;const g=diffDays(s.lastDay,today());return g<=1?s.streak:0;}

function topY(){try{const h=document.querySelector('header.top');if(h){const r=h.getBoundingClientRect();if(r.bottom>0)return Math.round(r.bottom+8);}}catch(e){}return 12;}
function toastHost(){if(!(host&&document.body.contains(host))){host=document.createElement('div');host.className='gm-toasts';host.setAttribute('aria-live','polite');document.body.appendChild(host);}
  host.style.top=topY()+'px';return host;}
const queue=[];let showing=0;
function toast(o){queue.push(o);pump();}
function pump(){
  if(!document.body)return;
  while(showing<3&&queue.length){
    const o=queue.shift();showing++;
    const el=document.createElement('div');el.className='gm-toast '+(o.cls||'');
    el.innerHTML=`<div class="gm-t-ic${o.rar?' rar-'+o.rar:''}">${o.icon||'✨'}</div><div class="gm-t-tx"><b>${o.title}</b>${o.text?`<span>${o.text}</span>`:''}</div>`;
    toastHost().appendChild(el);
    requestAnimationFrame(()=>el.classList.add('in'));
    setTimeout(()=>{el.classList.remove('in');el.classList.add('out');setTimeout(()=>{el.remove();showing--;pump();},reduced()?10:350);},o.ms||3800);
  }
}
function xpPill(xp,gems){

/* ---------- ядро: начисление ---------- */
let sessionCombo=0;
const COUNT={first:'right',star:'star',rule:'rules',fixed:'fixed',topic:'topics',perfect:'perfect',card:'cards',review:'reviews'};
function add(xp,kind,opt){
  opt=opt||{};
  const name=NAME();const s=load(name);const t=today();const d=now();
  const lvBefore=levelOf(s.xp).n;const gemBase=Math.floor(s.xp/10);
  xp=Math.max(0,Math.round(xp||0));
  s.xp+=xp;
  let gems=Math.floor(s.xp/10)-gemBase;
  if(opt.gems){gems+=opt.gems;}
  s.gems+=gems;
  const prevDayXp=s.days[t]||0;
  s.days[t]=prevDayXp+xp;
  if(kind!=='quest')s.today.xp+=xp;
  const ck=COUNT[kind];if(ck)s.cnt[ck]=(s.cnt[ck]||0)+1;
  if(kind==='first'||kind==='star'||kind==='rule'){
    s.cnt.right=(s.cnt.right||0)+(kind==='first'?0:1);
    if(kind==='first'||kind==='star'||kind==='rule')s.today.right++;
    if(kind==='star')s.today.star++;
    if(kind==='rule')s.today.rule++;
    sessionCombo++;s.today.combo=(s.today.combo||0)+1;s.today.comboMax=Math.max(s.today.comboMax,s.today.combo);
    s.cnt.comboBest=Math.max(s.cnt.comboBest||0,sessionCombo,s.today.combo);
    const h=d.getHours();if(h<8&&h>=5)s.flags.early=1;if(h>=21||h<5)s.flags.owl=1;
  }
  if(kind==='fixed')s.today.fixed++;
  if(kind==='topic')s.today.topic++;
  if(kind==='review'){s.today.review++;
    const r=s.rev;if(r.last!==t){r.streak=r.last&&diffDays(r.last,t)===1?r.streak+1:1;r.last=t;r.best=Math.max(r.best||0,r.streak);}}
  // возвращение после перерыва
  if(s.lastActive&&s.lastActive!==t&&diffDays(s.lastActive,t)>=4)s.flags.back=1;
  if(xp>0)s.lastActive=t;
  // серия дней: день засчитан, когда набрано ≥ 50 XP
  let streakMsg=null;
  if(prevDayXp<50&&s.days[t]>=50&&s.lastDay!==t){
    s.streak=s.lastDay&&diffDays(s.lastDay,t)===1?s.streak+1:1;s.lastDay=t;s.best=Math.max(s.best,s.streak);streakMsg=s.streak;
    const wd=d.getDay();const other=wd===0?addDays(t,-1):wd===6?addDays(t,1):null;if(other&&(s.days[other]||0)>=50)s.flags.weekend=1;
  }
  // задания дня
  const qDone=[];
  s.daily.ids.forEach(id=>{const q=QDEF[id];if(!q||s.daily.done[id])return;if((q.v(s)||0)>=q.g){s.daily.done[id]=t;qDone.push(id);}});
  let qXp=0,qGems=0;
  qDone.forEach(()=>{qXp+=Q_XP;qGems+=Q_GEMS;});
  if(qXp){const gb=Math.floor(s.xp/10);s.xp+=qXp;s.days[t]+=qXp;const g2=Math.floor(s.xp/10)-gb+qGems;s.gems+=g2;gems+=g2;
    if(s.daily.ids.every(id=>s.daily.done[id]))s.cnt.dailyAll=(s.cnt.dailyAll||0)+1;
    if(prevDayXp<50&&s.days[t]>=50&&s.lastDay!==t){s.streak=s.lastDay&&diffDays(s.lastDay,t)===1?s.streak+1:1;s.lastDay=t;s.best=Math.max(s.best,s.streak);streakMsg=s.streak;}}
  const newB=checkBadges(s);
  save(s);
  // ---- показываем ----
  try{
    if(xp&&!opt.quiet)xpPill(xp+qXp,gems);
    qDone.forEach(id=>toast({icon:'📅',title:'Задание дня выполнено!',text:`${esc(QDEF[id].t)} · +${Q_XP} XP, +${Q_GEMS} 💎`,cls:'quest'}));
    if(streakMsg!=null){toast({icon:'🔥',title:streakMsg>1?`${streakMsg} ${plural(streakMsg,'день','дня','дней')} подряд!`:'Огонёк зажжён!',text:streakMsg>1?'Сегодняшний день засчитан. Не потеряй серию завтра!':'Ты набрал 50 XP сегодня — день засчитан. Приходи завтра, и серия вырастет!',cls:'streak'});
      if([7,14,30].includes(streakMsg)&&window.NOTIFY)try{(NOTIFY.queue||NOTIFY.send)(`${name}: 🔥 ${streakMsg} дней подряд!`,`${name} занимается ${streakMsg} дней подряд (каждый день не меньше 50 XP). Уровень ${levelOf(s.xp).n} «${levelOf(s.xp).name}», всего ${s.xp} XP.`,['fire']);}catch(e){}
      if(streakMsg>=3)confetti(40);}
    newB.forEach(b=>toast({icon:b.i,rar:b.r,title:`Ачивка: ${esc(b.n)}`,text:`${RAR[b.r][0]} · ${esc(b.d)}`,cls:'badge rar-'+b.r,ms:4500}));
    const lv=levelOf(s.xp);
    if(lv.n>lvBefore){levelUp(lv);if(window.NOTIFY)try{(NOTIFY.queue||NOTIFY.send)(`${name}: новый уровень ${lv.n}!`,`${name} теперь «${lv.name}» ${lv.icon} — уровень ${lv.n}. Всего ${s.xp} XP, серия 🔥 ${liveStreak(s)}.`,['tada']);}catch(e){}}
  }catch(e){console.error(e);}
  refresh();
  return s;
}
function miss(){sessionCombo=0;const s=load();s.today.combo=0;save(s);}
function checkBadges(s){
  const out=[];const t=today();
  BADGES.forEach(b=>{if(s.badges[b.id])return;let ok=false;try{ok=b.t(s);}catch(e){}if(ok){s.badges[b.id]=t;out.push(b);}});
  return out;
}
/* проверка «статичных» ачивок (мир, босс) без начисления XP */
function check(){const s=load();const nb=checkBadges(s);if(nb.length){save(s);nb.forEach(b=>toast({icon:b.i,rar:b.r,title:`Ачивка: ${esc(b.n)}`,text:`${RAR[b.r][0]} · ${esc(b.d)}`,cls:'badge rar-'+b.r,ms:4500}));refresh();}}

/* ---------- Повторялка: сколько карточек ждёт ---------- */
const REV_MAX=15,REV_NEW=8;
function reviewInfo(name){
  name=name||NAME();const r=rd(keyFor('trainer:review',name))||{};const cards=r.cards||{};const t=today();
  const ses=(r.sessions||{})[t];
  if(ses){if(ses.done)return {done:true,n:0,due:0};return {done:false,n:Math.max(0,ses.queue.length-ses.pos)+(ses.again||[]).length,started:true};}
  const due=Object.values(cards).filter(c=>c.due<=t).length;
  const d=doneMap(name);const pool=r.pool||{};
  const intro={};Object.keys(cards).forEach(k=>{const src=k.split(':')[0];intro[src]=(intro[src]||0)+1;});
  let est=0;
  Object.keys(d).forEach(id=>{if(id.includes(':')||!window.GAME_MAP||!(window.GAME_MAP.ids||[]).includes(id))return;est+=pool[id]!=null?Math.max(0,pool[id]-(intro[id]||0)):5;});
  const ru=(rd(keyFor('ru-trainer:v1',name))||{}).stats||{},en=(rd(keyFor('en-trainer:v1',name))||{}).stats||{};
  est+=Object.keys(ru).filter(k=>!cards['ru:'+k]).length+Object.keys(en).filter(k=>!cards['en:'+k]).length;
  /* материал прошлых лет (классы ниже текущего) считается изученным — его хватает надолго */
  const M=window.GAME_MAP||{};const kg=(M.kidGrade||{})[name];
  if(kg&&(Object.values(M.grade||{}).some(g=>g<kg)||kg>5))est+=REV_NEW;
  const nNew=Math.min(Math.max(0,REV_NEW-((r.newDays||{})[t]||0)),est);
  return {done:false,n:Math.min(REV_MAX,due+nNew),due,studied:est>0||Object.keys(cards).length>0};
}

function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);

  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}

    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}

/* friendly error explanation */
function explainErr(err){
  const s=String(err||'');const lines=s.trim().split('\n');let last=lines[lines.length-1]||s;

   [/IndentationError/,'Ошибка отступа: строки внутри if/for/while/def должны начинаться с 4 пробелов, одинаково.'],
   [/NameError: name '([^']+)'/,m=>`Python не знает имя «${m[1]}». Возможно, опечатка, или переменная ещё не создана, или забыты кавычки у текста.`],
   [/TypeError: can only concatenate str/,'Нельзя склеить текст и число через +. Преврати число в текст: str(x), или используй print(a, b).'],
   [/TypeError: unsupported operand type\(s\) for .*'str' and 'int'|'int' and 'str'/,'Складываешь текст и число. Ввод input() — это всегда текст: используй int(input()).'],
   [/TypeError/,'Ошибка типов: операция не подходит для этих данных (например, число и текст).'],
   [/ZeroDivisionError/,'Деление на ноль.'],
   [/ValueError: invalid literal for int/,'int() получил не число. Проверь ввод: возможно, в строке несколько чисел — тогда нужен split().'],
   [/IndexError/,'Выход за границы списка или строки: такого индекса нет. Помни: индексы начинаются с 0.'],
   [/EOFError/,'Программа просит ввод input() больше раз, чем есть строк во входных данных.'],
   [/KeyError/,'Такого ключа нет в словаре.'],
   [/RecursionError/,'Слишком глубокая рекурсия: функция вызывает себя без остановки.']];
  for(const [re,msg] of map){const m=s.match(re);if(m)return (ln?`Строка ${ln}. `:'')+(typeof msg==='function'?msg(m):msg)+`<br><code>${esc(last)}</code>`;}
  return (ln?`Строка ${ln}. `:'')+`<code>${esc(last)}</code>`;
}

async function check(code,tests){

  for(let i=0;i<tests.length;i++){
    const t=tests[i];const r=await run(code,t.in||'');
    if(r.boot){return {passed:false,boot:true,report:`<div class="box err"><b>Python не загрузился</b>${esc(r.err)}</div>`};}
    const got=r.ok?norm(r.out):null;const ok=r.ok&&got===norm(t.out);
    if(ok)passed++;else if(!firstFail)firstFail={i,t,r,got};
    if(i<8)rows+=`<tr><td>${i+1}</td><td><pre>${esc(t.in||'—')}</pre></td><td><pre>${esc(t.out)}</pre></td><td><pre>${r.ok?esc(got):'<span class="bad-t">ошибка</span>'}</pre></td><td>${ok?'✅':'❌'}</td></tr>`;
    if(r.timeout)break;
  }

  if(firstFail&&!firstFail.r.ok)report+=`<div class="box err"><b>Ошибка при запуске</b>${firstFail.r.timeout?esc(firstFail.r.err):explainErr(firstFail.r.err)}</div>`;

/* editor widget */
function editor(host,opt){

  host.classList.add('pyed');

  ${needsInput||opt.forceInput?`<label class="small">Ввод (каждое значение на своей строке):<textarea class="code inp" rows="2" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></label>`:''}
  <div class="row pybtns"><button class="btn sbtn run">▶ Запустить</button>${opt.reset!==false?'<button class="btn ghost sbtn reset">↺ Вернуть код</button>':''}</div>
  <div class="pyout" hidden><div class="small">Вывод программы:</div><pre class="out"></pre></div>`;
  const ta=host.querySelector('textarea.code');ta.value=code;

  ta.addEventListener('keydown',e=>{

  });
  ta.addEventListener('input',()=>{ta.rows=Math.max(3,Math.min(24,ta.value.split('\n').length+1));});
  const outBox=host.querySelector('.pyout'),out=host.querySelector('.out'),runB=host.querySelector('.run');
  runB.onclick=async()=>{
    runB.disabled=true;outBox.hidden=false;out.textContent=booted?'Выполняю…':'Загружаю Python… В первый раз это занимает 10–30 секунд, потом — мгновенно.';
    const r=await run(ta.value,inp?inp.value:'');runB.disabled=false;
    if(r.ok){out.textContent=r.out||'(программа ничего не напечатала)';out.classList.remove('err');}

  };
  const rs=host.querySelector('.reset');if(rs)rs.onclick=()=>{ta.value=code;ta.dispatchEvent(new Event('input'));};
  return {get code(){return ta.value;},set code(v){ta.value=v;},get input(){return inp?inp.value:'';},ta};
}
function mountRuns(root){root.querySelectorAll('pre.run').forEach(pre=>{const d=document.createElement('div');pre.replaceWith(d);editor(d,{code:pre.textContent.replace(/^\n/,''),input:pre.dataset.input!=null?pre.dataset.input.replace(/\\n/g,'\n'):null});});}

function gearsPic(z1,z2){const W=320,Hh=176,cy=84;const t1=Math.min(z1,24),t2=Math.min(z2,24);const r1=14+t1*1.5,r2=14+t2*1.5;const c1=160-(r1+r2+6)/2,c2=c1+r1+r2+6;

 const names=[`O${L[0]}`,`${L[1]}${L[2]}`,`${L[3]}${L[4]}`];const k=R(0,2);const what=['радиус','диаметр','хорда, которая не является диаметром'][k];
 return {type:'choice',q:`Какой из отрезков на рисунке — <b>${what}</b>?`,pic:circlePic({center:'O',oa:mir?290:250,segs}),opts:names,ans:k,
 short:['Радиус — от центра O до окружности.','Диаметр проходит через центр O.','Хорда соединяет две точки окружности, но не проходит через центр.'][k],
 explain:`• ${names[0]} — от центра O до точки окружности: <b>радиус</b>.<br>• ${names[1]} — соединяет две точки окружности и проходит через центр: <b>диаметр</b>.<br>• ${names[2]} — соединяет две точки окружности, но мимо центра: <b>хорда</b>.<br>Ответ: ${names[k]}.`,
 explain2:'Проверка простая: проходит ли отрезок через центр O? Начинается в O — радиус. Проходит насквозь через O — диаметр. Не касается O вовсе — просто хорда. (Диаметр — тоже хорда, самая длинная.)'};});
G(0,()=>{const r=R(3,12),d=r+pick([-2,-1,0,1,2,3])*R(1,2);if(d<=0)return null;const k=d<r?0:d===r?1:2;const opts=['Внутри круга','На окружности','Вне круга'];
 return {type:'choice',q:`Радиус окружности ${r} см. Точка находится на расстоянии ${d} см от центра. Где она?`,opts,ans:k,
 short:`${d} ${k===0?'<':k===1?'=':'>'} ${r}.`,explain:`Сравниваем расстояние до центра с радиусом: ${M(`${d} ${k===0?'<':k===1?'=':'>'} ${r}`)}.<br>Меньше радиуса — внутри, равно — на окружности, больше — снаружи. Ответ: <b>${opts[k].toLowerCase()}</b>.`,
 explain2:'Представь собаку на верёвке длиной r, привязанную к колышку. Всё, куда она может добежать, — круг. Если до точки ближе, чем длина верёвки, — собака достанет.'};});

/* ===== L1 π ===== */
G(1,()=>CH('Что такое число <b>π</b>?','Отношение длины окружности к её диаметру — одно и то же для всех окружностей',
 ['Отношение длины окружности к её радиусу','Ровно 3,14','Площадь круга радиусом 2'],
 {short:'π = C : d ≈ 3,14159…',explain:`${M('π = C : d')} — длина окружности, делённая на <b>диаметр</b>. Оно одинаковое для маленькой монетки и для экватора Земли. ${M('C : r')} — это ${M('2π ≈ 6,28')}, а 3,14 — лишь приближение (π = 3,14159…).`,
 explain2:'Обмотай ниткой любую банку и сравни нитку с диаметром дна: нитка всегда чуть больше трёх диаметров. Это «чуть больше трёх» и есть π.'}),{rule:true});
G(1,()=>CH('Чему примерно равно число π?','3,14',['3,41','2,72','31,4'],
 {short:'π ≈ 3,14 (точнее 3,14159…).',explain:'π ≈ <b>3,14</b>. Число 2,72 — это другое знаменитое число (e), 3,41 — перепутаны цифры, 31,4 — в 10 раз больше.',
 explain2:'Запомнилка: «Это я знаю и помню прекрасно» — число букв в словах: 3, 1, 4, 1, 5, 9… → 3,14159.'}),{rule:true});
G(1,()=>{const d=pick([5,6,7,8,9,10,12,13,14,15]);const C=Math.round(Math.PI*d*10)/10;const ans=Math.round(C/d*100)/100;if(ans!==3.14)return null;
 return {type:'num',q:`Паша обмотал банку ниткой. Длина нитки — ${N(C)} см, диаметр дна банки — ${d} см. Найди отношение длины нитки к диаметру. Ответ округли до сотых.`,ans,
 hint:'Раздели длину нитки на диаметр.',short:`${N(C)} : ${d} ≈ ${N(ans)} — это π!`,
 explain:`Отношение длины окружности к диаметру: ${M(`${N(C)} : ${d} ≈ ${N(ans)}`)}.<br>Это и есть число <b>π ≈ 3,14</b> — у любой банки получится почти то же самое (точность ограничена измерением нитки).`,
 explain2:`Деление в столбик: ${d} · 3 = ${3*d}, остаток ${N(rd(C-3*d))}; ${N(rd(C-3*d))} : ${d} ≈ ${N(Math.round((C-3*d)/d*100)/100)}. Всего ≈ ${N(ans)}. Узнаёшь число?`};});
G(1,()=>{const byR=Math.random()<0.5;return CH(`Длина окружности примерно во сколько раз больше её ${byR?'радиуса':'диаметра'}?`,byR?'Примерно в 6,28 раза':'Примерно в 3,14 раза',byR?['Примерно в 3,14 раза','В 2 раза','Примерно в 1,57 раза']:['Примерно в 6,28 раза','Ровно в 3 раза','В 2 раза'],
 {short:byR?'C : r = 2π ≈ 6,28.':'C : d = π ≈ 3,14.',explain:byR?`${M('C = 2πr')}, значит ${M('C : r = 2π ≈ 6,28')}. В 3,14 раза окружность больше <b>диаметра</b>, а радиус вдвое меньше диаметра.`:`По определению ${M('C : d = π ≈ 3,14')}. «Ровно в 3» — неверно: чуть больше трёх (3,14…).`,
 explain2:'Обмотай нитку вокруг круга и отложи на ней диаметры: поместятся 3 целых диаметра и ещё маленький кусочек (0,14 диаметра). Радиусов, соответственно, вдвое больше — около 6,28.'});});

/* ===== L2 C ===== */
G(2,()=>CH('Какая формула длины окружности?','C = 2πr',['C = πr²','C = 2r','C = πr'],
 {short:'C = 2πr = πd.',explain:`${M('C = πd')}, а ${M('d = 2r')}, поэтому ${M('C = 2πr')}. ${M('πr²')} — это площадь круга, а ${M('2r')} — просто диаметр.`,
 explain2:'Из определения π: C : d = π → C = π · d. Диаметр — два радиуса → C = π · 2r = 2πr. Без квадрата: длина измеряется в см, не в см².'}),{rule:true});
G(2,()=>{const r=pick([R(1,20),R(1,9)+0.5]);const C=rd(2*3.14*r);
 return {type:'num',q:`Найди длину окружности радиуса ${N(r)} см. Число π округли до 3,14. Ответ — в см.`,ans:C,hint:'C = 2πr.',short:M(`C = 2 · 3,14 · ${N(r)} = ${N(C)}`),
 explain:`${M('C = 2πr')}. Подставляем: ${M(`2 · 3,14 · ${N(r)} = 6,28 · ${N(r)} = ${N(C)}`)} см.<br>Не путай с площадью: ${M('πr²')} дало бы ${N(rd(3.14*r*r))}.`,
 explain2:`Можно через диаметр: d = ${N(2*r)}, ${M(`C = πd = 3,14 · ${N(2*r)} = ${N(C)}`)}. Проверка на глаз: C чуть больше трёх диаметров (3 · ${N(2*r)} = ${N(6*r)}).`};});
G(2,()=>{const r=pick([R(1,30),R(1,12)+0.5]);
 return {type:'num',q:`Длина окружности радиуса ${N(r)} см равна k·π см. Найди k (то есть ответ раздели на π).`,ans:2*r,short:M(`C = 2π · ${N(r)} = ${N(2*r)}π`),
 explain:`${M(`C = 2πr = 2 · ${N(r)} · π = ${N(2*r)}π`)}. Значит, ${M(`k = ${N(2*r)}`)}. Так пишут <b>точный</b> ответ, без округления π.`,
 explain2:`C : π = d — длина окружности, делённая на π, это диаметр. Диаметр = 2 · ${N(r)} = ${N(2*r)}.`};});
G(2,()=>{const r=R(2,25);const C=rd(6.28*r);
 return {type:'num',q:`Длина окружности ${N(C)} см. Найди её радиус (π ≈ 3,14). Ответ — в см.`,ans:r,hint:'r = C : (2π) = C : 6,28.',short:M(`r = ${N(C)} : 6,28 = ${r}`),
 explain:`Из ${M('C = 2πr')}: ${M('r = C : (2π)')}. ${M('2π ≈ 6,28')}.<br>${M(`r = ${N(C)} : 6,28 = ${r}`)} см.<br>Проверка: 2 · 3,14 · ${r} = ${N(C)} ✅`,
 explain2:`Сначала найди диаметр: ${M(`d = C : π = ${N(C)} : 3,14 = ${2*r}`)}. Радиус — половина: ${r}.`};});
G(2,()=>{const d=pick([50,56,60,64,70]),n=pick([1,10,100,50,20]);const C=rd(3.14*d);const tot=rd(C*n/100);
 return n===1?{type:'num',q:`Диаметр колеса велосипеда ${d} см. Какое расстояние проедет велосипед за один оборот колеса (π ≈ 3,14)? Ответ — в см.`,pic:wheelPic(d/2),ans:C,short:M(`C = 3,14 · ${d} = ${N(C)}`),
  explain:`За один оборот колесо «раскатывает» по дороге свою окружность: ${M(`C = πd = 3,14 · ${d} = ${N(C)}`)} см.`,explain2:'Намажь шину краской и прокати колесо на один оборот — след на асфальте будет длиной ровно в окружность колеса.'}
 :{type:'num',q:`Диаметр колеса велосипеда ${d} см. Какое расстояние проедет велосипед за ${n} оборотов колеса (π ≈ 3,14)? Ответ — в метрах.`,pic:wheelPic(d/2),ans:tot,
  short:`${N(C)} см · ${n} = ${N(rd(C*n))} см = ${N(tot)} м.`,explain:`1) Один оборот = окружность: ${M(`3,14 · ${d} = ${N(C)}`)} см.<br>2) ${n} оборотов: ${M(`${N(C)} · ${n} = ${N(rd(C*n))}`)} см.<br>3) В метрах: ${M(`${N(rd(C*n))} : 100 = ${N(tot)}`)} м.`,
  explain2:'Не забудь перевести единицы: 1 м = 100 см. Диаметр дан в сантиметрах, а ответ просят в метрах.'};});

/* ===== L3 S ===== */
G(3,()=>CH('Какая формула площади круга?','S = πr²',['S = 2πr','S = πd²','S = (πr)²'],
 {short:'S = πr² — в квадрат возводим только радиус.',explain:`${M('S = πr²')} = π · r · r. ${M('2πr')} — это длина окружности. ${M('πd²')} — ошибка: с диаметром было бы ${M('πd² : 4')}. ${M('(πr)²')} — в квадрат возводится только r, π не трогаем.`,
 explain2:'Единицы подскажут: площадь — в см², значит в формуле должны перемножаться две длины (r · r). В 2πr длина одна — это см, это длина окружности.'}),{rule:true});
G(3,()=>CH('Круг разрезали на очень много одинаковых секторов и сложили «ёлочкой» в фигуру, почти совпадающую с прямоугольником. Какие у этого прямоугольника стороны?','πr (половина окружности) и r',['2πr и r','πr и 2r','r и r'],
 {short:'πr · r = πr² — вот откуда формула площади.',explain:`Дуги секторов распределились поровну на верхнюю и нижнюю стороны, поэтому длинная сторона — <b>половина окружности</b>: ${M('2πr : 2 = πr')}. Короткая сторона — радиус (длина сектора). Площадь ${M('πr · r = πr²')}.`,
 explain2:'Вспомни ползунок в теории: половина кусочков пиццы смотрит дугой вверх, половина — вниз. Сверху лежит половина корочки, снизу — другая половина. Вся корочка — это 2πr, половина — πr.'}),{rule:true});
G(3,()=>{const r=pick([R(1,20),R(1,9)+0.5]);const S=rd(3.14*r*r);
 return {type:'num',q:`Найди площадь круга радиуса ${N(r)} см (π ≈ 3,14). Ответ — в см².`,ans:S,hint:'S = πr² — сначала r², потом умножить на 3,14.',short:M(`S = 3,14 · ${N(r)}² = 3,14 · ${N(rd(r*r))} = ${N(S)}`),
 explain:`${M('S = πr²')}. Сначала квадрат радиуса: ${M(`${N(r)}² = ${N(rd(r*r))}`)}. Потом умножаем на π: ${M(`3,14 · ${N(rd(r*r))} = ${N(S)}`)} см².<br>Ошибка «${N(rd(6.28*r))}» — это длина окружности 2πr, а не площадь.`,
 explain2:`Площадь круга чуть больше трёх квадратиков со стороной r: 3 · ${N(rd(r*r))} = ${N(rd(3*r*r))}, и ещё 0,14 · ${N(rd(r*r))}. Итого ≈ ${N(S)}.`};});
G(3,()=>{const d=2*R(1,15);const r=d/2;
 return {type:'num',q:`Диаметр круга ${d} см. Его площадь равна k·π см². Найди k.`,ans:r*r,hint:'Осторожно: дан диаметр, а в формуле радиус.',short:`r = ${r}, S = ${r}²π = ${r*r}π.`,
 explain:`В формуле ${M('S = πr²')} стоит <b>радиус</b>. Сначала ${M(`r = ${d} : 2 = ${r}`)}. Потом ${M(`S = π · ${r}² = ${r*r}π`)}. Значит ${M(`k = ${r*r}`)}.<br>Ошибка «${d*d}» — в квадрат возвели диаметр.`,
 explain2:`Круг диаметром ${d} вписывается в квадрат ${d} × ${d} = ${d*d}. Его площадь ${r*r}π ≈ ${N(rd(3.14*r*r))} — меньше квадрата, как и должно быть. А ${d*d}π ≈ ${N(rd(3.14*d*d))} — больше квадрата, так не бывает!`};});
G(3,()=>{const k=pick([2,3,4,5,10]);const up=Math.random()<0.7;
 return {type:'num',q:up?`Радиус круга увеличили в ${k} раза. Во сколько раз увеличилась его площадь?`:`Радиус круга увеличили в ${k} раза. Во сколько раз увеличилась длина окружности?`,ans:up?k*k:k,
 short:up?`S = πr²: (${k}r)² = ${k*k}r².`:`C = 2πr: длина растёт так же, как радиус.`,
 explain:up?`${M(`S = π(${k}r)² = π · ${k*k}r² = ${k*k} · πr²`)}. Площадь выросла в ${M(`${k}² = ${k*k}`)} раз${k*k%10>=2&&k*k%10<=4&&(k*k<10||k*k>20)?'а':''}, а не в ${k}!`:`${M(`C = 2π · ${k}r = ${k} · 2πr`)} — длина окружности растёт во столько же раз, что и радиус: в ${k} раза.`,
 explain2:up?`Нарисуй квадрат 1 × 1 и квадрат ${k} × ${k}: во втором помещается ${k*k} маленьких. С кругами то же — площадь растёт как квадрат размера.`:`Длина — «одномерная» величина: увеличил размер в ${k} раза — увеличил длину в ${k} раза. А вот площадь выросла бы в ${k*k} раз.`};});
G(3,()=>{const D1=pick([30,32,36,40,45]),D2=pick([20,22,24,25,26,28]);if(D2>=D1)return null;const a1=D1*D1,a2=2*D2*D2;if(Math.abs(a1-a2)/Math.max(a1,a2)<0.05)return null;
 const big=a1>a2;const opts=[`Одна пицца ${D1} см`,`Две пиццы по ${D2} см`,'Одинаково'];
 const S1=rd(3.14*a1/4),S2=rd(2*3.14*D2*D2/4);
 return {type:'choice',q:`В пиццерии одна пицца диаметром ${D1} см стоит столько же, сколько две пиццы диаметром ${D2} см. В каком случае пиццы больше (толщина одинаковая)?`,opts,ans:big?0:1,
 short:`${N(S1)} см² против ${N(S2)} см².`,explain:`Сравниваем площади (π ≈ 3,14, r = d : 2):<br>• одна большая: ${M(`3,14 · ${N(D1/2)}² = ${N(S1)}`)} см²;<br>• две маленькие: ${M(`2 · 3,14 · ${N(D2/2)}² = ${N(S2)}`)} см².<br>Больше пиццы: <b>${opts[big?0:1].toLowerCase()}</b>.`,
 explain2:`Можно не умножать на π — он одинаковый: сравни ${D1}² = ${a1} и 2 · ${D2}² = ${a2}. ${a1>a2?a1+' > '+a2:a1+' < '+a2}. Площадь растёт как квадрат диаметра, поэтому интуиция «две пиццы больше одной» часто обманывает.`};});

/* ===== L4 части ===== */

 {short:'Большой круг минус маленький.',explain:`Кольцо = большой круг без маленького: ${M('πR² − πr² = π(R² − r²)')}. ${M('π(R − r)²')} — это площадь круга с радиусом «ширина кольца», совсем другая величина.`,
 explain2:`Проверь на числах R = 5, r = 3: π(25 − 9) = 16π. А π(5 − 3)² = 4π — в 4 раза меньше. Нарисуй и посмотри — кольцо явно больше круга радиуса 2.<div class="fig">${ringPic(5,3)}</div>`}),{rule:true});
G(4,()=>{const r=R(1,8),Rv=R(r+1,12);

 explain:`Кольцо = большой круг − маленький: ${M(`π · ${Rv}² − π · ${r}² = ${Rv*Rv}π − ${r*r}π = ${Rv*Rv-r*r}π`)}. k = ${Rv*Rv-r*r}.<br>Ошибка «${(Rv-r)*(Rv-r)}» — возвели в квадрат разность радиусов.`,
 explain2:`Представь CD-диск: блестящая часть — кольцо. Чтобы найти её площадь, из площади всего диска вычитаем площадь дырки: ${Rv*Rv}π − ${r*r}π.`};});
G(4,()=>{const r=R(2,10);const P=rd(3.14*r+2*r);
 return {type:'num',q:`Найди периметр полукруга радиуса ${r} см (π ≈ 3,14). Ответ — в см.`,pic:semiPic(r),ans:P,hint:'Граница полукруга — дуга (половина окружности) и диаметр.',

 explain:`Граница полукруга состоит из двух частей:<br>• дуга — половина окружности: ${M(`2πr : 2 = πr = 3,14 · ${r} = ${N(rd(3.14*r))}`)};<br>• прямой отрезок — диаметр: ${M(`2r = ${2*r}`)}.<br>Периметр: ${M(`${N(rd(3.14*r))} + ${2*r} = ${N(P)}`)} см.<br>Ошибка «${N(rd(3.14*r))}» — забыли диаметр.`,

/* ---------- interactive theory ---------- */
function onTheory(root){
  const w=root.querySelector('#w-circle');
  if(w){w.innerHTML=`<label>r = <output id="wcr">3</output> см<input type="range" id="wcR" min="1" max="10" step="0.5" value="3"></label><div id="wcS" style="display:flex;justify-content:center"></div><div id="wcO" style="text-align:center;margin-top:4px"></div>`;
    const Rg=w.querySelector('#wcR');const draw=()=>{const r=+Rg.value;w.querySelector('#wcr').textContent=N(r);const Rp=r*11,W=320,cy=Rp+14,lineY=2*Rp+44,Hh=lineY+40;
      const seg=270/Math.PI;let s=`<circle cx="160" cy="${cy}" r="${Rp}" fill="var(--hl)" fill-opacity=".2" stroke="var(--accent)" stroke-width="2.4"/><line x1="${160-Rp}" y1="${cy}" x2="${160+Rp}" y2="${cy}" stroke="var(--fig)" stroke-width="2"/><circle cx="160" cy="${cy}" r="3" fill="var(--fig)"/>`;
      s+=`<line x1="10" y1="${lineY}" x2="280" y2="${lineY}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>`;
      for(let i=0;i<=3;i++)s+=`<line x1="${f(10+i*seg)}" y1="${lineY-8}" x2="${f(10+i*seg)}" y2="${lineY+8}" stroke="var(--fig)" stroke-width="1.5"/>`;
      for(let i=0;i<3;i++)s+=T(10+(i+0.5)*seg,lineY+22,'d',{fs:12,col:'var(--ink)',it:true});s+=T(10+3*seg+5,lineY+22,'0,14d',{a:'start',fs:11,col:'var(--ink)'});
      s+=T(145,lineY-12,'окружность, «развёрнутая» в нитку',{fs:11,w:500,col:'var(--muted)'});
      w.querySelector('#wcS').innerHTML=svg(W,Hh,s,'Окружность');
      w.querySelector('#wcO').innerHTML=`d = <span class="out">${N(2*r)}</span> см · C = 2πr ≈ <span class="out">${N(Math.round(2*Math.PI*r*100)/100)}</span> см · S = πr² ≈ <span class="out">${N(Math.round(Math.PI*r*r*100)/100)}</span> см²<br><span class="small">Длина окружности всегда ≈ 3,14 диаметра, при любом r. А площадь растёт быстрее: r ×2 → S ×4.</span>`;};
    Rg.oninput=draw;draw();}
  const p=root.querySelector('#w-pizza');
  if(p){p.innerHTML=`<label>кусочков: <output id="wpn">8</output><input type="range" id="wpN" min="4" max="40" step="2" value="8"></label><div id="wpS" style="display:flex;justify-content:center"></div>`;
    const Ng=p.querySelector('#wpN');const draw=()=>{const n=+Ng.value;p.querySelector('#wpn').textContent=n;const Rp=56,W=320,h=Math.PI/n,cx0=160,cy0=62;let s='';
      for(let i=0;i<n;i++){const a0=i*2*h,a1=(i+1)*2*h;const top=i<n/2;s+=`<path d="M${cx0},${cy0} L${f(cx0+Rp*Math.cos(a0))},${f(cy0-Rp*Math.sin(a0))} A${Rp},${Rp} 0 0,0 ${f(cx0+Rp*Math.cos(a1))},${f(cy0-Rp*Math.sin(a1))} Z" fill="${top?'var(--hl)':'var(--accent)'}" fill-opacity="${top?0.55:0.35}" stroke="var(--card)" stroke-width="1"/>`;}
      const sw=Rp*Math.sin(h),ch=Rp*Math.cos(h),yt=140,x0=150-(n+1)*sw/2+sw;
      for(let k=0;k<n;k++){const even=k%2===0;const ax=x0+k*sw,ay=even?yt:yt+ch;const e1=[ax-sw,even?yt+ch:yt],e2=[ax+sw,even?yt+ch:yt];
        s+=`<path d="M${f(ax)},${f(ay)} L${f(e1[0])},${f(e1[1])} A${Rp},${Rp} 0 0,${even?0:1} ${f(e2[0])},${f(e2[1])} Z" fill="${even?'var(--hl)':'var(--accent)'}" fill-opacity="${even?0.55:0.35}" stroke="var(--card)" stroke-width="1"/>`;}
      const xr=x0+(n-1)*sw+sw;s+=T(150,yt+ch+24,'≈ πr (половина окружности)',{fs:12,col:'var(--ink)'})+`<line x1="${f(xr+10)}" y1="${yt}" x2="${f(xr+10)}" y2="${f(yt+ch)}" stroke="var(--fig)" stroke-width="1.4"/>`+T(xr+15,yt+ch/2+5,'r',{a:'start',it:true});
      p.querySelector('#wpS').innerHTML=svg(W,yt+ch+34,s,'Круг, разрезанный на сектора');};
    Ng.oninput=draw;draw();}
}
