<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сумма углов треугольника — тренажёр</title>
<style>:root{

  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;

html{-webkit-text-size-adjust:100%}

.opts.pics .opt{flex-direction:column;align-items:stretch}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}

.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){

const triAng=(A,B,b)=>{b=b||10;const C=180-A-B;const c=b*Math.sin(C*D2R)/Math.sin(B*D2R);return {A:[0,0],C:[b,0],B:polar([0,0],c,A)};};
const tri3=(a,b,c)=>{const x=(c*c+b*b-a*a)/(2*b);return {A:[0,0],C:[b,0],B:[x,Math.sqrt(Math.max(0,c*c-x*x))]};};
const okTri=(a,b,c)=>a+b>c&&a+c>b&&b+c>a;
const randAng=(lo,mx)=>{for(;;){const A=R(lo,mx),B=R(lo,mx),C=180-A-B;if(C>=lo&&C<=mx)return [A,B,C];}};
const typeOf=(A,B,C)=>{const m=Math.max(A,B,C);return m<90?0:m===90?1:2;};

const incenter=(P)=>{const a=len(sub(P.B,P.C)),b=len(sub(P.A,P.C)),c=len(sub(P.A,P.B)),s=a+b+c;return [(a*P.A[0]+b*P.B[0]+c*P.C[0])/s,(a*P.A[1]+b*P.B[1]+c*P.C[1])/s];};
const orthocenter=P=>inter(P.B,foot(P.B,P.A,P.C),P.C,foot(P.C,P.A,P.B));

const theory=[
{title:'Фокус с бумажным треугольником',lvl:0,html:`
<p class="hook">Вырежи из бумаги <b>любой</b> треугольник — хоть узкий, хоть «толстый». Оторви у него три уголка и приложи их вершинами друг к другу. Они всегда сложатся в <b>ровную линию</b> — развёрнутый угол 180°. Всегда! Даже если треугольник нарисовал первоклассник криво. Почему так? Сейчас разберёмся — и докажем, а не просто «проверим на бумажке».</p>
<div class="box rule"><b>Теорема о сумме углов треугольника</b>Сумма углов любого треугольника равна <b>180°</b>: <span class="m">∠A + ∠B + ∠C = 180°</span>.</div>
<p>Подвигай вершины треугольника мышкой или пальцем. Углы меняются, а сумма — нет:</p>
<div class="widget" id="w-tri"></div>
<div class="box ex"><b>Пример</b>∠A = 50°, ∠B = 70°. Тогда ∠C = 180° − 50° − 70° = 60°.</div>
<div class="box err"><b>Не путай с 360°</b>360° — это полный оборот и сумма углов <b>четырёхугольника</b>. У треугольника — 180°, ровно половина.</div>
<div class="fact">На поверхности шара треугольники «неправильные»: из Северного полюса спустись по меридиану до экватора, пройди по экватору четверть Земли и вернись на полюс. Получится треугольник с <b>тремя прямыми углами</b> — 270°! Теорема про 180° верна только на плоскости.</div>`},
{title:'Доказательство: параллельная прямая',lvl:0,html:`
<p>Бумажный фокус — это проверка, а не доказательство: вдруг найдётся треугольник, где не сложится? Математики доказывают так, чтобы сработало для <b>любого</b> треугольника.</p>
<div class="fig">${fProof}</div>
<ol class="steps"><li>Через вершину B проведём прямую MN, <b>параллельную</b> стороне AC.</li>
<li>∠MBA = ∠A — это накрест лежащие углы при параллельных MN, AC и секущей AB (на рисунке оба помечены «1»).</li>
<li>∠NBC = ∠C — накрест лежащие при секущей BC (помечены «3»).</li>
<li>Три угла при вершине B — ∠MBA, ∠ABC и ∠NBC — вместе составляют развёрнутый угол MBN, то есть 180°.</li>
<li>Значит, ∠A + ∠B + ∠C = 180°. ∎</li></ol>
<div class="box tip"><b>Как запомнить</b>Это и есть бумажный фокус: прямая MN — та самая «ровная линия», на которую «переехали» уголки A и C.</div>
<p><b>Следствия</b> (пригодятся постоянно):</p>
<ul class="steps"><li>В равностороннем треугольнике каждый угол 180° : 3 = <b>60°</b>.</li>
<li>В прямоугольном треугольнике сумма острых углов <b>90°</b>.</li>
<li>В равнобедренном углы при основании равны: если угол при вершине v, то каждый угол при основании (180° − v) : 2.</li></ul>`},
{title:'Виды треугольников по углам',lvl:1,html:`
<div class="figrow">${fTypes}</div>
<div class="box rule"><b>Классификация</b><b>Остроугольный</b> — все три угла острые (меньше 90°).<br><b>Прямоугольный</b> — один угол прямой (90°).<br><b>Тупоугольный</b> — один угол тупой (больше 90°).</div>

<div class="box tip"><b>Как определить вид</b>Найди <b>самый большой</b> угол (если его нет в условии — вычисли третий). Меньше 90° → остроугольный, ровно 90° → прямоугольный, больше 90° → тупоугольный.</div>

{title:'Внешний угол',lvl:2,html:`
<p>Продолжи сторону AC за вершину C. Угол между продолжением и стороной CB называется <b>внешним углом</b> при вершине C. Он смежный с внутренним углом C.</p>

<div class="box rule"><b>Теорема о внешнем угле</b>Внешний угол треугольника равен <b>сумме двух внутренних углов, не смежных с ним</b>: <span class="m">∠BCD = ∠A + ∠B</span>.</div>
<p><b>Почему:</b> ∠BCD = 180° − ∠C (смежные углы), и ∠A + ∠B = 180° − ∠C (сумма углов треугольника). Правые части равны — значит, равны и левые.</p>

<div class="box tip"><b>Следствие</b>Внешний угол больше каждого внутреннего угла, не смежного с ним. А сумма внешних углов, взятых по одному при каждой вершине, — <b>360°</b> (как будто ты обошёл треугольник и повернулся на полный оборот).</div>
<div class="box err"><b>Типичная ошибка</b>Складывать с <b>соседним</b> углом. Внешний угол при C и угол C в сумме дают 180°, а не «внешний угол».</div>`},
{title:'Против большей стороны — больший угол',lvl:3,html:`

<div class="box rule"><b>Соотношения между сторонами и углами</b>В треугольнике <b>против большей стороны лежит больший угол</b>, и наоборот: <b>против большего угла лежит большая сторона</b>. Против равных сторон — равные углы.</div>
<p><b>Кто против кого:</b> против угла A лежит сторона BC, против B — сторона AC, против C — сторона AB. Сторона «напротив» — та, в названии которой <b>нет</b> буквы этой вершины.</p>

<div class="box tip"><b>Следствие</b>В прямоугольном треугольнике гипотенуза — самая длинная сторона (против самого большого угла, 90°). В тупоугольном — сторона против тупого угла.</div>
<div class="box err"><b>Ошибка</b>Сторона AB — «сторона угла A», но лежит она <b>не против</b> A, а против C.</div>`},
{title:'Неравенство треугольника',lvl:4,html:`
<p class="hook">Почему люди протаптывают тропинки наискосок через газон? Потому что прямой путь из A в C <b>всегда короче</b>, чем через угол B. Это и есть неравенство треугольника — его «знают» даже кошки.</p>
<div class="fig">${fIneq}</div>
<div class="box rule"><b>Неравенство треугольника</b>Каждая сторона треугольника <b>меньше суммы двух других</b>: <span class="m">AC &lt; AB + BC</span>, <span class="m">AB &lt; AC + BC</span>, <span class="m">BC &lt; AB + AC</span>.</div>
<p><b>Почему (идея):</b> против большей стороны лежит больший угол. Продлим AB за B на отрезок BD = BC. Треугольник BCD равнобедренный, и в треугольнике ACD угол при C больше угла D, значит AD = AB + BC больше AC.</p>
<div class="box tip"><b>Быстрая проверка</b>Расположи стороны по возрастанию a ≤ b ≤ c. Треугольник существует, если <b>c &lt; a + b</b>. Остальные два неравенства тогда выполняются сами.</div>
<div class="box ex"><b>Пример</b>3, 4, 8: 8 &lt; 3 + 4? Нет, 8 &gt; 7 — треугольника нет (палочки 3 и 4 не дотянутся). 3, 4, 6: 6 &lt; 7 — есть.</div>
<div class="box err"><b>Равенство не годится</b>2, 3, 5: 5 = 2 + 3 — палочки лягут в одну линию, «треугольник» сплющится в отрезок. Нужно строго меньше.</div>`},
{title:'Какой может быть третья сторона',lvl:5,html:`
<div class="box rule"><b>Границы для третьей стороны</b>Если две стороны a и b, то третья сторона c удовлетворяет двойному неравенству <span class="m">|a − b| &lt; c &lt; a + b</span>.</div>
<p>Правая часть — неравенство треугольника для c. Левая — для большей из a и b: например, если a ≥ b, то a &lt; b + c, то есть c &gt; a − b.</p>
<div class="box ex"><b>Пример</b>Стороны 7 и 3. Третья: 4 &lt; c &lt; 10. Целых значений: 5, 6, 7, 8, 9 — пять штук. Формула для целых: 2 · (меньшая сторона) − 1 = 2 · 3 − 1 = 5.</div>
<div class="box ex"><b>Равнобедренный треугольник</b>Стороны 4 и 9. Если боковые по 4: 4 + 4 = 8 &lt; 9 — не существует. Значит, боковые по 9: периметр 9 + 9 + 4 = 22.</div>
<div class="box err"><b>Забыть нижнюю границу</b>«c &lt; 10, значит c может быть 1». Нет: при c = 1 стороны 7, 3, 1 — 7 &gt; 3 + 1.</div>
<div class="fact">Неравенство треугольника — основа «метрики» во многих науках. Навигатор, ищущий кратчайший маршрут, и алгоритм рекомендаций в YouTube, который ищет «близкие» видео, опираются на то, что расстояние «напрямик» не больше, чем через промежуточную точку.</div>`},
{title:'Цепочки углов: приёмы',lvl:6,html:`
<p>Многие задачи — это «угловой квест»: от известных углов шаг за шагом добираемся до нужного. Главные инструменты:</p>
<ol class="steps"><li><b>Сумма углов треугольника</b> 180° — в каждом маленьком треугольнике на рисунке.</li>
<li><b>Смежные углы</b> в сумме 180°, <b>вертикальные</b> равны.</li>
<li><b>Внешний угол</b> = сумма двух не смежных с ним.</li>
<li><b>Биссектриса</b> делит угол пополам; <b>высота</b> даёт прямой угол.</li>
<li><b>Равнобедренный</b> треугольник: равные стороны → равные углы при основании.</li>
<li><b>Параллельные прямые</b>: накрест лежащие и соответственные углы равны.</li></ol>
<div class="box ex"><b>Пример</b>В ΔABC ∠B = 60°, ∠C = 40°, AD — биссектриса. ∠A = 80°, ∠BAD = 40°. Угол ADC — внешний для ΔABD: ∠ADC = ∠B + ∠BAD = 60° + 40° = 100°.</div>
<div class="box tip"><b>Совет</b>Подписывай найденные углы прямо на рисунке. Чаще всего ответ появляется сам, когда рисунок «заполнен».</div>
<div class="box err"><b>Ошибка</b>Считать треугольник равнобедренным «на глаз». Равенство сторон должно следовать из условия.</div>`},
{title:'★ Идеи для олимпиадных задач',lvl:7,html:`
<div class="fig">${fBis}</div>
<div class="box rule"><b>1. Угол между биссектрисами</b>Биссектрисы углов B и C пересекаются в I. Тогда <span class="m">∠BIC = 90° + ∠A / 2</span>.<br>Почему: в ΔBIC углы при B и C равны ∠B/2 и ∠C/2, и ∠BIC = 180° − (∠B + ∠C)/2 = 180° − (180° − ∠A)/2 = 90° + ∠A/2.</div>
<div class="box rule"><b>2. Угол между высотами</b>В остроугольном треугольнике высоты из B и C пересекаются в H. Тогда <span class="m">∠BHC = 180° − ∠A</span>.<br>Почему: в четырёхугольнике A, основания высот и H два прямых угла, а сумма его углов 360°.</div>
<div class="box rule"><b>3. Внешние биссектрисы</b>Биссектрисы внешних углов при B и C пересекаются под углом <span class="m">90° − ∠A / 2</span>.</div>
<div class="box tip"><b>4. Цепочка равнобедренных</b>Если AB = BD = DC (D на AC) и ∠C = x, то ∠DBC = x, внешний угол ∠ADB = 2x, а ∠A = 2x. Значит ∠ABC = 180° − 3x.</div>`},
{title:'★ Звезда и подсчёты',lvl:8,html:`
<div class="fig">${fStar}</div>
<div class="box rule"><b>Пятиконечная звезда</b>Сумма углов при пяти вершинах <b>любой</b> пятиконечной звезды (даже кривой) равна <b>180°</b>.</div>
<p><b>Почему:</b> возьми одну вершину звезды, например A, и треугольник, в котором она лежит вместе с двумя «внутренними» точками пересечения. Углы этого треугольника при внутренних точках — внешние углы двух маленьких треугольников, каждый равен сумме двух других вершин звезды. Получается: ∠A + (∠C + ∠E) + (∠B + ∠D) = 180°.</p>
<div class="fact">Пентаграмма была тайным знаком пифагорейцев — учеников Пифагора. В правильной звезде каждый угол при вершине 180° : 5 = 36°.</div>
<div class="box rule"><b>Подсчёт треугольников</b>Сколько треугольников с целыми сторонами и периметром P? Перебирай стороны a ≤ b ≤ c с a + b + c = P и проверяй одно условие c &lt; a + b. Наибольшая сторона c всегда меньше P/2.</div>
<div class="box ex"><b>Пример</b>P = 9: тройки (1, 4, 4), (2, 3, 4), (3, 3, 3) — 3 треугольника. (1, 3, 5) и (2, 2, 5) не подходят: 5 ≥ 9/2.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps"><li>∠A + ∠B + ∠C = 180°. Равносторонний — по 60°. Острые углы прямоугольного — в сумме 90°.</li>
<li>Тупой (или прямой) угол в треугольнике — не больше одного.</li>
<li>Внешний угол = сумма двух внутренних, не смежных с ним. Сумма внешних углов — 360°.</li>
<li>Против большей стороны — больший угол, и наоборот.</li><li>Неравенство треугольника: c &lt; a + b (для наибольшей стороны c).</li>
<li>Третья сторона: |a − b| &lt; c &lt; a + b.</li><li>★ ∠BIC = 90° + A/2, ∠BHC = 180° − A, звезда — 180°.</li></ul>`}
];

const NW=t=>`<span style="white-space:nowrap;font-size:17px">${t}</span>`;
const symbols={tab:'Формулы',title:'Знаки и формулы темы',rows:[
['∠A','«угол A»','Угол треугольника при вершине A.','∠A = 50°'],
[NW('∠A + ∠B + ∠C = 180°'),'Сумма углов','В любом треугольнике на плоскости.','50° + 60° + 70°'],
[NW('∠внеш = ∠A + ∠B'),'Внешний угол при C','Равен сумме двух внутренних, не смежных с ним.','40° + 75° = 115°'],
[NW('c &lt; a + b'),'Неравенство треугольника','Сторона меньше суммы двух других.','3, 4, 8 — нет'],
[NW('|a − b| &lt; c &lt; a + b'),'Третья сторона','Границы для третьей стороны.','7 и 3 → 4 &lt; c &lt; 10'],
[NW('a &gt; b ⇔ ∠A &gt; ∠B'),'Стороны и углы','Против большей стороны — больший угол.','гипотенуза — наибольшая'],
[NW('90° + A/2'),'★ Угол BIC','Угол между биссектрисами углов B и C.','A = 60° → 120°'],
[NW('180° − A'),'★ Угол BHC','Угол между высотами из B и C (остроугольный треугольник).','A = 70° → 110°']
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Видишь треугольник — вспоминай 180°. Видишь угол «снаружи» — это внешний угол, сумма двух дальних. Даны три отрезка — сравни наибольший с суммой двух других.</div>`};

/* =====================================================================
   GENERATORS
   ===================================================================== */
/* ===== L0 ===== */
G(0,()=>CH('Чему равна сумма углов любого треугольника на плоскости?','180°',['360°','90°','Зависит от формы треугольника'],
 {short:'∠A + ∠B + ∠C = 180° для любого треугольника.',
 explain:'Теорема: сумма углов <b>любого</b> треугольника равна <b>180°</b> — у узкого, широкого, прямоугольного, какого угодно. 360° — это сумма углов четырёхугольника (и полный оборот), 90° — сумма только двух острых углов прямоугольного треугольника.',
 explain2:'Вспомни фокус с бумагой: оторви три уголка треугольника и приложи вершинами друг к другу — получится ровная линия, развёрнутый угол. А развёрнутый угол — это 180°.'}),{rule:true});
G(0,()=>CH('Как доказывают теорему о сумме углов треугольника?','Через вершину проводят прямую, параллельную противолежащей стороне, и замечают равные накрест лежащие углы',['Измеряют транспортиром углы у нескольких треугольников и складывают','Проводят медиану и доказывают равенство двух получившихся треугольников','Через вершину проводят перпендикуляр к стороне и складывают два прямых угла'],
 {short:'Прямая MN ∥ AC через B: ∠MBA = ∠A, ∠NBC = ∠C, а вместе с ∠B это развёрнутый угол.',
 explain:'Через вершину B проводим прямую MN ∥ AC. Накрест лежащие углы равны: ∠MBA = ∠A и ∠NBC = ∠C. Углы MBA, ABC и NBC вместе образуют развёрнутый угол 180°. Значит, ∠A + ∠B + ∠C = 180°. Измерения транспортиром — это проверка, а не доказательство: нельзя измерить все треугольники на свете.',
 explain2:'Параллельная прямая — это «линейка», к которой мы приложили оторванные уголки A и C из бумажного фокуса. Накрест лежащие углы при параллельных — та причина, по которой уголки ложатся ровно.'}),{rule:true});
G(0,()=>{const [A,B,C]=randAng(25,110);
 return {type:'num',q:`В треугольнике ABC ∠A = ${A}°, ∠B = ${B}°. Найди ∠C (в градусах).`,ans:C,
 pic:triPic(A,B,{g:{ang:[['A','C','B',dg(A)],['B','A','C',dg(B),{n:2}],['C','B','A','?',{col:'var(--hl)'}]]}}),
 hint:'Сумма всех трёх углов — 180°.',short:`180° − ${A}° − ${B}° = ${C}°.`,
 explain:`∠A + ∠B + ∠C = 180°, поэтому ∠C = 180° − ${A}° − ${B}° = 180° − ${A+B}° = <b>${C}°</b>.<div class="box err"><b>Ловушка</b>360° − ${A}° − ${B}° = ${360-A-B}° — это если перепутать с четырёхугольником.</div>`,
 explain2:`Сначала сложи известные: ${A}° + ${B}° = ${A+B}°. До 180° не хватает 180 − ${A+B} = ${C}. Проверка: ${A} + ${B} + ${C} = 180 ✅.`};});
G(0,()=>{const p=R(1,6),q=R(1,6),r=R(1,7);const s=p+q+r;if(180%s||new Set([p,q,r]).size<2)return null;const k=180/s;const big=R(0,1);const ans=big?k*Math.max(p,q,r):k*Math.min(p,q,r);
 return {type:'num',q:`Углы треугольника относятся как ${p} : ${q} : ${r}. Найди ${big?'наибольший':'наименьший'} угол (в градусах).`,ans,
 hint:`Обозначь углы ${p}x, ${q}x, ${r}x и сложи их.`,short:`${s}x = 180°, x = ${k}°, ${big?'наибольший':'наименьший'}: ${big?Math.max(p,q,r):Math.min(p,q,r)} · ${k}° = ${ans}°.`,
 explain:`Пусть углы равны ${p}x, ${q}x и ${r}x. Их сумма ${p}x + ${q}x + ${r}x = ${s}x = 180°, откуда x = ${k}°.<br>Углы: ${p*k}°, ${q*k}°, ${r*k}°. ${big?'Наибольший':'Наименьший'} — <b>${ans}°</b>.`,
 explain2:`Представь, что 180° разрезали на ${s} равных кусочков (${p} + ${q} + ${r} = ${s}). Каждый кусочек — 180 : ${s} = ${k}°. ${big?'Самому большому углу':'Самому маленькому углу'} досталось ${big?Math.max(p,q,r):Math.min(p,q,r)} кусочков: ${ans}°.`};});
G(0,()=>{const mode=R(0,1);let v,b;if(mode===0){v=2*R(10,70);b=(180-v)/2;}else{b=R(20,85);v=180-2*b;}
 const P={A:[0,0],C:[10,0],B:[5,5*Math.tan(b*D2R)]};
 const pic=geo({P,poly:[['A','B','C']],tick:[['A','B'],['B','C']],ang:mode===0?[['B','A','C',dg(v)],['A','C','B','?',{col:'var(--hl)'}]]:[['A','C','B',dg(b)],['B','A','C','?',{col:'var(--hl)'}]],maxH:170,W:260});
 const ans=mode===0?b:v;
 return {type:'num',q:mode===0?`В равнобедренном треугольнике ABC (AB = BC) угол при вершине B равен ${v}°. Найди угол при основании (в градусах).`:`В равнобедренном треугольнике ABC (AB = BC) угол при основании A равен ${b}°. Найди угол B при вершине (в градусах).`,ans,pic,
 hint:'Углы при основании равнобедренного треугольника равны.',short:mode===0?`(180° − ${v}°) : 2 = ${b}°.`:`180° − 2 · ${b}° = ${v}°.`,
 explain:mode===0?`Углы при основании равны: ∠A = ∠C = x. Тогда x + x + ${v}° = 180°, 2x = ${180-v}°, x = <b>${b}°</b>.<div class="box err"><b>Ошибка</b>180° − ${v}° = ${180-v}° — это сумма <b>двух</b> углов при основании, её ещё нужно разделить пополам.</div>`:`∠A = ∠C = ${b}° (углы при основании равны). ∠B = 180° − ${b}° − ${b}° = <b>${v}°</b>.<div class="box err"><b>Ошибка</b>180° − ${b}° = ${180-b}° — забыт второй угол при основании.</div>`,
 explain2:mode===0?`Проверка ответом: ${b}° + ${b}° + ${v}° = ${2*b+v}° ✅. Равнобедренный треугольник симметричен, поэтому «остаток» 180° − ${v}° делится между двумя углами поровну.`:`Сложи два одинаковых угла: ${b}° · 2 = ${2*b}°. До 180° остаётся ${v}° — это угол при вершине.`};});

/* ===== L1: виды треугольников ===== */
G(1,()=>CH('Какой треугольник называют тупоугольным?','У которого один из углов тупой (больше 90°)',['У которого все углы тупые','У которого один угол больше 60°','У которого две стороны разной длины'],
 {short:'Тупоугольный = есть тупой угол (> 90°). Он всегда один.',
 explain:'По углам треугольники делят на три вида: <b>остроугольный</b> (все углы &lt; 90°), <b>прямоугольный</b> (есть угол 90°), <b>тупоугольный</b> (есть угол &gt; 90°). Все углы тупыми быть не могут: 3 · 91° = 273° &gt; 180°. Длины сторон к виду «по углам» отношения не имеют.',
 explain2:'Тупой угол — «раскрытый» больше прямого, как раскрытая книга, лежащая почти плоско. Если в треугольнике есть такой угол — он тупоугольный.'}),{rule:true});
G(1,()=>CH('Сколько тупых углов может быть в треугольнике?','Не больше одного',['Не больше двух','Всегда ровно один','Сколько угодно'],

G(1,()=>{const t=R(0,2);let A,B,C;for(;;){A=R(20,120);B=R(15,120);C=180-A-B;if(C>=10&&typeOf(A,B,C)===t)break;if(t===1&&Math.random()<0.4){const x=R(20,70);[A,B,C]=shuffle([90,x,90-x]);if(C>0)break;}}
 return CH(`В треугольнике два угла равны ${A}° и ${B}°. Какой это треугольник?`,TYPES[t],TYPES.filter((_,i)=>i!==t),
 {hint:'Сначала найди третий угол, потом посмотри на самый большой.',short:`Третий угол ${C}°, наибольший ${Math.max(A,B,C)}° → ${TYPES[t]}.`,
 explain:`Третий угол: 180° − ${A}° − ${B}° = ${C}°. Углы: ${A}°, ${B}°, ${C}°. Наибольший — ${Math.max(A,B,C)}°, он ${t===0?'меньше 90° (острый), значит, треугольник <b>остроугольный</b>':t===1?'равен 90°, значит, треугольник <b>прямоугольный</b>':'больше 90° (тупой), значит, треугольник <b>тупоугольный</b>'}.${t===2&&A<90&&B<90?'<div class="box err"><b>Ловушка</b>Оба данных угла острые, но третий получился тупым!</div>':''}`,
 explain2:`Вид треугольника определяет самый большой угол. Не забудь посчитать тот, которого нет в условии: ${C}°. Сравни ${Math.max(A,B,C)}° с 90°.`});});
G(1,()=>{const x=R(15,75);
 return {type:'num',q:`В прямоугольном треугольнике один из острых углов равен ${x}°. Найди второй острый угол (в градусах).`,ans:90-x,

 hint:'Прямой угол «забирает» 90° из 180°.',short:`90° − ${x}° = ${90-x}°.`,

G(2,()=>{const [A,B,C]=randAng(25,100);const e=A+B;const T=triAng(A,B);const P=Object.assign({},T);P.D=add(P.C,[3.5,0]);

 {short:'Больше сторона — больше угол напротив, и наоборот.',

 explain2:'Футбольные ворота: чем они шире, тем больше угол, под которым их видно. Сторона — «ворота», противолежащий угол — «угол обзора».'}),{rule:true});
G(3,()=>CH('В треугольнике два угла равны. Что можно сказать о его сторонах?','Стороны, лежащие против этих углов, равны — треугольник равнобедренный',['Все три стороны равны','Сторона между этими углами равна каждой из двух других','Ничего определённого сказать нельзя'],
 {short:'Равные углы → равные противолежащие стороны.',
 explain:'Против равных углов лежат равные стороны (признак равнобедренного треугольника). Например, ∠A = ∠C → BC = AB. Все три стороны равны только если равны все три угла (по 60°).',

G(3,()=>{let A,B,C;for(;;){[A,B,C]=randAng(25,110);if(Math.min(Math.abs(A-B),Math.abs(B-C),Math.abs(A-C))>=6)break;}const big=R(0,1);const ang=[A,B,C],opp=['BC','AC','AB'],vn=['A','B','C'];
 const idx=big?ang.indexOf(Math.max(...ang)):ang.indexOf(Math.min(...ang));
 return CH(`В треугольнике ABC ∠A = ${A}°, ∠B = ${B}°, ∠C = ${C}°. Какая сторона ${big?'самая длинная':'самая короткая'}?`,opp[idx],opp.filter((_,i)=>i!==idx),
 {pic:triPic(A,B,{g:{ang:[['A','C','B',dg(A)],['B','A','C',dg(B),{n:2}],['C','B','A',dg(C),{n:3}]]}}),

 explain:`${big?'Наибольший':'Наименьший'} угол — ∠${vn[idx]} = ${ang[idx]}°. Против ${big?'большего':'меньшего'} угла лежит ${big?'бо́льшая':'меньшая'} сторона. Против вершины ${vn[idx]} лежит сторона без буквы ${vn[idx]}: <b>${opp[idx]}</b>.<div class="box err"><b>Ошибка</b>Стороны, в названии которых есть буква ${vn[idx]}, — это стороны угла ${vn[idx]} (они к нему прилежат), а нам нужна сторона <b>напротив</b>.</div>`,
 explain2:`Табличка «кто против кого»: A ↔ BC, B ↔ AC, C ↔ AB. Упорядочим углы: ${[...ang].sort((x,y)=>x-y).map(v=>v+'°').join(' &lt; ')} — и стороны в том же порядке: ${[...ang.map((v,i)=>[v,opp[i]])].sort((x,y)=>x[0]-y[0]).map(x=>x[1]).join(' &lt; ')}.`});});
G(3,()=>{let a,b,c;for(;;){a=R(3,12);b=R(3,12);c=R(3,12);if(okTri(a,b,c)&&a+b>c+1&&a+c>b+1&&b+c>a+1&&new Set([a,b,c]).size===3)break;}const big=R(0,1);const s=[a,b,c],an=['∠A','∠B','∠C'];const idx=big?s.indexOf(Math.max(a,b,c)):s.indexOf(Math.min(a,b,c));
 const T=tri3(a,b,c);
 return CH(`В треугольнике ABC: AB = ${c}, BC = ${a}, AC = ${b}. Какой угол ${big?'наибольший':'наименьший'}?`,an[idx],an.filter((_,i)=>i!==idx),
 {pic:geo({P:T,poly:[['A','B','C']],side:[['B','C',String(a)],['A','C',String(b)],['A','B',String(c)]],maxH:170,W:280}),

 explain2:`Порядок сторон: ${[...s.map((v,i)=>[v,['BC','AC','AB'][i],an[i]])].sort((x,y)=>x[0]-y[0]).map(x=>x[1]+' = '+x[0]).join(' &lt; ')}. Углы напротив идут в том же порядке: ${[...s.map((v,i)=>[v,an[i]])].sort((x,y)=>x[0]-y[0]).map(x=>x[1]).join(' &lt; ')}.`});});
G(3,()=>{const eq=Math.random()<0.25;let A,B;for(;;){A=R(25,100);B=eq?A:R(25,100);if(A+B<=160&&(eq||Math.abs(A-B)>=5))break;}const C=180-A-B;

G(4,()=>CH('Как звучит неравенство треугольника?','Каждая сторона треугольника меньше суммы двух других сторон',['Каждая сторона треугольника меньше разности двух других','Сумма двух сторон треугольника равна третьей стороне','Каждая сторона треугольника больше суммы двух других'],
 {short:'a < b + c, b < a + c, c < a + b.',
 explain:'Неравенство треугольника: <b>каждая сторона меньше суммы двух других</b>. Смысл: путь напрямую короче, чем через третью точку. Если сумма двух сторон равна третьей, точки лежат на одной прямой — треугольника нет.',
 explain2:'Из A в C можно пройти напрямую или через B. Через B — длиннее: AC &lt; AB + BC. И так для каждой стороны.'}),{rule:true});
G(4,()=>CH('Как быстрее всего проверить, существует ли треугольник со сторонами a ≤ b ≤ c?','Проверить одно неравенство: c < a + b',['Проверить одно неравенство: a < b + c','Проверить, что c > a + b','Проверить, что a + b + c больше 0'],
 {short:'Достаточно сравнить наибольшую сторону с суммой двух других.',
 explain:'Если c — наибольшая, то неравенства a &lt; b + c и b &lt; a + c выполняются автоматически (там справа стоит c, а c ≥ a, c ≥ b). Проверять нужно только <b>c &lt; a + b</b>. Неравенство a &lt; b + c для самой маленькой стороны верно почти всегда, поэтому оно ничего не доказывает: 1, 2, 10 — 1 &lt; 12, но треугольника нет.',
 explain2:'Самая опасная сторона — самая длинная: только ей может «не хватить» двух других. Проверь именно её.'}),{rule:true});
G(4,()=>{const ok=R(0,2);let a,b,c;for(;;){a=R(2,12);b=R(2,12);c=R(2,15);const s=[a,b,c].sort((x,y)=>x-y);const st=s[2]<s[0]+s[1]?0:s[2]===s[0]+s[1]?1:2;if(ok===0?st===0:ok===1?st===1:st===2)break;}
 const s=[a,b,c].sort((x,y)=>x-y);const yes=s[2]<s[0]+s[1];
 return CH(`Существует ли треугольник со сторонами ${a}, ${b} и ${c}?`,yes?'Да':'Нет',[yes?'Нет':'Да'],
 {short:`Наибольшая ${s[2]} ${yes?'&lt;':s[2]===s[0]+s[1]?'=':'&gt;'} ${s[0]} + ${s[1]} = ${s[0]+s[1]}.`,
 explain:`Наибольшая сторона ${s[2]}, сумма двух других ${s[0]} + ${s[1]} = ${s[0]+s[1]}. ${yes?`${s[2]} &lt; ${s[0]+s[1]} — неравенство выполняется, треугольник <b>существует</b>.`:s[2]===s[0]+s[1]?`${s[2]} = ${s[0]+s[1]} — равенство! Отрезки лягут на одну прямую, треугольника <b>нет</b>.`:`${s[2]} &gt; ${s[0]+s[1]} — двум коротким сторонам «не дотянуться», треугольника <b>нет</b>.`}`,
 explain2:`Представь палочки длиной ${s[0]} и ${s[1]}, прикреплённые к концам палочки ${s[2]}. ${yes?'Их общей длины хватает, чтобы встретиться над длинной палочкой — получится вершина.':'Даже если вытянуть их в одну линию, вместе они '+(s[2]===s[0]+s[1]?'ровно равны длинной — вершина ляжет на неё, треугольник сплющен.':'короче длинной палочки — не встретятся.')}`});});
G(4,()=>{const tr=[];const wantOk=R(1,3);let tries=0;while(tr.length<4&&tries++<500){const a=R(1,10),b=R(1,10),c=R(1,14);const s=[a,b,c].sort((x,y)=>x-y);const ok=s[2]<s[0]+s[1];const need=tr.filter(t=>t.ok).length<wantOk;if(ok!==need)continue;const k=s.join(',');if(tr.some(t=>t.k===k))continue;tr.push({s:[a,b,c],ok,k,ss:s});}

/* ===== L5: третья сторона ===== */
G(5,()=>CH('Две стороны треугольника равны a и b. Какой может быть третья сторона c?','|a − b| < c < a + b',['c < a + b, и больше никаких ограничений','|a − b| ≤ c ≤ a + b','c > a + b'],
 {short:'Третья сторона больше разности и меньше суммы двух других.',
 explain:'Из неравенства треугольника: c &lt; a + b (для самой c) и, например, при a ≥ b: a &lt; b + c, откуда c &gt; a − b. Вместе: <b>|a − b| &lt; c &lt; a + b</b>. Неравенства строгие: при равенстве треугольник сплющивается в отрезок.',
 explain2:'Стороны 7 и 3 — как две палки на шарнире. Сложены вместе — расстояние между концами 7 − 3 = 4, разогнуты в линию — 7 + 3 = 10. Треугольник получается при всём, что строго между: 4 &lt; c &lt; 10.'}),{rule:true});
G(5,()=>{const a=R(3,15),b=R(2,15);if(a===b)return null;const lo=Math.abs(a-b),hi=a+b;const ans=hi-lo-1;
 return {type:'num',q:`Две стороны треугольника равны ${a} и ${b}. Сколько целых значений может принимать длина третьей стороны?`,ans,
 hint:`${lo} &lt; c &lt; ${hi}. Посчитай целые числа строго между.`,short:`${lo} &lt; c &lt; ${hi}: от ${lo+1} до ${hi-1} — ${ans} ${plural(ans,'значение','значения','значений')}.`,
 explain:`Третья сторона: |${a} − ${b}| &lt; c &lt; ${a} + ${b}, то есть ${lo} &lt; c &lt; ${hi}. Целые значения: ${lo+1}, ${lo+2}, …, ${hi-1}. Их количество ${hi-1} − ${lo+1} + 1 = <b>${ans}</b>.<div class="box err"><b>Ошибка</b>${hi} − ${lo} = ${hi-lo} — так считают, если включить один из концов. Но c ≠ ${lo} и c ≠ ${hi}.</div>`,
 explain2:`Короткая формула: 2 · (меньшая сторона) − 1 = 2 · ${Math.min(a,b)} − 1 = ${ans}. Проверь на маленьком примере: стороны 2 и 5 → 3 &lt; c &lt; 7 → 4, 5, 6 — три значения = 2 · 2 − 1 ✅.`};});
G(5,()=>{const p=R(2,12),q=R(2,25);if(2*p>q-0||p===q)return null;const ans=2*q+p;
 return {type:'num',q:`Две стороны равнобедренного треугольника равны ${p} и ${q}. Найди его периметр.`,ans,
 hint:`Попробуй оба варианта: боковые стороны по ${p} или по ${q}. Один из них нарушает неравенство треугольника.`,short:`${p}, ${p}, ${q} — нет (${p} + ${p} ≤ ${q}); ${q}, ${q}, ${p} — да. P = ${ans}.`,
 explain:`Вариант 1: стороны ${p}, ${p}, ${q}. Проверка: ${p} + ${p} = ${2*p} ${2*p===q?'=':'&lt;'} ${q} — треугольника <b>нет</b>.<br>Вариант 2: стороны ${q}, ${q}, ${p}. ${q} &lt; ${q} + ${p} — существует.<br>Периметр: ${q} + ${q} + ${p} = <b>${ans}</b>.<div class="box err"><b>Ловушка</b>Ответ ${2*p+q} — это несуществующий треугольник ${p}, ${p}, ${q}.</div>`,
 explain2:`Две боковые стороны по ${p} вместе дают ${2*p} — это ${2*p===q?'ровно столько же, сколько':'меньше, чем'} основание ${q}: они «не дотянутся» друг до друга. Значит, боковые — длинные, по ${q}.`};});
G(5,()=>{const a=R(4,18),b=R(2,17);if(a===b)return null;const mx=R(0,1);const ans=mx?a+b-1:Math.abs(a-b)+1;
 return {type:'num',q:`Две стороны треугольника ${a} см и ${b} см, третья сторона — целое число сантиметров. Какой может быть ${mx?'наибольшая':'наименьшая'} длина третьей стороны (в см)?`,ans,
 hint:`${Math.abs(a-b)} &lt; c &lt; ${a+b}.`,short:`${Math.abs(a-b)} &lt; c &lt; ${a+b} → ${mx?'наибольшее':'наименьшее'} целое ${ans}.`,
 explain:`Третья сторона c удовлетворяет |${a} − ${b}| &lt; c &lt; ${a} + ${b}, то есть ${Math.abs(a-b)} &lt; c &lt; ${a+b}. ${mx?`Наибольшее целое, меньшее ${a+b}, — <b>${ans}</b>.`:`Наименьшее целое, большее ${Math.abs(a-b)}, — <b>${ans}</b>.`}<div class="box err"><b>Ошибка</b>Ответ ${mx?a+b:Math.abs(a-b)} — неравенство строгое, при c = ${mx?a+b:Math.abs(a-b)} треугольник сплющивается.</div>`,
 explain2:`Проверка: стороны ${a}, ${b}, ${ans}. Наибольшая ${Math.max(a,b,ans)} &lt; сумма двух других ${a+b+ans-Math.max(a,b,ans)} ✅. А ${mx?ans+1:ans-1} уже не подходит: ${mx?`${ans+1} = ${a} + ${b}`:`${Math.max(a,b)} = ${Math.min(a,b)} + ${ans-1}`}.`};});

/* ===== L6: цепочки углов ===== */
G(6,()=>CH('Что такое биссектриса треугольника?','Отрезок, который делит угол треугольника пополам и соединяет вершину с точкой противоположной стороны',['Отрезок, соединяющий вершину с серединой противоположной стороны','Перпендикуляр, опущенный из вершины на прямую, содержащую противоположную сторону','Прямая, перпендикулярная стороне и проходящая через её середину'],
 {short:'Биссектриса делит угол пополам. Середина стороны — медиана, перпендикуляр — высота.',
 explain:'<b>Биссектриса</b> — делит угол пополам. Не путай: отрезок в середину стороны — <b>медиана</b>, перпендикуляр к стороне из вершины — <b>высота</b>, перпендикуляр через середину стороны — <b>серединный перпендикуляр</b>.',
 explain2:'«Биссектриса — это крыса, которая бегает по углам и делит угол пополам». А медиана — «обезьяна», которая прыгает в середину стороны.'}),{rule:true});
G(6,()=>CH('Какое утверждение помогает в задачах с высотой треугольника?','Высота образует с прямой, на которую опущена, прямой угол, поэтому острые углы получившегося прямоугольного треугольника дают в сумме 90°',['Высота делит противолежащую сторону пополам','Высота делит угол, из которого проведена, пополам','Высота всегда лежит внутри треугольника'],
 {short:'Высота → прямой угол → острые углы в сумме 90°.',
 explain:'Высота перпендикулярна стороне (прямой угол 90°). В каждом из получившихся прямоугольных треугольников острые углы в сумме <b>90°</b>. Делить сторону или угол пополам высота <b>не обязана</b> (это делают только в равнобедренном треугольнике высота к основанию). А в тупоугольном треугольнике две высоты лежат вне его.',
 explain2:'Пример: высота BH, ∠A = 50°. В прямоугольном ΔABH ∠ABH = 90° − 50° = 40°.'}),{rule:true});
G(6,()=>{let A,B,C;for(;;){[A,B,C]=randAng(30,100);if(A%2===0)break;}const ans=B+A/2;const T=triAng(A,B);const P=Object.assign({},T);P.D=inter(P.A,polar(P.A,1,A/2),P.B,P.C);
 return {type:'num',q:`В треугольнике ABC ∠B = ${B}°, ∠C = ${C}°, AD — биссектриса. Найди ∠ADC (в градусах).`,ans,
 pic:geo({P,poly:[['A','B','C']],seg:[['A','D',{col:'var(--accent)'}]],ang:[['A','B','D','',{n:1,r:30}],['A','D','C','',{n:1,r:36}],['B','A','C',dg(B),{n:2}],['D','A','C','?',{col:'var(--hl)'}],['C','A','B',dg(C),{n:3}]],maxH:190,W:300}),
 hint:'Найди ∠A, потом ∠BAD. ∠ADC — внешний угол треугольника ABD.',short:`∠A = ${A}°, ∠BAD = ${A/2}°, ∠ADC = ${B}° + ${A/2}° = ${ans}°.`,
 explain:`1) ∠A = 180° − ${B}° − ${C}° = ${A}°.<br>2) AD — биссектриса: ∠BAD = ∠DAC = ${A}° : 2 = ${A/2}°.<br>3) ∠ADC — внешний угол треугольника ABD, он равен сумме двух не смежных: ∠ADC = ∠B + ∠BAD = ${B}° + ${A/2}° = <b>${ans}°</b>.`,
 explain2:`Через треугольник ADC: ∠DAC = ${A/2}°, ∠C = ${C}°, тогда ∠ADC = 180° − ${A/2}° − ${C}° = ${ans}° ✅.`};});
G(6,()=>{let A,B,C;for(;;){[A,B,C]=randAng(30,85);break;}const T=triAng(A,B);const P=Object.assign({},T);P.H=foot(P.B,P.A,P.C);const ask=R(0,1);
 const ans=ask?90-C:90-A;
 return {type:'num',q:`В треугольнике ABC ∠A = ${A}°, ∠C = ${C}°, BH — высота. Найди ∠${ask?'CBH':'ABH'} (в градусах).`,ans,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','H',{dash:true}]],rt:[['H','C','B']],ang:[['A','B','C',dg(A)],['C','A','B',dg(C),{n:2}],ask?['B','C','H','?',{col:'var(--hl)'}]:['B','H','A','?',{col:'var(--hl)'}]],maxH:190,W:300}),
 hint:`Посмотри на прямоугольный треугольник ${ask?'CBH':'ABH'}: в нём один угол 90°.`,short:`В ΔB${ask?'C':'A'}H: 90° − ${ask?C:A}° = ${ans}°.`,
 explain:`BH ⟂ AC, поэтому ΔB${ask?'C':'A'}H прямоугольный (∠BH${ask?'C':'A'} = 90°). Острые углы в сумме 90°: ∠${ask?'CBH':'ABH'} = 90° − ∠${ask?'C':'A'} = 90° − ${ask?C:A}° = <b>${ans}°</b>.${ask?'':` (Угол C для ответа не нужен!)`}`,
 explain2:`Проверка суммой углов ΔB${ask?'C':'A'}H: ${ask?C:A}° + 90° + ${ans}° = 180° ✅. Высота всегда даёт прямоугольные треугольники — это главный «ключ».`};});
G(6,()=>{let A,B,C;for(;;){[A,B,C]=randAng(35,85);if(Math.abs(A-C)>=8&&(A-C)%2===0&&B>=46)break;}const T=triAng(A,B);const P=Object.assign({},T);P.H=foot(P.B,P.A,P.C);
 P.L=inter(P.B,add(P.B,add(unit(sub(P.A,P.B)),unit(sub(P.C,P.B)))),P.A,P.C);const ans=Math.abs(A-C)/2;
 return {type:'num',q:`В треугольнике ABC ∠A = ${A}°, ∠C = ${C}°. BH — высота, BL — биссектриса. Найди угол HBL между ними (в градусах).`,ans,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','H',{dash:true}],['B','L',{col:'var(--accent)'}]],rt:[['H','C','B']],ang:[['A','B','C',dg(A)],['C','A','B',dg(C),{n:2}]],maxH:200,W:300}),
 hint:`Найди ∠B и половину его. Потом найди угол ${A>C?'ABH':'CBH'} из прямоугольного треугольника.`,short:`∠B/2 = ${B/2}°, ∠${A>C?'ABH':'CBH'} = ${90-Math.max(A,C)}°, ∠HBL = ${ans}°.`,
 explain:`1) ∠B = 180° − ${A}° − ${C}° = ${B}°, биссектриса: ∠${A>C?'ABL':'CBL'} = ${B/2}°.<br>2) Из прямоугольного ΔB${A>C?'A':'C'}H: ∠${A>C?'ABH':'CBH'} = 90° − ${Math.max(A,C)}° = ${90-Math.max(A,C)}°.<br>3) ∠HBL = ${B/2}° − ${90-Math.max(A,C)}° = <b>${ans}°</b>.`,
 explain2:`Есть красивая формула: угол между высотой и биссектрисой из одной вершины равен половине разности двух других углов: |${A}° − ${C}°| : 2 = ${ans}°. Проверь её на равнобедренном треугольнике: там высота и биссектриса совпадают, разность 0 ✅.`};});
G(6,()=>{let A,B,C;for(;;){[A,B,C]=randAng(30,95);if(A%2===0&&B>C+8)break;}const T=triAng(A,B);const P=Object.assign({},T);const ab=len(P.B);P.D=[ab,0];const ans=90+A/2;
 if(ab>9.2)return null;
 return {type:'num',q:`В треугольнике ABC ∠A = ${A}°. На стороне AC отметили точку D так, что AD = AB. Найди ∠BDC (в градусах).`,ans,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','D']],tick:[['A','B'],['A','D']],ang:[['A','B','C',dg(A)],['D','B','C','?',{col:'var(--hl)'}]],maxH:180,W:300}),
 hint:'ΔABD равнобедренный. Найди его углы при основании BD.',short:`∠ADB = (180° − ${A}°)/2 = ${90-A/2}°, ∠BDC = 180° − ${90-A/2}° = ${ans}°.`,
 explain:`AB = AD, значит ΔABD равнобедренный с основанием BD: ∠ABD = ∠ADB = (180° − ${A}°) : 2 = ${90-A/2}°.<br>∠BDC смежный с ∠ADB: ∠BDC = 180° − ${90-A/2}° = <b>${ans}°</b>.`,
 explain2:`Можно через внешний угол: ∠BDC — внешний для ΔABD при вершине D, он равен ∠A + ∠ABD = ${A}° + ${90-A/2}° = ${ans}° ✅. Заметь: углы B и C треугольника не понадобились.`};});
G(6,()=>{const [A,B,C]=randAng(30,100);const T=triAng(A,B);const P=Object.assign({},T);P.M=add(P.B,[-3.5,0]);P.N=add(P.B,[3.5,0]);
 return {type:'num',q:`Через вершину B треугольника ABC провели прямую MN, параллельную AC. ∠MBA = ${A}°, ∠NBC = ${C}°. Найди ∠ABC (в градусах).`,ans:B,
 pic:geo({P,poly:[['A','B','C']],seg:[['M','N',{col:'var(--accent)'}]],ang:[['B','M','A',dg(A)],['B','C','N',dg(C),{n:2}],['B','A','C','?',{col:'var(--hl)'}]],maxH:180,W:300}),
 hint:'Три угла при вершине B вместе образуют развёрнутый угол MBN.',short:`180° − ${A}° − ${C}° = ${B}°.`,
 explain:`Углы MBA, ABC и CBN вместе составляют развёрнутый угол MBN = 180°. ∠ABC = 180° − ${A}° − ${C}° = <b>${B}°</b>.<br>Заодно: ∠A = ∠MBA = ${A}° и ∠C = ∠NBC = ${C}° (накрест лежащие) — это и есть доказательство теоремы о сумме углов.`,
 explain2:`Проверь: ${A}° + ${B}° + ${C}° = 180° ✅. Прямая MN — «линейка», к которой приложены три угла.`};});

/* ===== L7: ★ биссектрисы, высоты, цепочки ===== */
G(7,()=>CH('Биссектрисы углов B и C треугольника ABC пересекаются в точке I. Чему равен ∠BIC?','90° + ∠A / 2',['90° − ∠A / 2','180° − ∠A','2 · ∠A'],
 {short:'∠BIC = 180° − (B + C)/2 = 90° + A/2.',
 explain:'В ΔBIC: ∠IBC = ∠B/2, ∠ICB = ∠C/2. ∠BIC = 180° − (∠B + ∠C)/2 = 180° − (180° − ∠A)/2 = <b>90° + ∠A/2</b>. 180° − ∠A — это угол между <b>высотами</b>, а 90° − ∠A/2 — между <b>внешними</b> биссектрисами.',
 explain2:'Проверка на равностороннем треугольнике: все углы 60°, биссектрисы пересекаются в центре, и угол между ними 120° = 90° + 30° ✅.'}),{rule:true,star:true});
G(7,()=>{const inv=R(0,1);let A,B,C;for(;;){[A,B,C]=randAng(36,90);if(A%2===0)break;}const bic=90+A/2;const T=triAng(A,B);const P=Object.assign({},T);P.I=incenter(P);
 const chk=angAt(P.I,P.B,P.C);if(Math.abs(chk-bic)>1e-6)return null;
 return {type:'num',q:inv?`Биссектрисы углов B и C треугольника ABC пересекаются в точке I, ∠BIC = ${bic}°. Найди ∠A (в градусах).`:`В треугольнике ABC ∠A = ${A}°. Биссектрисы углов B и C пересекаются в точке I. Найди ∠BIC (в градусах).`,ans:inv?A:bic,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','I',{col:'var(--accent)'}],['C','I',{col:'var(--accent)'}]],ang:[['A','B','C',inv?'?':dg(A),inv?{col:'var(--hl)'}:{}],['I','B','C',inv?dg(bic):'?',inv?{}:{col:'var(--hl)'}],['C','B','I','',{n:1,r:22}],['C','I','A','',{n:1,r:28}],['B','A','I','',{n:2,r:22}],['B','I','C','',{n:2,r:28}]],lab:['A','B','C','I'],maxH:200,W:300}),
 hint:'∠IBC + ∠ICB = (∠B + ∠C)/2, а ∠B + ∠C = 180° − ∠A.',short:inv?`${bic}° = 90° + A/2 → A = 2 · ${bic-90}° = ${A}°.`:`90° + ${A}°/2 = ${bic}°.`,
 explain:inv?`∠BIC = 90° + ∠A/2 (в ΔBIC: 180° − (∠B + ∠C)/2 = 180° − (180° − ∠A)/2). Значит ${bic}° = 90° + ∠A/2, ∠A/2 = ${bic-90}°, ∠A = <b>${A}°</b>.`:`∠B + ∠C = 180° − ${A}° = ${180-A}°. В ΔBIC углы при B и C — половинки: (∠B + ∠C)/2 = ${(180-A)/2}°. ∠BIC = 180° − ${(180-A)/2}° = <b>${bic}°</b> = 90° + ${A}°/2.`,
 explain2:`Обрати внимание: сами углы B и C не нужны, важна только их сумма. Например, при ∠B = ${B}°, ∠C = ${C}°: половинки ${N(B/2)}° и ${N(C/2)}°, ∠BIC = 180° − ${N(B/2)}° − ${N(C/2)}° = ${bic}° ✅.`};},{star:true});
G(7,()=>{const [A,B,C]=randAng(40,85);const T=triAng(A,B);const P=Object.assign({},T);P.B1=foot(P.B,P.A,P.C);P.C1=foot(P.C,P.A,P.B);P.H=orthocenter(P);
 const chk=angAt(P.H,P.B,P.C);if(Math.abs(chk-(180-A))>1e-6)return null;
 return {type:'num',q:`В остроугольном треугольнике ABC ∠A = ${A}°. Высоты BB₁ и CC₁ пересекаются в точке H. Найди ∠BHC (в градусах).`,ans:180-A,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','B1',{dash:true}],['C','C1',{dash:true}]],rt:[['B1','C','B'],['C1','B','C']],ang:[['A','B','C',dg(A)],['H','B','C','?',{col:'var(--hl)'}]],names:{B1:'B₁',C1:'C₁'},maxH:200,W:300}),
 hint:'Посмотри на четырёхугольник AC₁HB₁: в нём два прямых угла.',short:`∠BHC = ∠C₁HB₁ = 360° − 90° − 90° − ${A}° = ${180-A}°.`,
 explain:`В четырёхугольнике AC₁HB₁ углы при C₁ и B₁ прямые, ∠A = ${A}°. Сумма углов четырёхугольника 360°, значит ∠C₁HB₁ = 360° − 90° − 90° − ${A}° = ${180-A}°. ∠BHC = ∠C₁HB₁ (вертикальные) = <b>${180-A}°</b>.`,
 explain2:`Без четырёхугольника: в прямоугольном ΔABB₁ ∠ABB₁ = 90° − ${A}° = ${90-A}°, значит ∠HBC = ∠B − ${90-A}° = ${B}° − ${90-A}° = ${B-90+A}°. Аналогично ∠HCB = ${C}° − ${90-A}° = ${C-90+A}°. ∠BHC = 180° − ${B-90+A}° − ${C-90+A}° = ${180-A}° ✅.`};},{star:true});
G(7,()=>{const x=R(12,40);const A=2*x,B=180-3*x;const T=triAng(A,B);const P=Object.assign({},T);const Mbc=mid(P.B,P.C);const dbc=sub(P.C,P.B);P.D=inter(Mbc,add(Mbc,[-dbc[1],dbc[0]]),P.A,P.C);
 const l1=len(sub(P.A,P.B)),l2=len(sub(P.B,P.D)),l3=len(sub(P.D,P.C));if(Math.abs(l1-l2)>1e-6||Math.abs(l2-l3)>1e-6)return null;const ask=R(0,1);const ans=ask?180-4*x:180-3*x;
 return {type:'num',q:`На стороне AC треугольника ABC взята точка D так, что AB = BD = DC. ∠C = ${x}°. Найди ∠${ask?'ABD':'ABC'} (в градусах).`,ans,
 pic:geo({P,poly:[['A','B','C']],seg:[['B','D']],tick:[['A','B'],['B','D'],['D','C']],ang:[['C','A','B',dg(x)],ask?['B','A','D','?',{col:'var(--hl)'}]:['B','A','C','?',{col:'var(--hl)'}]],maxH:190,W:300}),
 hint:'BD = DC → ΔBDC равнобедренный. ∠ADB — внешний угол ΔBDC. Потом ΔABD тоже равнобедренный.',short:`∠DBC = ${x}°, ∠ADB = ∠A = ${2*x}°, ∠ABD = ${180-4*x}°, ∠ABC = ${180-3*x}°.`,
 explain:`1) BD = DC → ∠DBC = ∠C = ${x}°.<br>2) ∠ADB — внешний угол ΔBDC: ∠ADB = ${x}° + ${x}° = ${2*x}°.<br>3) AB = BD → ΔABD равнобедренный, ∠A = ∠ADB = ${2*x}°, ∠ABD = 180° − 2 · ${2*x}° = ${180-4*x}°.<br>4) ∠ABC = ∠ABD + ∠DBC = ${180-4*x}° + ${x}° = ${180-3*x}°.<br>Ответ: <b>${ans}°</b>.`,
 explain2:`Проверка суммой углов ΔABC: ∠A + ∠B + ∠C = ${2*x}° + ${180-3*x}° + ${x}° = 180° ✅. Цепочка равнобедренных треугольников «удваивает» угол на каждом шаге — частый олимпиадный сюжет.`};},{star:true});

/* ===== L8: ★ звезда и подсчёты ===== */
G(8,()=>CH('Чему равна сумма углов при пяти вершинах любой пятиконечной звезды?','180°',['360°','540°','Зависит от формы звезды'],
 {short:'Любая пятиконечная звезда: сумма углов при вершинах 180°.',
 explain:'Возьми треугольник с вершиной A звезды и двумя внутренними точками пересечения. Его углы при этих точках — внешние углы маленьких треугольников, они равны ∠C + ∠E и ∠B + ∠D. Сумма углов этого треугольника: ∠A + ∠B + ∠C + ∠D + ∠E = <b>180°</b>. 540° — это сумма углов пятиугольника, а не звезды.',
 explain2:'Проверка на правильной звезде: каждый угол 36°, 5 · 36° = 180° ✅. И это верно для любой, даже кривой звезды.'}),{rule:true,star:true});
G(8,()=>{const n=[10,10,10,10,10];let rest=40;while(rest>0){const i=R(0,4);if(n[i]<26){n[i]++;rest--;}}const tips=n.map(v=>2*v);const P=starPts(tips);
 for(let k=0;k<5;k++){const t=angAt(P['P'+k],P['P'+((k+2)%5)],P['P'+((k+3)%5)]);if(Math.abs(t-tips[k])>1e-6)return null;}
 const u=R(0,4);const seg=[];for(let k=0;k<5;k++)seg.push(['P'+k,'P'+((k+2)%5),{sw:2}]);const nm='ABCDE';
 const ang=[0,1,2,3,4].map(k=>['P'+k,'P'+((k+2)%5),'P'+((k+3)%5),'',k===u?{col:'var(--hl)'}:{}]);const names={};for(let k=0;k<5;k++)names['P'+k]=nm[k]+' '+(k===u?'?':dg(tips[k]));
 const known=tips.filter((_,k)=>k!==u);const sk=known.reduce((a,b)=>a+b,0);
 return {type:'num',q:`Углы при вершинах пятиконечной звезды ABCDE: ${[0,1,2,3,4].filter(k=>k!==u).map(k=>`∠${nm[k]} = ${tips[k]}°`).join(', ')}. Найди ∠${nm[u]} (в градусах).`,ans:tips[u],
 pic:geo({P,seg,ang,names,maxH:230,W:300}),
 hint:'Сумма углов при вершинах любой пятиконечной звезды — 180°.',short:`180° − (${known.join(' + ')})° = ${tips[u]}°.`,
 explain:`Сумма углов при вершинах звезды равна 180° (через внешние углы маленьких треугольников). Известные: ${known.join('° + ')}° = ${sk}°. ∠${nm[u]} = 180° − ${sk}° = <b>${tips[u]}°</b>.<div class="box err"><b>Ловушка</b>360° − ${sk}° = ${360-sk}° — у звезды не 360°.</div>`,
 explain2:`Почему 180°: рассмотри треугольник, образованный вершиной ${nm[0]} и двумя ближайшими к ней точками пересечения внутри звезды. Его углы при этих точках — внешние углы маленьких треугольников: один равен ∠${nm[2]} + ∠${nm[4]}, другой ∠${nm[1]} + ∠${nm[3]}. Значит, все пять углов звезды «собираются» в одном треугольнике — 180°.`};},{star:true});
G(8,()=>{const Pm=R(9,24);let cnt=0;const L=[];for(let a=1;a<=Pm;a++)for(let b=a;b<=Pm;b++){const c=Pm-a-b;if(c<b)continue;if(c<a+b){cnt++;L.push(`(${a}, ${b}, ${c})`);}}
 return {type:'num',q:`Сколько существует различных треугольников с целыми сторонами и периметром ${Pm}? (Треугольники, отличающиеся только порядком сторон, считаем одинаковыми.)`,ans:cnt,
 hint:`Перебирай тройки a ≤ b ≤ c с a + b + c = ${Pm}. Наибольшая сторона c должна быть меньше ${Pm}/2.`,short:`${cnt}: ${L.join(', ')}.`,
 explain:`Пусть a ≤ b ≤ c и a + b + c = ${Pm}. Условие треугольника c &lt; a + b = ${Pm} − c даёт c &lt; ${N(Pm/2)}, а из c ≥ b ≥ a — c ≥ ${N(Math.ceil(Pm/3))}. Перебираем c от ${Math.ceil(Pm/3)} до ${Math.ceil(Pm/2)-1} и для каждого — пары a ≤ b ≤ c:<br>${L.join(', ')}.<br>Всего <b>${cnt}</b>.`,
 explain2:`Удобно идти по наибольшей стороне c. ${(()=>{let s='';for(let c=Math.ceil(Pm/3);c<Pm/2;c++){const r=Pm-c;const pr=[];for(let a=1;a<=r/2;a++){const b=r-a;if(b<=c&&a<=b)pr.push(a+'+'+b);}s+=`c = ${c}: a + b = ${r} → ${pr.join(', ')} (${pr.length})<br>`;}return s;})()}Сумма: ${cnt}.`};},{star:true});
G(8,()=>{const n=R(5,9);let cnt=0;const L=[];for(let i=1;i<=n;i++)for(let j=i+1;j<=n;j++)for(let k=j+1;k<=n;k++)if(i+j>k){cnt++;L.push(`${i}-${j}-${k}`);}
 return {type:'num',q:`У Артёма есть ${n} палочек длиной 1, 2, 3, …, ${n} см (по одной каждой длины). Сколькими способами можно выбрать три палочки, чтобы из них сложился треугольник?`,ans:cnt,
 hint:'Для тройки a &lt; b &lt; c нужно a + b &gt; c. Перебирай по наибольшей палочке c.',short:`${cnt} ${plural(cnt,'способ','способа','способов')}: ${L.join(', ')}.`,
 explain:`Тройка a &lt; b &lt; c подходит, если a + b &gt; c. Переберём наибольшую палочку c:<br>${(()=>{let s='';for(let c=3;c<=n;c++){const pr=[];for(let a=1;a<c;a++)for(let b=a+1;b<c;b++)if(a+b>c)pr.push(a+'-'+b);s+=`c = ${c}: ${pr.length?pr.join(', '):'нет'} (${pr.length})<br>`;}return s;})()}Всего <b>${cnt}</b>.`,
 explain2:`Типичная ошибка — забыть, что равенство не годится: 1, 2, 3 — «треугольник» сплющен (1 + 2 = 3). Самая короткая палочка 1 вообще ни с кем не работает: для 1 &lt; b &lt; c нужно 1 + b &gt; c, а c ≥ b + 1. Подходящие тройки: ${L.join(', ')}.`};},{star:true});

function onTheory(root){const w=root.querySelector('#w-tri');if(!w)return;
  w.innerHTML=`<div id="wtS" style="display:flex;justify-content:center;touch-action:none"></div><label><input type="checkbox" id="wtP"> показать доказательство (прямая через B параллельно AC)</label><div id="wtO" class="small" style="text-align:center"></div>`;
  const W=320,Hh=230;let pts=[[50,190],[150,50],[280,190]];let drag=-1;const P=w.querySelector('#wtP');
  const ang=(v,a,b)=>{const u=[a[0]-v[0],a[1]-v[1]],q=[b[0]-v[0],b[1]-v[1]];return Math.acos(Math.max(-1,Math.min(1,(u[0]*q[0]+u[1]*q[1])/(Math.hypot(...u)*Math.hypot(...q)))))/D2R;};
  const arc=(v,a,b,r,col,op)=>{const a1=Math.atan2(a[1]-v[1],a[0]-v[0]);let d=Math.atan2(b[1]-v[1],b[0]-v[0])-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;const p=[v[0]+r*Math.cos(a1),v[1]+r*Math.sin(a1)],q=[v[0]+r*Math.cos(a1+d),v[1]+r*Math.sin(a1+d)];
    return `<path d="M${v[0].toFixed(1)},${v[1].toFixed(1)} L${p[0].toFixed(1)},${p[1].toFixed(1)} A${r},${r} 0 0 ${d>0?1:0} ${q[0].toFixed(1)},${q[1].toFixed(1)} Z" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="1.5"/>`;};
  const round3=a=>{const f=a.map(Math.floor);let rest=180-f.reduce((s,x)=>s+x,0);const ord=a.map((x,i)=>[x-Math.floor(x),i]).sort((x,y)=>y[0]-x[0]);for(let k=0;k<rest;k++)f[ord[k][1]]++;return f;};
  const cols=['var(--accent)','var(--hl)','var(--ok)'];
  const draw=()=>{const [A,B,C]=pts;const raw=[ang(A,B,C),ang(B,A,C),ang(C,A,B)];const r=round3(raw);
    let s=`<svg viewBox="0 0 ${W} ${Hh}" width="${W}" role="img" aria-label="Треугольник с подвижными вершинами" style="font-family:system-ui,sans-serif;max-width:100%">`;
    s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="var(--hl)" fill-opacity=".12" stroke="var(--fig)" stroke-width="2.2" stroke-linejoin="round"/>`;
    s+=arc(A,B,C,22,cols[0],.35)+arc(B,A,C,22,cols[1],.35)+arc(C,A,B,22,cols[2],.35);
    if(P.checked){const d=[C[0]-A[0],C[1]-A[1]];const L=Math.hypot(...d);const e=[d[0]/L,d[1]/L];const M=[B[0]-e[0]*400,B[1]-e[1]*400],Nn=[B[0]+e[0]*400,B[1]+e[1]*400];
      s+=`<line x1="${M[0]}" y1="${M[1]}" x2="${Nn[0]}" y2="${Nn[1]}" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="6 4"/>`;
      const Mp=[B[0]-e[0]*40,B[1]-e[1]*40],Np=[B[0]+e[0]*40,B[1]+e[1]*40];s+=arc(B,Mp,A,26,cols[0],.35)+arc(B,Np,C,26,cols[2],.35);}
    const cen=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];['A','B','C'].forEach((n,i)=>{const p=pts[i];const d=[p[0]-cen[0],p[1]-cen[1]];const l=Math.hypot(...d)||1;const q=[p[0]+d[0]/l*20,p[1]+d[1]/l*20];
      s+=`<text x="${q[0].toFixed(1)}" y="${(q[1]+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent-ink)">${n}</text>`;});
    pts.forEach((p,i)=>{s+=`<circle data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="10" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent)" stroke-width="2" style="cursor:grab"/>`;});
    s+='</svg>';w.querySelector('#wtS').innerHTML=s;const m=Math.max(...r);
    w.querySelector('#wtO').innerHTML=`∠A + ∠B + ∠C = <span class="out">${r[0]}° + ${r[1]}° + ${r[2]}° = 180°</span> · треугольник <b>${m<90?'остроугольный':m===90?'прямоугольный':'тупоугольный'}</b>${P.checked?'<br>Уголки A и C «переехали» к вершине B и вместе с ∠B легли на прямую.':''}`;};
  const host=w.querySelector('#wtS');
  const loc=e=>{const svg=host.querySelector('svg');const r=svg.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*Hh/r.height];};
  host.addEventListener('pointerdown',e=>{const p=loc(e);let best=-1,bd=30;pts.forEach((q,i)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;best=i;}});if(best>=0){drag=best;try{host.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}});
  host.addEventListener('pointermove',e=>{if(drag<0)return;const p=loc(e);p[0]=Math.max(14,Math.min(W-14,p[0]));p[1]=Math.max(14,Math.min(Hh-14,p[1]));const old=pts[drag];pts[drag]=p;
    const [A,B,C]=pts;const area=Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]));if(area<600||Math.min(Math.hypot(A[0]-B[0],A[1]-B[1]),Math.hypot(B[0]-C[0],B[1]-C[1]),Math.hypot(A[0]-C[0],A[1]-C[1]))<30)pts[drag]=old;draw();});
  const up=()=>{drag=-1;};host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);P.onchange=draw;draw();}
