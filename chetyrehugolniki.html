const fig=s=>`<div class="fig">${s}</div>`;
const opp={A:'C',B:'D',C:'A',D:'B'};
const nbr={A:['B','D'],B:['A','C'],C:['B','D'],D:['A','C']};

/* ===== L0: polygons ===== */
G(0,()=>{const n=R(5,12);const s=(n-2)*180;
return {type:'num',q:`Найди сумму углов выпуклого ${NGg[n]} (у него ${n} ${plural(n,'вершина','вершины','вершин')}).`,ans:s,
hint:'Разрежь многоугольник диагоналями из одной вершины на треугольники. Сколько их получится?',
short:`(${n} − 2) · 180° = ${n-2} · 180° = ${s}°.`,
explain:`Сумма углов выпуклого n-угольника: <span class="m">(n − 2) · 180°</span>.<br>Здесь n = ${n}: (${n} − 2) · 180° = ${n-2} · 180° = <b>${s}°</b>.<div class="box err"><b>Почему не ${n} · 180° = ${n*180}°</b>Из одной вершины диагонали режут ${NG[n]} не на ${n}, а на ${n-2} ${plural(n-2,'треугольник','треугольника','треугольников')}: две стороны, соседние с этой вершиной, новых треугольников не дают.</div>`,
explain2:`Посмотри на картинку: из вершины A проводим все диагонали.${n<=8?fig(triangFig(n)):''}Получается ${n-2} ${plural(n-2,'треугольник','треугольника','треугольников')}, и углы этих треугольников вместе как раз составляют все углы ${NGg[n]}. В каждом треугольнике 180°, поэтому всего ${n-2} · 180° = ${s}°.<br>Проверь на знакомом: у четырёхугольника 2 треугольника → 360° ✅.`};});
G(0,()=>{const n=pick([5,6,8,9,10,12]);const s=(n-2)*180,a=s/n;
return {type:'num',q:`Найди угол <b>правильного</b> ${NGg[n]} (все стороны и все углы равны).`,ans:a,
hint:'Сначала найди сумму всех углов, потом раздели поровну.',
short:`Сумма ${s}°, делим на ${n}: ${a}°.`,
explain:`1) Сумма углов: (${n} − 2) · 180° = ${s}°.<br>2) У правильного многоугольника все ${n} углов одинаковые, поэтому каждый: ${s}° : ${n} = <b>${a}°</b>.`,
explain2:`Другой способ — через внешние углы. Обходя многоугольник, в каждой вершине ты поворачиваешь на внешний угол, а всего поворачиваешься на полный круг 360°. Значит, каждый внешний угол = 360° : ${n} = ${360/n}°. А внутренний = 180° − ${360/n}° = ${a}°. Тот же ответ!`};});
G(0,()=>{for(;;){const ang=[R(60,135),R(60,135),R(60,135)];const four=360-ang[0]-ang[1]-ang[2];if(four<60||four>135)continue;
 const vals={A:four,B:ang[0],C:ang[1],D:ang[2]};const who=pick(Q4);const order=[who,...Q4.filter(x=>x!==who)];
 const p=quadFromAngles(vals.A,vals.B,vals.C,vals.D);if(!p)continue;
 const angs=Q4.map(k=>[k,nbr[k][0],nbr[k][1],k===who?'?':dg(vals[k])]);
 const pic=geo({P:p,poly:[Q4],ang:angs,maxH:200});const known=Q4.filter(k=>k!==who);const sum=known.reduce((s,k)=>s+vals[k],0);
 return {type:'num',q:`В выпуклом четырёхугольнике ABCD ${known.map(k=>`∠${k} = ${vals[k]}°`).join(', ')}. Найди ∠${who}.`,pic,ans:vals[who],
 hint:'Чему равна сумма углов любого выпуклого четырёхугольника?',
 short:`360° − ${sum}° = ${vals[who]}°.`,
 explain:`Сумма углов выпуклого четырёхугольника равна <b>360°</b> (это (4 − 2) · 180°).<br>Сумма известных углов: ${known.map(k=>vals[k]).join(' + ')} = ${sum}°.<br>∠${who} = 360° − ${sum}° = <b>${vals[who]}°</b>.`,
 explain2:`Проведи диагональ — четырёхугольник разрежется на два треугольника.${fig(geo({P:p,poly:[Q4],seg:[['A','C',{dash:true}]],fill:[{pts:['A','B','C'],op:0.25}],maxH:170}))}В каждом треугольнике 180°, вместе 180° + 180° = 360°. Остаётся «добрать» до 360°: 360 − ${sum} = ${vals[who]}.`};}});
G(0,()=>{const cv=Math.random()<0.5;const C=['convex5','convex6','convex4'],NC=['dart','house','ell','star'];
 const right=cv?pick(C):pick(NC);const others=cv?sample(NC,3):sample(C,3);const ks=shuffle([right,...others]);
 return {type:'choice',pics:true,q:cv?'Какой из многоугольников <b>выпуклый</b>?':'Какой из многоугольников <b>невыпуклый</b>?',opts:ks.map(shapeSvg),ans:ks.indexOf(right),ansText:cv?'тот, у которого нет «вмятин»':'тот, у которого есть «вмятина» (угол больше 180°)',
 short:cv?'У выпуклого нет вмятин: все углы меньше 180°.':'У невыпуклого есть вмятина — угол больше 180°.',
 explain:`Многоугольник <b>выпуклый</b>, если он лежит по одну сторону от прямой, проведённой через любую его сторону. На практике: у него <b>нет вмятин</b>, все углы меньше 180°.<br>${cv?'У трёх фигур есть вмятина — угол «внутрь», больше 180°. Только у одной её нет.':'У трёх фигур вмятин нет, а у одной есть вершина, которая «вдавлена» внутрь, — угол там больше 180°. Она и невыпуклая.'}`,
 explain2:`Проверка «резинкой»: представь, что в вершинах вбиты гвоздики и вокруг натянули резинку. У выпуклой фигуры резинка ляжет ровно по всем сторонам. У невыпуклой резинка «перепрыгнет» вмятину, и одна вершина останется внутри.`};});

/* ===== L1: parallelogram angles & sides ===== */
G(1,()=>{const al=Math.random()<0.6?R(40,80):R(100,140);const ask=pick(['B','C','D']);const p=para(R(7,9),R(4,5),al);
 const ans=ask==='C'?al:180-al;
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B',dg(al)],[ask,nbr[ask][0],nbr[ask][1],'?']],maxH:190});
 return {type:'num',q:`ABCD — параллелограмм, ∠A = ${al}°. Найди ∠${ask}.`,pic,ans,
 short:ask==='C'?`∠C противоположен ∠A, поэтому ∠C = ${al}°.`:`∠${ask} — соседний с ∠A: 180° − ${al}° = ${ans}°.`,
 explain:ask==='C'?`∠A и ∠C — <b>противоположные</b> углы параллелограмма (стоят напротив друг друга). Противоположные углы параллелограмма равны: ∠C = ∠A = <b>${al}°</b>.`:`∠A и ∠${ask} — <b>соседние</b> углы (прилежат к одной стороне A${ask}). Их сумма 180°: ∠${ask} = 180° − ${al}° = <b>${ans}°</b>.<div class="box err"><b>Ошибка</b>Ответ ${al}° был бы верен для угла C — он напротив A. А ∠${ask} — рядом.</div>`,
 explain2:ask==='C'?`Поверни параллелограмм на 180° вокруг точки пересечения диагоналей — он совпадёт сам с собой, и вершина A окажется на месте C. Значит, углы A и C одинаковые: ${al}°.`:`Стороны AD и BC параллельны, а A${ask} их пересекает. Углы A и ${ask} — односторонние, вместе они «выпрямляются» в 180°. ${al<90?'Острый':'Тупой'} ${al}° + ${al<90?'тупой':'острый'} ${ans}° = 180°. Посмотри: на картинке ∠${ask} ${ans>90?'тупой':'острый'} — это сходится с ответом.`};});
G(1,()=>{const d=pick([20,30,40,50,60,70,80,100]);const x=(180-d)/2,y=x+d;const p=para(8,4.5,x);
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','x'],['B','A','C','x + '+d+'°']],maxH:180});
 return {type:'num',q:`Один угол параллелограмма на ${d}° больше другого. Найди <b>больший</b> угол.`,pic,ans:y,
 hint:'«Один угол больше другого» — значит, они разные, то есть соседние. Сумма соседних углов 180°.',
 short:`x + (x + ${d}) = 180 → x = ${x}, больший ${y}°.`,
 explain:`Равные углы не могут отличаться на ${d}°, значит, речь о <b>соседних</b> углах. Их сумма 180°.<br>Пусть меньший x, больший x + ${d}:<br>x + x + ${d} = 180 → 2x = ${180-d} → x = ${x}.<br>Больший угол: ${x} + ${d} = <b>${y}°</b>. Проверка: ${x} + ${y} = 180 ✅.`,
 explain2:`Представь: два брата вместе весят 180 кг, старший тяжелее на ${d} кг. Убери «лишние» ${d} кг у старшего — станет поровну: (180 − ${d}) : 2 = ${x} кг каждому. Вернём старшему ${d}: ${x} + ${d} = ${y}. С углами — то же самое.`};});
G(1,()=>{const k=pick([2,3,4,5,8]);const x=180/(k+1),y=k*x;const p=para(8,4.5,x);
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','x'],['B','A','C',k+'x']],maxH:180});
 return {type:'num',q:`Один из углов параллелограмма в ${k} раза больше другого. Найди <b>больший</b> угол.`,pic,ans:y,
 hint:'Разные углы параллелограмма — соседние, в сумме 180°.',short:`x + ${k}x = 180 → x = ${x}, больший ${y}°.`,
 explain:`Разные углы параллелограмма — соседние, их сумма 180°.<br>x + ${k}x = 180 → ${k+1}x = 180 → x = ${x}°.<br>Больший: ${k} · ${x} = <b>${y}°</b>.`,
 explain2:`Думай «частями»: меньший угол — 1 часть, больший — ${k} частей. Вместе ${k+1} ${plural(k+1,'часть','части','частей')} = 180°. Одна часть = 180 : ${k+1} = ${x}°. Больший = ${k} части = ${y}°.`};});
G(1,()=>{const a=R(4,15),b=R(3,14);if(a===b)return null;const P2=2*(a+b);const p=para(Math.max(a,b),Math.min(a,b),R(55,70));const big=a>b;
 const pic=geo({P:p,poly:[Q4],side:[['A','D',big?String(a):'?'],['A','B',big?'?':String(a)]],ang:[['A','D','B','']],maxH:180});
 return {type:'num',q:`Периметр параллелограмма ABCD равен ${P2} см, сторона ${big?'AD':'AB'} = ${a} см. Найди сторону ${big?'AB':'AD'}.`,pic,ans:b,
 hint:'Периметр — это две «соседние» стороны, взятые дважды.',short:`${P2} : 2 = ${a+b}; ${a+b} − ${a} = ${b} см.`,
 explain:`Противоположные стороны параллелограмма равны, поэтому P = 2 · (AB + AD).<br>Половина периметра: ${P2} : 2 = ${a+b} — это AB + AD.<br>Значит, ${big?'AB':'AD'} = ${a+b} − ${a} = <b>${b} см</b>.<div class="box err"><b>Частая ошибка</b>${P2} − ${a} = ${P2-a} — так вычли только одну сторону, а сторон ${a} в периметре две.</div>`,
 explain2:`Пройди вокруг забора: ${a} + ? + ${a} + ? = ${P2}. Две стороны по ${a} — это ${2*a}. На две оставшиеся приходится ${P2} − ${2*a} = ${2*b}, на одну — ${2*b} : 2 = ${b}.`};});
G(1,()=>{for(;;){const x=R(35,80);if(x===45)continue;const lt=Math.random()<0.5;const each=lt?x:180-x;const S=2*each;const other=180-each;const big=Math.max(each,other);
 const p=para(8,4.5,lt?x:180-x);return {type:'num',q:`Сумма двух углов параллелограмма равна ${S}°. Найди <b>больший</b> угол параллелограмма.`,ans:big,
 hint:'Могут ли эти два угла быть соседними? Сумма соседних — ровно 180°.',short:`Это противоположные углы по ${each}°; соседний ${other}°; больший ${big}°.`,
 explain:`Соседние углы дают в сумме ровно 180°, а у нас ${S}° — значит, это <b>противоположные</b> углы. Они равны: ${S} : 2 = ${each}°.<br>Два других угла: 180° − ${each}° = ${other}°.<br>Больший угол: <b>${big}°</b>.`,
 explain2:`Выпиши все четыре угла параллелограмма: это α, β, α, β, где α + β = 180°. Какие два из них могут дать ${S}? α + β = 180 — не подходит. Значит, ${S} = α + α, α = ${each}. Тогда β = ${other}. Углы: ${each}°, ${other}°, ${each}°, ${other}°.${fig(geo({P:p,poly:[Q4],ang:[['A','D','B',dg(each)],['C','B','D',dg(each)],['B','A','C',dg(other)]],maxH:160}))}`};}});
G(1,()=>{const T=[['Противоположные стороны равны','так по свойству параллелограмма'],['Противоположные углы равны','так по свойству параллелограмма'],['Диагонали точкой пересечения делятся пополам','так по свойству параллелограмма'],['Сумма соседних углов равна 180°','это односторонние углы при параллельных прямых']];
 const F=[['Диагонали равны','это верно только для прямоугольника'],['Диагонали перпендикулярны','это верно только для ромба'],['Все стороны равны','это ромб, а не любой параллелограмм'],['Диагонали делят углы пополам','это верно только для ромба'],['Все углы равны','это прямоугольник']];
 const t=sample(T,R(2,3)),f=sample(F,5-t.length);const opts=shuffle([...t.map(x=>({s:x,ok:1})),...f.map(x=>({s:x,ok:0}))]);
 return {type:'multi',q:'Какие утверждения верны для <b>любого</b> параллелограмма? Выбери все.',opts:opts.map(o=>o.s[0]),ans:opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0),
 short:'Свойства любого параллелограмма — только про «пары» и «пополам».',
 explain:opts.map(o=>`• «${o.s[0]}» — ${o.ok?'<b>верно</b>':'<b>неверно</b>'}: ${o.s[1]}.`).join('<br>'),
 explain2:`Проверка «контрпримером»: нарисуй сильно скошенный параллелограмм со сторонами 8 и 3. ${fig(geo({P:withO(para(8,3,45)),poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],lab:Q4,maxH:130}))}Видно, что диагонали у него разные и не перпендикулярны, стороны разные. Значит, эти свойства — не для любого параллелограмма. А «пары» и «пополам» выполняются всегда.`};});

/* ===== L2: diagonals, bisector, signs ===== */
G(2,()=>{for(;;){const p=R(3,9),q=R(3,9),c=R(4,12);if(p+q<=c+1||p+c<=q+1||q+c<=p+1)continue;
 const A=[0,0],O=[p,0];const x=(c*c-q*q+p*p)/(2*p);if(c*c-x*x<=0)continue;let B=[x,Math.sqrt(c*c-x*x)];const C=[2*p,0],D=sub(mul(O,2),B);
 let pts={A,B,C,D,O};const ang=Math.atan2(D[1],D[0]);const rot=v=>[v[0]*Math.cos(-ang)-v[1]*Math.sin(-ang),v[0]*Math.sin(-ang)+v[1]*Math.cos(-ang)];
 for(const k in pts)pts[k]=rot(pts[k]);if(pts.B[1]<0)for(const k in pts)pts[k]=[pts[k][0],-pts[k][1]];
 const aA=angAt(pts.A,pts.B,pts.D);if(aA<45||aA>135)continue;const ad=len(pts.D);if(ad/c>2.6||c/ad>2.6)continue;
 const ans=c+p+q;
 const pic=geo({P:pts,poly:[Q4],seg:[['A','C'],['B','D']],fill:[{pts:['A','B','O']}],side:[['A','B',String(c)]],dots:['O'],dir:{O:-90},maxH:200});
 return {type:'num',q:`Диагонали параллелограмма ABCD пересекаются в точке O. AC = ${2*p}, BD = ${2*q}, AB = ${c}. Найди периметр треугольника AOB.`,pic,ans,
 hint:'Какую часть диагонали составляют AO и BO?',short:`AO = ${p}, BO = ${q}; P = ${c} + ${p} + ${q} = ${ans}.`,
 explain:`Диагонали параллелограмма точкой пересечения <b>делятся пополам</b>:<br>AO = ${2*p} : 2 = ${p}, BO = ${2*q} : 2 = ${q}.<br>P(AOB) = AB + AO + BO = ${c} + ${p} + ${q} = <b>${ans}</b>.<div class="box err"><b>Ошибка</b>${c} + ${2*p} + ${2*q} = ${c+2*p+2*q} — так взяли целые диагонали, а у треугольника AOB стороны — только их <b>половинки</b>.</div>`,
 explain2:`Посмотри на закрашенный треугольник: его стороны — AB и два «кусочка» диагоналей от вершины до точки O. Точка O стоит ровно посередине каждой диагонали, как центр качелей. Поэтому AO — половина AC (${p}), BO — половина BD (${q}). Складываем: ${c} + ${p} + ${q} = ${ans}.`};}});
G(2,()=>{const a=R(3,9),c=R(2,8),al=R(52,72);const p=para(a+c,a,al);p.K=add(p.B,[a,0]);const P2=2*(2*a+c);
 const pic=geo({P:p,poly:[Q4],seg:[['A','K']],side:[['A','B',String(a)],['K','C',String(c)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}]],maxH:180});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','K']],fill:[{pts:['A','B','K']}],tick:[['A','B',1],['B','K',1]],side:[['A','B',String(a)],['B','K',String(a),{col:'var(--accent-ink)'}],['K','C',String(c)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}],['K','B','A','',{n:1,r:22}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD биссектриса угла A пересекает сторону BC в точке K. AB = ${a}, KC = ${c}. Найди периметр параллелограмма.`,pic,ans:P2,

 explain:`1) ∠BAK = ∠KAD — AK биссектриса.<br>2) ∠BKA = ∠KAD — накрест лежащие при BC ∥ AD и секущей AK.<br>3) Значит, ∠BAK = ∠BKA, и треугольник ABK <b>равнобедренный</b>: BK = AB = ${a}.<br>4) BC = BK + KC = ${a} + ${c} = ${a+c}.<br>5) P = 2 · (AB + BC) = 2 · (${a} + ${a+c}) = <b>${P2}</b>.`,
 explain2:`Отметим равные углы дужками:${fig(pic2)}Линии AK, BC и AD образуют букву «Z» — у неё углы на «изгибах» равны. Поэтому в закрашенном треугольнике ABK два угла одинаковые, а напротив равных углов — равные стороны: BK = AB = ${a}. Дальше просто: BC = ${a} + ${c} = ${a+c}, периметр = ${a} + ${a+c} + ${a} + ${a+c} = ${P2}.`};});
G(2,()=>{const a=R(3,9),al=R(55,72);const p=para(2*a,a,al);p.K=add(p.B,[a,0]);const P2=6*a;
 const pic=geo({P:p,poly:[Q4],seg:[['A','K']],tick:[['B','K',1],['K','C',1]],side:[['A','B',String(a)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD биссектриса угла A проходит через середину K стороны BC. AB = ${a}. Найди периметр параллелограмма.`,pic,ans:P2,
 hint:'Сначала найди BK: биссектриса отсекает равнобедренный треугольник.',short:`BK = AB = ${a}, BC = 2 · ${a} = ${2*a}, P = 2 · (${a} + ${2*a}) = ${P2}.`,
 explain:`Биссектриса AK отсекает равнобедренный треугольник ABK (∠BAK = ∠KAD = ∠BKA), поэтому BK = AB = ${a}.<br>K — середина BC, значит BC = 2 · BK = ${2*a}.<br>P = 2 · (${a} + ${2*a}) = <b>${P2}</b>.`,
 explain2:`Смотри на сторону BC: она состоит из двух равных половинок BK и KC. Первая половинка BK равна AB = ${a} (равнобедренный треугольник ABK). Значит, вся BC = ${a} + ${a} = ${2*a} — в два раза длиннее AB. Периметр: ${a} + ${2*a} + ${a} + ${2*a} = ${P2}.`};});
G(2,()=>{const T=['Две его стороны равны и параллельны','Противоположные стороны попарно равны','Диагонали точкой пересечения делятся пополам','Противоположные стороны попарно параллельны'];
 const F=[['Две стороны параллельны, а две другие равны','так выглядит равнобедренная трапеция — она не параллелограмм'],['Диагонали перпендикулярны','бывает «воздушный змей», у которого диагонали ⊥, но это не параллелограмм'],['Диагонали равны','у равнобедренной трапеции диагонали равны, а она не параллелограмм'],['Два противолежащих угла прямые','у «воздушного змея» с двумя прямыми углами противоположные стороны не параллельны'],['Две соседние стороны равны','так бывает у любого «воздушного змея»']];
 const t=pick(T),f=sample(F,3);const opts=shuffle([t,...f.map(x=>x[0])]);
 return {type:'choice',q:'Какое условие <b>гарантирует</b>, что четырёхугольник — параллелограмм?',opts,ans:opts.indexOf(t),
 short:`«${t}» — это ${t.includes('параллельны')&&!t.includes('равны')?'определение':'признак'} параллелограмма.`,
 explain:`Признаки параллелограмма: 1) две стороны <b>равны и параллельны</b>; 2) противоположные стороны попарно <b>равны</b>; 3) диагонали <b>делятся пополам</b>. (И ещё само определение: противоположные стороны попарно параллельны.)<br>Правильный вариант: «${t}».<br>Остальные не подходят:<br>${f.map(x=>`• «${x[0]}» — ${x[1]}.`).join('<br>')}`,
 explain2:`Для каждого неверного варианта можно нарисовать фигуру, которая условию удовлетворяет, но параллелограммом <b>не</b> является. Например, равнобедренная трапеция:${fig(geo({P:isoTrap(8,4,3),poly:[Q4],tick:[['A','B',1],['C','D',1]],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],W:220,maxH:120,pad:22}))}У неё две стороны параллельны, две другие равны, диагонали равны — а это не параллелограмм. Значит, такие условия ничего не гарантируют.`};});
G(2,()=>{for(;;){const x=R(20,60),y=R(20,60);if(x===y||x+y>120||x+y<50)continue;const AD=8,AB=AD*Math.sin(y*D2R)/Math.sin(x*D2R);if(AB<3.5||AB>9)continue;
 const p=para(AD,AB,x+y);const ask=pick(['B','BCA','ACD']);
 const ans=ask==='B'?180-x-y:ask==='BCA'?y:x;
 const angs=[['A','B','C',dg(x)],['A','C','D',dg(y),{r:34}]];if(ask==='B')angs.push(['B','A','C','?']);if(ask==='BCA')angs.push(['C','B','A','?',{r:30}]);if(ask==='ACD')angs.push(['C','A','D','?',{r:30}]);
 const pic=geo({P:p,poly:[Q4],seg:[['A','C']],ang:angs,maxH:200});const nm={B:'∠ABC',BCA:'∠BCA',ACD:'∠ACD'}[ask];
 return {type:'num',q:`В параллелограмме ABCD диагональ AC образует со сторонами углы ∠BAC = ${x}° и ∠CAD = ${y}°. Найди ${nm}.`,pic,ans,
 short:ask==='B'?`∠A = ${x+y}°, ∠B = 180° − ${x+y}° = ${ans}°.`:ask==='BCA'?`∠BCA = ∠CAD = ${y}° (накрест лежащие).`:`∠ACD = ∠BAC = ${x}° (накрест лежащие).`,
 explain:ask==='B'?`1) ∠A = ∠BAC + ∠CAD = ${x}° + ${y}° = ${x+y}°.<br>2) ∠B — соседний с ∠A, поэтому ∠B = 180° − ${x+y}° = <b>${ans}°</b>.`:ask==='BCA'?`BC ∥ AD, AC — секущая. Углы BCA и CAD — <b>накрест лежащие</b>, они равны: ∠BCA = ∠CAD = <b>${y}°</b>.`:`AB ∥ CD, AC — секущая. Углы ACD и BAC — <b>накрест лежащие</b>, они равны: ∠ACD = ∠BAC = <b>${x}°</b>.`,
 explain2:ask==='B'?`Посчитай углы в треугольнике ABC: ∠BAC = ${x}°, ∠BCA = ${y}° (он равен ∠CAD как накрест лежащий). Сумма углов треугольника 180°, поэтому ∠B = 180 − ${x} − ${y} = ${ans}°. Тот же ответ другим путём.`:`Ищи букву «Z»: ${ask==='BCA'?'BC, диагональ CA и AD':'AB, диагональ AC и CD'} рисуют зигзаг. В углах зигзага между параллельными прямыми углы одинаковые. Поэтому ответ ${ans}°.`};}});

/* ===== L3: trapezoid ===== */

 const pic=geo({P:t,poly:[Q4],ang:[['A','D','B',dg(al)],['D','C','A',dg(de)],[ask,nbr[ask][0],nbr[ask][1],'?']],maxH:190});
 return {type:'num',q:`В трапеции ABCD с основаниями AD и BC ∠A = ${al}°, ∠D = ${de}°. Найди ∠${ask}.`,pic,ans,

 return {type:'num',q:`ABCD — равнобедренная трапеция с основаниями AD и BC, ∠A = ${al}°. Найди ∠${ask}.`,pic,ans,

G(3,()=>{const a=R(8,20),b=R(3,a-2);if((a+b)%2&&Math.random()<0.7)return null;const m=(a+b)/2;const findM=Math.random()<0.55;

 const pic=geo({P:p,poly:[Q4],seg:[['M','N',{dash:true,col:'var(--accent)',sw:2}]],tick:[['A','M',1],['M','B',1],['C','N',2],['N','D',2]],side:[['B','C',findM?String(b):'?'],['A','D',String(a)],['M','N',findM?'?':N(m),{flip:true,col:'var(--accent-ink)'}]],maxH:200});

 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],tick:[['A','B',1],['C','D',1]],side:[['B','C',String(b)],['A','D',String(a),{gap:6}]],maxH:190});
 p.K=[p.C[0],0];const pic2=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}],['C','K',{dash:true}]],fill:[{pts:['A','B','H']},{pts:['K','C','D']}],rt:[['H','D','B'],['K','C','D']],side:[['B','C',String(b)],['H','K',String(b),{flip:true,col:'var(--accent-ink)'}],['A','H','?',{flip:true,col:'var(--accent-ink)'}],['K','D','?',{flip:true,col:'var(--accent-ink)'}]],lab:['A','B','C','D'],maxH:190});
 return {type:'num',q:`В равнобедренной трапеции ABCD основания AD = ${a} и BC = ${b}. Из вершины B проведена высота BH. Найди ${askAH?'AH':'HD'}.`,pic,ans,
 hint:'Проведи вторую высоту из C. Что получится посередине?',short:askAH?`AH = (${a} − ${b}) : 2 = ${ans}.`:`HD = ${a} − ${(a-b)/2} = ${ans} (это (a + b) : 2).`,

G(4,()=>{const x=R(20,70);if(x===45)return null;const askAOD=Math.random()<0.5;const AD=8,AB=AD*Math.tan(x*D2R);if(AB<3||AB>11)return null;const p=withO(para(AD,AB,90));
 const ans=askAOD?180-2*x:2*x;
 const pic=geo({P:p,poly:[Q4],seg:[['A','C'],['B','D']],rt:[['A','D','B']],ang:[['A','O','D',dg(x),{r:34}],askAOD?['O','D','A','?',{r:22}]:['O','A','B','?',{r:22}]],dots:['O'],dir:{O:askAOD?90:-90},maxH:200});
 return {type:'num',q:`В прямоугольнике ABCD диагонали пересекаются в точке O, ∠CAD = ${x}°. Найди ∠${askAOD?'AOD':'AOB'}.`,pic,ans,
 hint:'Треугольник AOD — какой он? Вспомни, что диагонали прямоугольника равны.',
 short:askAOD?`△AOD равнобедренный: ∠AOD = 180° − 2 · ${x}° = ${ans}°.`:`∠AOD = ${180-2*x}°, ∠AOB = 180° − ${180-2*x}° = ${ans}°.`,
 explain:`1) Диагонали прямоугольника равны и делятся пополам, поэтому AO = OD: △AOD <b>равнобедренный</b>.<br>2) Углы при основании равны: ∠ODA = ∠OAD = ${x}°.<br>3) ∠AOD = 180° − ${x}° − ${x}° = ${180-2*x}°.${askAOD?`<br>Ответ: <b>${ans}°</b>.`:`<br>4) ∠AOB и ∠AOD — смежные (вместе развёрнутый угол): ∠AOB = 180° − ${180-2*x}° = <b>${ans}°</b>.`}`,
 explain2:askAOD?`Представь равнобедренный треугольник AOD как «крышу домика»: два одинаковых ската по ${x}° у основания, а на вершину остаётся 180 − ${x} − ${x} = ${ans}°.`:`Короткий путь: ∠AOB — внешний угол треугольника AOD при вершине O. Внешний угол равен сумме двух других углов треугольника: ${x}° + ${x}° = ${ans}°.`};});
G(4,()=>{const al=pick([40,50,60,70,80,100,110,120,130,140]);const ask=pick(['BAC','ABD','AOB']);const p=withO(para(6,6,al));
 const ans=ask==='BAC'?al/2:ask==='ABD'?(180-al)/2:90;
 const angs=[['A','D','B',dg(al),{r:20}]];if(ask==='BAC')angs.push(['A','B','C','?',{r:46}]);if(ask==='ABD')angs.push(['B','A','D','?',{r:26}]);if(ask==='AOB')angs.push(['O','A','B','?',{r:16}]);
 const pic=geo({P:p,poly:[Q4],seg:[['A','C'],['B','D']],tick:[['A','B',1],['B','C',1],['C','D',1],['D','A',1]],ang:angs,dots:['O'],dir:{O:-90},maxH:200});
 const nm={BAC:'∠BAC',ABD:'∠ABD',AOB:'∠AOB'}[ask];
 return {type:'num',q:`ABCD — ромб, ∠A = ${al}°. Диагонали пересекаются в точке O. Найди ${nm}.`,pic,ans,
 short:ask==='BAC'?`Диагональ делит угол ромба пополам: ${al}° : 2 = ${N(ans)}°.`:ask==='ABD'?`∠B = ${180-al}°, диагональ BD делит его пополам: ${N(ans)}°.`:'Диагонали ромба перпендикулярны: 90°.',
 explain:ask==='BAC'?`Диагонали ромба <b>делят его углы пополам</b>. Диагональ AC делит ∠A: ∠BAC = ${al}° : 2 = <b>${N(ans)}°</b>.`:ask==='ABD'?`1) ∠B — соседний с ∠A: ∠B = 180° − ${al}° = ${180-al}°.<br>2) Диагональ BD делит ∠B пополам: ∠ABD = ${180-al}° : 2 = <b>${N(ans)}°</b>.`:`Диагонали ромба <b>перпендикулярны</b> — всегда, при любом угле. Поэтому ∠AOB = <b>90°</b>. Угол ${al}° здесь не нужен.`,
 explain2:ask==='AOB'?`Проверим углами: в треугольнике AOB ∠OAB = ${al/2}° (половина ∠A), ∠OBA = ${(180-al)/2}° (половина ∠B). Тогда ∠AOB = 180 − ${al/2} − ${(180-al)/2} = 90°. Половинки соседних углов всегда дают 90°.`:`Треугольник ABD — равнобедренный (AB = AD, это стороны ромба). ${ask==='ABD'?`Углы при основании BD равны: (180° − ${al}°) : 2 = ${N(ans)}°.`:`Диагональ AC в нём — ось симметрии, она делит ∠A на две одинаковые половинки по ${N(ans)}°.`}`};});
G(4,()=>{const x=pick([15,20,25,30,35,40,50,55,60,65,70,75]);const big=Math.max(2*x,180-2*x);const p=withO(para(6,6,2*x));
 const pic=geo({P:p,poly:[Q4],seg:[['A','C']],lab:Q4,tick:[['A','B',1],['B','C',1],['C','D',1],['D','A',1]],ang:[['A','B','C',dg(x),{r:x<35?40:28}]],maxH:200});
 return {type:'num',q:`Диагональ AC ромба ABCD образует со стороной AB угол ${x}°. Найди <b>больший</b> угол ромба.`,pic,ans:big,
 hint:'Диагональ ромба делит его угол пополам.',short:`∠A = 2 · ${x}° = ${2*x}°, другой угол ${180-2*x}°; больший ${big}°.`,
 explain:`1) Диагональ ромба делит его угол пополам, значит ∠A = 2 · ${x}° = ${2*x}°.<br>2) Соседний угол: 180° − ${2*x}° = ${180-2*x}°.<br>Больший угол ромба: <b>${big}°</b>.${2*x<90?`<div class="box err"><b>Ловушка</b>${2*x}° — это меньший (острый) угол. Спрашивали больший.</div>`:''}`,
 explain2:`Треугольник ABC равнобедренный (AB = BC — стороны ромба), поэтому ∠BCA = ∠BAC = ${x}°. Тогда ∠B = 180° − ${x}° − ${x}° = ${180-2*x}°. А ∠A = 180° − ∠B = ${2*x}°. Из двух углов ${2*x}° и ${180-2*x}° больший — ${big}°.`};});
G(4,()=>{const props=[['диагонали равны',['Прямоугольник','Квадрат','Равнобедренная трапеция']],['диагонали перпендикулярны',['Ромб','Квадрат']],['диагонали точкой пересечения делятся пополам',['Параллелограмм','Прямоугольник','Ромб','Квадрат']],['диагонали делят углы пополам',['Ромб','Квадрат']],['все углы равны',['Прямоугольник','Квадрат']]];
 const pr=pick(props);const figs=['Параллелограмм','Прямоугольник','Ромб','Квадрат','Равнобедренная трапеция'];const why={'Параллелограмм':'обычный «скошенный» параллелограмм','Прямоугольник':'прямоугольник','Ромб':'ромб','Квадрат':'квадрат','Равнобедренная трапеция':'равнобедренная трапеция'};
 return {type:'multi',q:`У каких фигур <b>всегда</b> ${pr[0]}? Выбери все.`,opts:figs,ans:figs.map((f,i)=>pr[1].includes(f)?i:-1).filter(i=>i>=0),
 short:`${pr[0][0].toUpperCase()+pr[0].slice(1)}: ${pr[1].join(', ').toLowerCase()}.`,
 explain:figs.map(f=>`• ${f} — ${pr[1].includes(f)?'<b>да</b>':'нет'}`).join('<br>')+`<div class="box tip"><b>Помни</b>Квадрат — это и ромб, и прямоугольник, поэтому у него все свойства обоих.</div>`,
 explain2:`Вспомни «характер» каждой фигуры: прямоугольник — про <b>равные</b> диагонали и прямые углы; ромб — про <b>перпендикулярные</b> диагонали, которые делят углы пополам; любой параллелограмм — диагонали делятся пополам; равнобедренная трапеция — диагонали равны, но пополам не делятся. Ищем «${pr[0]}» — подходят: ${pr[1].join(', ').toLowerCase()}.`};});

/* ===== L5: classification ===== */
G(5,()=>{const pool=[['Любой квадрат является ромбом',1,'у квадрата все стороны равны — значит, он ромб'],['Любой ромб является квадратом',0,'ромб с углом 60° — не квадрат: углы не прямые'],['Любой квадрат является прямоугольником',1,'у квадрата все углы прямые'],['Любой прямоугольник является квадратом',0,'прямоугольник 3 × 5 — не квадрат'],['Любой прямоугольник является параллелограммом',1,'противоположные стороны прямоугольника параллельны'],['Любой параллелограмм является прямоугольником',0,'у «скошенного» параллелограмма углы не прямые'],['Любой ромб является параллелограммом',1,'ромб — это параллелограмм с равными сторонами'],['Любая трапеция является параллелограммом',0,'у трапеции параллельна только одна пара сторон'],['Существует ромб, который является прямоугольником',1,'это квадрат'],['Существует параллелограмм, который является трапецией',0,'у трапеции две другие стороны не параллельны, а у параллелограмма — параллельны']];
 const s=pick(pool);
 return {type:'choice',q:`Верно ли утверждение: «${s[0]}»?`,opts:['Верно','Неверно'],ans:s[1]?0:1,short:`${s[1]?'Верно':'Неверно'}: ${s[2]}.`,
 explain:`${s[1]?'<b>Верно</b>':'<b>Неверно</b>'}: ${s[2]}.<br><br>Цепочка: квадрат → (это и ромб, и прямоугольник) → параллелограмм → четырёхугольник. Вверх по цепочке «является» — всегда верно, вниз — не всегда. Трапеция стоит отдельно.`,
 explain2:`Посмотри на диаграмму: если область одной фигуры целиком внутри области другой — «любой … является …» верно.${fig(classify('nonum'))}${s[1]?'Здесь так и есть.':'Здесь нет: есть фигуры, которые попадают в одну область, но не в другую.'}`};});
G(5,()=>{const items=[['Параллелограмм, у которого все углы прямые','Прямоугольник','это определение прямоугольника; квадратом он может и не быть (3 × 5)'],['Параллелограмм, у которого диагонали равны','Прямоугольник','это признак прямоугольника; стороны при этом могут быть разными'],['Параллелограмм, у которого все стороны равны','Ромб','это определение ромба; углы при этом могут быть не прямыми'],['Параллелограмм, у которого диагонали перпендикулярны','Ромб','это признак ромба'],['Прямоугольник, у которого соседние стороны равны','Квадрат','все углы прямые и все стороны равны'],['Ромб, у которого есть прямой угол','Квадрат','соседние углы ромба дают 180°, значит все углы прямые'],['Ромб, у которого диагонали равны','Квадрат','ромб с равными диагоналями — ещё и прямоугольник'],['Четырёхугольник, у которого ровно две стороны параллельны','Трапеция','это определение трапеции']];
 const it=pick(items);const opts=['Прямоугольник','Ромб','Квадрат','Трапеция'];
 return {type:'choice',q:`Как <b>точнее всего</b> назвать фигуру: «${it[0]}»?`,opts,ans:opts.indexOf(it[1]),short:`${it[1]}: ${it[2]}.`,
 explain:`Правильный ответ — <b>${it[1].toLowerCase()}</b>: ${it[2]}.${it[1]==='Квадрат'?'<br>Квадрат — тоже прямоугольник и тоже ромб, но «квадрат» — самое точное название.':it[1]==='Трапеция'?'':'<br>Квадрат подходит не всегда, поэтому «квадрат» — неверно: нельзя утверждать больше, чем дано.'}`,
 explain2:`Иди по «лесенке»: начни с того, что дано (${it[0].split(',')[0].toLowerCase()}), и добавь условие. Прямые углы → прямоугольник. Равные стороны → ромб. И то и другое → квадрат. ${it[1]==='Трапеция'?'А если параллельна только одна пара сторон — это вообще не параллелограмм, а трапеция.':`Здесь получается: ${it[1].toLowerCase()}.`}`};});
G(5,()=>{const items=[['квадрат со стороной 5',6,'он и ромб, и прямоугольник — лежит в общей части кругов'],['ромб с углом 60°',5,'он ромб, но не прямоугольник (углы не прямые)'],['прямоугольник со сторонами 3 и 7',4,'он прямоугольник, но не ромб (стороны разные)'],['параллелограмм со сторонами 4 и 6 и углом 50°',3,'он параллелограмм, но не ромб и не прямоугольник'],['трапеция с основаниями 3 и 8',2,'у неё только одна пара параллельных сторон'],['четырёхугольник, у которого нет параллельных сторон',1,'он не параллелограмм и не трапеция']];
 const it=pick(items);const opts=['1','2','3','4','5','6'];
 return {type:'choice',q:`В какую область диаграммы попадёт <b>${it[0]}</b>?`,pic:classify(),opts,ans:it[1]-1,ansText:'область '+it[1],short:`Область ${it[1]}: ${it[2]}.`,
 explain:`Правильно — область <b>${it[1]}</b>: ${it[2]}.<br>Расшифровка областей: 1 — «просто» четырёхугольники; 2 — трапеции; 3 — параллелограммы, которые не ромбы и не прямоугольники; 4 — прямоугольники, но не квадраты; 5 — ромбы, но не квадраты; 6 — квадраты.`,
 explain2:`Задавай вопросы по порядку: 1) Есть параллельные стороны? Одна пара — трапеция (2), ни одной — область 1. 2) Две пары — параллелограмм. Углы прямые? Стороны равны? Нет-нет → 3; только углы → 4; только стороны → 5; и то и другое → 6. Для «${it[0]}» получаем ${it[1]}.`};});
G(5,()=>{const kinds=[['параллелограммами',['Квадрат','Ромб','Прямоугольник','Параллелограмм']],['прямоугольниками',['Квадрат','Прямоугольник']],['ромбами',['Квадрат','Ромб']]];
 const k=pick(kinds);const opts=['Квадрат','Ромб','Прямоугольник','Трапеция','Параллелограмм'];
 return {type:'multi',q:`Какие фигуры <b>обязательно</b> являются ${k[0]}? Выбери все.`,opts,ans:opts.map((o,i)=>k[1].includes(o)?i:-1).filter(i=>i>=0),
 short:`Обязательно являются ${k[0]}: ${k[1].join(', ').toLowerCase()}.`,
 explain:opts.map(o=>`• ${o} — ${k[1].includes(o)?'<b>да</b>':'нет'}`).join('<br>')+`<br>${k[0]==='параллелограммами'?'Трапеция — нет: у неё параллельна только одна пара сторон.':k[0]==='прямоугольниками'?'Ромб — не обязательно (углы могут быть не прямыми), обычный параллелограмм — тоже.':'Прямоугольник — не обязательно (стороны могут быть разными), обычный параллелограмм — тоже.'}`,
 explain2:`На диаграмме Эйлера «обязательно является X» = «область целиком внутри X».${fig(classify('nonum'))}Внутри области «${({'параллелограммами':'параллелограммы','прямоугольниками':'прямоугольники','ромбами':'ромбы'})[k[0]]}» целиком лежат: ${k[1].join(', ').toLowerCase()}.`};});

/* ===== L6: symmetry, Thales ===== */
G(6,()=>{const k=pick(Object.keys(AX));const n=AX[k];
 return {type:'num',q:`Сколько осей симметрии у фигуры: <b>${AXname[k]}</b>?`,pic:(()=>{const s=symFig(k,200);return s.replace(/<line[^>]*stroke="var\(--accent\)"[^>]*\/>/g,'').replace(/<circle[^>]*\/>/g,'').replace(/<text[^>]*>O<\/text>/g,'');})(),ans:n,
 hint:'Ось симметрии — линия сгиба: сложи фигуру по ней, и половинки совпадут.',short:`${AXname[k][0].toUpperCase()+AXname[k].slice(1)}: ${n} ${plural(n,'ось','оси','осей')}.`,
 explain:`Ось симметрии — прямая, по которой фигуру можно сложить так, чтобы половинки совпали.${fig(symFig(k,200))}У фигуры «${AXname[k]}» — <b>${n}</b> ${plural(n,'ось','оси','осей')}.${k==='rect'?' Диагонали — не оси: при сгибе по диагонали углы не совпадут.':k==='rh'?' Оси ромба — его диагонали. Линии через середины сторон — не оси.':k==='par'?' У обычного параллелограмма нет ни одной оси, но есть центр симметрии.':''}`,
 explain2:`Вырежи такую фигуру из бумаги и попробуй сложить: ${k==='sq'?'пополам по вертикали, по горизонтали и по двум диагоналям — 4 способа.':k==='rect'?'пополам вдоль и поперёк — получается. А по диагонали — уголки торчат. 2 способа.':k==='rh'?'по каждой диагонали — получается (стороны-то равные). А пополам «поперёк» — нет. 2 способа.':k==='trap'?'только по вертикальной линии через середины оснований. 1 способ.':k==='par'?'как ни складывай, половинки «перекошены». 0 способов. Но если повернуть на 180°, фигура совпадёт сама с собой.':k==='hex'?'по трём диагоналям через противоположные вершины и по трём линиям через середины противоположных сторон — 6 способов.':'по каждой высоте — из вершины в середину противоположной стороны. 3 способа.'}`};});
G(6,()=>{const opts=shuffle(['Параллелограмм','Ромб','Прямоугольник','Квадрат','Равнобедренная трапеция','Равносторонний треугольник']);const good=['Параллелограмм','Ромб','Прямоугольник','Квадрат'];
 return {type:'multi',q:'У каких фигур есть <b>центр симметрии</b>? Выбери все.',opts,ans:opts.map((o,i)=>good.includes(o)?i:-1).filter(i=>i>=0),

 explain:`Центр симметрии — точка, при повороте вокруг которой на 180° фигура совпадает сама с собой.<br>У <b>любого параллелограмма</b> это точка пересечения диагоналей: диагонали делятся в ней пополам, поэтому каждая вершина переходит в противоположную. Ромб, прямоугольник и квадрат — тоже параллелограммы.<br>У равнобедренной трапеции и у треугольника центра симметрии <b>нет</b>.`,
 explain2:`Проверка «вверх ногами»: переверни фигуру (поверни на 180°). Параллелограмм выглядит так же. Трапеция — нет: большее основание окажется сверху. Треугольник — тоже нет: вершина окажется внизу.${fig(symFig('par',200))}`};});
G(6,()=>{const k=pick([3,4]);const b=R(2,6);const ask=pick(['far','mid']);const ans=ask==='far'?k*b:(k-1)*b;const lbl=ask==='far'?`OB${k}`:`B₁B${k}`;
 const pic=thalesFig(k,[['O','B1',String(b),{flip:false}]]);
 return {type:'num',q:`На одной стороне угла O отложены равные отрезки ${range(1,k).map(i=>(i===1?'OA₁':`A${'₀₁₂₃₄'[i-1]}A${'₀₁₂₃₄'[i]}`)).join(' = ')}. Через точки A₁…A${'₀₁₂₃₄'[k]} проведены параллельные прямые до пересечения с другой стороной в точках B₁…B${'₀₁₂₃₄'[k]}. OB₁ = ${b} см. Найди ${lbl.replace(/(\d)/g,m=>'₀₁₂₃₄'[+m])}.`,pic,ans,
 short:`По теореме Фалеса все отрезки на второй стороне по ${b} см: ${ask==='far'?k:k-1} · ${b} = ${ans} см.`,
 explain:`По <b>теореме Фалеса</b>: параллельные прямые, отсекающие равные отрезки на одной стороне угла, отсекают равные отрезки и на другой.<br>Значит, OB₁ = B₁B₂ = … = ${b} см.<br>${ask==='far'?`OB${'₀₁₂₃₄'[k]}`:`B₁B${'₀₁₂₃₄'[k]}`} состоит из ${ask==='far'?k:k-1} таких отрезков: ${ask==='far'?k:k-1} · ${b} = <b>${ans} см</b>.`,
 explain2:`Представь лестницу, приставленную к стене наискосок, и ступеньки, параллельные друг другу. Если вдоль пола расстояния между ступеньками равны, то и вдоль самой лестницы они равны. Здесь «ступенька» по второй стороне — ${b} см, а нам нужно ${ask==='far'?k:k-1} ${plural(ask==='far'?k:k-1,'ступенька','ступеньки','ступенек')}: ${ans} см.`};});

/* ===== L7: mixed ===== */
G(7,()=>{for(;;){const r=[R(1,7),R(1,7),R(1,7),R(1,7)];const k=r.reduce((a,b)=>a+b,0);if(360%k)continue;const u=360/k;const ang=r.map(x=>x*u);if(Math.max(...ang)>=180||new Set(r).size<3)continue;
 const big=Math.max(...ang);return {type:'num',q:`Углы выпуклого четырёхугольника относятся как ${r.join(' : ')}. Найди <b>больший</b> угол.`,ans:big,
 hint:'Сумма углов четырёхугольника — 360°. Сколько всего «частей»?',short:`${k} частей = 360°, часть = ${u}°, больший = ${Math.max(...r)} · ${u}° = ${big}°.`,
 explain:`Пусть одна часть — x. Углы: ${r.map(v=>v===1?'x':v+'x').join(', ')}.<br>Сумма углов четырёхугольника 360°: ${k}x = 360 → x = ${u}°.<br>Больший угол: ${Math.max(...r)} · ${u}° = <b>${big}°</b>.<br>Все углы: ${ang.join('°, ')}°. Проверка: ${ang.join(' + ')} = 360 ✅.`,
 explain2:`Это как разделить 360 конфет между четырьмя ребятами «по частям»: первый берёт ${r[0]}, второй ${r[1]}, третий ${r[2]}, четвёртый ${r[3]} части. Всего частей ${k}, одна часть = 360 : ${k} = ${u}. Больше всех у того, у кого ${Math.max(...r)} части: ${big}.`};}});

 const pic=geo({P:p,poly:[Q4],seg:[['A','C'],['B','D']],rt:[['A','D','B']],ang:[['O','A','B','60°',{r:20}]],side:[['A','C',String(d),{t:0.72,flip:true}],['A','B','?']],dots:['O'],dir:{O:-90},maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','C'],['B','D']],fill:[{pts:['A','B','O']}],tick:[['A','O',1],['B','O',1],['A','B',1]],side:[['A','O',String(c),{flip:true}],['A','B',String(c)]],dots:['O'],dir:{O:-90},maxH:190});
 return {type:'num',q:`Диагональ прямоугольника равна ${d}, а угол между диагоналями 60°. Найди <b>меньшую</b> сторону прямоугольника.`,pic,ans:c,
 hint:'Рассмотри треугольник, в котором есть этот угол 60° и меньшая сторона.',short:`△AOB равносторонний: AB = AO = ${d} : 2 = ${c}.`,
 explain:`1) Диагонали прямоугольника равны и делятся пополам: AO = BO = ${d} : 2 = ${c}.<br>2) В треугольнике AOB: AO = BO и ∠AOB = 60°. Углы при основании: (180° − 60°) : 2 = 60°.<br>3) Все углы по 60° — треугольник <b>равносторонний</b>: AB = AO = <b>${c}</b>.<br>Меньшая сторона лежит напротив меньшего угла между диагоналями (60°, а не 120°).`,
 explain2:`${fig(pic2)}Закрашенный треугольник — «кусочек пиццы», где две стороны — половинки диагоналей (по ${c}), а угол между ними 60°. Такой треугольник всегда равносторонний, поэтому третья сторона тоже ${c}.`};});
G(7,()=>{for(;;){const b=R(3,9),a=R(b+2,3*b-2);const hh=b*b-((a-b)/2)**2;if(hh<4)continue;const p=isoTrap(a,b,Math.sqrt(hh));const P2=a+3*b;
 const pic=geo({P:p,poly:[Q4],seg:[['A','C']],ang:[['A','B','C','',{n:1,r:30}],['A','C','D','',{n:1,r:26}]],tick:[['A','B',1],['C','D',1]],side:[['B','C',String(b)],['A','D',String(a),{gap:6}]],maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','C']],fill:[{pts:['A','B','C']}],ang:[['A','B','C','',{n:1,r:30}],['A','C','D','',{n:1,r:26}],['C','B','A','',{n:1,r:26}]],tick:[['A','B',1],['B','C',1],['C','D',1]],side:[['B','C',String(b)],['A','B',String(b),{col:'var(--accent-ink)'}]],maxH:190});
 return {type:'num',q:`В равнобедренной трапеции ABCD (AD ∥ BC) диагональ AC — биссектриса угла A. BC = ${b}, AD = ${a}. Найди периметр трапеции.`,pic,ans:P2,
 hint:'Сравни углы BAC и BCA. Что это значит для треугольника ABC?',short:`△ABC равнобедренный: AB = BC = ${b}; P = ${a} + 3 · ${b} = ${P2}.`,
 explain:`1) ∠BAC = ∠CAD (AC — биссектриса).<br>2) ∠BCA = ∠CAD (накрест лежащие при BC ∥ AD).<br>3) Значит, ∠BAC = ∠BCA и △ABC равнобедренный: AB = BC = ${b}.<br>4) Трапеция равнобедренная: CD = AB = ${b}.<br>5) P = ${a} + ${b} + ${b} + ${b} = <b>${P2}</b>.`,
 explain2:`Это та же идея, что с биссектрисой в параллелограмме: биссектриса + параллельные прямые = равнобедренный треугольник.${fig(pic2)}В закрашенном треугольнике два угла равны, поэтому боковая сторона равна меньшему основанию. Получается, три стороны по ${b} и одна ${a}.`};}});

 const pic=geo({P:p,poly:[Q4],seg:[['B','D']],lab:Q4,tick:[['A','B',1],['B','C',1],['C','D',1],['D','A',1]],ang:obt?[['B','A','C','120°']]:[['A','D','B','60°']],side:[['B','D',String(d),{t:0.38,flip:true}]],maxH:190});

 return {type:'num',q:`${obt?'Тупой':'Острый'} угол ромба равен ${obt?120:60}°, меньшая диагональ равна ${d}. Найди периметр ромба.`,pic,ans:4*d,
 hint:'Меньшая диагональ режет ромб на два треугольника. Какие у них углы?',short:`Меньшая диагональ режет ромб на два равносторонних треугольника: сторона ${d}, P = ${4*d}.`,

 explain2:`${fig(pic2)}Ромб с углом 60° — это два равносторонних треугольника, сложенных вместе. У них все стороны одинаковые, и общая сторона — как раз меньшая диагональ ${d}. Значит, и сторона ромба ${d}, а периметр 4 · ${d} = ${4*d}.`};});

/* ===== L8: ★ ===== */
G(8,()=>{const n=pick([5,6,7,8,10,12]);
 return {type:'num',q:`Какое <b>наибольшее</b> число острых углов может быть у выпуклого ${NGg[n]}?`,ans:3,
 hint:'Посмотри на внешние углы. Чему равна их сумма? Каким будет внешний угол при остром внутреннем?',short:'Не больше 3: у острого угла внешний больше 90°, а сумма внешних — 360°.',
 explain:`1) В каждой вершине внешний угол = 180° − внутренний. Если внутренний угол острый (< 90°), то внешний <b>больше 90°</b>.<br>2) Сумма внешних углов выпуклого многоугольника (по одному в каждой вершине) равна 360°.<br>3) Если бы острых углов было 4, то четыре внешних угла дали бы больше 4 · 90° = 360° — а все внешние вместе только 360°. Противоречие.<br>4) Три острых угла возможны: возьми остроугольный треугольник и замени одну его сторону ломаной, чуть-чуть выгнутой наружу (с ${n-3} новыми ${plural(n-3,'вершиной','вершинами','вершинами')}). Углы треугольника останутся острыми, а новые углы будут почти по 180°.<br>Ответ: <b>3</b>.`,
 explain2:`Посчитаем через сумму углов. У ${NGg[n]} она (${n} − 2) · 180° = ${(n-2)*180}°. Пусть острых углов k, каждый < 90°, а остальные ${n} − k углов < 180°. Тогда сумма < 90k + 180(${n} − k) = ${180*n} − 90k. Должно быть ${(n-2)*180} < ${180*n} − 90k, то есть 90k < 360, k < 4. Значит, k ≤ 3.`};},true);
G(8,()=>{const a=R(3,9),al=R(55,75);const p=para(2*a,a,al);p.K=add(p.B,[a,0]);
 const pic=geo({P:p,poly:[Q4],seg:[['A','K'],['D','K']],side:[['A','B',String(a)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}],['D','A','K','',{n:2,r:22}],['D','K','C','',{n:2,r:26}]],maxH:180});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','K'],['D','K']],fill:[{pts:['A','B','K']},{pts:['K','C','D'],op:0.2}],tick:[['A','B',1],['B','K',1],['K','C',1],['C','D',1]],maxH:180});
 return {type:'num',q:`Биссектрисы углов A и D параллелограмма ABCD пересекаются в точке K, лежащей на стороне BC. AB = ${a}. Найди периметр параллелограмма.`,pic,ans:6*a,
 hint:'Каждая биссектриса отсекает свой равнобедренный треугольник.',short:`BK = AB = ${a}, KC = CD = ${a}; BC = ${2*a}; P = 2 · (${a} + ${2*a}) = ${6*a}.`,
 explain:`1) Биссектриса AK отсекает равнобедренный △ABK: BK = AB = ${a}.<br>2) Биссектриса DK отсекает равнобедренный △DCK (∠CDK = ∠KDA = ∠CKD): KC = CD = ${a}.<br>3) BC = BK + KC = ${a} + ${a} = ${2*a}.<br>4) P = 2 · (${a} + ${2*a}) = <b>${6*a}</b>.`,
 explain2:`${fig(pic2)}Отметь равные отрезки: AB = BK и KC = CD, а AB = CD (стороны параллелограмма). Значит, все четыре отмеченных отрезка равны ${a}. Длинная сторона BC = два таких отрезка, короткая — один. Получается, стороны ${a} и ${2*a}, а периметр ${6*a}. Интересно: длинная сторона всегда ровно вдвое длиннее короткой!`};},true);
G(8,()=>{const a=R(3,7),b=2*a+R(2,6),al=R(55,72);const p=para(b,a,al);p.K=add(p.B,[a,0]);p.M=sub(p.C,[a,0]);const ans=b-2*a;
 const pic=geo({P:p,poly:[Q4],seg:[['A','K'],['D','M']],side:[['A','B',String(a)],['A','D',String(b)],['K','M','?',{flip:true,gap:3}]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}],['D','A','M','',{n:2,r:22}],['D','M','C','',{n:2,r:26}]],maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','K'],['D','M']],fill:[{pts:['A','B','K']},{pts:['M','C','D']}],side:[['B','K',String(a),{col:'var(--accent-ink)'}],['M','C',String(a),{col:'var(--accent-ink)'}],['A','D',String(b)]],tick:[['A','B',1],['B','K',1],['M','C',1],['C','D',1]],maxH:190});
 return {type:'num',q:`В параллелограмме ABCD AB = ${a}, AD = ${b}. Биссектрисы углов A и D пересекают сторону BC в точках K и M. Найди KM.`,pic,ans,
 hint:'Найди BK и CM. Помни: BC = AD.',short:`BK = ${a}, CM = ${a}; KM = ${b} − ${a} − ${a} = ${ans}.`,
 explain:`1) Биссектриса угла A отсекает равнобедренный △ABK: BK = AB = ${a}.<br>2) Биссектриса угла D отсекает равнобедренный △DCM: CM = CD = AB = ${a}.<br>3) BC = AD = ${b}. Отрезки BK и CM «заходят» с двух концов и не перекрываются (${a} + ${a} < ${b}).<br>4) KM = BC − BK − CM = ${b} − ${a} − ${a} = <b>${ans}</b>.`,
 explain2:`${fig(pic2)}Представь отрезок BC = ${b} как полку. Слева ставим коробку длиной ${a} (BK), справа такую же (MC). Между ними остаётся промежуток ${b} − ${2*a} = ${ans}. Это и есть KM.`};},true);
G(8,()=>{for(;;){const d1=R(6,16),d2=R(6,16);const t=0.35+Math.random()*0.3,u=0.35+Math.random()*0.3,phi=R(55,80);
 const A=[0,0],C=[d1,0],Pp=[d1*t,0],B=polar(Pp,d2*u,-(180-phi)),Dd=polar(Pp,d2*(1-u),phi);
 // make B below? we want convex ABCD: A, B, C, D around
 const pts={A,B:Dd,C,D:B};const K=mid(pts.A,pts.B),L=mid(pts.B,pts.C),M=mid(pts.C,pts.D),Nn=mid(pts.D,pts.A);
 const Pv=len(sub(K,L))+len(sub(L,M))+len(sub(M,Nn))+len(sub(Nn,K));if(Math.abs(Pv-(d1+d2))>1e-6)continue;
 const P={...pts,K,L,M,N:Nn};const ans=d1+d2;
 const pic=geo({P,poly:[Q4,['K','L','M','N']],fill:[{pts:['K','L','M','N'],op:0.3}],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],tick:[['A','K',1],['K','B',1],['B','L',2],['L','C',2],['C','M',3],['M','D',3]],maxH:210});
 const pic2=geo({P,poly:[Q4,['K','L','M','N']],seg:[['A','C',{dash:true,col:'var(--accent)'}]],fill:[{pts:['A','B','C'],op:0.2}],side:[['K','L',N(d1/2),{flip:true,col:'var(--accent-ink)'}],['A','C',String(d1),{t:0.3}]],lab:['A','B','C','D','K','L'],maxH:210});
 return {type:'num',q:`Диагонали выпуклого четырёхугольника ABCD равны ${d1} и ${d2}. Середины его сторон K, L, M, N последовательно соединили. Найди периметр четырёхугольника KLMN.`,pic,ans,
 hint:'Отрезок KL соединяет середины двух сторон треугольника ABC. Чему он равен?',short:`Каждая сторона KLMN — половина диагонали: 2 · ${N(d1/2)} + 2 · ${N(d2/2)} = ${ans}.`,
 explain:`1) KL соединяет середины сторон AB и BC треугольника ABC — это его <b>средняя линия</b>: KL ∥ AC и KL = AC : 2 = ${N(d1/2)}.<br>2) Так же MN — средняя линия △ACD: MN = ${N(d1/2)}.<br>3) LM и NK — средние линии △BCD и △ABD: по BD : 2 = ${N(d2/2)}.<br>4) P = ${N(d1/2)} + ${N(d2/2)} + ${N(d1/2)} + ${N(d2/2)} = ${d1} + ${d2} = <b>${ans}</b>.<br>(Заодно KLMN — параллелограмм: это теорема Вариньона.)`,
 explain2:`${fig(pic2)}Посмотри только на закрашенный треугольник ABC: K и L — середины его сторон, а KL — «срезанная верхушка», ровно вдвое короче основания AC. Две стороны KLMN «смотрят» на диагональ AC и вместе равны ей (${d1}), две другие — на BD (${d2}). Форма четырёхугольника неважна — ответ всегда сумма диагоналей.`};}},true);

 const pic=geo({P:p,poly:[Q4],seg:[['A','C']],rt:[['C','A','D']],tick:[['A','B',1],['B','C',1],['C','D',1]],side:[['A','D',String(a),{gap:6}]],maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','C']],rt:[['C','A','D']],fill:[{pts:['A','C','D']}],ang:[['A','B','C','',{n:1,r:34}],['A','C','D','',{n:1,r:30}],['C','B','A','',{n:1,r:26}],['D','C','A','60°',{r:22}]],maxH:190});
 return {type:'num',q:`В равнобедренной трапеции ABCD меньшее основание BC равно боковой стороне, а диагональ AC перпендикулярна боковой стороне CD. Большее основание AD = ${a}. Найди периметр трапеции.`,pic,ans:P2,
 hint:'Обозначь ∠CAD = x и выпиши все углы через x. Сначала найди углы трапеции.',short:`∠A = 60°, CD = AD : 2 = ${c}; P = ${a} + 3 · ${c} = ${P2}.`,

 explain2:`${fig(pic2)}Три стороны трапеции равны, углы при большем основании — 60°. Такая трапеция — это половинка правильного шестиугольника! Её можно разрезать на три одинаковых равносторонних треугольника со стороной ${c}, а большее основание — две их стороны: ${c} + ${c} = ${a} ✅. Периметр: ${a} + 3 · ${c} = ${P2}.`};},true);

 const pic=geo({P:p,poly:[Q4],seg:[['A','K'],['K','D']],tick:[['B','K',1],['K','C',1]],ang:[['A','D','B',dg(al),{r:20}],['K','A','D','?',{r:18}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD ∠A = ${al}°. Биссектриса угла A пересекает сторону BC в её середине K. Найди ∠AKD.`,pic,ans:90,
 hint:'Сначала докажи, что KC = CD. Что тогда можно сказать про отрезок DK?',short:'∠AKD = 90° — при любом ∠A.',
 explain:`1) △ABK равнобедренный (биссектриса): BK = AB.<br>2) K — середина BC: KC = BK = AB = CD. Значит, △KCD тоже равнобедренный.<br>3) ∠BKA = ${al/2}° (равен ∠BAK = ${al}° : 2).<br>4) ∠C = ∠A = ${al}°, в △KCD: ∠CKD = (180° − ${al}°) : 2 = ${(180-al)/2}°.<br>5) Углы при точке K на прямой BC: ∠AKD = 180° − ${al/2}° − ${(180-al)/2}° = <b>90°</b>.`,
 explain2:`Короче: из шага 2 DK — тоже биссектриса (угла D). А биссектрисы <b>соседних</b> углов параллелограмма всегда перпендикулярны: ∠KAD + ∠KDA = ${al}° : 2 + ${180-al}° : 2 = 90°, значит, в △AKD на ∠AKD остаётся 180° − 90° = 90°. Угол ${al}° на ответ не влияет — это ловушка.`};},true);
G(8,()=>{const ask=pick(['A','B','C','D']);const a=R(3,7),c=R(2,6);const p=para(a+c,a,120);p.K=add(p.B,[a,0]);const ans=(ask==='A'||ask==='C')?120:60;
 const pic=geo({P:p,poly:[Q4],seg:[['A','K']],tick:[['A','B',1],['A','K',1]],ang:[['A','K','D','',{n:1,r:24}],['A','B','K','',{n:1,r:20}],[ask,nbr[ask][0],nbr[ask][1],'?',{r:16}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD биссектриса угла A пересекает сторону BC в точке K, причём AK = AB. Найди ∠${ask}.`,pic,ans,
 hint:'Сколько равных сторон у треугольника ABK?',short:`△ABK равносторонний → ∠B = 60°, ∠A = 120°; ∠${ask} = ${ans}°.`,
 explain:`1) Биссектриса отсекает равнобедренный △ABK: BK = AB.<br>2) По условию AK = AB. Значит, AB = BK = AK — △ABK <b>равносторонний</b>, все его углы по 60°.<br>3) ∠B = ∠ABK = 60°, ∠BAK = 60° → ∠A = 2 · 60° = 120°.<br>4) ∠C = ∠A = 120°, ∠D = ∠B = 60°. Ответ: ∠${ask} = <b>${ans}°</b>.`,
 explain2:`Проверим другим путём: ∠BAK — половина ∠A. В равностороннем треугольнике он 60°, значит ∠A = 120°. Соседний ∠B = 180° − 120° = 60° — и это совпадает с углом равностороннего треугольника ✅. Противоположные углы равны: A и C по 120°, B и D по 60°.`};},true);

 const x=(a-b)*R(25,75)/100,hh=a*R(35,50)/100;const p={A:[0,0],B:[x,hh],C:[x+b,hh],D:[a,0]};p.M=mid(p.A,p.B);p.N=mid(p.C,p.D);p.P=inter(p.A,p.C,p.M,p.N);
 const pic=geo({P:p,poly:[Q4],seg:[['A','C'],['M','N',{dash:true,col:'var(--accent)',sw:2}]],side:[['M','P',String(lo),{col:'var(--accent-ink)'}],['P','N',String(hi),{col:'var(--accent-ink)'}]],dots:['P'],dir:{P:-60},tick:[['A','M',1],['M','B',1],['C','N',2],['N','D',2]],maxH:200});
 return {type:'num',q:`Диагональ AC трапеции ABCD делит её среднюю линию MN на отрезки MP = ${lo} и PN = ${hi}. Найди большее основание AD.`,pic,ans:a,
 hint:'MP — средняя линия какого треугольника? А PN?',short:`PN — средняя линия △ACD: AD = 2 · ${hi} = ${a}.`,
 explain:`1) MN ∥ AD, M — середина AB. По теореме Фалеса P — середина AC.<br>2) MP соединяет середины сторон AB и AC треугольника ABC → это его средняя линия: BC = 2 · ${lo} = ${b}.<br>3) PN соединяет середины сторон AC и CD треугольника ACD → средняя линия: AD = 2 · ${hi} = <b>${a}</b>.<br>Проверка: средняя линия трапеции ${lo} + ${hi} = ${lo+hi} = (${a} + ${b}) : 2 ✅.`,
 explain2:`Диагональ AC режет трапецию на два треугольника: верхний ABC (с основанием BC) и нижний ACD (с основанием AD). Средняя линия трапеции тоже режется на два куска — и каждый кусок равен половине «своего» основания. Более длинный кусок ${hi} — от большого основания: AD = ${hi} · 2 = ${a}.`};},true);
