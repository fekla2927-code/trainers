<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Четырёхугольники — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box.ex{background:transparent;border:1px dashed var(--line)}
.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}

.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}
.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.understand label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}
.prof-l{display:flex;align-items:center;gap:4px;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px}
.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

/* ---------- state ---------- */
let T=null,LS_KEY='';
const store={get(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}},clear(){try{localStorage.removeItem(LS_KEY);}catch(e){}}};
let S=null;
const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- layout ---------- */

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':return H.num(t.ans);
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});
  if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),50);
  if(S&&S.cur){const back=document.getElementById('backToTask');if(!back){const b=document.createElement('button');b.id='backToTask';b.className='btn';b.textContent='← Вернуться к задаче';b.style.cssText='position:sticky;bottom:16px;margin:8px auto;display:flex';b.onclick=()=>{show('train');b.remove();};$('#v-theory').appendChild(b);}}
}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;
    const full=S.queue.length===T.gens.length;
    const ruleIdx=T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0);
    const rulesOnly=ruleIdx.length&&S.queue.length===ruleIdx.length&&S.queue.every(i=>T.gens[i].rule);
    let sr=0,sw=0;T.levels.forEach((_,i)=>{if(T.gens.some(g=>g.lvl===i&&g.star)){sr+=S.per[i].r;sw+=S.per[i].w;}});
    const star=sr+sw?Math.round(sr/(sr+sw)*100):null;

/* ---------- shape builders ---------- */
function para(a,b,al){const A=[0,0],D=[a,0],B=polar(A,b,al),C=add(B,D);return {A,B,C,D};}
function trap(a,b,al,de){const ca=Math.cos(al*D2R)/Math.sin(al*D2R),cd=Math.cos(de*D2R)/Math.sin(de*D2R);const h=(a-b)/(ca+cd);return {A:[0,0],B:[h*ca,h],C:[a-h*cd,h],D:[a,0],h};}
function isoTrap(a,b,h){return {A:[0,0],B:[(a-b)/2,h],C:[(a+b)/2,h],D:[a,0]};}
function withO(p){return Object.assign({},p,{O:inter(p.A,p.C,p.B,p.D)});}
const Q4=['A','B','C','D'];
/* convex quadrilateral with given angles (A bottom-left, B top-left, C top-right, D bottom-right) */
function quadFromAngles(a,b,c,d){
  for(let k=0;k<400;k++){const L1=10,L4=L1*(0.5+Math.random()*0.5);
    const h1=0,h2=180-d,h3=h2+180-c,h4=h3+180-b;const u=x=>[Math.cos(x*D2R),Math.sin(x*D2R)];
    const u1=u(h1),u2=u(h2),u3=u(h3),u4=u(h4);const rhs=mul(add(mul(u1,L1),mul(u4,L4)),-1);
    const det=u2[0]*u3[1]-u2[1]*u3[0];if(Math.abs(det)<1e-6)continue;
    const L2=(rhs[0]*u3[1]-rhs[1]*u3[0])/det,L3=(u2[0]*rhs[1]-u2[1]*rhs[0])/det;
    const Ls=[L1,L2,L3,L4];if(Math.min(...Ls)<0.45*L1||Math.max(...Ls)>1.3*L1)continue;
    const A=[0,0],D=[L1,0],C=add(D,mul(u2,L2)),B=add(C,mul(u3,L3));return {A,B,C,D};}
  return null;}

1) <b>Противоположные стороны равны:</b> AB = CD, BC = AD (на рисунке одинаковые чёрточки).<br>
2) <b>Противоположные углы равны:</b> ∠A = ∠C, ∠B = ∠D (одинаковые дужки).<br>
3) <b>Сумма соседних углов равна 180°:</b> ∠A + ∠B = 180°. Это односторонние углы при параллельных прямых.<br>
4) <b>Диагонали точкой пересечения делятся пополам:</b> AO = OC, BO = OD.</div>
<div class="box ex"><b>Пример</b>∠A = 65°. Тогда ∠C = 65° (напротив), а ∠B = ∠D = 180° − 65° = 115°. Проверка: 65 + 115 + 65 + 115 = 360 ✅.</div>
<div class="box ex"><b>Периметр</b>Стороны 7 и 4. Сторон всего четыре: 7, 4, 7, 4. <span class="m">P = 2 · (7 + 4) = 22</span>. А если известен периметр, то <b>одна сторона + соседняя = P : 2</b>.</div>
<div class="box tip"><b>Как запомнить</b>У параллелограмма всё «парами»: пара равных сторон, пара равных углов, острый + тупой = 180°.</div>`},
{title:'Диагонали, биссектриса и признаки параллелограмма',lvl:2,html:`
<h3>Диагонали</h3>
<p>Точка O, где пересекаются диагонали, — <b>середина</b> каждой из них. Если AC = 12, то AO = OC = 6. Если BO = 5, то BD = 10. Сами диагонали обычно <b>разные</b> по длине.</p>
<h3>Биссектриса отсекает равнобедренный треугольник</h3>
<div class="fig">${figBis}</div>
<p>Проведём биссектрису угла A до стороны BC (точка K). Углы KAD и BKA — <b>накрест лежащие</b> при параллельных BC и AD, они равны. А ∠BAK = ∠KAD (биссектриса). Значит, в треугольнике ABK два угла равны — он <b>равнобедренный</b>: <span class="m">BK = AB</span>.</p>
<div class="box ex"><b>Пример</b>AB = 5, биссектриса угла A делит BC на BK и KC = 4. Тогда BK = AB = 5, BC = 5 + 4 = 9, периметр = 2 · (5 + 9) = 28.</div>
<h3>Признаки — как узнать, что перед нами параллелограмм</h3>
<div class="box rule"><b>Четырёхугольник — параллелограмм, если:</b>
1) две его стороны <b>равны и параллельны</b>; или<br>
2) противоположные стороны <b>попарно равны</b>; или<br>
3) диагонали точкой пересечения <b>делятся пополам</b>.</div>
<div class="box err"><b>Ловушка</b>«Две стороны параллельны, а две другие равны» — это <b>не</b> признак! Так выглядит равнобедренная трапеция. В первом признаке равны и параллельны должны быть <b>одни и те же</b> две стороны.</div>`},
{title:'Трапеция',lvl:3,html:`
<p><b>Трапеция</b> — четырёхугольник, у которого две стороны параллельны, а две другие — нет. Параллельные стороны — <b>основания</b> (AD и BC), непараллельные — <b>боковые стороны</b> (AB и CD).</p>
<div class="figrow">
<div class="fig">${figTrap3[0]}<div class="cap"><b>Обычная</b></div></div>
<div class="fig">${figTrap3[1]}<div class="cap"><b>Равнобедренная</b><br>боковые стороны равны</div></div>
<div class="fig">${figTrap3[2]}<div class="cap"><b>Прямоугольная</b><br>боковая сторона ⊥ основаниям</div></div></div>
<div class="box rule"><b>Углы трапеции</b>
1) Углы <b>при боковой стороне</b> в сумме дают 180°: ∠A + ∠B = 180°, ∠C + ∠D = 180° (односторонние при BC ∥ AD).<br>
2) В <b>равнобедренной</b> трапеции углы при каждом основании равны: ∠A = ∠D, ∠B = ∠C. И диагонали равны: AC = BD.</div>
<div class="box ex"><b>Пример</b>Равнобедренная трапеция, ∠A = 70°. Тогда ∠D = 70°, ∠B = ∠C = 180° − 70° = 110°.</div>
<h3>Высота в равнобедренной трапеции</h3>
<p>Опустим высоту BH на большее основание. Если основания a и b, то <span class="m">AH = (a − b) : 2</span>: «лишняя» часть большего основания делится поровну между двумя краями.</p>
<h3>Средняя линия</h3>
<div class="fig">${figMid}</div>
<p><b>Средняя линия</b> соединяет середины боковых сторон. Она параллельна основаниям и равна их <b>среднему арифметическому</b>: <span class="m">m = (a + b) : 2</span>. Основания 10 и 4 → средняя линия 7.</p>`},
{title:'Прямоугольник',lvl:4,html:`
<p><b>Прямоугольник</b> — параллелограмм, у которого <b>все углы прямые</b>. Он умеет всё, что умеет параллелограмм, и ещё одно:</p>
<div class="fig">${figRect}</div>
<div class="box rule"><b>Особое свойство</b>Диагонали прямоугольника <b>равны</b>: AC = BD. А раз они ещё и делятся пополам, то AO = BO = CO = DO.</div>
<p>Поэтому треугольники AOB, BOC, COD, DOA — <b>равнобедренные</b>. Это главный ключ к задачам про углы в прямоугольнике.</p>
<div class="box ex"><b>Пример</b>∠CAD = 30°. Треугольник AOD равнобедренный (AO = OD), значит ∠ODA = 30°, а ∠AOD = 180° − 30° − 30° = 120°.</div>
<div class="box tip"><b>Признак прямоугольника</b>Если в параллелограмме диагонали равны — это прямоугольник.</div>`},
{title:'Ромб и квадрат',lvl:4,html:`
<p><b>Ромб</b> — параллелограмм, у которого <b>все стороны равны</b>.</p>
<div class="fig">${figRh}</div>
<div class="box rule"><b>Особое свойство ромба</b>Диагонали ромба <b>перпендикулярны</b> (AC ⊥ BD) и <b>делят его углы пополам</b>.</div>
<div class="box ex"><b>Пример</b>∠A = 60°. Диагональ AC делит его пополам: ∠BAC = 30°. А ∠AOB = 90° всегда.</div>
<p><b>Квадрат</b> — прямоугольник, у которого все стороны равны. Он одновременно и прямоугольник, и ромб, поэтому у него <b>все</b> свойства сразу: диагонали равны, перпендикулярны, делятся пополам и делят углы пополам — по 45°.</p>
<div class="fig">${figSq}</div>`},
{title:'Кто кем является: классификация',lvl:5,html:`
<p>Четырёхугольники — как семья. Каждый следующий — «частный случай» предыдущего: у него все свойства «родителя» и ещё свои.</p>
<div class="fig">${classify('nonum')}</div>
<div class="box rule"><b>Читаем картинку</b>
• Каждый <b>квадрат</b> — это и ромб, и прямоугольник (он в серединке, где круги пересекаются).<br>
• Каждый ромб и каждый прямоугольник — <b>параллелограмм</b>.<br>
• Но не каждый ромб — квадрат (ромб с углом 60° не квадрат), и не каждый прямоугольник — квадрат (3 × 5).<br>
• <b>Трапеция</b> — отдельно: у неё только одна пара параллельных сторон, это <b>не</b> параллелограмм.</div>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr style="font-size:13px;color:var(--muted)"><th style="border-bottom:1px solid var(--line);padding:6px 4px">Свойство</th><th style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">Парал.</th><th style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">Прям.</th><th style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">Ромб</th><th style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">Квадр.</th></tr></thead><tbody><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Диагонали делятся пополам</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Диагонали равны</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Диагонали перпендикулярны</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Диагонали делят углы пополам</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Все углы прямые</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr><tr><td style="border-bottom:1px solid var(--line);padding:6px 4px">Все стороны равны</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">—</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td><td style="border-bottom:1px solid var(--line);padding:6px 4px;text-align:center">✅</td></tr></tbody></table></div>
<div class="box tip"><b>Как запомнить</b>Прямоугольник — «про углы и равные диагонали». Ромб — «про стороны и перпендикулярные диагонали». Квадрат — «всё сразу».</div>`},
{title:'Симметрия четырёхугольников',lvl:6,html:`
<p><b>Ось симметрии</b> — прямая, по которой фигуру можно сложить, как листок, и половинки совпадут.</p>
<div class="figrow">
<div class="fig">${symFig('sq')}<div class="cap"><b>Квадрат</b> — 4 оси</div></div>
<div class="fig">${symFig('rect')}<div class="cap"><b>Прямоугольник</b> — 2 оси</div></div>
<div class="fig">${symFig('rh')}<div class="cap"><b>Ромб</b> — 2 оси (диагонали)</div></div>
<div class="fig">${symFig('trap')}<div class="cap"><b>Равнобедр. трапеция</b> — 1 ось</div></div></div>
<div class="box err"><b>Ловушка</b>У прямоугольника диагонали — <b>не</b> оси симметрии (сложи листок по диагонали — углы не совпадут). А у ромба оси — как раз диагонали.</div>
<p><b>Центр симметрии</b> — точка, вокруг которой фигуру можно повернуть на 180°, и она совпадёт сама с собой. У <b>любого параллелограмма</b> (а значит, и у прямоугольника, ромба, квадрата) центр симметрии — точка пересечения диагоналей.</p>
<div class="fig">${symFig('par',200)}</div>
<p class="small" style="text-align:center">У обычного параллелограмма осей нет, но есть центр O. У трапеции центра симметрии нет.</p>`},
{title:'Теорема Фалеса',lvl:6,html:`
<p>Если на одной стороне угла отложить <b>равные отрезки</b> и через их концы провести <b>параллельные прямые</b>, то на другой стороне они тоже отсекут <b>равные</b> отрезки.</p>
<div class="fig">${thalesFig(3)}</div>
<div class="box ex"><b>Пример</b>OA₁ = A₁A₂ = A₂A₃, прямые A₁B₁ ∥ A₂B₂ ∥ A₃B₃. Если OB₁ = 2 см, то и B₁B₂ = B₂B₃ = 2 см, а OB₃ = 6 см.</div>
<div class="box tip"><b>Зачем это нужно</b>Так делят отрезок на любое число равных частей без линейки с делениями. И отсюда же следует: прямая через середину боковой стороны трапеции параллельно основаниям попадает в середину другой боковой стороны.</div>`},
{title:'Как решать задачи',lvl:7,html:`
<ol class="steps">
<li><b>Нарисуй и подпиши</b> всё, что дано: равные стороны — чёрточками, равные углы — дужками.</li>
<li><b>Определи фигуру</b> и вспомни её свойства (таблица в разделе «Классификация»).</li>
<li><b>Ищи равнобедренные треугольники</b> — их дают диагонали прямоугольника, биссектрисы в параллелограмме, диагонали ромба.</li>
<li><b>Отношение углов</b> 1 : 2 : 3 : 4 — это «части». Сумма углов 360°, частей 10, одна часть 36°.</li>
<li><b>Проверь ответ:</b> сумма углов 360°? стороны положительные? угол меньше 180°?</li></ol>
<div class="box ex"><b>Классика</b>В прямоугольнике угол между диагоналями 60°. Тогда треугольник AOB равнобедренный с углом 60° при вершине — значит, <b>равносторонний</b>, и меньшая сторона равна половине диагонали.</div>`},
{title:'Идеи для задач со звёздочкой',lvl:8,html:`
<div class="box rule"><b>1. Биссектрисы соседних углов параллелограмма перпендикулярны</b>∠A + ∠B = 180°, половинки дают 90°, значит третий угол треугольника — тоже 90°.</div>
<div class="box rule"><b>2. Средняя линия треугольника</b>Отрезок, соединяющий середины двух сторон треугольника, параллелен третьей стороне и равен её <b>половине</b>. (Это будет в учебнике чуть позже, но пользоваться можно уже сейчас.)</div>
<div class="box rule"><b>3. Теорема Вариньона</b>Середины сторон <b>любого</b> четырёхугольника — вершины параллелограмма. Его стороны равны половинам диагоналей, поэтому его периметр = <b>сумма диагоналей</b> исходного четырёхугольника.</div>
<div class="box rule"><b>4. Острых углов у выпуклого многоугольника — не больше трёх</b>Внешний угол при остром угле больше 90°, а сумма внешних углов — 360°. Четыре угла по «больше 90°» уже дают больше 360°.</div>
<div class="box tip"><b>Совет</b>В «звёздочках» почти всегда работает один и тот же приём: найти равнобедренный треугольник, а потом посчитать углы.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>Сумма углов выпуклого n-угольника: (n − 2) · 180°. Четырёхугольник — 360°.</li>
<li>Параллелограмм: противоположные стороны и углы равны, соседние углы — 180°, диагонали делятся пополам.</li>
<li>Биссектриса угла параллелограмма отсекает равнобедренный треугольник.</li>
<li>Трапеция: углы при боковой стороне — 180°; средняя линия (a + b) : 2.</li>
<li>Прямоугольник: диагонали равны. Ромб: диагонали ⊥ и делят углы пополам. Квадрат: всё сразу.</li>
<li>Квадрат — это и ромб, и прямоугольник. Трапеция — не параллелограмм.</li></ul>`}
];

/* ---------- symbols ---------- */
const NW=t=>`<span style="white-space:nowrap;font-size:17px">${t}</span>`;
const symbols={tab:'Формулы',title:'Знаки и формулы темы',rows:[

['360°','Сумма углов четырёхугольника','Любого выпуклого: параллелограмма, трапеции, «кривого» четырёхугольника.','70° + 110° + 70° + 110° = 360°'],
['∠A','«Угол A»','Угол при вершине A.','∠A = 60°'],
[NW('∠ABC'),'«Угол ABC»','Угол с вершиной в <b>средней</b> букве (здесь B), стороны идут к A и к C.','∠BAC — угол при A между AB и AC'],

[NW('P = 2(a + b)'),'Периметр параллелограмма','Сумма всех четырёх сторон: a, b, a, b.','2 · (7 + 4) = 22'],
[NW('AO = OC'),'Диагонали делятся пополам','O — середина каждой диагонали параллелограмма.','AC = 12 → AO = 6'],
[NW('m = (a + b) : 2'),'Средняя линия трапеции','Отрезок между серединами боковых сторон — среднее арифметическое оснований.','(10 + 4) : 2 = 7'],
[NW('△ABC'),'«Треугольник ABC»','Треугольник с вершинами A, B, C.','△ABK — равнобедренный']
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Четырёхугольник — 360°. Соседние углы параллелограмма — 180°. Биссектриса в параллелограмме → равнобедренный треугольник.</div>`};

const fig=s=>`<div class="fig">${s}</div>`;
const opp={A:'C',B:'D',C:'A',D:'B'};
const nbr={A:['B','D'],B:['A','C'],C:['B','D'],D:['A','C']};

/* ===== L0: polygons ===== */
G(0,()=>{const n=R(5,12);const s=(n-2)*180;
return {type:'num',q:`Найди сумму углов выпуклого ${NGg[n]} (у него ${n} ${plural(n,'вершина','вершины','вершин')}).`,ans:s,
hint:'Разрежь многоугольник диагоналями из одной вершины на треугольники. Сколько их получится?',
short:`(${n} − 2) · 180° = ${n-2} · 180° = ${s}°.`,
explain:`Сумма углов выпуклого n-угольника: <span class="m">(n − 2) · 180°</span>.<br>Здесь n = ${n}: (${n} − 2) · 180° = ${n-2} · 180° = <b>${s}°</b>.<div class="box err"><b>Почему не ${n} · 180° = ${n*180}°</b>Из одной вершины диагонали режут ${NG[n]} не на ${n}, а на ${n-2} ${plural(n-2,'треугольник','треугольника','треугольников')}: две стороны, соседние с этой вершиной, новых треугольников не дают.</div>`,
explain2:`Посмотри на картинку: из вершины A проводим все диагонали.${n<=8?fig(triangFig(n)):''}Получается ${n-2} ${plural(n-2,'треугольник','треугольника','треугольников')}, и углы этих треугольников вместе как раз составляют все углы ${NGg[n]}. В каждом треугольнике 180°, поэтому всего ${n-2} · 180° = ${s}°.<br>Проверь на знакомом: у четырёхугольника 2 треугольника → 360° ✅.`};});
G(0,()=>{const n=pick([5,6,8,9,10,12]);const s=(n-2)*180,a=s/n;
return {type:'num',q:`Найди угол <b>правильного</b> ${NGg[n]} (все стороны и все углы равны).`,ans:a,
hint:'Сначала найди сумму всех углов, потом раздели поровну.',
short:`Сумма ${s}°, делим на ${n}: ${a}°.`,
explain:`1) Сумма углов: (${n} − 2) · 180° = ${s}°.<br>2) У правильного многоугольника все ${n} углов одинаковые, поэтому каждый: ${s}° : ${n} = <b>${a}°</b>.`,
explain2:`Другой способ — через внешние углы. Обходя многоугольник, в каждой вершине ты поворачиваешь на внешний угол, а всего поворачиваешься на полный круг 360°. Значит, каждый внешний угол = 360° : ${n} = ${360/n}°. А внутренний = 180° − ${360/n}° = ${a}°. Тот же ответ!`};});
G(0,()=>{for(;;){const ang=[R(60,135),R(60,135),R(60,135)];const four=360-ang[0]-ang[1]-ang[2];if(four<60||four>135)continue;
 const vals={A:four,B:ang[0],C:ang[1],D:ang[2]};const who=pick(Q4);const order=[who,...Q4.filter(x=>x!==who)];
 const p=quadFromAngles(vals.A,vals.B,vals.C,vals.D);if(!p)continue;
 const angs=Q4.map(k=>[k,nbr[k][0],nbr[k][1],k===who?'?':dg(vals[k])]);
 const pic=geo({P:p,poly:[Q4],ang:angs,maxH:200});const known=Q4.filter(k=>k!==who);const sum=known.reduce((s,k)=>s+vals[k],0);
 return {type:'num',q:`В выпуклом четырёхугольнике ABCD ${known.map(k=>`∠${k} = ${vals[k]}°`).join(', ')}. Найди ∠${who}.`,pic,ans:vals[who],
 hint:'Чему равна сумма углов любого выпуклого четырёхугольника?',
 short:`360° − ${sum}° = ${vals[who]}°.`,
 explain:`Сумма углов выпуклого четырёхугольника равна <b>360°</b> (это (4 − 2) · 180°).<br>Сумма известных углов: ${known.map(k=>vals[k]).join(' + ')} = ${sum}°.<br>∠${who} = 360° − ${sum}° = <b>${vals[who]}°</b>.`,
 explain2:`Проведи диагональ — четырёхугольник разрежется на два треугольника.${fig(geo({P:p,poly:[Q4],seg:[['A','C',{dash:true}]],fill:[{pts:['A','B','C'],op:0.25}],maxH:170}))}В каждом треугольнике 180°, вместе 180° + 180° = 360°. Остаётся «добрать» до 360°: 360 − ${sum} = ${vals[who]}.`};}});
G(0,()=>{const cv=Math.random()<0.5;const C=['convex5','convex6','convex4'],NC=['dart','house','ell','star'];
 const right=cv?pick(C):pick(NC);const others=cv?sample(NC,3):sample(C,3);const ks=shuffle([right,...others]);
 return {type:'choice',pics:true,q:cv?'Какой из многоугольников <b>выпуклый</b>?':'Какой из многоугольников <b>невыпуклый</b>?',opts:ks.map(shapeSvg),ans:ks.indexOf(right),ansText:cv?'тот, у которого нет «вмятин»':'тот, у которого есть «вмятина» (угол больше 180°)',
 short:cv?'У выпуклого нет вмятин: все углы меньше 180°.':'У невыпуклого есть вмятина — угол больше 180°.',
 explain:`Многоугольник <b>выпуклый</b>, если он лежит по одну сторону от прямой, проведённой через любую его сторону. На практике: у него <b>нет вмятин</b>, все углы меньше 180°.<br>${cv?'У трёх фигур есть вмятина — угол «внутрь», больше 180°. Только у одной её нет.':'У трёх фигур вмятин нет, а у одной есть вершина, которая «вдавлена» внутрь, — угол там больше 180°. Она и невыпуклая.'}`,
 explain2:`Проверка «резинкой»: представь, что в вершинах вбиты гвоздики и вокруг натянули резинку. У выпуклой фигуры резинка ляжет ровно по всем сторонам. У невыпуклой резинка «перепрыгнет» вмятину, и одна вершина останется внутри.`};});

/* ===== L1: parallelogram angles & sides ===== */
G(1,()=>{const al=Math.random()<0.6?R(40,80):R(100,140);const ask=pick(['B','C','D']);const p=para(R(7,9),R(4,5),al);
 const ans=ask==='C'?al:180-al;
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B',dg(al)],[ask,nbr[ask][0],nbr[ask][1],'?']],maxH:190});
 return {type:'num',q:`ABCD — параллелограмм, ∠A = ${al}°. Найди ∠${ask}.`,pic,ans,
 short:ask==='C'?`∠C противоположен ∠A, поэтому ∠C = ${al}°.`:`∠${ask} — соседний с ∠A: 180° − ${al}° = ${ans}°.`,
 explain:ask==='C'?`∠A и ∠C — <b>противоположные</b> углы параллелограмма (стоят напротив друг друга). Противоположные углы параллелограмма равны: ∠C = ∠A = <b>${al}°</b>.`:`∠A и ∠${ask} — <b>соседние</b> углы (прилежат к одной стороне A${ask}). Их сумма 180°: ∠${ask} = 180° − ${al}° = <b>${ans}°</b>.<div class="box err"><b>Ошибка</b>Ответ ${al}° был бы верен для угла C — он напротив A. А ∠${ask} — рядом.</div>`,
 explain2:ask==='C'?`Поверни параллелограмм на 180° вокруг точки пересечения диагоналей — он совпадёт сам с собой, и вершина A окажется на месте C. Значит, углы A и C одинаковые: ${al}°.`:`Стороны AD и BC параллельны, а A${ask} их пересекает. Углы A и ${ask} — односторонние, вместе они «выпрямляются» в 180°. ${al<90?'Острый':'Тупой'} ${al}° + ${al<90?'тупой':'острый'} ${ans}° = 180°. Посмотри: на картинке ∠${ask} ${ans>90?'тупой':'острый'} — это сходится с ответом.`};});
G(1,()=>{const d=pick([20,30,40,50,60,70,80,100]);const x=(180-d)/2,y=x+d;const p=para(8,4.5,x);
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','x'],['B','A','C','x + '+d+'°']],maxH:180});
 return {type:'num',q:`Один угол параллелограмма на ${d}° больше другого. Найди <b>больший</b> угол.`,pic,ans:y,
 hint:'«Один угол больше другого» — значит, они разные, то есть соседние. Сумма соседних углов 180°.',
 short:`x + (x + ${d}) = 180 → x = ${x}, больший ${y}°.`,
 explain:`Равные углы не могут отличаться на ${d}°, значит, речь о <b>соседних</b> углах. Их сумма 180°.<br>Пусть меньший x, больший x + ${d}:<br>x + x + ${d} = 180 → 2x = ${180-d} → x = ${x}.<br>Больший угол: ${x} + ${d} = <b>${y}°</b>. Проверка: ${x} + ${y} = 180 ✅.`,
 explain2:`Представь: два брата вместе весят 180 кг, старший тяжелее на ${d} кг. Убери «лишние» ${d} кг у старшего — станет поровну: (180 − ${d}) : 2 = ${x} кг каждому. Вернём старшему ${d}: ${x} + ${d} = ${y}. С углами — то же самое.`};});
G(1,()=>{const k=pick([2,3,4,5,8]);const x=180/(k+1),y=k*x;const p=para(8,4.5,x);
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','x'],['B','A','C',k+'x']],maxH:180});
 return {type:'num',q:`Один из углов параллелограмма в ${k} раза больше другого. Найди <b>больший</b> угол.`,pic,ans:y,
 hint:'Разные углы параллелограмма — соседние, в сумме 180°.',short:`x + ${k}x = 180 → x = ${x}, больший ${y}°.`,
 explain:`Разные углы параллелограмма — соседние, их сумма 180°.<br>x + ${k}x = 180 → ${k+1}x = 180 → x = ${x}°.<br>Больший: ${k} · ${x} = <b>${y}°</b>.`,
 explain2:`Думай «частями»: меньший угол — 1 часть, больший — ${k} частей. Вместе ${k+1} ${plural(k+1,'часть','части','частей')} = 180°. Одна часть = 180 : ${k+1} = ${x}°. Больший = ${k} части = ${y}°.`};});
G(1,()=>{const a=R(4,15),b=R(3,14);if(a===b)return null;const P2=2*(a+b);const p=para(Math.max(a,b),Math.min(a,b),R(55,70));const big=a>b;
 const pic=geo({P:p,poly:[Q4],side:[['A','D',big?String(a):'?'],['A','B',big?'?':String(a)]],ang:[['A','D','B','']],maxH:180});
 return {type:'num',q:`Периметр параллелограмма ABCD равен ${P2} см, сторона ${big?'AD':'AB'} = ${a} см. Найди сторону ${big?'AB':'AD'}.`,pic,ans:b,
 hint:'Периметр — это две «соседние» стороны, взятые дважды.',short:`${P2} : 2 = ${a+b}; ${a+b} − ${a} = ${b} см.`,
 explain:`Противоположные стороны параллелограмма равны, поэтому P = 2 · (AB + AD).<br>Половина периметра: ${P2} : 2 = ${a+b} — это AB + AD.<br>Значит, ${big?'AB':'AD'} = ${a+b} − ${a} = <b>${b} см</b>.<div class="box err"><b>Частая ошибка</b>${P2} − ${a} = ${P2-a} — так вычли только одну сторону, а сторон ${a} в периметре две.</div>`,
 explain2:`Пройди вокруг забора: ${a} + ? + ${a} + ? = ${P2}. Две стороны по ${a} — это ${2*a}. На две оставшиеся приходится ${P2} − ${2*a} = ${2*b}, на одну — ${2*b} : 2 = ${b}.`};});
G(1,()=>{for(;;){const x=R(35,80);if(x===45)continue;const lt=Math.random()<0.5;const each=lt?x:180-x;const S=2*each;const other=180-each;const big=Math.max(each,other);
 const p=para(8,4.5,lt?x:180-x);return {type:'num',q:`Сумма двух углов параллелограмма равна ${S}°. Найди <b>больший</b> угол параллелограмма.`,ans:big,
 hint:'Могут ли эти два угла быть соседними? Сумма соседних — ровно 180°.',short:`Это противоположные углы по ${each}°; соседний ${other}°; больший ${big}°.`,
 explain:`Соседние углы дают в сумме ровно 180°, а у нас ${S}° — значит, это <b>противоположные</b> углы. Они равны: ${S} : 2 = ${each}°.<br>Два других угла: 180° − ${each}° = ${other}°.<br>Больший угол: <b>${big}°</b>.`,
 explain2:`Выпиши все четыре угла параллелограмма: это α, β, α, β, где α + β = 180°. Какие два из них могут дать ${S}? α + β = 180 — не подходит. Значит, ${S} = α + α, α = ${each}. Тогда β = ${other}. Углы: ${each}°, ${other}°, ${each}°, ${other}°.${fig(geo({P:p,poly:[Q4],ang:[['A','D','B',dg(each)],['C','B','D',dg(each)],['B','A','C',dg(other)]],maxH:160}))}`};}});
G(1,()=>{const T=[['Противоположные стороны равны','так по свойству параллелограмма'],['Противоположные углы равны','так по свойству параллелограмма'],['Диагонали точкой пересечения делятся пополам','так по свойству параллелограмма'],['Сумма соседних углов равна 180°','это односторонние углы при параллельных прямых']];
 const F=[['Диагонали равны','это верно только для прямоугольника'],['Диагонали перпендикулярны','это верно только для ромба'],['Все стороны равны','это ромб, а не любой параллелограмм'],['Диагонали делят углы пополам','это верно только для ромба'],['Все углы равны','это прямоугольник']];
 const t=sample(T,R(2,3)),f=sample(F,5-t.length);const opts=shuffle([...t.map(x=>({s:x,ok:1})),...f.map(x=>({s:x,ok:0}))]);
 return {type:'multi',q:'Какие утверждения верны для <b>любого</b> параллелограмма? Выбери все.',opts:opts.map(o=>o.s[0]),ans:opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0),
 short:'Свойства любого параллелограмма — только про «пары» и «пополам».',
 explain:opts.map(o=>`• «${o.s[0]}» — ${o.ok?'<b>верно</b>':'<b>неверно</b>'}: ${o.s[1]}.`).join('<br>'),
 explain2:`Проверка «контрпримером»: нарисуй сильно скошенный параллелограмм со сторонами 8 и 3. ${fig(geo({P:withO(para(8,3,45)),poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],lab:Q4,maxH:130}))}Видно, что диагонали у него разные и не перпендикулярны, стороны разные. Значит, эти свойства — не для любого параллелограмма. А «пары» и «пополам» выполняются всегда.`};});

/* ===== L2: diagonals, bisector, signs ===== */
G(2,()=>{for(;;){const p=R(3,9),q=R(3,9),c=R(4,12);if(p+q<=c+1||p+c<=q+1||q+c<=p+1)continue;
 const A=[0,0],O=[p,0];const x=(c*c-q*q+p*p)/(2*p);if(c*c-x*x<=0)continue;let B=[x,Math.sqrt(c*c-x*x)];const C=[2*p,0],D=sub(mul(O,2),B);
 let pts={A,B,C,D,O};const ang=Math.atan2(D[1],D[0]);const rot=v=>[v[0]*Math.cos(-ang)-v[1]*Math.sin(-ang),v[0]*Math.sin(-ang)+v[1]*Math.cos(-ang)];
 for(const k in pts)pts[k]=rot(pts[k]);if(pts.B[1]<0)for(const k in pts)pts[k]=[pts[k][0],-pts[k][1]];
 const aA=angAt(pts.A,pts.B,pts.D);if(aA<45||aA>135)continue;const ad=len(pts.D);if(ad/c>2.6||c/ad>2.6)continue;
 const ans=c+p+q;
 const pic=geo({P:pts,poly:[Q4],seg:[['A','C'],['B','D']],fill:[{pts:['A','B','O']}],side:[['A','B',String(c)]],dots:['O'],dir:{O:-90},maxH:200});
 return {type:'num',q:`Диагонали параллелограмма ABCD пересекаются в точке O. AC = ${2*p}, BD = ${2*q}, AB = ${c}. Найди периметр треугольника AOB.`,pic,ans,
 hint:'Какую часть диагонали составляют AO и BO?',short:`AO = ${p}, BO = ${q}; P = ${c} + ${p} + ${q} = ${ans}.`,
 explain:`Диагонали параллелограмма точкой пересечения <b>делятся пополам</b>:<br>AO = ${2*p} : 2 = ${p}, BO = ${2*q} : 2 = ${q}.<br>P(AOB) = AB + AO + BO = ${c} + ${p} + ${q} = <b>${ans}</b>.<div class="box err"><b>Ошибка</b>${c} + ${2*p} + ${2*q} = ${c+2*p+2*q} — так взяли целые диагонали, а у треугольника AOB стороны — только их <b>половинки</b>.</div>`,
 explain2:`Посмотри на закрашенный треугольник: его стороны — AB и два «кусочка» диагоналей от вершины до точки O. Точка O стоит ровно посередине каждой диагонали, как центр качелей. Поэтому AO — половина AC (${p}), BO — половина BD (${q}). Складываем: ${c} + ${p} + ${q} = ${ans}.`};}});
G(2,()=>{const a=R(3,9),c=R(2,8),al=R(52,72);const p=para(a+c,a,al);p.K=add(p.B,[a,0]);const P2=2*(2*a+c);
 const pic=geo({P:p,poly:[Q4],seg:[['A','K']],side:[['A','B',String(a)],['K','C',String(c)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}]],maxH:180});
 const pic2=geo({P:p,poly:[Q4],seg:[['A','K']],fill:[{pts:['A','B','K']}],tick:[['A','B',1],['B','K',1]],side:[['A','B',String(a)],['B','K',String(a),{col:'var(--accent-ink)'}],['K','C',String(c)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}],['K','B','A','',{n:1,r:22}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD биссектриса угла A пересекает сторону BC в точке K. AB = ${a}, KC = ${c}. Найди периметр параллелограмма.`,pic,ans:P2,
 hint:'Биссектриса отсекает от параллелограмма равнобедренный треугольник. Какой?',short:`BK = AB = ${a}, BC = ${a+c}, P = 2 · (${a} + ${a+c}) = ${P2}.`,
 explain:`1) ∠BAK = ∠KAD — AK биссектриса.<br>2) ∠BKA = ∠KAD — накрест лежащие при BC ∥ AD и секущей AK.<br>3) Значит, ∠BAK = ∠BKA, и треугольник ABK <b>равнобедренный</b>: BK = AB = ${a}.<br>4) BC = BK + KC = ${a} + ${c} = ${a+c}.<br>5) P = 2 · (AB + BC) = 2 · (${a} + ${a+c}) = <b>${P2}</b>.`,
 explain2:`Отметим равные углы дужками:${fig(pic2)}Линии AK, BC и AD образуют букву «Z» — у неё углы на «изгибах» равны. Поэтому в закрашенном треугольнике ABK два угла одинаковые, а напротив равных углов — равные стороны: BK = AB = ${a}. Дальше просто: BC = ${a} + ${c} = ${a+c}, периметр = ${a} + ${a+c} + ${a} + ${a+c} = ${P2}.`};});
G(2,()=>{const a=R(3,9),al=R(55,72);const p=para(2*a,a,al);p.K=add(p.B,[a,0]);const P2=6*a;
 const pic=geo({P:p,poly:[Q4],seg:[['A','K']],tick:[['B','K',1],['K','C',1]],side:[['A','B',String(a)]],ang:[['A','B','K','',{n:1,r:24}],['A','K','D','',{n:1,r:28}]],maxH:180});
 return {type:'num',q:`В параллелограмме ABCD биссектриса угла A проходит через середину K стороны BC. AB = ${a}. Найди периметр параллелограмма.`,pic,ans:P2,
 hint:'Сначала найди BK: биссектриса отсекает равнобедренный треугольник.',short:`BK = AB = ${a}, BC = 2 · ${a} = ${2*a}, P = 2 · (${a} + ${2*a}) = ${P2}.`,
 explain:`Биссектриса AK отсекает равнобедренный треугольник ABK (∠BAK = ∠KAD = ∠BKA), поэтому BK = AB = ${a}.<br>K — середина BC, значит BC = 2 · BK = ${2*a}.<br>P = 2 · (${a} + ${2*a}) = <b>${P2}</b>.`,
 explain2:`Смотри на сторону BC: она состоит из двух равных половинок BK и KC. Первая половинка BK равна AB = ${a} (равнобедренный треугольник ABK). Значит, вся BC = ${a} + ${a} = ${2*a} — в два раза длиннее AB. Периметр: ${a} + ${2*a} + ${a} + ${2*a} = ${P2}.`};});
G(2,()=>{const T=['Две его стороны равны и параллельны','Противоположные стороны попарно равны','Диагонали точкой пересечения делятся пополам','Противоположные стороны попарно параллельны'];
 const F=[['Две стороны параллельны, а две другие равны','так выглядит равнобедренная трапеция — она не параллелограмм'],['Диагонали перпендикулярны','бывает «воздушный змей», у которого диагонали ⊥, но это не параллелограмм'],['Диагонали равны','у равнобедренной трапеции диагонали равны, а она не параллелограмм'],['Два противолежащих угла прямые','у «воздушного змея» с двумя прямыми углами противоположные стороны не параллельны'],['Две соседние стороны равны','так бывает у любого «воздушного змея»']];
 const t=pick(T),f=sample(F,3);const opts=shuffle([t,...f.map(x=>x[0])]);
 return {type:'choice',q:'Какое условие <b>гарантирует</b>, что четырёхугольник — параллелограмм?',opts,ans:opts.indexOf(t),
 short:`«${t}» — это ${t.includes('параллельны')&&!t.includes('равны')?'определение':'признак'} параллелограмма.`,
 explain:`Признаки параллелограмма: 1) две стороны <b>равны и параллельны</b>; 2) противоположные стороны попарно <b>равны</b>; 3) диагонали <b>делятся пополам</b>. (И ещё само определение: противоположные стороны попарно параллельны.)<br>Правильный вариант: «${t}».<br>Остальные не подходят:<br>${f.map(x=>`• «${x[0]}» — ${x[1]}.`).join('<br>')}`,
 explain2:`Для каждого неверного варианта можно нарисовать фигуру, которая условию удовлетворяет, но параллелограммом <b>не</b> является. Например, равнобедренная трапеция:${fig(geo({P:isoTrap(8,4,3),poly:[Q4],tick:[['A','B',1],['C','D',1]],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],W:220,maxH:120,pad:22}))}У неё две стороны параллельны, две другие равны, диагонали равны — а это не параллелограмм. Значит, такие условия ничего не гарантируют.`};});
G(2,()=>{for(;;){const x=R(20,60),y=R(20,60);if(x===y||x+y>120||x+y<50)continue;const AD=8,AB=AD*Math.sin(y*D2R)/Math.sin(x*D2R);if(AB<3.5||AB>9)continue;
 const p=para(AD,AB,x+y);const ask=pick(['B','BCA','ACD']);
 const ans=ask==='B'?180-x-y:ask==='BCA'?y:x;
 const angs=[['A','B','C',dg(x)],['A','C','D',dg(y),{r:34}]];if(ask==='B')angs.push(['B','A','C','?']);if(ask==='BCA')angs.push(['C','B','A','?',{r:30}]);if(ask==='ACD')angs.push(['C','A','D','?',{r:30}]);
 const pic=geo({P:p,poly:[Q4],seg:[['A','C']],ang:angs,maxH:200});const nm={B:'∠ABC',BCA:'∠BCA',ACD:'∠ACD'}[ask];
 return {type:'num',q:`В параллелограмме ABCD диагональ AC образует со сторонами углы ∠BAC = ${x}° и ∠CAD = ${y}°. Найди ${nm}.`,pic,ans,
 short:ask==='B'?`∠A = ${x+y}°, ∠B = 180° − ${x+y}° = ${ans}°.`:ask==='BCA'?`∠BCA = ∠CAD = ${y}° (накрест лежащие).`:`∠ACD = ∠BAC = ${x}° (накрест лежащие).`,
 explain:ask==='B'?`1) ∠A = ∠BAC + ∠CAD = ${x}° + ${y}° = ${x+y}°.<br>2) ∠B — соседний с ∠A, поэтому ∠B = 180° − ${x+y}° = <b>${ans}°</b>.`:ask==='BCA'?`BC ∥ AD, AC — секущая. Углы BCA и CAD — <b>накрест лежащие</b>, они равны: ∠BCA = ∠CAD = <b>${y}°</b>.`:`AB ∥ CD, AC — секущая. Углы ACD и BAC — <b>накрест лежащие</b>, они равны: ∠ACD = ∠BAC = <b>${x}°</b>.`,
 explain2:ask==='B'?`Посчитай углы в треугольнике ABC: ∠BAC = ${x}°, ∠BCA = ${y}° (он равен ∠CAD как накрест лежащий). Сумма углов треугольника 180°, поэтому ∠B = 180 − ${x} − ${y} = ${ans}°. Тот же ответ другим путём.`:`Ищи букву «Z»: ${ask==='BCA'?'BC, диагональ CA и AD':'AB, диагональ AC и CD'} рисуют зигзаг. В углах зигзага между параллельными прямыми углы одинаковые. Поэтому ответ ${ans}°.`};}});

/* ===== L3: trapezoid ===== */
G(3,()=>{for(;;){const al=R(45,80),de=R(45,80);const b=R(3,6);const t=trap(10,b,al,de);if(t.h<3||t.h>7)continue;const ask=pick(['B','C']);const ans=ask==='B'?180-al:180-de;
 const pic=geo({P:t,poly:[Q4],ang:[['A','D','B',dg(al)],['D','C','A',dg(de)],[ask,nbr[ask][0],nbr[ask][1],'?']],maxH:190});
 return {type:'num',q:`В трапеции ABCD с основаниями AD и BC ∠A = ${al}°, ∠D = ${de}°. Найди ∠${ask}.`,pic,ans,
 hint:'Какие углы трапеции в сумме дают 180°?',short:`∠${ask} и ∠${ask==='B'?'A':'D'} — углы при боковой стороне: 180° − ${ask==='B'?al:de}° = ${ans}°.`,
 explain:`Углы, прилежащие к одной <b>боковой стороне</b> трапеции, в сумме дают 180° (односторонние при BC ∥ AD).<br>∠${ask} прилежит к боковой стороне ${ask==='B'?'AB':'CD'} вместе с ∠${ask==='B'?'A':'D'}.<br>∠${ask} = 180° − ${ask==='B'?al:de}° = <b>${ans}°</b>.<div class="box err"><b>Ловушка</b>Угол ${ask==='B'?de:al}° здесь ни при чём: трапеция не равнобедренная, и противоположные углы у неё не связаны.</div>`,
 explain2:`Основания — как два параллельных рельса, а боковая сторона ${ask==='B'?'AB':'CD'} — шпала наискосок. Сколько «отклонилась» шпала от одного рельса внизу (${ask==='B'?al:de}°), столько «добавится» до 180° наверху: 180 − ${ask==='B'?al:de} = ${ans}.`};}});
G(3,()=>{const al=R(48,80);const t=isoTrap(10,R(3,5),0);const h=((10-(t.C[0]-t.B[0]))/2)*Math.tan(al*D2R);const p=isoTrap(10,t.C[0]-t.B[0],h);if(h>8)return null;
 const ask=pick(['B','C','D']);const ans=ask==='D'?al:180-al;
 const pic=geo({P:p,poly:[Q4],tick:[['A','B',1],['C','D',1]],ang:[['A','D','B',dg(al)],[ask,nbr[ask][0],nbr[ask][1],'?']],maxH:190});
 return {type:'num',q:`ABCD — равнобедренная трапеция с основаниями AD и BC, ∠A = ${al}°. Найди ∠${ask}.`,pic,ans,
 short:ask==='D'?`В равнобедренной трапеции углы при основании равны: ∠D = ∠A = ${al}°.`:`∠${ask} = 180° − ${al}° = ${ans}°.`,
 explain:ask==='D'?`В <b>равнобедренной</b> трапеции углы при каждом основании равны: ∠D = ∠A = <b>${al}°</b>.`:ask==='B'?`∠A и ∠B прилежат к боковой стороне AB, их сумма 180°: ∠B = 180° − ${al}° = <b>${ans}°</b>.`:`1) Углы при основании AD равны: ∠D = ∠A = ${al}°.<br>2) ∠C и ∠D прилежат к боковой стороне CD: ∠C = 180° − ${al}° = <b>${ans}°</b>.`,
 explain2:`Равнобедренная трапеция симметрична: если сложить её пополам по вертикальной оси, A совпадёт с D, а B — с C. Поэтому у неё всего два разных угла: острый ${al}° (внизу) и тупой ${180-al}° (наверху). Проверь: ${al} + ${180-al} + ${180-al} + ${al} = 360 ✅. ∠${ask} — ${ask==='D'?'нижний':'верхний'}, значит ${ans}°.`};});
G(3,()=>{const a=R(8,20),b=R(3,a-2);if((a+b)%2&&Math.random()<0.7)return null;const m=(a+b)/2;const findM=Math.random()<0.55;
 const p=trap(a,b,R(55,75),R(55,75));if(p.h<0.25*a||p.h>0.8*a)return null;p.M=mid(p.A,p.B);p.N=mid(p.C,p.D);
 const pic=geo({P:p,poly:[Q4],seg:[['M','N',{dash:true,col:'var(--accent)',sw:2}]],tick:[['A','M',1],['M','B',1],['C','N',2],['N','D',2]],side:[['B','C',findM?String(b):'?'],['A','D',String(a)],['M','N',findM?'?':N(m),{flip:true,col:'var(--accent-ink)'}]],maxH:200});
 if(findM)return {type:'num',q:`Основания трапеции равны ${a} и ${b}. Найди её среднюю линию MN.`,pic,ans:m,
 short:`(${a} + ${b}) : 2 = ${N(m)}.`,explain:`Средняя линия трапеции равна полусумме оснований: <span class="m">m = (a + b) : 2</span>.<br>m = (${a} + ${b}) : 2 = ${a+b} : 2 = <b>${N(m)}</b>.`,
 explain2:`Средняя линия проходит ровно посередине между основаниями, поэтому её длина — «средняя» между ними, как средняя оценка: (${a} + ${b}) : 2 = ${N(m)}. Проверка: ${N(m)} меньше ${a}, но больше ${b} — так и должно быть.`};
 return {type:'num',q:`Средняя линия трапеции равна ${N(m)}, большее основание ${a}. Найди меньшее основание.`,pic,ans:b,
 short:`a + b = 2 · ${N(m)} = ${a+b}; b = ${a+b} − ${a} = ${b}.`,explain:`m = (a + b) : 2, значит a + b = 2m = 2 · ${N(m)} = ${a+b}.<br>Меньшее основание: ${a+b} − ${a} = <b>${b}</b>.<div class="box err"><b>Ошибка</b>${N(m)} − ${a} или ${a} − ${N(m)} = ${N(a-m)} — неверно: средняя линия — это полусумма, сначала умножаем на 2.</div>`,
 explain2:`Средняя линия ${N(m)} — «середина» между основаниями. Большее основание на ${N(a-m)} длиннее средней линии, значит меньшее на столько же короче: ${N(m)} − ${N(a-m)} = ${b}.`};});
G(3,()=>{const b=R(3,9),a=b+2*R(2,6);const h=R(3,7);const p=isoTrap(a,b,h);p.H=[p.B[0],0];const askAH=Math.random()<0.6;const ans=askAH?(a-b)/2:(a+b)/2;
 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],tick:[['A','B',1],['C','D',1]],side:[['B','C',String(b)],['A','D',String(a),{gap:6}]],maxH:190});
 p.K=[p.C[0],0];const pic2=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}],['C','K',{dash:true}]],fill:[{pts:['A','B','H']},{pts:['K','C','D']}],rt:[['H','D','B'],['K','C','D']],side:[['B','C',String(b)],['H','K',String(b),{flip:true,col:'var(--accent-ink)'}],['A','H','?',{flip:true,col:'var(--accent-ink)'}],['K','D','?',{flip:true,col:'var(--accent-ink)'}]],lab:['A','B','C','D'],maxH:190});
 return {type:'num',q:`В равнобедренной трапеции ABCD основания AD = ${a} и BC = ${b}. Из вершины B проведена высота BH. Найди ${askAH?'AH':'HD'}.`,pic,ans,
 hint:'Проведи вторую высоту из C. Что получится посередине?',short:askAH?`AH = (${a} − ${b}) : 2 = ${ans}.`:`HD = ${a} − ${(a-b)/2} = ${ans} (это (a + b) : 2).`,
 explain:`Проведём вторую высоту CK. Посередине получится прямоугольник HBCK, поэтому HK = BC = ${b}.<br>Треугольники ABH и DCK равны (трапеция равнобедренная), значит AH = KD.<br>AH = (${a} − ${b}) : 2 = ${(a-b)/2}.${askAH?`<br>Ответ: <b>${ans}</b>.`:`<br>HD = AD − AH = ${a} − ${(a-b)/2} = <b>${ans}</b>.`}`,
 explain2:`«Разрежь» трапецию двумя высотами: посередине прямоугольник шириной ${b}, по краям два одинаковых треугольника.${fig(pic2)}На оба треугольника вместе приходится ${a} − ${b} = ${a-b}, на один — ${(a-b)/2}. ${askAH?'Это и есть AH.':`HD = прямоугольник + правый кусочек = ${b} + ${(a-b)/2} = ${ans}.`}`};});
G(3,()=>{const b=R(3,8),c=R(3,8);const a=b+c;const P2=a+b+2*c;const p=isoTrap(a,b,c*Math.sqrt(3)/2);p.H=[p.B[0],0];
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','60°']],tick:[['A','B',1],['C','D',1]],side:[['B','C',String(b)],['A','D',String(a),{gap:6}]],maxH:180});
 const pic2=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],fill:[{pts:['A','B','H']}],ang:[['A','D','B','60°'],['B','A','H','30°',{r:30}]],side:[['A','H',N(c/2),{col:'var(--accent-ink)'}],['B','C',String(b)]],maxH:180});
 return {type:'num',q:`Основания равнобедренной трапеции равны ${a} и ${b}, а острый угол равен 60°. Найди периметр трапеции.`,pic,ans:P2,
 hint:'Опусти высоту из вершины тупого угла. Какие углы будут в маленьком прямоугольном треугольнике?',short:`Боковая сторона = ${a} − ${b} = ${c}; P = ${a} + ${b} + 2 · ${c} = ${P2}.`,

 explain2:`${fig(pic2)}Закрашенный треугольник — «половинка равностороннего»: углы 30°, 60°, 90°. В нём короткий катет (${N(c/2)}) ровно вдвое меньше гипотенузы. Поэтому боковая сторона AB = ${c}. Получается правило-шпаргалка: в такой трапеции с углом 60° боковая сторона = разность оснований (${a} − ${b} = ${c}).`};});

 short:`∠C + ∠D = 180° → ∠C = ${ans}°.`,

G(4,()=>{const x=R(20,70);if(x===45)return null;const askAOD=Math.random()<0.5;const AD=8,AB=AD*Math.tan(x*D2R);if(AB<3||AB>11)return null;const p=withO(para(AD,AB,90));
 const ans=askAOD?180-2*x:2*x;

 return {type:'num',q:`В прямоугольнике ABCD диагонали пересекаются в точке O, ∠CAD = ${x}°. Найди ∠${askAOD?'AOD':'AOB'}.`,pic,ans,
 hint:'Треугольник AOD — какой он? Вспомни, что диагонали прямоугольника равны.',
 short:askAOD?`△AOD равнобедренный: ∠AOD = 180° − 2 · ${x}° = ${ans}°.`:`∠AOD = ${180-2*x}°, ∠AOB = 180° − ${180-2*x}° = ${ans}°.`,
 explain:`1) Диагонали прямоугольника равны и делятся пополам, поэтому AO = OD: △AOD <b>равнобедренный</b>.<br>2) Углы при основании равны: ∠ODA = ∠OAD = ${x}°.<br>3) ∠AOD = 180° − ${x}° − ${x}° = ${180-2*x}°.${askAOD?`<br>Ответ: <b>${ans}°</b>.`:`<br>4) ∠AOB и ∠AOD — смежные (вместе развёрнутый угол): ∠AOB = 180° − ${180-2*x}° = <b>${ans}°</b>.`}`,

 const ans=ask==='BAC'?al/2:ask==='ABD'?(180-al)/2:90;
 const angs=[['A','D','B',dg(al),{r:20}]];if(ask==='BAC')angs.push(['A','B','C','?',{r:46}]);if(ask==='ABD')angs.push(['B','A','D','?',{r:26}]);if(ask==='AOB')angs.push(['O','A','B','?',{r:16}]);

G(8,()=>{const n=pick([5,6,7,8,10,12]);
 return {type:'num',q:`Какое <b>наибольшее</b> число острых углов может быть у выпуклого ${NGg[n]}?`,ans:3,
 hint:'Посмотри на внешние углы. Чему равна их сумма? Каким будет внешний угол при остром внутреннем?',short:'Не больше 3: у острого угла внешний больше 90°, а сумма внешних — 360°.',
 explain:`1) В каждой вершине внешний угол = 180° − внутренний. Если внутренний угол острый (< 90°), то внешний <b>больше 90°</b>.<br>2) Сумма внешних углов выпуклого многоугольника (по одному в каждой вершине) равна 360°.<br>3) Если бы острых углов было 4, то четыре внешних угла дали бы больше 4 · 90° = 360° — а все внешние вместе только 360°. Противоречие.<br>4) Три острых угла возможны: возьми остроугольный треугольник и замени одну его сторону ломаной, чуть-чуть выгнутой наружу (с ${n-3} новыми ${plural(n-3,'вершиной','вершинами','вершинами')}). Углы треугольника останутся острыми, а новые углы будут почти по 180°.<br>Ответ: <b>3</b>.`,
 explain2:`Посчитаем через сумму углов. У ${NGg[n]} она (${n} − 2) · 180° = ${(n-2)*180}°. Пусть острых углов k, каждый < 90°, а остальные ${n} − k углов < 180°. Тогда сумма < 90k + 180(${n} − k) = ${180*n} − 90k. Должно быть ${(n-2)*180} < ${180*n} − 90k, то есть 90k < 360, k < 4. Значит, k ≤ 3.`};},true);

 return {type:'num',q:`Биссектрисы углов A и D параллелограмма ABCD пересекаются в точке K, лежащей на стороне BC. AB = ${a}. Найди периметр параллелограмма.`,pic,ans:6*a,
 hint:'Каждая биссектриса отсекает свой равнобедренный треугольник.',short:`BK = AB = ${a}, KC = CD = ${a}; BC = ${2*a}; P = 2 · (${a} + ${2*a}) = ${6*a}.`,
 explain:`1) Биссектриса AK отсекает равнобедренный △ABK: BK = AB = ${a}.<br>2) Биссектриса DK отсекает равнобедренный △DCK (∠CDK = ∠KDA = ∠CKD): KC = CD = ${a}.<br>3) BC = BK + KC = ${a} + ${a} = ${2*a}.<br>4) P = 2 · (${a} + ${2*a}) = <b>${6*a}</b>.`,

 return {type:'num',q:`Диагонали выпуклого четырёхугольника ABCD равны ${d1} и ${d2}. Середины его сторон K, L, M, N последовательно соединили. Найди периметр четырёхугольника KLMN.`,pic,ans,
 hint:'Отрезок KL соединяет середины двух сторон треугольника ABC. Чему он равен?',short:`Каждая сторона KLMN — половина диагонали: 2 · ${N(d1/2)} + 2 · ${N(d2/2)} = ${ans}.`,

 explain2:`${fig(pic2)}Посмотри только на закрашенный треугольник ABC: K и L — середины его сторон, а KL — «срезанная верхушка», ровно вдвое короче основания AC. Две стороны KLMN «смотрят» на диагональ AC и вместе равны ей (${d1}), две другие — на BD (${d2}). Форма четырёхугольника неважна — ответ всегда сумма диагоналей.`};}},true);
