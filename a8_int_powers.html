<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Степень с целым показателем — тренажёр</title>
<style>:root{

  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;

html{-webkit-text-size-adjust:100%}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const store={get(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}},clear(){try{localStorage.removeItem(LS_KEY);}catch(e){}}};

const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});
  if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),50);
  if(S&&S.cur){const back=document.getElementById('backToTask');if(!back){const b=document.createElement('button');b.id='backToTask';b.className='btn';b.textContent='← Вернуться к задаче';b.style.cssText='position:sticky;bottom:16px;margin:8px auto;display:flex';b.onclick=()=>{show('train');b.remove();};$('#v-theory').appendChild(b);}}
}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;
    const full=S.queue.length===T.gens.length;

<div class="box tip"><b>Проверка порядка</b>Для числа ≥ 1 порядок = (количество цифр до запятой) − 1. Для 0,00045: первая ненулевая цифра на 4-м месте после запятой → n = −4.</div>`},
{title:'Действия в стандартном виде',lvl:5,html:`
<div class="box rule"><b>Умножение и деление</b>Мантиссы умножаем (делим), степени десятки — по правилам степеней. Потом <b>приводим к стандартному виду</b>.</div>
<div class="box ex"><b>Умножение</b>(4·10⁵)·(5·10⁻⁹) = 20·10⁻⁴ = 2·10¹·10⁻⁴ = <b>2·10⁻³</b>.</div>
<div class="box ex"><b>Деление</b>(1,2·10⁵) : (4·10⁸) = 0,3·10⁻³ = <b>3·10⁻⁴</b>.</div>
<div class="box ex"><b>Сложение</b>Только при <b>одинаковом</b> порядке! 3,2·10⁵ + 4·10⁴ = 3,2·10⁵ + 0,4·10⁵ = <b>3,6·10⁵</b>.</div>
<div class="box err"><b>Ошибки</b>Перемножить показатели: 10⁵·10⁻⁹ = 10⁻⁴⁵ — неверно, показатели <b>складываются</b>.<br>Сложить «как есть»: 3,2·10⁵ + 4·10⁴ = 7,2·10⁹ — бессмыслица.</div>`},
{title:'Космос и микромир',lvl:6,html:`
<div class="box rule"><b>Приставки</b>кило- = 10³, мега- = 10⁶, гига- = 10⁹;<br>милли- = 10⁻³, микро- = 10⁻⁶, нано- = 10⁻⁹.<br>Пример: 5 нм = 5·10⁻⁹ м, 16 ГБ ≈ 1,6·10¹⁰ байт.</div>
<div class="box ex"><b>Сколько летит свет от Солнца?</b>Расстояние 1,5·10¹¹ м, скорость света 3·10⁸ м/с. t = ${F('1,5·10¹¹','3·10⁸')} = 0,5·10³ = <b>500 с</b> ≈ 8,3 мин. Ты всегда видишь Солнце «из прошлого»!</div>
<div class="box ex"><b>Во сколько раз?</b>Бактерия ≈ 2·10⁻⁶ м, вирус гриппа ≈ 1·10⁻⁷ м: ${F('2·10⁻⁶','10⁻⁷')} = 2·10¹ = в 20 раз.</div>
<div class="fact">В конце 2026 года «Вояджер-1» — самый далёкий аппарат, созданный людьми, — удалится от Земли на одни <b>световые сутки</b>: это около 2,6·10¹³ м. Команда с Земли идёт к нему целый день!</div>
<div class="fact">Масса Земли ≈ 5,97·10²⁴ кг, масса Луны ≈ 7,35·10²² кг. Земля тяжелее примерно в 81 раз.</div>`},
{title:'Олимпиадные приёмы',lvl:7,html:`
<ul class="steps"><li><b>Одно основание:</b> (${F(1,4)})ˣ = 64 → 2⁻²ˣ = 2⁶ → x = −3.</li>
<li><b>Общий показатель:</b> 2⁻¹⁰⁰ = (2⁴)⁻²⁵ = 16⁻²⁵, 3⁻⁷⁵ = 27⁻²⁵. 16 < 27, а при отрицательном показателе меньшее основание даёт <b>большее</b> число.</li>
<li><b>Выноси общий множитель:</b> 2ⁿ⁺² − 2ⁿ = 2ⁿ(4 − 1) = 3·2ⁿ.</li>
<li><b>5⁻ⁿ = 2ⁿ·10⁻ⁿ</b> — так легко увидеть десятичную запись: 5⁻³ = 8·10⁻³ = 0,008.</li></ul>`},
{title:'Шпаргалка',html:`
<ul class="steps"><li>a⁰ = 1 (a ≠ 0); a⁻ⁿ = 1/aⁿ; (a/b)⁻ⁿ = (b/a)ⁿ.</li>
<li>Минус в показателе — «переверни», а не «сделай отрицательным».</li>
<li>Свойства степеней работают для всех целых показателей.</li>
<li>Стандартный вид: a·10ⁿ, 1 ≤ a < 10.</li>
<li>Умножаешь — показатели складываешь, потом нормализуешь мантиссу.</li></ul>`}
];

const symbols={tab:'Формулы',title:'Формулы и обозначения',rows:[
['a⁰ = 1','нулевая степень','Любое число, кроме 0, в нулевой степени равно 1.','(−7)⁰ = 1'],
['a⁻ⁿ = 1/aⁿ','отрицательная степень','Степень «уходит в знаменатель», минус исчезает.','2⁻³ = 1/8'],

['aᵐ : aⁿ = aᵐ⁻ⁿ','деление степеней','Показатели вычитаем (аккуратно со знаками).','a⁴ : a⁻² = a⁶'],

],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Отрицательный показатель не делает число отрицательным: 10⁻³ = 0,001.</div>`};

/* ---------- generators ---------- */
const gens=[];
const G=(lvl,make,star,rule)=>gens.push({lvl,make,star,rule});

/* L0 */
G(0,()=>{const r=ch('1',['0','a','не существует']);
return {type:'choice',q:'Чему равно <span class="m">a⁰</span> при a ≠ 0?',...r,
short:'a⁰ = 1 для любого a ≠ 0.',
explain:`<b>a⁰ = 1</b>. Почему: a³ : a³ = 1 (число делим само на себя), а по правилу деления степеней a³ : a³ = a³⁻³ = a⁰.<br>«0» — самая частая ошибка: кажется, что «ноль раз умножили — ничего не осталось». Но лестница 2² = 4, 2¹ = 2, 2⁰ = ? — каждый шаг делим на 2: 2 : 2 = <b>1</b>.`,
explain2:'Представь: у тебя 1 предмет, и ты 0 раз умножил его на a — он так и остался 1. Степень — это «1, умноженная на a столько-то раз». Ноль раз — остаётся 1.'};},false,true);
G(0,()=>{const r=ch(F(1,'aⁿ'),['−aⁿ','−n·a',F(1,'(−a)ⁿ')]);
return {type:'choice',q:'Допиши определение: <span class="m">a⁻ⁿ = …</span> (a ≠ 0)',opts:r.opts.map(M),ans:r.ans,
short:'a⁻ⁿ = 1/aⁿ — «переворачиваем».',
explain:`По определению <b>a⁻ⁿ = ${F(1,'aⁿ')}</b>. Минус в показателе означает «перенеси степень в знаменатель».<br>−aⁿ — неверно: 2⁻² = ${F(1,4)}, а не −4. Минус в показателе <b>не</b> делает число отрицательным.`,
explain2:`Лестница: 2² = 4, 2¹ = 2, 2⁰ = 1, 2⁻¹ = ${F(1,2)}, 2⁻² = ${F(1,4)} = ${F(1,'2²')}. Каждый шаг — делим на 2. Вот и получается ${F(1,'aⁿ')}.`};},false,true);
G(0,()=>{const T=[];const pool=shuffle([()=>{const a=R(2,9);return [`(−${a})⁰`,1,`(−${a})⁰ = 1 (минус в скобках — внутри степени)`];},()=>{const a=R(2,9);return [`−${a}⁰`,-1,`−${a}⁰ = −(${a}⁰) = −1 (минус снаружи!)`];},()=>{const k=R(2,9),b=R(2,9);return [`${k}·${b}⁰`,k,`${k}·${b}⁰ = ${k}·1 = ${k}`];},()=>{const p=R(1,7),q=p+R(1,5);return [`(${F(p,q)})⁰`,1,`любая дробь (≠ 0) в нулевой степени = 1`];}]);
pool.slice(0,3).forEach(f=>T.push(f()));const ans=T.reduce((s,t)=>s+t[1],0);
const expr=T.map((t,i)=>i===0?t[0]:(t[0][0]==='−'?' − '+t[0].slice(1):' + '+t[0])).join('');
return {type:'num',q:`Вычисли: <span class="m">${expr}</span>`,ans,
hint:'Любое число (≠ 0) в нулевой степени — 1. Следи за минусом: в скобках он или снаружи?',
short:T.map(t=>t[2]).join('; ')+`. Итого ${N(ans)}.`,
explain:`Разбираем по частям:<br>${T.map(t=>'• '+t[2]).join('<br>')}<br>Складываем: <b>${N(ans)}</b>.`,
explain2:`Главная ловушка — минус. (−5)⁰: в степень возводится всё, что в скобках, включая минус → 1. −5⁰: сначала 5⁰ = 1, а минус стоит перед ним → −1. Как «−(5⁰)».`};});
G(0,()=>{const b=pick([2,3,4,5,10]);const n=b===10?R(1,4):b===2?R(1,5):R(1,3);const ans=1/Math.pow(b,n);
return {type:'num',q:`Вычисли <span class="m">${pw(b,-n)}</span>. Ответ запиши обыкновенной дробью (например, 1/9) или десятичной.`,ans,ansText:F(1,Math.pow(b,n))+' = '+N(ans),
hint:`${pw(b,-n)} = ${F(1,pw(b,n))}.`,
short:`${pw(b,-n)} = ${F(1,pw(b,n))} = ${F(1,Math.pow(b,n))}.`,
explain:`Отрицательный показатель — «переворачиваем»: ${pw(b,-n)} = ${F(1,pw(b,n))} = ${F(1,Math.pow(b,n))}.<div class="box err"><b>Ловушка</b>Ответы −${Math.pow(b,n)} или ${-b*n} неверны: минус в показателе не делает число отрицательным.</div>`,
explain2:`Иди по лестнице вниз, деля на ${b}: ${b}¹ = ${b} → ${b}⁰ = 1 → ${b}⁻¹ = ${F(1,b)}${n>=2?` → ${b}⁻² = ${F(1,b*b)}`:''}${n>=3?` → ${b}⁻³ = ${F(1,b**3)}`:''}${n>=4?' → …':''}.`};});
G(0,()=>{const b=pick([2,3]);const k=b===2?4:2;const t=Math.pow(b,k);
const cand=[[`${b}${sup(-k)}`,pvv(b,-k)],[`(−${b})${sup(-k)}`,pvv(-b,-k)],[`−${b}${sup(-k)}`,-pvv(b,-k)],[`${b}${sup(k)}`,pvv(b,k)],[`(${F(1,b)})${sup(k)}`,1/t],[`${t}⁻¹`,1/t],[`${-k}·${b}`,-k*b]];
const o=sample(cand,6);if(!o.some(c=>near(c[1],1/t)))o[0]=cand[0];const oo=shuffle(o);
return {type:'multi',q:`Какие выражения равны <span class="m">${F(1,t)}</span>? Выбери все.`,opts:oo.map(c=>M(c[0])),ans:oo.map((c,i)=>near(c[1],1/t)?i:-1).filter(i=>i>=0),
short:oo.map(c=>`${c[0]} = ${qh(Math.round(c[1]*t*t),t*t)}`).join('; '),
explain:`Считаем каждое:<br>${oo.map(c=>`• ${M(c[0])} = ${qh(Math.round(c[1]*t*t),t*t)} ${near(c[1],1/t)?'✅':'❌'}`).join('<br>')}<br>Обрати внимание: в (−${b})${sup(-k)} показатель чётный, поэтому минус «съедается». А −${b}${sup(-k)} — минус снаружи, результат отрицательный.`,
explain2:`Правило «переверни»: a⁻ⁿ = ${F(1,'aⁿ')}. ${F(1,t)} можно получить разными способами: ${b}${sup(-k)} = ${F(1,b+sup(k))}, ${t}⁻¹ = ${F(1,t)}, (${F(1,b)})${sup(k)} = ${F(1,t)}. А ${b}${sup(k)} = ${t} — это наоборот, «неперевёрнутое».`};});

/* L1 */
G(1,()=>{const r=ch(`(${F('b','a')})ⁿ`,[`−(${F('a','b')})ⁿ`,`(${F('−a','b')})ⁿ`,F('aⁿ','b')]);
return {type:'choice',q:`Как возвести дробь в отрицательную степень? <span class="m">(${F('a','b')})⁻ⁿ = …</span>`,opts:r.opts.map(M),ans:r.ans,
short:'Переворачиваем дробь, показатель становится положительным.',
explain:`(${F('a','b')})⁻ⁿ = ${F(1,`(${F('a','b')})ⁿ`)} = (${F('b','a')})ⁿ. Дробь <b>переворачиваем</b>, минус в показателе исчезает.`,
explain2:`Пример: (${F(2,3)})⁻¹ = ${F(3,2)} — обратное число. (${F(2,3)})⁻² = (${F(3,2)})² = ${F(9,4)}. Знак числа от этого не меняется.`};},false,true);
G(1,()=>{let p,q;do{p=R(1,5);q=R(2,6);}while(p===q||gcd(p,q)!==1);const n=R(1,3);const ans=Math.pow(q,n)/Math.pow(p,n);
return {type:'num',q:`Вычисли <span class="m">(${F(p,q)})${sup(-n)}</span>.`,ans,ansText:qh(Math.pow(q,n),Math.pow(p,n)),
hint:'Переверни дробь.',
short:`(${F(q,p)})${sup(n)} = ${qh(Math.pow(q,n),Math.pow(p,n))}.`,
explain:`Отрицательный показатель — переворачиваем дробь: (${F(p,q)})${sup(-n)} = (${F(q,p)})${sup(n)} = ${F(q+sup(n),p+sup(n))} = <b>${qh(Math.pow(q,n),Math.pow(p,n))}</b>.`,
explain2:`Через определение: (${F(p,q)})${sup(-n)} = 1 : (${F(p,q)})${sup(n)} = 1 : ${qh(Math.pow(p,n),Math.pow(q,n))} = ${qh(Math.pow(q,n),Math.pow(p,n))}. Делить на дробь — умножать на перевёрнутую.`};});
G(1,()=>{const p=R(2,5),n=R(2,3);const ans=Math.pow(-p,n);
return {type:'num',q:`Вычисли <span class="m">(−${F(1,p)})${sup(-n)}</span>.`,ans,
short:`(−${p})${sup(n)} = ${N(ans)}.`,
explain:`Переворачиваем: (−${F(1,p)})${sup(-n)} = (−${p})${sup(n)} = <b>${N(ans)}</b>.<br>Знак: показатель ${n} ${n%2?'нечётный → минус остаётся':'чётный → минус пропадает'}.`,
explain2:`По шагам: (−${F(1,p)})${sup(n)} = ${n%2?'−':''}${F(1,Math.pow(p,n))}. Теперь 1 : (${n%2?'−':''}${F(1,Math.pow(p,n))}) = ${N(ans)}.`};});
G(1,()=>{const n=R(1,5);const ans=Math.pow(10,-n);
return {type:'num',q:`Запиши <span class="m">10${sup(-n)}</span> десятичной дробью.`,ans,ansText:dec(1,-n),
hint:`10${sup(-n)} = ${F(1,'10'+sup(n))}.`,
short:`10${sup(-n)} = ${F(1,dec(1,n))} = ${dec(1,-n)}.`,
explain:`10${sup(-n)} = ${F(1,'10'+sup(n))} = ${F(1,dec(1,n))} = <b>${dec(1,-n)}</b>.<br>Правило: в 10⁻ⁿ после запятой ${n} ${plural(n,'цифра','цифры','цифр')}, последняя — единица (${n-1} ${plural(n-1,'ноль','нуля','нулей')} перед ней).`,
explain2:`Лестница: 10⁰ = 1, 10⁻¹ = 0,1, 10⁻² = 0,01, 10⁻³ = 0,001… С каждым шагом единица «отъезжает» на одно место вправо.`};});
G(1,()=>{let p,q;do{p=R(2,6);q=R(2,6);}while(p===q);const sq=Math.random()<0.5;const e2=sq?2:1;const v=1/p+1/Math.pow(q,e2);const D=p*Math.pow(q,e2);
return {type:'num',q:`Вычисли <span class="m">${p}⁻¹ + ${q}${sup(-e2)}</span>. Ответ — дробью.`,ans:v,ansText:qh(Math.pow(q,e2)+p,D),
short:`${F(1,p)} + ${F(1,Math.pow(q,e2))} = ${qh(Math.pow(q,e2)+p,D)}.`,
explain:`${p}⁻¹ = ${F(1,p)}, ${q}${sup(-e2)} = ${F(1,Math.pow(q,e2))}.<br>Складываем: ${F(1,p)} + ${F(1,Math.pow(q,e2))} = ${F(Math.pow(q,e2)+p,D)} = <b>${qh(Math.pow(q,e2)+p,D)}</b>.<div class="box err"><b>Ловушка</b>«Сложить основания»: (${p} + ${q})⁻¹ — так нельзя, степень суммы ≠ сумма степеней.</div>`,
explain2:`Сначала переведи каждую степень в обычную дробь, а потом складывай по правилам дробей (общий знаменатель ${D}).`};});

/* L2 */
G(2,()=>{const r=ch('aᵐ⁺ⁿ',['aᵐⁿ','aᵐ⁻ⁿ','(2a)ᵐ⁺ⁿ']);
return {type:'choice',q:'Правило умножения степеней (m, n — любые целые): <span class="m">aᵐ · aⁿ = …</span>',opts:r.opts.map(M),ans:r.ans,
short:'При умножении показатели складываются.',
explain:'aᵐ · aⁿ = <b>aᵐ⁺ⁿ</b> — показатели складываются, и это верно для любых целых m, n (в том числе отрицательных). Перемножают показатели при возведении степени в степень: (aᵐ)ⁿ = aᵐⁿ.',

G(2,()=>{const r=ch('aᵐⁿ',['aᵐ⁺ⁿ','aᵐ⁻ⁿ','m·aⁿ']);
return {type:'choice',q:'Возведение степени в степень: <span class="m">(aᵐ)ⁿ = …</span>',opts:r.opts.map(M),ans:r.ans,
short:'Показатели перемножаются.',
explain:'(aᵐ)ⁿ = <b>aᵐⁿ</b> — показатели перемножаем. Пример: (a⁻²)³ = a⁻⁶.',
explain2:`(a²)³ = a² · a² · a² = a²⁺²⁺² = a⁶ = a²·³. Отсюда и «перемножаем». С минусом: (2⁻¹)² = (${F(1,2)})² = ${F(1,4)} = 2⁻².`};},false,true);
G(2,()=>{let p,q,r0,e;do{p=nz(-8,8);q=nz(-8,8);r0=nz(-8,8);e=p+q-r0;}while(Math.abs(e)>12||p>0&&q>0&&r0>0);
return {type:'num',q:`Представь в виде степени с основанием a: <span class="m">a${sup(p)} · a${sup(q)} : a${sup(r0)} = a<sup>?</sup></span>. Впиши показатель.`,ans:e,
short:`${N(p)} + ${pn(q)} − ${pn(r0)} = ${N(e)}.`,
explain:`Умножение — показатели складываем, деление — вычитаем:<br>${N(p)} + ${pn(q)} − ${pn(r0)} = ${N(p+q)} − ${pn(r0)} = <b>${N(e)}</b>.${r0<0?`<br>Осторожно: вычесть ${N(r0)} — значит прибавить ${-r0}.`:''}`,
explain2:`Представь показатель как баланс на счёте: начинаем с ${N(p)}, ${q>0?'пополняем на '+q:'списываем '+(-q)}, потом ${r0>0?'списываем '+r0:'«списываем минус» — то есть пополняем на '+(-r0)}. Итог: ${N(e)}.`};});
G(2,()=>{let p,q,r0,e;do{p=nz(-5,5);q=nz(-4,4);r0=nz(-9,9);e=p*q+r0;}while(Math.abs(e)>12||(p>0&&q>0));
return {type:'num',q:`Впиши показатель: <span class="m">(a${sup(p)})${sup(q)} · a${sup(r0)} = a<sup>?</sup></span>`,ans:e,
short:`${N(p)}·${pn(q)} + ${pn(r0)} = ${N(e)}.`,
explain:`1) Степень в степень — перемножаем: (a${sup(p)})${sup(q)} = a${sup(p*q)}.<br>2) Умножение — складываем: ${N(p*q)} + ${pn(r0)} = <b>${N(e)}</b>.`,
explain2:`Частая ошибка — сложить ${N(p)} + ${pn(q)} в скобке. Но (a${sup(p)})${sup(q)} — это a${sup(p)} умножить само на себя ${Math.abs(q)} раз${q<0?' и перевернуть':''}, поэтому ${N(p)}·${pn(q)} = ${N(p*q)}.`};});
G(2,()=>{let b,p,q,r0,e;do{b=pick([2,3,5,10]);p=nz(-9,9);q=nz(-9,9);r0=nz(-9,9);e=p+q-r0;}while(e<-2||e>3||(b>=5&&e>2)||(b===10&&e<-1));
const ans=pvv(b,e);
return {type:'num',q:`Вычисли: <span class="m">${F(`${pw(b,p)} · ${pw(b,q)}`,pw(b,r0))}</span>`,ans,ansText:pvh(b,e),
hint:'Сначала собери всё в одну степень, а потом считай.',
short:`${pw(b,p+q-r0)} = ${pvh(b,e)}.`,
explain:`Основание одно → работаем с показателями: ${N(p)} + ${pn(q)} − ${pn(r0)} = ${N(e)}.<br>${pw(b,e)} = <b>${pvh(b,e)}</b>.`,
explain2:`Считать ${pw(b,p)} и т. д. по отдельности — долго и легко ошибиться. Свойства степеней превращают «монстра» в одну маленькую степень: ${pw(b,e)}.`};});

/* L3 */
G(3,()=>{const r=ch('(ab)ⁿ = aⁿbⁿ',['(ab)ⁿ = abⁿ','(a + b)ⁿ = aⁿ + bⁿ','(ab)ⁿ = n·ab']);
return {type:'choice',q:'Какое свойство верно для любого целого n (a, b ≠ 0)?',opts:r.opts.map(M),ans:r.ans,
short:'В степень возводится каждый множитель.',
explain:`<b>(ab)ⁿ = aⁿbⁿ</b> — каждый множитель возводится в степень. Например, (2x)⁻² = 2⁻²x⁻² = ${F(1,'4x²')}.<br>(a + b)ⁿ = aⁿ + bⁿ — неверно: (1 + 1)² = 4, а 1² + 1² = 2.`,
explain2:`Проверь числами: (2·3)⁻¹ = ${F(1,6)}, и 2⁻¹·3⁻¹ = ${F(1,2)}·${F(1,3)} = ${F(1,6)} ✅.`};},false,true);
G(3,()=>{let p,q,r0,s,ex,ey;do{p=nz(-4,4);q=nz(-4,4);r0=nz(-3,3);s=nz(-6,6);ex=p*r0+s;ey=q*r0;}while(ex===0||ey===0||Math.abs(ex)>12);
const fmt=(a,b)=>`x${sup(a)}y${sup(b)}`;const right=fmt(ex,ey);
const w=[...new Set([fmt(p+r0+s,q+r0),fmt(p*r0*s,q*r0),fmt(p*r0-s,ey),fmt(ex,q+r0),fmt(-ex,ey)])].filter(z=>z!==right).slice(0,3);
const r=ch(right,w);
return {type:'choice',q:`Упрости: <span class="m">(x${sup(p)}y${sup(q)})${sup(r0)} · x${sup(s)}</span>`,opts:r.opts.map(M),ans:r.ans,
short:`x: ${N(p)}·${pn(r0)} + ${pn(s)} = ${N(ex)}; y: ${N(q)}·${pn(r0)} = ${N(ey)}.`,
explain:`1) Скобку в степень ${N(r0)} — каждый показатель умножаем на ${N(r0)}: x${sup(p*r0)}y${sup(q*r0)}.<br>2) Умножаем на x${sup(s)} — у x складываем: ${N(p*r0)} + ${pn(s)} = ${N(ex)}.<br>Ответ: <b>${right}</b>.`,
explain2:`Работай с каждой буквой отдельно, как с отдельным счётом. Буква x: было ${N(p)}, скобка «умножила» на ${N(r0)} → ${N(p*r0)}, потом добавили ${N(s)} → ${N(ex)}. Буква y: ${N(q)}·${pn(r0)} = ${N(ey)}, больше y нигде нет.`};});
G(3,()=>{const B=pick([[2,4,8],[3,9,27],[2,4,16]]);const b=B[0];let a,c,d,e;
const pows=B.map(x=>Math.round(Math.log(x)/Math.log(b)));
do{a=nz(-6,6);c=nz(-4,4);d=nz(-3,3);e=a*pows[0]+c*pows[1]-d*pows[2];}while(e<-2||e>3||(b===3&&e>2));
const ans=pvv(b,e);ok(near(Math.pow(B[0],a)*Math.pow(B[1],c)/Math.pow(B[2],d),ans),'base');
return {type:'num',q:`Вычисли: <span class="m">${F(`${pw(B[0],a)} · ${pw(B[1],c)}`,pw(B[2],d))}</span>`,ans,ansText:pvh(b,e),
hint:`Приведи всё к основанию ${b}: ${B[1]} = ${b}${sup(pows[1])}, ${B[2]} = ${b}${sup(pows[2])}.`,
short:`${pw(b,a*pows[0])} · ${pw(b,c*pows[1])} : ${pw(b,d*pows[2])} = ${pw(b,e)} = ${pvh(b,e)}.`,
explain:`Приводим к одному основанию ${b}:<br>${pw(B[1],c)} = (${b}${sup(pows[1])})${sup(c)} = ${pw(b,c*pows[1])}; ${pw(B[2],d)} = (${b}${sup(pows[2])})${sup(d)} = ${pw(b,d*pows[2])}.<br>Показатель: ${N(a)} + ${pn(c*pows[1])} − ${pn(d*pows[2])} = ${N(e)}.<br>${pw(b,e)} = <b>${pvh(b,e)}</b>.`,
explain2:`Разные основания складывать/вычитать нельзя, а одинаковые — можно. Поэтому первым делом ищем, какие числа — степени одного и того же: ${B.join(', ')} — всё это степени ${b}.`};});
G(3,()=>{let n,a,c;do{n=R(3,9);a=R(0,3);c=R(0,2);}while(a+c===0);
const ans=Math.pow(2,a)*Math.pow(3,c);ok(near(Math.pow(6,-n)*Math.pow(2,n+a)*Math.pow(3,n+c),ans),'6');
return {type:'num',q:`Вычисли: <span class="m">6${sup(-n)} · 2${sup(n+a)} · 3${sup(n+c)}</span>`,ans,
hint:'6 = 2·3, значит 6⁻ⁿ = 2⁻ⁿ·3⁻ⁿ.',
short:`2${sup(-n)}·3${sup(-n)}·2${sup(n+a)}·3${sup(n+c)} = 2${sup(a)}·3${sup(c)} = ${ans}.`,
explain:`6${sup(-n)} = (2·3)${sup(-n)} = 2${sup(-n)}·3${sup(-n)}.<br>Двойки: −${n} + ${n+a} = ${a}. Тройки: −${n} + ${n+c} = ${c}.<br>Итого 2${sup(a)}·3${sup(c)} = ${Math.pow(2,a)}·${Math.pow(3,c)} = <b>${ans}</b>.`,
explain2:`Не считай 6${sup(n)} и прочие огромные числа! Разложи на простые и считай показатели у каждого простого числа отдельно — как в бухгалтерии: приход и расход у каждой «валюты» свой.`};});

/* L4 */
G(4,()=>{const r=ch('1 ≤ a < 10, n — целое',['0 < a < 1, n — целое','1 ≤ a ≤ 10, n — натуральное','a — целое число, n — любое']);
return {type:'choice',q:'Число записано в <b>стандартном виде</b> a·10ⁿ, если…',...r,
short:'Перед запятой ровно одна ненулевая цифра: 1 ≤ a < 10.',
explain:`Стандартный вид: <b>a·10ⁿ</b>, где <b>1 ≤ a < 10</b>, а n — <b>целое</b> (может быть отрицательным!).<br>a = 10 не подходит: 10·10³ надо писать как 1·10⁴. 0 < a < 1 тоже нет: 0,5·10³ = 5·10².`,
explain2:'Простое правило: перед запятой — ровно одна цифра, и это не ноль. 3,4·10⁸ ✅, 34·10⁷ ❌, 0,34·10⁹ ❌.'};},false,true);
G(4,()=>{const Mi=R(11,99);const m=Mi/10;const e=R(5,12);const val=dec(Mi,e-1);
const right=sf(m,e);const r=ch(right,[sf(m,e-1),sf(m,e+1),`${Mi}·10${sup(e-1)}`]);
return {type:'choice',q:`Запиши в стандартном виде число <span class="m">${val}</span>.`,opts:r.opts.map(M),ans:r.ans,
short:`Запятая переехала на ${e} ${plural(e,'разряд','разряда','разрядов')} влево: ${right}.`,
explain:`1) Ставим запятую после первой цифры: ${N(m)}.<br>2) Считаем, на сколько разрядов она «переехала» влево: всего цифр ${e+1}, значит, на <b>${e}</b>.<br>3) Число большое → показатель положительный: <b>${right}</b>.<br>${Mi}·10${sup(e-1)} — то же число, но не стандартный вид (${Mi} ≥ 10).`,
explain2:`Проверка «обратно»: ${N(m)}·10${sup(e)} — сдвигаем запятую на ${e} вправо: ${val} ✅. Быстрый способ: показатель = количество цифр − 1 = ${e+1} − 1 = ${e}.`};});
G(4,()=>{const Mi=R(11,99);const m=Mi/10;const e=-R(2,8);const val=dec(Mi,e-1);
const right=sf(m,e);const r=ch(right,[sf(m,-e),sf(m,e-1),sf(m,e+1)]);
return {type:'choice',q:`Запиши в стандартном виде число <span class="m">${val}</span>.`,opts:r.opts.map(M),ans:r.ans,
short:`Запятая переехала на ${-e} ${plural(-e,'разряд','разряда','разрядов')} вправо: ${right}.`,
explain:`1) Двигаем запятую <b>вправо</b>, пока перед ней не окажется одна ненулевая цифра: ${N(m)}.<br>2) Считаем шаги: ${-e}.<br>3) Число меньше 1 → показатель <b>отрицательный</b>: <b>${right}</b>.<br>${sf(m,-e)} — ловушка: это огромное число ${dec(Mi,-e-1)}.`,
explain2:`Проверка: ${sf(m,e)} = ${N(m)} : 10${sup(-e)} — делим на ${dec(1,-e)}, запятая уходит на ${-e} влево: ${val} ✅. Подсказка: первая ненулевая цифра стоит на ${-e}-м месте после запятой → показатель −${-e}.`};});
G(4,()=>{const big=Math.random()<0.5;const Mi=R(101,999);const e=big?R(3,10):-R(1,7);const val=dec(Mi,e-2);
return {type:'num',q:`Каков <b>порядок</b> числа <span class="m">${val}</span> (показатель n в стандартном виде a·10ⁿ)?`,ans:e,
short:`${val} = ${sf(Mi/100,e)} → n = ${N(e)}.`,
explain:`Записываем в стандартном виде: ${val} = <b>${sf(Mi/100,e)}</b>. Порядок — показатель: <b>${N(e)}</b>.<br>${big?`Для числа ≥ 1: порядок = (цифр до запятой) − 1 = ${e+1} − 1 = ${e}.`:`Для числа < 1: первая ненулевая цифра на ${-e}-м месте после запятой → n = ${e}.`}`,
explain2:`Порядок показывает «масштаб» числа: ${e>0?`10${sup(e)} ≤ ${val} < 10${sup(e+1)}`:`10${sup(e)} ≤ ${val} < 10${sup(e+1)}`}. Это как «этаж» числа на лестнице степеней десятки.`};});
G(4,()=>{const e=R(2,9);const cand=shuffle([[`3,5·10${sup(e)}`,true],[`35·10${sup(e)}`,false],[`0,35·10${sup(e)}`,false],[`1·10${sup(-e)}`,true],[`10·10${sup(e)}`,false],[`9,99·10${sup(-e)}`,true]]).slice(0,5);
if(!cand.some(c=>c[1]))cand[0]=[`2,4·10${sup(-e)}`,true];
return {type:'multi',q:'Какие числа записаны в <b>стандартном виде</b>? Выбери все.',opts:cand.map(c=>M(c[0])),ans:cand.map((c,i)=>c[1]?i:-1).filter(i=>i>=0),
short:'Перед запятой одна цифра от 1 до 9.',
explain:`Проверяем условие 1 ≤ a < 10:<br>${cand.map(c=>`• ${M(c[0])} — ${c[1]?'да ✅':'нет ❌'}`).join('<br>')}<br>Отрицательный показатель стандартному виду не мешает.`,
explain2:'10·10ⁿ — частая ловушка: 10 уже не меньше 10. Правильно 1·10ⁿ⁺¹. А 0,35 меньше 1 — тоже не годится.'};});

/* L5 */
G(5,()=>{const r=ch('(a·b)·10ᵐ⁺ⁿ',['(a·b)·10ᵐⁿ','(a + b)·10ᵐ⁺ⁿ','(a·b)·10ᵐ⁻ⁿ']);
return {type:'choice',q:'Какое правило умножения чисел в стандартном виде верное? <span class="m">(a·10ᵐ)·(b·10ⁿ) = …</span>',opts:r.opts.map(M),ans:r.ans,
short:'Мантиссы перемножаем, показатели складываем.',
explain:'(a·10ᵐ)(b·10ⁿ) = (a·b)·(10ᵐ·10ⁿ) = <b>(a·b)·10ᵐ⁺ⁿ</b>. Переставили множители и применили aᵐ·aⁿ = aᵐ⁺ⁿ. После этого, если a·b ≥ 10, переносим лишнюю десятку в степень.',
explain2:'Пример: (2·10³)(3·10⁴) = 2000 · 30 000 = 60 000 000 = 6·10⁷. И 3 + 4 = 7 ✅.'};},false,true);
G(5,()=>{let a,b,m,n,pm,pe;do{a=R(11,95)/10;b=R(11,95)/10;m=nz(-9,12);n=nz(-12,9);[pm,pe]=norm(a*b,m+n);}while(!Number.isInteger(Math.round(pm*1e4))||m2i(pm)[1]>3);
const raw=Math.round(a*b*1e4)/1e4;const right=sf(pm,pe);
const r=ch(right,[...new Set([sf(pm,m*n),sf(raw,m+n),sf(pm,pe+1),sf(pm,pe-1),sf(Math.round((a+b)*1e3)/1e3,m+n)])].filter(z=>z!==right).slice(0,3));
return {type:'choice',q:`Вычисли и запиши в стандартном виде: <span class="m">(${sf(a,m)}) · (${sf(b,n)})</span>`,opts:r.opts.map(M),ans:r.ans,
short:`${N(a)}·${N(b)} = ${N(raw)}; 10${sup(m)}·10${sup(n)} = 10${sup(m+n)} → ${right}.`,
explain:`1) Мантиссы: ${N(a)} · ${N(b)} = ${N(raw)}.<br>2) Степени: 10${sup(m)} · 10${sup(n)} = 10${sup(m+n)} (показатели складываем: ${N(m)} + ${pn(n)}).<br>3) ${raw>=10?`${N(raw)} ≥ 10 → переносим десятку: ${N(raw)} = ${N(pm)}·10, итого 10${sup(m+n)}·10 = 10${sup(pe)}.`:`${N(raw)} уже от 1 до 10.`}<br>Ответ: <b>${right}</b>.`,
explain2:`Ошибка №1 — перемножить показатели (${N(m)}·${pn(n)} = ${N(m*n)}): так делают только для (10ᵐ)ⁿ. Ошибка №2 — забыть нормализовать: ${N(raw)}·10${sup(m+n)}${raw>=10?' — не стандартный вид':''}.`};});
G(5,()=>{let a,b,m,n,q,pm,pe;do{b=pick([2,4,5,8,1.6,2.5,1.25]);q=R(11,95)/10;a=Math.round(b*q*1e6)/1e6;m=nz(-9,12);n=nz(-12,9);}while(a>=10||a<1||m2i(a)[1]>2);
[pm,pe]=norm(a/b,m-n);const right=sf(pm,pe);
const r=ch(right,[...new Set([sf(pm,m+n),sf(pm,pe+1),sf(pm,pe-1),sf(pm,n-m)])].filter(z=>z!==right).slice(0,3));
return {type:'choice',q:`Вычисли и запиши в стандартном виде: <span class="m">(${sf(a,m)}) : (${sf(b,n)})</span>`,opts:r.opts.map(M),ans:r.ans,
short:`${N(a)} : ${N(b)} = ${N(Math.round(a/b*1e6)/1e6)}; 10${sup(m)} : 10${sup(n)} = 10${sup(m-n)} → ${right}.`,
explain:`1) Мантиссы: ${N(a)} : ${N(b)} = ${N(Math.round(a/b*1e6)/1e6)}.<br>2) Степени: 10${sup(m)} : 10${sup(n)} = 10${sup(m-n)} (${N(m)} − ${pn(n)} = ${N(m-n)}).<br>3) ${a/b<1?`${N(Math.round(a/b*1e6)/1e6)} < 1 → ${N(Math.round(a/b*1e6)/1e6)} = ${N(pm)}·10⁻¹, показатель уменьшаем на 1: ${N(pe)}.`:'Мантисса уже от 1 до 10.'}<br>Ответ: <b>${right}</b>.`,
explain2:`Самое опасное — вычитание отрицательного: ${N(m)} − ${pn(n)} = ${N(m)} ${n<0?'+ '+(-n):'− '+n} = ${N(m-n)}. Если мантисса вышла меньше 1, «занимаем» одну десятку из степени.`};});
G(5,()=>{let a,b,e,d;do{a=R(11,89)/10;b=R(1,9);e=R(3,9);d=R(1,2);}while(a+b/Math.pow(10,d)>=10);
const s=Math.round((a+b/Math.pow(10,d))*1000)/1000;const right=sf(s,e);
const r=ch(right,[...new Set([sf(Math.round((a+b)*1000)/1000,e),sf(Math.round((a+b)*1000)/1000,2*e-d),sf(a,e),sf(Math.round((a+b/10**(d+1))*1e4)/1e4,e)])].filter(z=>z!==right).slice(0,3));
return {type:'choice',q:`Вычисли: <span class="m">${sf(a,e)} + ${sf(b,e-d)}</span>`,opts:r.opts.map(M),ans:r.ans,
short:`${sf(b,e-d)} = ${N(b/Math.pow(10,d))}·10${sup(e)}; ${N(a)} + ${N(b/Math.pow(10,d))} = ${N(s)}.`,
explain:`Складывать можно только при <b>одинаковом порядке</b>. Приведём второе слагаемое к 10${sup(e)}:<br>${sf(b,e-d)} = ${N(b/Math.pow(10,d))}·10${sup(e)} (мантиссу делим на 10${sup(d)}, показатель увеличиваем на ${d}).<br>${N(a)} + ${N(b/Math.pow(10,d))} = ${N(s)} → <b>${right}</b>.`,
explain2:`Переведи в обычные числа: ${sf(a,e)} = ${decSF(a,e)}, ${sf(b,e-d)} = ${decSF(b,e-d)}. Сумма ${decSF(s,e)} = ${right} ✅. А «сложить мантиссы» ${N(a)} + ${b} — это как сложить метры с сантиметрами.`};});

/* L6 */
const PREF=[['кило',3],['мега',6],['гига',9],['милли',-3],['микро',-6],['нано',-9]];
G(6,()=>{const [p,e]=pick(PREF);const others=PREF.filter(x=>x[1]!==e).map(x=>x[1]);const w=sample(others.filter(x=>x!==-e),2).concat([-e]);

return {type:'choice',q:`Приставка <b>«${p}-»</b> означает множитель…`,opts:r.opts.map(M),ans:r.ans,
short:`${p}- = 10${sup(e)}.`,
explain:`Запомни таблицу: кило = 10³, мега = 10⁶, гига = 10⁹; милли = 10⁻³, микро = 10⁻⁶, нано = 10⁻⁹.<br>«${p}-» = <b>10${sup(e)}</b>. Например, 1 ${p}метр = 10${sup(e)} м.`,
explain2:`Шаг между соседними приставками — тысяча (10³). Большие: кило → мега → гига (+3 каждый раз). Маленькие — зеркально: милли → микро → нано (−3). 1 мм = 0,001 м, 1 мкм = 0,000001 м, 1 нм = 0,000000001 м.`};},false,true);
const PLANETS=[['Меркурия',5.8,10],['Венеры',1.08,11],['Земли',1.5,11],['Марса',2.28,11],['Юпитера',7.78,11]];

hint:'Время = расстояние : скорость. Мантиссы делим, показатели вычитаем.',
short:`${F(sf(m,e),'3·10⁸')} = ${N(Math.round(m/3*1e4)/1e4)}·10${sup(e-8)} ≈ ${ans} с.`,
explain:`t = ${F('s','v')} = ${F(sf(m,e),'3·10⁸')} = ${F(N(m),3)}·10${sup(e-8)} ≈ ${N(Math.round(m/3*1e4)/1e4)}·10${sup(e-8)} ≈ <b>${ans} с</b>${ans>=120?` (≈ ${N(Math.round(ans/6)/10)} мин)`:''}.`,

G(7,()=>{let p,q,x,b,i,j;for(;;){b=pick([2,2,3,5]);i=R(1,4);x=-R(1,4);j=-i*x;const lim=b===2?12:b===3?8:4;if(j>lim||i>(b===2?4:2))continue;p=Math.pow(b,i);q=Math.pow(b,j);break;}
