<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Площадь — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box.ex{background:transparent;border:1px dashed var(--line)}
.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#111}}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}
.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.understand label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}
.prof-l{display:flex;align-items:center;gap:4px;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px}
.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}

<script>/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d){try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

/* ---------- state ---------- */
let T=null,LS_KEY='';
const store={get(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}},clear(){try{localStorage.removeItem(LS_KEY);}catch(e){}}};
let S=null;
const MAX_REINFORCE=3;
const $=(sel,el)=>(el||document).querySelector(sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- layout ---------- */
function build(){
  T=window.TOPIC;LS_KEY=window.PROF?PROF.key('trainer:'+T.id):'trainer:'+T.id;
  document.title=T.title+' — тренажёр';
  const symTab=T.symbols?(T.symbols.tab||'Знаки'):null;
  document.body.innerHTML=`
  <header class="top"><div class="wrap">
    <div class="brand"><a class="home" href="index.html">← Все тренажёры</a>${T.title}<small>${T.subtitle||''}</small></div>
    <nav class="tabs" role="tablist">
      <button data-v="theory" aria-selected="true">Теория</button>
      ${symTab?`<button data-v="sym" aria-selected="false">${symTab}</button>`:''}
      <button data-v="train" aria-selected="false">Тренажёр</button>
    </nav>
    <button class="theme-btn" id="themeBtn" title="Светлая / тёмная тема" aria-label="Сменить тему">◐</button>
  </div></header>
  <main class="wrap">
    <section class="view on theory" id="v-theory"></section>
    ${symTab?'<section class="view" id="v-sym"></section>':''}
    <section class="view" id="v-train"></section>
  </main>`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.dataset.theme;
    const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme=dark?'light':'dark';

function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}

    for(const nn of [n,mul(n,-1)])for(const gg of [gp,gp+5])for(const dt of [0,0.1,-0.1,0.2,-0.2,0.3,-0.3])cands.push(place(lerp(A,B,Math.max(0.08,Math.min(0.92,t0+dt))),nn,sd[2],fs,gg));
    const p=choose(cands,sd[2],fs,2);labels+=T(p[0],p[1],sd[2],fs,op.col||'var(--ink)',600);});
  angInfo.forEach(({an,op,Vv,a1,dl,th,rr,n})=>{if(!an[3])return;const fs=op.fs||14;const rad=Math.max(tw(an[3],fs),fs)/2+2;const d=Math.max(rr+(n-1)*4+rad+3,(rad+3)/Math.sin(th/2));const cands=[];
    for(const dd of [0,7,14,22,32])for(const f of [0,0.3,-0.3,0.6,-0.6]){const am=a1+dl/2+f*dl/2;cands.push([Vv[0]+(d+dd)*Math.cos(am),Vv[1]+(d+dd)*Math.sin(am)]);}
    const p=choose(cands,an[3],fs,1.5);labels+=T(p[0],p[1],an[3],fs,'var(--accent-ink)',700);});

/* ---------- shape builders ---------- */
function para(a,b,al){const A=[0,0],D=[a,0],B=polar(A,b,al),C=add(B,D);return {A,B,C,D};}
function paraH(a,h,sx){return {A:[0,0],B:[sx,h],C:[sx+a,h],D:[a,0]};}
function isoTrap(a,b,h){return {A:[0,0],B:[(a-b)/2,h],C:[(a+b)/2,h],D:[a,0]};}
const Q4=['A','B','C','D'];

const NN=x=>N(x).replace(/^(−?)(\d+)/,(m,sg,d)=>sg+(d.length>4?d.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0'):d));
const sq=x=>x*x;
const cm2=x=>N(x)+' см²';
/* rectangle */
function rectFig(a,b,la,lb,o){o=o||{};return geo(Object.assign({P:{A:[0,0],B:[0,b],C:[a,b],D:[a,0]},poly:[Q4],fill:[{pts:Q4,op:0.22}],side:[['A','D',la],['A','B',lb]],lab:o.lab||[],maxH:o.maxH||170,W:o.W||300,pad:44},o.extra||{}));}
/* grid with a filled polygon */
function gridFig(pts,G,o){o=o||{};const P={};pts.forEach((p,i)=>P['p'+i]=p);const keys=Object.keys(P);
  return geo(Object.assign({P,extra:[[G[0],G[1]],[G[2],G[3]]],grid:G,poly:[keys],fill:[{pts:keys,op:0.4}],lab:[],pad:o.pad||10,W:o.W||300,maxH:o.maxH||220},o.extra||{}));}
/* L-shape (top-right corner cut) */
function lShape(W,Hh,w2,h2){return {A:[0,0],B:[0,Hh],C:[W-w2,Hh],E:[W-w2,Hh-h2],F:[W,Hh-h2],D:[W,0]};}
/* triangle: base AC on x-axis, apex B=(x,h) */
function tri(a,x,h){return {A:[0,0],B:[x,h],C:[a,0],H:[x,0]};}

{title:'Что такое площадь',lvl:0,html:`
<p><b>Площадь</b> — это «сколько места занимает фигура на плоскости». Её измеряют <b>единичными квадратами</b>: сколько квадратиков со стороной 1 поместится внутри фигуры.</p>
<div class="fig">${figUnit}</div>
<p class="small" style="text-align:center">Прямоугольник 5 × 3 вмещает 15 квадратиков со стороной 1 см — его площадь 15 см².</p>
<div class="box rule"><b>Свойства площади</b>
1) <b>Равные фигуры имеют равные площади.</b> Если одна фигура накладывается на другую и совпадает, площади одинаковые.<br>
2) <b>Площадь составной фигуры равна сумме площадей частей.</b> Разрезали фигуру на куски — сложили площади кусков.<br>
3) Площадь квадрата со стороной 1 равна 1.</div>
<div class="box tip"><b>Как понимать</b>Площадь — это «краска»: сколько краски уйдёт, чтобы закрасить фигуру. Если фигуру разрезать и переложить куски по-другому, краски понадобится столько же — площадь не меняется.</div>
<p>Обозначают площадь буквой <b>S</b>.</p>`},
{title:'Единицы площади — главная ловушка',lvl:0,html:`
<p>Единицы площади — «квадратные»: см², дм², м², км². Квадрат со стороной 1 см имеет площадь 1 см².</p>

<div class="box rule"><b>Таблица</b>
1 см² = 100 мм² (10 · 10)<br>
1 дм² = 100 см² (10 · 10)<br>

<div class="box ex"><b>Пример</b>3,5 м² = 3,5 · 10 000 = 35 000 см². Обратно: 35 000 см² = 35 000 : 10 000 = 3,5 м².</div>`},
{title:'Прямоугольник и квадрат',lvl:1,html:`

<div class="box tip"><b>Тройки, которые полезно помнить</b>3, 4, 5 (и 6, 8, 10; 9, 12, 15…); 5, 12, 13; 8, 15, 17; 7, 24, 25.</div>
<div class="box err"><b>Ловушка</b>c = a + b — неверно! Складываются <b>квадраты</b>, а потом извлекается корень. 3 + 4 = 7, а гипотенуза 5.</div>
<p><b>Для площадей:</b> Пифагор помогает найти недостающую высоту. Например, в равнобедренном треугольнике с основанием 10 и боковыми сторонами 13 высота к основанию делит его пополам: h² = 13² − 5² = 144, h = 12, S = ½ · 10 · 12 = 60.</p>`},
{title:'Идеи для задач со звёздочкой',lvl:8,html:`
<div class="box rule"><b>1. Три медианы делят треугольник на 6 равновеликих частей</b>Каждая медиана делит площадь пополам, а точка пересечения медиан делит каждую медиану в отношении 2 : 1. Поэтому все шесть маленьких треугольников имеют площадь S : 6, а треугольник AOB — S : 3.</div>
<div class="box rule"><b>2. Треугольник на клетчатой бумаге</b>Дострой его до прямоугольника по линиям сетки и вычти «лишние» прямоугольные треугольники по углам. Проверка — <b>формула Пика</b>: S = В + Г : 2 − 1, где В — узлы сетки внутри фигуры, Г — узлы на границе.</div>
<div class="box rule"><b>3. Диагонали трапеции</b>Треугольники при боковых сторонах (ABO и CDO) имеют <b>равные</b> площади: S(ABD) = S(ACD) (общее основание AD и одинаковая высота), а потом вычитаем общий кусок AOD.</div>
<div class="box rule"><b>4. Точка на стороне параллелограмма</b>Треугольник с основанием AD и вершиной на противоположной стороне занимает ровно <b>половину</b> параллелограмма — та же сторона, та же высота, но ½.</div>
<div class="box tip"><b>Главный приём</b>Ищи треугольники с общей высотой или общим основанием — тогда их площади легко сравнить.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>1 м² = 10 000 см², 1 дм² = 100 см², 1 га = 10 000 м².</li>
<li>Прямоугольник a · b, квадрат a².</li>
<li>Параллелограмм a · h. Треугольник ½ · a · h. Прямоугольный треугольник ½ · a · b.</li>
<li>Ромб ½ · d₁ · d₂. Трапеция ½ · (a + b) · h.</li>
<li>Стороны × k → площадь × k². Медиана делит площадь пополам.</li>
<li>Пифагор: c² = a² + b².</li></ul>`}
];

const gens=[];const G=(lvl,make,star)=>gens.push({lvl,star,make:()=>{for(let i=0;i<300;i++){const t=make();if(t)return t;}return null;}});

/* ===== L0: what is area, units ===== */
G(0,()=>{const W=R(4,7),Hh=R(3,5),w2=R(1,W-2),h2=R(1,Hh-1);const L=lShape(W,Hh,w2,h2);const ans=W*Hh-w2*h2;
 const pts=[L.A,L.B,L.C,L.E,L.F,L.D];const pic=gridFig(pts,[0,0,W,Hh],{W:Math.min(300,W*40+20),maxH:Hh*40+20});
 const r1n=(W-w2)*Hh,r2n=w2*(Hh-h2);
 return {type:'num',q:`Сторона клетки — 1 см. Найди площадь закрашенной фигуры (в см²).`,pic,ans,
 hint:'Посчитай клетки. Удобно разбить фигуру на два прямоугольника.',short:`${r1n} + ${r2n} = ${ans} клеток = ${ans} см².`,
 explain:`Площадь — это сколько клеток (квадратиков 1 см × 1 см) помещается в фигуре.<br>Разобьём фигуру вертикальной линией на два прямоугольника:<br>• левый: ${W-w2} × ${Hh} = ${r1n} клеток;<br>• правый: ${w2} × ${Hh-h2} = ${r2n} клеток.<br>Всего: ${r1n} + ${r2n} = <b>${ans} см²</b>.`,
 explain2:`Другой способ — «достроить и вычесть». Весь прямоугольник ${W} × ${Hh} = ${W*Hh} клеток. Незакрашенный уголок справа сверху: ${w2} × ${h2} = ${w2*h2}. Значит, закрашено ${W*Hh} − ${w2*h2} = ${ans}.`};});
const CONV=[['м²','дм²',100,'1 м = 10 дм'],['м²','см²',10000,'1 м = 100 см'],['дм²','см²',100,'1 дм = 10 см'],['см²','мм²',100,'1 см = 10 мм'],['га','м²',10000,'1 га — квадрат 100 м × 100 м'],['а (сотка)','м²',100,'1 сотка — квадрат 10 м × 10 м'],['км²','га',100,'1 км = 1000 м, 1 км² = 1 000 000 м² = 100 га']];
G(0,()=>{const c=pick(CONV);const x=pick([2,3,4,5,6,7,8,9,12,15,25,1.5,2.5,3.5]);const ans=x*c[2];const side=Math.round(Math.sqrt(c[2]));
 return {type:'num',q:`Вырази в <b>${c[1]}</b>: ${N(x)} ${c[0]}.`,ans,
 hint:'Сколько маленьких квадратиков помещается в одном большом? Помни: множитель для площади берётся «два раза».',short:`1 ${c[0]} = ${NN(c[2])} ${c[1]}, поэтому ${N(x)} · ${NN(c[2])} = ${NN(ans)}.`,
 explain:`${c[3]}. Квадрат со стороной «1 большая единица» — это ${side} рядов по ${side} маленьких квадратиков: 1 ${c[0]} = ${side} · ${side} = <b>${NN(c[2])} ${c[1]}</b>.<br>${N(x)} ${c[0]} = ${N(x)} · ${NN(c[2])} = <b>${NN(ans)} ${c[1]}</b>.<div class="box err"><b>Ловушка</b>${N(x)} · ${side} = ${N(x*side)} — так умножили только «по длине», а у площади есть ещё ширина.</div>`,
 explain2:c[1]==='см²'&&c[0]==='дм²'?`Посмотри: 1 дм² — это квадрат 10 × 10 см.${fig(figDm)}В нём 100 клеточек по 1 см². А у нас ${N(x)} таких квадратов: ${N(x)} · 100 = ${NN(ans)}.`:`Представь квадратную площадку площадью 1 ${c[0]} и плитки площадью 1 ${c[1]}. Вдоль одной стороны площадки помещается ${side} плиток, вдоль другой — тоже ${side}. Всего плиток ${side} · ${side} = ${NN(c[2])}. Таких площадок у нас ${N(x)} → ${N(x)} · ${NN(c[2])} = ${NN(ans)}.`};});
G(0,()=>{const c=pick(CONV.slice(0,4));const big=pick([2,3,4,5,7,1.5,2.5,0.5,0.25,0.8]);const small=big*c[2];const side=Math.round(Math.sqrt(c[2]));
 return {type:'num',q:`Вырази в <b>${c[0]}</b>: ${NN(small)} ${c[1]}.`,ans:big,
 short:`${NN(small)} : ${NN(c[2])} = ${N(big)}.`,
 explain:`1 ${c[0]} = ${side} · ${side} = ${NN(c[2])} ${c[1]}. Переходим к <b>более крупной</b> единице — значит, делим:<br>${NN(small)} : ${NN(c[2])} = <b>${N(big)} ${c[0]}</b>.<div class="box err"><b>Ловушка</b>${NN(small)} : ${side} = ${N(small/side)} — неверно: делить надо на ${NN(c[2])}, а не на ${side}.</div>`,
 explain2:`Спроси себя: «Сколько раз по ${NN(c[2])} ${c[1]} помещается в ${NN(small)} ${c[1]}?» Каждые ${NN(c[2])} ${c[1]} — это один ${c[0]}. ${NN(small)} : ${NN(c[2])} = ${N(big)}. Проверка обратно: ${N(big)} · ${NN(c[2])} = ${NN(small)} ✅.`};});
G(0,()=>{const v=pick([['см²','м²',['100','1000','10 000','1 000 000'],2,'1 м = 100 см',100],['дм²','м²',['10','100','1000','10 000'],1,'1 м = 10 дм',10],['мм²','см²',['10','100','1000','10 000'],1,'1 см = 10 мм',10],['м²','га',['100','1000','10 000','100 000'],2,'1 га — квадрат 100 м × 100 м',100]]);const lin=v[5];
 return {type:'choice',q:`Сколько ${v[0]} в 1 ${v[1]}?`,opts:v[2],ans:v[3],
 short:`${v[4]}, поэтому 1 ${v[1]} = ${lin} · ${lin} = ${v[2][v[3]]} ${v[0]}.`,
 explain:`${v[4]}. Значит, квадрат 1 ${v[1]} вмещает ${lin} рядов по ${lin} квадратиков 1 ${v[0]}: всего ${lin} · ${lin} = <b>${v[2][v[3]]}</b>.<div class="box err"><b>Почему не ${lin}</b>${lin} — это множитель только для длины. Для площади его берём два раза — по длине и по ширине.</div>`,
 explain2:`Маленький пример: квадрат 3 × 3 клетки — это не 3, а 3 · 3 = 9 клеток. Так же и здесь: «${lin} по длине» превращается в «${lin} · ${lin} = ${v[2][v[3]]}» по площади.`};});
G(0,()=>{const parts=[R(3,15),R(3,15),R(3,15)];const s=parts[0]+parts[1]+parts[2];
 return {type:'num',q:`Квадрат разрезали на три части с площадями ${parts.join(' см², ')} см² и сложили из них треугольник (без наложений и дыр). Найди площадь треугольника.`,ans:s,
 hint:'Меняется ли площадь, если куски переложить по-другому?',short:`Площадь не меняется: ${parts.join(' + ')} = ${s} см².`,
 explain:`Площадь составной фигуры равна <b>сумме площадей её частей</b>. Треугольник состоит из тех же трёх кусков:<br>${parts.join(' + ')} = <b>${s} см²</b>.<br>Форма поменялась, а площадь — нет.`,
 explain2:`Представь, что куски — из бумаги, и ты их красишь. Сколько краски нужно на все куски, столько же нужно и на треугольник, и на квадрат — бумага та же самая. ${s} см².`};});

/* ===== L1: rectangle & square ===== */
G(1,()=>{const a=R(3,15),b=R(2,12);if(a===b)return null;
 return {type:'num',q:`Найди площадь прямоугольника со сторонами ${a} см и ${b} см.`,pic:rectFig(Math.max(a,b),Math.min(a,b),String(Math.max(a,b)),String(Math.min(a,b))),ans:a*b,
 short:`${a} · ${b} = ${a*b} см².`,
 explain:`Площадь прямоугольника — длина на ширину: <span class="m">S = a · b</span>.<br>S = ${a} · ${b} = <b>${a*b} см²</b>.<div class="box err"><b>Не путай с периметром</b>2 · (${a} + ${b}) = ${2*(a+b)} см — это периметр, длина «забора» вокруг.</div>`,
 explain2:`В прямоугольник помещается ${Math.min(a,b)} ${plural(Math.min(a,b),'ряд','ряда','рядов')} по ${Math.max(a,b)} квадратиков 1 см × 1 см. Всего ${Math.min(a,b)} · ${Math.max(a,b)} = ${a*b} квадратиков, то есть ${a*b} см².`};});
G(1,()=>{const a=R(3,14),b=R(2,13);if(a===b)return null;const S=a*b;
 return {type:'num',q:`Площадь прямоугольника ${S} см², одна из сторон ${a} см. Найди другую сторону.`,pic:rectFig(Math.max(a,b),Math.min(a,b),a>b?String(a):'?',a>b?'?':String(a)),ans:b,
 short:`${S} : ${a} = ${b} см.`,
 explain:`S = a · b, значит b = S : a = ${S} : ${a} = <b>${b} см</b>.<br>Проверка: ${a} · ${b} = ${S} ✅.`,
 explain2:`${S} квадратиков разложили в ряды по ${a}. Сколько получится рядов? ${S} : ${a} = ${b}. Это и есть вторая сторона.`};});
G(1,()=>{const a=R(3,15);const P=4*a;
 return {type:'num',q:`Периметр квадрата ${P} см. Найди его площадь.`,pic:rectFig(1,1,'?','?',{maxH:120}),ans:a*a,
 hint:'Сначала найди сторону.',short:`Сторона ${P} : 4 = ${a}, площадь ${a}² = ${a*a} см².`,
 explain:`1) У квадрата 4 равные стороны: a = ${P} : 4 = ${a} см.<br>2) S = a² = ${a} · ${a} = <b>${a*a} см²</b>.<div class="box err"><b>Ошибка</b>${P} : 4 = ${a} — это сторона, а не площадь. И ${P}² тоже не площадь.</div>`,
 explain2:`Квадрат — как квадратная клумба с забором длиной ${P} м. На каждую сторону уходит ${a} м забора. Внутри помещается ${a} рядов по ${a} квадратных метров: ${a*a} м².`};});
G(1,()=>{const v=pick([['м','дм',10],['дм','см',10],['м','см',100]]);let a,b;
 if(v[2]===100){a=pick([1,2,3]);b=pick([20,25,40,50,60,75]);}else{a=R(2,6);b=R(3,9);}
 const aS=a*v[2],ans=aS*b;
 return {type:'num',q:`Длина прямоугольника ${a} ${v[0]}, ширина ${b} ${v[1]}. Найди площадь в <b>${v[1]}²</b>.`,ans,
 hint:'Сначала переведи обе стороны в одинаковые единицы.',short:`${a} ${v[0]} = ${aS} ${v[1]}; ${aS} · ${b} = ${ans} ${v[1]}².`,
 explain:`Перемножать можно только длины в <b>одинаковых</b> единицах.<br>1) ${a} ${v[0]} = ${a} · ${v[2]} = ${aS} ${v[1]}.<br>2) S = ${aS} · ${b} = <b>${ans} ${v[1]}²</b>.<div class="box err"><b>Ошибка</b>${a} · ${b} = ${a*b} — неверно: перемножили «${v[0]}» на «${v[1]}», получилась ни то ни сё.</div>`,
 explain2:`Представь, что считаешь плитки ${v[1]} × ${v[1]}. Вдоль длины их помещается ${aS} (ведь ${a} ${v[0]} = ${aS} ${v[1]}), вдоль ширины — ${b}. Всего ${aS} · ${b} = ${ans} плиток.`};});

 const pic=geo({P:L,poly:[['A','B','C','E','F','D']],fill:[{pts:['A','B','C','E','F','D'],op:0.3}],side:[['A','D',String(W)],['A','B',String(Hh)],['C','E',String(h2)],['E','F',String(w2)]],lab:[],maxH:200});
 const pic2=geo({P:L,poly:[['A','B','C','E','F','D']],fill:[{pts:['A','B','C',[W-w2,0]],op:0.4},{pts:[[W-w2,0],'E','F','D'],op:0.15}],seg:[[[W-w2,0],'E',{dash:true}]],side:[['A','D',String(W)],['A','B',String(Hh)],['C','E',String(h2)],['E','F',String(w2)],['B','C',String(W-w2),{col:'var(--accent-ink)'}],['F','D',String(Hh-h2),{col:'var(--accent-ink)'}]],lab:[],maxH:200});
 return {type:'num',q:`Найди площадь фигуры (все углы прямые, размеры в см).`,pic,ans,
 hint:'Дострой фигуру до прямоугольника или разрежь на два.',short:`${W} · ${Hh} − ${w2} · ${h2} = ${W*Hh} − ${w2*h2} = ${ans} см².`,
 explain:`Достроим фигуру до прямоугольника ${W} × ${Hh}: его площадь ${W*Hh}.<br>Не хватает уголка ${w2} × ${h2} = ${w2*h2}.<br>S = ${W*Hh} − ${w2*h2} = <b>${ans} см²</b>.`,
 explain2:`Разрежем пунктиром на два прямоугольника:${fig(pic2)}Левый: ${W-w2} · ${Hh} = ${(W-w2)*Hh} (ширина ${W} − ${w2} = ${W-w2}). Правый: ${w2} · ${Hh-h2} = ${w2*(Hh-h2)} (высота ${Hh} − ${h2} = ${Hh-h2}). Вместе: ${(W-w2)*Hh} + ${w2*(Hh-h2)} = ${ans}.`};});
G(2,()=>{const a=R(8,16),b=R(6,12),c=R(2,a-4),d=R(2,b-3);if(c>=a-2||d>=b-2)return null;const ans=a*b-c*d;const ox=(a-c)/2,oy=(b-d)/2;
 const P={A:[0,0],B:[0,b],C:[a,b],D:[a,0],E:[ox,oy],F:[ox,oy+d],K:[ox+c,oy+d],L:[ox+c,oy]};
 const pic=geo({P,poly:[Q4,['E','F','K','L']],fill:[{pts:Q4,op:0.35},{pts:['E','F','K','L'],col:'var(--card)',op:1}],side:[['A','D',String(a)],['A','B',String(b)],['F','K',String(c),{flip:true}],['E','F',String(d),{flip:true}]],lab:[],maxH:200});
 return {type:'num',q:`Из прямоугольного листа ${a} × ${b} см вырезали прямоугольную дырку ${c} × ${d} см. Найди площадь оставшейся рамки.`,pic,ans,

 explain2:`Представь пиццу без серединки: сколько осталось теста? Сколько было (${a*b}) минус сколько вырезали (${c*d}). Остаток ${ans}. Где дырка — посередине или сбоку — не важно.`};});
G(2,()=>{const c=pick([20,25,50]);const k=100/c;const a=R(2,6),b=R(2,5);const na=a*k,nb=b*k,ans=na*nb;
 return {type:'num',q:`Пол комнаты — прямоугольник ${a} м × ${b} м. Сколько квадратных плиток ${c} × ${c} см нужно, чтобы покрыть пол?`,ans,
 hint:'Сколько плиток поместится вдоль длины комнаты? А вдоль ширины?',short:`${na} · ${nb} = ${ans} плиток.`,
 explain:`1) Вдоль длины: ${a} м = ${a*100} см, плиток ${a*100} : ${c} = ${na}.<br>2) Вдоль ширины: ${b*100} : ${c} = ${nb}.<br>3) Всего: ${na} · ${nb} = <b>${ans}</b>.<div class="box err"><b>Ловушка</b>${a} · ${b} = ${a*b} м², плитка ${c} · ${c} = ${c*c} см². Делить ${a*b} на ${c*c} нельзя — единицы разные. Надо ${a*b} м² = ${NN(a*b*10000)} см², тогда ${NN(a*b*10000)} : ${c*c} = ${ans}.</div>`,
 explain2:`Второй способ — через площади. Пол: ${a} · ${b} = ${a*b} м² = ${NN(a*b*10000)} см². Одна плитка: ${c*c} см². Сколько плиток: ${NN(a*b*10000)} : ${c*c} = ${ans}. Ответы совпали ✅.`};});
G(2,()=>{const a=R(8,16),c=R(1,Math.floor(a/3));const ans=a*a-4*c*c;
 const P={A:[0,0],B:[0,a],C:[a,a],D:[a,0]};const pts=[[c,0],[c,c],[0,c],[0,a-c],[c,a-c],[c,a],[a-c,a],[a-c,a-c],[a,a-c],[a,c],[a-c,c],[a-c,0]];pts.forEach((p,i)=>P['p'+i]=p);const ks=pts.map((_,i)=>'p'+i);
 const pic=geo({P,poly:[ks],fill:[{pts:ks,op:0.35}],seg:[['A',[c,0],{dash:true,col:'var(--muted)'}],['A',[0,c],{dash:true,col:'var(--muted)'}]],side:[[[c,0],[a-c,0],`${a-2*c}`,{col:'var(--muted)',fs:12}],['p0','p1',String(c)]],txt:[[[a/2,a/2],`лист ${a} × ${a}`,{fs:13,col:'var(--muted)'}]],lab:[],maxH:200,W:220});
 return {type:'num',q:`Из квадратного листа со стороной ${a} см по углам вырезали 4 квадрата со стороной ${c} см. Найди площадь оставшейся фигуры.`,pic,ans,
 short:`${a}² − 4 · ${c}² = ${a*a} − ${4*c*c} = ${ans} см².`,
 explain:`1) Площадь листа: ${a} · ${a} = ${a*a}.<br>2) Один вырезанный квадрат: ${c} · ${c} = ${c*c}, четыре: 4 · ${c*c} = ${4*c*c}.<br>3) Осталось: ${a*a} − ${4*c*c} = <b>${ans} см²</b>.`,
 explain2:`Можно и «крестом» посчитать: середина-полоса ${a} × ${a-2*c} = ${a*(a-2*c)} плюс два «ушка» по ${c} × ${a-2*c} = ${c*(a-2*c)}: ${a*(a-2*c)} + 2 · ${c*(a-2*c)} = ${ans}. Тот же ответ.`};});

/* ===== L3: parallelogram ===== */
G(3,()=>{const a=R(5,14),h=R(Math.max(3,Math.ceil(a*0.4)),Math.max(5,Math.ceil(a*0.75)));const sx=a*R(25,60)/100;const p=paraH(a,h,sx);p.H=[sx,0];const b=Math.hypot(sx,h);
 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],side:[['A','D',String(a)],['B','H',String(h),{flip:true}],['A','B',N(Math.round(b*10)/10),{col:'var(--muted)'}]],maxH:190});
 const bb=Math.round(b*10)/10;
 return {type:'num',q:`Найди площадь параллелограмма ABCD: AD = ${a}, высота BH = ${h}, боковая сторона AB ≈ ${N(bb)}.`,pic,ans:a*h,
 hint:'Какая длина нужна: наклонная сторона или высота?',short:`S = AD · BH = ${a} · ${h} = ${a*h}.`,
 explain:`Площадь параллелограмма = сторона · <b>высота к этой стороне</b>: S = AD · BH = ${a} · ${h} = <b>${a*h}</b>.<div class="box err"><b>Ловушка</b>AB ≈ ${N(bb)} — наклонная сторона, не высота. ${a} · ${N(bb)} — неверно.</div>`,
 explain2:`Отрежь треугольник ABH и перенеси его к правому краю — получится прямоугольник ${a} × ${h}.${fig(figCut1)}Площадь прямоугольника ${a} · ${h} = ${a*h}. Наклонная сторона пропала — она в прямоугольнике не нужна.`};});
G(3,()=>{const a=R(4,13),h=R(3,10);const S=a*h;const sx=a*0.4;const p=paraH(a,h,sx);p.H=[sx,0];
 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],side:[['A','D',String(a)],['B','H','?',{flip:true}]],txt:[[[a/2+sx/2+a*0.12,h*0.45],'S = '+S,{fs:14,col:'var(--accent-ink)'}]],maxH:190});
 return {type:'num',q:`Площадь параллелограмма ${S} см², сторона AD = ${a} см. Найди высоту, проведённую к стороне AD.`,pic,ans:h,
 short:`h = S : a = ${S} : ${a} = ${h} см.`,
 explain:`S = a · h, поэтому h = S : a = ${S} : ${a} = <b>${h} см</b>.<br>Проверка: ${a} · ${h} = ${S} ✅.`,
 explain2:`Параллелограмм «перекраиваем» в прямоугольник с основанием ${a}. Его площадь та же — ${S}. Какой высоты должен быть прямоугольник, чтобы ${a} · ? = ${S}? Ответ ${h}.`};});
G(3,()=>{const nm=sample(['H','K','M','E','P'],2);const a=10,h=R(45,65)/10,sx=R(15,45)/10;const p=paraH(a,h,sx);p[nm[0]]=[sx,0];let kx=sx+pick([-1,1])*R(25,40)/10;if(kx<0.6||kx>a-0.6)kx=sx+(sx<5?3:-3);p[nm[1]]=[kx,0];
 const opts=shuffle(['B'+nm[0],'B'+nm[1],'BD','AB']);
 const pic=geo({P:p,poly:[Q4],seg:[['B',nm[0],{dash:true}],['B',nm[1],{dash:true}],['B','D',{dash:true,col:'var(--muted)'}]],maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['B',nm[0],{col:'var(--accent)',sw:2.4}],['B',nm[1],{dash:true,col:'var(--muted)'}]],rt:[[nm[0],'D','B']],lab:['A','B','C','D',nm[0],nm[1]],maxH:190});
 return {type:'choice',q:`Какой отрезок — <b>высота</b> параллелограмма, проведённая к стороне AD?`,pic,opts,ans:opts.indexOf('B'+nm[0]),
 short:`B${nm[0]} перпендикулярен AD — это высота.`,
 explain:`Высота — это <b>перпендикуляр</b> из вершины к стороне: он образует с ней прямой угол 90°.${fig(pic2)}B${nm[0]} падает на AD «отвесно», под прямым углом — это высота.<br>B${nm[1]} — наклонный отрезок (угол не 90°), BD — диагональ, AB — сторона. Они длиннее высоты.`,
 explain2:`Представь, что из точки B падает камешек вниз, на «пол» AD. Он летит по кратчайшему пути — строго вертикально. Куда он упадёт — там и основание высоты: точка ${nm[0]}. Любой другой отрезок из B до AD длиннее и наклонён.`};});
G(3,()=>{for(;;){const a=R(6,16),b=R(4,14);if(a===b)continue;const ha=R(2,Math.min(b-1,10));if(ha<0.57*b)continue;const S=a*ha;if(S%b)continue;const hb=S/b;if(hb>=a)continue;
 const al=Math.asin(ha/b)/D2R;const p=para(a,b,al);p.H=[p.B[0],0];p.K=foot(p.D,p.B,p.C);if(p.K[0]<p.B[0]||p.K[0]>p.C[0])continue;
 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}],['D','K',{dash:true}]],rt:[['H','D','B'],['K','C','D']],side:[['A','D',String(a)],['A','B',String(b)],['B','H',String(ha),{flip:true}],['D','K','?',{flip:true}]],maxH:200});
 return {type:'num',q:`Стороны параллелограмма ${a} и ${b}. Высота, проведённая к стороне ${a}, равна ${ha}. Найди высоту, проведённую к стороне ${b}.`,pic,ans:hb,
 hint:'Посчитай площадь одним способом, а потом запиши её другим.',short:`S = ${a} · ${ha} = ${S}; h = ${S} : ${b} = ${hb}.`,
 explain:`Площадь одна и та же, как её ни считай:<br>1) S = ${a} · ${ha} = ${S}.<br>2) S = ${b} · h → h = ${S} : ${b} = <b>${hb}</b>.<br>Обрати внимание: к <b>длинной</b> стороне высота <b>короче</b>, к короткой — длиннее.`,
 explain2:`Это как два прямоугольника с одинаковой площадью ${S}: один ${a} × ${ha}, другой ${b} × ?. Если основание стало ${a>b?'короче':'длиннее'}, высота должна стать ${a>b?'больше':'меньше'}, чтобы площадь сохранилась: ${S} : ${b} = ${hb}.`};}});
G(3,()=>{const b=2*R(2,7);const a=R(Math.ceil(0.87*b)+1,Math.ceil(0.87*b)+7);const h=b/2;const S=a*h;const p=para(a,b,30);p.H=[p.B[0],0];
 const pic=geo({P:p,poly:[Q4],ang:[['A','D','B','30°',{r:32}]],side:[['A','D',String(a)],['A','B',String(b)]],lab:Q4,maxH:170});
 const pic2=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],fill:[{pts:['A','B','H']}],ang:[['A','D','B','30°',{r:32}]],side:[['A','D',String(a)],['A','B',String(b)],['B','H',N(h),{flip:true,col:'var(--accent-ink)'}]],maxH:170});
 return {type:'num',q:`Стороны параллелограмма ${a} и ${b}, угол между ними 30°. Найди площадь.`,pic,ans:S,
 hint:'Проведи высоту из B. Что ты знаешь о катете против угла 30°?',short:`h = ${b} : 2 = ${N(h)}; S = ${a} · ${N(h)} = ${N(S)}.`,
 explain:`1) Проведём высоту BH. В прямоугольном треугольнике ABH угол A = 30°.<br>2) Катет, лежащий против угла 30°, равен половине гипотенузы: BH = AB : 2 = ${b} : 2 = ${N(h)}.<br>3) S = AD · BH = ${a} · ${N(h)} = <b>${N(S)}</b>.<div class="box err"><b>Ошибка</b>${a} · ${b} = ${a*b} — так считают прямоугольник. У «скошенного» параллелограмма площадь меньше.</div>`,
 explain2:`${fig(pic2)}Треугольник с углом 30° — это половинка равностороннего треугольника, поэтому короткий катет ровно вдвое короче гипотенузы. Высота ${N(h)}, площадь ${a} · ${N(h)} = ${N(S)} — ровно половина от «прямоугольных» ${a*b}.`};});

/* ===== L4: triangle ===== */
G(4,()=>{const a=R(5,14),h=R(3,10);const x=a*R(25,70)/100;const t=tri(a,x,h);const S=a*h/2;
 const pic=geo({P:t,poly:[['A','B','C']],seg:[['B','H',{dash:true}]],rt:[['H','C','B']],side:[['A','C',String(a)],['B','H',String(h),{flip:true}]],maxH:190});
 const P2=Object.assign({},t,{D:[a,h],E:[0,h]});
 const pic2=geo({P:P2,poly:[['A','E','D','C'],['A','B','C']],fill:[{pts:['A','B','C'],op:0.45}],seg:[['B','H',{dash:true}]],side:[['A','C',String(a)],['A','E',String(h)]],lab:['A','B','C','H'],maxH:190});
 return {type:'num',q:`Найди площадь треугольника ABC, если AC = ${a}, а высота BH = ${h}.`,pic,ans:S,
 short:`½ · ${a} · ${h} = ${N(S)}.`,
 explain:`S = ½ · a · h, где h — высота к стороне a.<br>S = ½ · ${a} · ${h} = ${a*h} : 2 = <b>${N(S)}</b>.<div class="box err"><b>Не забудь ½</b>${a} · ${h} = ${a*h} — это площадь прямоугольника, а треугольник — его половина.</div>`,
 explain2:`Обведём треугольник прямоугольником ${a} × ${h}:${fig(pic2)}Высота BH делит прямоугольник на две части, и в каждой треугольник занимает ровно половину. Значит, треугольник — половина прямоугольника: ${a*h} : 2 = ${N(S)}.`};});
G(4,()=>{const a=R(3,14),b=R(3,12);if(a===b||a*b%2&&Math.random()<0.6)return null;const S=a*b/2;const t={A:[0,b],B:[0,0],C:[a,0]};
 const pic=geo({P:t,poly:[['A','B','C']],rt:[['B','C','A']],side:[['B','C',String(a)],['A','B',String(b)]],maxH:190});
 const P2=Object.assign({},t,{D:[a,b]});const pic2=geo({P:P2,poly:[['A','B','C','D']],seg:[['A','C']],fill:[{pts:['A','B','C'],op:0.45}],side:[['B','C',String(a)],['A','B',String(b)]],lab:['A','B','C'],maxH:190});
 return {type:'num',q:`Катеты прямоугольного треугольника равны ${a} и ${b}. Найди его площадь.`,pic,ans:S,
 short:`½ · ${a} · ${b} = ${N(S)}.`,
 explain:`В прямоугольном треугольнике один катет — это высота к другому. Поэтому S = ½ · a · b = ½ · ${a} · ${b} = <b>${N(S)}</b>.`,
 explain2:`Дострой треугольник до прямоугольника ${a} × ${b}:${fig(pic2)}Диагональ режет прямоугольник на два одинаковых треугольника. Площадь прямоугольника ${a*b}, треугольника — половина: ${N(S)}.`};});
G(4,()=>{const a=R(4,10),h=R(3,8),x=-R(15,40)/10;const t=tri(a,x,h);const S=a*h/2;
 const pic=geo({P:t,poly:[['A','B','C']],seg:[['B','H',{dash:true}],['H','A',{dash:true,col:'var(--muted)'}]],rt:[['H','C','B']],side:[['A','C',String(a)],['B','H',String(h)]],maxH:190});
 return {type:'num',q:`В тупоугольном треугольнике ABC сторона AC = ${a}, а высота BH, проведённая к прямой AC, равна ${h} (она падает на продолжение стороны). Найди площадь.`,pic,ans:S,
 short:`½ · ${a} · ${h} = ${N(S)}.`,
 explain:`Формула та же: S = ½ · AC · BH = ½ · ${a} · ${h} = <b>${N(S)}</b>.<br>То, что высота упала за пределы треугольника, ничего не меняет: важно только, что она перпендикулярна прямой AC.`,
 explain2:`Посмотри на треугольник как на «большой минус маленький»: большой прямоугольный HBC с катетами ${N(a-x)} и ${h} минус маленький HBA с катетами ${N(-x)} и ${h}: ½ · ${N(a-x)} · ${h} − ½ · ${N(-x)} · ${h} = ½ · (${N(a-x)} − ${N(-x)}) · ${h} = ½ · ${a} · ${h} = ${N(S)}.`};});
G(4,()=>{const t=tri(6,-R(15,30)/10,R(30,45)/10);
 const opts=shuffle(['½ · AC · BH','½ · AB · BH','½ · BC · BH','AC · BH']);
 const pic=geo({P:t,poly:[['A','B','C']],seg:[['B','H',{dash:true}],['H','A',{dash:true,col:'var(--muted)'}]],rt:[['H','C','B']],maxH:170});
 return {type:'choice',q:`BH — высота треугольника ABC. По какой формуле можно найти его площадь?`,pic,opts,ans:opts.indexOf('½ · AC · BH'),
 short:'BH проведена к прямой AC, поэтому S = ½ · AC · BH.',
 explain:`Высота «работает» в паре только с той стороной, к которой она проведена. BH перпендикулярна прямой <b>AC</b> → S = ½ · AC · BH.<br>• ½ · AB · BH и ½ · BC · BH — неверно: BH не перпендикулярна AB и BC.<br>• AC · BH — забыли ½, это площадь параллелограмма.`,
 explain2:`Ищи значок прямого угла: он стоит там, где высота встречает прямую AC (в точке H, на продолжении стороны). Значит, пара «сторона + высота» — это AC и BH. И не забудь половинку.`};});
G(4,()=>{const a=R(4,16),h=R(2,12);const S=a*h/2;if(S!==Math.floor(S))return null;const x=a*0.35;const t=tri(a,x,h);
 const pic=geo({P:t,poly:[['A','B','C']],seg:[['B','H',{dash:true}]],rt:[['H','C','B']],side:[['A','C',String(a)],['B','H','?',{flip:true}]],maxH:180});
 return {type:'num',q:`Площадь треугольника ${S}, сторона AC = ${a}. Найди высоту, проведённую к AC.`,pic,ans:h,
 short:`h = 2S : a = ${2*S} : ${a} = ${h}.`,
 explain:`S = ½ · a · h → 2S = a · h → h = 2S : a.<br>h = 2 · ${S} : ${a} = ${2*S} : ${a} = <b>${h}</b>.<div class="box err"><b>Ошибка</b>${S} : ${a} = ${N(S/a)} — забыли, что в формуле есть ½. Сначала удвой площадь.</div>`,
 explain2:`Удвоим треугольник до параллелограмма: его площадь ${2*S}, основание ${a}. Высота у них общая: ${2*S} : ${a} = ${h}.`};});

/* ===== L5: rhombus & trapezoid ===== */
G(5,()=>{const d1=2*R(3,9),d2=2*R(2,8);if(d1===d2)return null;const S=d1*d2/2;const P={A:[0,d2/2],B:[d1/2,d2],C:[d1,d2/2],D:[d1/2,0],O:[d1/2,d2/2]};
 const pic=geo({P,poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],rt:[['O','C','B']],side:[['A','C',String(d1),{t:0.28}],['B','D',String(d2),{t:0.25}]],lab:Q4,dir:{A:180,C:0},maxH:200});
 const pic2=geo({P:Object.assign({},P,{E:[0,0],F:[0,d2],G:[d1,d2],K:[d1,0]}),poly:[['E','F','G','K'],Q4],fill:[{pts:Q4,op:0.45}],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],side:[['E','K',String(d1),{t:0.25}],['E','F',String(d2),{t:0.22}]],lab:Q4,dir:{A:180,C:0},maxH:200});
 return {type:'num',q:`Диагонали ромба равны ${d1} и ${d2}. Найди площадь ромба.`,pic,ans:S,
 short:`½ · ${d1} · ${d2} = ${S}.`,
 explain:`Площадь ромба — половина произведения диагоналей: S = ½ · d₁ · d₂ = ½ · ${d1} · ${d2} = ${d1*d2} : 2 = <b>${S}</b>.`,
 explain2:`Обведи ромб прямоугольником ${d1} × ${d2}:${fig(pic2)}Диагонали режут прямоугольник на 8 одинаковых треугольников, 4 из них — внутри ромба. Значит, ромб — ровно половина: ${d1*d2} : 2 = ${S}.`};});
G(5,()=>{const d1=R(4,16),d2=R(4,16);if(d1===d2||d1*d2%2)return null;const S=d1*d2/2;
 return {type:'num',q:`Площадь ромба ${S}, одна из диагоналей ${d1}. Найди другую диагональ.`,ans:d2,
 short:`d₂ = 2S : d₁ = ${2*S} : ${d1} = ${d2}.`,
 explain:`S = ½ · d₁ · d₂ → d₁ · d₂ = 2S = ${2*S}.<br>d₂ = ${2*S} : ${d1} = <b>${d2}</b>.<div class="box err"><b>Ошибка</b>${S} : ${d1} = ${N(Math.round(S/d1*100)/100)} — забыли про ½: сначала удвой площадь.</div>`,
 explain2:`Прямоугольник, описанный вокруг ромба, имеет площадь вдвое больше: ${2*S}. Его стороны — это диагонали ромба. Одна сторона ${d1}, значит другая ${2*S} : ${d1} = ${d2}.`};});
G(5,()=>{const a=R(7,16),b=R(3,a-2),h=R(3,9);if((a+b)*h%2)return null;const S=(a+b)*h/2;const sx=(a-b)*R(25,75)/100;const p={A:[0,0],B:[sx,h],C:[sx+b,h],D:[a,0],H:[sx,0]};
 const pic=geo({P:p,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],side:[['A','D',String(a)],['B','C',String(b)],['B','H',String(h),{flip:true}]],maxH:190});
 const pic2=geo({P:p,poly:[Q4],seg:[['B','D',{col:'var(--accent)'}]],fill:[{pts:['A','B','D'],op:0.4},{pts:['B','C','D'],op:0.15}],side:[['A','D',String(a)],['B','C',String(b)]],lab:Q4,maxH:190});
 return {type:'num',q:`Основания трапеции ${a} и ${b}, высота ${h}. Найди площадь трапеции.`,pic,ans:S,
 short:`½ · (${a} + ${b}) · ${h} = ${N(S)}.`,
 explain:`S = ½ · (a + b) · h = ½ · (${a} + ${b}) · ${h} = ½ · ${a+b} · ${h} = <b>${N(S)}</b>.<div class="box err"><b>Ошибка</b>${a} · ${h} или ${a+b} · ${h} = ${(a+b)*h} — забыли половину суммы оснований.</div>`,
 explain2:`Разрежь трапецию диагональю BD на два треугольника с одинаковой высотой ${h}:${fig(pic2)}½ · ${a} · ${h} = ${N(a*h/2)} и ½ · ${b} · ${h} = ${N(b*h/2)}. Вместе ${N(S)}.`};});
G(5,()=>{const a=R(7,18),b=R(2,a-2),h=R(2,10);if((a+b)*h%2)return null;const S=(a+b)*h/2;
 return {type:'num',q:`Площадь трапеции ${N(S)}, основания ${a} и ${b}. Найди высоту.`,ans:h,
 short:`h = 2S : (a + b) = ${N(2*S)} : ${a+b} = ${h}.`,
 explain:`S = ½ · (a + b) · h → h = 2S : (a + b).<br>h = ${N(2*S)} : (${a} + ${b}) = ${N(2*S)} : ${a+b} = <b>${h}</b>.`,
 explain2:`Средняя линия трапеции m = (${a} + ${b}) : 2 = ${N((a+b)/2)}. Площадь = m · h, значит h = ${N(S)} : ${N((a+b)/2)} = ${h}.`};});
G(5,()=>{const d=R(2,14);const S=d*d/2;const s=d/Math.SQRT2;const P={A:[0,0],B:[0,s],C:[s,s],D:[s,0]};
 const pic=geo({P,poly:[Q4],seg:[['A','C']],rt:[['A','D','B']],side:[['A','C',String(d),{flip:true,t:0.6}]],maxH:170,W:220});
 const pic2=geo({P:Object.assign({},P,{O:[s/2,s/2]}),poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],fill:[{pts:['A','B','C','D'],op:0.3}],rt:[['O','C','B']],lab:Q4,maxH:170,W:220});
 return {type:'num',q:`Диагональ квадрата равна ${d}. Найди его площадь.`,pic,ans:S,
 hint:'Квадрат — это тоже ромб. Какая формула площади ромба?',short:`Квадрат — ромб: S = ½ · ${d} · ${d} = ${N(S)}.`,
 explain:`Квадрат — частный случай ромба, а у ромба S = ½ · d₁ · d₂. У квадрата диагонали равны: S = ½ · ${d} · ${d} = ${d*d} : 2 = <b>${N(S)}</b>.<div class="box err"><b>Ошибка</b>${d}² = ${d*d} — диагональ это не сторона. Сторона квадрата короче диагонали.</div>`,
 explain2:`${fig(pic2)}Диагонали квадрата делят его на 4 одинаковых прямоугольных треугольника с катетами ${N(d/2)} и ${N(d/2)}. Площадь одного: ½ · ${N(d/2)} · ${N(d/2)} = ${N(d*d/8)}. Четырёх: ${N(S)}.`};});

/* ===== L6: scaling, ratios ===== */
G(6,()=>{const k=R(2,6);const fig0=pick(['квадрата','прямоугольника','треугольника']);
 return {type:'num',q:`Все стороны ${fig0} увеличили в ${k} раза. Во сколько раз увеличилась его площадь?`,ans:k*k,
 hint:'Попробуй на квадрате со стороной 1.',short:`В ${k}² = ${k*k} раз.`,
 explain:`При увеличении всех размеров в ${k} раза и «длина», и «высота» становятся в ${k} раза больше. Площадь — произведение двух размеров, поэтому она растёт в ${k} · ${k} = <b>${k*k}</b> раз.<div class="box err"><b>Ловушка</b>Ответ ${k} — неверно. Это верно для периметра, но не для площади.</div>`,
 explain2:`Проверь на клетках: квадрат 1 × 1 — одна клетка. Квадрат ${k} × ${k} — это ${k} рядов по ${k} клеток = ${k*k} клеток.${k===2?fig(figScale):''} Значит, площадь больше в ${k*k} раз.`};});
G(6,()=>{const v=pick([[2,3,'увеличили в 2 раза','увеличили в 3 раза'],[3,2,'увеличили в 3 раза','увеличили в 2 раза'],[4,0.5,'увеличили в 4 раза','уменьшили в 2 раза'],[2,0.5,'увеличили в 2 раза','уменьшили в 2 раза'],[6,1/3,'увеличили в 6 раз','уменьшили в 3 раза'],[3,0.5,'увеличили в 3 раза','уменьшили в 2 раза']]);const r=v[0]*v[1];
 return {type:'num',q:`У прямоугольника длину ${v[2]}, а ширину ${v[3]}. Во сколько раз изменилась площадь? (Если не изменилась — ответ 1.)`,ans:r,
 short:`${N(v[0])} · ${v[1]<1?'1/'+N(1/v[1]):N(v[1])} = ${N(r)}.`,
 explain:`Была площадь a · b. Стала (${N(v[0])}a) · (${v[1]<1?'b : '+N(1/v[1]):N(v[1])+'b'}) = ${v[1]<1?`${N(v[0])} : ${N(1/v[1])}`:`${N(v[0])} · ${N(v[1])}`} · ab = <b>${N(r)}</b> · ab.<br>${r===1?'Площадь не изменилась.':r>1?`Площадь увеличилась в ${N(r)} раза.`:''}`,
 explain2:`Проверь на числах: прямоугольник ${v[1]<1?6:4} × ${v[1]<1?6:3}, площадь ${v[1]<1?36:12}. Новые стороны: ${N((v[1]<1?6:4)*v[0])} и ${N((v[1]<1?6:3)*v[1])}, площадь ${N((v[1]<1?6:4)*v[0]*(v[1]<1?6:3)*v[1])}. Отношение: ${N((v[1]<1?36:12)*r)} : ${v[1]<1?36:12} = ${N(r)}.`};});
G(6,()=>{for(;;){const m=R(2,7),n=R(2,9);if(m===n)continue;const s=m*R(2,6);const ans=s*n/m;if(ans!==Math.round(ans))continue;
 const P={A:[m*0.6,5.5],B:[0,0],C:[m+n,0],D:[m,0]};
 const pic=geo({P,poly:[['A','B','C']],seg:[['A','D']],fill:[{pts:['A','B','D'],op:0.45}],side:[['B','D',String(m)],['D','C',String(n)]],txt:[[[(P.A[0]+P.B[0]+P.D[0])/3,(P.A[1])/3],String(s),{fs:14,col:'var(--accent-ink)',wt:700}],[[(P.A[0]+P.C[0]+P.D[0])/3,P.A[1]/3],'?',{fs:15,col:'var(--accent-ink)',wt:700}]],maxH:180});
 return {type:'num',q:`Точка D лежит на стороне BC треугольника ABC, BD = ${m}, DC = ${n}. Площадь треугольника ABD равна ${s}. Найди площадь треугольника ADC.`,pic,ans,
 hint:'У треугольников ABD и ADC общая высота — из вершины A.',short:`Высота общая, площади как основания: ${s} : ${m} · ${n} = ${N(ans)}.`,
 explain:`Высота из A на прямую BC у треугольников ABD и ADC <b>одна и та же</b>. Значит, их площади относятся как основания BD : DC = ${m} : ${n}.<br>S(ADC) = ${s} · ${n} : ${m} = <b>${N(ans)}</b>.`,
 explain2:`Найдём высоту явно: S(ABD) = ½ · ${m} · h = ${s} → h = ${2*s} : ${m} = ${N(2*s/m)}. Тогда S(ADC) = ½ · ${n} · ${N(2*s/m)} = ${N(ans)}. Тот же ответ, просто длиннее.`};}});
G(6,()=>{const s=R(4,30);const askAll=Math.random()<0.6;const P={A:[2,5],B:[0,0],C:[8,0],M:[4,0]};
 const pic=geo({P,poly:[['A','B','C']],seg:[['A','M']],fill:[{pts:['A','B','M'],op:0.45}],tick:[['B','M',1],['M','C',1]],txt:[[[2,1.6],String(s),{fs:14,col:'var(--accent-ink)',wt:700}]],maxH:170});
 return {type:'num',q:`AM — медиана треугольника ABC, площадь треугольника ABM равна ${s}. Найди площадь ${askAll?'треугольника ABC':'треугольника AMC'}.`,pic,ans:askAll?2*s:s,
 short:askAll?`Медиана делит площадь пополам: 2 · ${s} = ${2*s}.`:`Медиана делит площадь пополам: S(AMC) = S(ABM) = ${s}.`,
 explain:`Медиана AM делит сторону BC пополам: BM = MC. Высота из A у треугольников ABM и AMC общая. Равные основания + общая высота → <b>равные площади</b>.<br>${askAll?`S(ABC) = ${s} + ${s} = <b>${2*s}</b>.`:`S(AMC) = <b>${s}</b>.`}`,
 explain2:`Представь треугольник как кусок пирога. Если разрезать основание ровно пополам и провести нож из верхушки, обе части получатся одинакового размера, хотя и разной формы. ${askAll?`Весь пирог — две части: ${2*s}.`:`Вторая часть — тоже ${s}.`}`};});

/* ===== L7: Pythagoras ===== */
const TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25],[15,20,25],[20,21,29]];
G(7,()=>{const t=pick(TRIP);const [a,b,c]=Math.random()<0.5?t:[t[1],t[0],t[2]];const P={C:[0,0],A:[0,b],B:[a,0]};
 const pic=geo({P,poly:[['A','B','C']],rt:[['C','A','B']],side:[['C','B',String(a)],['C','A',String(b)],['A','B','?']],maxH:190});
 return {type:'num',q:`Катеты прямоугольного треугольника равны ${a} и ${b}. Найди гипотенузу.`,pic,ans:c,
 short:`c² = ${a*a} + ${b*b} = ${c*c}, c = ${c}.`,
 explain:`По теореме Пифагора c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}.<br>c = √${c*c} = <b>${c}</b> (потому что ${c} · ${c} = ${c*c}).<div class="box err"><b>Ловушка</b>${a} + ${b} = ${a+b} — неверно: складываются квадраты, а потом извлекается корень.</div>`,
 explain2:`Думай о площадях: построй на катетах квадраты — их площади ${a*a} и ${b*b}. Квадрат на гипотенузе имеет площадь ${a*a} + ${b*b} = ${c*c}. Какой сторона у квадрата площади ${c*c}? ${c}.${a===3&&b===4||a===4&&b===3?fig(pyth):''}`};});
G(7,()=>{const t=pick(TRIP);const [a,b,c]=Math.random()<0.5?t:[t[1],t[0],t[2]];const P={C:[0,0],A:[0,b],B:[a,0]};
 const pic=geo({P,poly:[['A','B','C']],rt:[['C','A','B']],side:[['C','B',String(a)],['C','A','?'],['A','B',String(c)]],maxH:190});
 return {type:'num',q:`Гипотенуза прямоугольного треугольника ${c}, один катет ${a}. Найди другой катет.`,pic,ans:b,
 short:`b² = ${c*c} − ${a*a} = ${b*b}, b = ${b}.`,
 explain:`c² = a² + b² → b² = c² − a² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}.<br>b = √${b*b} = <b>${b}</b>.<div class="box err"><b>Ошибка</b>${c*c} + ${a*a} — так находят гипотенузу. А здесь гипотенуза уже дана — значит, вычитаем.</div>`,
 explain2:`Квадрат на гипотенузе (${c*c}) — это «сумма» двух квадратов на катетах. Один из них знаем (${a*a}), другой — остаток: ${c*c} − ${a*a} = ${b*b}. Сторона квадрата ${b*b} — это ${b}. Проверка: ${a} < ${c} и ${b} < ${c} ✅ — катеты короче гипотенузы.`};});
G(7,()=>{const t=pick([[5,12,13],[3,4,5],[6,8,10],[8,15,17],[9,12,15],[12,16,20],[7,24,25]]);const half=t[0],h=t[1],l=t[2];const base=2*half;const S=half*h;
 const P={A:[0,0],B:[half,h],C:[base,0],H:[half,0]};
 const pic=geo({P,poly:[['A','B','C']],tick:[['A','B',1],['B','C',1]],side:[['A','C',String(base)],['A','B',String(l)],['B','C',String(l)]],lab:['A','B','C'],maxH:190});
 const pic2=geo({P,poly:[['A','B','C']],seg:[['B','H',{dash:true}]],rt:[['H','C','B']],fill:[{pts:['A','B','H']}],side:[['A','H',String(half)],['A','B',String(l)],['B','H',String(h),{flip:true,col:'var(--accent-ink)'}]],maxH:190});
 return {type:'num',q:`В равнобедренном треугольнике основание ${base}, а боковые стороны по ${l}. Найди площадь треугольника.`,pic,ans:S,
 hint:'Проведи высоту к основанию. Она делит основание пополам.',short:`h² = ${l*l} − ${half*half} = ${h*h}, h = ${h}; S = ½ · ${base} · ${h} = ${S}.`,
 explain:`1) Высота BH к основанию в равнобедренном треугольнике делит основание пополам: AH = ${base} : 2 = ${half}.<br>2) Из прямоугольного △ABH: BH² = AB² − AH² = ${l*l} − ${half*half} = ${h*h}, BH = ${h}.<br>3) S = ½ · ${base} · ${h} = <b>${S}</b>.`,
 explain2:`${fig(pic2)}Высота режет треугольник на два одинаковых прямоугольных треугольника с гипотенузой ${l} и катетом ${half}. Второй катет (высота) — ${h}, это тройка ${half}, ${h}, ${l}. Площадь одного половинного треугольника ½ · ${half} · ${h} = ${S/2}, двух — ${S}.`};});
G(7,()=>{const t=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25]]);const p=t[0],q=t[1],sd=t[2];const d1=2*p,d2=2*q,S=2*p*q;
 const P={A:[0,q],B:[p,2*q],C:[2*p,q],D:[p,0],O:[p,q]};
 const pic=geo({P,poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],tick:[['A','B',1],['B','C',1],['C','D',1],['D','A',1]],side:[['B','C',String(sd)],['A','C',String(d1),{t:0.25}]],lab:Q4,dir:{A:180,C:0},maxH:200});
 const pic2=geo({P,poly:[Q4],seg:[['A','C',{dash:true}],['B','D',{dash:true}]],fill:[{pts:['O','B','C']}],rt:[['O','C','B']],side:[['B','C',String(sd)],['O','C',String(p),{flip:true}],['O','B','?',{flip:true}]],lab:['A','B','C','D','O'],dir:{A:180,C:0,O:-60},maxH:200});
 return {type:'num',q:`Сторона ромба ${sd}, одна из диагоналей ${d1}. Найди площадь ромба.`,pic,ans:S,
 hint:'Диагонали ромба перпендикулярны и делятся пополам. Рассмотри маленький прямоугольный треугольник.',short:`Половина второй диагонали √(${sd*sd} − ${p*p}) = ${q}; d₂ = ${d2}; S = ½ · ${d1} · ${d2} = ${S}.`,
 explain:`1) Диагонали ромба перпендикулярны и делятся пополам: OC = ${d1} : 2 = ${p}.<br>2) △BOC прямоугольный: OB² = BC² − OC² = ${sd*sd} − ${p*p} = ${q*q}, OB = ${q}.<br>3) BD = 2 · ${q} = ${d2}.<br>4) S = ½ · ${d1} · ${d2} = <b>${S}</b>.`,
 explain2:`${fig(pic2)}Ромб состоит из 4 одинаковых прямоугольных треугольников с гипотенузой ${sd} и катетом ${p}. Второй катет ${q} (тройка ${p}, ${q}, ${sd}). Площадь одного: ½ · ${p} · ${q} = ${p*q/2}. Четырёх: ${S}.`};});
G(7,()=>{const t=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]);const x=t[0],h=t[1],l=t[2];const b=R(2,10),a=b+2*x;const S=(a+b)*h/2;
 const P=isoTrap(a,b,h);P.H=[x,0];
 const pic=geo({P,poly:[Q4],tick:[['A','B',1],['C','D',1]],side:[['A','D',String(a)],['B','C',String(b)],['A','B',String(l)]],lab:Q4,maxH:190});
 const pic2=geo({P,poly:[Q4],seg:[['B','H',{dash:true}]],rt:[['H','D','B']],fill:[{pts:['A','B','H']}],side:[['A','H',String(x)],['B','C',String(b)],['A','B',String(l)],['B','H','h',{flip:true,col:'var(--accent-ink)'}]],maxH:190});
 return {type:'num',q:`Основания равнобедренной трапеции ${a} и ${b}, боковая сторона ${l}. Найди площадь трапеции.`,pic,ans:S,
 hint:'Опусти высоту из B. Найди AH, потом высоту по Пифагору.',short:`AH = ${x}, h = √(${l*l} − ${x*x}) = ${h}; S = ½ · ${a+b} · ${h} = ${N(S)}.`,
 explain:`1) AH = (${a} − ${b}) : 2 = ${x}.<br>2) △ABH: BH² = ${l}² − ${x}² = ${l*l} − ${x*x} = ${h*h}, BH = ${h}.<br>3) S = ½ · (${a} + ${b}) · ${h} = ½ · ${a+b} · ${h} = <b>${N(S)}</b>.`,
 explain2:`${fig(pic2)}В закрашенном прямоугольном треугольнике гипотенуза ${l} и катет ${x}. Это тройка ${x}, ${h}, ${l} → высота ${h}. Дальше обычная формула трапеции: средняя линия ${N((a+b)/2)} · высота ${h} = ${N(S)}.`};});

/* ===== L8: ★ ===== */
G(8,()=>{const S=6*R(3,20);const ask=pick(['AOB','BOM']);const P={A:[1.6,5.2],B:[0,0],C:[8,0]};P.M=mid(P.B,P.C);P.K=mid(P.A,P.C);P.L=mid(P.A,P.B);P.O=[(P.A[0]+P.B[0]+P.C[0])/3,(P.A[1]+P.B[1]+P.C[1])/3];
 const ans=ask==='AOB'?S/3:S/6;
 const pic=geo({P,poly:[['A','B','C']],seg:[['A','M'],['B','K'],['C','L']],fill:[ask==='AOB'?{pts:['A','O','B'],op:0.45}:{pts:['B','O','M'],op:0.45}],tick:[['B','M',1],['M','C',1],['A','K',2],['K','C',2],['A','L',3],['L','B',3]],dots:['O'],dir:{O:-20},maxH:200});
 const six=[['A','L','O'],['L','B','O'],['B','M','O'],['M','C','O'],['C','K','O'],['K','A','O']];
 const pic2=geo({P,poly:[['A','B','C']],seg:[['A','M'],['B','K'],['C','L']],fill:six.map((t,i)=>({pts:t,op:i%2?0.15:0.45})),txt:six.map(t=>[[(P[t[0]][0]+P[t[1]][0]+P[t[2]][0])/3,(P[t[0]][1]+P[t[1]][1]+P[t[2]][1])/3],N(S/6),{fs:11,col:'var(--accent-ink)'}]),lab:['A','B','C'],maxH:200});
 return {type:'num',q:`Площадь треугольника ABC равна ${S}. Его медианы AM, BK и CL пересекаются в точке O. Найди площадь треугольника ${ask}.`,pic,ans,
 hint:'Медианы делят треугольник на 6 маленьких треугольников. Сравни их площади.',short:`Шесть частей по ${S} : 6 = ${N(S/6)}; ${ask} = ${ask==='AOB'?'две части = '+N(S/3):'одна часть = '+N(S/6)}.`,
 explain:`1) Медиана AM делит △ABC на две равные по площади половины, так же BK и CL.<br>2) В △OBC медиана OM: S(OBM) = S(OMC) = x. Аналогично S(OCK) = S(OKA) = y, S(OAL) = S(OLB) = z.<br>3) Медиана AM делит △ABC пополам: S(ABM) = z + z + x, S(AMC) = x + y + y, значит 2z + x = x + 2y → z = y. Медиана BK: S(ABK) = z + z + y, S(CBK) = x + x + y → z = x. Значит, x = y = z — <b>все шесть частей равны</b>, каждая ${S} : 6 = ${N(S/6)}.<br>4) ${ask==='AOB'?`△AOB состоит из двух частей (AOL и LOB): ${N(S/6)} · 2 = <b>${N(S/3)}</b>.`:`△BOM — ровно одна из шести частей: <b>${N(S/6)}</b>.`}`,
