 {lvl:2,text:'We need two {knives*|knifes|knive}.',
  why:`knife кончается на fe → <b>ves</b>: ${s('knives')} ${t('naɪvz')}.`,
  why2:`f «превращается» в v: knife → knives, wolf → wolves.`},
 {lvl:2,text:'Two {children*|childs|childrens} are in the park.',
  why:`${s('child')} — особое слово: ${s('children')} ${t('ˈtʃɪldrən')}. «childs» и «childrens» — ошибки.`,
  why2:`children уже значит «дети», к нему ничего не добавляют.`},
 {lvl:2,text:'I have got white {teeth*|tooths|teeths}.',
  why:`${s('tooth')} — особое слово: ${s('teeth')}. oo меняется на ee.`,
  why2:`Как foot → feet: tooth → teeth.`},
 {type:'listen',lvl:2,say:'mice',q:'Послушай. Что прозвучало?',opts:['mouse','mice','mouses'],ans:1,
  why:`Прозвучало ${s('mice')} ${t('maɪs')} — «мыши». ${s('mouse')} ${t('maʊs')} — одна мышь. «mouses» не бывает.`,
  why2:`mouse — «маус», mice — «майс».`},
 {type:'spell',lvl:2,say:'boxes',ans:['boxes'],q:'Послушай и напиши слово',
  why:`${s('boxes')} — box + es, потому что слово кончается на x.`,
  why2:`Окончание «из» в конце — это -es: b-o-x-e-s.`},
 {type:'read',lvl:2,text:'These are my books and pens.',q:'Прочитай вслух',
  why:`${s('books')} — глухое ${t('s')}: «букс»; ${s('pens')} — звонкое ${t('z')}: «пэнз». ${s('these')} ${t('ðiːz')} — долгое «и».`,
  why2:`«Ðи-из а-а май букс энд пэнз».`},
 {lvl:3,text:'There are five {sheep*|sheeps|sheepes} on the farm.',
  why:`${s('sheep')} не меняется: one sheep, five sheep.`,
  why2:`Овцы и рыбы «ленивые» — у них одна форма: ${s('sheep')}, ${s('fish')}.`},
 {lvl:3,text:'I have got three {tomatoes*|tomatos|tomato}.',
  why:`${s('tomato')} — одно из слов на o, которые получают <b>-es</b>: ${s('tomatoes')}. Так же ${s('potatoes')}.`,
  why2:`Помидоры и картошка — с es: tomatoes, potatoes. А фото — просто photos.`},
 {lvl:3,q:'Какое множественное число у слова <b>foot</b> (нога, ступня)?',opts:['feet','foots','feets'],ans:0,sayAfter:'one foot, two feet',
  why:`${s('foot')} — особое слово: ${s('feet')}. oo меняется на ee, -s не нужно.`,
  why2:`foot → feet, tooth → teeth. «Фут» → «фи-ит».`},
 {type:'listen',lvl:3,say:'boxes',q:'Послушай слово. Как звучит его окончание?',opts:['[ɪz] — отдельный слог','[s]','[z]'],ans:0,
  why:`${s('boxes')} ${t('ˈbɒksɪz')} — после x окончание -es звучит ${t('ɪz')} и даёт ещё один слог: box — boxes.`,
  why2:`Хлопни в ладоши: box — один хлопок, box-es — два.`},
 {type:'spell',lvl:3,say:'children',ans:['children'],q:'Послушай и напиши слово',
  why:`${s('children')} — дети: ch + i + l + d + r + e + n.`,
  why2:`child + ren — вот и всё множественное число.`},
 {lvl:3,text:'My dad has got two {watches*|watchs|watch}.',
  why:`watch кончается на ch → <b>+es</b>: ${s('watches')}.`,
  why2:`После ch нужно e: watches «уочиз».`},
 {lvl:3,text:'The {leaves*|leafs|leaf} are yellow in autumn.',
  why:`${s('leaf')} кончается на f → <b>ves</b>: ${s('leaves')}. Глагол are тоже показывает, что листьев много.`,
  why2:`f → v + es: leaf → leaves.`},
 {type:'read',lvl:3,text:'The children have got new toys.',q:'Прочитай вслух',
  why:`${s('children')} ${t('ˈtʃɪldrən')} — «ЧИЛдрэн»; ${s('toys')} — звонкое ${t('z')} на конце: «тойз»; ${s('new')} ${t('njuː')} — «нью».`,
  why2:`«Ðэ чилдрэн хэв гот нью тойз».`}
]});

/* ===================== HAVE GOT / HAS GOT ===================== */
RU.rule({
id:'en.s.have_got',
short:`«У меня есть» = <b>I have got</b> (${s("I've got")}): ${s('I have got a dog.')} С he, she, it — <b>has got</b>: ${s('She has got a cat.')} Отрицание: haven’t got / hasn’t got. Вопрос: ${s('Have you got a pen?')} — ${s('Yes, I have.')} / ${s("No, I haven't.")}`,
theory:`
<p>По-русски говорят «<b>у меня есть</b> кот». По-английски — «<b>я имею</b> кота»: ${s('I have got a cat.')}</p>
<div class="box rule"><b>Формы</b>
<table class="sym">
<tr><th>Кто</th><th>Утверждение</th><th>Отрицание</th></tr>
<tr><td>I, you, we, they</td><td>${s('I have got a dog.')}<br>(I’ve got)</td><td>${s("I haven't got a dog.")}</td></tr>
<tr><td>he, she, it</td><td>${s('He has got a dog.')}<br>(he’s got)</td><td>${s("He hasn't got a dog.")}</td></tr>
</table>
Одно существительное — как he/she/it: ${s('My sister has got a bike.')} Несколько — как they: ${s('My parents have got a car.')}</div>
<div class="box rule"><b>Вопрос и краткий ответ</b>
Have / Has — вперёд, got остаётся после того, кто:<br>
${s('Have you got a pen?')} — ${s('Yes, I have.')} / ${s("No, I haven't.")}<br>
${s('Has she got a cat?')} — ${s('Yes, she has.')} / ${s("No, she hasn't.")}<br>
В кратком ответе <b>got не повторяют</b>.</div>
<div class="box tip"><b>Как запомнить</b>has — для «одного», как is: he <b>is</b> — he <b>has</b>. Обе формы кончаются на -s.</div>
<div class="box err"><b>Типичные ошибки</b>
<ul>
<li>«He have got» → ${s('He has got')}; «I has got» → ${s('I have got')}.</li>
<li>«Yes, I have got.» → ${s('Yes, I have.')}</li>
<li>«I have got twelve» (о возрасте) → ${s('I am twelve.')}</li>
<li>Осторожно: ${s("he's got")} = he <b>has</b> got, а не he is.</li>
</ul></div>`,
theory2:`
<p>Представь, что have got — это «держу в руках, моё». ${s('I have got a ball.')} — «Мяч мой, он у меня».</p>
<p>Он, она, оно — has: ${s('He has got a ball.')}</p>
<p>Спросить: ${s('Have you got a ball?')} Ответить: ${s('Yes, I have.')}</p>`,
items:[
 {lvl:1,text:'I {have*|has} got a dog.',
  why:`С I — <b>have</b>: ${s('I have got a dog.')}`,
  why2:`I, you, we, they — have. Has — только для he, she, it.`},
 {lvl:1,text:'She {has*|have} got a cat.',
  why:`she → <b>has</b>: ${s('She has got a cat.')}`,
  why2:`Она одна — has, как she is.`},
 {lvl:1,text:'We {have*|has} got a big house.',
  why:`we → <b>have</b>: ${s('We have got a big house.')}`,
  why2:`Мы — много людей, have.`},
 {lvl:1,text:'My brother {has*|have} got a bike.',
  why:`my brother = he → <b>has</b>.`,
  why2:`Замени на he: He has got a bike.`},
 {type:'listen',lvl:1,say:'He has got a dog.',q:'Послушай. Что прозвучало?',opts:['He has got a dog.','He hasn’t got a dog.','We have got a dog.'],ans:0,
  why:`Прозвучало ${s('He has got a dog.')} — «У него есть собака». Слова «not» (hasn’t) не было.`,
  why2:`hasn’t звучит «хэзнт» — с «нт» на конце. Здесь было просто «хэз».`},
 {type:'read',lvl:1,text:'I have got a dog.',q:'Прочитай вслух',
  why:`${s('have')} ${t('hæv')} — «хэв» (e не читается), ${s('got')} ${t('gɒt')} — короткое «о», ${s('dog')} — не оглушай g.`,
  why2:`«Ай хэв гот э дог». Можно быстро: «айв гот э дог».`},
 {lvl:2,text:'{Have*|Has} you got a pen?',
  why:`С you — <b>have</b>, и в вопросе он идёт первым: ${s('Have you got a pen?')}`,
  why2:`Ответ: «I have got a pen» → вопрос: Have you got…?`},
 {lvl:2,text:'— Has Tom got a sister? — Yes, he {has*|have|is}.',
  why:`Краткий ответ повторяет глагол вопроса: Has…? — ${s('Yes, he has.')} he → has, а is тут не подходит.`,
  why2:`В вопросе has — в ответе has.`},
 {lvl:2,text:'They {haven’t*|hasn’t|not} got a car.',
  why:`they → have, с отрицанием — <b>haven’t</b>: ${s("They haven't got a car.")}`,
  why2:`hasn’t — только для he, she, it. Они — haven’t.`},
 {lvl:2,text:'The cat {has*|have} got green eyes.',
  why:`the cat = it → <b>has</b>: ${s('The cat has got green eyes.')}`,
  why2:`Кошка одна (it) — has. Глаз много, но смотрим на того, у кого они есть.`},
 {lvl:2,text:'My parents {have*|has} got a new car.',
  why:`my parents = they → <b>have</b>.`,
  why2:`Родителей двое — have.`},
 {type:'listen',lvl:2,say:'I haven\'t got a pen.',q:'Послушай. Что прозвучало?',opts:['I have got a pen.','I haven’t got a pen.'],ans:1,
  why:`Прозвучало ${s("I haven't got a pen.")} — «У меня нет ручки». Слышно «хэвнт».`,
  why2:`have — «хэв», haven’t — «хэвнт»: в конце n и t.`},
 {type:'read',lvl:2,text:'My sister has got a red bag.',q:'Прочитай вслух',
  why:`${s('has')} ${t('hæz')} — s звучит как ${t('z')}: «хэз». ${s('bag')} ${t('bæg')} — широкое ${t('æ')}, g не оглушай.`,
  why2:`«Май систэ хэз гот э рэд бэг».`},
 {lvl:3,text:'— Have you got a brother? — No, I {haven’t*|haven’t got|hasn’t}.',
  why:`В кратком ответе got <b>не повторяют</b>: ${s("No, I haven't.")} hasn’t — для he/she/it.`,
  why2:`Короткий ответ — короткий: Yes, I have. / No, I haven’t.`},
 {lvl:3,text:'{Has*|Have} your dog got a ball?',
  why:`your dog = it → <b>Has</b>: ${s('Has your dog got a ball?')}`,
  why2:`Ответ был бы «It has got a ball», значит, вопрос с Has.`},
 {lvl:3,text:'Kate {hasn’t*|haven’t|isn’t} got a cat.',
  why:`Kate = she → has, с not — <b>hasn’t</b>. isn’t — от to be, с got не работает.`,
  why2:`have got / has got — это пара. Отрицание: hasn’t got.`},
 {lvl:3,q:'Что значит <b>he’s</b> в предложении <b>He’s got a dog.</b>?',opts:['he has','he is','he was'],ans:0,sayAfter:"He's got a dog.",
  why:`Перед got ’s — это <b>has</b>: ${s("He's got a dog.")} = ${s('He has got a dog.')}`,
  why2:`Если после ’s стоит got — это has. Если «He’s happy» — это is.`},
 {type:'spell',lvl:3,say:'She has got a cat.',ans:['she has got a cat',"she's got a cat"],q:'Послушай и напиши предложение',
  why:`${s('She has got a cat.')} — she → has got.`,
  why2:`Четыре слова (и маленькое a): she / has / got / a / cat.`},
 {lvl:3,text:'Tom and I {have*|has} got a lot of books.',
  why:`Tom and I = we → <b>have</b>.`,
  why2:`Я и Том — это «мы». Мы — have.`},
 {type:'read',lvl:3,text:'Have you got a pen? Yes, I have.',q:'Прочитай вслух',
  why:`В вопросе ${s('Have you got a pen?')} голос в конце идёт вверх. В ответе ${s('Yes, I have.')} ударение на have.`,
  why2:`«Хэв ю гот э пэн? — Йес, ай ХЭВ».`}
]});

/* ===================== THIS / THAT / THESE / THOSE ===================== */
RU.rule({
id:'en.s.this_that',
short:`<b>this</b> — этот (один, близко), <b>these</b> — эти (много, близко); <b>that</b> — тот (один, далеко), <b>those</b> — те (много, далеко). ${s('This is my bag.')} ${s('These are my books.')} ${s('That is a bird.')} ${s('Those are trees.')}`,
theory:`
<div class="box rule"><b>Близко или далеко? Один или много?</b>
<table class="sym">
<tr><th></th><th>Один</th><th>Много</th></tr>
<tr><td><b>Близко</b> (здесь, в руке)</td><td>${s('this')} ${t('ðɪs')}<br>${s('This is my pen.')}</td><td>${s('these')} ${t('ðiːz')}<br>${s('These are my pens.')}</td></tr>
<tr><td><b>Далеко</b> (там)</td><td>${s('that')} ${t('ðæt')}<br>${s('That is a plane.')}</td><td>${s('those')} ${t('ðəʊz')}<br>${s('Those are birds.')}</td></tr>
</table></div>
<div class="box rule"><b>Глагол и существительное должны «совпадать»</b>
this / that + <b>is</b> + один предмет: ${s('This is a cat.')}<br>
these / those + <b>are</b> + много предметов: ${s('These are cats.')}<br>
Можно и перед существительным: ${s('this book')}, ${s('these books')}, ${s('that house')}, ${s('those houses')}.</div>
<div class="box ex"><b>Вопросы</b>
${s('What is this?')} — ${s('It is a pen.')} (в ответе — <b>it</b>)<br>
${s('What are these?')} — ${s('They are pens.')} (в ответе — <b>they</b>)</div>
<div class="box tip"><b>Слова-подсказки</b>Близко: here, in my hand. Далеко: there, over there, in the sky.<br>
Различай на слух: ${s('this')} — коротко «ðис», ${s('these')} — долго «ðи-из».</div>
<div class="box err"><b>Типичные ошибки</b>
<ul>
<li>«Это мои книги» — не «This is my books», а ${s('These are my books.')} Русское «это» может значить и «эти».</li>
<li>«This are», «These is» — нельзя: this is, these are.</li>
<li>«this books» → ${s('these books')}.</li>
</ul></div>`,
theory2:`
<p>Покажи рукой. Предмет рядом — <b>this</b> («вот этот»), много рядом — <b>these</b>. Предмет далеко — <b>that</b> («вон тот»), много далеко — <b>those</b>.</p>
<p>Слова для «много» длиннее: this → these, that → those.</p>
<p>${s('This is my dog.')} ${s('Those are my friends.')}</p>`,
items:[
 {lvl:1,text:'{This*|These} is my bag.',
  why:`bag — одна сумка, и глагол is → <b>this</b>: ${s('This is my bag.')}`,
  why2:`Один предмет + is → this. These — когда много.`},
 {lvl:1,text:'{These*|This} are my pens.',
  why:`pens — много, глагол are → <b>these</b>: ${s('These are my pens.')}`,
  why2:`«This are» не бывает. Много → these are.`},
 {lvl:1,text:'Look at {that*|those} bird in the sky!',
  why:`Птица одна (bird без -s) и далеко (in the sky) → <b>that</b>.`,
  why2:`Далеко + один = that. Those — далеко и много.`},
 {lvl:1,text:'{Those*|That} are big trees over there.',
  why:`trees — много, over there — далеко, глагол are → <b>those</b>.`,
  why2:`Далеко + много = those.`},
 {type:'listen',lvl:1,say:'these',q:'Послушай. Какое слово прозвучало?',opts:['this','these'],ans:1,
  why:`Прозвучало ${s('these')} ${t('ðiːz')} — долгое «и-и» и звонкое ${t('z')} в конце. ${s('this')} ${t('ðɪs')} — коротко и с ${t('s')}.`,
  why2:`these тянется «ðи-из», this короткое «ðис».`},
 {type:'read',lvl:1,text:'This is my cat.',q:'Прочитай вслух',
  why:`${s('this')} — язык между зубами, звонкий ${t('ð')}, короткое ${t('ɪ')}. ${s('cat')} — широкое ${t('æ')}.`,
  why2:`«Ðис из май кэт». Не говори «зис»!`},
 {lvl:2,text:'I have got a pen in my hand. {This*|That|Those} pen is red.',
  why:`Ручка в руке — близко, и она одна → <b>this</b>.`,
  why2:`in my hand — значит, рядом. Рядом и одна — this.`},
 {lvl:2,text:'— What are {these*|this}? — They are apples.',
  why:`В вопросе are, в ответе They are apples — много → <b>these</b>.`,
  why2:`What are these? — What is this? Глагол подсказывает: are → these.`},
 {lvl:2,text:'— What is that? — {It*|They|This} is a plane.',
  why:`В ответе на What is this/that? говорят <b>it</b>: ${s('It is a plane.')} They — для многих.`,
  why2:`Вопрос «Что это?» — ответ «Это — самолёт» = It is a plane.`},
 {lvl:2,text:'These {are*|is|am@en.s.to_be} my friends.',
  why:`these — много → <b>are</b>: ${s('These are my friends.')}`,
  why2:`these/those — are, this/that — is.`},
 {lvl:2,text:'{Those*|These|That} houses over there are old.',
  why:`houses — много, over there — далеко → <b>those</b>.`,
  why2:`over there = «вон там» → that/those. Много → those.`},
 {type:'listen',lvl:2,say:'Those are my shoes.',q:'Послушай. Что прозвучало?',opts:['These are my shoes.','Those are my shoes.','That is my shoe.'],ans:1,
  why:`Прозвучало ${s('those')} ${t('ðəʊz')} — «ðоуз», со звуком «оу». ${s('these')} — «ðи-из».`,
  why2:`those — «оу», как в ${s('home')}; these — «и-и», как в ${s('see')}.`},
 {type:'read',lvl:2,text:'These are my books.',q:'Прочитай вслух',
  why:`${s('these')} ${t('ðiːz')} — долгое «и-и» и звонкое ${t('z')}; ${s('books')} — короткое ${t('ʊ')} и ${t('s')}.`,
  why2:`«Ðи-из а-а май букс».`},
 {lvl:3,text:'This is my brother, and {these*|this} are my sisters.',
  why:`sisters — много, глагол are → <b>these</b>.`,
  why2:`Первая часть про одного (this is), вторая — про многих (these are).`},
 {lvl:3,text:'— Is {this*|these} your book? — Yes, it is.',
  why:`book — одна, глагол is, в ответе it → <b>this</b>.`,
  why2:`Is + book + it — всё про один предмет. Значит, this.`},
 {lvl:3,text:'Look! {That*|Those|These} star over there is very bright.',
  why:`star — одна звезда (без -s), over there — далеко, глагол is → <b>that</b>.`,
  why2:`Одна и далеко — that.`},
 {lvl:3,q:'Как сказать «Это мои друзья» (друзья стоят рядом)?',opts:['These are my friends.','This is my friends.','This are my friends.'],ans:0,sayAfter:'These are my friends.',
  why:`Друзей много и они рядом → ${s('These are my friends.')} Русское «это» здесь = «эти».`,
  why2:`Не переводи «это» как this автоматически. Смотри: много — these are.`},
 {type:'spell',lvl:3,say:'these',ans:['these'],q:'Послушай и напиши слово',
  why:`${s('these')} ${t('ðiːz')} — th + e + s + немая e. Долгое «и» здесь даёт открытый слог.`,
  why2:`t-h-e-s-e. Немая e в конце делает e долгой.`},
 {type:'spell',lvl:3,say:'those',ans:['those'],q:'Послушай и напиши слово',
  why:`${s('those')} ${t('ðəʊz')} — th + o + s + немая e: o звучит «оу», как в ${s('home')}.`,
  why2:`t-h-o-s-e, как ${s('nose')}, только с th.`},
 {type:'read',lvl:3,text:'That is a big dog.',q:'Прочитай вслух',
  why:`${s('that')} ${t('ðæt')} — звонкий ${t('ð')} и широкое ${t('æ')}. Свяжи ${s('That is','that is')}: «ðэтиз».`,
  why2:`«Ðэт из э биг дог». В конце dog не оглушай.`}
]});

/* ===================== CAN / CAN'T ===================== */
RU.rule({
id:'en.s.can',
short:`<b>can</b> + глагол (без to) = «умею, могу»: ${s('I can swim.')} Форма одна для всех: ${s('He can swim.')} (не cans!). Отрицание: <b>can’t</b> = cannot: ${s("I can't swim.")} Вопрос: ${s('Can you swim?')} — ${s('Yes, I can.')} / ${s("No, I can't.")}`,
theory:`
<div class="box rule"><b>Как строится</b>
<table class="sym">
<tr><th>Утверждение</th><th>Отрицание</th><th>Вопрос</th></tr>
<tr><td>${s('I can swim.')}</td><td>${s("I can't swim.")}</td><td>${s('Can you swim?')}</td></tr>
<tr><td>${s('She can dance.')}</td><td>${s("She can't dance.")}</td><td>${s('Can she dance?')}</td></tr>
<tr><td>${s('They can run.')}</td><td>${s("They can't run.")}</td><td>${s('Can they run?')}</td></tr>
</table>
Краткие ответы: ${s('Yes, I can.')} / ${s("No, I can't.")} · ${s('Yes, she can.')} / ${s("No, she can't.")}</div>
<div class="box tip"><b>Три «НЕТ» после can</b>
<ul>
<li>нет <b>-s</b> у can: he <b>can</b>, не «cans»;</li>
<li>нет <b>-s</b> у глагола: he can <b>swim</b>, не «swims»;</li>
<li>нет <b>to</b>: can <b>swim</b>, не «can to swim».</li>
</ul></div>
<div class="box tip"><b>Как произносить</b>В предложении can звучит слабо: ${s('I can swim.')} — «ай кэн / кн суим». В кратком ответе — полно: ${s('Yes, I can.')} ${t('kæn')}. can’t в британском — долгое «а»: ${s("I can't")} ${t('kɑːnt')} «ка-ант». Так can и can’t легко различить на слух.</div>
<div class="box err"><b>Типичные ошибки</b>
<ul>
<li>«He cans swim», «He can swims» → ${s('He can swim.')}</li>
<li>«I can to read» → ${s('I can read.')}</li>

<script>(function(){
"use strict";
const RU=window.RU;
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
/* ---------- speech ---------- */
const TTS={voice:null,ok:'speechSynthesis' in window};
function chooseVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices();const want=(window.CONF&&CONF.lang)||'en-GB';
  TTS.voice=vs.find(v=>v.lang===want&&/Daniel|Serena|Kate|Arthur|Google UK|Natural/i.test(v.name))||vs.find(v=>v.lang===want)||vs.find(v=>v.lang&&v.lang.startsWith('en-GB'))||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null;}
if(TTS.ok){chooseVoice();try{speechSynthesis.onvoiceschanged=chooseVoice;}catch(e){}}
function speak(text,rate){if(!TTS.ok||!text)return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang=(TTS.voice&&TTS.voice.lang)||((window.CONF&&CONF.lang)||'en-GB');if(TTS.voice)u.voice=TTS.voice;u.rate=rate||0.9;speechSynthesis.speak(u);return true;}catch(e){return false;}}
window.speak=speak;
document.addEventListener('click',e=>{const el=e.target.closest('[data-say]');if(!el)return;e.preventDefault();speak(el.dataset.say||el.textContent,el.dataset.rate?+el.dataset.rate:(el.classList.contains('slow')?0.6:0.9));});
function sayBtns(text){const t=esc(text);return `<span class="saybox"><button class="btn ghost sbtn" data-say="${t}">🔊 Послушать</button><button class="btn ghost sbtn slow" data-say="${t}">🐢 Медленно</button></span>`;}
const CONTR={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","couldn't":"could not","won't":"will not","wouldn't":"would not","shouldn't":"should not","haven't":"have not","hasn't":"has not","hadn't":"had not","let's":"let us","there's":"there is","that's":"that is","what's":"what is","i'd":"i would"};
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function words(t){t=String(t).toLowerCase().replace(/[’‘`]/g,"'").replace(/can not/g,'cannot');let w=t.split(/[^a-z0-9']+/).filter(Boolean);
  let out=[];w.forEach(x=>{x=x.replace(/^'+|'+$/g,'');if(!x)return;if(CONTR[x])out.push(...CONTR[x].split(' '));else if(/^\d+$/.test(x)&&+x<=20)out.push(NUMW[+x]);else out.push(x);});return out;}
function lcsMatch(a,b){const n=a.length,m=b.length;const d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?1+d[i+1][j+1]:Math.max(d[i+1][j],d[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++;}else if(d[i+1][j]>=d[i][j+1])i++;else j++;}return hit;}
function normSpell(x){return String(x).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim();}
const C=window.CONF||{};
const LS=C.ls||'ru-trainer:v1';
const GRADES=C.grades||[5,6,7,8,9];
const GL=C.gradeLabels||{};
const PATH_CAP=9, REMED_NEED=3, REMED_MAX=10, REINF_MAX=3;
let ITEMS={}, S=null;

/* ---------- data ---------- */
function rulesOf(g){return RU.order.filter(id=>RU.reg[id].grade===g&&RU.reg[id].items.length);}
function pure(it,rid){return it.type==='gaps'?it.gaps.every(g=>g.rule===rid):it.rule===rid;}
function indexItems(){
  ITEMS={};
  RU.order.forEach(id=>RU.reg[id].items.forEach(it=>ITEMS[it.key]=it));
  Object.values(RU.mixes).forEach(a=>a.forEach(it=>ITEMS[it.key]=it));
}
function itemRules(it){return it.type==='gaps'?[...new Set(it.gaps.map(g=>g.rule))]:[it.rule];}
function gLabel(g){return GL[g]||(g+' класс');}
function ruleTag(rid){const r=RU.reg[rid];return `«${r.title}» (${gLabel(r.grade)})`;}

/* ---------- state ---------- */
function load(){try{return JSON.parse(localStorage.getItem(LS)||'null');}catch(e){return null;}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function fresh(){return {view:'home',path:[],pos:0,stack:[],stats:{},seen:{},title:'',grade:null};}
function stat(rid){return S.stats[rid]||(S.stats[rid]={r:0,w:0});}
function markSeen(k){S.seen[k]=1;}

function gradePath(g){
  const p=[];
  rulesOf(g).forEach(rid=>{
    p.push({k:'intro',rule:rid});
    const items=RU.reg[rid].items.slice().sort((a,b)=>a.lvl-b.lvl);
    items.slice(0,PATH_CAP).forEach(it=>p.push({k:'item',key:it.key,rule:rid}));
  });
  const mix=RU.mixes[g]||[];
  if(mix.length){p.push({k:'mixintro',grade:g});mix.slice().sort((a,b)=>a.lvl-b.lvl).forEach(it=>p.push({k:'item',key:it.key,rule:null}));}
  p.push({k:'end'});
  return p;
}
function rulePath(rids,title){
  const p=[];rids.forEach(rid=>{p.push({k:'intro',rule:rid});RU.reg[rid].items.slice().sort((a,b)=>a.lvl-b.lvl).slice(0,PATH_CAP).forEach(it=>p.push({k:'item',key:it.key,rule:rid}));});
  p.push({k:'end'});return p;
}
function start(path,grade,title){S.view='run';S.path=path;S.pos=0;S.stack=[];S.grade=grade;S.title=title;save();render();}

function pickItem(rid,usedInFrame){
  const all=RU.reg[rid].items.filter(it=>pure(it,rid)).sort((a,b)=>a.lvl-b.lvl);
  const pool=all.length?all:RU.reg[rid].items.slice();
  let c=pool.filter(it=>!usedInFrame.includes(it.key)&&!S.seen[it.key]);
  if(!c.length)c=pool.filter(it=>!usedInFrame.includes(it.key));
  if(!c.length)c=pool;
  const minL=Math.min(...c.map(i=>i.lvl));
  return pick(c.filter(i=>i.lvl===minL)).key;
}

/* ---------- layout ---------- */
function build(){
  indexItems();
  document.body.innerHTML=`
  <header class="top"><div class="wrap">
    <div class="brand"><a class="home" href="index.html">← Все тренажёры</a>${C.title||'Русский язык'}<small>${C.subtitle||'Правила 5–9 классов · тренажёр'}</small></div>
    <nav class="tabs"><button data-v="home" aria-selected="true">Уровни</button><button data-v="ref" aria-selected="false">Справочник правил</button></nav>
    <button class="theme-btn" id="themeBtn" aria-label="Сменить тему">◐</button>
  </div></header>
  <main class="wrap" id="main"></main>`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v==='home'?(S.path.length&&S.pos<S.path.length?'home':'home'):'ref';save();render();});
  $('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme;const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'light':'dark';try{localStorage.setItem('trainer:theme',document.documentElement.dataset.theme);}catch(e){}};
  try{const th=localStorage.getItem('trainer:theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
  S=load()||fresh();
  if(S.view==='run'&&(!S.path.length))S.view='home';
  if(S.view==='run')S.view='home';
  if(RU.errors.length)console.error('RU content errors:\n'+RU.errors.join('\n'));
  render();
}
function setTab(v){document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v?'true':'false'));}
function render(){
  const m=$('#main');
  if(S.view==='ref'){setTab('ref');renderRef(m);}
  else if(S.view==='rule'){setTab('ref');renderRuleCard(m,S.ruleView);}
  else if(S.view==='run'){setTab('home');renderRun(m);}
  else {setTab('home');renderHome(m);}
  window.scrollTo({top:0});
}

/* ---------- home ---------- */
function gradeProgress(g){const rs=rulesOf(g);let done=0,weak=0;rs.forEach(r=>{const s=S.stats[r];if(s&&s.r+s.w>0)done++;if(s&&s.w>s.r/2&&s.w>0)weak++;});return {n:rs.length,done,weak};}
function weakRules(){return RU.order.filter(r=>{const s=S.stats[r];return s&&s.w>0&&s.w*2>=s.r;});}
function renderHome(m){
  const canCont=S.path.length&&S.pos<S.path.length&&S.title;
  const weak=weakRules();
  m.innerHTML=`<div class="card" style="margin-top:20px"><h1>${C.homeTitle}</h1>
  <p>${C.homeIntro}</p>
  <div class="box rule"><b>Как это работает</b>Ошибся — читаешь разбор и пишешь «понял». Если ошибка в правиле <b>прошлого уровня</b>, тренажёр отправит тебя повторить это правило: покажет его и даст упражнения, пока не решишь <b>3 подряд без ошибок</b>. Потом вернёт обратно — к тому же упражнению.</div>
  ${canCont?`<div class="row" style="margin-top:12px"><button class="btn" id="cont">Продолжить: ${esc(S.title)} (шаг ${S.pos+1} из ${S.path.length})</button></div>`:''}
  </div>
  <div class="levels" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${GRADES.map(g=>{const p=gradeProgress(g);return `<button data-g="${g}" ${p.n?'':'disabled'}><b style="font-size:20px">${gLabel(g)}</b><span>${p.n} тем${p.done?` · начато ${p.done}`:''}${p.weak?` · слабых ${p.weak}`:''}</span></button>`;}).join('')}</div>
  ${weak.length?`<div class="card" style="margin-top:16px"><h2>Слабые правила</h2><p>Здесь были ошибки. Их стоит повторить.</p><ul class="res-list">${weak.map(r=>`<li><span>${esc(RU.reg[r].title)}</span><span class="small">${gLabel(RU.reg[r].grade)} · <span class="ok-t">${S.stats[r].r}</span> / <span class="bad-t">${S.stats[r].w}</span></span></li>`).join('')}</ul><button class="btn" id="redoWeak">Повторить слабые правила</button></div>`:''}
  <div class="card" style="margin-top:16px"><h2>Как выбрать, с чего начать</h2><p>${C.homeStart}</p>
  <button class="btn ghost" id="reset">Сбросить весь прогресс</button></div>`;
  if($('#cont'))$('#cont').onclick=()=>{S.view='run';save();render();};
  m.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{const g=GRADES.find(x=>String(x)===b.dataset.g);showGrade(g);});
  if($('#redoWeak'))$('#redoWeak').onclick=()=>start(rulePath(weak,'Повторение слабых правил'),null,'Повторение слабых правил');
  $('#reset').onclick=()=>{if($('#reset').dataset.c){S=fresh();save();render();}else{$('#reset').dataset.c='1';$('#reset').textContent='Точно сбросить? Нажми ещё раз';}};
}
function showGrade(g){
  const m=$('#main');const rs=rulesOf(g);
  let sec='';let h='';
  rs.forEach((rid,i)=>{const r=RU.reg[rid];if(r.section!==sec){sec=r.section;h+=`<h3>${esc(sec)}</h3>`;}const s=S.stats[rid];
    h+=`<li><span>${i+1}. ${esc(r.title)}</span><span class="row" style="gap:6px">${s?`<span class="small"><span class="ok-t">${s.r}</span>/<span class="bad-t">${s.w}</span></span>`:''}<button class="btn ghost" style="padding:6px 10px" data-r="${rid}">Начать отсюда</button></span></li>`;});
  m.innerHTML=`<div class="card" style="margin-top:20px"><button class="btn ghost" id="back">← Все уровни</button><h1 style="margin-top:12px">${gLabel(g)}</h1>
  <p>${rs.length} тем. Сначала короткое объяснение, потом упражнения. ${(RU.mixes[g]||[]).length?'В конце — итоговое упражнение, где встретятся и правила прошлых классов.':''}</p>
  <button class="btn" id="go">Начать с первой темы</button></div>
  <div class="card"><h2>Темы: ${gLabel(g)}</h2><ul class="res-list">${h}</ul></div>`;
  $('#back').onclick=()=>render();
  $('#go').onclick=()=>start(gradePath(g),g,gLabel(g));
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const p=gradePath(g);const idx=p.findIndex(s=>s.k==='intro'&&s.rule===b.dataset.r);start(p,g,gLabel(g));S.pos=Math.max(0,idx);save();render();});
  window.scrollTo({top:0});
}

/* ---------- reference ---------- */
function renderRef(m){
  let h=`<div class="card" style="margin-top:20px"><h1>Справочник правил</h1><p>Все темы по уровням. Нажми на тему, чтобы прочитать правило и потренироваться.</p></div>`;
  GRADES.forEach(g=>{const rs=rulesOf(g);if(!rs.length)return;let sec='';h+=`<div class="card"><h2>${gLabel(g)}</h2>`;
    rs.forEach(rid=>{const r=RU.reg[rid];if(r.section!==sec){sec=r.section;h+=`<h3>${esc(sec)}</h3>`;}h+=`<div><a href="#" data-r="${rid}" style="color:var(--accent-ink)">${esc(r.title)}</a></div>`;});h+='</div>';});
  m.innerHTML=h;
  m.querySelectorAll('[data-r]').forEach(a=>a.onclick=e=>{e.preventDefault();S.view='rule';S.ruleView=a.dataset.r;save();render();});
}
function theoryBlock(r){return `${r.short?`<div class="box rule"><b>Правило коротко</b>${r.short}</div>`:''}${r.theory||''}`;}
function renderRuleCard(m,rid){
  const r=RU.reg[rid];
  m.innerHTML=`<div class="card" style="margin-top:20px"><button class="btn ghost" id="back">← Справочник</button>
  <div style="margin-top:12px"><span class="lvl-tag">${gLabel(r.grade)} · ${esc(r.section)}</span></div><h1>${esc(r.title)}</h1>${theoryBlock(r)}

  $('#back').onclick=()=>{S.view='ref';save();render();};
  if($('#simpler'))$('#simpler').onclick=()=>{$('#t2').innerHTML=`<div class="fb alt"><h3>Ещё раз, проще</h3>${r.theory2}</div>`;$('#simpler').remove();};
  $('#practice').onclick=()=>start(rulePath([rid]),r.grade,'Правило: '+r.title);
}

/* ---------- run ---------- */
function cur(){return S.stack.length?S.stack[S.stack.length-1]:null;}
function renderRun(m){
  const f=cur();
  if(f){
    if(f.k==='remed'){ if(f.phase==='theory')return renderRemedTheory(m,f); if(f.phase==='done')return renderRemedDone(m,f); return renderItem(m,ITEMS[f.cur],f); }
    if(f.k==='retry'||f.k==='reinf')return renderItem(m,ITEMS[f.cur],f);
  }
  const st=S.path[S.pos];
  if(!st){S.view='home';save();return render();}
  if(st.k==='intro')return renderIntro(m,st);
  if(st.k==='mixintro')return renderMixIntro(m,st);
  if(st.k==='end')return renderEnd(m);
  return renderItem(m,ITEMS[st.key],null);
}
function topbar(){
  const pct=Math.round(S.pos/Math.max(1,S.path.length)*100);
  return `<div class="meta"><span>${esc(S.title)} · шаг ${S.pos+1} из ${S.path.length}</span><span><a href="#" id="toHome" style="color:var(--accent-ink)">Выйти к уровням</a></span></div><div class="progress"><i style="width:${pct}%"></i></div>`;
}
function bindTop(){const a=$('#toHome');if(a)a.onclick=e=>{e.preventDefault();S.view='home';save();render();};}
function advance(){S.pos++;save();render();}

function renderIntro(m,st){
  const r=RU.reg[st.rule];
  m.innerHTML=`<div class="card" style="margin-top:20px">${topbar()}
  <div style="margin-top:12px"><span class="lvl-tag">Новое правило · ${gLabel(r.grade)} · ${esc(r.section)}</span></div>
  <h1>${esc(r.title)}</h1>${theoryBlock(r)}
  ${r.theory2?`<div id="t2"></div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn" id="ok">Прочитал — к упражнениям →</button>${r.theory2?'<button class="btn warn" id="simpler">🤔 Объясни проще</button>':''}</div></div>`;
  bindTop();
  $('#ok').onclick=advance;
  if($('#simpler'))$('#simpler').onclick=()=>{$('#t2').innerHTML=`<div class="fb alt"><h3>Ещё раз, проще</h3>${r.theory2}</div>`;$('#simpler').remove();};
}
function renderMixIntro(m,st){
  m.innerHTML=`<div class="card" style="margin-top:20px">${topbar()}<h1>Итоговое упражнение: ${gLabel(st.grade)}</h1>
  <p>Здесь встретятся все темы этого уровня — и темы прошлых уровней. Если ошибёшься в старом правиле, сначала повторим его, а потом вернёмся.</p>
  <div class="row"><button class="btn" id="ok">Начать →</button></div></div>`;
  bindTop();$('#ok').onclick=advance;
}
function renderEnd(m){
  const rs=[...new Set(S.path.filter(s=>s.rule).map(s=>s.rule))];
  m.innerHTML=`<div class="card" style="margin-top:20px"><h1>Готово! 🎉</h1><p>${esc(S.title)} пройден.</p>
  <ul class="res-list">${rs.map(r=>{const s=S.stats[r]||{r:0,w:0};return `<li><span>${esc(RU.reg[r].title)}</span><span><span class="ok-t">${s.r} верно</span>${s.w?` · <span class="bad-t">${s.w} ошиб.</span>`:''}</span></li>`;}).join('')}</ul>
  <div class="row"><button class="btn" id="home">К выбору уровня</button></div></div>`;
  $('#home').onclick=()=>{S.path=[];S.pos=0;S.view='home';save();render();};
}

/* remediation */
function renderRemedTheory(m,f){
  const r=RU.reg[f.rule];const from=S.grade;
  m.innerHTML=`<div class="card" style="margin-top:20px">${topbar()}
  <div class="fb alt" style="margin-top:12px"><h3>↩ Повторяем тему: ${gLabel(r.grade)}</h3>
  Ошибка была в правиле <b>${esc(r.title)}</b>${GRADES.indexOf(r.grade)<GRADES.indexOf(from)?` — это тема уровня <b>${gLabel(r.grade)}</b>`:''}. Сначала повторим его, потом решим ${REMED_NEED} упражнения подряд без ошибок — и вернёмся${from!=null?` в «${gLabel(from)}»`:''} к твоему упражнению.</div>
  <h1 style="margin-top:14px">${esc(r.title)}</h1>${theoryBlock(r)}<div id="t2"></div>
  <div class="understand card" style="margin-top:12px"><label for="und">Прочитай правило. Если всё ясно — напиши «понял»:</label>
  <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div><div class="errmsg" id="undErr"></div>
  ${r.theory2?'<div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни проще</button></div>':''}</div></div>`;
  bindTop();
  const go=()=>{if(!isPonyal($('#und').value)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься.';return;}f.phase='practice';f.cur=pickItem(f.rule,f.used);f.used.push(f.cur);save();render();};
  $('#undOk').onclick=go;$('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  if($('#undNo'))$('#undNo').onclick=()=>{$('#t2').innerHTML=`<div class="fb alt"><h3>Ещё раз, проще</h3>${r.theory2}</div>`;$('#undNo').remove();};
}
function renderRemedDone(m,f){
  const r=RU.reg[f.rule];const ok=f.streak>=REMED_NEED;
  m.innerHTML=`<div class="card" style="margin-top:20px">${topbar()}<div class="fb ${ok?'ok':'alt'}" style="margin-top:12px">
  <h3>${ok?'Правило повторено ✓':'Правило пока даётся трудно'}</h3>
  ${ok?`Ты решил ${REMED_NEED} упражнения подряд без ошибок на правило «${esc(r.title)}».`:`Правило «${esc(r.title)}» я отметил как слабое — повтори его потом в «Справочнике правил».`}
  <br>Теперь возвращаемся${S.grade!=null?` в «${gLabel(S.grade)}»`:''} — к упражнению, где была ошибка.</div>
  <div class="row" style="margin-top:12px"><button class="btn" id="back">Вернуться к упражнению →</button></div></div>`;
  bindTop();$('#back').onclick=()=>{S.stack.pop();save();render();};
}

/* ---------- item ---------- */
function isPonyal(v){return /(^|\s)(понял|поняла|понятно|ясно)/i.test(String(v).trim());}
function optLabel(o){return o==='_'?'(ничего)':o;}
function fullText(it,mark){
  return it.parts.map(p=>{if(p.t!=null)return esc(p.t);const g=it.gaps[p.gap];const v=g.opts[g.ans];const s=v==='_'?'':esc(v);return mark&&s?`<b class="fix">${s}</b>`:s;}).join('');
}
function renderItem(m,it,f){
  if(!it){console.error('no item');if(f){S.stack.pop();}else S.pos++;save();return render();}
  let tag='';
  const r=RU.reg[it.rule]||{};
  if(!f)tag=`<span class="lvl-tag">${it.rule&&S.path[S.pos].rule?`${gLabel(r.grade)} · ${esc(r.title)}`:'Итоговое упражнение'} · уровень ${'●'.repeat(it.lvl)}${'○'.repeat(3-it.lvl)}</span>`;
  else if(f.k==='remed')tag=`<span class="lvl-tag re">↩ Повторение: ${esc(RU.reg[f.rule].title)} (${gLabel(RU.reg[f.rule].grade)}) · подряд верно: ${f.streak} из ${REMED_NEED}</span>`;
  else if(f.k==='retry')tag=`<span class="lvl-tag re">↪ Возвращаемся к упражнению, где была ошибка</span>`;
  else tag=`<span class="lvl-tag re">Закрепление: похожее упражнение</span>`;
  let body='';
  if(it.type==='gaps'){
    body=`<div class="gaps-text">${it.parts.map(p=>p.t!=null?esc(p.t):`<select class="gap" data-g="${p.gap}" aria-label="Пропуск ${p.gap+1}"><option value="" selected disabled>…</option>${shuf(it.gaps[p.gap].opts.map((o,i)=>[o,i])).map(([o,i])=>`<option value="${i}">${esc(optLabel(o))}</option>`).join('')}</select>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(it.type==='spell'){
    body=`<div class="row">${sayBtns(it.say)}</div><div class="inp" style="margin-top:10px"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(it.ph||'напиши, что услышал')}"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(it.type==='read'){
    body=`<div class="readtext">${esc(it.text)}</div><div class="row" style="margin-top:8px">${sayBtns(it.text)}</div>
    <div class="box tip" style="margin-top:10px"><b>Как прочитать вслух</b>1) Нажми на поле ниже. 2) На клавиатуре iPad нажми <b>🎤</b> (микрофон). 3) Прочитай текст вслух, чётко. 4) Нажми «Проверить».</div>
    <div class="inp"><textarea id="ans" rows="3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="здесь появится то, что ты прочитал"></textarea></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="check">Проверить</button><button class="btn ghost" id="skipRead">Не могу сейчас читать вслух — пропустить</button></div><div class="errmsg" id="err"></div>`;
  }else{
    const L=['А','Б','В','Г','Д','Е'];
    body=(it.type==='listen'?`<div class="row" style="margin-bottom:10px">${sayBtns(it.say)}</div>`:'')+`<div class="opts">${(it.opts.length>2?shuf(it.opts.map((o,i)=>[o,i])):it.opts.map((o,i)=>[o,i])).map(([o,i],pos)=>`<button class="opt" data-i="${i}"><span class="k">${L[pos]}</span><span>${o}</span></button>`).join('')}</div>`;
  }
  m.innerHTML=`<div class="card" style="margin-top:20px">${topbar()}<div style="margin-top:12px">${tag}</div>
  <div class="q">${it.q||(it.type==='gaps'?'Выбери, что нужно вставить в каждый пропуск:':'')}</div>${body}<div id="fb"></div></div>`;
  bindTop();
  if(it.type==='gaps'){
    m.querySelectorAll('select.gap').forEach(s=>s.addEventListener('change',()=>{$('#err').textContent='';s.classList.add('filled');}));
    $('#check').onclick=()=>{
      const vals=[...m.querySelectorAll('select.gap')].map(s=>s.value===''?null:+s.value);
      if(vals.some(v=>v===null)){$('#err').textContent='Заполни все пропуски (их '+vals.length+').';return;}
      answer(it,f,vals);
    };
  }else if(it.type==='spell'||it.type==='read'){
    const inp=$('#ans');inp.addEventListener('input',()=>$('#err').textContent='');
    if(it.type==='spell')inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    $('#check').onclick=()=>{if(!inp.value.trim()){$('#err').textContent=it.type==='read'?'Сначала прочитай текст вслух через 🎤 на клавиатуре — в поле должен появиться текст.':'Сначала напиши ответ.';return;}answer(it,f,inp.value);};
    if($('#skipRead'))$('#skipRead').onclick=()=>{markSeen(it.key);if(f&&f.k==='remed'){nextRemed(f);return;}if(f){S.stack.pop();S.pos++;}else S.pos++;save();render();};
  }else m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(it,f,+b.dataset.i));
}
function answer(it,f,val){
  const m=$('#main');let wrongRules=[];let detail='';
  if(it.type==='gaps'){
    const sels=[...m.querySelectorAll('select.gap')];
    sels.forEach((s,i)=>{s.disabled=true;const g=it.gaps[i];if(val[i]===g.ans)s.classList.add('right');else{s.classList.add('wrong');wrongRules.push(g.rule);
      detail+=`<li>Пропуск ${i+1}: ты выбрал «${esc(optLabel(g.opts[val[i]]))}», правильно «${esc(optLabel(g.opts[g.ans]))}» — правило ${esc(ruleTag(g.rule))}</li>`;}});
    $('#check').disabled=true;
  }else if(it.type==='spell'){
    $('#ans').disabled=true;$('#check').disabled=true;
    const acc=(Array.isArray(it.ans)?it.ans:[it.ans]).map(normSpell);
    if(!acc.includes(normSpell(val))){wrongRules.push(it.rule);detail=`<li>Ты написал «${esc(val)}», правильно «${esc((Array.isArray(it.ans)?it.ans[0]:it.ans))}»</li>`;}
  }else if(it.type==='read'){
    $('#ans').disabled=true;$('#check').disabled=true;if($('#skipRead'))$('#skipRead').remove();
    const tw=words(it.text),uw=words(val);const hit=lcsMatch(tw,uw);const n=hit.filter(Boolean).length;
    const ratio=tw.length?n/tw.length:0;const need=tw.length<=6?1:0.85;
    const raw=String(it.text).split(/(\s+)/);let wi=0;
    const shown=raw.map(tok=>{if(/^\s+$/.test(tok)||!tok)return tok;const ws=words(tok);if(!ws.length)return esc(tok);const ok=ws.every((_,k)=>hit[wi+k]);wi+=ws.length;return ok?`<span class="w-ok">${esc(tok)}</span>`:`<button class="w-bad" data-say="${esc(tok.replace(/[^A-Za-z'’-]/g,''))}" title="Послушать">${esc(tok)}</button>`;}).join('');
    it._readShown=`<div class="readtext">${shown}</div><p class="small">Зелёные слова прочитаны верно (${n} из ${tw.length}). На красное слово можно нажать — услышишь, как оно звучит.</p>`;
    if(ratio<need){wrongRules.push(it.rule);detail='';}
  }else{
    m.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===it.ans)b.classList.add('right');else if(i===val)b.classList.add('wrong');});
    if(val!==it.ans){wrongRules.push(it.rule);}
  }
  wrongRules=[...new Set(wrongRules)];
  markSeen(it.key);
  const ok=!wrongRules.length;
  const rulesHere=itemRules(it);
  if(!f||f.k!=='retry'){rulesHere.forEach(r=>{if(wrongRules.includes(r))stat(r).w++;else stat(r).r++;});}
  const fb=$('#fb');
  const sayFull=it.type==='gaps'?fullText(it,false).replace(/<[^>]+>/g,''):(it.sayAfter||'');
  const correctShow=it.type==='gaps'?`<div class="ans">Правильно: ${fullText(it,true)}</div>`:it.type==='spell'?`<div class="ans">Правильно: ${esc(Array.isArray(it.ans)?it.ans[0]:it.ans)}</div>`:it.type==='read'?it._readShown:`<div class="ans">Правильный ответ: ${it.opts[it.ans]}</div>`;
  const listenAfter=(it.type==='gaps'&&C.lang)||it.sayAfter?`<div class="row" style="margin-top:6px">${sayBtns(sayFull||it.sayAfter)}</div>`:'';
  if(ok){
    let title=pick(['Верно! ✅','Правильно! 👍','Отлично! ✅']);
    if(f&&f.k==='remed'){f.streak++;title=`Верно! Подряд: ${f.streak} из ${REMED_NEED}`;}
    if(f&&f.k==='retry')title='Теперь верно! 💪';
    fb.innerHTML=`<div class="fb ok"><h3>${title}</h3>${it.type==='gaps'?`<div>${fullText(it,true)}</div>`:''}${it.type==='read'?it._readShown:''}${listenAfter}<div class="small" style="margin-top:6px">${it.why}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Дальше →</button></div></div>`;
    $('#nextBtn').onclick=()=>afterRight(f);$('#nextBtn').focus({preventScroll:true});
    save();return;
  }
  if(f&&f.k==='remed')f.streak=0;
  fb.innerHTML=`<div class="fb bad"><h3>${it.type==='read'?'Пока не всё прочитано верно — давай разберёмся':'Ошибка — давай разберёмся'}</h3>${correctShow}${listenAfter}
   ${detail?`<ul class="steps">${detail}</ul>`:''}<div><b>Почему так:</b></div><div>${it.why}</div></div><div id="alt"></div>
   <div class="understand card" style="margin-top:12px"><label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
   <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div><div class="errmsg" id="undErr"></div>
   <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div></div>`;
  let alt=0;
  $('#undNo').onclick=()=>{alt++;const r=RU.reg[wrongRules[0]];
    if(alt===1){$('#alt').innerHTML+=`<div class="fb alt"><h3>Объясняю по-другому</h3>${it.why2}</div>`;$('#undNo').textContent='🤔 Всё равно не понял';}
    else if(alt===2){$('#alt').innerHTML+=`<div class="fb alt"><h3>Само правило — простыми словами</h3><b>${esc(r.title)}</b> (${gLabel(r.grade)})<br>${r.theory2||r.short||''}</div>`;}
    else{$('#alt').innerHTML+=`<div class="fb alt"><h3>Полное правило</h3>${theoryBlock(r)}<p class="small">Если всё ещё непонятно — покажи это упражнение маме или учителю.</p></div>`;$('#undNo').style.display='none';}
  };
  const go=()=>{if(!isPonyal($('#und').value)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}afterWrong(it,f,wrongRules);};
  $('#undOk').onclick=go;$('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  save();
}
function afterRight(f){
  if(!f){advance();return;}
  if(f.k==='remed'){ if(f.streak>=REMED_NEED){f.phase='done';save();render();return;} nextRemed(f);return; }
  if(f.k==='retry'||f.k==='reinf'){S.stack.pop();S.pos++;save();render();return;}
}
function nextRemed(f){
  if(f.used.length>=REMED_MAX){f.phase='done';save();render();return;}
  f.cur=pickItem(f.rule,f.used);f.used.push(f.cur);save();render();
}
function afterWrong(it,f,wrongRules){
  if(f&&f.k==='remed'){nextRemed(f);return;}
  if(f&&f.k==='retry'){S.stack.pop();S.pos++;save();render();return;}
  if(f&&f.k==='reinf'){
    f.tries++;
    const others=wrongRules.filter(r=>r!==f.rule);
    if(others.length){pushRemed(others);return;}
    if(f.tries>=REINF_MAX){S.stack.pop();S.pos++;save();render();return;}
    f.cur=pickItem(f.rule,f.used);f.used.push(f.cur);save();render();return;
  }
  /* main path */
  const curRule=S.path[S.pos].rule;
  const others=wrongRules.filter(r=>r!==curRule);
  const same=wrongRules.includes(curRule);
  if(others.length){
    S.stack.push({k:'retry',cur:it.key});
    pushRemed(others);return;
  }
  if(same){const fr={k:'reinf',rule:curRule,used:[it.key],tries:0};fr.cur=pickItem(curRule,fr.used);fr.used.push(fr.cur);S.stack.push(fr);save();render();return;}
  advance();
}
function pushRemed(rules){
  rules=rules.filter(r=>RU.reg[r]&&RU.reg[r].items.length);
  if(!rules.length){const top=S.stack[S.stack.length-1];if(top&&top.k==='retry'){S.stack.pop();S.pos++;}save();render();return;}
  rules=rules.slice().sort((a,b)=>GRADES.indexOf(RU.reg[b].grade)-GRADES.indexOf(RU.reg[a].grade)); // push higher first so lowest grade is on top
  rules.forEach(r=>S.stack.push({k:'remed',rule:r,phase:'theory',streak:0,used:[],cur:null}));
  save();render();
}

window.__ru={get S(){return S;},ITEMS:()=>ITEMS,render,start,gradePath};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else setTimeout(build,0);
})();
</script>
