G(6,()=>{const e=pick(EL);return {type:'num',q:`В каком <b>периоде</b> находится ${nm(e)}?`,ans:e.p,short:`${e.s}: ${e.p} период.`,
explain:`${cap(e.n)} стоит в <b>${e.p}-м</b> горизонтальном ряду — это ${e.p} период${e.p<=3?' (малый)':' (большой)'}.`,
explain2:`Периоды: 1 — H, He; 2 — от Li до Ne; 3 — от Na до Ar; 4 — от K до Kr (там же Cr, Mn, Fe, Cu, Zn, Br); 5 — от Rb до Xe (Ag, Sn, I); 6 — Cs…Rn (Ba, Au, Hg, Pb). ${e.s} — ${e.p}.`};});
G(6,()=>{const e=pick(A20);const g=GN[e.g];return {type:'num',q:`Номер <b>группы</b>, в которой находится ${nm(e)}? (ответ — арабской цифрой)`,ans:g,short:`${e.s}: ${e.g}A группа.`,
explain:`${cap(e.n)} стоит в <b>${e.g} группе</b> (главная подгруппа ${e.g}A), то есть ${g}.`,
explain2:`Во 2-м и 3-м периодах номер группы — просто порядок в строке: Li/Na — I, Be/Mg — II, B/Al — III, C/Si — IV, N/P — V, O/S — VI, F/Cl — VII, Ne/Ar — VIII. ${e.s} → ${g}.`};});
G(6,()=>{const e=pick(A20.filter(x=>x.z<=20));return SYMQ(`Какой элемент находится в <b>${e.p} периоде, ${e.g} группе</b>, главной подгруппе? Напиши знак.`,e,{short:`${e.p} период, ${e.g}A — ${e.s} (${e.n}).`,
explain:`Идём по ${e.p}-му ряду до ${e.g} столбца (главная подгруппа) — там <b>${e.s}</b>, ${e.n}.`,
explain2:`Как в морском бое: строка ${e.p}, столбец ${GN[e.g]} → ${e.s}. Проверь в виджете таблицы в теории.`});});
G(6,()=>{const b=pick(EL.filter(x=>x.sg==='B'));const wr=sample(EL.filter(x=>x.sg==='A'&&x.z>1),3);
return CH('Какой элемент находится в <b>побочной</b> подгруппе (B)?',nm(b),wr.map(nm),{short:`${b.s}: ${b.g}B группа.`,
explain:`${cap(b.n)} — ${b.p} период, ${b.g} группа, <b>побочная</b> подгруппа (${b.g}B). Остальные — в главных подгруппах: ${wr.map(x=>`${x.s} — ${x.g}A`).join(', ')}.`,
explain2:'Побочные подгруппы появляются только в больших периодах (с 4-го). Там стоят Cr, Mn, Fe, Cu, Zn, Ag, Au, Hg — все металлы.'});});

/* L7 сравнение масс */
RULE(7,'Как узнать, во сколько раз атом X тяжелее атома Y?','Разделить A<sub>r</sub>(X) на A<sub>r</sub>(Y)',['Вычесть A<sub>r</sub>(Y) из A<sub>r</sub>(X)','Разделить порядковый номер X на номер Y','Умножить A<sub>r</sub>(X) на A<sub>r</sub>(Y)'],
{short:'«Во сколько раз» — деление масс.',
explain:'Вопрос «во сколько раз» — всегда <b>деление</b>. Массы атомов пропорциональны A<sub>r</sub>, поэтому делим A<sub>r</sub>(X) : A<sub>r</sub>(Y). Вычитание отвечает на «на сколько больше», а номера — это не массы.',
explain2:'Пример: S — 32, O — 16. 32 : 16 = 2 — атом серы тяжелее в 2 раза.'});
G(7,()=>{for(;;){const a=pick(EL),b=pick(EL.filter(x=>x.ar<a.ar));if(!b)continue;const r=a.ar/b.ar;if(r>20)continue;const ok=Math.abs(r*10-Math.round(r*10))<1e-9;if(!ok&&Math.random()<0.6)continue;
return NUM(`Во сколько раз атом <b>${a.s}</b> (${a.n}) тяжелее атома <b>${b.s}</b> (${b.n})?`,r,1,{short:`${N(a.ar)} : ${N(b.ar)} ≈ ${N(rd(r,1))}.`,
explain:`A<sub>r</sub>(${a.s}) = ${N(a.ar)}, A<sub>r</sub>(${b.s}) = ${N(b.ar)}. ${N(a.ar)} : ${N(b.ar)} ${ok?'=':'≈'} <b>${N(rd(r,1))}</b>.`,
explain2:`Проверка умножением: ${N(b.ar)} · ${N(rd(r,1))} ${ok?'=':'≈'} ${N(rd(b.ar*rd(r,1),1))} — ${ok?'ровно':'почти'} ${N(a.ar)} ✓.`});}});
G(7,()=>{const f=pick(['O2','O3','N2','H2','Cl2','P4','S8','F2','Br2','I2']);const m=parse(f);const el=Object.keys(m)[0];const v=m[el]*BY[el].ar;
return {type:'num',q:`Чему равна относительная молекулярная масса M<sub>r</sub>(${C(f)})?`,ans:v,short:`${m[el]} · ${N(BY[el].ar)} = ${N(v)}.`,
explain:`M<sub>r</sub> — сумма A<sub>r</sub> всех атомов молекулы. В ${C(f)} ${m[el]} атома ${el}, A<sub>r</sub>(${el}) = ${N(BY[el].ar)}: ${m[el]} · ${N(BY[el].ar)} = <b>${N(v)}</b>.`,
explain2:`Сложи по атомам: ${Array(m[el]).fill(N(BY[el].ar)).join(' + ')} = ${N(v)}.`};});
G(7,()=>{const s=sample(EL.filter(e=>e.z<=30),4);if(new Set(s.map(x=>x.ar)).size<4)return null;const h=s.reduce((a,b)=>a.ar>b.ar?a:b);
return CH('Атом какого элемента <b>самый тяжёлый</b>?',nm(h),s.filter(x=>x!==h).map(nm),{short:`A<sub>r</sub>(${h.s}) = ${N(h.ar)} — наибольшая.`,
explain:`Сравниваем A<sub>r</sub>: ${s.map(x=>`${x.s} — ${N(x.ar)}`).join(', ')}. Наибольшая у <b>${h.s}</b>.`,
explain2:`Подсказка: чем дальше элемент в таблице (больше номер), тем, как правило, тяжелее атом. ${h.s} — №${h.z}, остальные: ${s.filter(x=>x!==h).map(x=>x.s+' №'+x.z).join(', ')}.`});});

/* L8 ★ */
RULE(8,'Как найти, сколько атомов в молекуле простого вещества, если известна её M<sub>r</sub>?','Разделить M<sub>r</sub> на A<sub>r</sub> элемента',['Умножить M<sub>r</sub> на A<sub>r</sub>','Вычесть из M<sub>r</sub> порядковый номер','Разделить M<sub>r</sub> на порядковый номер'],
{short:'Число атомов = M<sub>r</sub> : A<sub>r</sub>.',
explain:`M<sub>r</sub> — сумма A<sub>r</sub> всех атомов. В простом веществе все атомы одинаковые, поэтому <b>число атомов = M<sub>r</sub> : A<sub>r</sub></b>. Пример: M<sub>r</sub>(${C('O3')}) = 48, 48 : 16 = 3. Порядковый номер — не масса.`,
explain2:'Пакет яблок весит 600 г, одно яблоко — 200 г. Сколько яблок? 600 : 200 = 3. Так же и с атомами.'});
G(8,()=>{for(;;){const b=pick(EL),k=R(2,8);const c=EL.filter(x=>x.ar===k*b.ar);if(c.length!==1)continue;const e=c[0];
return SYMQ(`★ Атом элемента X в <b>${k}</b> ${H.plural(k,'раз','раза','раз')} тяжелее атома <b>${b.s}</b> (${b.n}). Какой это элемент? Напиши знак.`,e,{hint:'A<sub>r</sub>(X) = k · A<sub>r</sub>(Y).',short:`A<sub>r</sub>(X) = ${k} · ${N(b.ar)} = ${N(e.ar)} → ${e.s}.`,
explain:`A<sub>r</sub>(${b.s}) = ${N(b.ar)}, значит, A<sub>r</sub>(X) = ${k} · ${N(b.ar)} = ${N(e.ar)}. Такая масса у <b>${e.s}</b> — ${e.n}.`,
explain2:`Проверка: ${N(e.ar)} : ${N(b.ar)} = ${k} ✓. Ищи в таблице A<sub>r</sub> = ${N(e.ar)}.`});}},{star:true});
G(8,()=>{const p=pick([['S',8],['P',4],['O',3],['S',6],['P',2]]);const e=BY[p[0]];const M=e.ar*p[1];
return {type:'num',q:`★ Молекула простого вещества, образованного элементом <b>${e.s}</b> (${e.n}), имеет M<sub>r</sub> = ${N(M)}. Сколько атомов в этой молекуле?`,ans:p[1],hint:'Раздели M<sub>r</sub> на A<sub>r</sub>.',short:`${N(M)} : ${N(e.ar)} = ${p[1]} → ${C(p[0]+p[1])}.`,
explain:`Все атомы в молекуле одинаковые, у каждого A<sub>r</sub> = ${N(e.ar)}. ${N(M)} : ${N(e.ar)} = <b>${p[1]}</b>. Формула ${C(p[0]+p[1])}.`,
explain2:`Проверка: ${p[1]} · ${N(e.ar)} = ${N(M)} ✓. ${p[0]==='S'&&p[1]===8?'Сера и правда состоит из кольцевых молекул S₈.':p[0]==='P'&&p[1]===4?'Белый фосфор состоит из молекул P₄ — пирамидок.':p[0]==='O'?'Это озон O₃.':'В парах этого вещества бывают и такие молекулы.'}`};},{star:true});
G(8,()=>{const e=BY[pick(['H','N','O','F','Cl','Br','I'])];const M=2*e.ar;
return SYMQ(`★ Простое вещество состоит из двухатомных молекул <span class="chem">Э<sub>2</sub></span>, M<sub>r</sub> = ${N(M)}. Какой это элемент? Напиши знак.`,e,{hint:'A<sub>r</sub> = M<sub>r</sub> : 2.',short:`${N(M)} : 2 = ${N(e.ar)} → ${e.s}.`,
explain:`В молекуле 2 одинаковых атома: A<sub>r</sub> = ${N(M)} : 2 = ${N(e.ar)}. Это <b>${e.s}</b> (${e.n}), вещество ${C(e.s+'2')}.`,
explain2:`Двухатомные молекулы образуют H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂ — проверь их массы: 2, 28, 32, 38, 71, 160, 254.`});},{star:true});
G(8,()=>{for(;;){const b=BY[pick(['O','He','C','H'])];const e=pick(EL.filter(x=>x!==b&&x.ar>b.ar));const k=e.ar/b.ar;if(!Number.isInteger(k)||k>30)continue;
return {type:'num',q:`★ Сколько атомов <b>${b.s}</b> (${b.n}) имеют в сумме такую же массу, как один атом <b>${e.s}</b> (${e.n})?`,ans:k,short:`${N(e.ar)} : ${N(b.ar)} = ${k}.`,
explain:`A<sub>r</sub>(${e.s}) = ${N(e.ar)}, A<sub>r</sub>(${b.s}) = ${N(b.ar)}. Нужно ${N(e.ar)} : ${N(b.ar)} = <b>${k}</b> атомов ${b.s}.`,
explain2:`Представь весы: на одной чаше атом ${e.s} (${N(e.ar)}), на другой кладём атомы ${b.s} по ${N(b.ar)}. ${k} · ${N(b.ar)} = ${N(e.ar)} — равновесие.`};}},{star:true});
G(8,()=>{const fs=sample(['H2SO4','H2O','NH3','CH4','HNO3','H3PO4','C2H5OH','HCl','NaOH','Ca(OH)2'],2);const k=[R(2,4),R(2,5)];
const per=fs.map(f=>parse(f).H||0);const v=k[0]*per[0]+k[1]*per[1];if(!per[0]||!per[1])return null;
return {type:'num',q:`★ Сколько всего атомов <b>водорода</b> в записи ${k[0]}${C(fs[0])} + ${k[1]}${C(fs[1])}?`,ans:v,short:`${k[0]}·${per[0]} + ${k[1]}·${per[1]} = ${v}.`,
explain:`В ${C(fs[0])} атомов H: ${per[0]}, умножаем на коэффициент ${k[0]}: ${k[0]*per[0]}. В ${C(fs[1])}: ${per[1]}, · ${k[1]} = ${k[1]*per[1]}. Всего <b>${v}</b>.`,
explain2:`Не забудь H внутри скобок: в ${C('Ca(OH)2')} водорода 2, а не 1. Считай отдельно каждую часть, потом складывай.`};},{star:true});
G(8,()=>{const A=EL.filter(e=>e.sg==='A'&&e.z>1);const pairs=[];for(const a of A)for(const b of A)if(a.g===b.g&&a.z<b.z)pairs.push([a,b]);
const good=pairs.filter(p=>p[1].ar===2*p[0].ar),bad=pairs.filter(p=>p[1].ar!==2*p[0].ar);const it=shuffle(good.map(p=>[p,1]).concat(sample(bad,4).map(p=>[p,0])));
const L=p=>`${p[0].s} и ${p[1].s}`;
return {type:'multi',q:'★ В каких парах элементы стоят в <b>одной главной подгруппе</b> и A<sub>r</sub> одного <b>ровно в 2 раза</b> больше A<sub>r</sub> другого? Выбери все.',opts:it.map(x=>L(x[0])),ans:it.map((x,i)=>x[1]?i:-1).filter(i=>i>=0),
short:`${good.map(p=>`${p[1].s} (${N(p[1].ar)}) = 2 · ${p[0].s} (${N(p[0].ar)})`).join('; ')}.`,
explain:`Все пары и так в одной подгруппе — проверяем отношение масс: ${it.map(x=>`${x[0][1].s}/${x[0][0].s} = ${N(x[0][1].ar)}/${N(x[0][0].ar)}${x[1]?' = 2 ✓':''}`).join('; ')}. Подходят: <b>${good.map(L).join(', ')}</b>.`,
explain2:`Удвой меньшую массу и сравни: ${it.map(x=>`2·${N(x[0][0].ar)} = ${N(2*x[0][0].ar)} ${x[1]?'=':'≠'} ${N(x[0][1].ar)}`).join('; ')}.`};},{star:true});
