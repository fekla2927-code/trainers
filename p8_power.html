<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Работа и мощность тока — тренажёр</title>
<style>:root{

  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;

html{-webkit-text-size-adjust:100%}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){

 return NUMT(kJ,1,{q:`📱 Аккумулятор смартфона: ${cap} мА·ч при напряжении ${N(U)} В. Сколько энергии он запасает? Ответ — в кДж, округли до десятых.`,hint:'мА·ч → А·ч → Вт·ч (умножить на U) → Дж (1 Вт·ч = 3600 Дж).',
 short:`${N(cap/1000)} А·ч · ${N(U)} В = ${N(rnd(Wh,3))} Вт·ч ≈ ${N(rnd(kJ,1))} кДж.`,
 explain:`Энергия ${M('A = U·q')}. Заряд: ${cap} мА·ч = ${N(cap/1000)} А·ч = ${N(cap/1000)} · 3600 = ${N(cap*3.6)} Кл.<br>${M(`A = ${N(U)} · ${N(cap*3.6)} = ${N(rnd(kJ*1000,1))} Дж ≈ ${N(rnd(kJ,1))} кДж`)}.`,
 explain2:`Через ватт-часы: ${N(cap/1000)} А·ч · ${N(U)} В = ${N(rnd(Wh,3))} Вт·ч. 1 Вт·ч = 3600 Дж = 3,6 кДж → ${N(rnd(Wh,3))} · 3,6 ≈ ${N(rnd(kJ,1))} кДж. Для сравнения: столько энергии в одной чайной ложке сахара (~70 кДж)!`});});

/* L1 — мощность */
G(1,()=>CH('Как найти мощность электрического тока через напряжение и силу тока?',M('P = U·I'),[M('P = U / I'),M('P = I / U'),M('P = U·I·t')],{
 short:'P = UI.',explain:`Мощность — работа за единицу времени: ${M('P = A / t = UIt / t = U·I')}. ${M('U·I·t')} — это уже работа, а ${M('U/I')} — сопротивление.`,
 explain2:'Проверь на чайнике: 220 В и 10 А → 2200 Вт — типичная мощность чайника ✅. 220/10 = 22 — это омы, не ватты.'}),{rule:true});
G(1,()=>{const U=pick([5,9,12,20,110,220]);const I=pick([0.5,1,1.5,2,3,3.25,4,5,10]);const P=U*I;if(!nice(P*10))return null;
 return NUMT(P,1,{q:`Через прибор при напряжении ${U} В идёт ток ${N(I)} А. Какова его мощность? Ответ — в ваттах.`,hint:'P = UI.',short:`${U} · ${N(I)} = ${N(P)} Вт.`,
 explain:`${M(`P = U·I = ${U} · ${N(I)} = ${N(P)} Вт`)}.${U===5||U===9||U===20?' Такие напряжения выдают USB-зарядки.':''}`,
 explain2:`Каждый кулон отдаёт ${U} Дж, а за секунду проходит ${N(I)} Кл. Значит, за секунду выделяется ${U} · ${N(I)} = ${N(P)} Дж — это ${N(P)} Вт.`});});
G(1,()=>{const d=pick([['электрочайник',2200],['утюг',1100],['обогреватель',1650],['фен',880],['микроволновка',1320],['пылесос',1540]]);const I=d[1]/220;
 return NUMT(I,2,{q:`На ${d[0]==='утюг'||d[0]==='фен'||d[0]==='пылесос'||d[0]==='обогреватель'?d[0]+'е':d[0]==='микроволновка'?'микроволновке':'электрочайнике'} написано: «220 В, ${d[1]} Вт». Какой ток через него идёт? Ответ — в амперах.`,hint:'P = UI → I = P / U.',
 short:`I = ${d[1]} / 220 = ${N(rnd(I,2))} А.`,explain:`Из ${M('P = UI')}: ${M(`I = P / U = ${d[1]} / 220 = ${N(rnd(I,2))} А`)}.`,
 explain2:`Каждый ампер при 220 В даёт 220 Вт. Сколько раз по 220 Вт помещается в ${d[1]} Вт? ${d[1]} / 220 = ${N(rnd(I,2))} → ${N(rnd(I,2))} А.`});});
G(1,()=>{const d=pick(DEV.slice(0,6));const others=sample(DEV.filter(x=>x!==d&&Math.abs(x[1]-d[1])>5).map(x=>'≈ '+N(x[1])+' Вт'),3);
 return CH(`Какая примерная мощность у прибора: <b>${d[0]}</b>?`,'≈ '+N(d[1])+' Вт',others,{short:`${d[0]} — около ${N(d[1])} Вт.`,
 explain:`Ориентиры: светодиодная лампа ≈ 10 Вт, зарядка смартфона ≈ 20 Вт, ноутбук ≈ 65 Вт, телевизор ≈ 100 Вт, утюг ≈ 1500 Вт, чайник ≈ 2000 Вт. Нагревательные приборы — самые мощные: нагреть воду или металл нужно много энергии быстро.`,
 explain2:'Посмотри на вилку: у чайника и утюга толстый шнур — ток около 10 А. У зарядки телефона — тонкий проводок, ток в розетке меньше 0,1 А.'});});

/* L2 — три формулы */
G(2,()=>CH('Какая из формул мощности <b>неверна</b>?',M('P = U²·R'),[M('P = U·I'),M('P = I²·R'),M('P = U²/R')],{
 short:'Правильно U²/R, а не U²·R.',explain:`Подставим закон Ома в ${M('P = UI')}: если ${M('U = IR')}, то ${M('P = I·R·I = I²R')}; если ${M('I = U/R')}, то ${M('P = U·U/R = U²/R')}. Формулы ${M('U²·R')} нет: с ростом сопротивления при том же U мощность <b>падает</b>.`,
 explain2:'Проверь на числах: U = 10 В, R = 5 Ом → I = 2 А. UI = 20 Вт, I²R = 4 · 5 = 20 Вт, U²/R = 100/5 = 20 Вт ✅. А U²R = 500 Вт — не сходится.'}),{rule:true});
G(2,()=>{const I=pick([0.5,1,1.5,2,3,4,5]);const Rv=pick([2,4,5,8,10,12,20,40,100]);const P=I*I*Rv;if(!nice(P*10))return null;
 return NUMT(P,1,{q:`Через резистор сопротивлением ${Rv} Ом идёт ток ${N(I)} А. Какая мощность выделяется в резисторе? Ответ — в ваттах.`,hint:'P = I²R.',short:`${N(I)}² · ${Rv} = ${N(P)} Вт.`,
 explain:`${M(`P = I²R = ${N(I)}² · ${Rv} = ${N(I*I)} · ${Rv} = ${N(P)} Вт`)}.<div class="box err"><b>Не так</b>${N(I)} · ${Rv} = ${N(I*Rv)} — это напряжение (В), а не мощность. Ток надо возвести в квадрат.</div>`,
 explain2:`В два шага: U = I·R = ${N(I)} · ${Rv} = ${N(I*Rv)} В, потом P = U·I = ${N(I*Rv)} · ${N(I)} = ${N(P)} Вт.`});});
G(2,()=>{const P=pick([25,40,60,75,100,150,200]);const Rv=220*220/P;
 return NUMT(Rv,1,{q:`На лампе написано «220 В, ${P} Вт». Каково сопротивление её нити в рабочем режиме? Ответ — в омах, округли до десятых.`,hint:'P = U²/R → R = U²/P.',
 short:`R = 220² / ${P} = 48 400 / ${P} ≈ ${N(rnd(Rv,1))} Ом.`,explain:`Из ${M('P = U²/R')}: ${M(`R = U²/P = 220² / ${P} = 48 400 / ${P} ≈ ${N(rnd(Rv,1))} Ом`)}.<br>Заметь: чем меньше мощность лампы, тем больше её сопротивление.`,
 explain2:`Через ток: I = P/U = ${P}/220 ≈ ${N(rnd(P/220,4))} А, R = U/I = 220 / ${N(rnd(P/220,4))} ≈ ${N(rnd(Rv,1))} Ом.`});});
G(2,()=>{const P=pick([40,60,100,200,1000,2000]);const k=pick([2,4]);const U=220/k;const P2=P/(k*k);
 return NUMT(P2,2,{q:`Прибор с этикеткой «220 В, ${P} Вт» включили в сеть ${N(U)} В. Какую мощность он потребляет? Сопротивление прибора считай постоянным. Ответ — в ваттах.`,hint:'Сопротивление не меняется, а P = U²/R.',
 short:`U меньше в ${k} раза → P меньше в ${k*k} раз: ${N(P2)} Вт.`,explain:`Сопротивление: ${M(`R = 220² / ${P} = ${N(rnd(48400/P,2))} Ом`)}.<br>При ${N(U)} В: ${M(`P = ${N(U)}² / ${N(rnd(48400/P,2))} = ${N(P2)} Вт`)}.<div class="box err"><b>Ловушка</b>${P} / ${k} = ${N(P/k)} Вт — напряжение уменьшилось в ${k} раза, но и ток уменьшился в ${k} раза, так что мощность — в ${k*k} раз.</div>`,
 explain2:`${M('P = U²/R')}: R прежнее, U стало в ${k} раза меньше → U² в ${k*k} раз меньше → P = ${P} / ${k*k} = ${N(P2)} Вт.`});});

/* L3 — счёт */
G(3,()=>CH('Как посчитать стоимость электроэнергии, израсходованной прибором?','Мощность в кВт × время в часах × тариф (₽ за кВт·ч)',['Мощность в Вт × время в минутах × тариф','Напряжение × время × тариф','Мощность в кВт ÷ время в часах × тариф'],{
 short:'кВт × ч × ₽/кВт·ч.',explain:`Счётчик меряет энергию в <b>кВт·ч</b>: ${M('A = P·t')} при P в кВт и t в часах. Тариф — цена одного кВт·ч. Значит, ${M('стоимость = P(кВт) · t(ч) · тариф')}.`,
 explain2:'Как с такси: цена = километры × тариф за километр. Здесь «километры» — это киловатт-часы.'}),{rule:true});
G(3,()=>{const d=pick([['телевизор',100,4],['ноутбук',60,5],['обогреватель',1500,6],['светодиодная лампа',10,6],['игровая приставка',200,3],['компьютер',300,4]]);const days=30;const kwh=d[1]/1000*d[2]*days;
 return NUMT(kwh,2,{q:`${d[0][0].toUpperCase()+d[0].slice(1)} мощностью ${d[1]} Вт работает ${d[2]} ч в день. Сколько электроэнергии он израсходует за ${days} дней? Ответ — в кВт·ч.`,hint:'Переведи Вт в кВт и умножь на общее время в часах.',
 short:`${N(d[1]/1000)} кВт · ${d[2]*days} ч = ${N(kwh)} кВт·ч.`,explain:`1) ${d[1]} Вт = ${N(d[1]/1000)} кВт.<br>2) Время: ${d[2]} ч · ${days} = ${d[2]*days} ч.<br>3) ${M(`A = P·t = ${N(d[1]/1000)} · ${d[2]*days} = ${N(kwh)} кВт·ч`)}.`,
 explain2:`За один день: ${d[1]} Вт · ${d[2]} ч = ${d[1]*d[2]} Вт·ч = ${N(d[1]*d[2]/1000)} кВт·ч. За ${days} дней — в ${days} раз больше: ${N(kwh)} кВт·ч.`});});
G(3,()=>{const P=pick([1.8,2,2.2,2.4]);const mins=pick([10,12,15,20,30]);const days=30;const tar=pick([5,6,7,8]);const kwh=P*mins/60*days;const cost=kwh*tar;if(!nice(cost*10))return null;
 return NUMT(cost,2,{q:`Чайник мощностью ${N(P)} кВт работает в сумме ${mins} мин в день. Сколько рублей стоит его работа за ${days} дней при тарифе ${tar} ₽ за кВт·ч?`,hint:'Минуты переведи в часы (÷60).',
 short:`${N(P)} · ${N(rnd(mins/60,4))} · ${days} = ${N(rnd(kwh,3))} кВт·ч; · ${tar} = ${N(rnd(cost,2))} ₽.`,
 explain:`1) ${mins} мин = ${mins}/60 = ${N(rnd(mins/60,4))} ч.<br>2) За день: ${M(`${N(P)} · ${N(rnd(mins/60,4))} = ${N(rnd(P*mins/60,4))} кВт·ч`)}.<br>3) За ${days} дней: ${N(rnd(kwh,3))} кВт·ч.<br>4) Стоимость: ${M(`${N(rnd(kwh,3))} · ${tar} = ${N(rnd(cost,2))} ₽`)}.<div class="box err"><b>Ловушка</b>${mins} мин ≠ 0,${mins} ч! В часе 60 минут.</div>`,
 explain2:`Через минуты: за месяц ${mins*days} мин = ${N(mins*days/60)} ч. Энергия ${N(P)} · ${N(mins*days/60)} = ${N(rnd(kwh,3))} кВт·ч, стоимость ${N(rnd(cost,2))} ₽.`});});
G(3,()=>{const a=rnd(R(10000,40000)+R(0,9)/10,1);const d=pick([120,145,180,215,250,310]);const b=rnd(a+d+R(0,9)/10,1);const tar=pick([5,6,7,8]);const kwh=rnd(b-a,1);const cost=rnd(kwh*tar,2);
 return NUMT(cost,2,{q:`Показания счётчика 1 марта: <b>${N(a)}</b> кВт·ч, 1 апреля: <b>${N(b)}</b> кВт·ч. Тариф ${tar} ₽ за кВт·ч. Сколько нужно заплатить за март? Ответ — в рублях.`,hint:'Счётчик показывает накопленную энергию. За месяц израсходовано столько, на сколько выросло показание.',
 short:`${N(b)} − ${N(a)} = ${N(kwh)} кВт·ч; · ${tar} = ${N(cost)} ₽.`,explain:`1) Израсходовано: ${M(`${N(b)} − ${N(a)} = ${N(kwh)} кВт·ч`)}.<br>2) ${M(`${N(kwh)} · ${tar} = ${N(cost)} ₽`)}.`,
 explain2:'Счётчик — как одометр в машине: он только растёт. Пробег за месяц = конец − начало. Остальное — умножить на цену «километра».'});});
G(3,()=>{const Pold=pick([60,75,100]);const Pnew=pick([8,9,10,12]);const h=pick([3,4,5,6]);const days=pick([30,365]);const tar=pick([5,6,7]);const save=(Pold-Pnew)/1000*h*days*tar;if(!nice(save*10))return null;
 return NUMT(save,2,{q:`Лампу накаливания ${Pold} Вт заменили на светодиодную ${Pnew} Вт (светят одинаково). Лампа горит ${h} ч в день. Сколько рублей сэкономится за ${days===30?'30 дней':'год (365 дней)'} при тарифе ${tar} ₽ за кВт·ч?`,hint:'Экономия мощности × время × тариф.',
 short:`(${Pold} − ${Pnew}) Вт · ${h*days} ч = ${N(rnd((Pold-Pnew)*h*days/1000,3))} кВт·ч → ${N(rnd(save,2))} ₽.`,
 explain:`1) Экономия мощности: ${Pold} − ${Pnew} = ${Pold-Pnew} Вт = ${N((Pold-Pnew)/1000)} кВт.<br>2) Время: ${h} · ${days} = ${h*days} ч.<br>3) Сэкономленная энергия: ${M(`${N((Pold-Pnew)/1000)} · ${h*days} = ${N(rnd((Pold-Pnew)*h*days/1000,3))} кВт·ч`)}.<br>4) Деньги: · ${tar} = <b>${N(rnd(save,2))} ₽</b>.`,
 explain2:`Посчитай отдельно расходы: старая лампа — ${N(rnd(Pold*h*days/1000*tar,2))} ₽, новая — ${N(rnd(Pnew*h*days/1000*tar,2))} ₽. Разность ${N(rnd(save,2))} ₽.`});});

/* L4 — Джоуль–Ленц */
G(4,()=>CH('Как записывается закон Джоуля–Ленца?',M('Q = I²·R·t'),[M('Q = I·R²·t'),M('Q = I·R·t'),M('Q = U·R·t')],{
 short:'Q = I²Rt.',explain:`Количество теплоты, выделяемое проводником с током, пропорционально <b>квадрату</b> силы тока, сопротивлению и времени: ${M('Q = I²Rt')}. ${M('I·R·t')} — это ${M('U·t')}, в вольт-секундах, а не джоулях.`,
 explain2:'Связь с мощностью: P = I²R — тепло за секунду. За время t: Q = P·t = I²Rt. Ток вдвое больше → тепла в 4 раза больше.'}),{rule:true});
G(4,()=>CH('Спираль электроплитки раскалена, а медные провода, подводящие к ней ток, почти холодные. Почему?','Ток в них одинаковый, а сопротивление спирали намного больше; Q = I²Rt',['Ток в проводах намного меньше, чем в спирали','В проводах ток вообще не выделяет тепла','Медь хорошо отдаёт тепло воздуху, поэтому ток в ней больше'],{
 short:'Последовательно: I один, тепла больше там, где больше R.',explain:`Провода и спираль соединены <b>последовательно</b> — ток через них одинаковый. По закону Джоуля–Ленца ${M('Q = I²Rt')} при одинаковом I тепла больше там, где <b>больше R</b>. Нихромовая спираль: ρ = 1,1, медный провод: ρ = 0,017 — в 65 раз меньше, да и провод толще.`,
 explain2:'Аналогия: толпа идёт по широкой улице и через узкий проход. Количество людей в минуту одинаковое, но «толкотня» и «жар» — именно в узком проходе.'}),{rule:true});
G(4,()=>{const I=pick([0.5,1,2,3,4,5]);const Rv=pick([10,20,22,44,50,100]);const tm=pick([1,2,5,10]);const Q=I*I*Rv*tm*60/1000;if(!nice(Q*10))return null;
 return NUMT(Q,2,{q:`Через нагревательный элемент сопротивлением ${Rv} Ом идёт ток ${N(I)} А. Сколько теплоты выделится за ${tm} мин? Ответ — в кДж.`,hint:'Q = I²Rt, время в секундах.',
 short:`${N(I)}² · ${Rv} · ${tm*60} = ${N(Q*1000)} Дж = ${N(Q)} кДж.`,explain:`${M(`Q = I²Rt = ${N(I)}² · ${Rv} · ${tm*60} = ${N(I*I)} · ${Rv} · ${tm*60} = ${N(Q*1000)} Дж`)} = <b>${N(Q)} кДж</b>.`,
 explain2:`Мощность P = I²R = ${N(I*I*Rv)} Вт, то есть ${N(I*I*Rv)} Дж в секунду. За ${tm*60} с: ${N(Q*1000)} Дж.`});});
G(4,()=>{const R1=pick([2,3,4,5,10]);const R2=pick([4,6,8,10,15,20,30]);if(R1===R2)return null;const mode=pick(['s','p']);const r=mode==='s'?R2/R1:R1/R2;
 return NUMT(r,2,{q:`Резисторы ${R1} Ом (R₁) и ${R2} Ом (R₂) соединены <b>${mode==='s'?'последовательно':'параллельно'}</b> и подключены к источнику. Во сколько раз количество теплоты в R₂ больше, чем в R₁, за одно и то же время? (Если меньше — ответ будет меньше 1.) Ответ округли до сотых.`,pic:circuit(mode==='s'?{s:[{t:'R',n:'R₁',v:R1+' Ом'},{t:'R',n:'R₂',v:R2+' Ом'}]}:{p:[{t:'R',n:'R₁',v:R1+' Ом'},{t:'R',n:'R₂',v:R2+' Ом'}]},{}),
 hint:mode==='s'?'Последовательно ток одинаковый → Q = I²Rt.':'Параллельно напряжение одинаковое → Q = U²t/R.',
 short:`Q₂/Q₁ = ${mode==='s'?`R₂/R₁ = ${R2}/${R1}`:`R₁/R₂ = ${R1}/${R2}`} = ${N(rnd(r,3))}.`,
 explain:mode==='s'?`Последовательно ток одинаковый. ${M('Q = I²Rt')} → ${M(`Q₂ / Q₁ = R₂ / R₁ = ${R2} / ${R1} = ${N(rnd(r,3))}`)}. Больше тепла — в большем сопротивлении.`:`Параллельно напряжение одинаковое. ${M('Q = U²t/R')} → ${M(`Q₂ / Q₁ = R₁ / R₂ = ${R1} / ${R2} = ${N(rnd(r,3))}`)}. Больше тепла — в <b>меньшем</b> сопротивлении (через него идёт больший ток).`,
 explain2:`Возьми числа: ${mode==='s'?`ток 1 А → Q₁ ∝ 1² · ${R1} = ${R1}, Q₂ ∝ 1² · ${R2} = ${R2}`:`U = ${R1*R2} В → Q₁ ∝ ${R1*R2}²/${R1}, Q₂ ∝ ${R1*R2}²/${R2}`}; отношение ${N(rnd(r,3))}.`});});

/* L5 — какая лампа ярче */
G(5,()=>CH('Две лампы с разным сопротивлением включены <b>последовательно</b>. Какая светит ярче?','Та, у которой сопротивление больше',['Та, у которой сопротивление меньше','Обе одинаково — ток ведь одинаковый','Та, что ближе к «+» источника'],{
 short:'Последовательно: P = I²R, больше R → ярче.',explain:`При последовательном соединении ток одинаковый, поэтому ${M('P = I²R')}: мощность больше у лампы с <b>большим</b> сопротивлением. «Ток одинаковый, значит одинаково» — ошибка: мощность зависит ещё и от R. А «ближе к плюсу» вообще не важно — ток во всех точках последовательной цепи один.`,
 explain2:'Напряжение делится пропорционально R. На лампе с большим R больше напряжение при том же токе → P = UI больше.'}),{rule:true});
const LP=[[25,40],[25,60],[25,100],[40,60],[40,100],[60,100],[40,75],[60,150],[100,200]];
G(5,()=>{const [a,b]=pick(LP);const mode=pick(['s','p']);const brighter=mode==='p'?b:a;const opts=[`${brighter} Вт`,`${brighter===a?b:a} Вт`,'обе одинаково'];
 return CH(`Две лампы «220 В, ${a} Вт» и «220 В, ${b} Вт» включили <b>${mode==='s'?'последовательно':'параллельно'}</b> в сеть 220 В. Какая светит ярче?`,opts[0],opts.slice(1),{pic:lampPair(a,b,mode),
 short:mode==='p'?`Параллельно у каждой номинальные 220 В → ярче ${b} Вт.`:`Последовательно ярче лампа с большим R — это ${a} Вт!`,
 explain:`Сопротивления: ${M(`R = U²/P`)}: ${a} Вт → ${N(rnd(48400/a,1))} Ом, ${b} Вт → ${N(rnd(48400/b,1))} Ом.<br>${mode==='p'?`Параллельно каждая лампа получает свои 220 В и работает в номинальном режиме: ${b} Вт против ${a} Вт. Ярче — <b>${b} Вт</b>.`:`Последовательно ток одинаковый, и ${M('P = I²R')} больше у лампы с <b>большим</b> R — у ${a}-ваттной. Ярче — <b>${a} Вт</b> (обе при этом светят слабее, чем «по этикетке»).`}`,
 explain2:mode==='p'?'В квартире все лампы включены параллельно — поэтому лампа «100 Вт» в люстре ярче лампы «40 Вт». Это привычный случай.':`Ловушка с подвохом! Номинальная мощность «${b} Вт» обещана только при 220 В на лампе. В последовательной цепи напряжения делятся пропорционально R: на ${a}-ваттной лампе (R больше) напряжение больше — она и ярче.`});});
G(5,()=>{const [a,b]=pick(LP);const Ra=48400/a,Rb=48400/b;const I=220/(Ra+Rb);const ask=pick(['a','b']);const P=I*I*(ask==='a'?Ra:Rb);
 return NUMT(P,1,{q:`Ловушка! Лампы «220 В, ${a} Вт» и «220 В, ${b} Вт» соединили последовательно и включили в сеть 220 В. Какую мощность потребляет лампа <b>${ask==='a'?a:b} Вт</b>? Сопротивления ламп считай постоянными. Ответ — в ваттах, округли до десятых.`,pic:lampPair(a,b,'s'),
 hint:'R = U²/P для каждой лампы, затем общий ток, затем P = I²R.',short:`I ≈ ${N(rnd(I,4))} А, P ≈ ${N(rnd(P,1))} Вт.`,
 explain:`1) ${M(`R₁ = 220² / ${a} = ${N(rnd(Ra,1))} Ом`)}, ${M(`R₂ = 220² / ${b} = ${N(rnd(Rb,1))} Ом`)}.<br>2) ${M(`I = 220 / (${N(rnd(Ra,1))} + ${N(rnd(Rb,1))}) ≈ ${N(rnd(I,4))} А`)}.<br>3) ${M(`P = I²R = ${N(rnd(I,4))}² · ${N(rnd(ask==='a'?Ra:Rb,1))} ≈ ${N(rnd(P,1))} Вт`)}.<br>Сравни: лампа ${a} Вт получает ≈ ${N(rnd(I*I*Ra,1))} Вт, лампа ${b} Вт — только ≈ ${N(rnd(I*I*Rb,1))} Вт.`,
 explain2:`Через долю напряжения: на лампе ${ask==='a'?a:b} Вт напряжение ${M(`U = 220 · ${N(rnd(ask==='a'?Ra:Rb,1))} / ${N(rnd(Ra+Rb,1))} ≈ ${N(rnd(220*(ask==='a'?Ra:Rb)/(Ra+Rb),1))} В`)}. Мощность ${M('P = U²/R')} ≈ ${N(rnd(P,1))} Вт.`});});
G(5,()=>{const n=pick([2,3,4]);const P=pick([40,60,100]);const ans=P/(n*n);if(!nice(ans*10))return null;
 return NUMT(ans,2,{q:`${n} одинаковые лампы «220 В, ${P} Вт» соединили последовательно и включили в сеть 220 В. Какую мощность потребляет каждая? (R ламп постоянно.) Ответ — в ваттах.`,hint:'Напряжение на каждой лампе — 220 / n.',
 short:`U = 220/${n}, P = ${P}/${n*n} = ${N(ans)} Вт.`,explain:`На каждой лампе ${M(`U = 220 / ${n} = ${N(rnd(220/n,2))} В`)} — в ${n} раза меньше номинала. ${M('P = U²/R')} → мощность меньше в ${n}² = ${n*n} раз: ${M(`${P} / ${n*n} = ${N(ans)} Вт`)}.<div class="box err"><b>Ловушка</b>${P} / ${n} = ${N(rnd(P/n,2))} Вт — забыли, что при меньшем напряжении меньше и ток.</div>`,
 explain2:`Общее сопротивление в ${n} раз больше, чем у одной лампы → ток в ${n} раз меньше номинального. P = I²R → в ${n*n} раз меньше. Гирлянда из ламп на 220 В почти не светит!`});});

/* L6 — предохранители, КЗ */
G(6,()=>CH('Как включают предохранитель и когда он срабатывает?','Последовательно с нагрузкой; срабатывает, когда ток больше допустимого',['Параллельно нагрузке; срабатывает при слишком высоком напряжении','Последовательно; срабатывает, когда ток слишком маленький','Параллельно; срабатывает, когда прибор выключен'],{
 short:'Предохранитель — последовательно, «перегорает» при большом токе.',explain:'Предохранитель должен пропускать <b>весь</b> ток линии, поэтому стоит <b>последовательно</b>. Если ток превышает допустимый (перегрузка или короткое замыкание), проволочка плавится (или автомат отключается), цепь разрывается — проводка не успевает перегреться.',
 explain2:'Предохранитель — «самое слабое звено», которое специально рвётся первым, чтобы спасти остальное. Как ограничитель скорости.'}),{rule:true});
G(6,()=>CH('Что происходит при <b>коротком замыкании</b>?','Сопротивление цепи резко падает почти до нуля, ток становится очень большим',['Напряжение в сети резко возрастает','Ток в цепи становится равным нулю','Сопротивление цепи резко возрастает'],{
 short:'R → 0, I = U/R → огромный.',explain:`Короткое замыкание — полюса источника соединились проводником почти без сопротивления (в обход нагрузки). По закону Ома ${M('I = U/R')}: R → 0 — ток огромный. По закону Джоуля–Ленца выделяется много тепла — плавится изоляция, возможен пожар.`,
 explain2:'Напряжение в розетке остаётся 220 В — меняется сопротивление. Например, R = 0,1 Ом: I = 220/0,1 = 2200 А! Вот почему нужны предохранители.'}),{rule:true});
G(6,()=>{const I=pick([6,10,16,20,25,32]);const P=220*I;
 return NUMT(P,0,{q:`Линия в квартире защищена автоматом на ${I} А. Какова наибольшая суммарная мощность приборов, которые можно включить одновременно в сети 220 В? Ответ — в ваттах.`,hint:'P = UI.',
 short:`220 · ${I} = ${P} Вт.`,explain:`Приборы включены параллельно, их токи складываются. Общий ток ${M('I = P<sub>общ</sub> / U')} не должен превышать ${I} А: ${M(`P<sub>max</sub> = U·I = 220 · ${I} = ${P} Вт`)}.`,
 explain2:`Каждый ампер при 220 В «несёт» 220 Вт. ${I} ампер — это ${I} · 220 = ${P} Вт.`});});
G(6,()=>{const I=pick([10,16]);const sel=sample(DEV.filter(d=>d[1]>=60),R(2,4));const P=sel.reduce((s,d)=>s+d[1],0);const It=P/220;const trip=It>I;
 return CH(`На линии с автоматом ${I} А (сеть 220 В) одновременно включили: ${sel.map(d=>`${d[0]} (${d[1]} Вт)`).join(', ')}. Что произойдёт?`,trip?'Автомат отключит линию — ток больше допустимого':'Автомат не сработает — ток в пределах нормы',[trip?'Автомат не сработает — ток в пределах нормы':'Автомат отключит линию — ток больше допустимого'],{
 short:`I = ${P} / 220 ≈ ${N(rnd(It,1))} А ${trip?'>':'≤'} ${I} А.`,explain:`Приборы включены параллельно, мощности складываются: ${sel.map(d=>d[1]).join(' + ')} = ${P} Вт.<br>Общий ток: ${M(`I = ${P} / 220 ≈ ${N(rnd(It,1))} А`)}. Это ${trip?'<b>больше</b>':'<b>не больше</b>'} ${I} А → ${trip?'автомат отключит линию':'автомат не сработает'}.`,
 explain2:`Предел линии: 220 · ${I} = ${220*I} Вт. Включено ${P} Вт — ${trip?'больше предела':'в пределах'}.`});});
G(6,()=>{const r=pick([0.05,0.1,0.2,0.5]);const I=220/r;
 return NUMT(I,0,{q:`Провода удлинителя замкнули друг на друга (короткое замыкание). Сопротивление получившейся цепи вместе с проводкой — ${N(r)} Ом. Какой ток пошёл бы, если бы не сработал автомат (сеть 220 В)? Ответ — в амперах.`,hint:'Закон Ома.',
 short:`220 / ${N(r)} = ${N(I)} А.`,explain:`${M(`I = U / R = 220 / ${N(r)} = ${N(I)} А`)} — в сотни раз больше, чем ток чайника (≈ 10 А). Мощность выделения тепла ${M(`P = U²/R = ${N(rnd(48400/r,0))} Вт`)} — провод раскалится за доли секунды. Поэтому автомат срабатывает почти мгновенно.`,
 explain2:`Сравни: чайник — это ≈ 22 Ом, ток 10 А. Короткое замыкание — ${N(r)} Ом, это в ${N(rnd(22/r,0))} раз меньше сопротивление и во столько же раз больше ток.`});});

/* L7 — нагреватели и КПД */
G(7,()=>CH('Что такое КПД электронагревателя?','Отношение полезного количества теплоты к работе тока',['Отношение работы тока к полезному теплу','Разность работы тока и полезного тепла','Мощность нагревателя, делённая на время'],{
 short:'η = Q<sub>полезн</sub> / A<sub>тока</sub>.',explain:`КПД показывает, какая <b>доля</b> работы тока пошла на полезное дело (нагрев воды): ${M('η = Q<sub>полезн</sub> / A<sub>тока</sub>')}. Он всегда меньше 100 % — часть тепла уходит на нагрев корпуса, воздуха.`,
 explain2:'Если чайник потратил 100 кДж электроэнергии, а вода получила 85 кДж, то η = 85/100 = 85 %. Остальные 15 кДж «ушли в стороны».'}),{rule:true});
G(7,()=>{const m=pick([0.5,1,1.5,2]);const t0=pick([10,15,20,25]);const P=pick([1000,1500,2000,2500]);const eta=pick([0.7,0.75,0.8,0.84,0.9]);const Q=4200*m*(100-t0);const t=Q/(eta*P);if(!nice(t))return null;
 return NUMT(t/60,1,{q:`☕ Электрочайник мощностью ${P} Вт с КПД ${Math.round(eta*100)} % нагревает ${N(m)} л воды от ${t0} °C до кипения (100 °C). Сколько времени это займёт? c = 4200 Дж/(кг·°C). Ответ — в минутах, округли до десятых.`,hint:'Q = cmΔt; полезная мощность η·P; t = Q / (ηP).',
 short:`Q = ${N(Q)} Дж, t = ${N(Q)} / (${N(eta)} · ${P}) = ${N(rnd(t,1))} с ≈ ${N(rnd(t/60,1))} мин.`,
 explain:`1) Нужное тепло: ${M(`Q = c·m·Δt = 4200 · ${N(m)} · ${100-t0} = ${N(Q)} Дж`)}.<br>2) Полезная мощность: ${M(`η·P = ${N(eta)} · ${P} = ${N(eta*P)} Вт`)}.<br>3) ${M(`t = Q / (ηP) = ${N(Q)} / ${N(eta*P)} = ${N(rnd(t,1))} с ≈ ${N(rnd(t/60,1))} мин`)}.<div class="box err"><b>Ловушка</b>Умножить на КПД вместо деления: получилось бы ${N(rnd(Q*eta/P/60,1))} мин — быстрее, чем без потерь. Так не бывает.</div>`,
 explain2:`Без потерь чайник справился бы за ${N(Q)} / ${P} = ${N(rnd(Q/P,1))} с. С потерями дольше: ÷${N(eta)} → ${N(rnd(t,1))} с = ${N(rnd(t/60,1))} мин.`});});
G(7,()=>{const m=pick([1,1.5,2]);const dt=pick([60,70,80]);const P=pick([1500,2000]);const tmin=pick([4,5,6,7]);const Q=4200*m*dt;const A=P*tmin*60;const eta=Q/A;if(eta>=0.98||eta<0.5)return null;
 return NUMT(eta*100,0,{q:`Чайник мощностью ${P} Вт за ${tmin} мин нагрел ${N(m)} кг воды на ${dt} °C. Каков его КПД? c = 4200 Дж/(кг·°C). Ответ — в процентах, округли до целых.`,hint:'η = cmΔt / (P·t).',
 short:`η = ${N(Q)} / ${N(A)} ≈ ${Math.round(eta*100)} %.`,explain:`Полезное тепло: ${M(`Q = 4200 · ${N(m)} · ${dt} = ${N(Q)} Дж`)}.<br>Работа тока: ${M(`A = P·t = ${P} · ${tmin*60} = ${N(A)} Дж`)}.<br>${M(`η = Q / A = ${N(Q)} / ${N(A)} ≈ ${N(rnd(eta,3))} ≈ ${Math.round(eta*100)} %`)}.`,
 explain2:`Из каждых ${N(A)} Дж электроэнергии вода получила ${N(Q)} Дж. Доля = ${N(rnd(eta,3))}, в процентах — ×100.`});});
G(7,()=>{const cap=pick([4000,4500,5000]);const U=3.85;const Pc=pick([10,15,18,20,25]);const eta=pick([0.8,0.85,0.9]);const Wh=cap/1000*U;const t=Wh/(Pc*eta)*60;
 return NUMT(t,0,{q:`📱 Аккумулятор ${cap} мА·ч, ${N(U)} В, полностью разряжен. Зарядка выдаёт ${Pc} Вт, КПД зарядки ${Math.round(eta*100)} %. За сколько минут телефон зарядится полностью (считай мощность постоянной)? Ответ — в минутах, округли до целых.`,hint:'Энергия аккумулятора в Вт·ч = А·ч · В. Полезная мощность = η·P.',
 short:`${N(rnd(Wh,3))} Вт·ч / (${N(eta)} · ${Pc} Вт) ≈ ${N(rnd(t/60,3))} ч ≈ ${Math.round(t)} мин.`,
 explain:`1) Энергия: ${M(`${N(cap/1000)} А·ч · ${N(U)} В = ${N(rnd(Wh,3))} Вт·ч`)}.<br>2) В аккумулятор попадает ${M(`${N(eta)} · ${Pc} = ${N(rnd(eta*Pc,2))} Вт`)}.<br>3) ${M(`t = ${N(rnd(Wh,3))} / ${N(rnd(eta*Pc,2))} ≈ ${N(rnd(t/60,3))} ч ≈ ${Math.round(t)} мин`)}.<br>(На самом деле последние 20 % телефон заряжает медленнее, чтобы беречь батарею.)`,
 explain2:`В джоулях: ${N(rnd(Wh*3600,0))} Дж / ${N(rnd(eta*Pc,2))} Вт = ${N(rnd(t*60,0))} с = ${Math.round(t)} мин.`});});

/* L8 — ★ */
G(8,()=>CH('★ Нагрузка R подключена к источнику напряжения U через провода сопротивлением r. При каком R мощность, выделяемая в нагрузке, наибольшая?','R = r',['R как можно меньше (R → 0)','R как можно больше','R = 2r'],{
 short:'Максимум при R = r, тогда P = U²/(4r).',explain:`${M('P = I²R = U²R / (R + r)²')}. При R → 0 ток большой, но R маленькое — P → 0. При R → ∞ ток → 0 — тоже P → 0. Максимум посередине: при ${M('R = r')}, ${M('P<sub>max</sub> = U²/(4r)')}. (Проверь: ${M('(R + r)² ≥ 4Rr')}, равенство при R = r.)`,
 explain2:'Числа: U = 10 В, r = 5 Ом. R = 1: P = 100/36 ≈ 2,8 Вт. R = 5: P = 500/100 = 5 Вт. R = 20: P = 2000/625 = 3,2 Вт. Наибольшая — при R = r.'}),{star:true,rule:true});
G(8,()=>{const t1=pick([5,6,10,12,15,20,30]);const t2=pick([3,4,10,12,15,20,30,60]);if(t1===t2)return null;const mode=pick(['s','p']);const ans=mode==='s'?t1+t2:t1*t2/(t1+t2);if(!nice(ans))return null;
 return NUMT(ans,1,{q:`★ Чайник имеет две спирали. Если включить только первую, вода закипает через ${t1} мин, только вторую — через ${t2} мин. Через сколько минут закипит вода, если обе спирали включить <b>${mode==='s'?'последовательно':'параллельно'}</b>? Потерями тепла пренебречь.`,
 hint:'Тепло одно и то же: Q = U²t/R. Значит, время пропорционально сопротивлению.',short:mode==='s'?`t = ${t1} + ${t2} = ${ans} мин.`:`t = ${t1}·${t2}/(${t1}+${t2}) = ${N(ans)} мин.`,
 explain:`Для закипания нужно одно и то же тепло Q. При напряжении U: ${M('Q = U²t / R')} → ${M('t = QR / U² ∝ R')}. Время пропорционально сопротивлению.<br>${mode==='s'?`Последовательно: ${M('R = R₁ + R₂')} → ${M(`t = t₁ + t₂ = ${t1} + ${t2} = ${ans} мин`)}.`:`Параллельно мощности складываются: ${M('P = P₁ + P₂')}, а ${M('P ∝ 1/t')}: ${M('1/t = 1/t₁ + 1/t₂')} → ${M(`t = ${t1}·${t2} / (${t1} + ${t2}) = ${N(ans)} мин`)}.`}`,
 explain2:mode==='s'?`Последовательное соединение «хуже» любой одной спирали: R больше → P = U²/R меньше. Поэтому дольше, чем ${Math.max(t1,t2)} мин.`:`Как два крана, наполняющих бассейн: первый за ${t1} мин, второй за ${t2}. За минуту вместе: 1/${t1} + 1/${t2} = ${N(rnd(1/t1+1/t2,4))} бассейна → весь за ${N(ans)} мин.`});},{star:true});
G(8,()=>{const k=pick([2,3,5,10,20]);
 return NUMT(k*k,0,{q:`★ По линии электропередачи передают одну и ту же мощность. Напряжение на линии повысили в ${k} раз (провода те же). Во сколько раз уменьшились потери энергии на нагрев проводов?`,hint:'Ток I = P/U, потери I²r.',
 short:`I ÷${k} → I²r ÷${k*k}.`,explain:`Передаваемая мощность ${M('P = U·I')} та же → ток ${M('I = P/U')} уменьшился в ${k} раз. Потери ${M('ΔP = I²r')} уменьшились в ${k}² = <b>${k*k}</b> раз.<br>Поэтому электростанции повышают напряжение трансформаторами до сотен киловольт, а у дома понижают обратно до 220 В.`,
 explain2:`Пример: 1 МВт при 10 кВ — ток 100 А. При ${10*k} кВ — ток ${N(rnd(100/k,2))} А. Квадрат тока: 10 000 против ${N(rnd(10000/(k*k),2))} — разница в ${k*k} раз.`});},{star:true});
G(8,()=>{const r=pick([0.5,1,2,4]);const U=pick([6,12,24]);const ask=pick(['R','P']);const Pm=U*U/(4*r);
 let best=0,bR=0;for(let R0=0.01;R0<50;R0+=0.01){const P=U*U*R0/((R0+r)**2);if(P>best){best=P;bR=R0;}}if(Math.abs(bR-r)>0.02||Math.abs(best-Pm)>1e-3)return null;

function onTheory(root){const w=root.querySelector('#w-lamps');if(!w)return;
  w.innerHTML=`<b>Две лампы на 220 В: какая ярче?</b>
  <div class="row" style="margin:6px 0;gap:8px;display:flex;flex-wrap:wrap"><button class="btn ghost" id="lP">Параллельно</button><button class="btn" id="lS">Последовательно</button></div>
  <label>Лампа 1: <output id="l1o"></output><input type="range" id="l1" min="15" max="200" step="5" value="40"></label>
  <label>Лампа 2: <output id="l2o"></output><input type="range" id="l2" min="15" max="200" step="5" value="100"></label>
  <div id="lpic" class="fig"></div><div id="ltxt" style="text-align:center;line-height:1.8"></div>`;
  let mode='s';const g=id=>w.querySelector('#'+id);
  const u=()=>{const a=+g('l1').value,b=+g('l2').value;g('l1o').textContent=a+' Вт';g('l2o').textContent=b+' Вт';
    const Ra=48400/a,Rb=48400/b;let Pa,Pb;if(mode==='p'){Pa=a;Pb=b;}else{const I=220/(Ra+Rb);Pa=I*I*Ra;Pb=I*I*Rb;}
    const mx=200;const net=mode==='s'?{s:[{t:'L',n:'Л1: '+a+' Вт',glow:Pa/Math.max(Pa,Pb)},{t:'L',n:'Л2: '+b+' Вт',glow:Pb/Math.max(Pa,Pb)}]}:{p:[{t:'L',n:'Л1: '+a+' Вт',glow:Pa/Math.max(Pa,Pb)},{t:'L',n:'Л2: '+b+' Вт',glow:Pb/Math.max(Pa,Pb)}]};
    if(mode==='s'){net.s.forEach(l=>l.w=96);}else net.p.forEach(l=>l.w=96);
    g('lpic').innerHTML=circuit(net,{bat:'220 В',top:14});
    const f=x=>N(rnd(x,1));
    g('ltxt').innerHTML=`R₁ = 220²/${a} = <span class="out">${f(Ra)} Ом</span>, R₂ = 220²/${b} = <span class="out">${f(Rb)} Ом</span><br>Реальная мощность: Л1 — <span class="out">${f(Pa)} Вт</span>, Л2 — <span class="out">${f(Pb)} Вт</span><br>${Math.abs(Pa-Pb)<0.05?'Светят одинаково.':`Ярче <b>${Pa>Pb?'Л1':'Л2'}</b> ${mode==='s'?'— у неё больше сопротивление (меньше ватт на этикетке)!':'— у неё больше мощность по этикетке.'}`}`;
    g('lS').className='btn'+(mode==='s'?'':' ghost');g('lP').className='btn'+(mode==='p'?'':' ghost');};
  g('lS').onclick=()=>{mode='s';u();};g('lP').onclick=()=>{mode='p';u();};w.querySelectorAll('input').forEach(i=>i.oninput=u);u();}
