<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Степень с натуральным показателем — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}

.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}

.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}

textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}

pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}

.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}

.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[\u200b-\u200d\u2060]/g,'').replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">
    ${saved&&saved.pos>0&&saved.pos<saved.queue.length?`<button class="btn" id="cont">Продолжить с задачи ${saved.pos+1}</button><button class="btn ghost" id="restart">Начать заново</button>`:`<button class="btn" id="restart">Начать с первой задачи</button>`}
  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){

<div class="fact">Легенда о шахматах: изобретатель попросил у царя 1 зерно на первую клетку, 2 — на вторую, 4 — на третью и так далее, удваивая. На 64-й клетке лежало бы 2⁶³ зёрен, а всего — ${M('2⁶⁴ − 1')} ≈ 18,4 квинтиллиона. Это больше, чем всё зерно, выращенное человечеством за всю историю.</div>`},
{title:'Знак степени: (−a)ⁿ и −aⁿ',lvl:1,html:`
<div class="box rule"><b>Правило знаков</b>Отрицательное число в <b>чётной</b> степени — <b>положительно</b>, в <b>нечётной</b> — <b>отрицательно</b>.<br>${M('(−2)⁴ = 16')}, &nbsp;${M('(−2)³ = −8')}.</div>
<p><b>Почему?</b> Минусы «гасят» друг друга парами: ${M('(−2)·(−2) = 4')}. Если минусов чётное число — все разбились на пары, ответ с плюсом. Если нечётное — один минус остался без пары.</p>
<div class="box ex"><b>Пример</b>${M('(−1)²⁰²⁶ = 1')}, ${M('(−1)²⁰²⁵ = −1')}. Знак степени единицы — это просто «чётный или нечётный показатель».</div>
<div class="box err"><b>Главная ловушка: скобки!</b>${M('(−3)² = (−3)·(−3) = 9')} — в квадрат возводится <b>−3</b>.<br>${M('−3² = −(3·3) = −9')} — в квадрат возводится только <b>3</b>, а минус ставится потом.<br>Степень «приклеена» только к тому, что стоит непосредственно перед ней.</div>
<div class="box tip"><b>Как запомнить</b>Степень сильнее минуса. В записи ${M('−3²')} сначала считают ${M('3²')}, а потом приписывают минус — как в ${M('−3·3')}.</div>
<p>Ещё: квадрат любого числа ${M('≥ 0')}. Поэтому ${M('x² = −4')} не имеет решений, а ${M('x² + 1')} всегда положительно.</p>`},
{title:'Умножение степеней',lvl:2,html:`
<div class="box rule"><b>Правило</b>${M(`a${sp('m')} · a${sp('n')} = a${sp('m+n')}`)}: при умножении степеней с <b>одинаковыми основаниями</b> показатели <b>складываются</b>.</div>
<p><b>Почему?</b> Просто посчитай множители: ${M('a³ · a² = (a·a·a)·(a·a) = a⁵')}. Было три a, добавили два — стало пять.</p>
<div class="box ex"><b>Примеры</b>${M('x⁴ · x⁷ = x¹¹')}<br>${M('2³ · 2⁵ = 2⁸ = 256')}<br>${M('y · y⁶ = y¹ · y⁶ = y⁷')} — у буквы без показателя показатель 1!<br>${M('3x² · (−5x⁴) = −15x⁶')}: числа перемножаем, показатели складываем.</div>
<div class="box err"><b>Частые ошибки</b>• ${M('x³ · x⁴ = x¹²')} — перемножили показатели. Нет: <b>x⁷</b>.<br>• ${M('2³ · 2⁴ = 4⁷')} — перемножили основания. Нет: основание остаётся, ${M('2⁷')}.<br>• ${M('2³ · 3⁴')} — основания разные, правило не работает!<br>• ${M('a³ + a⁴ = a⁷')} — неверно! Сложение ≠ умножение. ${M('2³ + 2⁴ = 8 + 16 = 24')}, а ${M('2⁷ = 128')}.</div>`},
{title:'Деление степеней и нулевая степень',lvl:3,html:`
<div class="box rule"><b>Правило</b>${M(`a${sp('m')} : a${sp('n')} = a${sp('m−n')}`)} при a ≠ 0, m > n: при делении показатели <b>вычитаются</b>.<br>${M('a⁰ = 1')} при a ≠ 0.</div>
<p><b>Почему?</b> Сокращаем одинаковые множители: ${M(`a⁵ : a² = ${fr('a·a·a·a·a','a·a')} = a·a·a = a³`)}.</p>
<p><b>А почему a⁰ = 1?</b> Посмотри на ряд: ${M('2³ = 8, 2² = 4, 2¹ = 2')}. Каждый шаг влево — деление на 2. Следующий: ${M('2⁰ = 2 : 2 = 1')}. И по правилу: ${M('aⁿ : aⁿ = aⁿ⁻ⁿ = a⁰')}, а число, делённое само на себя, равно 1.</p>
<div class="box ex"><b>Примеры</b>${M('7²⁰²⁶ : 7²⁰²⁴ = 7² = 49')} — огромные числа, а ответ в уме!<br>${M('x¹⁰ : x⁹ = x')}<br>${M('2026⁰ = 1')}</div>
<div class="box err"><b>Частые ошибки</b>• ${M('x¹² : x⁴ = x³')} — разделили показатели. Нет: вычитаем, ${M('x⁸')}.<br>• ${M('5⁰ = 0')} — нет, ${M('5⁰ = 1')}.<br>• ${M('0⁰')} — не определено, так не пишут.</div>`},
{title:'Степень степени',lvl:4,html:`
<div class="box rule"><b>Правило</b>${M(`(a${sp('m')})${sp('n')} = a${sp('m·n')}`)}: при возведении степени в степень показатели <b>перемножаются</b>.</div>
<p><b>Почему?</b> ${M('(a³)² = a³ · a³ = a³⁺³ = a⁶')}. Это n раз сложить m — то есть m·n.</p>
<div class="box ex"><b>Примеры</b>${M('(x⁴)³ = x¹²')}<br>${M('8⁵ = (2³)⁵ = 2¹⁵')}<br>${M('4¹⁰ = (2²)¹⁰ = 2²⁰ = (2¹⁰)² ≈ 1 000 000')}</div>
<div class="box err"><b>Ловушки</b>• ${M('(x³)⁴ = x⁷')} — сложили показатели. Нет: ${M('x¹²')}.<br>• ${M(`(2³)² ≠ 2${sp('3²')}`)}: слева ${M('2⁶ = 64')}, справа ${M('2⁹ = 512')}. Если скобок нет, «этажи» считают <b>сверху вниз</b>.</div>
<div class="box tip"><b>Три правила — три действия</b>Умножаем степени → показатели <b>складываем</b>. Делим → <b>вычитаем</b>. Степень в степень → <b>умножаем</b>. Каждое действие с показателями — «на ступеньку проще», чем действие со степенями.</div>`},
{title:'Степень произведения и частного',lvl:5,html:`
<div class="box rule"><b>Правило</b>${M('(ab)ⁿ = aⁿbⁿ')}, &nbsp;${M(`(${fr('a','b')})ⁿ = ${fr('aⁿ','bⁿ')}`)} (b ≠ 0): в степень возводится <b>каждый множитель</b>.</div>
<p><b>Почему?</b> ${M('(ab)³ = ab · ab · ab = (a·a·a)·(b·b·b) = a³b³')} — множители можно переставлять.</p>
<div class="box ex"><b>Примеры</b>${M('(−2x³y)⁴ = (−2)⁴ · (x³)⁴ · y⁴ = 16x¹²y⁴')}<br>${M('25⁷ · 4⁷ = (25·4)⁷ = 100⁷ = 10¹⁴')}<br>${M('0,5¹⁰ · 2¹¹ = (0,5·2)¹⁰ · 2 = 2')}</div>
<div class="box err"><b>Самая коварная ошибка</b>${M('(a + b)² = a² + b²')} — <b>НЕВЕРНО!</b> Правило работает для произведения, а не для суммы. Проверь: ${M('(1 + 2)² = 9')}, а ${M('1² + 2² = 5')}. Про квадрат суммы — отдельная тема «ФСУ».<br>И не забывай возвести в степень <b>число</b>: ${M('(3x)² = 9x²')}, а не ${M('3x²')}.</div>
<div class="box tip"><b>Работает и в обратную сторону</b>${M('aⁿbⁿ = (ab)ⁿ')}. Ищи пары, которые дают круглые числа: ${M('2 · 5 = 10')}, ${M('4 · 25 = 100')}, ${M('8 · 125 = 1000')}.</div>`},
{title:'Считаем с хитростью',lvl:6,html:`
<div class="box rule"><b>Три главных приёма</b>1) Привести всё к одному основанию: ${M('8 = 2³, 9 = 3², 27 = 3³, 16 = 2⁴')}.<br>2) Склеить пары в круглые числа: ${M('2ⁿ · 5ⁿ = 10ⁿ')}.<br>3) Вынести общий множитель: ${M('3ⁿ + 3ⁿ + 3ⁿ = 3 · 3ⁿ = 3ⁿ⁺¹')}.</div>
<div class="box ex"><b>Пример 1</b>${M(`${fr('8⁵ · 4³','2¹⁹')} = ${fr('2¹⁵ · 2⁶','2¹⁹')} = 2²¹⁻¹⁹ = 2² = 4`)}.</div>
<div class="box ex"><b>Пример 2</b>Сколько цифр у числа ${M('2¹² · 5¹⁰')}? ${M('2¹² · 5¹⁰ = 2² · (2·5)¹⁰ = 4 · 10¹⁰ = 40 000 000 000')} — 11 цифр.</div>
<div class="box ex"><b>Пример 3</b>${M('2¹⁰ + 2¹⁰ = 2 · 2¹⁰ = 2¹¹')}, а не ${M('2²⁰')} и не ${M('4²⁰')}.</div>
<div class="box tip"><b>Запомни наизусть</b>${M('2¹⁰ = 1024 ≈ 1000')}. Поэтому килобайт ≈ 1000 байт, а ${M('2²⁰ ≈ 1 000 000')}, ${M('2³⁰ ≈ 1 000 000 000')}. Ещё полезно: ${M('2⁵ = 32, 3⁴ = 81, 3⁵ = 243, 5⁴ = 625')}.</div>
<div class="fact">Слово «квадрат» в «x²» — не случайно: площадь квадрата со стороной x равна x·x. А «куб» x³ — это объём кубика со стороной x. А древнегреческий математик Диофант (III век) называл x⁴ «квадрато-квадратом» — коротких значков для степеней ещё не было. Привычную запись с маленьким числом сверху ввёл Декарт в 1637 году.</div>`},
{title:'Последняя цифра степени',lvl:7,html:`
<p class="hook">🔢 Какой цифрой оканчивается ${M('7²⁰²⁶')}? В этом числе больше 1700 цифр — ни один калькулятор в телефоне его не покажет. А ты ответишь за 30 секунд.</p>
<div class="box rule"><b>Правило</b>Последняя цифра произведения зависит <b>только от последних цифр</b> множителей. Поэтому последние цифры степеней <b>повторяются по циклу</b>.</div>
<p>Посмотри на 7: ${M('7¹ = 7, 7² = 49, 7³ = 343, 7⁴ = 2401, 7⁵ = 16807')}. Последние цифры: <b>7, 9, 3, 1, 7, 9, 3, 1, …</b> — цикл длины 4.</p>
<ol class="steps"><li>Выпиши цикл последних цифр основания.</li><li>Найди остаток от деления показателя на длину цикла.</li><li>Остаток r → бери r-ю цифру цикла; остаток 0 → <b>последнюю</b> цифру цикла.</li></ol>
<div class="box ex"><b>Пример</b>${M('7²⁰²⁶')}: цикл 7, 9, 3, 1 (длина 4). ${M('2026 = 4 · 506 + 2')} → остаток 2 → вторая цифра цикла: <b>9</b>.</div>
<div class="box err"><b>Ловушка</b>Остаток 0 — это не «нулевая» цифра, а <b>последняя</b> в цикле. ${M('7⁴ = 2401')} оканчивается на 1, и ${M('7⁸')}, ${M('7²⁰²⁸')} — тоже на 1.</div>
<div class="box tip"><b>Шпаргалка циклов</b>0, 1, 5, 6 — не меняются. 4: 4, 6. 9: 9, 1. 2: 2, 4, 8, 6. 3: 3, 9, 7, 1. 7: 7, 9, 3, 1. 8: 8, 4, 2, 6.</div>
<p><b>Поиграй:</b> выбери основание и показатель — смотри, как «крутится» последняя цифра.</p>
<div class="widget" id="w-digit"></div>`},
{title:'Сравнение огромных чисел',lvl:8,html:`
<p class="hook">⚔️ Битва гигантов: ${M('2³⁰⁰')} или ${M('3²⁰⁰')}? У 2 больше показатель, у 3 — больше основание. Кто победит? Посчитать нельзя — в каждом числе почти 100 цифр.</p>
<div class="box rule"><b>Приём</b>Приведи степени к <b>одинаковому показателю</b> (или к одинаковому основанию). Тогда сравнивать нужно только основания (или только показатели).</div>
<div class="box ex"><b>Решение</b>${M('2³⁰⁰ = (2³)¹⁰⁰ = 8¹⁰⁰')}, &nbsp;${M('3²⁰⁰ = (3²)¹⁰⁰ = 9¹⁰⁰')}.<br>${M('8 < 9')} → ${M('8¹⁰⁰ < 9¹⁰⁰')} → <b>${M('2³⁰⁰ < 3²⁰⁰')}</b>. Победило основание!</div>
<p><b>Почему это работает?</b> Если ${M('0 < a < b')}, то ${M('aⁿ < bⁿ')}: перемножаем n раз меньшие положительные числа — и получаем меньше. А при одинаковом основании ${M('a > 1')}: чем больше показатель, тем больше степень.</p>
<div class="box ex"><b>Пример с одним основанием</b>${M('4⁵⁰')} и ${M('8³⁰')}: ${M('4⁵⁰ = 2¹⁰⁰')}, ${M('8³⁰ = 2⁹⁰')} → ${M('4⁵⁰ > 8³⁰')}.</div>
<div class="box err"><b>Ловушка</b>Сравнивать «на глаз» только основания или только показатели. ${M('2³⁰⁰')} vs ${M('3²⁰⁰')}: тут победило основание, а в ${M('2⁵⁰⁰')} vs ${M('3³⁰⁰')} (${M('32¹⁰⁰')} vs ${M('27¹⁰⁰')}) — уже показатель.</div>
<div class="box tip"><b>Оценка через 2¹⁰ ≈ 10³</b>${M('2¹⁰ = 1024 > 1000')}, поэтому ${M('2¹⁰⁰ = (2¹⁰)¹⁰ > (10³)¹⁰ = 10³⁰')}: в числе ${M('2¹⁰⁰')} больше 30 цифр (на самом деле 31).</div>`},
{title:'★ Олимпиадные приёмы',lvl:9,html:`
<div class="box rule"><b>Приём 1: «вклинить» промежуточное число</b>Сравни ${M('31¹¹')} и ${M('17¹⁴')}. Общего показателя нет. Но ${M('31 < 32 = 2⁵')} и ${M('17 > 16 = 2⁴')}:<br>${M('31¹¹ < 32¹¹ = 2⁵⁵ < 2⁵⁶ = 16¹⁴ < 17¹⁴')}.</div>
<div class="box rule"><b>Приём 2: сумма степеней двойки</b>${M('S = 1 + 2 + 2² + … + 2ⁿ')}. Умножим на 2: ${M('2S = 2 + 2² + … + 2ⁿ⁺¹')}. Вычтем: ${M('2S − S = 2ⁿ⁺¹ − 1')}. Отсюда ${M('S = 2ⁿ⁺¹ − 1')} — те самые зёрна на шахматной доске.</div>
<div class="box rule"><b>Приём 3: остатки тоже ходят по кругу</b>${M('2³ = 8 = 7 + 1')} даёт остаток 1 при делении на 7. Значит, ${M('2³ᵏ')} тоже даёт остаток 1, а остатки ${M('2ⁿ')} при делении на 7 идут циклом 2, 4, 1.</div>
<div class="box rule"><b>Приём 4: вынеси меньшую степень</b>${M('2ˣ⁺³ − 2ˣ = 2ˣ(2³ − 1) = 7 · 2ˣ')}. Уравнение ${M('2ˣ⁺³ − 2ˣ = 56')} превращается в ${M('2ˣ = 8')}, x = 3.</div>`},
{title:'Шпаргалка',html:`
<ul class="steps"><li>${M('aⁿ')} — n множителей a; ${M('a¹ = a')}, ${M('a⁰ = 1')} (a ≠ 0).</li>
<li>${M(`a${sp('m')}·a${sp('n')} = a${sp('m+n')}`)}, &nbsp;${M(`a${sp('m')} : a${sp('n')} = a${sp('m−n')}`)}, &nbsp;${M(`(a${sp('m')})${sp('n')} = a${sp('mn')}`)}.</li>
<li>${M('(ab)ⁿ = aⁿbⁿ')}, но ${M('(a + b)ⁿ ≠ aⁿ + bⁿ')}.</li>
<li>${M('(−a)ⁿ')}: чётное n → плюс, нечётное → минус. ${M('−aⁿ')} — минус всегда снаружи.</li>
<li>${M('2¹⁰ = 1024')}, ${M('2ⁿ·5ⁿ = 10ⁿ')}.</li>
<li>Последняя цифра — по циклу, сравнение — через общий показатель.</li></ul>`}
];

/* ---------- symbols ---------- */
const symbols={tab:'Формулы',title:'Свойства степеней',rows:[
['aⁿ','«a в степени n»','Произведение n множителей, каждый равен a.',M('2⁴ = 2·2·2·2 = 16')],
['a⁰ = 1','«a в нулевой степени»','Любое число, кроме нуля, в нулевой степени равно 1.',M('2026⁰ = 1')],
[`a${sp('m')}·a${sp('n')} = a${sp('m+n')}`,'Умножение степеней','Основания одинаковые → показатели складываем.',M('x³·x⁵ = x⁸')],
[`a${sp('m')} : a${sp('n')} = a${sp('m−n')}`,'Деление степеней','Основания одинаковые → показатели вычитаем.',M('5⁹ : 5⁷ = 25')],
[`(a${sp('m')})${sp('n')} = a${sp('mn')}`,'Степень степени','Показатели перемножаем.',M('(x²)⁵ = x¹⁰')],
['(ab)ⁿ = aⁿbⁿ','Степень произведения','В степень возводим каждый множитель.',M('(2x)³ = 8x³')],
[`(${fr('a','b')})ⁿ = ${fr('aⁿ','bⁿ')}`,'Степень дроби','Числитель и знаменатель — отдельно.',M(`(${fr(2,3)})² = ${fr(4,9)}`)],
['(−a)ⁿ','Знак степени','Чётная степень — плюс, нечётная — минус.',M('(−2)³ = −8')]
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Действие со степенями → действие «на ступеньку проще» с показателями: умножение → сложение, деление → вычитание, степень → умножение.</div>`};

/* ---------- generators ---------- */
const gens=[];
const G=(lvl,make,f)=>gens.push({lvl,make,star:f==='s'||undefined,rule:f==='r'||undefined});

/* L0 */
G(0,()=>{const o=mk(`произведение n одинаковых множителей, каждый равен a`,[`произведение a и n, то есть a · n`,`сумма n одинаковых слагаемых, каждое равно a`,`произведение a одинаковых множителей, каждый равен n`]);
return {type:'choice',q:`Что означает запись ${M('aⁿ')} (n — натуральное, n ≥ 2)?`,...o,
short:'aⁿ = a · a · … · a (n раз).',
explain:`${M('aⁿ')} — это <b>a, умноженное само на себя n раз</b>: ${M('a · a · … · a')} (n множителей). Например, ${M('2³ = 2·2·2 = 8')}.<br>«a · n» и «сумма n слагаемых a» — это одно и то же (умножение), и это неверно: ${M('2 · 3 = 6 ≠ 8')}.<br>«a множителей n» перепутано: это было бы ${M('nᵃ')}.`,
explain2:`Сравни лесенку: сложение одинаковых → умножение (${M('5+5+5 = 5·3')}); умножение одинаковых → степень (${M('5·5·5 = 5³')}). Основание — <b>что</b> умножаем, показатель — <b>сколько раз</b>.`};},'r');
G(0,()=>{const b=R(2,9),e=R(2,9);const w=pick(['b','e']);const right=w==='b'?'основание':'показатель';
const o=mk(right,['основание','показатель','коэффициент','степень']);
return {type:'choice',q:`В записи ${S(b,e)} как называется число <b>${w==='b'?b:e}</b>?`,...o,
short:`${b} — основание, ${e} — показатель.`,
explain:`В записи ${S(b,e)}: <b>${b}</b> — основание (это число мы умножаем), <b>${e}</b> — показатель (столько раз умножаем). Вся запись ${S(b,e)} целиком называется <b>степенью</b>.<br>Значит, ${w==='b'?b:e} — <b>${right}</b>.`,
explain2:`Основание — внизу, как фундамент дома. Показатель — маленький, сверху, «показывает», сколько раз умножать. ${S(b,e)} = ${chain(b,Math.min(e,4))}${e>4?' · …':''} (${e} раз).`};},'r');
G(0,()=>{const [b,e]=pick([[2,R(3,10)],[3,R(2,6)],[4,R(2,4)],[5,R(2,4)],[6,R(2,3)],[7,R(2,3)],[10,R(3,6)],[R(11,15),2]]);const v=b**e;
