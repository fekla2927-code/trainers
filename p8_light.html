<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Световые явления — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}

.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}

.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}

.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}

.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}
.prof-l{display:flex;align-items:center;gap:4px;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px}
.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">

  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;

{title:'Свет и его источники',lvl:0,html:`
<p class="hook">Почему ложка в стакане чая выглядит «сломанной»? Как камера телефона размером с горошину делает чёткое фото горы? Откуда берётся радуга? Почему в зеркале твоя правая рука становится левой? Всё это — <b>оптика</b>, наука о свете.</p>
<div class="box rule"><b>Источники света</b>Тела, которые <b>сами излучают</b> свет: Солнце, звёзды, лампа, экран телефона, пламя, молния, светлячок. Луна, зеркало, лист бумаги <b>не источники</b> — они только <b>отражают</b> чужой свет.</div>
<div class="box rule"><b>Закон прямолинейного распространения</b>В однородной прозрачной среде свет распространяется <b>прямолинейно</b>. Узкий пучок света изображают линией со стрелкой — <b>лучом</b>.</div>
<p>Доказательства видишь каждый день: чёткие тени, ровные лучи прожектора в тумане, лазерная указка. Поэтому, чтобы прицелиться, ты смотришь «вдоль» ствола или линейки.</p>
<div class="box ex"><b>Как Фалес измерил пирамиду</b>Лучи Солнца параллельны, поэтому тени предметов пропорциональны их высотам: ${M('H / L = h / l')}. Палка 1 м даёт тень 1,5 м, тень дерева 9 м → высота дерева ${M('9 / 1,5 = 6 м')}.</div>
<div class="fact">Скорость света в вакууме — около <b>300 000 км/с</b>. Свет от Солнца летит до Земли около 8 минут 20 секунд, от Луны — чуть больше секунды. Поэтому вспышку молнии мы видим мгновенно, а гром (звук, 340 м/с) слышим позже.</div>
<div class="box err"><b>Ошибка</b>«Луна светится». Нет — Луна освещена Солнцем, поэтому у неё фазы: мы видим ту часть, которую освещает Солнце.</div>`},
{title:'Тень, полутень, затмения',lvl:1,html:`
<div class="box rule"><b>Тень и полутень</b><b>Тень</b> — область, куда свет от источника не попадает совсем. От <b>точечного</b> источника тень резкая. От <b>протяжённого</b> источника вокруг тени появляется <b>полутень</b> — туда попадает свет только от части источника.</div>
<div class="figrow"><div class="fig">${figShadow}</div><div class="fig">${figPen}</div></div>
<p>Размер тени считаем подобием треугольников: лучи из точки — прямые, и тень во столько раз больше предмета, во сколько раз экран дальше от лампы, чем предмет.</p>
<div class="box rule"><b>Затмения</b><b>Солнечное</b>: Луна между Солнцем и Землёй, тень Луны падает на Землю (бывает только в новолуние). <b>Лунное</b>: Земля между Солнцем и Луной, Луна попадает в тень Земли (только в полнолуние).</div>
<div class="fig">${figEcl}</div>
<div class="fact">Луна в 400 раз меньше Солнца, но и в 400 раз ближе к нам — поэтому на небе они кажутся почти одинаковыми, и Луна может точно закрыть Солнце. Это удивительное совпадение.</div>
<div class="box ex"><b>Камера-обскура</b>Ящик с маленькой дырочкой: лучи от верхушки дерева проходят через дырочку и попадают вниз задней стенки, от корней — вверх. Изображение <b>перевёрнутое</b>, а его размер — из подобия: ${M('h = H · l / L')} (l — глубина ящика, L — расстояние до дерева).</div>`},
{title:'Закон отражения',lvl:2,html:`
<div class="box rule"><b>Закон отражения</b>1) Падающий луч, отражённый луч и перпендикуляр к зеркалу в точке падения лежат в <b>одной плоскости</b>.<br>2) <b>Угол отражения равен углу падения</b>: ${M('β = α')}.<br>Углы отсчитывают <b>от перпендикуляра</b>, а не от зеркала!</div>
<div class="fig">${reflPic(35,{refl:true,alpha:true})}</div>
<div class="box err"><b>Главная ловушка</b>Дан угол между лучом и <b>зеркалом</b> 30° — тогда угол падения ${M('90° − 30° = 60°')}, а не 30°.</div>
<div class="box ex"><b>Пример</b>Угол падения 40° → угол отражения 40°, а угол <b>между</b> падающим и отражённым лучами ${M('40° + 40° = 80°')}.</div>
<div class="box tip"><b>Поворот зеркала</b>Повернёшь зеркало на угол φ — отражённый луч повернётся на ${M('2φ')}. На этом работают лазерные шоу: крошечный поворот зеркальца — большой «скачок» луча.</div>
<p>Гладкая поверхность (зеркало, вода в штиль) отражает пучок <b>зеркально</b> — в одну сторону. Шероховатая (бумага, стена) — <b>рассеивает</b> во все стороны, поэтому лист бумаги видно с любой точки комнаты.</p>`},
{title:'Плоское зеркало',lvl:3,html:`
<div class="box rule"><b>Изображение в плоском зеркале</b><b>Мнимое</b> (его образуют продолжения лучей, на экран не поймаешь), <b>прямое</b>, <b>равное</b> предмету и расположено <b>симметрично</b> предмету относительно зеркала: на таком же расстоянии за зеркалом.</div>
<div class="fig">${figMirror}</div>
<ol class="steps"><li>Из точки S опусти перпендикуляр на зеркало.</li><li>Продолжи его за зеркало на такое же расстояние — получишь S′.</li><li>Отражённые лучи идут в глаз так, будто вылетели из S′.</li></ol>
<div class="box tip"><b>Удвоение</b>Стоишь в 2 м от зеркала — до своего изображения 4 м. Подходишь к зеркалу со скоростью 1 м/с — изображение приближается к тебе со скоростью 2 м/с.</div>
<div class="box ex"><b>Часы в зеркале</b>Зеркало меняет право и лево: стрелки часов «бегут» в обратную сторону. Если в зеркале часы без цифр показывают 2:30, на самом деле ${M('12:00 − 2:30 = 9:30')}.</div>
<div class="fact">На капоте машин скорой помощи надпись часто пишут зеркально — чтобы водитель впереди сразу прочитал её в зеркале заднего вида.</div>`},
{title:'Преломление света',lvl:4,html:`
<p class="hook">Опусти ложку в стакан с водой — она «ломается» на границе. Бассейн кажется мельче, чем есть. А радуга — это солнечный свет, «разобранный» каплями дождя на цвета.</p>
<div class="box rule"><b>Преломление</b>На границе двух сред луч меняет направление. При переходе в <b>оптически более плотную</b> среду (воздух → вода, воздух → стекло) луч прижимается <b>к перпендикуляру</b>: угол преломления ${M('γ')} <b>меньше</b> угла падения ${M('α')}. Обратно (вода → воздух) — отклоняется <b>от</b> перпендикуляра. Луч, падающий перпендикулярно, не преломляется.</div>
<div class="box rule"><b>Показатель преломления (углублённо)</b>${M('n = c / v')} — во сколько раз скорость света в веществе меньше, чем в вакууме. Вода — 1,33, стекло — около 1,5, алмаз — 2,42. Закон преломления: ${M('sin α / sin γ = n₂ / n₁')}; из воздуха в вещество: ${M('sin α / sin γ = n')}.</div>
<div class="widget" id="w-refr"></div>
<div class="box ex"><b>Почему ложка «ломается»</b>Свет от ложки под водой выходит в воздух и отклоняется от перпендикуляра. Глаз продолжает лучи по прямой и «видит» ложку выше, чем она есть. Поэтому и бассейн кажется мельче — примерно в n = 1,33 раза.</div>
<div class="box tip"><b>Полное отражение</b>Если свет идёт из воды или стекла в воздух под большим углом, он вообще не выходит — целиком отражается обратно. По этому принципу свет бежит внутри оптоволокна интернет-кабеля, отражаясь от стенок.</div>
<div class="fact">Белый свет — смесь цветов. Фиолетовый преломляется сильнее всех, красный — слабее. Поэтому призма и капли дождя раскладывают свет в радугу: красный сверху, фиолетовый снизу. Это явление называется <b>дисперсия</b>.</div>`},
{title:'Линзы: фокус и оптическая сила',lvl:5,html:`
<div class="box rule"><b>Линзы</b><b>Собирающая</b> (в середине толще, чем у краёв) — лучи, параллельные главной оптической оси, после неё собираются в <b>фокусе F</b>. <b>Рассеивающая</b> (в середине тоньше) — расходятся так, будто выходят из фокуса (он <b>мнимый</b>).</div>
<div class="figrow"><div class="fig">${figLensPar(true)}<div class="cap">собирающая</div></div><div class="fig">${figLensPar(false)}<div class="cap">рассеивающая</div></div></div>
<div class="box rule"><b>Оптическая сила</b>${M('D = 1 / F')}, F — в <b>метрах</b>, D — в <b>диоптриях</b> (дптр). У собирающей D > 0, у рассеивающей D < 0 (и F считают отрицательным).</div>
<div class="box ex"><b>Пример</b>F = 25 см = 0,25 м → ${M('D = 1 / 0,25 = 4 дптр')}. Очки «−2» — рассеивающие, ${M('F = 1 / (−2) = −0,5 м')}.</div>
<div class="box err"><b>Ошибка</b>Подставить сантиметры: 1/25 = 0,04 — это не диоптрии! Сначала переведи F в метры.</div>
<div class="box tip"><b>Запомни три «волшебных» луча</b>1) Луч <b>параллельно оси</b> → после собирающей линзы идёт <b>через фокус</b>.<br>2) Луч <b>через оптический центр</b> → <b>не преломляется</b>.<br>3) Луч <b>через фокус</b> → после линзы идёт <b>параллельно оси</b>.</div>
<div class="fact">Лупой в солнечный день можно поджечь бумагу: она собирает солнечные лучи в фокусе в маленькое горячее пятно. Отсюда и слово «фокус» — по-латыни «очаг».</div>`},
{title:'Построение изображений в линзе',lvl:6,html:`
<p>Чтобы найти изображение точки, достаточно двух «волшебных» лучей: где они (или их продолжения) пересекутся — там изображение.</p>
<div class="widget" id="w-lens"></div>
<table class="sym"><tr><th>Где предмет (собирающая)</th><th>Изображение</th><th>Пример</th></tr>
<tr><td>${M('d > 2F')}</td><td>действительное, перевёрнутое, уменьшенное; между F и 2F</td><td>фотоаппарат, глаз</td></tr>
<tr><td>${M('d = 2F')}</td><td>действительное, перевёрнутое, равное; в 2F</td><td>копировальный аппарат</td></tr>
<tr><td>${M('F < d < 2F')}</td><td>действительное, перевёрнутое, увеличенное; за 2F</td><td>проектор</td></tr>
<tr><td>${M('d = F')}</td><td>нет изображения (лучи параллельны)</td><td>прожектор</td></tr>
<tr><td>${M('d < F')}</td><td>мнимое, прямое, увеличенное; с той же стороны</td><td>лупа</td></tr></table>
<div class="box rule"><b>Рассеивающая линза</b>При любом положении предмета: изображение <b>мнимое, прямое, уменьшенное</b>, между фокусом и линзой с той же стороны.</div>
<div class="box err"><b>Ошибка</b>Считать, что изображение всегда перевёрнуто. Мнимые изображения (лупа, рассеивающая линза, зеркало) — <b>прямые</b>.</div>
<div class="box tip"><b>Действительное или мнимое?</b>Действительное образуют сами лучи — его можно поймать на экране. Мнимое — продолжения лучей (пунктир); его видно только глазом сквозь линзу.</div>`},
{title:'Формула тонкой линзы',lvl:7,html:`
<div class="box rule"><b>Формула линзы</b>${M('1/F = 1/d + 1/f')}; d — расстояние от предмета до линзы, f — от линзы до изображения.<br>Знаки: для рассеивающей <b>F &lt; 0</b>; если получилось <b>f &lt; 0</b> — изображение <b>мнимое</b>.<br><b>Увеличение</b>: ${M('Γ = H / h = |f| / d')}.</div>
<div class="box ex"><b>Пример</b>F = 10 см, d = 15 см: ${M('1/f = 1/10 − 1/15 = 1/30')} → ${M('f = 30 см')}. Изображение действительное, ${M('Γ = 30 / 15 = 2')} — вдвое больше предмета. Совпадает с таблицей: F &lt; d &lt; 2F → увеличенное, за 2F ✅.</div>
<div class="box ex"><b>Удобная форма</b>${M('f = d·F / (d − F)')}. Для лупы (F = 10 см, d = 5 см): ${M('f = 5 · 10 / (5 − 10) = −10 см')} — мнимое, ${M('Γ = 10 / 5 = 2')}.</div>
<div class="box err"><b>Ошибка</b>${M('1/f = 1/F + 1/d')} — знак! Правильно ${M('1/f = 1/F − 1/d')}. Проверка здравым смыслом: если предмет очень далеко, изображение должно получиться в фокусе.</div>`},
{title:'Глаз, очки, камера',lvl:8,html:`
<div class="fig">${figEye}</div>
<div class="box rule"><b>Глаз</b>Хрусталик — собирающая линза. На сетчатке получается <b>действительное, перевёрнутое, уменьшенное</b> изображение (мозг «переворачивает» его обратно). Мышцы меняют кривизну хрусталика — глаз фокусируется на близких и далёких предметах (<b>аккомодация</b>).</div>
<div class="box rule"><b>Дефекты зрения</b><b>Близорукость</b>: изображение далёких предметов получается <b>перед</b> сетчаткой → нужны <b>рассеивающие</b> очки (D &lt; 0, «минус»).<br><b>Дальнозоркость</b>: изображение близких предметов — <b>за</b> сетчаткой → нужны <b>собирающие</b> очки (D &gt; 0, «плюс»).</div>
<div class="box tip"><b>Как запомнить</b>Близорукий хорошо видит <b>близко</b>, его глаз «слишком сильно» собирает свет — ослабляем минусовой линзой.</div>
<div class="box ex"><b>Камера телефона</b>Объектив — собирающая линза с F ≈ 4–6 мм. Всё, что дальше полуметра, для неё «далеко» (d ≫ F), поэтому изображение получается почти в фокусе: матрица стоит примерно на F от линзы, а автофокус сдвигает линзу всего на десятки <b>микрометров</b>.</div>
<div class="fact">Лупа — собирающая линза, предмет кладут ближе фокуса: получается мнимое, прямое, увеличенное изображение. Микроскоп и телескоп — это комбинации линз.</div>`},
{title:'★ Олимпиадные идеи',lvl:9,html:`
<div class="box rule"><b>1. Два зеркала под углом α</b>Изображение в одном зеркале отражается в другом, и так далее. Если 360°/α — целое число n, то изображений ${M('n − 1')} (при нечётном n — если предмет на биссектрисе угла). Например, α = 90° → 3 изображения, α = 60° → 5.</div>
<div class="box rule"><b>2. Зеркало в полный рост</b>Чтобы увидеть себя целиком, нужно зеркало высотой <b>в половину роста</b>, нижний край — на половине высоты глаз. И это <b>не зависит</b> от расстояния до зеркала!</div>
<div class="box rule"><b>3. Уголковый отражатель</b>Два зеркала под углом α поворачивают луч на ${M('2α')}. При α = 90° луч возвращается обратно параллельно себе — так работают катафоты на велосипеде и отражатели, оставленные на Луне (по ним лазером измеряют расстояние до Луны с точностью до сантиметров).</div>
<div class="box rule"><b>4. Минимальное расстояние предмет — экран</b>Для собирающей линзы ${M('d + f ≥ 4F')}, минимум при ${M('d = f = 2F')}.</div>
<div class="box rule"><b>5. Тень от фонаря</b>Фонарь на высоте H, человек ростом h идёт со скоростью v. Конец тени движется со скоростью ${M('v · H / (H − h)')} — быстрее человека (подобие треугольников).</div>`},
{title:'Шпаргалка',lvl:0,html:`
<table class="sym"><tr><th>Что</th><th>Правило</th></tr>
<tr><td>Отражение</td><td>угол падения = угол отражения (от перпендикуляра)</td></tr>
<tr><td>Плоское зеркало</td><td>мнимое, прямое, равное, симметричное</td></tr>
<tr><td>Преломление</td><td>в более плотную среду — к перпендикуляру; ${M('n = c/v')}</td></tr>
<tr><td>Оптическая сила</td><td>${M('D = 1/F')} (F в метрах)</td></tr>
<tr><td>Формула линзы</td><td>${M('1/F = 1/d + 1/f')}, ${M('Γ = |f|/d')}</td></tr>
<tr><td>Очки</td><td>близорукость — «минус», дальнозоркость — «плюс»</td></tr></table>`}
];

const symbols={tab:'Формулы',title:'Обозначения и формулы',rows:[
['α, β','Угол падения, угол отражения','Отсчитываются от перпендикуляра к поверхности','α = β'],
['γ','Угол преломления','Угол между преломлённым лучом и перпендикуляром','из воздуха в воду γ < α'],
['n = c / v','Показатель преломления','Во сколько раз свет в веществе медленнее, чем в вакууме','стекло: 300 000 / 1,5 = 200 000 км/с'],
['F','Фокусное расстояние','От линзы до фокуса; у рассеивающей F < 0','F = 10 см'],
['D = 1 / F','Оптическая сила','В диоптриях, F в метрах','F = 0,5 м → D = 2 дптр'],
['1/F = 1/d + 1/f','Формула тонкой линзы','d — до предмета, f — до изображения (f < 0 — мнимое)','F = 10, d = 15 → f = 30 см'],
['Γ = |f| / d','Увеличение','Во сколько раз изображение больше предмета','30 / 15 = 2'],
['c ≈ 3·10⁸ м/с','Скорость света','300 000 км/с в вакууме','Солнце → Земля ≈ 500 с']
],after:`<div class="box tip" style="margin-top:14px"><b>Самое важное</b>Углы — от перпендикуляра. Расстояния в формуле линзы — в одних единицах, а для диоптрий — в метрах.</div>`};

/* =================== generators =================== */
/* L0 — источники, прямолинейность */
G(0,()=>CH('Как распространяется свет в однородной прозрачной среде?','Прямолинейно',['По дуге окружности','Зигзагом','Только вверх, против силы тяжести'],{
 short:'В однородной среде — по прямой.',explain:'<b>Закон прямолинейного распространения света</b>: в однородной среде свет идёт по прямым линиям. Доказательства — чёткие тени, ровный луч лазера, лучи солнца сквозь облака.',
 explain2:'Попробуй посмотреть на лампочку сквозь изогнутую трубочку — не увидишь. А сквозь прямую — увидишь. Свет не умеет поворачивать сам по себе.'}),{rule:true});
G(0,()=>{const not=pick(['Луна','зеркало, пускающее «солнечного зайчика»','белый лист бумаги на солнце','снег на солнце']);const src=sample(['Солнце','экран смартфона','пламя свечи','молния','светлячок','звезда Сириус','светодиод'],3);
 return CH('Что из этого <b>НЕ</b> является источником света?',not,src,{short:`${not[0].toUpperCase()+not.slice(1)} только отражает чужой свет.`,
  explain:`Источник света <b>сам излучает</b> свет. ${src.join(', ')} — излучают. А ${not} — <b>отражает</b> свет Солнца или лампы. В темноте ${not.startsWith('Луна')?'Луну без Солнца не было бы видно':'его не увидишь'}.`,
  explain2:'Проверка: выключи все остальные источники. Если предмет всё равно светится — он источник. Луна в тени Земли (при лунном затмении) почти гаснет — значит, она не источник.'});});
G(0,()=>{const o=pick([['Солнца','150 млн км',150e6],['Луны','384 000 км',384e3],['Марса (в момент наибольшего сближения)','56 млн км',56e6],['Юпитера (в среднем)','630 млн км',630e6]]);const t=o[2]/3e5;const big=t>100;
 return NUMT(big?t/60:t,big?1:2,{q:`Сколько ${big?'минут':'секунд'} летит свет от ${o[0]} до Земли? Расстояние — ${o[1]}, скорость света 300 000 км/с. ${big?'Ответ округли до десятых.':'Ответ округли до сотых.'}`,hint:'t = s / c.',
  short:`t = ${o[1]} / 300 000 км/с = ${N(rnd(t,2))} с${big?` ≈ ${N(rnd(t/60,1))} мин`:''}.`,
  explain:`${M('t = s / c')} = ${N(o[2])} / 300 000 = <b>${N(rnd(t,2))} с</b>.${big?` В минутах: ${N(rnd(t,2))} / 60 ≈ <b>${N(rnd(t/60,1))} мин</b>.`:''}`,
  explain2:`Свет за 1 с пролетает 300 000 км. Сколько раз 300 000 помещается в ${N(o[2])}? ${N(rnd(t,2))} раз — значит, ${N(rnd(t,2))} секунд.${big?' Это значит, что мы видим планету такой, какой она была несколько минут назад!':''}`});});
G(0,()=>{const h=pick([1,1.2,1.5,2]);const l=pick([0.5,0.8,1,1.2,1.5,2,2.4,3]);const L=pick([3,4,5,6,8,9,10,12,15]);const Hh=h*L/l;if(!isInt(Hh*10)||Hh>40||Hh<3)return null;
 const pic=SV(320,160,LN(10,140,310,140,{sw:1.5})+LN(60,140,60,110,{sw:4,c:'var(--ok)'})+LN(60,140,95,140,{sw:5,c:'var(--muted)'})+LN(200,140,200,54,{sw:6,c:'var(--ok)'})+`<circle cx="200" cy="50" r="15" fill="var(--ok)" fill-opacity="0.5"/>`+LN(200,140,300,140,{sw:5,c:'var(--muted)'})+LN(25,80,95,140,{c:RAY,sw:1.4})+LN(165,24,300,140,{c:RAY,sw:1.4})+TX(78,156,`${N(l)} м`,{fs:12})+TX(48,128,`${N(h)} м`,{fs:12,a:'end'})+TX(250,156,`${N(L)} м`,{fs:12})+TX(188,90,'H = ?',{fs:13,a:'end',c:'var(--accent-ink)'}),'Тени палки и дерева');
 return NUMT(Hh,1,{q:`☀️ Палка высотой ${N(h)} м отбрасывает тень длиной ${N(l)} м. В то же время тень дерева — ${N(L)} м. Какова высота дерева? Ответ — в метрах.`,pic,hint:'Солнечные лучи параллельны: треугольники «предмет — тень» подобны.',
  short:`H = ${N(h)} · ${N(L)} / ${N(l)} = ${N(Hh)} м.`,explain:`Лучи Солнца параллельны, свет идёт прямолинейно → треугольники «палка — тень» и «дерево — тень» подобны:<br>${M(`H / ${N(L)} = ${N(h)} / ${N(l)}`)} → ${M(`H = ${N(h)} · ${N(L)} / ${N(l)} = ${N(Hh)} м`)}.`,
  explain2:`Тень палки в ${N(rnd(l/h,3))} раза длиннее палки (${N(l)} / ${N(h)}). Значит, и тень дерева в ${N(rnd(l/h,3))} раза длиннее дерева: ${N(L)} / ${N(rnd(l/h,3))} = ${N(Hh)} м. Так Фалес измерил высоту пирамиды 2600 лет назад.`});});

/* L1 — тени, затмения */
G(1,()=>CH('Когда за непрозрачным предметом образуется <b>полутень</b>?','Когда источник света протяжённый (не точечный)',['Когда источник точечный','Всегда, при любом источнике','Только когда предмет прозрачный'],{
 short:'Полутень — от протяжённого источника.',explain:'От <b>точечного</b> источника — только резкая тень. Если источник <b>протяжённый</b> (лампа-трубка, Солнце), то в некоторые точки свет попадает от части источника — это <b>полутень</b>, а куда не попадает ни от одной точки — <b>тень</b>.',
 explain2:'Посмотри на свою тень от лампы на потолке: края размытые. Это полутень — часть лампы «видна» из этих точек, часть — нет.'}),{rule:true});
G(1,()=>{const t=pick(['solar','lunar']);const ans=t==='solar'?'Луна находится между Солнцем и Землёй':'Земля находится между Солнцем и Луной';
 return CH(`Когда происходит <b>${t==='solar'?'солнечное':'лунное'}</b> затмение?`,ans,['Луна находится между Солнцем и Землёй','Земля находится между Солнцем и Луной','Солнце находится между Землёй и Луной','Луна заходит за горизонт'].filter(x=>x!==ans),{
  short:t==='solar'?'Тень Луны падает на Землю.':'Луна попадает в тень Земли.',
  explain:t==='solar'?'При солнечном затмении Луна закрывает от нас Солнце: она между Солнцем и Землёй, её <b>тень падает на Землю</b>. Бывает только в новолуние. Там, где тень — полное затмение, где полутень — частичное.':'При лунном затмении Луна попадает в <b>тень Земли</b>: Земля между Солнцем и Луной. Бывает только в полнолуние, и видно его со всей ночной половины Земли.',
  explain2:'Затмение = кто-то попал в чью-то тень. Солнечное: <b>мы</b> (Земля) в тени Луны. Лунное: <b>Луна</b> в тени Земли.'});});
G(1,()=>{const D=pick([4,5,6,8,10,12]),a=pick([20,25,30,40,50]),b=pick([60,75,80,100,120,150,200]);if(b<=a*1.4)return null;const S=D*b/a;if(!isInt(S*10))return null;
 const pic=SV(320,150,`<circle cx="20" cy="75" r="5" fill="var(--hl)"/>`+LN(120,55,120,95,{sw:5})+LN(300,5,300,145,{sw:2})+(()=>{const t=atX([20,75],[120,55],300),q=atX([20,75],[120,95],300);return LN(20,75,t[0],t[1],{c:RAY,sw:1.2})+LN(20,75,q[0],q[1],{c:RAY,sw:1.2})+`<rect x="296" y="${r2(t[1])}" width="8" height="${r2(q[1]-t[1])}" fill="var(--fig)"/>`;})()+LN(20,128,120,128,{sw:1})+TX(70,124,`${a} см`,{fs:12})+LN(20,142,300,142,{sw:1})+TX(210,138,`${b} см`,{fs:12})+TX(132,79,`${D} см`,{fs:12,a:'start'}),'Тень диска');
 return NUMT(S,1,{q:`Точечная лампа освещает диск диаметром ${D} см, расположенный на расстоянии ${a} см от неё параллельно экрану. Экран — в ${b} см от лампы. Какой диаметр у тени? Ответ — в сантиметрах.`,pic,hint:'Лучи из точки — прямые. Подобные треугольники с вершиной в лампе.',
  short:`${D} · ${b} / ${a} = ${N(S)} см.`,explain:`Лучи от лампы через края диска — прямые, получаем подобные треугольники с общей вершиной в лампе:<br>${M(`S / ${D} = ${b} / ${a}`)} → ${M(`S = ${D} · ${b} / ${a} = ${N(S)} см`)}.`,

/* ---------- interactive theory ---------- */
function onTheory(root){
  const w=root.querySelector('#w-lens');
  if(w){w.innerHTML=`<b>Двигай предмет — смотри, где изображение</b>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button class="btn" id="lc">Собирающая</button><button class="btn ghost" id="ld">Рассеивающая</button></div>
    <label>Расстояние до предмета d = <output id="ldo"></output><input type="range" id="lD" min="2" max="60" step="1" value="30"></label>
    <label>Фокусное расстояние |F| = <output id="lfo"></output><input type="range" id="lF" min="6" max="20" step="1" value="10"></label>
    <div id="lpic" class="fig"></div><div id="ltx" style="text-align:center;line-height:1.7"></div>`;
    let conv=true;const g=id=>w.querySelector('#'+id);
    const u=()=>{const d=+g('lD').value,aF=+g('lF').value,F=conv?aF:-aF;g('ldo').textContent=d+' см';g('lfo').textContent=aF+' см';
      g('lpic').innerHTML=lensDiag({F,d,W:320,H:200});const f=lensF(d,F);
      if(!isFinite(f)){g('ltx').innerHTML='Предмет в фокусе: лучи после линзы параллельны — <span class="out">изображения нет</span> (так устроен прожектор).';}
      else{const I=lensInfo(d,F);g('ltx').innerHTML=`f = <span class="out">${N(rnd(f,1))} см</span> · Γ = <span class="out">${N(rnd(I.G,2))}</span><br>Изображение: <span class="out">${I.props}</span>${conv?` <span class="small">(${zoneOf(d,F)})</span>`:''}${Math.abs(f)>=9*aF?'<br><span class="small">Изображение очень далеко — за краем рисунка.</span>':''}`;}
      g('lc').className='btn'+(conv?'':' ghost');g('ld').className='btn'+(conv?' ghost':'');};
    g('lc').onclick=()=>{conv=true;u();};g('ld').onclick=()=>{conv=false;u();};g('lD').oninput=u;g('lF').oninput=u;u();}
  const v=root.querySelector('#w-refr');
  if(v){v.innerHTML=`<b>Отражение и преломление: поверни луч</b>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button class="btn" id="rw">Вода (1,33)</button><button class="btn ghost" id="rg">Стекло (1,5)</button><button class="btn ghost" id="rd">Алмаз (2,42)</button><button class="btn ghost" id="rx">Свет идёт снизу ⇅</button></div>
    <label>Угол падения α = <output id="rao"></output><input type="range" id="rA" min="0" max="85" step="1" value="40"></label><div id="rpic" class="fig"></div><div id="rtx" style="text-align:center;line-height:1.7"></div>`;
    let n=1.33,nm='вода',up=false;const g=id=>v.querySelector('#'+id);
    const u=()=>{const a=+g('rA').value;g('rao').textContent=a+'°';const n1=up?n:1,n2=up?1:n;const gm=snell(a,n1,n2);const W=300,Hh=200,cx=150,cy=100,L=92;
      let s=`<rect x="0" y="${cy}" width="${W}" height="${Hh-cy}" fill="var(--accent)" fill-opacity="${up?0.06:0.2}"/><rect x="0" y="0" width="${W}" height="${cy}" fill="var(--accent)" fill-opacity="${up?0.2:0.06}"/>`+LN(0,cy,W,cy,{sw:1.5})+LN(cx,4,cx,Hh-4,{dash:'4 4',sw:1,c:'var(--muted)'});
      const sx=cx-L*Math.sin(a*deg);const sy=up?cy+L*Math.cos(a*deg):cy-L*Math.cos(a*deg);s+=ARR(sx,sy,cx,cy,{c:RAY,sw:2.6});
      const rx=cx+L*Math.sin(a*deg),ry=sy;s+=LN(cx,cy,rx,ry,{c:RAY,sw:gm==null?2.6:1.2,dash:gm==null?null:'5 4'});
      if(gm!=null){const tx=cx+L*Math.sin(gm*deg),ty=up?cy-L*Math.cos(gm*deg):cy+L*Math.cos(gm*deg);s+=ARR(cx,cy,tx,ty,{c:'var(--bad)',sw:2.6});}
      s+=TX(8,up?Hh-10:18,up?nm:'воздух',{fs:12,a:'start'})+TX(8,up?18:Hh-10,up?'воздух':nm,{fs:12,a:'start'});
      g('rpic').innerHTML=SV(W,Hh,s,'Преломление на границе',300);
      g('rtx').innerHTML=gm==null?`Полное внутреннее отражение! Свет не выходит в воздух (угол больше предельного ${N(rnd(Math.asin(1/n)/deg,1))}°).`:`α = <span class="out">${a}°</span> → угол отражения <span class="out">${a}°</span>, угол преломления γ = <span class="out">${N(rnd(gm,1))}°</span><br><span class="small">${up?'Из '+nm+' в воздух — от перпендикуляра (γ > α)':'Из воздуха в '+nm+' — к перпендикуляру (γ < α)'}</span>`;
      [['rw',1.33],['rg',1.5],['rd',2.42]].forEach(([id,k])=>g(id).className='btn'+(k===n?'':' ghost'));g('rx').className='btn'+(up?'':' ghost');};
    g('rw').onclick=()=>{n=1.33;nm='вода';u();};g('rg').onclick=()=>{n=1.5;nm='стекло';u();};g('rd').onclick=()=>{n=2.42;nm='алмаз';u();};g('rx').onclick=()=>{up=!up;u();};g('rA').oninput=u;u();}
}
