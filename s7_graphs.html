explain:'Сумма степеней чётна (= 2 · рёбер). Сумма чётных степеней чётна. Значит, сумма нечётных степеней тоже чётна, а сумма нечётных чисел чётна, только если их <b>чётное количество</b>.',
explain2:'1 + 3 = 4 (чётно, две штуки), 1 + 3 + 5 = 9 (нечётно, три штуки). Поэтому нечётных вершин — 0, 2, 4, …'};},false,true);
G(8,()=>{let d,res;const want=Math.random()<0.5;for(;;){const n=R(5,6);d=Array.from({length:n},()=>R(1,n-1)).sort((a,b)=>b-a);if(sum(d)%2)continue;res=havel(d);if(res.ok===want)break;}
// brute force check
const n=d.length;const P=allPairs(n);let found=false;for(let mask=0;mask<(1<<P.length)&&!found;mask++){const dd=Array(n).fill(0);let c=0;for(let k=0;k<P.length;k++)if(mask>>k&1){dd[P[k][0]]++;dd[P[k][1]]++;}const s1=dd.slice().sort((a,b)=>b-a);if(s1.every((x,i)=>x===d[i]))found=true;}
ok(found===res.ok,'havel vs brute');
const r=ch(res.ok?'да, существует':'нет, не существует',[res.ok?'нет, не существует':'да, существует','нет, потому что сумма степеней нечётна','да, любой набор с чётной суммой подходит']);
const big=d.filter(x=>x===n-1).length;
return {type:'choice',q:`Существует ли граф (без петель и кратных рёбер) с ${n} вершинами, степени которых <span class="m">${d.join(', ')}</span>?`,...r,
hint:'Сумма степеней чётная — это ещё не всё. Посмотри на самые большие степени.',
short:res.ok?'Существует (алгоритм «соединяй с самыми большими» доводит до нулей).':'Не существует.',
explain:`Сумма степеней ${sum(d)} — чётная, по этому признаку противоречия нет.<br>Проверяем «жадно»: берём вершину с наибольшей степенью k и соединяем её с k вершинами наибольших степеней (уменьшаем их на 1):<br>${d.join(', ')}${res.steps.map(s=>' → '+s.join(', ')).join('')}${res.ok?' — все нули ✅. Граф <b>существует</b>.':' — дальше не получается (не хватает вершин или степень стала отрицательной). Граф <b>не существует</b>.'}${!res.ok&&big?`<br>Подсказка: вершин степени ${n-1} — ${big}; каждая из них соединена со <b>всеми</b>, значит, у всех остальных степень не меньше ${big}.`:''}`,
explain2:res.ok?`Чтобы убедиться, достаточно построить пример. Жадный алгоритм выше — это и есть способ построения: каждый шаг — это проведённые рёбра.`:`Компьютер перебрал все графы на ${n} вершинах (их 2<sup>${P.length}</sup>) — ни у одного нет таких степеней.`};},true);
G(8,()=>{const k=R(1,3);let g;for(;;){const n=R(6,8);g=connGraph(n,R(2,6));const o=deg(g).filter(x=>x%2).length;if(o===2*k||(k===1&&o===0&&Math.random()<0.3))break;}
const o=deg(g).filter(x=>x%2).length;const strokes=Math.max(1,o/2);const lifts=strokes-1;
return {type:'num',q:'Какое <b>наименьшее</b> число раз придётся оторвать карандаш от бумаги, чтобы нарисовать этот граф (каждое ребро — ровно один раз)?',pic:draw(g),ans:lifts,
hint:'Посчитай нечётные вершины. Каждый непрерывный росчерк «закрывает» не больше двух из них.',
short:`Нечётных ${o} → росчерков ${strokes} → отрывов ${lifts}.`,
explain:`Степени: ${degList(g)}. Нечётных вершин: <b>${o}</b>.<br>У каждого непрерывного росчерка нечётными могут быть только начало и конец — это 2 вершины. Значит, росчерков нужно не меньше ${o===0?'1':`${o} : 2 = ${strokes}`} (и такого количества хватает для связного графа).<br>Отрывов карандаша на один меньше, чем росчерков: <b>${lifts}</b>.<div class="fig">${draw(g,{deg:true})}</div>`,
explain2:`Хитрый способ: добавь ${Math.max(0,strokes-1)} «воображаемых» ребра, соединяющих нечётные вершины попарно (кроме одной пары). Тогда нечётных останется ${o===0?0:2} — граф рисуется одним росчерком. Каждое воображаемое ребро и есть «перелёт» с оторванным карандашом.`};},true);
G(8,()=>{let k,d;do{k=R(2,6);d=R(3,6);}while(false);const Lf=k*(d-2)+2;
// construct caterpillar check
const nV=k+Lf;const E=[];for(let i=1;i<k;i++)E.push([i-1,i]);let next=k;for(let i=0;i<k;i++){const need=d-(i>0)-(i<k-1);for(let j=0;j<need;j++)E.push([i,next++]);}
const g={n:next,E};ok(isTree(g)&&deg(g).filter(x=>x===1).length===Lf&&next===nV,'caterpillar');
return {type:'num',q:`В дереве ${k} ${plural(k,'вершина','вершины','вершин')} имеют степень ${d}, а все остальные — листья (степень 1). Сколько листьев?`,ans:Lf,
hint:'Пусть листьев L. Запиши сумму степеней двумя способами.',
short:`${k}·${d} + L = 2(${k} + L − 1) → L = ${Lf}.`,
explain:`Пусть листьев L. Тогда вершин ${k} + L, а рёбер (дерево!) ${k} + L − 1.<br>Сумма степеней двумя способами:<br>${k} · ${d} + L · 1 = 2 · (${k} + L − 1)<br>${k*d} + L = ${2*k-2} + 2L<br>L = ${k*d} − ${2*k-2} = <b>${Lf}</b>.`,
explain2:`Пример такого дерева — «гусеница»: ${k} ${plural(k,'вершина','вершины','вершин')} степени ${d} в цепочке, к каждой прикреплены листья. Компьютер построил и проверил: листьев ровно ${Lf}.${next<=10?`<div class="fig">${draw(g)}</div>`:''}`};},true);
const brute={};function maxDisc(n){if(brute[n]!=null)return brute[n];const P=allPairs(n);let best=0;for(let mask=0;mask<(1<<P.length);mask++){let c=0;for(let t=mask;t;t&=t-1)c++;if(c<=best)continue;if(comps({n,E:P.filter((_,k)=>mask>>k&1)}).count>1)best=c;}return brute[n]=best;}
G(8,()=>{const n=R(5,12);const ans=(n-1)*(n-2)/2;if(n<=6)ok(maxDisc(n)===ans,'maxDisc');
return {type:'num',q:`Какое <b>наибольшее</b> число рёбер может быть у <b>несвязного</b> графа с ${n} вершинами (без петель и кратных рёбер)?`,ans,
hint:'Несвязный — значит, вершины делятся на две группы без рёбер между ними. Как выгоднее разделить?',
short:`Полный граф на ${n-1} вершинах + 1 отдельная: ${n-1}·${n-2} : 2 = ${ans}.`,
explain:`Несвязный граф делится на две группы (a и ${n} − a вершин), между которыми нет рёбер. Внутри групп — максимум полные графы.<br>Сравним: «${n-1} + 1» даёт ${n-1}·${n-2} : 2 = ${ans}; «${n-2} + 2» даёт ${(n-2)*(n-3)/2} + 1 = ${(n-2)*(n-3)/2+1}; ровнее — ещё меньше.<br>Выгоднее всего оставить <b>одну</b> вершину отдельно: <b>${ans}</b>.`,
explain2:`Другой взгляд: в полном графе ${n*(n-1)/2} рёбер. Чтобы «отрезать» хотя бы одну вершину, нужно убрать все её ${n-1} рёбер. ${n*(n-1)/2} − ${n-1} = ${ans}.${n<=6?' Компьютерный перебор всех графов подтверждает.':''}`};},true);
G(8,()=>{let n,k;do{n=R(7,25);k=R(3,9);}while(k>=n);const odd=(n*k)%2===1;
const ex=odd?null:`например, ${n} городов по кругу`;
const r=ch(odd?'нет':'да',[odd?'да':'нет']);
return {type:'choice',q:`В стране ${n} городов. Можно ли построить дороги так, чтобы из каждого города выходило ровно ${k} дорог (каждая дорога соединяет два города, между двумя городами — не больше одной дороги)?`,...r,
short:`${n}·${k} = ${n*k} — ${odd?'нечётно → нельзя':'чётно → можно'}.`,
explain:`Сумма степеней = ${n} · ${k} = ${n*k}. ${odd?`Нечётная! А она должна быть равна 2 · (число дорог). Значит, <b>нельзя</b>.`:`Чётная — противоречия нет. Построить можно: расставим города по кругу и соединим каждый с ${Math.floor(k/2)} ближайшими с каждой стороны${k%2?` и с «диаметрально противоположным» (n чётно, так что он есть)`:''}. Ответ: <b>да</b>.`}`,
explain2:odd?`Число дорог было бы ${n*k} : 2 = ${N(n*k/2)} — не целое. Так не бывает.`:`Число дорог будет ${n*k/2}. Лемма о рукопожатиях не мешает, а пример с кругом показывает, что это реально.`};},true);

/* ---------- widgets ---------- */
function onTheory(root){
  const w=root.querySelector('#w-full');
  if(w){w.innerHTML=`<b>Полный граф: двигай число вершин</b><label>n = <input type="range" id="fn" min="2" max="9" value="5"><output id="fno"></output></label><div id="fpic" class="fig"></div><div id="fout"></div>`;
    const u=()=>{const n=+w.querySelector('#fn').value;w.querySelector('#fno').textContent=n;const g={n,E:allPairs(n)};w.querySelector('#fpic').innerHTML=draw(g);
      w.querySelector('#fout').innerHTML=`Степень каждой вершины: <b>${n-1}</b>. Сумма степеней: ${n} · ${n-1} = ${n*(n-1)}.<br>Рёбер: ${n*(n-1)} : 2 = <b>${n*(n-1)/2}</b>.`;};
    w.querySelector('#fn').oninput=u;u();}
  const e=root.querySelector('#w-euler');
  if(e){const g=HOUSE;let used=[],cur=null,path=[];
    e.innerHTML=`<b>Нарисуй «конверт» одним росчерком</b><div style="font-size:15px">Нажимай на рёбра по очереди. Каждое следующее ребро должно начинаться там, где закончилось предыдущее.</div><div id="epic" class="fig"></div><div id="eout" style="min-height:48px"></div><button class="btn" id="ereset" type="button">Начать заново</button>`;
    const render=()=>{let s=draw(g,{hlE:used,hlV:cur==null?[]:[cur]});const P=g.pos;
      const hits=g.E.map(([a,b],k)=>used.includes(k)?'':`<line data-k="${k}" x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="transparent" stroke-width="22" style="cursor:pointer"/>`).join('');
      s=s.replace('</svg>',hits+'</svg>');e.querySelector('#epic').innerHTML=s;
      e.querySelectorAll('[data-k]').forEach(l=>l.addEventListener('click',()=>{const k=+l.dataset.k;const [a,b]=g.E[k];
        if(cur==null){used.push(k);const d=deg(g);const start=d[a]%2?a:d[b]%2?b:a;cur=start===a?b:a;path=[start,cur];}
        else if(a===cur||b===cur){used.push(k);cur=a===cur?b:a;path.push(cur);}
        else{e.querySelector('#eout').innerHTML=`Это ребро не выходит из вершины <b>${lab(g,cur)}</b> — пришлось бы оторвать карандаш!`;return;}
        msg();render();}));};
    const msg=()=>{const left=g.E.length-used.length;const A=adj(g);const canGo=cur!=null&&g.E.some(([a,b],k)=>!used.includes(k)&&(a===cur||b===cur));
      e.querySelector('#eout').innerHTML=cur==null?'Начни с любого ребра. Подсказка: степени A и B нечётные.':`Путь: ${path.map(i=>lab(g,i)).join(' → ')}<br>${left===0?'🎉 Получилось! Все 8 рёбер нарисованы одним росчерком.':canGo?`Осталось рёбер: ${left}.`:`Тупик: из ${lab(g,cur)} больше нет свободных рёбер, а нарисовано не всё. Попробуй начать с A или B.`}`;};
    e.querySelector('#ereset').onclick=()=>{used=[];cur=null;path=[];msg();render();};msg();render();}
}
