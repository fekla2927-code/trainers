<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Формулы сокращённого умножения — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;
  --accent:#3d5afe;--accent-soft:#e8ecff;--accent-ink:#1a2a9c;
  --ok:#1e7d4f;--ok-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;
  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:#111}}
section.view{display:none;padding-top:20px}
section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:4px 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:0 0 10px}
.theory h2{display:flex;gap:10px;align-items:baseline}
.theory h2 .n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:15px}
.m,.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.box{border-radius:10px;padding:12px 14px;margin:10px 0}
.box.rule{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent)}
.box.tip{background:var(--warn-soft);border-left:4px solid var(--hl)}
.box.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.box.ex{background:transparent;border:1px dashed var(--line)}
.box>b:first-child{display:block;margin-bottom:2px}
.fig{display:flex;justify-content:center;margin:10px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figrow .fig{flex:1 1 220px;flex-direction:column;align-items:center;margin:0}
.figrow .cap{font-size:14px;color:var(--muted);text-align:center}
table.sym{width:100%;border-collapse:collapse;font-size:16px}
table.sym th,table.sym td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.sym th{font-size:13px;color:var(--muted);font-weight:600}
table.sym td.s{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:24px;text-align:center;width:70px;color:var(--accent-ink)}
@media (max-width:600px){table.sym thead{display:none}table.sym tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.sym td{display:block;border:0;padding:2px 4px}table.sym td.s{text-align:left;width:auto}}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.levels button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;cursor:pointer}
.levels button:hover{border-color:var(--accent)}
.levels button span{display:block;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#111}}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn.warn{background:var(--hl);color:#2a1a00}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl-tag{display:inline-block;font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.lvl-tag.re{background:var(--warn-soft);color:var(--warn)}
.q{font-size:19px;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opts.pics{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opts.pics .opt{flex-direction:column;align-items:stretch}
.opts.pics .opt svg{width:100%;height:auto}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 220px;min-width:0;font:inherit;font-size:19px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inp input:focus{outline:2px solid var(--accent);outline-offset:1px}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font:inherit;font-size:17px;min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.alt{background:var(--warn-soft);border:1px solid var(--hl)}
.fb h3{margin:0 0 6px}
.fb .ans{font-weight:600;margin-bottom:8px}
.understand{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.understand label{display:block;font-weight:600;margin-bottom:6px}
.hint{margin-top:10px}
.score{font-size:40px;font-weight:800;color:var(--accent-ink)}
.res-list{list-style:none;padding:0;margin:10px 0}
.res-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.steps{margin:6px 0 6px 0;padding-left:22px}
.steps li{margin-bottom:4px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}

.brand a.home{display:block;font-size:13px;font-weight:500;color:var(--accent-ink);text-decoration:none;margin-bottom:2px}
.brand a.home:hover{text-decoration:underline}
@media (max-width:600px){.m,.math{white-space:normal}.q,.fb{overflow-wrap:anywhere}}
.chem{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.chem sub,.m sub{font-size:.72em}
.widget{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.widget label{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin:6px 0}
.widget input[type=range]{flex:1 1 160px;accent-color:var(--accent)}
.widget output,.widget .out{font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hook{font-size:18px;line-height:1.55;background:linear-gradient(0deg,transparent,transparent);border-left:4px solid var(--hl);padding:4px 0 4px 14px;margin:6px 0 12px}
.fact{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.fact::before{content:"💡 Знаешь ли ты? ";font-weight:700;color:var(--accent-ink)}
.prof{display:flex;align-items:center}
.prof-l{display:flex;align-items:center;gap:4px;font-size:15px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px}
.prof-l select{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:2px}
.prof-ask{border-color:var(--accent)}
textarea.code,pre.code{width:100%;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.5;tab-size:4;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);white-space:pre;overflow-x:auto;resize:vertical}
textarea.code:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.code.inp{margin-top:4px}
.pyed{margin:10px 0}.pybtns{margin-top:8px}
.pyout{margin-top:8px}.pyout pre.out{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;margin:4px 0 0;min-height:2.4em}
.pyout pre.out .bad-t{color:#fca5a5}
pre.code.sol{background:var(--ok-soft)}
.tbl{overflow-x:auto}table.tests pre{margin:0;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}.qhead>div{flex:1 1 260px;min-width:0}
.qcap{font-size:14px;color:var(--muted)}
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qitem .qrew{flex:none;min-width:72px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:8px 6px;background:var(--warn-soft);color:var(--warn)}
.qitem .qbody{flex:1;min-width:0}.qitem ul{list-style:none;padding:0;margin:6px 0}.qitem li{margin:3px 0;font-size:15px}.qitem li a{color:var(--ink)}
.qitem.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.qitem.claimed .qrew{background:var(--ok-soft);color:var(--ok)}
.qitem.locked{opacity:.6}
.qcode{font-size:15px}.qcode b{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.04em}
.quests-card{border-color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent-ink)}}
:root[data-theme="dark"] .btn{color:#111}
:root[data-theme="dark"] .btn.ghost{color:var(--accent-ink)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:#111}

.nudge-wrap{padding-top:14px;padding-bottom:0}.nudge-wrap+main{padding-top:0}
.nudge{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:12px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.nudge-t{flex:1 1 280px;line-height:1.5;font-size:15px}.nudge-b{flex:0 0 auto}

.tts-hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);line-height:1.5;font-size:15px}.tts-hint .btn{margin-top:10px}
/* ===== игровой слой ===== */
:root{--r-c:#7b8494;--r-r:#2f7bf0;--r-e:#9b4de0;--r-l:#e09a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--r-c:#a3abb8;--r-r:#6aa8ff;--r-e:#c08cff;--r-l:#ffc24d}}
:root[data-theme="dark"]{--r-c:#a3abb8;--r-r:#6aa8ff;--r-e:#c08cff;--r-l:#ffc24d}
/* цвет сайта из магазина */
:root[data-accent="lime"]{--accent:#2e7d32;--accent-soft:#e3f3e4;--accent-ink:#1b5e20}
:root[data-accent="violet"]{--accent:#7c3aed;--accent-soft:#efe7fd;--accent-ink:#5b21b6}
:root[data-accent="sunset"]{--accent:#d9480f;--accent-soft:#fdeadf;--accent-ink:#9a3412}
:root[data-accent="rose"]{--accent:#c2255c;--accent-soft:#fbe4ec;--accent-ink:#9d174d}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"])[data-accent="lime"]{--accent:#81c784;--accent-soft:#1d3320;--accent-ink:#b5e3b7}
 :root:not([data-theme="light"])[data-accent="violet"]{--accent:#b69cff;--accent-soft:#2c2347;--accent-ink:#d8cbff}
 :root:not([data-theme="light"])[data-accent="sunset"]{--accent:#ffa36b;--accent-soft:#3b2518;--accent-ink:#ffcfae}
 :root:not([data-theme="light"])[data-accent="rose"]{--accent:#f58cb3;--accent-soft:#3b1d29;--accent-ink:#ffc2d8}
}
:root[data-theme="dark"][data-accent="lime"]{--accent:#81c784;--accent-soft:#1d3320;--accent-ink:#b5e3b7}
:root[data-theme="dark"][data-accent="violet"]{--accent:#b69cff;--accent-soft:#2c2347;--accent-ink:#d8cbff}
:root[data-theme="dark"][data-accent="sunset"]{--accent:#ffa36b;--accent-soft:#3b2518;--accent-ink:#ffcfae}
:root[data-theme="dark"][data-accent="rose"]{--accent:#f58cb3;--accent-soft:#3b1d29;--accent-ink:#ffc2d8}

/* чип в шапке */
.gm-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px 3px 3px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.gm-chip:hover{border-color:var(--accent)}
.gm-c-lv{color:var(--accent-ink)}.gm-c-st.off{opacity:.45;filter:grayscale(1)}
.gm-homes{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.gm-chip.sm{font-size:13px;padding:1px 9px 1px 2px;gap:5px}.gm-chip.sm .gm-av{width:24px;height:24px;font-size:15px}
.gm-homes a.home{display:inline-block}
/* аватар и рамки */
.gm-av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);font-size:18px;line-height:1;flex:none;position:relative}
.gm-av>span{display:block}
.gm-av.big{width:64px;height:64px;font-size:38px}
.gm-av.fr-silver{box-shadow:0 0 0 3px #b8c0cc}
.gm-av.fr-gold{box-shadow:0 0 0 3px #e6b422,0 0 10px 1px rgba(230,180,34,.45)}
.gm-av.fr-neon{box-shadow:0 0 0 3px #00d9ff,0 0 12px 2px rgba(0,217,255,.55)}
.gm-av.fr-fire{box-shadow:0 0 0 3px #ff6a00,0 0 12px 3px rgba(255,80,0,.5)}
.gm-av.fr-rainbow{background:conic-gradient(#ff4d4d,#ffb84d,#ffee4d,#4dff88,#4dd2ff,#9b6bff,#ff4d4d);padding:3px}
.gm-av.fr-rainbow>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--accent-soft)}
.gm-name{font-weight:800;font-size:22px;line-height:1.2}
.gm-name.nc-sky{color:#1d7fd6}.gm-name.nc-mint{color:#0f9b77}.gm-name.nc-violet{color:#8b3fe0}.gm-name.nc-sun{color:#d97706}
.gm-name.nc-rainbow{background:linear-gradient(90deg,#e5484d,#f59e0b,#16a34a,#0ea5e9,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gm-name.nc-sky{color:#6cb8ff}:root:not([data-theme="light"]) .gm-name.nc-mint{color:#5fe0b8}:root:not([data-theme="light"]) .gm-name.nc-violet{color:#c79bff}:root:not([data-theme="light"]) .gm-name.nc-sun{color:#ffc44d}}
:root[data-theme="dark"] .gm-name.nc-sky{color:#6cb8ff}:root[data-theme="dark"] .gm-name.nc-mint{color:#5fe0b8}:root[data-theme="dark"] .gm-name.nc-violet{color:#c79bff}:root[data-theme="dark"] .gm-name.nc-sun{color:#ffc44d}
.gm-title{font-size:14px;font-weight:600;color:var(--warn);margin-top:1px}

/* панель персонажа */
.gm-panel{position:fixed;z-index:60;top:72px;right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 160px);overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.22)}
.gm-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:15px}
.gm-p-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-right:30px}
.gm-p-row{display:flex;justify-content:space-between;gap:12px;margin:10px 0}
.gm-panel h4{margin:12px 0 4px;font-size:16px}
.gm-p-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}.gm-p-btns .btn{justify-content:center;text-decoration:none}
.gm-bar .progress{height:10px}
/* задания дня */
.gm-qs{list-style:none;padding:0;margin:6px 0}
.gm-qs li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.gm-qs li:last-child{border-bottom:0}
.gm-q-t{flex:1;min-width:0}.gm-q-t .progress{height:6px;margin:4px 0 0}
.gm-q-r{flex:none;text-align:right;font-weight:700;font-size:14px}.gm-q-r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gm-qs li.ok .gm-q-t{color:var(--muted)}.gm-qs li.ok .progress i{background:var(--ok)}

/* «Мой персонаж» */
.gm-char{border:2px solid var(--accent);scroll-margin-top:16px}
.gm-ch-top{display:flex;gap:16px;align-items:center}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  /* в очередь без отправки: уйдёт при уходе со страницы или при следующем открытии */
  queue(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&rd().length)flush();});
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  nudges:[
    '{n}, нейронка решает быстро — но учится при этом она, а не ты. Твоя задача — научиться самому 🧠',
    'Сфоткать задачу и переписать ответ — это работа ксерокса 📠, а не учёба. Ксерокс умнее не становится.',
    'На контрольной в школе и на экзамене у мамы нейронки рядом не будет. Будешь только ты и твоя голова. Тренируй её сейчас 💪',
    'Ошибка с разбором — это +1 к мозгу. Ответ, списанный у нейронки, — это +0. Выбирай, что тебе выгоднее 😉',
    'Нейросети будут у всех. Выигрывать будут те, кто понимает больше нейросети. Будь таким, {n}.',
    'Не получается? Нажми «Не понял» — тренажёр объяснит по-другому. Или приходи к маме. Решать за тебя — не вариант.',
    'Чемпионы не ездят на тренировку на такси 🏃 Решай сам — только так растёт сила.',
    '{n}, я в тебя верю: ты можешь решить это сам. Медленно и с ошибками — это нормально. Списать — нет. Мама ❤️',
    'Чем больше решаешь сам, тем легче следующие темы. С нейронкой каждая новая тема будет всё труднее.',
  ],
  nudge(main){if(!main||document.querySelector('.nudge'))return;const m=P.nudges[Math.floor(Math.random()*P.nudges.length)].replace(/\{n\}/g,P.name());
    const c=document.createElement('div');c.className='nudge';c.innerHTML=`<div class="nudge-t">🤖🚫 ${m}</div><button class="btn ghost nudge-b">Понял, решаю сам 💪</button>`;
    const w=document.createElement('div');w.className='wrap nudge-wrap';w.appendChild(c);c.querySelector('button').onclick=()=>w.remove();main.parentNode.insertBefore(w,main);},
  mount(header,main){
    if(!header)return;
    if(!document.getElementById('login'))P.nudge(main);
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(window.GAME){try{GAME.mount(header);}catch(e){}}
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};

}

function fresh(){return {v:1,xp:0,gems:0,days:{},streak:0,best:0,lastDay:null,lastActive:null,badges:{},cnt:{},flags:{},today:{date:today()},daily:{date:null,ids:[],done:{}},shop:{owned:[],eq:{}},rev:{last:null,streak:0,best:0}};}
function norm(s,name){
  s=s&&typeof s==='object'?s:fresh();const f=fresh();for(const k in f)if(s[k]==null)s[k]=f[k];
  const t=today();
  if(s.today.date!==t)s.today={date:t};
  ['right','star','rule','fixed','xp','comboMax','review','topic','combo'].forEach(k=>{if(s.today[k]==null)s.today[k]=0;});
  if(s.daily.date!==t){s.daily={date:t,ids:pickQuests(s,name||NAME()),done:{}};}
  return s;
}
function load(name){name=name||NAME();return norm(rd(keyFor('trainer:game',name)),name);}
function save(s){const ks=Object.keys(s.days).sort();if(ks.length>140)ks.slice(0,ks.length-140).forEach(k=>delete s.days[k]);wr(KEY(),s);}
/* Серия: показываем, только если последний «засчитанный» день — сегодня или вчера */
function liveStreak(s){if(!s.lastDay)return 0;const g=diffDays(s.lastDay,today());return g<=1?s.streak:0;}

function topY(){try{const h=document.querySelector('header.top');if(h){const r=h.getBoundingClientRect();if(r.bottom>0)return Math.round(r.bottom+8);}}catch(e){}return 12;}
function toastHost(){if(!(host&&document.body.contains(host))){host=document.createElement('div');host.className='gm-toasts';host.setAttribute('aria-live','polite');document.body.appendChild(host);}
  host.style.top=topY()+'px';return host;}
const queue=[];let showing=0;
function toast(o){queue.push(o);pump();}
function pump(){
  if(!document.body)return;
  while(showing<3&&queue.length){
    const o=queue.shift();showing++;
    const el=document.createElement('div');el.className='gm-toast '+(o.cls||'');
    el.innerHTML=`<div class="gm-t-ic${o.rar?' rar-'+o.rar:''}">${o.icon||'✨'}</div><div class="gm-t-tx"><b>${o.title}</b>${o.text?`<span>${o.text}</span>`:''}</div>`;
    toastHost().appendChild(el);
    requestAnimationFrame(()=>el.classList.add('in'));
    setTimeout(()=>{el.classList.remove('in');el.classList.add('out');setTimeout(()=>{el.remove();showing--;pump();},reduced()?10:350);},o.ms||3800);
  }
}
function xpPill(xp,gems){

/* ---------- ядро: начисление ---------- */
let sessionCombo=0;
const COUNT={first:'right',star:'star',rule:'rules',fixed:'fixed',topic:'topics',perfect:'perfect',card:'cards',review:'reviews'};
function add(xp,kind,opt){
  opt=opt||{};
  const name=NAME();const s=load(name);const t=today();const d=now();
  const lvBefore=levelOf(s.xp).n;const gemBase=Math.floor(s.xp/10);
  xp=Math.max(0,Math.round(xp||0));
  s.xp+=xp;
  let gems=Math.floor(s.xp/10)-gemBase;
  if(opt.gems){gems+=opt.gems;}
  s.gems+=gems;
  const prevDayXp=s.days[t]||0;
  s.days[t]=prevDayXp+xp;
  if(kind!=='quest')s.today.xp+=xp;
  const ck=COUNT[kind];if(ck)s.cnt[ck]=(s.cnt[ck]||0)+1;
  if(kind==='first'||kind==='star'||kind==='rule'){
    s.cnt.right=(s.cnt.right||0)+(kind==='first'?0:1);
    if(kind==='first'||kind==='star'||kind==='rule')s.today.right++;
    if(kind==='star')s.today.star++;
    if(kind==='rule')s.today.rule++;
    sessionCombo++;s.today.combo=(s.today.combo||0)+1;s.today.comboMax=Math.max(s.today.comboMax,s.today.combo);
    s.cnt.comboBest=Math.max(s.cnt.comboBest||0,sessionCombo,s.today.combo);
    const h=d.getHours();if(h<8&&h>=5)s.flags.early=1;if(h>=21||h<5)s.flags.owl=1;
  }
  if(kind==='fixed')s.today.fixed++;
  if(kind==='topic')s.today.topic++;
  if(kind==='review'){s.today.review++;
    const r=s.rev;if(r.last!==t){r.streak=r.last&&diffDays(r.last,t)===1?r.streak+1:1;r.last=t;r.best=Math.max(r.best||0,r.streak);}}
  // возвращение после перерыва
  if(s.lastActive&&s.lastActive!==t&&diffDays(s.lastActive,t)>=4)s.flags.back=1;
  if(xp>0)s.lastActive=t;
  // серия дней: день засчитан, когда набрано ≥ 50 XP
  let streakMsg=null;
  if(prevDayXp<50&&s.days[t]>=50&&s.lastDay!==t){
    s.streak=s.lastDay&&diffDays(s.lastDay,t)===1?s.streak+1:1;s.lastDay=t;s.best=Math.max(s.best,s.streak);streakMsg=s.streak;
    const wd=d.getDay();const other=wd===0?addDays(t,-1):wd===6?addDays(t,1):null;if(other&&(s.days[other]||0)>=50)s.flags.weekend=1;
  }
  // задания дня
  const qDone=[];
  s.daily.ids.forEach(id=>{const q=QDEF[id];if(!q||s.daily.done[id])return;if((q.v(s)||0)>=q.g){s.daily.done[id]=t;qDone.push(id);}});
  let qXp=0,qGems=0;
  qDone.forEach(()=>{qXp+=Q_XP;qGems+=Q_GEMS;});
  if(qXp){const gb=Math.floor(s.xp/10);s.xp+=qXp;s.days[t]+=qXp;const g2=Math.floor(s.xp/10)-gb+qGems;s.gems+=g2;gems+=g2;
    if(s.daily.ids.every(id=>s.daily.done[id]))s.cnt.dailyAll=(s.cnt.dailyAll||0)+1;
    if(prevDayXp<50&&s.days[t]>=50&&s.lastDay!==t){s.streak=s.lastDay&&diffDays(s.lastDay,t)===1?s.streak+1:1;s.lastDay=t;s.best=Math.max(s.best,s.streak);streakMsg=s.streak;}}
  const newB=checkBadges(s);
  save(s);
  // ---- показываем ----
  try{
    if(xp&&!opt.quiet)xpPill(xp+qXp,gems);
    qDone.forEach(id=>toast({icon:'📅',title:'Задание дня выполнено!',text:`${esc(QDEF[id].t)} · +${Q_XP} XP, +${Q_GEMS} 💎`,cls:'quest'}));
    if(streakMsg!=null){toast({icon:'🔥',title:streakMsg>1?`${streakMsg} ${plural(streakMsg,'день','дня','дней')} подряд!`:'Огонёк зажжён!',text:streakMsg>1?'Сегодняшний день засчитан. Не потеряй серию завтра!':'Ты набрал 50 XP сегодня — день засчитан. Приходи завтра, и серия вырастет!',cls:'streak'});
      if([7,14,30].includes(streakMsg)&&window.NOTIFY)try{(NOTIFY.queue||NOTIFY.send)(`${name}: 🔥 ${streakMsg} дней подряд!`,`${name} занимается ${streakMsg} дней подряд (каждый день не меньше 50 XP). Уровень ${levelOf(s.xp).n} «${levelOf(s.xp).name}», всего ${s.xp} XP.`,['fire']);}catch(e){}
      if(streakMsg>=3)confetti(40);}
    newB.forEach(b=>toast({icon:b.i,rar:b.r,title:`Ачивка: ${esc(b.n)}`,text:`${RAR[b.r][0]} · ${esc(b.d)}`,cls:'badge rar-'+b.r,ms:4500}));
    const lv=levelOf(s.xp);
    if(lv.n>lvBefore){levelUp(lv);if(window.NOTIFY)try{(NOTIFY.queue||NOTIFY.send)(`${name}: новый уровень ${lv.n}!`,`${name} теперь «${lv.name}» ${lv.icon} — уровень ${lv.n}. Всего ${s.xp} XP, серия 🔥 ${liveStreak(s)}.`,['tada']);}catch(e){}}
  }catch(e){console.error(e);}
  refresh();
  return s;
}
function miss(){sessionCombo=0;const s=load();s.today.combo=0;save(s);}
function checkBadges(s){
  const out=[];const t=today();
  BADGES.forEach(b=>{if(s.badges[b.id])return;let ok=false;try{ok=b.t(s);}catch(e){}if(ok){s.badges[b.id]=t;out.push(b);}});
  return out;
}
/* проверка «статичных» ачивок (мир, босс) без начисления XP */
function check(){const s=load();const nb=checkBadges(s);if(nb.length){save(s);nb.forEach(b=>toast({icon:b.i,rar:b.r,title:`Ачивка: ${esc(b.n)}`,text:`${RAR[b.r][0]} · ${esc(b.d)}`,cls:'badge rar-'+b.r,ms:4500}));refresh();}}

/* ---------- Повторялка: сколько карточек ждёт ---------- */
const REV_MAX=15,REV_NEW=8;
function reviewInfo(name){
  name=name||NAME();const r=rd(keyFor('trainer:review',name))||{};const cards=r.cards||{};const t=today();
  const ses=(r.sessions||{})[t];
  if(ses){if(ses.done)return {done:true,n:0,due:0};return {done:false,n:Math.max(0,ses.queue.length-ses.pos)+(ses.again||[]).length,started:true};}
  const due=Object.values(cards).filter(c=>c.due<=t).length;
  const d=doneMap(name);const pool=r.pool||{};
  const intro={};Object.keys(cards).forEach(k=>{const src=k.split(':')[0];intro[src]=(intro[src]||0)+1;});
  let est=0;
  Object.keys(d).forEach(id=>{if(id.includes(':')||!window.GAME_MAP||!(window.GAME_MAP.ids||[]).includes(id))return;est+=pool[id]!=null?Math.max(0,pool[id]-(intro[id]||0)):5;});
  const ru=(rd(keyFor('ru-trainer:v1',name))||{}).stats||{},en=(rd(keyFor('en-trainer:v1',name))||{}).stats||{};
  est+=Object.keys(ru).filter(k=>!cards['ru:'+k]).length+Object.keys(en).filter(k=>!cards['en:'+k]).length;
  /* материал прошлых лет (классы ниже текущего) считается изученным — его хватает надолго */
  const M=window.GAME_MAP||{};const kg=(M.kidGrade||{})[name];
  if(kg&&(Object.values(M.grade||{}).some(g=>g<kg)||kg>5))est+=REV_NEW;
  const nNew=Math.min(Math.max(0,REV_NEW-((r.newDays||{})[t]||0)),est);
  return {done:false,n:Math.min(REV_MAX,due+nNew),due,studied:est>0||Object.keys(cards).length>0};
}

function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);

  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}

    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}

const theory=[
{title:'Зачем нужны формулы сокращённого умножения',lvl:0,html:`
<p>Иногда приходится много раз умножать одни и те же «скобки», например (x + 3)(x + 3). Математики заметили закономерности и записали их в виде готовых формул — как таблицу умножения, только для скобок. Это экономит время и помогает считать в уме.</p>
<div class="box rule"><b>Слова, которые встретятся</b>
<b>Квадрат</b> числа — число, умноженное само на себя: a² = a · a.<br>
<b>Произведение</b> — результат умножения: ab = a · b.<br>
<b>Удвоенное произведение</b> — произведение, умноженное на 2: 2ab.<br>
<b>Куб</b> — число, умноженное само на себя три раза: a³ = a · a · a.</div>
<p>Формул семь. Все они проверяются простым раскрытием скобок — поэтому если забыл формулу, её всегда можно вывести заново.</p>`},
{title:'Квадрат суммы: (a + b)² = a² + 2ab + b²',lvl:0,html:`
<p>Раскроем скобки: (a + b)² = (a + b)(a + b) = a² + ab + ba + b² = <b>a² + 2ab + b²</b>.</p>

<p>Картинка: большой квадрат со стороной a + b разрезан на 4 части — квадрат a², квадрат b² и <b>два</b> одинаковых прямоугольника ab. Отсюда и «2ab».</p>
<div class="fig">${figSum()}</div>
<div class="box ex"><b>Пример</b>(x + 3)² = x² + 2 · x · 3 + 3² = x² + 6x + 9.<br>(2a + 5)² = (2a)² + 2 · 2a · 5 + 5² = 4a² + 20a + 25.</div>
<div class="box err"><b>Самая частая ошибка</b><span class="m">(a + b)² ≠ a² + b²</span>! На картинке это значит «забыли два прямоугольника».<br>Проверка числами: (2 + 3)² = 5² = 25, а 2² + 3² = 4 + 9 = 13. Не равно! Разница 12 = 2 · 2 · 3 — это и есть 2ab.</div>
<div class="box err"><b>Вторая ошибка</b>Забыть возвести в квадрат коэффициент: (2a)² = 4a², а не 2a².</div>`},
{title:'Квадрат разности: (a − b)² = a² − 2ab + b²',lvl:1,html:`
<p>Всё так же, только удвоенное произведение идёт со знаком <b>минус</b>. Последнее слагаемое b² — всегда с <b>плюсом</b> (минус на минус).</p>
<div class="box rule"><b>Формула</b><span class="m">(a − b)² = a² − 2ab + b²</span><br>«Квадрат разности равен квадрату первого, минус удвоенное произведение, плюс квадрат второго».</div>
<div class="fig">${figDiff()}</div>
<p class="small" style="text-align:center">Из квадрата a² вырезаем две полосы. Каждая полоса вместе с уголком — это ab, поэтому ab − b² без уголка. Получаем (a − b)² = a² − 2(ab − b²) − b² = a² − 2ab + b².</p>
<div class="box ex"><b>Пример</b>(x − 4)² = x² − 2 · x · 4 + 4² = x² − 8x + 16.<br>(3a − 2b)² = 9a² − 12ab + 4b².</div>

<div class="box tip"><b>Как запомнить знаки</b>В квадрате суммы все знаки «+». В квадрате разности знаки идут «+ − +» — минус только посередине.</div>`},
{title:'Разность квадратов: a² − b² = (a − b)(a + b)',lvl:2,html:`

{title:'Считаем в уме с помощью формул',lvl:3,html:`
<p>Формулы — отличный способ считать большие числа без калькулятора. Секрет: представь число как «круглое ± немного».</p>
<div class="box ex"><b>Квадрат числа около круглого</b>99² = (100 − 1)² = 10000 − 200 + 1 = <b>9801</b>.<br>51² = (50 + 1)² = 2500 + 100 + 1 = <b>2601</b>.</div>
<div class="box ex"><b>Произведение «симметричных» чисел</b>51 · 49 = (50 + 1)(50 − 1) = 2500 − 1 = <b>2499</b>.<br>102 · 98 = 100² − 2² = 10000 − 4 = <b>9996</b>.</div>
<div class="box ex"><b>Разность квадратов больших чисел</b>101² − 99² = (101 − 99)(101 + 99) = 2 · 200 = <b>400</b>. Не нужно возводить в квадрат!</div>
<div class="box tip"><b>Как заметить</b>Если два множителя одинаково отстоят от круглого числа (51 и 49 — оба на 1 от 50), — это разность квадратов.</div>`},
{title:'Разложение на множители. Полный квадрат',lvl:4,html:`
<p>Формулы работают и <b>справа налево</b>: длинное выражение «сворачиваем» в скобку. Это называется <b>разложить на множители</b>.</p>
<div class="box rule"><b>Как узнать полный квадрат</b>Трёхчлен — полный квадрат, если:<br>1) два слагаемых — квадраты (x² и 25 = 5²);<br>2) третье слагаемое — <b>удвоенное произведение</b> их «оснований» (2 · x · 5 = 10x).<br>Тогда x² − 10x + 25 = (x − 5)². Знак в скобке — как знак у удвоенного произведения.</div>
<ol class="steps"><li>Нашёл квадраты: 4a² = (2a)², 9 = 3².</li><li>Проверил середину: 2 · 2a · 3 = 12a. В выражении 4a² + 12a + 9 стоит именно 12a ✅.</li><li>Ответ: (2a + 3)².</li></ol>
<div class="box err"><b>Не полный квадрат</b>x² + 5x + 25: квадраты есть (x² и 5²), но удвоенное произведение должно быть 10x, а не 5x. Значит, это <b>не</b> полный квадрат.</div>`},
{title:'Куб суммы и куб разности',lvl:5,html:`
<div class="box rule"><b>Формулы</b><span class="m">(a + b)³ = a³ + 3a²b + 3ab² + b³</span><br><span class="m">(a − b)³ = a³ − 3a²b + 3ab² − b³</span><br>«Куб суммы равен кубу первого, плюс утроенное произведение квадрата первого на второе, плюс утроенное произведение первого на квадрат второго, плюс куб второго».</div>
<div class="box tip"><b>Как запомнить</b>Коэффициенты <b>1, 3, 3, 1</b>. Степень a идёт вниз: 3, 2, 1, 0. Степень b — вверх: 0, 1, 2, 3.<br>В кубе разности знаки <b>чередуются</b>: + − + −.</div>
<div class="box ex"><b>Пример</b>(x + 2)³ = x³ + 3 · x² · 2 + 3 · x · 4 + 8 = x³ + 6x² + 12x + 8.<br>(x − 1)³ = x³ − 3x² + 3x − 1.</div>
<div class="box err"><b>Ловушка</b>(a + b)³ ≠ a³ + b³. Проверка: (1 + 1)³ = 8, а 1³ + 1³ = 2.</div>`},
{title:'Сумма и разность кубов',lvl:6,html:`
<div class="box rule"><b>Формулы</b><span class="m">a³ − b³ = (a − b)(a² + ab + b²)</span><br><span class="m">a³ + b³ = (a + b)(a² − ab + b²)</span></div>
<p>Вторую скобку называют <b>неполным квадратом</b>: она похожа на квадрат суммы или разности, но посередине просто ab, а не 2ab.</p>
<div class="box tip"><b>Как запомнить знаки</b>Первая скобка — <b>тот же</b> знак, что между кубами. Посередине второй скобки — <b>противоположный</b>. В конце — <b>всегда плюс</b>.</div>
<div class="box ex"><b>Пример</b>x³ − 8 = x³ − 2³ = (x − 2)(x² + 2x + 4).<br>27a³ + 1 = (3a)³ + 1³ = (3a + 1)(9a² − 3a + 1).</div>
<div class="box err"><b>Ловушка</b>x³ − 8 ≠ (x − 2)³ и ≠ (x − 2)(x² + 4x + 4). Во второй скобке посередине 2x, а не 4x.</div>
<p>Проверить можно раскрытием скобок: (x − 2)(x² + 2x + 4) = x³ + 2x² + 4x − 2x² − 4x − 8 = x³ − 8 ✅.</p>`},
{title:'Выделение полного квадрата. Наименьшее значение',lvl:7,html:`
<p>Как найти наименьшее значение выражения x² − 6x + 11? Превратим его в «квадрат + число».</p>
<ol class="steps"><li>Смотрим на x² − 6x. Это начало квадрата разности: (x − 3)² = x² − 6x + 9. (Число в скобке — половина от 6.)</li>
<li>Значит, x² − 6x + 11 = (x² − 6x + 9) + 2 = <b>(x − 3)² + 2</b>.</li>
<li>Квадрат всегда ≥ 0, а = 0 он только при x = 3. Поэтому наименьшее значение равно <b>2</b> (при x = 3).</li></ol>
<div class="box tip"><b>Аналогия</b>(x − 3)² — это «плата», которая никогда не бывает отрицательной. Минимум — когда платить ничего не надо (x = 3). Тогда остаётся только «+2».</div>
<div class="box err"><b>Ловушка</b>Добавил 9 — не забудь вычесть 9: x² − 6x + 11 = (x − 3)² − 9 + 11. Ответ «11» неверен.</div>`},
{title:'Комбинированные задачи и уравнения',lvl:8,html:`
<p>Если в уравнении есть квадраты скобок, раскрой их по формулам — часто x² сокращается и уравнение становится простым.</p>
<div class="box ex"><b>Пример</b>(x + 3)² − (x − 3)² = 24.<br>(x² + 6x + 9) − (x² − 6x + 9) = 24<br>x² + 6x + 9 − x² + 6x − 9 = 24 (минус перед скобкой меняет все знаки!)<br>12x = 24 → x = 2.</div>
<div class="box err"><b>Самая коварная ошибка</b>Минус перед скобкой: −(x − 3)² = −(x² − 6x + 9) = −x² + 6x − 9. Меняются <b>все три</b> знака.</div>
<div class="box tip"><b>Сворачивание</b>37² + 2 · 37 · 13 + 13² = (37 + 13)² = 50² = 2500 — формула «наоборот».</div>`},
{title:'★ Олимпиадные приёмы',lvl:9,html:`
<h3>1) Цепочка разностей квадратов</h3>
<p>(2 + 1)(2² + 1)(2⁴ + 1)(2⁸ + 1). Умножим на (2 − 1) = 1 — значение не изменится:<br>(2 − 1)(2 + 1) = 2² − 1, потом (2² − 1)(2² + 1) = 2⁴ − 1, потом 2⁸ − 1, потом 2${sup(16)} − 1. Ответ: 2${sup(16)} − 1 = 65535.</p>
<p>Отсюда же видно: 2${sup(16)} − 1 = (2⁸ − 1)(2⁸ + 1) = 3 · 5 · 17 · 257 — делится на 3, 5, 17 и 257.</p>
<h3>2) Сумма квадратов ≥ 0</h3>
<p>x² + y² − 4x + 6y + 20 = (x − 2)² + (y + 3)² + 7. Оба квадрата ≥ 0, значит, наименьшее значение — 7 (при x = 2, y = −3).</p>
<h3>3) Знаем a + b и ab — находим всё остальное</h3>
<p>a² + b² = (a + b)² − 2ab, &nbsp; a³ + b³ = (a + b)³ − 3ab(a + b).<br>Если a + b = 5, ab = 3: a² + b² = 25 − 6 = 19; a³ + b³ = 125 − 45 = 80.</p>
<p>Похожий приём: если x + ${fr(1,'x')} = 3, то x² + ${fr(1,'x²')} = 3² − 2 = 7 (удвоенное произведение x · ${fr(1,'x')} = 1).</p>
<h3>4) Произведение четырёх подряд идущих чисел + 1</h3>
<p>n(n + 1)(n + 2)(n + 3) + 1 = (n² + 3n + 1)² — всегда полный квадрат. Например, 1 · 2 · 3 · 4 + 1 = 25 = 5².</p>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b². Не забывай 2ab!</li>
<li>a² − b² = (a − b)(a + b). Сумма квадратов не раскладывается.</li>
<li>(a ± b)³ = a³ ± 3a²b + 3ab² ± b³ (коэффициенты 1, 3, 3, 1).</li>
<li>a³ ± b³ = (a ± b)(a² ∓ ab + b²): тот же знак, противоположный, всегда плюс.</li>
<li>Наименьшее значение — выдели полный квадрат: x² − 6x + 11 = (x − 3)² + 2.</li>
<li>Минус перед скобкой меняет все знаки внутри.</li></ul>`}
];

/* ---------- формулы ---------- */

const symbols={tab:'Формулы',title:'Все формулы: как читать и пример',rows:[
[F('(a + b)² =<br>a² + 2ab + b²'),'Квадрат суммы','«Квадрат первого, плюс удвоенное произведение первого на второе, плюс квадрат второго».',M('(x + 3)² = x² + 6x + 9')],
[F('(a − b)² =<br>a² − 2ab + b²'),'Квадрат разности','«Квадрат первого, минус удвоенное произведение, плюс квадрат второго». Последний знак — всегда плюс.',M('(x − 4)² = x² − 8x + 16')],

],after:`<div class="box err" style="margin-top:14px"><b>Главная ошибка</b>(a + b)² ≠ a² + b². Проверка: (2 + 3)² = 25, а 4 + 9 = 13.</div>`};

/* L0 — квадрат суммы */

const o=mk(c,[P([[1,sq2(v)],[n*n,'']]),P([[1,sq2(v)],[n,v],[n*n,'']]),P([[1,sq2(v)],[2*n,v],[2*n,'']])]);

short:`${v}² + 2 · ${v} · ${n} + ${n}² = ${c}.`,

explain2:`Распиши квадрат как умножение двух скобок и умножь «каждый на каждого»:<br>(${v} + ${n})(${v} + ${n}) = ${v}·${v} + ${v}·${n} + ${n}·${v} + ${n}·${n} = ${v}² + ${n}${v} + ${n}${v} + ${n*n} = ${c}.<br>Видишь — слагаемое ${n}${v} появляется <b>два раза</b>, поэтому ${2*n}${v}.<br>Проверка числом: при ${v} = 1 слева (1 + ${n})² = ${(1+n)**2}, справа 1 + ${2*n} + ${n*n} = ${1+2*n+n*n} ✅.`};});

return {type:'choice',q:`Раскрой скобки: ${M(`(${B(m,v,n)})²`)}.`,opts:o.opts,ans:o.ans,

explain:`a = ${m}${v}, b = ${n}.<br>• a² = (${m}${v})² = ${m}² · ${v}² = ${m*m}${v}² — в квадрат возводим <b>и число ${m}</b>, и букву!<br>• 2ab = 2 · ${m}${v} · ${n} = ${2*m*n}${v}<br>• b² = ${n*n}<br>Ответ: <b>${c}</b>.<div class="box err"><b>Ловушки</b>«${P([[m,sq2(v)],[2*m*n,v],[n*n,'']])}» — забыли возвести ${m} в квадрат.<br>«${P([[m*m,sq2(v)],[m*n,v],[n*n,'']])}» — забыли удвоить произведение.</div>`,
explain2:`Проверка подстановкой: пусть ${v} = 1. Слева: (${m} + ${n})² = ${(m+n)**2}. Правильный ответ даёт ${m*m} + ${2*m*n} + ${n*n} = ${m*m+2*m*n+n*n} ✅. А вариант с ${m}${v}² дал бы ${m} + ${2*m*n} + ${n*n} = ${m+2*m*n+n*n} ❌. Подстановка числа — лучший способ поймать свою ошибку.`};});
G(0,()=>{let a,b;do{a=R(2,9);b=R(2,9);}while(a===b);
return {type:'num',q:`Вычисли ${M(`(${a} + ${b})² − (${a}² + ${b}²)`)}.`,ans:2*a*b,
hint:'Посчитай обе части отдельно. Разница не случайна!',
short:`${(a+b)**2} − ${a*a+b*b} = ${2*a*b} = 2 · ${a} · ${b}.`,
explain:`Считаем по порядку:<br>(${a} + ${b})² = ${a+b}² = ${(a+b)**2};<br>${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b};<br>разность: ${(a+b)**2} − ${a*a+b*b} = <b>${2*a*b}</b>.<br>Заметь: ${2*a*b} = 2 · ${a} · ${b} — это <b>удвоенное произведение</b> 2ab. Именно его «теряют», когда пишут (a + b)² = a² + b².`,
explain2:`По формуле: (${a} + ${b})² = ${a}² + 2 · ${a} · ${b} + ${b}². Если вычесть ${a}² + ${b}², останется только 2 · ${a} · ${b} = ${2*a*b}. На картинке с квадратом это два прямоугольника ${a} × ${b}: ${a*b} + ${a*b} = ${2*a*b}.`};});
G(0,()=>{const m=R(1,4),n=R(2,9),v=pick(VARS);
return {type:'num',q:`Какое число нужно вписать вместо □, чтобы равенство было верным?<br>${M(`(${B(m,v,n)})² = ${P([[m*m,sq2(v)]])} + □${v} + ${n*n}`)}`,ans:2*m*n,

/* L1 — квадрат разности */
G(1,()=>{const n=R(2,9),v=pick(VARS);
const c=P([[1,sq2(v)],[-2*n,v],[n*n,'']]);
const o=mk(c,[P([[1,sq2(v)],[-n*n,'']]),P([[1,sq2(v)],[-2*n,v],[-n*n,'']]),P([[1,sq2(v)],[2*n,v],[n*n,'']])]);

hint:'Знаки в квадрате разности: + − +.',
short:`${v}² − 2 · ${v} · ${n} + ${n}² = ${c}.`,
explain:`Формула: (a − b)² = a² − 2ab + b², a = ${v}, b = ${n}.<br>${v}² − 2 · ${v} · ${n} + ${n}² = <b>${c}</b>.<br>• «${P([[1,sq2(v)],[-n*n,'']])}» — это разность квадратов, другая формула; потеряно −${2*n}${v}.<br>• «… − ${n*n}» в конце — неверно: (−${n})² = +${n*n}, квадрат всегда с плюсом.<br>• «+ ${2*n}${v}» — это квадрат суммы, знак перепутан.`,

short:`${m===1?a:`(${m}${a})`}² − 2 · ${mm}${a} · ${nn}${b} + ${n===1?b:`(${n}${b})`}² = ${c}.`,
explain:`Первое — ${mm}${a}, второе — ${nn}${b}.<br>• квадрат первого: ${m===1?a:`(${m}${a})`}² = ${m*m===1?'':m*m}${a}²<br>• удвоенное произведение: 2 · ${mm}${a} · ${nn}${b} = ${2*m*n}${a}${b} (со знаком минус)<br>• квадрат второго: ${n===1?b:`(${n}${b})`}² = ${n*n===1?'':n*n}${b}²<br>Ответ: <b>${c}</b>.`,
explain2:`Проверка подстановкой ${a} = 1, ${b} = 1: слева (${m} − ${n})² = ${(m-n)**2}. В правильном ответе ${m*m} − ${2*m*n} + ${n*n} = ${(m-n)**2} ✅. Вариант без удвоенного произведения дал бы ${m*m-n*n} — не совпадает.`};});
G(1,()=>{const m=R(2,5),n=R(2,9),v=pick(VARS);
return {type:'num',q:`Какое число пропущено?<br>${M(`(${m}${v} − □)² = ${P([[m*m,sq2(v)],[-2*m*n,v],[n*n,'']])}`)}`,ans:n,
hint:`Последнее слагаемое ${n*n} — это квадрат пропущенного числа. Проверь по среднему члену.`,
short:`□² = ${n*n} и 2 · ${m}${v} · ${n} = ${2*m*n}${v} → □ = ${n}.`,
explain:`В (a − b)² последний член — b². Здесь b² = ${n*n}, значит b = ${n}.<br>Проверим по среднему члену: 2 · ${m}${v} · ${n} = ${2*m*n}${v} ✅ — совпадает.<br>Ответ: <b>${n}</b>.`,
explain2:`Можно идти от среднего члена: 2ab = ${2*m*n}${v}, a = ${m}${v}, значит b = ${2*m*n} : (2 · ${m}) = ${n}. Оба способа дают ${n} — значит, ответ верный.`};});

/* L2 — разность квадратов */
G(2,()=>{const n=R(2,12),v=pick(VARS);
const c=P([[1,sq2(v)],[-n*n,'']]);
const o=mk(c,[P([[1,sq2(v)],[n*n,'']]),P([[1,sq2(v)],[-2*n,v],[-n*n,'']]),P([[1,sq2(v)],[-2*n,'']])]);
return {type:'choice',q:`Выполни умножение: ${M(`(${v} − ${n})(${v} + ${n})`)}.`,opts:o.opts,ans:o.ans,
short:`(a − b)(a + b) = a² − b² = ${c}.`,
explain:`Это формула разности квадратов: (a − b)(a + b) = a² − b².<br>a = ${v}, b = ${n} → ${v}² − ${n}² = <b>${c}</b>.<br>• «+ ${n*n}» — неверный знак: в формуле минус.<br>• «− ${2*n}» — квадрат перепутали с умножением на 2.`,
explain2:`Раскроем скобки «каждый на каждый»: ${v}·${v} + ${n}${v} − ${n}${v} − ${n*n}. Средние слагаемые +${n}${v} и −${n}${v} взаимно уничтожаются — как шаг вперёд и шаг назад. Остаётся ${c}.`};});
G(2,()=>{let m,n;do{m=R(1,5);n=R(2,9);}while(H.gcd(m,n)!==1);const v=pick(VARS);const mv=(m===1?'':m)+v;
const c=`(${mv} − ${n})(${mv} + ${n})`;
const o=mk(c,[`(${mv} − ${n})²`,m>1?`(${m*m}${v} − ${n})(${m*m}${v} + ${n})`:`(${v} − ${n*n})(${v} + ${n*n})`,`(${mv} + ${n})²`]);
return {type:'choice',q:`Разложи на множители: ${M(P([[m*m,sq2(v)],[-n*n,'']]))}.`,opts:o.opts.map(M),ans:o.ans,
hint:'Представь оба слагаемых как квадраты.',
short:`${P([[m*m,sq2(v)]])} = (${mv})², ${n*n} = ${n}² → ${c}.`,
explain:`1) Оба слагаемых — квадраты: ${P([[m*m,sq2(v)]])} = (${mv})², ${n*n} = ${n}².<br>2) Разность квадратов: a² − b² = (a − b)(a + b), a = ${mv}, b = ${n}.<br>Ответ: <b>${c}</b>.<br>• (${mv} − ${n})² — это квадрат разности, при раскрытии появится −${2*m*n}${v}, которого нет.${m>1?`<br>• ${m*m}${v} в скобке — забыли, что ${m*m}${v}² = (${m}${v})², а не (${m*m}${v})².`:''}`,
explain2:`Проверь умножением: (${mv} − ${n})(${mv} + ${n}) = (${mv})² − ${n}² = ${P([[m*m,sq2(v)],[-n*n,'']])} ✅. Разложение и раскрытие — это одна формула, прочитанная в разные стороны.`};});
G(2,()=>{const shift=Math.random()<0.5,n=R(1,9),p=R(1,6);
const ans=shift?[p-n,p+n]:[-n,n];const lhs=shift?`(x − ${p})² − ${n*n} = 0`:`x² − ${n*n} = 0`;
return {type:'set',q:`Реши уравнение ${M(lhs)}. Запиши все корни.`,ans,ph:'например: −3, 3',keys:['−','∅'],
hint:'Разложи левую часть на множители по формуле разности квадратов.',
short:shift?`(x − ${p} − ${n})(x − ${p} + ${n}) = 0 → x = ${N(p+n)} или x = ${N(p-n)}.`:`(x − ${n})(x + ${n}) = 0 → x = ±${n}.`,
explain:shift?`Разность квадратов: (x − ${p})² − ${n}² = (x − ${p} − ${n})(x − ${p} + ${n}) = (x − ${p+n})(${P([[1,'x'],[n-p,'']])}).<br>Произведение равно нулю, когда один из множителей равен нулю:<br>x − ${p+n} = 0 → x = ${p+n}; ${P([[1,'x'],[n-p,'']])} = 0 → x = ${N(p-n)}.<br>Ответ: <b>${N(p-n)}; ${N(p+n)}</b>.`:`Разность квадратов: x² − ${n*n} = (x − ${n})(x + ${n}).<br>Произведение равно нулю, когда один из множителей равен нулю: x = ${n} или x = −${n}.<br>Ответ: <b>−${n}; ${n}</b>.<div class="box err"><b>Ловушка</b>Не теряй отрицательный корень: (−${n})² − ${n*n} = 0 ✅.</div>`,
explain2:shift?`Другой путь: (x − ${p})² = ${n*n}, значит x − ${p} = ${n} или x − ${p} = −${n}. Отсюда x = ${p+n} или x = ${N(p-n)}. Проверка: (${p+n} − ${p})² = ${n*n} ✅, (${N(p-n)} − ${p})² = (−${n})² = ${n*n} ✅.`:`Можно перенести: x² = ${n*n}. Какие числа в квадрате дают ${n*n}? ${n} и −${n}. Проверь подстановкой оба.`};});

/* L3 — устный счёт */
G(3,()=>{const base=pick([20,30,40,50,60,70,80,90,100,200]),d=pick([-2,-1,1,2,3]);const x=base+d;const ans=x*x;
const op=d>0?'+':'−',ad=Math.abs(d);
return {type:'num',q:`Вычисли устно, используя формулу: ${M(`${x}²`)}.`,ans,
hint:`${x} = ${base} ${op} ${ad}.`,
short:`(${base} ${op} ${ad})² = ${base*base} ${op} ${2*base*ad} + ${ad*ad} = ${ans}.`,
explain:`Представим ${x} как «круглое ${op} немного»: ${x} = ${base} ${op} ${ad}.<br>(${base} ${op} ${ad})² = ${base}² ${op} 2 · ${base} · ${ad} + ${ad}² = ${base*base} ${op} ${2*base*ad} + ${ad*ad} = <b>${ans}</b>.<div class="box err"><b>Ловушка</b>${base*base} ${op} ${ad*ad} = ${d>0?base*base+ad*ad:base*base-ad*ad} — неверно, потеряно удвоенное произведение ${2*base*ad}.</div>`,
explain2:`Проверим столбиком в уме: ${x} · ${x} = ${x} · ${base} ${op} ${x} · ${ad} = ${x*base} ${op} ${x*ad} = ${ans}. Совпало — но через формулу гораздо быстрее, потому что ${base}² считается мгновенно.`};});
G(3,()=>{const base=pick([20,30,40,50,60,70,80,90,100]),d=R(1,3);const a=base+d,b=base-d;
return {type:'num',q:`Вычисли устно: ${M(`${a} · ${b}`)}.`,ans:a*b,
hint:`Оба числа на ${d} отличаются от ${base}.`,
short:`(${base} + ${d})(${base} − ${d}) = ${base*base} − ${d*d} = ${a*b}.`,
explain:`Заметим: ${a} = ${base} + ${d}, ${b} = ${base} − ${d}. Это разность квадратов:<br>(${base} + ${d})(${base} − ${d}) = ${base}² − ${d}² = ${base*base} − ${d*d} = <b>${a*b}</b>.`,
explain2:`Представь прямоугольник ${a} × ${b}. Если отрезать от длинной стороны полоску шириной ${d} и приставить к короткой, почти получится квадрат ${base} × ${base} — только в углу не хватит кусочка ${d} × ${d}. Поэтому ${base*base} − ${d*d} = ${a*b}.`};});
G(3,()=>{const d=pick([2,4,6,10]),s=pick([100,200,160,120,80,60,140]);const a=(s+d)/2,b=(s-d)/2;
if(!Number.isInteger(a))return null;
return {type:'num',q:`Вычисли: ${M(`${a}² − ${b}²`)}.`,ans:a*a-b*b,
hint:'Не возводи в квадрат! Используй разность квадратов.',
short:`(${a} − ${b})(${a} + ${b}) = ${d} · ${s} = ${d*s}.`,
explain:`a² − b² = (a − b)(a + b):<br>${a}² − ${b}² = (${a} − ${b})(${a} + ${b}) = ${d} · ${s} = <b>${d*s}</b>.<br>Удобно, потому что сумма ${a} + ${b} = ${s} — круглое число.`,
explain2:`Проверка «в лоб»: ${a}² = ${a*a}, ${b}² = ${b*b}, разность ${a*a} − ${b*b} = ${a*a-b*b}. Ответ тот же, но считать дольше и легче ошибиться.`};});
G(3,()=>{const s=pick([40,50,60,70,80,90,100]);const b=R(11,s/2-2),a=s-b;
return {type:'num',q:`Вычисли: ${M(`(${a}² − ${b}²) : ${s}`)}.`,ans:a-b,
hint:`Разложи ${a}² − ${b}² на множители. Ничего не напоминает число ${s}?`,
short:`(${a} − ${b})(${a} + ${b}) : ${s} = ${a-b} · ${s} : ${s} = ${a-b}.`,
explain:`${a}² − ${b}² = (${a} − ${b})(${a} + ${b}) = ${a-b} · ${s}.<br>Делим на ${s}: ${a-b} · ${s} : ${s} = <b>${a-b}</b>.`,
explain2:`Посмотри: ${a} + ${b} = ${s} — именно на это число мы делим. Значит, после разложения множитель ${s} просто сокращается, и остаётся ${a} − ${b} = ${a-b}.`};});

/* L4 — разложение, полный квадрат */
G(4,()=>{const n=R(2,9),v=pick(VARS),plus=Math.random()<0.5,s=plus?1:-1;
const e=P([[1,sq2(v)],[s*2*n,v],[n*n,'']]);const c=`(${v} ${plus?'+':'−'} ${n})²`;
const o=mk(c,[`(${v} ${plus?'−':'+'} ${n})²`,`(${v} ${plus?'+':'−'} ${2*n})²`,`(${v} − ${n})(${v} + ${n})`]);
return {type:'choice',q:`Представь в виде квадрата двучлена: ${M(e)}.`,opts:o.opts.map(M),ans:o.ans,
short:`${v}² ${plus?'+':'−'} 2 · ${v} · ${n} + ${n}² = ${c}.`,
explain:`1) Квадраты: ${v}² = (${v})², ${n*n} = ${n}².<br>2) Проверяем середину: 2 · ${v} · ${n} = ${2*n}${v} ✅, знак «${plus?'+':'−'}».<br>3) Значит, это квадрат ${plus?'суммы':'разности'}: <b>${c}</b>.<br>• (${v} ${plus?'+':'−'} ${2*n})² — в скобке не ${2*n}, а ${n}: ${2*n} — это уже удвоенное число.<br>• (${v} − ${n})(${v} + ${n}) = ${v}² − ${n*n} — среднего члена нет.`,
explain2:`Проверка раскрытием: ${c} = ${v}² ${plus?'+':'−'} ${2*n}${v} + ${n*n} ✅. Подсказка по знаку: знак в скобке — такой же, как знак перед ${2*n}${v}.`};});
G(4,()=>{const n=R(2,9),v=pick(VARS),plus=Math.random()<0.5,s=plus?1:-1;
const good=P([[1,sq2(v)],[s*2*n,v],[n*n,'']]);
const o=mk(good,[P([[1,sq2(v)],[s*n,v],[n*n,'']]),P([[1,sq2(v)],[s*2*n,v],[-n*n,'']]),P([[1,sq2(v)],[s*2*n,v],[2*n,'']])]);
return {type:'choice',q:`Какой из трёхчленов является <b>полным квадратом</b>?`,opts:o.opts.map(M),ans:o.ans,
short:`${good} = (${v} ${plus?'+':'−'} ${n})².`,
explain:`Полный квадрат: a² ± 2ab + b², где оба крайних — квадраты <b>со знаком плюс</b>, а середина — удвоенное произведение.<br>• <b>${good}</b> = (${v} ${plus?'+':'−'} ${n})² ✅.<br>• ${P([[1,sq2(v)],[s*n,v],[n*n,'']])} — посередине должно быть ${2*n}${v}, а стоит ${n}${v}.<br>• ${P([[1,sq2(v)],[s*2*n,v],[-n*n,'']])} — −${n*n} не может быть квадратом (квадрат ≥ 0).<br>• ${P([[1,sq2(v)],[s*2*n,v],[2*n,'']])} — ${2*n} не равно ${n}² = ${n*n}.`,
explain2:`Подставь ${v} = 0: у полного квадрата (0 ${plus?'+':'−'} ${n})² = ${n*n} — свободный член должен быть ровно ${n*n}. Подставь ${v} = 1: (1 ${plus?'+':'−'} ${n})² = ${(1+s*n)**2}, и только у правильного варианта 1 ${plus?'+':'−'} ${2*n} + ${n*n} = ${(1+s*n)**2}.`};});
G(4,()=>{const n=R(2,10),v=pick(VARS),plus=Math.random()<0.5;
return {type:'num',q:`Какое число нужно поставить вместо □, чтобы получился полный квадрат?<br>${M(`${v}² ${plus?'+':'−'} ${2*n}${v} + □`)}`,ans:n*n,
hint:`${2*n}${v} = 2 · ${v} · ?`,
short:`${2*n}${v} = 2 · ${v} · ${n} → □ = ${n}² = ${n*n}.`,
explain:`Средний член — удвоенное произведение: ${2*n}${v} = 2 · ${v} · <b>${n}</b>. Значит, второе число в скобке — ${n}.<br>Последний член — его квадрат: ${n}² = <b>${n*n}</b>.<br>Получится ${v}² ${plus?'+':'−'} ${2*n}${v} + ${n*n} = (${v} ${plus?'+':'−'} ${n})².<div class="box err"><b>Ловушка</b>Ответ ${2*n} или ${n} — нет: нужен <b>квадрат половины</b> коэффициента: (${2*n} : 2)² = ${n*n}.</div>`,
explain2:`Правило «половина в квадрате»: коэффициент при ${v} — это ${2*n}. Берём половину: ${n}. Возводим в квадрат: ${n*n}. Проверь: (${v} ${plus?'+':'−'} ${n})² = ${v}² ${plus?'+':'−'} ${2*n}${v} + ${n*n} ✅.`};});
G(4,()=>{const m=R(2,4);let n;do{n=R(1,7);}while(H.gcd(m,n)!==1);const v=pick(VARS);
const e=P([[m*m,sq2(v)],[2*m*n,v],[n*n,'']]);const c=`(${m}${v} + ${n})²`;
const o=mk(c,[`(${m*m}${v} + ${n})²`,`(${m}${v} + ${n*n})²`,`(${m}${v} + ${n})(${m}${v} − ${n})`]);
return {type:'choice',q:`Разложи на множители: ${M(e)}.`,opts:o.opts.map(M),ans:o.ans,
short:`${m*m}${v}² = (${m}${v})², ${n*n} = ${n}², 2 · ${m}${v} · ${n} = ${2*m*n}${v} → ${c}.`,
explain:`1) ${m*m}${v}² = (${m}${v})² — это квадрат ${m}${v} (а не ${m*m}${v}!).<br>2) ${n*n} = ${n}².<br>3) Середина: 2 · ${m}${v} · ${n} = ${2*m*n}${v} ✅.<br>Ответ: <b>${c}</b>.<br>• (${m*m}${v} + ${n})² даст ${m**4}${v}² — слишком много.<br>• (${m}${v} + ${n*n})² даст ${n**4} в конце.`,
explain2:`Проверка подстановкой ${v} = 1: ${m*m} + ${2*m*n} + ${n*n} = ${(m+n)**2}, и (${m} + ${n})² = ${(m+n)**2} ✅. Для варианта (${m*m}${v} + ${n})²: (${m*m} + ${n})² = ${(m*m+n)**2} ❌.`};});

/* L5 — кубы суммы и разности */
G(5,()=>{const n=R(2,4),v=pick(['x','a','y']);
const c=P([[1,cu(v)],[3*n,sq2(v)],[3*n*n,v],[n**3,'']]);
const o=mk(c,[P([[1,cu(v)],[n**3,'']]),P([[1,cu(v)],[n,sq2(v)],[n*n,v],[n**3,'']]),P([[1,cu(v)],[3*n,sq2(v)],[3*n,v],[n**3,'']])]);
return {type:'choice',q:`Раскрой скобки: ${M(`(${v} + ${n})³`)}.`,opts:o.opts,ans:o.ans,
hint:'Коэффициенты 1, 3, 3, 1.',
short:`${v}³ + 3·${v}²·${n} + 3·${v}·${n}² + ${n}³ = ${c}.`,
explain:`Формула: (a + b)³ = a³ + 3a²b + 3ab² + b³, a = ${v}, b = ${n}.<br>• a³ = ${v}³<br>• 3a²b = 3 · ${v}² · ${n} = ${3*n}${v}²<br>• 3ab² = 3 · ${v} · ${n*n} = ${3*n*n}${v}<br>• b³ = ${n**3}<br>Ответ: <b>${c}</b>.<div class="box err"><b>Ловушки</b>«${P([[1,cu(v)],[n**3,'']])}» — (a + b)³ ≠ a³ + b³.<br>«… + ${3*n}${v} …» — забыли возвести ${n} в квадрат в слагаемом 3ab².</div>`,
explain2:`Можно раскрыть по шагам: (${v} + ${n})³ = (${v} + ${n})² · (${v} + ${n}) = (${v}² + ${2*n}${v} + ${n*n})(${v} + ${n}) = ${v}³ + ${n}${v}² + ${2*n}${v}² + ${2*n*n}${v} + ${n*n}${v} + ${n**3} = ${c}.<br>Проверка при ${v} = 1: (1 + ${n})³ = ${(1+n)**3}, и 1 + ${3*n} + ${3*n*n} + ${n**3} = ${1+3*n+3*n*n+n**3} ✅.`};});
G(5,()=>{const n=R(1,4),v=pick(['x','a','y']);
const c=P([[1,cu(v)],[-3*n,sq2(v)],[3*n*n,v],[-(n**3),'']]);
const o=mk(c,[P([[1,cu(v)],[-(n**3),'']]),P([[1,cu(v)],[-3*n,sq2(v)],[-3*n*n,v],[-(n**3),'']]),P([[1,cu(v)],[-3*n,sq2(v)],[3*n*n,v],[n**3,'']])]);
return {type:'choice',q:`Раскрой скобки: ${M(`(${v} − ${n})³`)}.`,opts:o.opts,ans:o.ans,
hint:'Знаки в кубе разности чередуются: + − + −.',
short:`${v}³ − ${3*n}${v}² + ${3*n*n}${v} − ${n**3}.`,
explain:`(a − b)³ = a³ − 3a²b + 3ab² − b³, a = ${v}, b = ${n}:<br>${v}³ − 3 · ${v}² · ${n} + 3 · ${v} · ${n*n} − ${n**3} = <b>${c}</b>.<br>Знаки <b>чередуются</b>: + − + −. Третье слагаемое с плюсом, потому что (−${n})² = ${n*n} > 0, а последнее с минусом: (−${n})³ = −${n**3}.`,
explain2:`Запиши ${v} − ${n} = ${v} + (−${n}) и подставь в куб суммы: ${v}³ + 3${v}²(−${n}) + 3${v}(−${n})² + (−${n})³. Чётная степень минуса — плюс, нечётная — минус. Отсюда знаки + − + −.<br>Проверка при ${v} = 0: (−${n})³ = −${n**3} — свободный член −${n**3} ✅.`};});
G(5,()=>{const n=R(2,6),which=pick(['x','x2','c']);const v='x';
const coef={x:3*n*n,x2:3*n,c:n**3}[which];
const label={x:`коэффициент при ${v}`,x2:`коэффициент при ${v}²`,c:'свободный член (число без буквы)'}[which];
return {type:'num',q:`Не раскрывая всех скобок, найди в многочлене ${M(`(${v} + ${n})³`)} ${label}.`,ans:coef,
hint:'(a + b)³ = a³ + 3a²b + 3ab² + b³.',
short:`${which==='x'?`3ab² = 3 · ${v} · ${n}² = ${3*n*n}${v}`:which==='x2'?`3a²b = 3 · ${v}² · ${n} = ${3*n}${v}²`:`b³ = ${n}³ = ${n**3}`}.`,
explain:`(${v} + ${n})³ = ${v}³ + 3 · ${v}² · ${n} + 3 · ${v} · ${n}² + ${n}³ = ${P([[1,cu(v)],[3*n,sq2(v)],[3*n*n,v],[n**3,'']])}.<br>Нужный член: ${which==='x'?`${3*n*n}${v}`:which==='x2'?`${3*n}${v}²`:`${n**3}`}. Ответ: <b>${coef}</b>.`,
explain2:`Вспомни картинку: степень ${v} уменьшается 3, 2, 1, 0, а степень ${n} растёт 0, 1, 2, 3, коэффициенты 1, 3, 3, 1. ${which==='x'?`При ${v}¹ стоит 3 · ${n}² = ${3*n*n}.`:which==='x2'?`При ${v}² стоит 3 · ${n}¹ = ${3*n}.`:`Без ${v} стоит 1 · ${n}³ = ${n**3}.`}`};});

/* L6 — сумма и разность кубов */
G(6,()=>{const n=R(2,5),v=pick(['x','a','y']);
const c=`(${v} − ${n})(${P([[1,sq2(v)],[n,v],[n*n,'']])})`;
const o=mk(c,[`(${v} − ${n})(${P([[1,sq2(v)],[2*n,v],[n*n,'']])})`,`(${v} − ${n})(${P([[1,sq2(v)],[-n,v],[n*n,'']])})`,`(${v} − ${n})³`]);
return {type:'choice',q:`Разложи на множители: ${M(`${v}³ − ${n**3}`)}.`,opts:o.opts.map(M),ans:o.ans,
hint:`${n**3} = ${n}³. Разность кубов: a³ − b³ = (a − b)(a² + ab + b²).`,
short:`${v}³ − ${n}³ = ${c}.`,
explain:`1) ${n**3} = ${n}³, так что это разность кубов: a = ${v}, b = ${n}.<br>2) a³ − b³ = (a − b)(a² <b>+ ab</b> + b²) = <b>${c}</b>.<br>• С ${2*n}${v} посередине — это (${v} + ${n})², а в формуле кубов «неполный квадрат»: просто ab, без двойки.<br>• С −${n}${v} — перепутан знак: у разности кубов во второй скобке посередине <b>плюс</b>.<br>• (${v} − ${n})³ ≠ ${v}³ − ${n**3}: при раскрытии появятся ещё члены с ${v}² и ${v}.`,
explain2:`Проверим раскрытием: (${v} − ${n})(${v}² + ${n}${v} + ${n*n}) = ${v}³ + ${n}${v}² + ${n*n}${v} − ${n}${v}² − ${n*n}${v} − ${n**3} = ${v}³ − ${n**3} ✅. Все средние члены сократились — именно для этого во второй скобке ${n}${v}, а не ${2*n}${v}.`};});
G(6,()=>{let m,n;do{m=R(1,3);n=R(1,5);}while(m===n||(m===1&&n===1));const v=pick(['a','x','b']);const mv=(m===1?'':m)+v;
const sq=P([[m*m,sq2(v)],[-m*n,v],[n*n,'']]);
const c=`(${mv} + ${n})(${sq})`;
const o=mk(c,[`(${mv} + ${n})(${P([[m*m,sq2(v)],[m*n,v],[n*n,'']])})`,`(${mv} + ${n})(${P([[m*m,sq2(v)],[-2*m*n,v],[n*n,'']])})`,`(${mv} + ${n})³`]);
return {type:'choice',q:`Разложи на множители: ${M(P([[m**3,cu(v)],[n**3,'']]))}.`,opts:o.opts.map(M),ans:o.ans,
hint:'a³ + b³ = (a + b)(a² − ab + b²).',
short:`${m===1?v:`(${mv})`}³ + ${n}³ = ${c}.`,
explain:`1) ${P([[m**3,cu(v)]])} = ${m===1?v:`(${mv})`}³, ${n**3} = ${n}³.<br>2) Сумма кубов: a³ + b³ = (a + b)(a² <b>− ab</b> + b²), a = ${mv}, b = ${n}:<br>a² = ${P([[m*m,sq2(v)]])}, ab = ${P([[m*n,v]])}, b² = ${n*n}.<br>Ответ: <b>${c}</b>.<br>Правило знаков: в первой скобке тот же знак (+), посередине второй — противоположный (−), в конце — всегда +.`,
explain2:`Проверка подстановкой ${v} = 1: слева ${m**3} + ${n**3} = ${m**3+n**3}. Справа (${m} + ${n})(${m*m} − ${m*n} + ${n*n}) = ${m+n} · ${m*m-m*n+n*n} = ${(m+n)*(m*m-m*n+n*n)} ✅.`};});
G(6,()=>{const a=R(11,30),b=R(2,a-3);
return {type:'num',q:`Вычисли: ${M(`(${a}³ − ${b}³) : (${a}² + ${a} · ${b} + ${b}²)`)}.`,ans:a-b,
hint:'Узнаёшь неполный квадрат из формулы разности кубов?',
short:`${a}³ − ${b}³ = (${a} − ${b})(${a}² + ${a}·${b} + ${b}²), после деления остаётся ${a-b}.`,
explain:`По формуле разности кубов: ${a}³ − ${b}³ = (${a} − ${b})(${a}² + ${a} · ${b} + ${b}²).<br>Вторая скобка в точности совпадает с делителем — она сокращается.<br>Остаётся ${a} − ${b} = <b>${a-b}</b>.`,
explain2:`Можно и посчитать: ${a}³ = ${a**3}, ${b}³ = ${b**3}, разность ${a**3-b**3}; делитель ${a*a} + ${a*b} + ${b*b} = ${a*a+a*b+b*b}; ${a**3-b**3} : ${a*a+a*b+b*b} = ${a-b}. Тот же ответ, но через формулу — без больших чисел.`};});

/* L7 — выделение полного квадрата */
const minPar=()=>{let p,c;do{p=pick([-5,-4,-3,-2,-1,1,2,3,4,5,6]);c=R(-6,40);}while(c===0||c===p*p);return {p,c,m:c-p*p};};
G(7,()=>{const {p,c,m}=minPar();const e=P([[1,'x²'],[-2*p,'x'],[c,'']]);const sb=`(x ${p>0?'−':'+'} ${Math.abs(p)})²`;
return {type:'num',q:`Найди наименьшее значение выражения ${M(e)}.`,ans:m,
hint:`Выдели полный квадрат: ${sb} = ?`,
short:`${e} = ${sb} ${m<0?'−':'+'} ${Math.abs(m)}; минимум ${N(m)} при x = ${N(p)}.`,
explain:`1) Берём половину коэффициента при x: ${N(-2*p)} : 2 = ${N(-p)}. Значит, нужна скобка ${sb} = x² ${p>0?'−':'+'} ${2*Math.abs(p)}x + ${p*p}.<br>2) ${e} = (x² ${p>0?'−':'+'} ${2*Math.abs(p)}x + ${p*p}) − ${p*p} ${c<0?'−':'+'} ${Math.abs(c)} = ${sb} ${m<0?'−':'+'} ${Math.abs(m)}.<br>3) ${sb} ≥ 0, и равно 0 при x = ${N(p)}. Значит, наименьшее значение — <b>${N(m)}</b>.<div class="box err"><b>Ловушка</b>Ответ ${N(c)} неверен: добавив ${p*p}, надо столько же и вычесть.</div>`,
explain2:`Проверь подстановкой: при x = ${N(p)}: ${N(p)}² ${p>0?'−':'+'} ${2*Math.abs(p)} · ${Math.abs(p)} ${c<0?'−':'+'} ${Math.abs(c)} = ${p*p} − ${2*p*p} ${c<0?'−':'+'} ${Math.abs(c)} = ${N(m)}. А при x = ${N(p+1)} получится ${N((p+1)**2-2*p*(p+1)+c)}, при x = ${N(p-1)} — ${N((p-1)**2-2*p*(p-1)+c)}: больше. Меньше ${N(m)} не бывает, потому что ${sb} не бывает отрицательным.`};});
G(7,()=>{const {p,c,m}=minPar();const e=P([[1,'x²'],[-2*p,'x'],[c,'']]);const sb=`(x ${p>0?'−':'+'} ${Math.abs(p)})²`;
return {type:'num',q:`При каком значении x выражение ${M(e)} принимает наименьшее значение?`,ans:p,
hint:'Выдели полный квадрат. Когда квадрат равен нулю?',
short:`${e} = ${sb} ${m<0?'−':'+'} ${Math.abs(m)}; квадрат = 0 при x = ${N(p)}.`,
explain:`Выделяем полный квадрат: ${e} = ${sb} ${m<0?'−':'+'} ${Math.abs(m)}.<br>Наименьшее значение будет, когда ${sb} = 0, то есть x ${p>0?'−':'+'} ${Math.abs(p)} = 0 → <b>x = ${N(p)}</b>.<div class="box err"><b>Ловушка</b>Знак! В скобке «${p>0?'−':'+'} ${Math.abs(p)}», а ответ x = ${N(p)}. Чтобы скобка обнулилась, x должен быть «противоположным» числу в скобке.</div>`,
explain2:`Быстрый способ: для x² + bx + c наименьшее значение при x = −b : 2. Здесь b = ${N(-2*p)}, значит x = ${N(2*p)} : 2 = ${N(p)}. Это середина между точками, где выражение принимает одинаковые значения: например, при x = 0 и x = ${N(2*p)} оно равно ${N(c)}.`};});
G(7,()=>{const {p,c,m}=minPar();const e=P([[1,'x²'],[-2*p,'x'],[c,'']]);const s=p>0?'−':'+',a=Math.abs(p);
const tail=k=>k===0?'':` ${k<0?'−':'+'} ${Math.abs(k)}`;
const cr=`(x ${s} ${a})²${tail(m)}`;
const o=mk(cr,[`(x ${s} ${a})²${tail(c)}`,`(x ${s} ${2*a})²${tail(c-4*p*p)}`,`(x ${s} ${a})²${tail(c+p*p)}`]);
return {type:'choice',q:`Выдели полный квадрат: ${M(e)}.`,opts:o.opts.map(M),ans:o.ans,
short:`(x ${s} ${a})² = x² ${s} ${2*a}x + ${p*p}, поэтому ${e} = ${cr}.`,
explain:`(x ${s} ${a})² = x² ${s} ${2*a}x + ${p*p}. В нашем выражении вместо ${p*p} стоит ${N(c)}, значит:<br>${e} = (x² ${s} ${2*a}x + ${p*p}) ${c-p*p<0?'−':'+'} ${Math.abs(c-p*p)} = <b>${cr}</b>.<br>• «${`(x ${s} ${a})²${tail(c)}`}» — забыли вычесть ${p*p}.<br>• «${`(x ${s} ${a})²${tail(c+p*p)}`}» — вместо вычитания ${p*p} прибавили.<br>• «(x ${s} ${2*a})²» — в скобке половина коэффициента, а не он сам.`,
explain2:`Проверь раскрытием: ${cr} = x² ${s} ${2*a}x + ${p*p}${tail(m)} = ${e} ✅. Если раскрыть неправильный вариант, свободный член не совпадёт.`};});

/* L8 — комбинированные */
G(8,()=>{let a,x;do{a=R(1,5);x=R(-6,9);}while(x===0);const Nn=4*a*x;
return {type:'num',q:`Реши уравнение: ${M(`(x + ${a})² − (x − ${a})² = ${N(Nn)}`)}.`,ans:x,
hint:'Раскрой обе скобки. x² сократится.',
short:`(x + ${a})² − (x − ${a})² = ${4*a}x = ${N(Nn)} → x = ${N(x)}.`,
explain:`(x + ${a})² = x² + ${2*a}x + ${a*a};<br>(x − ${a})² = x² − ${2*a}x + ${a*a};<br>Разность: x² + ${2*a}x + ${a*a} − x² + ${2*a}x − ${a*a} = ${4*a}x (минус перед второй скобкой поменял все её знаки).<br>${4*a}x = ${N(Nn)} → x = ${N(Nn)} : ${4*a} = <b>${N(x)}</b>.`,
explain2:`Короткий путь — разность квадратов: A² − B² = (A − B)(A + B), где A = x + ${a}, B = x − ${a}.<br>A − B = ${2*a}, A + B = 2x. Произведение ${2*a} · 2x = ${4*a}x. Дальше так же: x = ${N(x)}. Проверь: (${N(x)} + ${a})² − (${N(x)} − ${a})² = ${(x+a)**2} − ${(x-a)**2} = ${N(Nn)} ✅.`};});
G(8,()=>{let a,x;do{a=R(1,6);x=R(-5,9);}while(x===0);const Nn=2*a*x+a*a;
return {type:'num',q:`Реши уравнение: ${M(`(x + ${a})² − x² = ${N(Nn)}`)}.`,ans:x,
short:`${2*a}x + ${a*a} = ${N(Nn)} → x = ${N(x)}.`,
explain:`(x + ${a})² − x² = x² + ${2*a}x + ${a*a} − x² = ${2*a}x + ${a*a}.<br>${2*a}x + ${a*a} = ${N(Nn)} → ${2*a}x = ${N(Nn-a*a)} → x = <b>${N(x)}</b>.<div class="box err"><b>Ловушка</b>Если написать (x + ${a})² = x² + ${a*a}, получится ${a*a} = ${N(Nn)} — бессмыслица. Удвоенное произведение ${2*a}x и есть то, ради чего решается уравнение.</div>`,
explain2:`Через разность квадратов: (x + ${a})² − x² = (x + ${a} − x)(x + ${a} + x) = ${a}(2x + ${a}). Значит, ${a}(2x + ${a}) = ${N(Nn)}, 2x + ${a} = ${N(Nn/a)}, x = ${N(x)}. Проверь: (${N(x+a)})² − (${N(x)})² = ${(x+a)**2} − ${x*x} = ${N(Nn)} ✅.`};});
G(8,()=>{const n=R(2,7),v=pick(VARS);
const c=P([[2*n,v],[-2*n*n,'']]);
const o=mk(c,[P([[-2*n,v]]),'0',P([[2*n,v],[2*n*n,'']])]);
return {type:'choice',q:`Упрости: ${M(`(${v} + ${n})(${v} − ${n}) − (${v} − ${n})²`)}.`,opts:o.opts.map(M),ans:o.ans,
short:`${v}² − ${n*n} − ${v}² + ${2*n}${v} − ${n*n} = ${c}.`,
explain:`1) (${v} + ${n})(${v} − ${n}) = ${v}² − ${n*n}.<br>2) (${v} − ${n})² = ${v}² − ${2*n}${v} + ${n*n}.<br>3) Вычитаем, раскрывая скобку с минусом (все знаки меняются!):<br>${v}² − ${n*n} − ${v}² + ${2*n}${v} − ${n*n} = <b>${c}</b>.<br>• «${P([[-2*n,v]])}» — забыли поменять знаки внутри второй скобки.<br>• «0» — решили, что (${v} − ${n})² = ${v}² − ${n*n}.`,
explain2:`Проверка подстановкой ${v} = ${n+1}: (${2*n+1}) · 1 − 1² = ${2*n}. А ${c} при ${v} = ${n+1}: ${2*n*(n+1)} − ${2*n*n} = ${2*n} ✅.`};});
G(8,()=>{const minus=Math.random()<0.4;let a,b;if(minus){a=R(40,99);b=a-pick([10,20,30,40,50]);}else{const s=pick([30,40,50,60,70,80,100]);a=R(Math.ceil(s/2)+1,s-3);b=s-a;}
const ans=minus?(a-b)**2:(a+b)**2;
return {type:'num',q:`Вычисли удобным способом: ${M(`${a}² ${minus?'−':'+'} 2 · ${a} · ${b} + ${b}²`)}.`,ans,
hint:`Это ${minus?'квадрат разности':'квадрат суммы'}, записанный «справа налево».`,
short:`(${a} ${minus?'−':'+'} ${b})² = ${minus?a-b:a+b}² = ${ans}.`,
explain:`Выражение имеет вид a² ${minus?'−':'+'} 2ab + b² = (a ${minus?'−':'+'} b)², где a = ${a}, b = ${b}.<br>(${a} ${minus?'−':'+'} ${b})² = ${minus?a-b:a+b}² = <b>${ans}</b>.`,
explain2:`«В лоб»: ${a}² = ${a*a}, 2 · ${a} · ${b} = ${2*a*b}, ${b}² = ${b*b}; ${a*a} ${minus?'−':'+'} ${2*a*b} + ${b*b} = ${ans}. Тот же ответ, но три больших умножения вместо одного маленького.`};});

/* L9 — ★ */
G(9,()=>{const v=pick([[2,3],[2,4],[3,3]]);const [b,k]=v;
let prod=1;const fs=[];for(let i=0;i<k;i++){const e=2**i;prod*=b**e+1;fs.push(`(${b}${e>1?sup(e):''} + 1)`);}
const E=2**k;const formula=(b**E-1)/(b-1);if(formula!==prod)return null;
return {type:'num',q:`Вычисли: ${M(fs.join(''))}.`,ans:prod,
hint:`Домножь на (${b} − 1)${b-1===1?' = 1':` и потом раздели на ${b-1}`}. Дальше — цепочка разностей квадратов.`,
short:`(${b} − 1) · … = ${b}${sup(E)} − 1, значит ответ ${b===2?`2${sup(E)} − 1`:`(${b}${sup(E)} − 1) : ${b-1}`} = ${prod}.`,
explain:`Хитрость: умножим выражение на (${b} − 1)${b===2?' = 1 (значение не изменится)':` = ${b-1}, а в конце разделим на ${b-1}`}.<br>${range(0,k-1).map(i=>{const e=2**i;return `(${b}${e>1?sup(e):''} − 1)(${b}${e>1?sup(e):''} + 1) = ${b}${sup(2*e)} − 1`;}).join('<br>')}<br>Каждый раз срабатывает разность квадратов, и в конце получается ${b}${sup(E)} − 1 = ${b**E-1}.<br>${b===2?`Ответ: <b>${prod}</b>.`:`Делим на ${b-1}: ${b**E-1} : ${b-1} = <b>${prod}</b>.`}`,
explain2:`Проверка прямым умножением: ${fs.map((f,i)=>b**(2**i)+1).join(' · ')} = ${prod} ✅.<br>Аналогия — «домино»: первая разность (${b} − 1) «сталкивает» первую скобку, получается новая разность, которая сталкивает следующую скобку, и так до конца.`};},true);
G(9,()=>{const E=pick([8,16]);const X=2**E-1;
const divs=E===16?[3,5,15,17,51,85,255,257]:[3,5,15,17,51,85];const non=[7,11,13,19,9];
const ds=sample(divs,3),nd=pick(non);
const opts=shuffle([...ds,nd].map(String));
return {type:'choice',q:`Какое из чисел <b>не является</b> делителем числа ${M(`2${sup(E)} − 1`)}?`,opts,ans:opts.indexOf(String(nd)),
hint:'Разложи 2^'+E+' − 1 по формуле разности квадратов, и ещё раз, и ещё раз.',
short:`2${sup(E)} − 1 = ${E===16?'3 · 5 · 17 · 257':'3 · 5 · 17'}; на ${nd} не делится.`,
explain:`Раскладываем разностью квадратов несколько раз:<br>${E===16?`2${sup(16)} − 1 = (2⁸ − 1)(2⁸ + 1) = (2⁴ − 1)(2⁴ + 1)(2⁸ + 1) = 15 · 17 · 257 = 3 · 5 · 17 · 257.`:`2⁸ − 1 = (2⁴ − 1)(2⁴ + 1) = 15 · 17 = 3 · 5 · 17.`}<br>Делители — это 1, простые множители и их произведения: ${ds.sort((x,y)=>x-y).map(d=>`${d} ✅`).join(', ')}.<br>Числа <b>${nd}</b> среди множителей нет (${nd===9?'9 = 3 · 3, а тройка в разложении только одна':`${nd} — простое число, которого нет в разложении`}). Ответ: <b>${nd}</b>.`,
explain2:`Проверка делением: 2${sup(E)} − 1 = ${X}. ${ds.map(d=>`${X} : ${d} = ${X/d}`).join('; ')} — делится нацело. А ${X} : ${nd} = ${Math.floor(X/nd)} (остаток ${X%nd}).`};},true);
G(9,()=>{let p,q,c,m;do{p=pick([-4,-3,-2,-1,1,2,3,4]);q=pick([-4,-3,-2,-1,1,2,3,4]);c=R(5,40);m=c-p*p-q*q;}while(m<-5||m>15);
const e=P([[1,'x²'],[1,'y²'],[-2*p,'x'],[-2*q,'y'],[c,'']]);
const bx=`(x ${p>0?'−':'+'} ${Math.abs(p)})²`,by=`(y ${q>0?'−':'+'} ${Math.abs(q)})²`;
return {type:'num',q:`Найди наименьшее значение выражения ${M(e)}.`,ans:m,
hint:'Собери отдельно полный квадрат с x и полный квадрат с y.',
short:`${e} = ${bx} + ${by} ${m<0?'−':'+'} ${Math.abs(m)}; минимум ${N(m)}.`,
explain:`Группируем: (x² ${p>0?'−':'+'} ${2*Math.abs(p)}x) + (y² ${q>0?'−':'+'} ${2*Math.abs(q)}y) + ${c}.<br>x² ${p>0?'−':'+'} ${2*Math.abs(p)}x = ${bx} − ${p*p};<br>y² ${q>0?'−':'+'} ${2*Math.abs(q)}y = ${by} − ${q*q}.<br>Итого: ${bx} + ${by} + ${c} − ${p*p} − ${q*q} = ${bx} + ${by} ${m<0?'−':'+'} ${Math.abs(m)}.<br>Оба квадрата ≥ 0 и одновременно равны 0 при x = ${N(p)}, y = ${N(q)}. Наименьшее значение: <b>${N(m)}</b>.`,
explain2:`Подставь x = ${N(p)}, y = ${N(q)}: ${p*p} + ${q*q} ${-2*p*p<0?'−':'+'} ${2*p*p} ${-2*q*q<0?'−':'+'} ${2*q*q} + ${c} = ${N(m)}. Если сдвинуть x или y хоть на 1, один из квадратов станет положительным и значение вырастет. Это как две ямки: самое низкое место — когда стоишь на дне обеих.`};},true);
G(9,()=>{let s,p;do{s=R(3,9);p=R(1,12);}while(s*s<4*p);
return {type:'num',q:`Известно, что ${M(`a + b = ${s}`)} и ${M(`ab = ${p}`)}. Найди ${M('a² + b²')}.`,ans:s*s-2*p,
hint:'(a + b)² = a² + 2ab + b². Что из этого известно?',
short:`a² + b² = (a + b)² − 2ab = ${s*s} − ${2*p} = ${s*s-2*p}.`,
explain:`Из формулы (a + b)² = a² + 2ab + b² выразим a² + b²:<br>a² + b² = (a + b)² − 2ab = ${s}² − 2 · ${p} = ${s*s} − ${2*p} = <b>${s*s-2*p}</b>.<br>Находить сами a и b не нужно!<div class="box err"><b>Ловушка</b>Ответ ${s*s} = ${s}² — забыли вычесть 2ab.</div>`,
explain2:`Посмотри на картинку «квадрат суммы»: весь квадрат со стороной a + b = ${s} имеет площадь ${s*s}. Он состоит из a², b² и двух прямоугольников ab = ${p}. Убираем прямоугольники: ${s*s} − ${p} − ${p} = ${s*s-2*p} — это и есть a² + b².`};},true);
G(9,()=>{let s,p;do{s=R(2,7);p=R(1,10);}while(s*s<4*p);const ans=s**3-3*p*s;

short:`a³ + b³ = (a + b)³ − 3ab(a + b) = ${s**3} − ${3*p*s} = ${N(ans)}.`,
explain:`Куб суммы: (a + b)³ = a³ + 3a²b + 3ab² + b³ = a³ + b³ + 3ab(a + b).<br>Отсюда a³ + b³ = (a + b)³ − 3ab(a + b) = ${s}³ − 3 · ${p} · ${s} = ${s**3} − ${3*p*s} = <b>${N(ans)}</b>.`,
explain2:`Другой путь — формула суммы кубов: a³ + b³ = (a + b)(a² − ab + b²).<br>a² + b² = (a + b)² − 2ab = ${s*s} − ${2*p} = ${s*s-2*p}; значит a² − ab + b² = ${s*s-2*p} − ${p} = ${s*s-3*p}.<br>a³ + b³ = ${s} · ${s*s-3*p} = ${N(ans)} ✅.`};},true);
G(9,()=>{const n=R(2,12);const val=n*(n+1)*(n+2)*(n+3)+1,ans=n*n+3*n+1;if(ans*ans!==val)return null;

hint:`Перемножь крайние множители и средние отдельно: ${n}·${n+3} и ${n+1}·${n+2}.`,
short:`${n}·${n+3} = ${n*(n+3)}, ${n+1}·${n+2} = ${(n+1)*(n+2)}; ${n*(n+3)} · ${(n+1)*(n+2)} + 1 = ${ans}².`,
explain:`Группируем: (${n} · ${n+3}) · (${n+1} · ${n+2}) + 1 = ${n*(n+3)} · ${(n+1)*(n+2)} + 1.<br>Эти два числа отличаются на 2, а посередине между ними — ${ans}. Значит, это (${ans} − 1)(${ans} + 1) + 1 = ${ans}² − 1 + 1 = ${ans}².<br>Ответ: <b>${ans}</b>.<br>В общем виде: n(n + 1)(n + 2)(n + 3) + 1 = (n² + 3n + 1)². При n = ${n}: ${n*n} + ${3*n} + 1 = ${ans}.`,
explain2:`Проверка: ${n} · ${n+1} · ${n+2} · ${n+3} = ${val-1}, плюс 1 = ${val}. И ${ans}² = ${ans*ans} ✅. Попробуй на маленьком: 1 · 2 · 3 · 4 + 1 = 25 = 5², 2 · 3 · 4 · 5 + 1 = 121 = 11². Всегда квадрат!`};},true);
