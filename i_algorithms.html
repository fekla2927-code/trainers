<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>9. Алгоритмы — тренажёр</title>
<style>:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2328;--muted:#5d6470;--line:#e2ded5;

  --warn:#8a5a00;--warn-soft:#fff3d6;--hl:#f2a623;--fig:#33415c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
    --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
    --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
    --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c;--card:#1e2128;--ink:#e9eaee;--muted:#a3a9b5;--line:#30343d;
  --accent:#8c9eff;--accent-soft:#252b48;--accent-ink:#c5cdff;
  --ok:#6fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#ffcc66;--warn-soft:#3a3018;--hl:#f2a623;--fig:#c9d1e4;--shadow:none;color-scheme:dark;

html{-webkit-text-size-adjust:100%}

<body><noscript>Для работы тренажёра нужен JavaScript.</noscript>
<script>/* Уведомления маме через ntfy.sh: тема-«канал» известна только семье.
   Если интернета нет — сообщение ждёт в очереди и уйдёт при следующем открытии. */
(function(){
const TOPIC='artem-pavel-6cda620c53';
const URL_='https://ntfy.sh/';
const OUT='trainer:outbox';
const rd=()=>{try{return JSON.parse(localStorage.getItem(OUT)||'[]');}catch(e){return [];}};
const wr=a=>{try{localStorage.setItem(OUT,JSON.stringify(a.slice(-50)));}catch(e){}};
async function post(m){
  const r=await fetch(URL_,{method:'POST',body:JSON.stringify({topic:TOPIC,title:m.title,message:m.message,tags:m.tags||[],priority:m.priority||3})});
  if(!r.ok)throw new Error('ntfy '+r.status);
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{let q=rd();while(q.length){try{await post(q[0]);q.shift();wr(q);}catch(e){break;}}}
  finally{flushing=false;}
}
const N=window.NOTIFY={TOPIC,
  send(title,message,tags){const q=rd();q.push({title,message,tags,ts:Date.now()});wr(q);flush();},
  flush};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(flush,1500));else setTimeout(flush,1500);
window.addEventListener('online',flush);
})();

/* Who is studying: separate progress for each child on the same device */
(function(){
const LIST=['Артём','Павел'];
try{const w=new URLSearchParams(location.search).get('who');if(w&&LIST.includes(w))localStorage.setItem('trainer:profile',w);}catch(e){}
const G=()=>{try{return localStorage.getItem('trainer:profile')||'';}catch(e){return '';}};
const P=window.PROF={
  list:LIST,
  get:G,
  name(){return G()||LIST[0];},
  set(n){try{localStorage.setItem('trainer:profile',n);}catch(e){}},
  /* Артём keeps the original keys (his progress is already saved), others get a suffix */
  key(base){const p=P.name();return p===LIST[0]?base:base+'@'+p;},
  /* results of finished runs, kept per child: {id:{pct,total,right,star,date,best}} */
  done(){try{return JSON.parse(localStorage.getItem(P.key('trainer:done'))||'{}');}catch(e){return {};}},
  record(id,d,label){try{if(window.NOTIFY&&label){const pc=d.pct!=null?d.pct:0;NOTIFY.send(`${P.name()}: ${label}`,`Результат: ${pc}% с первого раза${d.total?` (${d.right} из ${d.total})`:''}${d.star!=null&&!/★/.test(label)?`. Олимпиадный уровень ★: ${d.star}%`:''}. ${pc>=80?'Отлично!':pc>=60?'Неплохо.':'Стоит повторить.'}`,[pc>=80?'white_check_mark':'books']);}}catch(e){}
  try{const all=P.done();const prev=all[id];const now={...d,date:new Date().toISOString().slice(0,10)};
    if(!prev||(d.pct||0)>=(prev.pct||0)||(d.star!=null&&(prev.star==null||d.star>prev.star)))all[id]={...prev,...now,best:Math.max(d.pct||0,prev&&prev.best||0)};
    localStorage.setItem(P.key('trainer:done'),JSON.stringify(all));}catch(e){}},
  mount(header,main){
    if(!header)return;
    const wrap=document.createElement('div');wrap.className='prof';
    wrap.innerHTML=`<label class="prof-l">👤 <select aria-label="Кто занимается">${LIST.map(n=>`<option${n===P.name()?' selected':''}>${n}</option>`).join('')}</select></label>`;
    const before=header.querySelector('.theme-btn');header.insertBefore(wrap,before||null);
    wrap.querySelector('select').onchange=e=>{P.set(e.target.value);location.reload();};
    if(!G()&&main){
      const c=document.createElement('div');c.className='card prof-ask';
      c.innerHTML=`<h2>Кто сейчас занимается?</h2><p class="small">У каждого свой прогресс. Выбрать можно и потом — вверху страницы.</p><div class="row">${LIST.map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`;
      main.prepend(c);
      c.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.set(b.dataset.n);location.reload();});
    }
  }
};
})();

(function(){
"use strict";
/* ---------- helpers available to topic modules as window.H ---------- */
const H = window.H = {
  R:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>H.shuffle(a).slice(0,k),
  range:(a,b,st)=>{st=st||1;const r=[];for(let i=a;i<=b;i+=st)r.push(i);return r;},
  gcd:(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;},
  lcm:(a,b)=>Math.abs(a*b)/H.gcd(a,b),
  plural:(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;},
  num:x=>{if(typeof x!=='number')return String(x);let r=Math.round(x*1e9)/1e9;let s=String(r).replace('.',',');return s.replace(/^-/,'−');},
  fmtSet:(arr)=>{if(!arr||!arr.length)return '∅';let a=arr.slice();if(a.every(v=>typeof v==='number'))a.sort((x,y)=>x-y);return '{'+a.map(v=>typeof v==='number'?H.num(v):v).join(', ')+'}';},
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt">√<span>${x}</span></span>`,
  m:s=>`<span class="m">${s}</span>`,
  parseNum:(s)=>{
    if(s==null)return NaN;
    {const mm=String(s).trim().replace(/[−–—]/g,'-').match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mm){const d=+mm[4];if(!d)return NaN;const v=+mm[2]+(+mm[3])/d;return mm[1]?-v:v;}}
    s=String(s).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
    if(!s)return NaN;
    let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d;}
    if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return Number(s);
    return NaN;
  },
  normTok:(t)=>String(t).toLowerCase().replace(/ё/g,'е').replace(/[«»"'.]/g,'').trim(),
  normExpr:(s)=>String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[·*×]/g,'').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3')
};
H.parseList=function(raw){
  let s=String(raw).trim();
  if(/^(∅|пусто|пустое|пустоемножество|\{\s*\})$/i.test(s.replace(/\s+/g,'')))return [];
  s=s.replace(/[{}]/g,' ');
  return s.split(/[;,\s]+/).map(t=>t.trim()).filter(Boolean).filter(t=>t!=='∅');
};
H.sameSet=function(userArr,ansArr){
  const key=v=>{const n=H.parseNum(v);return isNaN(n)?'s:'+H.normTok(v):'n:'+(Math.round(n*1e9)/1e9);};
  const a=new Set(userArr.map(key)),b=new Set(ansArr.map(key));
  if(a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;
};

H.toFrac=function(x){if(!isFinite(x)||Number.isInteger(x))return null;const r=Math.round(x*1e6)/1e6;if(Math.abs(r-x)<1e-12&&String(r).split('.')[1].length<=4)return null;
  let best=null;for(let d=2;d<=10000;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){best=[n,d];break;}}if(!best)return null;const g=H.gcd(best[0],best[1]);return [best[0]/g,best[1]/g];};
H.normChem=function(x){const sub='₀₁₂₃₄₅₆₇₈₉',sup='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(x).replace(/[₀-₉]/g,c=>sub.indexOf(c)).replace(/[⁰-⁹]/g,c=>sup.indexOf(c)).replace(/[⁺]/g,'+').replace(/[⁻−–]/g,'-').replace(/\s+/g,'').replace(/→|->|=>|=/g,'=');};
H.sub=s=>String(s).replace(/(\d+)/g,'<sub>$1</sub>');
H.chem=f=>`<span class="chem">${String(f).replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>')}</span>`;
H.near=(x,y,tol)=>Math.abs(x-y)<=(tol==null?1e-9:Math.max(1e-9,Math.abs(tol<1?tol*y:tol)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- trainer ---------- */
function freshStats(){const per={};T.levels.forEach((_,i)=>per[i]={r:0,w:0,fixed:0});return per;}
function renderStart(){
  const v=$('#v-train');const saved=store.get();
  const counts=T.levels.map((_,i)=>T.gens.filter(g=>g.lvl===i).length);
  let h=`<div class="card"><h1>Тренажёр</h1>
  <p>${T.gens.length} ${H.plural(T.gens.length,'задача','задачи','задач')}: сначала совсем простые, в конце — сложные, олимпиадного уровня (★).</p>
  <div class="box rule"><b>Как это работает</b>Решаешь задачу. Если ошибся — я подробно объясню, почему так. Прочитай и напиши слово <b>«понял»</b>. Если непонятно — нажми <b>«Не понял»</b>, и я объясню по-другому. Потом дам похожую задачу, чтобы закрепить.</div>
  <div class="row" style="margin-top:12px">

  </div>
  ${T.gens.some(g=>g.rule)?`<div class="box tip" style="margin-top:14px"><b>🧠 Помнишь правила?</b>Быстрая проверка: только вопросы на сами правила и формулы, без задач. Полезно перед контрольной и через несколько дней после изучения.<div class="row" style="margin-top:8px"><button class="btn ghost" id="rulesOnly">Проверить правила (${T.gens.filter(g=>g.rule).length})</button></div></div>`:''}
  </div>
  <div class="card"><h2>Или начни с нужного уровня</h2><div class="levels">
  ${T.levels.map((l,i)=>`<button data-l="${i}">${i+1}. ${l}<span>${counts[i]} ${H.plural(counts[i],'задача','задачи','задач')}</span></button>`).join('')}
  </div></div>`;
  v.innerHTML=h;
  if($('#cont'))$('#cont').onclick=()=>{S=saved;S.cur=null;next();};
  $('#restart').onclick=()=>startQueue(T.gens.map((_,i)=>i));
  if($('#rulesOnly'))$('#rulesOnly').onclick=()=>startQueue(T.gens.map((g,i)=>g.rule?i:-1).filter(i=>i>=0));
  v.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{
    const l=+b.dataset.l;startQueue(T.gens.map((g,i)=>g.lvl>=l?i:-1).filter(i=>i>=0));
  });
}
function startQueue(q){S={queue:q,pos:0,right:0,wrong:0,per:freshStats(),cur:null};store.set(S);next();}
function save(){const c=S.cur;S.cur=null;store.set(S);S.cur=c;}
function next(){
  if(S.pos>=S.queue.length){finish();return;}
  const gi=S.queue[S.pos];
  S.cur={gi,task:makeTask(gi),re:0,stage:'answer',alt:0};
  renderTask();
}
function makeTask(gi){
  for(let k=0;k<20;k++){try{const t=T.gens[gi].make();if(t)return t;}catch(e){console.error('gen',gi,e);}}
  return {type:'choice',q:'Ошибка в задаче',opts:['Дальше'],ans:0,short:'',explain:'',explain2:''};
}
function reinforce(){
  S.cur={gi:S.cur.gi,task:makeTask(S.cur.gi),re:S.cur.re+1,stage:'answer',alt:0};
  renderTask();
}
function ansText(t){
  if(t.ansText)return t.ansText;
  switch(t.type){
    case 'choice':return t.opts[t.ans];
    case 'multi':return t.ans.map(i=>t.opts[i]).join('; ');
    case 'num':{const f=H.toFrac(t.ans);return f?`${f[0]<0?'−':''}${H.frac(Math.abs(f[0]),f[1])} (≈ ${H.num(Math.round(t.ans*1000)/1000)})`:H.num(t.ans);}
    case 'set':return H.fmtSet(t.ans);
    case 'code':return `<div class="small">Вот одно из правильных решений:</div><pre class="code sol">${esc(t.solution||'')}</pre>`;
    default:return Array.isArray(t.ans)?t.ans[0]:String(t.ans);
  }
}
function renderTask(){
  const v=$('#v-train');const c=S.cur,t=c.task,g=T.gens[c.gi];
  const total=S.queue.length;
  const pct=Math.round(S.pos/total*100);
  let body='';
  const keyL=['А','Б','В','Г','Д','Е','Ж'];
  if(t.type==='choice'||t.type==='multi'){
    body=`<div class="opts ${t.pics?'pics':''}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${t.type==='multi'?'☐':keyL[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    if(t.type==='multi')body+=`<p class="small" style="margin-top:8px">Можно выбрать несколько вариантов. Потом нажми «Проверить».</p><div class="row"><button class="btn" id="check">Проверить</button></div><div class="errmsg" id="err"></div>`;
  }else if(t.type==='code'){
    body=`<div id="pyhost"></div><div class="row" style="margin-top:8px"><button class="btn" id="check">✓ Проверить на тестах</button></div><div class="errmsg" id="err"></div><div id="pyrep"></div>`;
  }else{
    const keys=t.keys||(t.type==='set'?['∅']:t.type==='num'?['−','/',',']:[]);
    body=`<div class="inp"><input id="ans" autocomplete="off" inputmode="${t.type==='num'&&!t.keys?'text':'text'}" placeholder="${esc(t.ph||(t.type==='set'?'например: 1, 2, 3 (или ∅)':t.type==='num'?'впиши число':'впиши ответ'))}"><button class="btn" id="check">Проверить</button></div>
    ${keys.length?`<div class="keys">${keys.map(k=>`<button data-k="${esc(k)}">${k}</button>`).join('')}</div>`:''}
    <div class="errmsg" id="err"></div>`;
  }
  v.innerHTML=`<div class="card">
    <div class="meta"><span>Задача ${S.pos+1} из ${total}</span><span>${S.streak>=3?`🔥 Серия: ${S.streak} · `:''}Верно с первого раза: ${S.right} · Ошибок: ${S.wrong}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div style="margin-top:12px">${c.re?`<span class="lvl-tag re">Закрепление ${c.re} · похожая задача</span> `:''}<span class="lvl-tag">Уровень ${g.lvl+1}: ${T.levels[g.lvl]}${g.star?' ★':''}</span></div>
    <div class="q">${t.q}</div>
    ${t.pic?`<div class="fig">${t.pic}</div>`:''}
    ${body}
    ${t.hint?`<div class="hint"><button class="btn ghost" id="hintBtn">💡 Подсказка</button><div class="box tip" id="hintBox" style="display:none">${t.hint}</div></div>`:''}
    <div id="fb"></div>
  </div>
  <div class="row"><button class="btn ghost" id="toStart">← К выбору уровня</button><button class="btn ghost" id="toTheory">📖 Теория по этой задаче</button></div>`;
  fillFigs(v);
  if(t.onShow){try{t.onShow(v);}catch(e){console.error(e);}}
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintBox').style.display='block';$('#hintBtn').style.display='none';};
  $('#toStart').onclick=()=>{save();renderStart();};
  $('#toTheory').onclick=()=>openTheory(g.lvl);
  if(t.type==='code'){
    if(!window.PY){$('#pyhost').innerHTML='<div class="box err">Для этой задачи нужен модуль Python.</div>';}
    else{
      const ed=PY.editor($('#pyhost'),{code:c.code!=null?c.code:(t.starter||''),input:t.tests&&t.tests[0]?t.tests[0].in:'' ,forceInput:t.tests&&t.tests.some(x=>x.in)});
      ed.ta.addEventListener('input',()=>{c.code=ed.code;});
      PY.warm();
      $('#check').onclick=async()=>{
        const b=$('#check');b.disabled=true;b.textContent=PY.booted?'Проверяю…':'Загружаю Python и проверяю…';
        const r=await PY.check(ed.code,t.tests||[]);
        b.textContent='✓ Проверить на тестах';
        if(r.boot){b.disabled=false;$('#pyrep').innerHTML=r.report;return;}
        t._report=r.report;submit({passed:r.passed});
      };
    }
  }else if(t.type==='choice'){
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submit(+b.dataset.i));
  }else if(t.type==='multi'){
    const sel=new Set();
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.querySelector('.k').textContent='☐';}else{sel.add(i);b.classList.add('sel');b.querySelector('.k').textContent='☑';}$('#err').textContent='';});
    $('#check').onclick=()=>{if(!sel.size){$('#err').textContent='Выбери хотя бы один вариант.';return;}submit([...sel].sort((a,b)=>a-b));};
  }else{
    const inp=$('#ans');
    inp.addEventListener('input',()=>$('#err').textContent='');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
    v.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length);});
    $('#check').onclick=()=>{
      const raw=inp.value;
      if(!raw.trim()){$('#err').textContent=t.type==='set'?'Впиши ответ. Если элементов нет — нажми ∅.':'Сначала впиши ответ.';return;}
      if(t.type==='num'&&!t.check&&isNaN(H.parseNum(raw))){$('#err').textContent='Впиши число, например 12, −3, 2,5 или 3/4.';return;}
      submit(raw);
    };
    setTimeout(()=>inp.focus({preventScroll:true}),30);
  }
  window.scrollTo({top:0});
}
function isRight(t,val){
  if(t.type==='code')return !!(val&&val.passed);
  if(t.check)return !!t.check(val);
  switch(t.type){
    case 'choice':return val===t.ans;
    case 'multi':{const a=t.ans.slice().sort((x,y)=>x-y);return a.length===val.length&&a.every((x,i)=>x===val[i]);}
    case 'num':{const v=H.parseNum(val);if(t.tol!=null)return Math.abs(v-t.ans)<=Math.abs(t.tol<1?t.tol*t.ans:t.tol)+1e-9;return Math.abs(v-t.ans)<1e-9;}
    case 'set':return H.sameSet(H.parseList(val),t.ans);
    case 'text':{const n=H.normExpr(val);return (Array.isArray(t.ans)?t.ans:[t.ans]).some(a=>H.normExpr(a)===n);}
  }
  return false;
}
function submit(val){
  const c=S.cur,t=c.task,g=T.gens[c.gi];
  if(c.stage!=='answer')return;
  c.stage='done';
  const ok=isRight(t,val);
  const v=$('#v-train');
  if(t.type==='choice'||t.type==='multi'){
    const right=t.type==='choice'?[t.ans]:t.ans;const chosen=t.type==='choice'?[val]:val;
    v.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(right.includes(i))b.classList.add('right');else if(chosen.includes(i))b.classList.add('wrong');});
    if($('#check'))$('#check').disabled=true;
  }else if(t.type==='code'){$('#check').disabled=true;v.querySelectorAll('#pyhost textarea').forEach(x=>x.readOnly=true);}
  else{$('#ans').disabled=true;$('#check').disabled=true;v.querySelectorAll('.keys button').forEach(b=>b.disabled=true);}
  if(!c.re){if(ok){S.right++;S.per[g.lvl].r++;}else{S.wrong++;S.per[g.lvl].w++;}}
  else if(ok){S.per[g.lvl].fixed++;}
  if(ok){S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak);}else S.streak=0;
  const fb=$('#fb');
  if(ok){
    const sk=S.streak;const streakMsg=sk===5?' 🔥 5 подряд!':sk===10?' 🔥🔥 10 подряд — ты в ударе!':sk>0&&sk%15===0?` 🏆 ${sk} подряд!`:'';
    fb.innerHTML=`<div class="fb ok"><h3>${c.re?'Закрепил! Молодец 💪':H.pick(['Верно! ✅','Правильно! 👍','Отлично! ✅','Точно! 🎯'])}${streakMsg}</h3>${t._report?t._report:''}${t.short?`<div>${t.short}</div>`:''}
    <div class="row" style="margin-top:12px"><button class="btn" id="nextBtn">Следующая задача →</button></div></div>`;
    fillFigs(fb);
    $('#nextBtn').onclick=()=>{S.pos++;save();next();};
    $('#nextBtn').focus({preventScroll:true});
  }else{
    fb.innerHTML=`<div class="fb bad"><h3>Неправильно — давай разберёмся</h3>
      ${t._report?t._report:''}<div class="ans">${t.type==='code'?'':'Правильный ответ: '}${ansText(t)}</div>
      <div><b>Почему так:</b></div><div>${t.explain||''}</div></div>
      <div id="alt"></div>
      <div class="understand card" style="margin-top:12px">
        <label for="und">Прочитай объяснение. Если всё ясно — напиши «понял»:</label>
        <div class="inp"><input id="und" autocomplete="off" placeholder="напиши: понял"><button class="btn" id="undOk">Понял ✓</button></div>
        <div class="errmsg" id="undErr"></div>
        <div class="row"><button class="btn warn" id="undNo">🤔 Не понял — объясни по-другому</button></div>
      </div>`;
    fillFigs(fb);
    const go=()=>{
      const w=$('#und').value.trim().toLowerCase();
      if(!/(^|\s)(понял|поняла|понятно|ясно|понял!)/.test(w)){$('#undErr').textContent='Напиши слово «понял», когда разберёшься. Если непонятно — нажми «Не понял».';return;}
      if(c.re<MAX_REINFORCE)reinforce();
      else{S.pos++;save();next();}
    };
    $('#undOk').onclick=go;
    $('#und').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    $('#und').addEventListener('input',()=>$('#undErr').textContent='');
    $('#undNo').onclick=()=>{
      c.alt++;
      const alt=$('#alt');
      if(c.alt===1){
        alt.innerHTML=`<div class="fb alt"><h3>Объясняю по-другому</h3>${t.explain2||t.explain}</div>`;
        $('#undNo').textContent='🤔 Всё равно не понял';
      }else if(c.alt===2){
        alt.innerHTML+=`<div class="fb alt"><h3>Ещё раз, совсем медленно</h3>${t.explain3||`<ol class="steps"><li>Прочитай ещё раз первое объяснение (красный блок) — по одной строчке.</li><li>Возьми листок и повтори каждый шаг сам, своей рукой.</li><li>Открой «Теорию по этой задаче» (кнопка внизу) и прочитай правило и пример.</li><li>Если всё ещё непонятно — покажи эту задачу маме или учителю: так быстрее всего.</li></ol>`}
        <div class="row"><button class="btn ghost" id="altTheory">📖 Открыть теорию</button></div></div>`;
        $('#altTheory').onclick=()=>openTheory(g.lvl);
        $('#undNo').style.display='none';
      }
      fillFigs(alt);
    };
    setTimeout(()=>$('#und').focus({preventScroll:true}),30);
  }
}
function openTheory(lvl){
  show('theory');
  let target=null;
  document.querySelectorAll('#v-theory .card[data-lvl]').forEach(el=>{if(!target&&el.dataset.lvl!==''&&el.dataset.lvl.split(',').map(Number).includes(lvl))target=el;});

}
function finish(){
  store.clear();
  try{if(window.PROF){
    const tot=S.right+S.wrong;

{title:'Что мы уже умеем',lvl:0,html:`
<p>В модуле «8. Функции» ты научился делать свои команды с <code>def</code> и <code>return</code>, а раньше — списки, циклы и условия. Это все кирпичики. Теперь научимся строить из них <b>умные</b> решения.</p>

<p>Почему 10 вопросов для 1000? После каждого вопроса остаётся половина: 1000 → 500 → 250 → 125 → 63 → 32 → 16 → 8 → 4 → 2 → 1. Нужно столько шагов, сколько раз можно делить 1000 пополам до 1. Так как 2¹⁰ = 1024 ≥ 1000, хватает 10.</p>

{title:'Сложность: считаем операции на пальцах',lvl:4,html:`
<p class="hook">Две программы решают одну задачу. Одна — за секунду, другая — за 30 лет. Код при этом может быть почти одинаковой длины! Всё решает, <b>сколько операций</b> делает алгоритм.</p>
<div class="box rule"><b>Правило</b>Сложность — как растёт число операций, когда растёт n (размер данных).<br>
• Один цикл до n — примерно <b>n</b> операций.<br>
• Цикл в цикле, оба до n — <b>n · n = n²</b>.<br>
• Деление пополам, пока не станет 1 — примерно <b>log₂ n</b> (сколько раз можно поделить на 2).</div>
${RUN(`n = 1000
k1 = 0
for i in range(n):
    k1 += 1
k2 = 0
for i in range(n):
    for j in range(n):
        k2 += 1
k3 = 0
m = n
while m > 1:
    m = m // 2
    k3 += 1
print(k1, k2, k3)`)}
<p>Поменяй n на 2000. Во сколько раз выросло каждое число?</p>
<div class="tbl"><table class="sym"><thead><tr><th>n</th><th>log₂ n</th><th>n</th><th>n²</th></tr></thead><tbody>
<tr><td>10</td><td>≈ 3</td><td>10</td><td>100</td></tr>
<tr><td>1000</td><td>≈ 10</td><td>1000</td><td>1 000 000</td></tr>
<tr><td>1 000 000</td><td>≈ 20</td><td>1 000 000</td><td>10¹²</td></tr></tbody></table></div>
<div class="box tip"><b>Правило олимпиадника</b>Python делает примерно 10 миллионов простых операций в секунду. Если n = 100 000, то n² = 10¹⁰ — это больше 15 минут. А на олимпиаде лимит обычно 1–2 секунды. Поэтому перед тем как писать код, прикинь число операций!</div>`},
{title:'Перебор: проверим все варианты',lvl:5,html:`
<p>Иногда проще всего — проверить <b>все</b> варианты. Компьютер не устаёт: тысячу вариантов он проверит за миг.</p>
<div class="box rule"><b>Все пары</b>Чтобы перебрать все пары разных элементов (без повторов), второй цикл начинают с <code>i + 1</code>:<br><code>for i in range(n):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;for j in range(i + 1, n):</code><br>Пар получается n(n − 1)/2.</div>
${RUN(`a = [3, 8, 1, 6]
for i in range(len(a)):
    for j in range(i + 1, len(a)):
        print(a[i], "+", a[j], "=", a[i] + a[j])`)}
<h3>Все трёхзначные числа</h3>
${RUN(`k = 0
for n in range(100, 1000):
    a = n // 100
    b = n // 10 % 10
    c = n % 10
    if a + b + c == 5:
        k += 1
print("Трёхзначных с суммой цифр 5:", k)`)}
<p>Поменяй 5 на 27 — такое число одно. Какое?</p>
<div class="box err"><b>Ошибка</b><code>for j in range(n)</code> вместо <code>range(i + 1, n)</code> — каждая пара посчитается дважды (a, b) и (b, a), да ещё и пары элемента с самим собой.</div>
<div class="fact">Перебором в 1976 году доказали знаменитую теорему о четырёх красках (любую карту можно раскрасить четырьмя цветами так, чтобы соседние страны были разного цвета): компьютер проверил почти 2000 особых случаев. Это было первое крупное доказательство с помощью компьютера.</div>`},
{title:'Решето Эратосфена',lvl:6,html:`
<p class="hook">Эратосфен — тот самый, который больше 2000 лет назад измерил размер Земли с помощью палки и тени. Он же придумал, как быстро найти <b>все</b> простые числа до n — «просеять» их через решето.</p>
<div class="box rule"><b>Правило</b>Выписываем числа от 2 до n. Берём первое невычеркнутое — 2 — оно простое; вычёркиваем все его кратные. Следующее невычеркнутое — 3 — простое; вычёркиваем кратные 3. И так далее. Вычёркивать кратные p можно начинать с <b>p · p</b>: меньшие кратные уже вычеркнуты раньше. Что осталось — простые.</div>
${RUN(`n = 50
is_p = [True] * (n + 1)
is_p[0] = False
is_p[1] = False
p = 2
while p * p <= n:
    if is_p[p]:
        for k in range(p * p, n + 1, p):
            is_p[k] = False
    p += 1
print([i for i in range(n + 1) if is_p[i]])`)}
<p><code>[True] * (n + 1)</code> — список из n + 1 значений True: «пока все считаем простыми». Поменяй n на 1000 и посчитай их через <code>len(…)</code> — должно быть 168.</p>
<div class="box tip"><b>Почему это быстро</b>Проверять каждое число делением — долго. Решето для n = 1 000 000 делает всего несколько миллионов простых шагов — меньше секунды.</div>`},
{title:'Олимпиадные идеи',lvl:7,html:`
<h3>Максимальная сумма подряд (алгоритм Кадане)</h3>
<p>Идём по списку и держим лучшую сумму отрезка, <b>заканчивающегося</b> здесь: <code>cur = max(x, cur + x)</code> — либо продолжаем отрезок, либо начинаем заново. Один проход вместо перебора всех отрезков!</p>
${RUN(`a = [2, -5, 3, 4, -1, 2, -6, 1]
cur = a[0]
best = a[0]
for x in a[1:]:
    cur = max(x, cur + x)
    best = max(best, cur)
print(best)`)}
<h3>Сначала оцени, потом пиши</h3>
<p>Если n ≤ 1000 — можно n² (миллион операций). Если n ≤ 100 000 — нужно что-то вроде n или n · log n. Если ответ ищется среди 10¹⁸ вариантов — только бинарный поиск или формула.</p>`},
{title:'Шпаргалка',html:`
<ul class="steps">
<li>Линейный поиск: до n сравнений, работает всегда.</li>
<li>Бинарный поиск: только в отсортированном, ≈ log₂ n шагов (1000 → 10, миллион → 20).</li>
<li>Пузырёк: меняем соседей; выбор: минимум на место i. Обе ≈ n²/2 сравнений.</li>
<li>Цикл в цикле — n²; деление пополам — log₂ n.</li>
<li>Все пары: <code>for j in range(i + 1, n)</code>, пар n(n − 1)/2.</li>
<li>Решето: вычёркиваем кратные p, начиная с p·p.</li></ul>`},
{title:'Что дальше',html:`
<p>Ты знаешь главные идеи алгоритмов: поиск, сортировку, перебор, оценку скорости. Это то, что отличает программиста от человека, который просто знает команды.</p>
<p>В модуле <b>«10. Задачи ОГЭ и олимпиад»</b> соберём всё вместе и порешаем задачи в том виде, как они бывают на экзамене и олимпиаде: с вводом, жёсткими тестами и ограничением по времени.</p>`}
];

function guessWidget(w){
  let secret=R(1,1000),tries=0,done=false;
  w.innerHTML=`<div class="small"><b>Угадай число от 1 до 1000.</b> Подсказка: начни с 500.</div>
  <div class="row"><input type="number" id="wg-in" min="1" max="1000" style="width:110px;font-size:17px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"><button class="btn sbtn" id="wg-go">Проверить</button><button class="btn ghost sbtn" id="wg-new">Новое число</button><button class="btn ghost sbtn" id="wg-pc">Пусть угадает компьютер</button></div>
  <div id="wg-out" class="small" style="margin-top:6px"></div>`;
  const inp=w.querySelector('#wg-in'),out=w.querySelector('#wg-out');
  w.querySelector('#wg-go').onclick=()=>{if(done)return;const g=parseInt(inp.value,10);if(!(g>=1&&g<=1000)){out.innerHTML='Введи число от 1 до 1000.';return;}tries++;
    if(g===secret){done=true;out.innerHTML=`<b>Угадал за ${tries} ${plural(tries,'попытку','попытки','попыток')}!</b> ${tries<=10?'Отлично — бинарный поиск в действии.':'Попробуй каждый раз называть середину оставшегося отрезка — хватит 10.'}`;}
    else out.innerHTML=`Попытка ${tries}: загаданное число <b>${secret>g?'больше':'меньше'}</b> ${g}.`;inp.select();};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')w.querySelector('#wg-go').click();});
  w.querySelector('#wg-new').onclick=()=>{secret=R(1,1000);tries=0;done=false;out.innerHTML='Загадано новое число.';inp.value='';};
  w.querySelector('#wg-pc').onclick=()=>{let l=1,r=1000,k=0;const log=[];while(l<=r){const m=Math.floor((l+r)/2);k++;if(m===secret){log.push(`${m} — угадал!`);break;}if(m<secret){log.push(`${m}? больше`);l=m+1;}else{log.push(`${m}? меньше`);r=m-1;}}
    done=true;out.innerHTML=`Компьютер искал ${secret}: ${log.join(' → ')}<br><b>${k} ${plural(k,'вопрос','вопроса','вопросов')}</b> (никогда не больше 10).`;};
}
function sortWidget(w){
  let mode='bubble',base=[],frames=[],pos=0,timer=null;
  w.innerHTML=`<div class="small"><b>Посмотри, как сортирует компьютер.</b> Жёлтым — сравниваемые элементы, зелёным — уже на своём месте.</div>
  <div class="row"><button class="btn sbtn" id="wsr-b">Пузырьком</button><button class="btn ghost sbtn" id="wsr-s">Выбором</button></div>
  <div id="wsr-svg"></div><div id="wsr-msg" class="small" style="min-height:2.6em"></div>
  <div class="row"><button class="btn sbtn" id="wsr-step">Шаг ▶</button><button class="btn ghost sbtn" id="wsr-auto">Авто ⏩</button><button class="btn ghost sbtn" id="wsr-mix">Перемешать</button></div>`;
  const sv=w.querySelector('#wsr-svg'),msg=w.querySelector('#wsr-msg'),bB=w.querySelector('#wsr-b'),bS=w.querySelector('#wsr-s');
  function build(){const a=base.slice();const n=a.length;frames=[];let cmp=0,sw=0;
    const F=(hi,done,m)=>frames.push({a:a.slice(),hi,done:done.slice(),m,cmp,sw});
    const done=[];F([],done,'Начало. Нажимай «Шаг».');
    if(mode==='bubble'){for(let p=0;p<n-1;p++){for(let j=0;j<n-1-p;j++){cmp++;if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];sw++;F([j,j+1],done,`${a[j+1]} &gt; ${a[j]} — меняем местами.`);}else F([j,j+1],done,`${a[j]} ≤ ${a[j+1]} — оставляем.`);}done.push(n-1-p);F([],done,`Проход ${p+1} закончен: ${a[n-1-p]} всплыл на своё место.`);}done.push(0);}
    else{for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){cmp++;F([m,j],done,`Ищем минимум с места ${i}: сравниваем ${a[m]} и ${a[j]}.`);if(a[j]<a[m])m=j;}if(m!==i){[a[i],a[m]]=[a[m],a[i]];sw++;}done.push(i);F([i],done,`Минимум ${a[i]} ставим на место ${i}.`);}done.push(n-1);}
    F([],done.concat(range(0,n-1)),`Готово! Сравнений: ${cmp}, обменов: ${sw}.`);pos=0;draw();}
  function draw(){const f=frames[pos];const n=f.a.length;const bw=34,gap=6,W=n*(bw+gap)+gap,Hh=150;
    let s=`<svg viewBox="0 0 ${W} ${Hh}" width="${Math.min(340,W)}" role="img" aria-label="Сортировка">`;
    f.a.forEach((v,i)=>{const h=v*11;const x=gap+i*(bw+gap);const hi=f.hi.includes(i),dn=f.done.includes(i);
      s+=`<rect x="${x}" y="${Hh-22-h}" width="${bw}" height="${h}" rx="4" fill="${hi?'var(--hl)':dn?'var(--ok,#2a9d5c)':'var(--accent)'}" fill-opacity="${hi?0.9:dn?0.55:0.35}" stroke="var(--fig)" stroke-width="${hi?2:1}"/>`;
      s+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${v}</text>`;});
    s+='</svg>';sv.innerHTML=s;msg.innerHTML=`${f.m}<br><span class="small">Сравнений: ${f.cmp} · обменов: ${f.sw}</span>`;}
  function mix(){base=shuffle(range(1,10)).slice(0,8);build();}
  function setMode(m){mode=m;bB.classList.toggle('ghost',m!=='bubble');bS.classList.toggle('ghost',m!=='sel');stop();build();}
  function stop(){if(timer){clearInterval(timer);timer=null;}}
  bB.onclick=()=>setMode('bubble');bS.onclick=()=>setMode('sel');
  w.querySelector('#wsr-step').onclick=()=>{stop();if(pos<frames.length-1)pos++;draw();};
  w.querySelector('#wsr-auto').onclick=()=>{if(timer){stop();return;}timer=setInterval(()=>{if(pos>=frames.length-1){stop();return;}pos++;draw();},350);};
  w.querySelector('#wsr-mix').onclick=()=>{stop();mix();};
  mix();
}
function onTheory(root){const g=root.querySelector('#w-guess');if(g)guessWidget(g);const s=root.querySelector('#w-sort');if(s)sortWidget(s);}

hint:'Это количество трёхзначных чисел с суммой цифр '+s+'. Перебери первую цифру a (1…9) и посчитай, сколькими способами b + c = '+s+' − a (b, c от 0 до 9).',

explain:`Программа перебирает все трёхзначные числа и считает те, у которых сумма цифр (сотни + десятки + единицы) равна ${s}.<br>Посчитаем по первой цифре a: нужно b + c = ${s} − a, где b, c от 0 до 9.<br>${range(1,9).map(a=>{const t=s-a;const w=t<0||t>18?0:(t<=9?t+1:19-t);return `a=${a}: b+c=${t} → ${w}`;}).join('; ')}.<br>Итого <b>${k}</b>.`,
explain2:`Число способов записать t = b + c с цифрами 0…9: t + 1 при t ≤ 9 и 19 − t при 9 &lt; t ≤ 18. Складываем по всем первым цифрам: ${k}.`};});
G(5,()=>{const n=R(5,25);const s=R(Math.floor(n/2)+2,n+3);let k=0;for(let x=1;x<=n;x++)for(let y=x+1;y<=n;y++)if(x+y===s)k++;

short:`Пары x &lt; y ≤ ${n} с суммой ${s}: ${k}.`,
explain:`Ищем пары 1 ≤ x &lt; y ≤ ${n} с x + y = ${s}. Для каждого x число y = ${s} − x определено однозначно; нужно x &lt; y и y ≤ ${n}.<br>Подходят: ${(()=>{const p=[];for(let x=1;x<=n;x++){const y=s-x;if(y>x&&y<=n)p.push(`(${x}, ${y})`);}return p.join(', ')||'нет';})()}.<br>Итого <b>${k}</b>.`,
explain2:`Перебор проверяет ${n*(n-1)/2} пар, но подходящих мало: x пробегает значения, пока x &lt; ${s} − x, т. е. x &lt; ${s/2}, и при этом ${s} − x ≤ ${n}.`};});

return {type:'choice',q:'Почему в решете Эратосфена кратные простого p вычёркивают, начиная с <b>p · p</b>?',...c,
short:'k·p при k &lt; p уже вычеркнуто числом k (или его простым делителем).',
explain:'Возьмём кратное k · p, где k &lt; p. У числа k есть простой делитель, меньший p, — и при его обработке k · p уже вычеркнули. Значит, первое «новое» кратное — p · p. Начинать с 2p тоже правильно, но это лишняя работа. А числа меньше p · p вполне могут делиться на p (например, 2p).',
explain2:'Пример, p = 5: 10 вычеркнули при p = 2, 15 — при p = 3, 20 — при p = 2. Первое, которое ещё не вычеркнуто, — 25 = 5 · 5.'};},RULE);

return {type:'choice',q:'Какие числа остаются невычеркнутыми после работы решета Эратосфена (от 2 до n)?',...c,
short:'Решето оставляет простые.',
explain:'Мы вычёркиваем все числа, у которых есть делитель-простое меньше их самих, — то есть все <b>составные</b>. Остаются числа без таких делителей — <b>простые</b>. Чётные (кроме 2) как раз вычёркиваются первыми.',

explain:`Вычёркивание кратных ${p} начинается с ${p} · ${p} = <b>${p*p}</b>. Меньшие кратные ${range(2,p-1).map(k=>k*p).join(', ')} уже вычеркнуты раньше как кратные меньших простых.`,

return {type:'code',q:'Дано n (1 ≤ n ≤ 100 000). Сколько простых чисел не больше n? Используй решето Эратосфена — оно справится быстро.',

solution:`n = int(input())\nis_p = [True] * (n + 1)\nis_p[0] = False\nif n >= 1:\n    is_p[1] = False\np = 2\nwhile p * p <= n:\n    if is_p[p]:\n        for k in range(p * p, n + 1, p):\n            is_p[k] = False\n    p += 1\nprint(sum(is_p))`,

explain2:'Проверка: до 10 — 4 простых (2, 3, 5, 7), до 100 — 25, до 1000 — 168, до 100 000 — 9592. Осторожно с n = 1: is_p = [True, True], оба надо пометить False, ответ 0.'};});

G(7,()=>{const N=pick([1000000000,1000000,100000000]);const k=guesses(N);
return {type:'num',q:`Бинарный поиск ищет число в отсортированном списке из ${N.toLocaleString('ru-RU')} элементов. Сколько сравнений с серединой понадобится в <b>худшем</b> случае (как в программе с <code>while left &lt;= right</code>)?`,ans:k,

explain:`За k шагов бинарный поиск различает до 2^k − 1 позиций. 2^${k-1} − 1 = ${(2**(k-1)-1).toLocaleString('ru-RU')} — мало, 2^${k} − 1 = ${(2**k-1).toLocaleString('ru-RU')} — достаточно. Ответ <b>${k}</b>. Запомни: 2¹⁰ ≈ 1000, поэтому миллион ≈ 2²⁰, миллиард ≈ 2³⁰.`,
explain2:`Каждые 10 шагов уменьшают область примерно в 1000 раз (2¹⁰ = 1024). Делим ${N.toLocaleString('ru-RU')} пополам, пока не останется 1, — получится ${k-1} делений, и ещё одно сравнение на последнем элементе: ${k}.`};},STAR);
G(7,()=>{const tests=[];const add=a=>{let cur=a[0],best=a[0];for(const x of a.slice(1)){cur=Math.max(x,cur+x);best=Math.max(best,cur);}tests.push(T(a.join(' '),best));};

solution:`a = list(map(int, input().split()))\ncur = a[0]\nbest = a[0]\nfor x in a[1:]:\n    cur = max(x, cur + x)\n    best = max(best, cur)\nprint(best)`,
hint:'cur — лучшая сумма отрезка, который заканчивается на текущем числе: max(x, cur + x).',
explain:'Можно перебрать все отрезки (≈ n² или n³ операций). Красивее — алгоритм Кадане за один проход: <code>cur</code> — лучшая сумма отрезка, <b>заканчивающегося</b> на текущем x. Либо продолжаем прошлый отрезок (<code>cur + x</code>), либо начинаем новый с x — что больше. <code>best</code> — рекорд за всё время.',
explain2:'Если все числа отрицательные (−3 −1 −2), ответ — самое большое из них (−1): отрезок должен быть непустым. Поэтому начальные значения — a[0], а не 0. Перебор пар (i, j) с суммой через sum(a[i:j+1]) тоже пройдёт тесты, но на 100 000 чисел будет считать вечность.'};},STAR);
G(7,()=>{const tests=[];const add=n=>{for(const p of primesTo(n))if(isPrime(n-p)){tests.push(T(String(n),`${p} ${n-p}`));return;}};
[4,6,10,28,98,R(50,500)*2,9998].forEach(add);
return {type:'code',q:'<b>Гипотеза Гольдбаха</b>: каждое чётное число n ≥ 4 — сумма двух простых. Дано чётное n (4 ≤ n ≤ 10 000). Выведи через пробел два простых p и q, p ≤ q, p + q = n, с <b>наименьшим</b> возможным p.',
starter:`n = int(input())\n`,tests,
solution:`def is_prime(x):\n    if x < 2:\n        return False\n    d = 2\n    while d * d <= x:\n        if x % d == 0:\n            return False\n        d += 1\n    return True\n\nn = int(input())\nfor p in range(2, n):\n    if is_prime(p) and is_prime(n - p):\n        print(p, n - p)\n        break`,
hint:'Перебирай p = 2, 3, 4, … и проверяй, простые ли p и n − p. Первый найденный — ответ.',
explain:'Перебор с функцией is_prime: идём p = 2, 3, … и проверяем <code>is_prime(p) and is_prime(n - p)</code>. Первая найденная пара — с наименьшим p, сразу <code>break</code>. Условие p ≤ q выполнится само: подходящее p всегда находится раньше середины.',
explain2:'Примеры: 4 = 2 + 2, 10 = 3 + 7 (не 5 + 5 — у 3 меньше p), 28 = 5 + 23. Гипотезу проверили компьютером для всех чисел до 4 · 10¹⁸, но доказать её математики не могут уже почти 300 лет (с 1742 года).'};},STAR);
G(7,()=>{const tests=[];const ways=n=>{let k=0;for(let c=0;5*c<=n;c++)for(let b=0;5*c+2*b<=n;b++)k++;return k;};
[1,2,5,10,0,100,R(20,80)].forEach(n=>tests.push(T(String(n),ways(n))));
return {type:'code',q:'Сколькими способами можно набрать сумму <b>n</b> рублей монетами 1, 2 и 5 рублей (0 ≤ n ≤ 100)? Способы, отличающиеся только порядком монет, считаются одинаковыми. Например, 5 рублей: 5; 2+2+1; 2+1+1+1; 1·5 — 4 способа.',
starter:`n = int(input())\n`,tests,
solution:`n = int(input())\nk = 0\nfor c in range(n // 5 + 1):\n    for b in range((n - 5 * c) // 2 + 1):\n        k += 1\nprint(k)`,
hint:'Переберём, сколько пятёрок c и сколько двушек b. Рубли добирают остаток — это всегда ровно один вариант.',
explain:'Способ однозначно задаётся количеством пятёрок c и двушек b — рублёвых монет будет n − 5c − 2b, лишь бы это было ≥ 0. Перебираем c от 0 до n // 5 и b от 0 до (n − 5c) // 2 и считаем варианты. Порядок монет не учитывается автоматически — мы же считаем количества, а не последовательности.',
explain2:'Можно и тремя циклами (a, b, c от 0 до n) с проверкой a + 2b + 5c == n — это честный перебор, медленнее, но для n ≤ 100 тоже успеет (≈ 10⁶ вариантов). n = 0 — один способ: не брать монет.'};},STAR);
